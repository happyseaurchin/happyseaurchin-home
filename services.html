<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Services</title>
<meta name="description" content="What the happyseaurchin beach offers for money — the beach service, consultancy, tickets, and founding supporters.">
<meta property="og:title" content="Services">
<meta property="og:description" content="The beach service for £10 a month, consultancy priced per job, a ticket to a world, your own ticket machine, and founding supporters.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Space+Mono:wght@400;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme.css">
<script src="/theme.js"></script>
<!-- /services — the page reads the `services` block at the beach and draws each
     offer as a card: the beach service beside consultancy, a ticket beside your
     own ticket, the founding supporters beneath. The words live in the block, so
     the offer changes without a deploy; the page holds only the layout and the
     icons. A line naming a ticket machine's /buy/<product> page becomes a
     "Choose →" that opens it: the machine asks what that product needs — a handle,
     a character, an email for a bank transfer — and checks the name. -->
<style>
  *{box-sizing:border-box} html,body{margin:0}
  body{font-family:var(--body);color:var(--foam);font-size:17.5px;line-height:1.58;
    background:radial-gradient(1100px 560px at 70% -10%, rgba(var(--liquid-rgb),0.10), transparent 60%),
      linear-gradient(180deg,var(--ground-top) 0%, var(--deep) 30%, var(--abyss) 100%);
    background-attachment:fixed;-webkit-font-smoothing:antialiased;min-height:100dvh}
  a{color:var(--liquid);text-decoration:none;border-bottom:1px solid rgba(var(--liquid-rgb),0.35)}
  a:hover{color:var(--foam);border-color:var(--foam)}
  .wrap{max-width:900px;margin:0 auto;padding:0 18px 80px}
  .bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 0 10px;
    font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:var(--vapour-dim)}
  .bar > span{flex:1}
  h1{font-family:var(--display);font-weight:800;font-size:clamp(1.6rem,6vw,2.3rem);line-height:1.1;margin:6px 0 10px}
  .lede{font-size:19px;margin:0 0 6px}
  .what{color:var(--vapour-dim);font-size:15.5px;margin:0 0 12px}
  p{margin:0 0 12px}
  .rows{margin:22px 0 0}
  .grid{display:grid;gap:14px;margin:0 0 14px}
  .grid.two{grid-template-columns:1fr 1fr}
  @media (max-width:680px){.grid.two{grid-template-columns:1fr}}
  .card{border:1px solid var(--line);border-radius:10px;padding:18px 18px 6px;
    background:rgba(var(--liquid-rgb),0.04);display:flex;flex-direction:column}
  .card__head{display:flex;gap:14px;align-items:flex-start;margin:0 0 8px}
  .icon{flex:none;width:38px;height:38px;color:var(--liquid)}
  .icon svg{width:100%;height:100%;display:block}
  .card h2{font-family:var(--display);font-weight:700;font-size:1.2rem;line-height:1.2;margin:4px 0 2px}
  .card .what{margin:0}
  .card p{font-size:15.5px}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:2px 0 14px}
  .tile{border:1px solid var(--line);border-radius:8px;padding:12px 12px 0;display:flex;flex-direction:column}
  .tile b{font-family:var(--display);font-size:1.15rem;line-height:1.25;margin:0 0 4px}
  .tile span{font-size:13.5px;color:var(--vapour-dim);flex:1;margin:0 0 10px}
  a.choose{display:inline-block;align-self:flex-start;border:1px solid var(--liquid);border-radius:4px;color:var(--liquid);
    font-family:var(--mono);font-size:13px;padding:7px 12px;margin:0 0 14px}
  a.choose:hover{color:var(--foam);border-color:var(--foam)}
  .absent{color:var(--vapour-dim);font-style:italic}
  .foot{font-family:var(--mono);font-size:11px;color:var(--vapour-dim);margin:44px 0 0;line-height:1.9}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar"><span>services</span></div>
  <h1>Services</h1>
  <div id="offer"><p class="absent">Reading the offer from the beach…</p></div>
  <p class="foot">The words above are the <a href="/render?beach=beach.happyseaurchin.com&amp;block=services">services</a> block at beach.happyseaurchin.com, read as the page opens. Payment is taken by Stripe; the beach keeps only the ticket.</p>
</div>
<script>
var BEACH = 'https://beach.happyseaurchin.com/.well-known/pscale-beach';
var BUY = /\s+—\s+(https?:\/\/\S+?\/buy\/[A-Za-z0-9_-]+)(?=[.,;]?(\s|$))/;

/* the layout — which branches share a row — and an icon for each. A branch the
   layout does not name still shows, a card of its own row, at the foot. */
var ROWS = [['1', '2'], ['5', '3'], ['4']];
var SVG = function(body){ return '<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + body + '</svg>'; };
var ICON = {
  '1': SVG('<path d="M3 11c3-3 6-3 9 0s6 3 9 0 5-3 8-1"/><path d="M3 17c3-3 6-3 9 0s6 3 9 0 5-3 8-1"/><path d="M3 23c3-3 6-3 9 0s6 3 9 0 5-3 8-1"/>'),
  '2': SVG('<circle cx="16" cy="16" r="12"/><path d="M20.5 11.5l-3 7-6 2.5 3-7z"/><circle cx="16" cy="16" r="0.8"/>'),
  '5': SVG('<path d="M4 9h24v5a2 2 0 0 0 0 4v5H4v-5a2 2 0 0 0 0-4z"/><path d="M11 20c2-3 5-5 10-6"/><path d="M13.5 18.4l-1.2-2.4M16.3 16.6l-.6-2.5M19 15.4l.1-2.4"/>'),
  '3': SVG('<circle cx="10.5" cy="16" r="5"/><path d="M15.5 16H28M24 16v4M27.5 16v3"/>'),
  '4': SVG('<circle cx="16" cy="16" r="5.5"/><path d="M23.5 16.0L29.0 16.0M22.5 19.8L27.3 22.5M19.8 22.5L22.5 27.3M16.0 23.5L16.0 29.0M12.3 22.5L9.5 27.3M9.5 19.8L4.7 22.5M8.5 16.0L3.0 16.0M9.5 12.3L4.7 9.5M12.2 9.5L9.5 4.7M16.0 8.5L16.0 3.0M19.8 9.5L22.5 4.7M22.5 12.2L27.3 9.5"/>')
};

function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
/* web links open; a room named pool:<name> opens that person's page, parlour at its
   foot; a list named sed:<name> or seats:<name> opens on the render view */
function prose(t){
  return esc(t).replace(/(https?:\/\/[^\s<"']*[^\s<.,;:)'"])|\bpool:([A-Za-z0-9_-]+)|\b((?:sed|seats):[A-Za-z0-9_-]+)/g, function(m, url, room, list){
    if (url) return '<a href="' + url + '" target="_blank" rel="noopener">' + label(url) + '</a>';
    if (room) return '<a href="/page/' + room + '">pool:' + room + '</a>';
    return '<a href="/render?beach=beach.happyseaurchin.com&amp;block=' + encodeURIComponent(list) + '">' + list + '</a>';
  });
}
/* a link reads as where it goes: the address without its scheme, or just the
   site when the address runs long (a sign-in link, a token) */
function label(url){
  var bare = url.replace(/^https?:\/\//, '');
  return bare.length <= 44 ? bare : bare.split('/')[0] + '/…';
}
function text(n){ return typeof n === 'string' ? n : (n && typeof n._ === 'string' ? n._ : ''); }
function kids(n){ return n && typeof n === 'object' ? '123456789'.split('').filter(function(d){ return n[d] !== undefined; }) : []; }
function upper(s){ return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
function choose(url){ return '<a class="choose" href="' + esc(url) + '">Choose →</a>'; }

function card(b, d){
  var head = text(b[d]), dash = head.indexOf(' — ');
  var html = '<article class="card"><div class="card__head"><span class="icon">' + (ICON[d] || '') + '</span><div>' +
    '<h2>' + esc(dash > 0 ? head.slice(0, dash) : head) + '</h2>' +
    (dash > 0 ? '<p class="what">' + prose(upper(head.slice(dash + 3))) + '</p>' : '') + '</div></div>';
  var lines = kids(b[d]).map(function(k){ return text(b[d][k]); });
  var buys = lines.filter(function(l){ return BUY.test(l); }).length;
  var tiles = '';
  lines.forEach(function(line){
    var m = BUY.exec(line);
    if (!m) { if (tiles) { html += '<div class="tiles">' + tiles + '</div>'; tiles = ''; } html += '<p>' + prose(line) + '</p>'; return; }
    var rest = line.replace(BUY, '');
    if (buys < 2) { html += '<p>' + prose(rest) + '</p>' + choose(m[1]); return; }
    var cut = rest.indexOf(' — ');
    tiles += '<div class="tile"><b>' + esc(cut > 0 ? rest.slice(0, cut) : rest) + '</b>' +
      (cut > 0 ? '<span>' + prose(upper(rest.slice(cut + 3))) + '</span>' : '<span></span>') + choose(m[1]) + '</div>';
  });
  if (tiles) html += '<div class="tiles">' + tiles + '</div>';
  return html + '</article>';
}

function draw(b){
  var root = text(b), cut = root.indexOf('. ');
  var html = '<p class="lede">' + prose(cut > 0 ? root.slice(0, cut + 1) : root) + '</p>' +
             (cut > 0 ? '<p class="what">' + prose(root.slice(cut + 2)) + '</p>' : '');
  var seen = {}, rows = '';
  ROWS.concat(kids(b).filter(function(d){ return !ROWS.some(function(r){ return r.indexOf(d) >= 0; }); }).map(function(d){ return [d]; }))
    .forEach(function(row){
      var here = row.filter(function(d){ return b[d] !== undefined && !seen[d]; });
      if (!here.length) return;
      here.forEach(function(d){ seen[d] = 1; });
      rows += '<div class="grid' + (here.length > 1 ? ' two' : '') + '">' + here.map(function(d){ return card(b, d); }).join('') + '</div>';
    });
  document.getElementById('offer').innerHTML = html + '<div class="rows">' + rows + '</div>';
}

fetch(BEACH + '?block=services', { cache: 'no-store' })
  .then(function(r){ return r.ok ? r.json() : Promise.reject(new Error('status ' + r.status)); })
  .then(draw)
  .catch(function(){
    document.getElementById('offer').innerHTML =
      '<p class="absent">The beach did not answer just now. The offer stands at <a href="/render?beach=beach.happyseaurchin.com&amp;block=services">the services block</a>.</p>';
  });
if (window.siteDoors) siteDoors({ here: 'services', site: true });
</script>
</body>
</html>
