<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Where everyone is</title>
<meta name="description" content="One glance at a shared field: who is here right now, where the voices stand, what was said lately — tap any part to go there.">
<meta property="og:title" content="Where everyone is">
<meta property="og:description" content="The social glance at a shared field — live presence, standing voices, recent talk, all on one dial.">

<style>
  *{box-sizing:border-box} html,body{margin:0}
  body{
    font-family:var(--body); color:var(--foam); font-size:17.5px; line-height:1.58;
    background:radial-gradient(1100px 560px at 70% -10%, rgba(var(--liquid-rgb),0.10), transparent 60%),
      linear-gradient(180deg,var(--ground-top) 0%, var(--deep) 30%, var(--abyss) 100%);
    background-attachment:fixed; -webkit-font-smoothing:antialiased;
    min-height:100dvh;
  }
  ::selection{background:rgba(var(--liquid-rgb),0.30);color:var(--foam)}
  a{color:var(--liquid);text-decoration:none;border-bottom:1px solid rgba(var(--liquid-rgb),0.35)}
  a:hover{color:var(--foam);border-color:var(--foam)}
  .hidden{display:none !important}
  .wrap{max-width:680px;margin:0 auto;padding:0 18px}

  .bar{display:flex;align-items:center;gap:10px;padding:14px 18px 10px;font-family:var(--mono);font-size:12px;letter-spacing:0.08em;color:var(--vapour-dim);max-width:680px;margin:0 auto}
  .bar .dot{width:6px;height:6px;border-radius:50%;background:var(--liquid);box-shadow:0 0 10px var(--liquid);flex:none}
  .bar b{color:var(--foam)}
  .bar a{border-bottom:none;color:var(--vapour-dim)} .bar a:hover{color:var(--liquid)}
  .bar .spacer{flex:1}

  .head{padding:8px 0 0}
  .head h1{font-family:var(--display);font-weight:800;font-size:clamp(1.35rem,5vw,1.9rem);line-height:1.12;margin:0 0 8px}
  .head h1 .cool{color:var(--liquid)}
  .meta{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--mono);font-size:11.5px;letter-spacing:0.06em;color:var(--vapour-dim);margin:0 0 4px}
  .meta b{color:var(--liquid);font-weight:700}

  /* the live strip — people first, colour second */
  .eve{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0 4px;min-height:30px}
  .eve .lab{font-family:var(--mono);font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--vapour-dim)}
  .pchip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;
    padding:4px 12px 4px 6px;font-family:var(--mono);font-size:12px;color:var(--foam);cursor:pointer;background:rgba(var(--card-rgb),0.5)}
  .pchip:hover{border-color:var(--liquid)}
  .pchip .pdot{width:18px;height:18px;border-radius:50%;background:var(--solid);color:var(--abyss);
    display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:10.5px;text-transform:uppercase}
  .pchip .at{color:var(--vapour-dim)}
  .pchip.dim{opacity:0.62}
  .pchip.dim .pdot{animation:none}
  .eve .quiet{font-family:var(--mono);font-size:12px;color:var(--vapour-dim);font-style:normal}

  /* the dial — on its own card, so the face reads in both themes */
  #dialbox{position:relative;margin:10px auto 0;max-width:600px;
    background:linear-gradient(165deg,rgba(var(--card-hi-rgb),0.55) 0%,rgba(var(--card-rgb),0.55) 100%);
    border:1px solid var(--line);border-radius:16px;padding:10px}
  #dial{display:block;width:100%;height:auto;background:transparent}
  .cell{cursor:pointer;stroke:var(--line);stroke-width:1;transition:opacity .2s}
  .cell:hover{stroke:var(--liquid)}
  .cell.spoken{stroke:var(--line-strong)}
  .cell.sel{stroke:var(--foam);stroke-width:1.6}
  .clab{font-family:var(--mono);font-size:10.5px;fill:var(--vapour);pointer-events:none}
  .clab.dim{fill:var(--vapour-dim)}
  .ccount{font-family:var(--mono);font-size:9.5px;fill:var(--liquid);pointer-events:none}
  .centre{cursor:pointer}
  .centre circle{fill:rgba(var(--card-hi-rgb),0.55);stroke:var(--line-strong)}
  .centre:hover circle{stroke:var(--liquid)}
  .centre .big{font-family:var(--display);font-weight:700;font-size:20px;fill:var(--foam)}
  .centre .small{font-family:var(--mono);font-size:10px;fill:var(--vapour-dim)}
  .hand{stroke:var(--foam);stroke-width:1.2;opacity:0.55;pointer-events:none}
  .handdot{fill:var(--foam);opacity:0.8;pointer-events:none}
  .handlab{font-family:var(--mono);font-size:10px;fill:var(--foam);opacity:0.8;pointer-events:none}
  .chip{pointer-events:none}
  .chip circle{fill:var(--solid);stroke:var(--abyss);stroke-width:1}
  .chip text{font-family:var(--mono);font-size:9.5px;font-weight:700;fill:var(--abyss);text-transform:uppercase}
  .talktick{stroke:var(--solid);stroke-width:3;fill:none;opacity:0.85;pointer-events:none}
  .talktick.old{opacity:0.35}

  /* the focused part */
  .panel{background:linear-gradient(165deg,rgba(var(--card-hi-rgb),0.55) 0%,rgba(var(--card-rgb),0.55) 100%);
    border:1px solid var(--line);border-radius:14px;padding:18px 20px 16px;margin:14px 0}
  .panel .paddr{font-family:var(--mono);font-size:11px;color:var(--vapour-dim);display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin:0 0 8px}
  .panel .paddr b{color:var(--solid);font-weight:700;font-size:13px}
  .panel .paddr .work{margin-left:auto}
  .panel .ptext{font-size:1.08rem;line-height:1.5;margin:0 0 4px}
  .panel .ptext.absent{color:var(--vapour-dim);font-style:italic}
  .vline{display:flex;gap:10px;align-items:baseline;padding:8px 2px;border-top:1px solid var(--line)}
  .vline:first-of-type{border-top:none}
  .vline .who{font-family:var(--mono);font-size:11px;color:var(--solid);flex:none;min-width:72px}
  .vline .whereat{font-family:var(--mono);font-size:10.5px;color:var(--vapour-dim);flex:none}
  .vline p{margin:0;font-size:0.98rem;line-height:1.45}
  .vline .ago{font-family:var(--mono);font-size:10px;color:var(--vapour-dim);flex:none;margin-left:auto}
  .subhead{font-family:var(--mono);font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--liquid);margin:14px 0 4px}
  .plinks{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;font-family:var(--mono);font-size:12px}
  .plinks a,.plinks button{border:1px solid var(--line);border-radius:6px;padding:7px 12px;color:var(--vapour);background:none;
    font-family:var(--mono);font-size:12px;cursor:pointer;border-bottom-width:1px}
  .plinks a:hover,.plinks button:hover{border-color:var(--liquid);color:var(--foam)}

  .whisper{font-family:var(--mono);font-size:11.5px;color:var(--vapour-dim);margin:10px 0 0;line-height:1.6}
  .whisper a{color:var(--vapour-dim)} .whisper a:hover{color:var(--liquid)}
  #err{font-family:var(--mono);font-size:12px;color:var(--solid);margin:12px 0}
</style>
</head>
<body>
<div class="bar">
  <span class="dot"></span>
  <span>where · <b id="b-fam">—</b></span>
  <span class="spacer"></span>
  <a id="b-reread" role="button" tabindex="0" title="read the beach again — this page never polls">↻ re-read</a>
  <a id="b-walk" target="_blank" rel="noopener">walk ↗</a>
  <a id="b-mirror" target="_blank" rel="noopener">mirror ↗</a>
</div>
<div class="wrap">
  <div class="head">
    <h1>Where <span class="cool">everyone</span> is</h1>
    <p class="meta"><span id="m-fam">—</span> · <span id="m-mode">—</span> · <b id="m-live">—</b></p>
  </div>

  <div class="eve" id="eve"><span class="lab">live now</span><span class="quiet">looking…</span></div>

  <div id="dialbox"><svg id="dial" viewBox="0 0 640 640" role="img" aria-label="the field as a dial — tap a part to look at it"></svg></div>

  <div class="panel hidden" id="panel"></div>
  <p id="err" class="hidden"></p>
  <p class="whisper" id="wh"></p>
</div>

<noscript><p style="text-align:center;font-family:monospace;padding:30px">This glance is drawn live from the beach and needs JavaScript. The same field can be read plainly at <a href="/walk">/walk</a>.</p></noscript>

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   /where — the social glance at one shared field.

   ONE DIAL, TWO GEOMETRIES, read off the family itself: a floor-10 spine is
   the shared clock and draws as a SUNDIAL (the period's parts around the
   face, a hand through now); any other spine draws as a SUNBURST (the root's
   branches, each ring a step deeper). Same warmth on both:

     · fill        — standing voices beneath that part (every hand's mirror,
                     rolled up by address prefix; deeper activity glows
                     through coarser parts, which is what zooming out means)
     · rim tick    — room talk lately (the family's pool, when it has one)
     · chip        — a person HERE RIGHT NOW (presence, named, tap to meet)

   The page STORES NOTHING and decides nothing: it reads the spine, the
   mirrors, the pool and presence — the same blocks every other door reads —
   and lays them on one face. Tap a part to read it; tap again (or "step in")
   to make it the centre; tap the centre to step back out. Every part links
   into the mirror at its own address.

   Presence is only written when the visitor ARRIVES AS SOMEBODY —
   /where/<family>/<handle> — never for a nameless reader.
   ═══════════════════════════════════════════════════════════════════════════ */

const BEACH = 'https://beach.happyseaurchin.com/.well-known/pscale-beach';

/* ── the same tiny beach client every o-page speaks ── */
async function readBlock(name){
  const r = await fetch(BEACH + '?block=' + encodeURIComponent(name), { headers:{Accept:'application/json'}, cache:'no-store' });
  if (r.status === 404) return null;
  if (!r.ok) throw new Error('beach read failed: ' + r.status);
  return r.json();
}
async function readIndex(){
  const r = await fetch(BEACH, { headers:{Accept:'application/json'}, cache:'no-store' });
  if (!r.ok) throw new Error('beach index failed: ' + r.status);
  return r.json();
}

/* ── pscale walking (walk.html's dialect, verbatim) ── */
function floorOf(block){
  let n = 0, node = block;
  while (node && typeof node === 'object' && ('_' in node)) { node = node['_']; n += 1; }
  return n;
}
function voice(node){
  let n = node;
  while (n && typeof n === 'object') { if (!('_' in n)) return null; n = n['_']; }
  return typeof n === 'string' ? n : null;
}
function childDigits(node){
  if (!node || typeof node !== 'object') return [];
  return Object.keys(node).filter(k => /^[1-9]$/.test(k)).sort();
}
function walkZeroAware(block, addr){
  let n = block;
  for (const ch of String(addr).replace(/0+$/, '')){
    if (!n || typeof n !== 'object') return undefined;
    n = (ch === '0') ? n['_'] : n[ch];
  }
  return n;
}
function textAt(block, addr){
  const n = walkZeroAware(block, addr);
  if (n === undefined || n === null) return null;
  if (typeof n === 'string') return n.trim() || null;
  return voice(n);
}
const esc = s => { const d = document.createElement('span'); d.textContent = s == null ? '' : s; return d.innerHTML; };
const short = (s, n) => { s = s || ''; return s.length > n ? s.slice(0, n).replace(/\s+\S*$/, '') + ' …' : s; };
const strip0 = a => String(a).replace(/0+$/, '');
const pad10 = a => String(a).padEnd(10, '0');
function ago(ts){ const t = Date.parse(ts); if (!Number.isFinite(t)) return '';
  const s = Math.max(0, (Date.now() - t) / 1000);
  if (s < 90) return 'now';
  if (s < 5400) return Math.round(s / 60) + 'm ago';
  if (s < 129600) return Math.round(s / 3600) + 'h ago';
  return Math.round(s / 86400) + 'd ago'; }

/* ── the sundial arithmetic (walk.html's, verbatim) ── */
function yearAddr(y){ return String(y); }
function monthAddr(y, m0){ return String(y) + (Math.floor(m0 / 3) + 1) + (m0 % 3 + 1); }
function weekAddr(y, m0, band){ return monthAddr(y, m0) + band; }
function dayAddr(y, m0, d){ return weekAddr(y, m0, Math.floor((d - 1) / 7) + 1) + ((d - 1) % 7 + 1); }
const daysInMonth = (y, m0) => new Date(Date.UTC(y, m0 + 1, 0)).getUTCDate();
const bandsIn = (y, m0) => Math.ceil(daysInMonth(y, m0) / 7);
const MN = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const wd = (y, m0, d) => new Date(Date.UTC(y, m0, d)).toUTCString().slice(0, 3);
const DAY_PARTS = ['deep night','dawn','early morning','morning','midday','afternoon','late afternoon','evening','night'];

/* now, to the beat — /now's own arithmetic */
function nowAddr(){
  const t = new Date();
  const y = t.getUTCFullYear(), m0 = t.getUTCMonth(), d = t.getUTCDate();
  const secs = t.getUTCHours() * 3600 + t.getUTCMinutes() * 60 + t.getUTCSeconds();
  const gath = Math.min(9, Math.floor(secs / (86400 / 9)) + 1);
  const beat = Math.min(9, Math.floor((secs - (gath - 1) * (86400 / 9)) / (86400 / 81)) + 1);
  return dayAddr(y, m0, d) + gath + beat;
}

/* ── state ── */
const _q = new URLSearchParams(location.search);
const _m = location.pathname.match(/\/where\/([^\/]+)(?:\/([^\/]+))?\/?$/);
const FAMILY = (((_m && decodeURIComponent(_m[1])) || _q.get('f') || 'now').replace(/[^a-z0-9-]/gi, '')) || 'now';
const HANDLE = (((_m && _m[2] && decodeURIComponent(_m[2])) || _q.get('h') || '').replace(/[^a-z0-9 _-]/gi, '').trim()) || null;

let SPINE = null, MODE = 'tree';
let MIRRORS = [];                 /* [handle, block] */
let OCC = [];                     /* {who, addr} — every standing voicing, addr stripped */
let TALK = [];                    /* {who, t, ts, at} — pool voices, newest first */
let PRESENT = [];                 /* {who, place, ts, at} — fresh only */
let CENTRE = '';                  /* the part the dial is grown from */
let FOCUS = null;                 /* the tapped part */
let NOW10 = nowAddr();

const $ = id => document.getElementById(id);
const mirrorUrl = (addr, block) => 'https://mirror.onen.ai/?block=' +
  encodeURIComponent(block || ('spine:' + FAMILY)) + (addr ? '&at=' + (MODE === 'clock' ? pad10(addr) : String(addr)) : '');

/* ── rungs and parts ─────────────────────────────────────────────────────────
   Clock parts are generated from the CALENDAR, never from the data — an empty
   month is still a month. Tree parts are the union of everywhere anything
   stands: the spine's branches plus every address any mirror voices, so a
   voice at a branch the spine never wrote still shows. ── */
function clockLabel(addr){
  const a = String(addr), L = a.length;
  if (L <= 1) return 'the ' + a + '000s';
  if (L === 2) return a + '00s';
  if (L === 3) return 'the ' + a + '0s';
  if (L === 4) return a;
  if (L === 5) return ['','first quarter','second quarter','third quarter','last quarter'][+a[4]] + ' ' + a.slice(0,4);
  if (L === 6){ const m0 = (+a[4] - 1) * 3 + (+a[5] - 1); return MN[m0] + ' ' + a.slice(0,4); }
  if (L === 7){ const m0 = (+a[4] - 1) * 3 + (+a[5] - 1), b = +a[6], y = +a.slice(0,4);
    const d1 = (b - 1) * 7 + 1, d2 = Math.min(b * 7, daysInMonth(y, m0));
    return d1 + '–' + d2 + ' ' + MN[m0].slice(0,3); }
  if (L === 8){ const m0 = (+a[4] - 1) * 3 + (+a[5] - 1), b = +a[6], y = +a.slice(0,4);
    const d = (b - 1) * 7 + (+a[7]); return wd(y, m0, d) + ' ' + d + ' ' + MN[m0].slice(0,3); }
  if (L === 9) return DAY_PARTS[+a[8] - 1];
  return 'beat ' + a[9];
}
function clockKids(addr){
  const a = String(addr), L = a.length;
  if (L === 0) return [];
  if (L <= 3) return '0123456789'.split('').map(d => a + d);            /* centuries · decades · years */
  if (L === 4){ const out = []; for (let m0 = 0; m0 < 12; m0++) out.push(monthAddr(+a, m0)); return out; }
  if (L === 5) return [];                                               /* quarters are spoken, not drawn */
  if (L === 6){ const y = +a.slice(0,4), m0 = (+a[4] - 1) * 3 + (+a[5] - 1);
    const out = []; for (let b = 1; b <= bandsIn(y, m0); b++) out.push(a + b); return out; }
  if (L === 7){ const y = +a.slice(0,4), m0 = (+a[4] - 1) * 3 + (+a[5] - 1), b = +a[6];
    const n = Math.min(b * 7, daysInMonth(y, m0)) - (b - 1) * 7;
    const out = []; for (let d = 1; d <= n; d++) out.push(a + d); return out; }
  if (L <= 9) return '123456789'.split('').map(d => a + d);             /* day parts · beats */
  return [];
}
function treeKids(addr){
  const set = new Set(childDigits(walkZeroAware(SPINE, addr) || null).map(d => addr + d));
  OCC.forEach(o => { if (o.addr.length > addr.length && o.addr.startsWith(addr)) set.add(o.addr.slice(0, addr.length + 1)); });
  TALK.forEach(v => { const at = strip0(v.at || ''); if (at && at.length > addr.length && at.startsWith(addr)) set.add(at.slice(0, addr.length + 1)); });
  return [...set].filter(k => /[1-9]$/.test(k)).sort();
}
const kidsOf = addr => MODE === 'clock' ? clockKids(addr) : treeKids(addr);
function labelFor(addr){
  if (MODE === 'clock') return clockLabel(addr);
  if (!addr) return FAMILY;
  const t = textAt(SPINE, addr);
  return t ? short(t, 30) : '· ' + addr.slice(-1);
}

/* ── warmth — everything rolls up by address prefix ── */
const voicesUnder  = addr => OCC.filter(o => o.addr === addr || (!addr || o.addr.startsWith(addr)));
const talkUnder    = (addr, hours) => TALK.filter(v => { const at = strip0(v.at || '');
  const t = Date.parse(v.ts); return at && (!addr || at.startsWith(addr)) && Number.isFinite(t) && (Date.now() - t) < hours * 3600e3; });
const presentUnder = addr => PRESENT.filter(p => { const at = strip0(p.at || '');
  return !addr || (at && at.startsWith(addr)); });

/* ── the dial ─────────────────────────────────────────────────────────────
   Layout and rendering are separated so the zoom can MOVE: a layout places
   cells in fractions of the full turn [0,1) at their TRUE calendar (or
   branch) positions, and a render maps those fractions through a WINDOW.
   At rest the window is the whole face. Stepping in tweens the window from
   the tapped part's own arc out to the whole face — the sector swells to
   become the dial, which is the motion the good sunbursts have — and
   stepping out runs it backwards. No library: we own the geometry, so the
   tween is forty lines. ── */
const CX = 320, CY = 320, R_IN = 84, RING_W = 58, RING_GAP = 7, PAD = 0.0012;
const R_OUT = R_IN + 2 * RING_GAP + 2 * RING_W;
const REST = { f0: 0, f1: 1, r0: R_IN, r1: R_OUT };
let CELLS = [];
let TWEENING = false;
function arcPath(r0, r1, a0, a1){
  const large = (a1 - a0) > Math.PI ? 1 : 0;
  const p = (r, a) => (CX + r * Math.cos(a)).toFixed(2) + ' ' + (CY + r * Math.sin(a)).toFixed(2);
  return 'M' + p(r1, a0) + 'A' + r1 + ' ' + r1 + ' 0 ' + large + ' 1 ' + p(r1, a1) +
         'L' + p(r0, a1) + 'A' + r0 + ' ' + r0 + ' 0 ' + large + ' 0 ' + p(r0, a0) + 'Z';
}
/* a part is WARM when anything social stands beneath it */
const warm = addr => voicesUnder(addr).length > 0 || talkUnder(addr, 48).length > 0 || presentUnder(addr).length > 0;
const onNowPath = addr => MODE === 'clock' && NOW10.startsWith(addr);
function layoutFor(centre){
  const cells = [];
  const g1 = kidsOf(centre);
  g1.forEach((a1addr, i) => {
    const f0 = i / g1.length, f1 = (i + 1) / g1.length;
    cells.push({ addr: a1addr, gen: 1, f0, f1, r0: R_IN + RING_GAP, r1: R_IN + RING_GAP + RING_W });
    const g2 = kidsOf(a1addr);
    g2.forEach((a2addr, j) => {
      /* positional fractions among ALL siblings — an omitted quiet sliver
       * leaves its gap, so the outer ring reads as signal, not texture */
      if (MODE === 'clock' && !warm(a2addr) && !onNowPath(a1addr)) return;
      cells.push({ addr: a2addr, gen: 2,
        f0: f0 + (f1 - f0) * j / g2.length, f1: f0 + (f1 - f0) * (j + 1) / g2.length,
        r0: R_IN + 2 * RING_GAP + RING_W, r1: R_OUT });
    });
  });
  return cells;
}
/* map a cell through a window — the whole tween is this one function */
function geom(c, w){
  const F0 = w.f0 + c.f0 * (w.f1 - w.f0), F1 = w.f0 + c.f1 * (w.f1 - w.f0);
  const s = (w.r1 - w.r0) / (R_OUT - R_IN);
  return { a0: -Math.PI / 2 + (F0 + PAD) * 2 * Math.PI, a1: -Math.PI / 2 + (Math.max(F0 + PAD, F1 - PAD)) * 2 * Math.PI,
           r0: w.r0 + (c.r0 - R_IN) * s, r1: w.r0 + (c.r1 - R_IN) * s };
}
const cellFill = addr => { const vs = voicesUnder(addr).length;
  return vs ? 'rgba(var(--liquid-rgb),' + Math.min(0.12 + 0.11 * Math.log2(1 + vs), 0.55).toFixed(2) + ')' : 'rgba(var(--card-rgb),0.25)'; };
function arcsOnly(cells, w, alpha){
  const parts = cells.map(c => { const g = geom(c, w);
    return g.a1 > g.a0 ? '<path d="' + arcPath(g.r0, g.r1, g.a0, g.a1) + '" fill="' + cellFill(c.addr) + '" stroke="var(--line)" stroke-width="1"/>' : ''; });
  return '<g opacity="' + alpha.toFixed(2) + '">' + parts.join('') + '</g>';
}
const EASE = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
function animateStep(dir, pivotAddr, nextCentre){
  const oldCells = CELLS;
  CENTRE = nextCentre; FOCUS = null;
  CELLS = layoutFor(CENTRE);
  const pv = (dir === 'in' ? oldCells : CELLS).find(c => c.addr === pivotAddr);
  /* a hidden tab gets no animation frames — draw the destination and be done */
  if (!pv || !oldCells.length || document.hidden){ drawDial(); drawPanel(); return; }
  TWEENING = true;
  const svg = $('dial'), t0 = performance.now(), DUR = 520;
  /* animation frames are not guaranteed (throttled tabs) — land regardless */
  setTimeout(() => { if (TWEENING){ TWEENING = false; drawDial(); drawPanel(); } }, DUR + 250);
  const frame = tn => {
    const e = EASE(Math.min(1, (tn - t0) / DUR));
    if (dir === 'in'){
      /* the tapped part's arc grows into the whole face; the old face falls away */
      const w = { f0: pv.f0 * (1 - e), f1: pv.f1 + (1 - pv.f1) * e,
                  r0: pv.r0 + (R_IN - pv.r0) * e, r1: pv.r1 + (R_OUT - pv.r1) * e };
      svg.innerHTML = arcsOnly(oldCells, REST, (1 - e) * 0.85) + arcsOnly(CELLS, w, 0.3 + 0.7 * e);
    } else {
      /* the whole face shrinks back into the part it came from, over the wider view */
      const w = { f0: pv.f0 * e, f1: 1 + (pv.f1 - 1) * e,
                  r0: R_IN + (pv.r0 - R_IN) * e, r1: R_OUT + (pv.r1 - R_OUT) * e };
      svg.innerHTML = arcsOnly(CELLS, REST, 0.3 + 0.7 * e) + arcsOnly(oldCells, w, (1 - e) * 0.85);
    }
    if (e < 1) requestAnimationFrame(frame);
    else { TWEENING = false; drawDial(); drawPanel(); }
  };
  requestAnimationFrame(frame);
}
function drawDial(){
  const svg = $('dial');
  CELLS = layoutFor(CENTRE);
  const out = [];
  const fmtN = n => n > 99 ? '99+' : String(n);

  CELLS.forEach(c => {
    const g = geom(c, REST);
    const vs = voicesUnder(c.addr).length;
    const spoken = !!textAt(SPINE, c.addr) || OCC.some(o => o.addr === c.addr);
    const mid = (g.a0 + g.a1) / 2, rm = (g.r0 + g.r1) / 2;
    const wpx = (g.a1 - g.a0) * rm;
    const sel = FOCUS === c.addr;
    out.push('<path class="cell' + (spoken ? ' spoken' : '') + (sel ? ' sel' : '') + '" d="' + arcPath(g.r0, g.r1, g.a0, g.a1) +
      '" fill="' + cellFill(c.addr) +
      '" data-addr="' + c.addr + '" role="button" tabindex="0" aria-label="' + esc(labelFor(c.addr)) + (vs ? ', ' + vs + ' voices' : '') + '">' +
      '<title>' + esc(labelFor(c.addr)) + (vs ? ' — ' + vs + (vs === 1 ? ' voice' : ' voices') : ' — quiet') + '</title></path>');
    const lx = CX + rm * Math.cos(mid), ly = CY + rm * Math.sin(mid);
    if (wpx > 46) out.push('<text class="clab' + (spoken || vs ? '' : ' dim') + '" x="' + lx.toFixed(1) + '" y="' + (ly - (vs ? 4 : 0)).toFixed(1) +
      '" text-anchor="middle" dominant-baseline="middle">' + esc(MODE === 'clock' ? shortClockLab(c.addr) : short(labelFor(c.addr), 12)) + '</text>');
    if (vs && wpx > 26) out.push('<text class="ccount" x="' + lx.toFixed(1) + '" y="' + (ly + 11).toFixed(1) +
      '" text-anchor="middle" dominant-baseline="middle">' + fmtN(vs) + (wpx > 60 ? (vs === 1 ? ' voice' : ' voices') : '') + '</text>');
    const t6 = talkUnder(c.addr, 6).length, t48 = talkUnder(c.addr, 48).length;
    if (t48){ const tw = Math.min((g.a1 - g.a0) * 0.7, 0.12);
      out.push('<path class="talktick' + (t6 ? '' : ' old') + '" d="' + rimTick(g.r1 + 3, mid, tw) + '"><title>' + t48 + ' said here lately</title></path>'); }
  });

  /* the hand — now, on a clock family, when now falls inside the view */
  if (MODE === 'clock'){
    NOW10 = nowAddr();
    const cell = deepestCellFor(CELLS, NOW10);
    if (cell){
      const g = geom(cell, REST);
      const mid = (g.a0 + g.a1) / 2, rEnd = R_OUT + 12;
      out.push('<line class="hand" x1="' + CX + '" y1="' + CY + '" x2="' + (CX + rEnd * Math.cos(mid)).toFixed(1) + '" y2="' + (CY + rEnd * Math.sin(mid)).toFixed(1) + '"/>');
      out.push('<circle class="handdot" r="3.2" cx="' + (CX + rEnd * Math.cos(mid)).toFixed(1) + '" cy="' + (CY + rEnd * Math.sin(mid)).toFixed(1) + '"/>');
      out.push('<text class="handlab" x="' + (CX + (rEnd + 12) * Math.cos(mid)).toFixed(1) + '" y="' + (CY + (rEnd + 12) * Math.sin(mid)).toFixed(1) +
        '" text-anchor="middle" dominant-baseline="middle">now</text>');
    }
  }

  /* the people — one chip each, on the deepest drawn part that holds them;
   * bright when live this minute, faded when merely recent */
  const byCell = new Map();
  PRESENT.forEach(p => {
    const cell = deepestCellFor(CELLS, strip0(p.at || '') || CENTRE);
    const key = cell ? cell.addr : '·centre';
    if (!byCell.has(key)) byCell.set(key, { cell, ps: [] });
    byCell.get(key).ps.push(p);
  });
  byCell.forEach(({ cell, ps }) => {
    const g = cell ? geom(cell, REST) : null;
    const mid = g ? (g.a0 + g.a1) / 2 : -Math.PI / 2;
    const rm = g ? (g.r0 + g.r1) / 2 + 14 : 0;
    const bx = g ? CX + rm * Math.cos(mid) : CX, by = g ? CY + rm * Math.sin(mid) : CY - R_IN * 0.55;
    ps.slice(0, 4).forEach((p, i) => {
      const x = bx + (i - (Math.min(ps.length, 4) - 1) / 2) * 17;
      const live = p.fresh;
      out.push('<g class="chip"' + (live ? '' : ' opacity="0.5"') + '><circle r="9.5" cx="' + x.toFixed(1) + '" cy="' + by.toFixed(1) + '">' +
        (live ? '<animate attributeName="r" values="9.5;10.5;9.5" dur="2.6s" repeatCount="indefinite"/>' : '') + '</circle>' +
        '<text x="' + x.toFixed(1) + '" y="' + (by + 0.5).toFixed(1) + '" text-anchor="middle" dominant-baseline="middle">' + esc(p.who.slice(0, 2)) + '</text>' +
        '<title>' + esc(p.who) + (live ? ' — here right now' : ' — here ' + ago(p.ts)) + '</title></g>');
    });
    if (ps.length > 4) out.push('<text class="ccount" x="' + bx.toFixed(1) + '" y="' + (by + 16).toFixed(1) + '" text-anchor="middle">+' + (ps.length - 4) + '</text>');
  });

  /* the centre — where the dial is grown from; tap to step back out */
  const cvs = voicesUnder(CENTRE).length, cword = CENTRE ? textAt(SPINE, CENTRE) : voice(SPINE);
  out.push('<g class="centre" data-out="1" role="button" tabindex="0" aria-label="step out">' +
    '<circle r="' + R_IN + '" cx="' + CX + '" cy="' + CY + '"/>' +
    '<text class="big" x="' + CX + '" y="' + (CY - 8) + '" text-anchor="middle">' + esc(short(CENTRE ? labelFor(CENTRE) : FAMILY, 16)) + '</text>' +
    '<text class="small" x="' + CX + '" y="' + (CY + 12) + '" text-anchor="middle">' + (cvs ? cvs + (cvs === 1 ? ' voice within' : ' voices within') : (cword ? 'spoken, quiet within' : 'quiet')) + '</text>' +
    (canStepOut() ? '<text class="small" x="' + CX + '" y="' + (CY + 30) + '" text-anchor="middle">tap to step out</text>' : '') +
    '<title>' + esc(cword ? short(cword, 160) : 'nothing written here yet') + '</title></g>');

  svg.innerHTML = out.join('');
}
function shortClockLab(addr){
  const a = String(addr), L = a.length;
  if (L === 4) return a;
  if (L === 6) return MN[(+a[4] - 1) * 3 + (+a[5] - 1)].slice(0, 3);
  if (L === 7) return clockLabel(addr).replace(/ .*/, '');
  if (L === 8){ const m0 = (+a[4] - 1) * 3 + (+a[5] - 1), b = +a[6]; return String((b - 1) * 7 + (+a[7])); }
  if (L === 9) return DAY_PARTS[+a[8] - 1].split(' ').pop();
  if (L === 10) return 'b' + a[9];
  return a.slice(-1);
}
function rimTick(r, mid, halfw){
  const p = (a) => (CX + r * Math.cos(a)).toFixed(2) + ' ' + (CY + r * Math.sin(a)).toFixed(2);
  return 'M' + p(mid - halfw) + 'A' + r + ' ' + r + ' 0 0 1 ' + p(mid + halfw);
}
function deepestCellFor(cells, addr){
  let best = null;
  cells.forEach(c => { if (addr && addr.startsWith(c.addr) && (!best || c.addr.length > best.addr.length)) best = c; });
  return best;
}
function canStepOut(){ return MODE === 'clock' ? CENTRE.length > 1 : CENTRE.length > 0; }
function stepOut(){
  if (!canStepOut() || TWEENING) return;
  let up = MODE === 'clock' && CENTRE.length === 6 ? CENTRE.slice(0, 4) : CENTRE.slice(0, -1);   /* months hang straight off the year */
  if (MODE === 'clock' && up.length === 5) up = up.slice(0, 4);
  animateStep('out', CENTRE, up);
}
function stepInto(addr){
  if (!kidsOf(addr).length || TWEENING) return;
  animateStep('in', addr, addr);
}

/* ── the focused part ── */
function drawPanel(){
  const el = $('panel');
  if (!FOCUS){ el.classList.add('hidden'); return; }
  const addr = FOCUS;
  const word = textAt(SPINE, addr);
  const here = presentUnder(addr);
  const exact = OCC.filter(o => o.addr === addr);
  const beneath = OCC.filter(o => o.addr !== addr && o.addr.startsWith(addr));
  const talk = talkUnder(addr, 48).slice(0, 5);
  const mirrorTexts = new Map(MIRRORS.map(([who, blk]) => [who, textAt(blk, addr)]));
  const rows = [];
  rows.push('<p class="paddr"><b>' + esc(labelFor(addr)) + '</b><span class="work">' + esc(MODE === 'clock' ? pad10(addr) : addr) + '</span></p>');
  rows.push(word ? '<p class="ptext">' + esc(word) + '</p>' : '<p class="ptext absent">nothing written at this part itself</p>');
  if (here.length) rows.push('<div class="subhead">here right now</div>' + here.map(p =>
    '<div class="vline"><span class="who">' + esc(p.who) + '</span><p>' + esc(p.at && strip0(p.at) !== addr ? 'at ' + labelFor(strip0(p.at)) : 'at this very part') + '</p><span class="ago">' + ago(p.ts) + '</span></div>').join(''));
  if (exact.length) rows.push('<div class="subhead">voices at this part</div>' + exact.map(o =>
    '<div class="vline"><span class="who">' + esc(o.who) + '</span><p>' + esc(short(mirrorTexts.get(o.who) || '', 240)) + '</p></div>').join(''));
  if (beneath.length){
    const shown = beneath.slice(0, 12);
    rows.push('<div class="subhead">voices within</div>' + shown.map(o =>
      '<div class="vline"><span class="who">' + esc(o.who) + '</span><span class="whereat">' + esc(labelFor(o.addr)) + '</span><p>' +
      esc(short(textAt(MIRRORS.find(m => m[0] === o.who)?.[1] || null, o.addr) || '', 150)) + '</p></div>').join('') +
      (beneath.length > shown.length ? '<div class="vline"><span class="who"></span><p class="ptext absent">and ' + (beneath.length - shown.length) + ' more — step in to see them placed</p></div>' : ''));
  }
  if (talk.length) rows.push('<div class="subhead">said here lately</div>' + talk.map(v =>
    '<div class="vline"><span class="who">' + esc(v.who) + '</span><p>' + esc(short(v.t, 180)) + '</p><span class="ago">' + ago(v.ts) + '</span></div>').join(''));
  rows.push('<div class="plinks">' +
    (kidsOf(addr).length ? '<button data-in="' + addr + '">step in</button>' : '') +
    '<a target="_blank" rel="noopener" href="' + esc(mirrorUrl(addr)) + '">say yours in the mirror ↗</a>' +
    '<a target="_blank" rel="noopener" href="/walk/' + esc(FAMILY) + (HANDLE ? '/' + esc(HANDLE) : '') + '">walk this field ↗</a></div>');
  el.innerHTML = rows.join('');
  el.classList.remove('hidden');
}

/* ── the live strip ── */
function drawEve(){
  const el = $('eve');
  const chips = PRESENT.map(p => {
    const at = strip0(p.at || '');
    return '<button class="pchip' + (p.fresh ? '' : ' dim') + '" data-go="' + esc(at) + '"><span class="pdot">' + esc(p.who.slice(0, 2)) + '</span>' +
      esc(p.who) + '<span class="at">' + (at ? '· ' + esc(labelFor(at)) + ' ' : '') + (p.fresh ? '· now' : '· ' + esc(ago(p.ts))) + '</span></button>';
  });
  el.innerHTML = '<span class="lab">here lately</span>' + (chips.length ? chips.join('') :
    '<span class="quiet">nobody has stood at ' + esc(FAMILY) + ' in the last while — the glow below is where voices stand</span>');
  const live = PRESENT.filter(p => p.fresh).length;
  $('m-live').textContent = live ? live + ' live' : (PRESENT.length ? PRESENT.length + ' lately' : 'quiet');
}

/* ── data sweeps ── */
function collectVoicings(who, block){
  const out = [];
  const seen = new Set();
  (function rec(node, path){
    if (typeof node === 'string'){ if (node.trim()){ const a = strip0(path); if (a && !seen.has(a)){ seen.add(a); out.push({ who, addr: a }); } } return; }
    if (!node || typeof node !== 'object') return;
    if (typeof node['_'] === 'string' && node['_'].trim()){ const a = strip0(path); if (a && !seen.has(a)){ seen.add(a); out.push({ who, addr: a }); } }
    else if (node['_'] && typeof node['_'] === 'object') rec(node['_'], path + '0');
    for (const k of childDigits(node)) rec(node[k], path + k);
  })(block, '');
  return out;
}
function parseSlots(block, take){
  const out = [];
  (function rec(node){
    if (!node || typeof node !== 'object') return;
    for (const k of childDigits(node)){
      const s = node[k];
      if (s && typeof s === 'object' && typeof s['1'] === 'string') { const v = take(s); if (v) out.push(v); }
      else if (s && typeof s === 'object') rec(s);
    }
    if (node['_'] && typeof node['_'] === 'object') rec(node['_']);
  })(block);
  return out;
}
const placeIsHere = place => place === FAMILY || place === 'spine:' + FAMILY ||
  place === 'pool:' + FAMILY || (typeof place === 'string' && place.startsWith(FAMILY + ':'));

async function sweepSlow(){
  const [spine, index] = await Promise.all([readBlock('spine:' + FAMILY), readIndex()]);
  if (!spine) throw new Error('spine:' + FAMILY + ' is not on the beach');
  SPINE = spine;
  MODE = floorOf(spine) === 10 ? 'clock' : 'tree';
  if (!CENTRE) CENTRE = MODE === 'clock' ? nowAddr().slice(0, 4) : '';
  const blocks = (index && index.blocks) || [];
  const nameOk = s => /^[A-Za-z][A-Za-z0-9 _-]*$/.test(s);
  const mNames = blocks.filter(b => b.startsWith(FAMILY + ':') && nameOk(b.slice(FAMILY.length + 1)));
  const got = await Promise.all(mNames.map(n => readBlock(n).catch(() => null)));
  MIRRORS = mNames.map((n, i) => [n.slice(FAMILY.length + 1), got[i]]).filter(x => x[1]);
  OCC = MIRRORS.flatMap(([who, blk]) => collectVoicings(who, blk));
  const pool = blocks.includes('pool:' + FAMILY) ? await readBlock('pool:' + FAMILY).catch(() => null) : null;
  TALK = parseSlots(pool, s => {
    const t = typeof s['_'] === 'string' ? s['_'] : voice(s); if (!t) return null;
    const ts = typeof s['3'] === 'string' ? s['3'] : '';
    const at = typeof s['2'] === 'string' && /^\d+$/.test(s['2']) ? s['2'] : (typeof s['6'] === 'string' && /^\d+$/.test(s['6']) ? s['6'] : '');
    return ts && Number.isFinite(Date.parse(ts)) ? { who: s['1'], t: t.trim(), ts, at } : null;
  }).sort((a, b) => (b.ts || '').localeCompare(a.ts || ''));
  $('m-fam').textContent = 'the ' + FAMILY + ' field · ' + MIRRORS.length + (MIRRORS.length === 1 ? ' hand' : ' hands');
  $('m-mode').textContent = MODE === 'clock' ? 'the shared clock' : 'its own branches';
}
async function sweepPresence(){
  const p = await readBlock('presence').catch(() => null);
  const WINDOW = 15 * 60e3, FRESH = 60e3;
  PRESENT = parseSlots(p, s => {
    const ts = typeof s['3'] === 'string' ? s['3'] : '';
    if (!ts || !Number.isFinite(Date.parse(ts)) || Date.now() - Date.parse(ts) > WINDOW) return null;
    if (!placeIsHere(typeof s['2'] === 'string' ? s['2'] : '')) return null;
    return { who: s['1'], place: s['2'], ts, fresh: Date.now() - Date.parse(ts) < FRESH,
             at: typeof s['7'] === 'string' ? s['7'] : '' };
  }).sort((a, b) => (b.fresh ? 1 : 0) - (a.fresh ? 1 : 0) || (b.ts || '').localeCompare(a.ts || ''));
}

/* THIS PAGE NEVER WRITES. Presence shown here is what the live surfaces
 * (the mirror, xstream) have announced; an o-page reads once and sits
 * still — the polling budget belongs to the mirror, not to every page. */

/* ── wiring ── */
$('dial').addEventListener('click', e => {
  const c = e.target.closest('.cell');
  if (c){ const addr = c.dataset.addr;
    if (FOCUS === addr) stepInto(addr);
    else { FOCUS = addr; drawDial(); drawPanel(); }
    return; }
  if (e.target.closest('.centre')) stepOut();
});
$('dial').addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const c = e.target.closest('.cell'); if (c){ e.preventDefault(); FOCUS = c.dataset.addr; drawDial(); drawPanel(); }
  else if (e.target.closest('.centre')){ e.preventDefault(); stepOut(); }
});
document.addEventListener('click', e => {
  const go = e.target.closest('[data-go]');
  if (go){ const addr = go.dataset.go;
    if (addr){ if (MODE === 'clock' && addr.length > 6) CENTRE = addr.slice(0, addr.length <= 8 ? 6 : 8);
      FOCUS = addr.length > CENTRE.length + 2 ? addr.slice(0, CENTRE.length + 2) : addr;
      drawDial(); drawPanel(); } return; }
  const inn = e.target.closest('[data-in]');
  if (inn) stepInto(inn.dataset.in);
});

async function reread(){
  const b = $('b-reread');
  b.textContent = '↻ reading…';
  try {
    await sweepSlow();
    await sweepPresence();
    drawDial(); drawEve(); drawPanel();
    $('err').classList.add('hidden');
  } catch (e) {
    $('err').textContent = String(e.message || e);
    $('err').classList.remove('hidden');
  }
  b.textContent = '↻ re-read';
}
async function start(){
  $('b-fam').textContent = FAMILY;
  $('b-walk').href = '/walk/' + FAMILY + (HANDLE ? '/' + HANDLE : '');
  $('b-mirror').href = mirrorUrl('');
  $('b-reread').addEventListener('click', () => { void reread(); });
  $('wh').innerHTML = 'One reading, then stillness — <span style="font-family:var(--mono)">↻ re-read</span> in the bar fetches the beach again; this page never polls and never writes. ' +
    'Tap a part once to read it, twice to step in; the centre steps back out. Being seen happens on the live surfaces — say at a part in the <a target="_blank" rel="noopener" href="' + esc(mirrorUrl('')) + '">mirror</a> and you are the one announced.';
  await reread();
}
start();
</script>
