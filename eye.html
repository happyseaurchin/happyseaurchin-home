<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iris and Magic Eye</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Fraunces:opsz,wght@9..144,400;9..144,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  /* One screen, one eye: the point you are on sits in the pupil, the rest of the block curves away over the eyeball,
     and the doors to other blocks sit on the amber collarette. Teal moves within a block; amber leaves it. */
  --void:#070a0f;
  --stage:#0d141c;
  --ink:#e6ecf0;
  --mist:#93a3af;
  --iris:#4fb3a8;
  --ember:#e6a54a;
  --line:rgba(150,185,205,.17);
  --glass:rgba(210,232,245,.055);
  --display:"Fraunces","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --body:"Atkinson Hyperlegible","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --surface:linear-gradient(180deg,rgba(220,238,248,.078),rgba(220,238,248,.032));
  --surface-focus:linear-gradient(180deg,rgba(18,30,40,.92),rgba(12,20,28,.9));
  --text:#cdd8df;
  color-scheme:dark;
}
/* the beach's standard look (theme.css, dark), worn by Standard, and by Snazzy where a family names no look of its own */
:root[data-look="standard"],:root[data-look="snazzy"]{
  --void:#06171E;--stage:#0A2129;--ink:#EFF6F5;--mist:#9DB9C0;--ember:#E7B24C;
  --line:rgba(196,219,223,.16);--glass:rgba(196,219,223,.06);
  --display:"Syne",system-ui,sans-serif;--body:"Newsreader",Georgia,serif;--mono:"Space Mono",ui-monospace,monospace;
  --surface:#123742;--surface-focus:#123742;--text:#C4DBDF;
}
*{box-sizing:border-box}
/* weft, 16 Nov 2026 (eye.2): no overscroll, so a sideways flick on a trackpad is the eye's (~) and never the browser's back or forward */
html,body{height:100%;margin:0;overscroll-behavior:none}
body{background:var(--void);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column}

/* bars */
.navbar{display:flex;align-items:center;gap:8px;padding:8px 12px;flex:none;position:relative;z-index:6;background:var(--void)}
.top{padding-top:10px}
.block-btn{flex:1;min-width:0;display:flex;align-items:center;gap:9px;background:none;border:0;padding:4px 6px 4px 2px;text-align:left;cursor:pointer;border-radius:10px}
.block-btn:hover{background:var(--glass)}
.bsig .sigil{width:30px;height:30px}
.bt{display:flex;flex-direction:column;min-width:0}
.btitle{font-family:var(--display);font-weight:600;font-size:1.02rem;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bkind{font-size:.72rem;color:var(--mist);letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trail{flex:none;width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;background:rgba(230,165,74,.10);border:1px solid rgba(230,165,74,.45);color:var(--ember);border-radius:50%;font-size:1rem;cursor:pointer}
.seg{display:inline-flex;background:rgba(210,232,245,.05);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;flex:none}
.seg button{border:0;background:none;padding:6px 12px;border-radius:999px;font-size:.86rem;color:var(--mist);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:color-mix(in srgb,var(--iris) 22%,transparent);color:var(--ink);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--iris) 55%,transparent)}
.lensbar{justify-content:center;padding-top:0;flex-wrap:wrap;gap:8px;row-gap:6px}
.lensbar .seg button{padding:6px 10px;font-size:.84rem}
.seg[hidden]{display:none}
.bottom{justify-content:center;gap:10px;padding-bottom:10px}
.sizes button{padding:6px 9px;display:flex;flex-direction:column;align-items:center;gap:1px}
.sizes svg{width:22px;height:18px;display:block}
.sizes svg *{fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round}
.sizes .sl{font-size:.62rem;letter-spacing:.04em;line-height:1}
.tog{flex:none;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:rgba(210,232,245,.05);color:var(--mist);cursor:pointer;font-family:var(--mono);font-size:.95rem}
.tog[aria-pressed="true"]{color:var(--ink);border-color:var(--iris);background:color-mix(in srgb,var(--iris) 20%,transparent)}
/* weft, 16 Nov 2026 (eye.2): every toggle at the top, each showing its state. Its style is the reader's (⚙):
   cycle, one button stepping to the next state; drop-down, one button opening the list; flat, every state laid out */
.tg{display:inline-flex;flex:none;position:relative}
.tg[hidden]{display:none}
.tg .seg.off{opacity:.55}
.tg .seg.off button.kept{color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.cyc{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:rgba(210,232,245,.05);color:var(--ink);cursor:pointer;font-size:.86rem;white-space:nowrap}
.cyc:hover{border-color:color-mix(in srgb,var(--iris) 45%,var(--line))}
.cyc.on{border-color:color-mix(in srgb,var(--iris) 60%,transparent);background:color-mix(in srgb,var(--iris) 16%,transparent)}
.cyc.off{color:var(--mist);border-style:dashed}
.cyc svg{width:20px;height:16px;display:block}
.cyc svg *{fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round}
.cyc .dots{display:inline-flex;gap:3px}
.cyc .dots i{width:4px;height:4px;border-radius:50%;background:var(--mist);opacity:.4}
.cyc .dots i.at{background:var(--iris);opacity:1}
.cyc.off .dots i.at{background:var(--mist);opacity:.9}
.cyc .caret{font-size:.7rem;color:var(--mist)}
.pop{position:absolute;top:calc(100% + 6px);left:0;z-index:12;min-width:150px;display:flex;flex-direction:column;gap:2px;padding:5px;background:#0e151d;border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 40px rgba(0,0,0,.55)}
.pop.right{left:auto;right:0}
.pop button{display:flex;align-items:center;gap:8px;text-align:left;border:0;background:none;color:var(--mist);padding:8px 10px;border-radius:8px;cursor:pointer;font-size:.88rem;white-space:nowrap}
.pop button:hover,.pop button:focus-visible{background:var(--glass);color:var(--ink)}
.pop button[aria-checked="true"]{color:var(--ink);background:color-mix(in srgb,var(--iris) 18%,transparent)}
.pop svg{width:20px;height:16px}.pop svg *{fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round}

/* stage */
.stage{position:relative;flex:1;min-height:0;overflow:hidden;background:radial-gradient(ellipse 80% 70% at 50% 50%,var(--stage) 0%,var(--void) 78%);touch-action:none;user-select:none;-webkit-user-select:none}
/* weft (eye.2): while a mouse drags, nothing under it is selected as text */
.stage.dragging,.stage.dragging *{user-select:none!important;-webkit-user-select:none!important;cursor:grabbing}
#field{position:absolute;inset:0;pointer-events:none}
.layer{position:absolute;inset:0}
.flash{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;border:2px solid var(--ember);pointer-events:none;z-index:9}

/* cards */
.card{position:relative;color:var(--c-ink,var(--ink));background:var(--c-bg,var(--surface));border:1px solid var(--c-line,var(--line));border-radius:16px;padding:13px 15px;max-width:100%;user-select:text;-webkit-user-select:text}
.card[data-fam]{border-top:3px solid var(--c-accent,var(--iris))}
.card.tap{cursor:pointer}
.card.tap:hover{border-color:color-mix(in srgb,var(--iris) 45%,var(--line))}
.card .kicker{font-size:.7rem;letter-spacing:.13em;text-transform:uppercase;color:var(--ember);margin-bottom:5px}
.card .head{display:flex;align-items:center;gap:10px;min-width:0}
.card .t{font-family:var(--c-display,var(--display));font-weight:600;margin:0;line-height:1.2;text-wrap:balance;font-size:1.16rem;min-width:0;overflow-wrap:anywhere}
.sc{font-size:.86em;letter-spacing:.075em}
.unv{font-style:italic;color:var(--mist);font-weight:400}
.card .b{margin-top:8px;color:var(--c-text,var(--text));font-family:var(--c-body,var(--body));font-size:.96rem;line-height:1.52;overflow-wrap:anywhere}
.card .b p{margin:0 0 .6em}.card .b p:last-child{margin-bottom:0}
.card .b.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.card .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:.74rem;color:var(--mist);border:1px solid var(--line);border-radius:999px;padding:1px 8px;white-space:nowrap}
.mono{font-family:var(--mono);font-size:.72rem;font-variant-numeric:tabular-nums}
.card.s-title{padding:7px 14px;border-radius:999px}
.card.s-title .t{font-family:var(--body);font-weight:700;font-size:.93rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.card.s-icon{padding:9px 12px;border-radius:12px}
.card.s-icon .t{font-family:var(--body);font-weight:700;font-size:.9rem;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:break-word;word-break:normal}
.kids .still-i{width:44px;height:24px}
.card.s-big .t{font-size:1.36rem}
.card.s-big .b{max-height:40vh;overflow-y:auto;touch-action:pan-y;padding-right:4px}
.card.s-page{width:min(100%,660px)!important;max-height:100%;overflow-y:auto;padding:18px 20px 22px;touch-action:pan-y}
.card.s-page .t{font-size:1.6rem}
.card.is-focus{border-color:color-mix(in srgb,var(--iris) 42%,var(--line));box-shadow:0 22px 60px -24px rgba(0,0,0,.9),0 0 70px -18px color-mix(in srgb,var(--iris) 45%,transparent);background:var(--c-bg,var(--surface-focus))}
.card.is-focus::before{content:"";position:absolute;left:18px;right:18px;top:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--iris),transparent)}
.sigil{width:30px;height:30px;flex:none;display:block}
.s-icon .sigil,.s-title .sigil{width:24px;height:24px}
.is-focus .sigil{width:38px;height:38px}
.sg-r{fill:none;stroke:var(--iris);stroke-opacity:.5;stroke-width:1.1}
.sg-p{fill:none;stroke:var(--iris);stroke-opacity:.85;stroke-width:1.15;stroke-linejoin:round;stroke-linecap:round}
.sg-d{fill:var(--iris);fill-opacity:.85}
.sg-e{fill:var(--ember)}
.sg-h{fill:none;stroke:var(--ember);stroke-width:1;stroke-dasharray:2 2}
.ref{font:inherit;font-size:.9em;color:#f2d29e;background:rgba(230,165,74,.12);border:1px solid rgba(230,165,74,.36);border-radius:6px;padding:0 5px;cursor:pointer;line-height:1.4}
.ref.off{opacity:.6;border-style:dashed}
.card a{color:#9fd9d1;text-decoration-color:rgba(159,217,209,.4);text-underline-offset:2px}
.sections{margin-top:16px;display:flex;flex-direction:column;gap:16px}
.sec h3{font-family:var(--body);font-size:.7rem;letter-spacing:.15em;text-transform:uppercase;color:var(--mist);margin:0 0 7px;font-weight:700}
.list{display:flex;flex-direction:column;gap:5px}
.li{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--glass);border:1px solid transparent;border-radius:11px;padding:8px 10px;cursor:pointer;width:100%}
.li:hover{border-color:var(--line)}
.li .sigil{width:24px;height:24px;margin-top:1px}
.li b{display:block;font-size:.95rem;line-height:1.3}
.li small{display:block;color:var(--mist);font-size:.84rem;line-height:1.4;margin-top:2px}
.li.amber{background:rgba(230,165,74,.07);border-color:rgba(230,165,74,.25)}
.li .k{display:block;font-size:.68rem;letter-spacing:.13em;text-transform:uppercase;color:var(--ember)}

/* a family's own picture: its share still */
.card .still{margin:-13px -15px 11px;border-radius:13px 13px 0 0;overflow:hidden;aspect-ratio:1200/630;background:#0a1118}
.card[data-fam] .still{border-radius:0}
.card .still img,.still-i img{width:100%;height:100%;object-fit:cover;display:block}
.still-i{flex:none;width:56px;height:30px;border-radius:6px;overflow:hidden;background:#0a1118}
.card.s-big .still{margin-bottom:13px}
/* weft, 16 Nov 2026 (eye.2): the object itself, in Standard and Snazzy. A page the point names shows as a live
   miniature (this site's own pages only, laid out at 1200 wide and scaled into the card, once the point has
   rested); a String share shows the thing shared; a link anywhere else stays a link, opened beside the eye. */
.mini{position:relative;margin:-13px -15px 11px;aspect-ratio:16/10;overflow:hidden;background:#0a1118 center/cover no-repeat;border-radius:13px 13px 0 0;cursor:zoom-in}
.card[data-fam] .mini{border-radius:0}
.card.s-big .mini{margin-bottom:13px;aspect-ratio:16/9}
.card.s-card .mini{aspect-ratio:16/7}
.card.s-big .mini~.b{max-height:24vh}
.mini iframe{position:absolute;left:0;top:0;width:1200px;height:750px;border:0;transform-origin:0 0;pointer-events:none;background:#fff;opacity:0;transition:opacity .3s}
.mini iframe.ready{opacity:1}
.mini .mini-w{position:absolute;left:8px;bottom:8px;z-index:1;max-width:calc(100% - 16px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--mono);font-size:.66rem;color:#e6ecf0;background:rgba(7,10,15,.72);border-radius:999px;padding:2px 8px;pointer-events:none}
.lcard{display:flex;flex-direction:column;gap:6px;margin:4px 0 2px;padding:10px 12px;border:1px solid var(--c-line,var(--line));border-radius:12px;background:rgba(0,0,0,.18);color:var(--c-text,var(--text));text-decoration:none}
.lcard img{width:100%;max-height:220px;object-fit:cover;border-radius:8px;display:block}
.lcard b{font-family:var(--c-display,var(--display));font-weight:600;color:var(--c-ink,var(--ink));line-height:1.25}
.lcard small{font-family:var(--mono);font-size:.7rem;color:var(--c-muted,var(--mist));overflow-wrap:anywhere}
.lcard span{font-size:.9rem;line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.olink{display:inline-block;margin-top:8px;font-size:.86rem;overflow-wrap:anywhere}
/* the page: the point and everything beneath it, or the page itself in a frame */
.page-view{padding:0!important;display:flex;flex-direction:column;overflow:hidden!important}
.pv-bar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 14px;border-bottom:1px solid var(--c-line,var(--line));font-size:.84rem}
.pv-bar b{font-family:var(--c-display,var(--display));font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv-bar a,.pv-open a{color:var(--c-accent,var(--iris));white-space:nowrap}
.page-view iframe{flex:1;width:100%;min-height:0;border:0;background:#fff}
.doc{flex:1;min-height:0;overflow-y:auto;padding:22px 22px 34px;touch-action:pan-y;scrollbar-width:thin}
.doc>*{max-width:44rem}
.doc-hero{margin:-22px -22px 18px;max-width:none!important;aspect-ratio:1200/630;overflow:hidden;background:#0a1118}
.doc-hero img{width:100%;height:100%;object-fit:cover;display:block}
.doc h1{font-family:var(--c-display,var(--display));font-weight:600;font-size:1.7rem;line-height:1.15;margin:0 0 8px;text-wrap:balance}
.doc h2,.doc h3,.doc h4,.doc h5{font-family:var(--c-display,var(--display));font-weight:600;margin:0 0 4px;line-height:1.25;cursor:pointer;text-wrap:balance}
.doc h2{font-size:1.24rem}.doc h3{font-size:1.08rem}.doc h4,.doc h5{font-size:1rem}
.doc h2:hover,.doc h3:hover,.doc h4:hover,.doc h5:hover{color:var(--c-accent,var(--iris))}
.doc-lead,.doc-b{color:var(--c-text,var(--text));font-family:var(--c-body,var(--body));line-height:1.58}
.doc-lead{font-size:1.04rem}.doc-b{font-size:.97rem}
.doc-lead p,.doc-b p{margin:0 0 .6em}
.doc section{margin-top:18px}
.doc section.sub{margin-left:4px;padding-left:14px;border-left:1px solid var(--c-line,var(--line))}
.doc section.decide{border:1px solid var(--c-accent,var(--ember));border-radius:12px;padding:10px 13px;margin-left:0}
.doc-date{font-size:.74rem;color:var(--c-muted,var(--mist));margin:-2px 0 4px}
.pv-open{margin-top:24px;font-size:.9rem;color:var(--c-muted,var(--mist))}
.loading{display:flex;align-items:center;justify-content:center;color:var(--mist);font-size:.95rem}
/* doors */
.doors{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:100%}
.door{display:inline-flex;align-items:center;gap:7px;padding:6px 13px;border-radius:999px;font-size:.86rem;cursor:pointer;color:#f3dcb4;background:rgba(230,165,74,.10);border:1px solid rgba(230,165,74,.45);max-width:100%}
.door span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.door .g{color:var(--ember);font-size:1rem;line-height:1}
.door.mirror{background:rgba(230,165,74,.04);border-style:dashed}

/* iris: focus lens */
.iris .focus-slot{position:absolute;left:0;right:0;top:19%;bottom:24%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:0 13vw;pointer-events:none}
.iris .focus-slot>*{pointer-events:auto}
.iris .focus-slot>.card{width:min(100%,440px)}
/* weft (eye.2): the point fits between the walk above and the ring beneath: its picture of the page at most two fifths
   of the room, and the card scrolling within itself where its words run longer */
.iris:not(.is-page) .focus-slot{container-type:size}
.iris:not(.is-page) .focus-slot>.card{flex:0 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;touch-action:none}
.iris:not(.is-page) .focus-slot .mini{max-height:40cqh;min-width:calc(100% + 30px)}
.iris .focus-slot>.card.s-title,.iris .focus-slot>.card.s-icon{width:auto;max-width:min(100%,440px)}
.iris.is-page .focus-slot{top:6.5%;bottom:7%;padding:0 30px}
.focus-slot>.page-view{flex:1 1 auto;min-height:0;max-height:100%}
.focus-slot>.page-view.framed{width:100%!important;max-width:1100px}
.nb{position:absolute;opacity:.5;transition:opacity .2s}
.nb:hover{opacity:.85}
.nb::after{position:absolute;font-family:var(--mono);color:var(--iris);font-size:.9rem;opacity:.9}
/* weft, 16 Nov 2026 (eye.2): CURVED, the surface of the eye. --cv is the curve: 1 convex, the eye seen from outside,
   its neighbours curving away; −1 concave, seen from inside, curving toward you (⚙). The walk above the point
   stands whole, receding up the eye rung by rung: a set spindle strengthens the vertical. */
.iris{--cv:1}
.iris.concave{--cv:-1}
.anc{position:absolute;left:0;right:0;top:0;height:19%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;padding:4px 0 5px;overflow:hidden;transform:perspective(700px) rotateX(calc(var(--cv) * 30deg));transform-origin:50% 100%;pointer-events:none}
.anc>*{pointer-events:auto}
.anc .nb{position:relative;flex:none;opacity:var(--o,.58);transform:scale(var(--s,1));transform-origin:50% 100%}
.anc .nb.up{width:min(64vw,330px)}
.anc .nb.rung{width:min(54vw,280px)}
.anc .nb.rung .t{font-size:.84rem}
.anc .nb:hover{opacity:.9}
.anc-more{flex:none;border:1px dashed var(--line);background:rgba(10,16,22,.6);color:var(--mist);border-radius:999px;padding:2px 10px;font-size:.72rem;cursor:pointer;opacity:.75;max-width:70vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nb.up::after{content:"+";left:-18px;top:50%;transform:translateY(-50%)}
.nb.up.origin{border-color:rgba(230,165,74,.45)}
.nb.up.origin::after{content:"✳";color:var(--ember)}
.nb.left,.nb.right{top:50%;width:min(44vw,240px)}
.nb.left{left:0;transform:translate(-64%,-50%) perspective(700px) rotateY(calc(var(--cv) * -50deg));transform-origin:100% 50%}
.nb.right{right:0;transform:translate(64%,-50%) perspective(700px) rotateY(calc(var(--cv) * 50deg));transform-origin:0 50%}
.iris.concave .nb.left{transform:translate(-60%,-50%) perspective(700px) rotateY(38deg)}
.iris.concave .nb.right{transform:translate(60%,-50%) perspective(700px) rotateY(-38deg)}
.nb.left::after{content:"~";right:6px;top:-20px}
.nb.right::after{content:"~";left:6px;top:-20px}
.rticks{display:flex;justify-content:center;gap:5px;min-height:6px}
.rticks i{width:5px;height:5px;border-radius:50%;background:var(--mist);opacity:.3}
.rticks i.on{background:var(--iris);opacity:1}
.rticks span{font-family:var(--mono);font-size:.7rem;color:var(--mist)}
.kids-wrap{position:absolute;left:0;right:0;bottom:2%;transform:perspective(700px) rotateX(calc(var(--cv) * -28deg));transform-origin:50% 0}

.edge.e-up{top:6px;left:50%;transform:translateX(-50%)}

.edge.e-left{left:2px;top:50%;transform:translateY(-50%);padding:10px 5px;border-radius:12px}
.edge.e-right{right:2px;top:50%;transform:translateY(-50%);padding:10px 5px;border-radius:12px}

/* weft, 16 Nov 2026 (eye.2): FLAT, the walk drawn as /walk draws it (Slit folded in): every rung of the spindle a row,

   and the ring beneath as the last row. The spindle runs down the page; each ring runs across it. */
.flat-col{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:rgba(150,185,205,.25) transparent;padding:8px 0 30vh}
.flat-col::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:1px;background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--iris) 55%,transparent) 6%,color-mix(in srgb,var(--iris) 55%,transparent) 80%,transparent);pointer-events:none}
.frow{position:relative;margin:0 0 6px}
.frow-lab{max-width:720px;margin:0 auto;padding:2px 16px 0;font-family:var(--mono);font-size:.68rem;letter-spacing:.08em;color:var(--mist);min-height:2px}

.frow-ring::before,.frow-ring::after{content:"";flex:0 0 calc(50% - min(32vw,150px))}

.frow.is-point .frow-ring>.card.is-focus.s-title,.frow.is-point .frow-ring>.card.is-focus.s-icon{width:auto;max-width:86vw}
.frow.beneath .frow-lab::before{content:"− ";color:var(--iris)}

/* iris: directory lens */
.dir-col{position:absolute;inset:0;overflow-y:auto;padding:14px 14px 30vh;touch-action:pan-y;scrollbar-width:thin;scrollbar-color:rgba(150,185,205,.25) transparent}
