<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iris and Magic Eye</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Fraunces:opsz,wght@9..144,400;9..144,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  /* One screen, one eye: the point you are on sits in the pupil, the rest of the block curves away over the eyeball,
     and the doors to other blocks sit on the amber collarette. Teal moves within a block; amber leaves it. */
  --void:#070a0f;
  --stage:#0d141c;
  --ink:#e6ecf0;
  --mist:#93a3af;
  --iris:#4fb3a8;
  --ember:#e6a54a;
  --line:rgba(150,185,205,.17);
  --glass:rgba(210,232,245,.055);
  --display:"Fraunces","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --body:"Atkinson Hyperlegible","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --surface:linear-gradient(180deg,rgba(220,238,248,.078),rgba(220,238,248,.032));
  --surface-focus:linear-gradient(180deg,rgba(18,30,40,.92),rgba(12,20,28,.9));
  --text:#cdd8df;
  color-scheme:dark;
}
/* the beach's standard look (theme.css, dark), worn by Standard, and by Snazzy where a family names no look of its own */
:root[data-look="standard"],:root[data-look="snazzy"]{
  --void:#06171E;--stage:#0A2129;--ink:#EFF6F5;--mist:#9DB9C0;--ember:#E7B24C;
  --line:rgba(196,219,223,.16);--glass:rgba(196,219,223,.06);
  --display:"Syne",system-ui,sans-serif;--body:"Newsreader",Georgia,serif;--mono:"Space Mono",ui-monospace,monospace;
  --surface:#123742;--surface-focus:#123742;--text:#C4DBDF;
}
*{box-sizing:border-box}
/* weft, 16 Nov 2026 (eye.2): no overscroll, so a sideways flick on a trackpad is the eye's (~) and never the browser's back or forward */
html,body{height:100%;margin:0;overscroll-behavior:none}
body{background:var(--void);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column}

/* bars */
.navbar{display:flex;align-items:center;gap:8px;padding:8px 12px;flex:none;position:relative;z-index:6;background:var(--void)}
.top{padding-top:10px}
.block-btn{flex:1;min-width:0;display:flex;align-items:center;gap:9px;background:none;border:0;padding:4px 6px 4px 2px;text-align:left;cursor:pointer;border-radius:10px}
.block-btn:hover{background:var(--glass)}
.bsig .sigil{width:30px;height:30px}
.bt{display:flex;flex-direction:column;min-width:0}
.btitle{font-family:var(--display);font-weight:600;font-size:1.02rem;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bkind{font-size:.72rem;color:var(--mist);letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trail{flex:none;width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;background:rgba(230,165,74,.10);border:1px solid rgba(230,165,74,.45);color:var(--ember);border-radius:50%;font-size:1rem;cursor:pointer}
.seg{display:inline-flex;background:rgba(210,232,245,.05);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;flex:none}
.seg button{border:0;background:none;padding:6px 12px;border-radius:999px;font-size:.86rem;color:var(--mist);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:color-mix(in srgb,var(--iris) 22%,transparent);color:var(--ink);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--iris) 55%,transparent)}
.lensbar{justify-content:center;padding-top:0;flex-wrap:wrap;gap:8px;row-gap:6px}
.lensbar .seg button{padding:6px 10px;font-size:.84rem}
.seg[hidden]{display:none}
.bottom{justify-content:center;gap:10px;padding-bottom:10px}
.sizes button{padding:6px 9px;display:flex;flex-direction:column;align-items:center;gap:1px}
.sizes svg{width:22px;height:18px;display:block}
.sizes svg *{fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round}
.sizes .sl{font-size:.62rem;letter-spacing:.04em;line-height:1}
.tog{flex:none;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:rgba(210,232,245,.05);color:var(--mist);cursor:pointer;font-family:var(--mono);font-size:.95rem}
.tog[aria-pressed="true"]{color:var(--ink);border-color:var(--iris);background:color-mix(in srgb,var(--iris) 20%,transparent)}
/* weft, 16 Nov 2026 (eye.2): every toggle at the top, each showing its state. Its style is the reader's (⚙):
   cycle, one button stepping to the next state; drop-down, one button opening the list; flat, every state laid out */
.tg{display:inline-flex;flex:none;position:relative}
.tg[hidden]{display:none}
.tg .seg.off{opacity:.55}
.tg .seg.off button.kept{color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.cyc{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:rgba(210,232,245,.05);color:var(--ink);cursor:pointer;font-size:.86rem;white-space:nowrap}
.cyc:hover{border-color:color-mix(in srgb,var(--iris) 45%,var(--line))}
.cyc.on{border-color:color-mix(in srgb,var(--iris) 60%,transparent);background:color-mix(in srgb,var(--iris) 16%,transparent)}
.cyc.off{color:var(--mist);border-style:dashed}
.cyc svg{width:20px;height:16px;display:block}
.cyc svg *{fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round}
.cyc .dots{display:inline-flex;gap:3px}
.cyc .dots i{width:4px;height:4px;border-radius:50%;background:var(--mist);opacity:.4}
.cyc .dots i.at{background:var(--iris);opacity:1}
.cyc.off .dots i.at{background:var(--mist);opacity:.9}
.cyc .caret{font-size:.7rem;color:var(--mist)}
.pop{position:absolute;top:calc(100% + 6px);left:0;z-index:12;min-width:150px;display:flex;flex-direction:column;gap:2px;padding:5px;background:#0e151d;border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 40px rgba(0,0,0,.55)}
.pop.right{left:auto;right:0}
.pop button{display:flex;align-items:center;gap:8px;text-align:left;border:0;background:none;color:var(--mist);padding:8px 10px;border-radius:8px;cursor:pointer;font-size:.88rem;white-space:nowrap}
.pop button:hover,.pop button:focus-visible{background:var(--glass);color:var(--ink)}
.pop button[aria-checked="true"]{color:var(--ink);background:color-mix(in srgb,var(--iris) 18%,transparent)}
.pop svg{width:20px;height:16px}.pop svg *{fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round}

/* stage */
/* weft (eye.8): the stage keeps its own stacking, so the eye's rail, rim and doors (z 66 to 72) stay under a sheet (21) and the toggles' lists */
.stage{position:relative;isolation:isolate;flex:1;min-height:0;overflow:hidden;background:radial-gradient(ellipse 80% 70% at 50% 50%,var(--stage) 0%,var(--void) 78%);touch-action:none;user-select:none;-webkit-user-select:none}
/* weft (eye.2): while a mouse drags, nothing under it is selected as text */
.stage.dragging,.stage.dragging *{user-select:none!important;-webkit-user-select:none!important;cursor:grabbing}
#field{position:absolute;inset:0;pointer-events:none}
.layer{position:absolute;inset:0}
.flash{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;border:2px solid var(--ember);pointer-events:none;z-index:9}

/* cards */
.card{position:relative;color:var(--c-ink,var(--ink));background:var(--c-bg,var(--surface));border:1px solid var(--c-line,var(--line));border-radius:16px;padding:13px 15px;max-width:100%;user-select:text;-webkit-user-select:text}
.card[data-fam]{border-top:3px solid var(--c-accent,var(--iris))}
.card.tap{cursor:pointer}
.card.tap:hover{border-color:color-mix(in srgb,var(--iris) 45%,var(--line))}
.card .kicker{font-size:.7rem;letter-spacing:.13em;text-transform:uppercase;color:var(--ember);margin-bottom:5px}
.card .head{display:flex;align-items:center;gap:10px;min-width:0}
.card .t{font-family:var(--c-display,var(--display));font-weight:600;margin:0;line-height:1.2;text-wrap:balance;font-size:1.16rem;min-width:0;overflow-wrap:anywhere}
.sc{font-size:.86em;letter-spacing:.075em}
.unv{font-style:italic;color:var(--mist);font-weight:400}
.card .b{margin-top:8px;color:var(--c-text,var(--text));font-family:var(--c-body,var(--body));font-size:.96rem;line-height:1.52;overflow-wrap:anywhere}
.card .b p{margin:0 0 .6em}.card .b p:last-child{margin-bottom:0}
.card .b.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.card .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:.74rem;color:var(--mist);border:1px solid var(--line);border-radius:999px;padding:1px 8px;white-space:nowrap}
.mono{font-family:var(--mono);font-size:.72rem;font-variant-numeric:tabular-nums}
.card.s-title{padding:7px 14px;border-radius:999px}
.card.s-title .t{font-family:var(--body);font-weight:700;font-size:.93rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.card.s-icon{padding:9px 12px;border-radius:12px}
.card.s-icon .t{font-family:var(--body);font-weight:700;font-size:.9rem;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:break-word;word-break:normal}
.kids .still-i{width:44px;height:24px}
.card.s-big .t{font-size:1.36rem}
.card.s-big .b{max-height:40vh;overflow-y:auto;touch-action:pan-y;padding-right:4px}
.card.s-page{width:min(100%,660px)!important;max-height:100%;overflow-y:auto;padding:18px 20px 22px;touch-action:pan-y}
.card.s-page .t{font-size:1.6rem}
.card.is-focus{border-color:color-mix(in srgb,var(--iris) 42%,var(--line));box-shadow:0 22px 60px -24px rgba(0,0,0,.9),0 0 70px -18px color-mix(in srgb,var(--iris) 45%,transparent);background:var(--c-bg,var(--surface-focus))}
.card.is-focus::before{content:"";position:absolute;left:18px;right:18px;top:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--iris),transparent)}
.sigil{width:30px;height:30px;flex:none;display:block}
.s-icon .sigil,.s-title .sigil{width:24px;height:24px}
.is-focus .sigil{width:38px;height:38px}
.sg-r{fill:none;stroke:var(--iris);stroke-opacity:.5;stroke-width:1.1}
.sg-p{fill:none;stroke:var(--iris);stroke-opacity:.85;stroke-width:1.15;stroke-linejoin:round;stroke-linecap:round}
.sg-d{fill:var(--iris);fill-opacity:.85}
.sg-e{fill:var(--ember)}
.sg-h{fill:none;stroke:var(--ember);stroke-width:1;stroke-dasharray:2 2}
.ref{font:inherit;font-size:.9em;color:#f2d29e;background:rgba(230,165,74,.12);border:1px solid rgba(230,165,74,.36);border-radius:6px;padding:0 5px;cursor:pointer;line-height:1.4}
.ref.off{opacity:.6;border-style:dashed}
.card a{color:#9fd9d1;text-decoration-color:rgba(159,217,209,.4);text-underline-offset:2px}
.sections{margin-top:16px;display:flex;flex-direction:column;gap:16px}
.sec h3{font-family:var(--body);font-size:.7rem;letter-spacing:.15em;text-transform:uppercase;color:var(--mist);margin:0 0 7px;font-weight:700}
.list{display:flex;flex-direction:column;gap:5px}
.li{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--glass);border:1px solid transparent;border-radius:11px;padding:8px 10px;cursor:pointer;width:100%}
.li:hover{border-color:var(--line)}
.li .sigil{width:24px;height:24px;margin-top:1px}
.li b{display:block;font-size:.95rem;line-height:1.3}
.li small{display:block;color:var(--mist);font-size:.84rem;line-height:1.4;margin-top:2px}
.li.amber{background:rgba(230,165,74,.07);border-color:rgba(230,165,74,.25)}
.li .k{display:block;font-size:.68rem;letter-spacing:.13em;text-transform:uppercase;color:var(--ember)}

/* a family's own picture: its share still */
.card .still{margin:-13px -15px 11px;border-radius:13px 13px 0 0;overflow:hidden;aspect-ratio:1200/630;background:#0a1118}
.card[data-fam] .still{border-radius:0}
.card .still img,.still-i img{width:100%;height:100%;object-fit:cover;display:block}
.still-i{flex:none;width:56px;height:30px;border-radius:6px;overflow:hidden;background:#0a1118}
.card.s-big .still{margin-bottom:13px}
/* weft, 16 Nov 2026 (eye.2): the object itself, in Standard and Snazzy. A page the point names shows as a live
   miniature (this site's own pages only, laid out at 1200 wide and scaled into the card, once the point has
   rested); a String share shows the thing shared; a link anywhere else stays a link, opened beside the eye. */
.mini{position:relative;margin:-13px -15px 11px;aspect-ratio:16/10;overflow:hidden;background:#0a1118 center/cover no-repeat;border-radius:13px 13px 0 0;cursor:zoom-in}
.card[data-fam] .mini{border-radius:0}
.card.s-big .mini{margin-bottom:13px;aspect-ratio:16/9}
.card.s-card .mini{aspect-ratio:16/7}
.card.s-big .mini~.b{max-height:24vh}
.mini iframe{position:absolute;left:0;top:0;width:1200px;height:750px;border:0;transform-origin:0 0;pointer-events:none;background:#fff;opacity:0;transition:opacity .3s}
.mini iframe.ready{opacity:1}
.mini .mini-w{position:absolute;left:8px;bottom:8px;z-index:1;max-width:calc(100% - 16px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--mono);font-size:.66rem;color:#e6ecf0;background:rgba(7,10,15,.72);border-radius:999px;padding:2px 8px;pointer-events:none}
.lcard{display:flex;flex-direction:column;gap:6px;margin:4px 0 2px;padding:10px 12px;border:1px solid var(--c-line,var(--line));border-radius:12px;background:rgba(0,0,0,.18);color:var(--c-text,var(--text));text-decoration:none}
.lcard img{width:100%;max-height:220px;object-fit:cover;border-radius:8px;display:block}
.lcard b{font-family:var(--c-display,var(--display));font-weight:600;color:var(--c-ink,var(--ink));line-height:1.25}
.lcard small{font-family:var(--mono);font-size:.7rem;color:var(--c-muted,var(--mist));overflow-wrap:anywhere}
.lcard span{font-size:.9rem;line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.olink{display:inline-block;margin-top:8px;font-size:.86rem;overflow-wrap:anywhere}
/* weft (eye.7), 16 Nov 2026, at David's word: every card that is a page names it in its top right corner, a hyperlink as
   the first hypertext's index cards had them, in Iris and Magic Eye at every size: the chain goes to its page on this
   site, in this tab; ↗ jumps to a website elsewhere, in a new one. ⚙ shows or hides them. */
.card .hlink{position:absolute;top:7px;right:7px;z-index:3;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:color-mix(in srgb,var(--c-bg,#0e151d) 84%,transparent);border:1px solid color-mix(in srgb,var(--c-accent,var(--iris)) 55%,transparent);color:var(--c-accent,var(--iris));text-decoration:none;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.card .hlink:hover,.card .hlink:focus-visible{background:color-mix(in srgb,var(--c-accent,var(--iris)) 24%,var(--c-bg,#0e151d))}
.card .hlink.out{color:var(--ember);border-color:rgba(230,165,74,.6)}
.card .hlink svg{width:13px;height:13px;display:block;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.card.has-link .head{padding-right:26px}
.card.s-title.has-link{padding-right:36px}
.card.s-title .hlink{top:50%;right:5px;width:22px;height:22px;transform:translateY(-50%)}
.card.s-icon .hlink{top:6px;right:6px;width:22px;height:22px}
.page-view .hlink{top:9px;right:12px}
/* the page: the point and everything beneath it, or the page itself in a frame */
.page-view{padding:0!important;display:flex;flex-direction:column;overflow:hidden!important}
.pv-bar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 14px;border-bottom:1px solid var(--c-line,var(--line));font-size:.84rem}
.pv-bar b{font-family:var(--c-display,var(--display));font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv-bar a,.pv-open a{color:var(--c-accent,var(--iris));white-space:nowrap}
.page-view iframe{flex:1;width:100%;min-height:0;border:0;background:#fff}
.doc{flex:1;min-height:0;overflow-y:auto;padding:22px 22px 34px;touch-action:pan-y;scrollbar-width:thin}
.doc>*{max-width:44rem}
.doc-hero{margin:-22px -22px 18px;max-width:none!important;aspect-ratio:1200/630;overflow:hidden;background:#0a1118}
.doc-hero img{width:100%;height:100%;object-fit:cover;display:block}
.doc h1{font-family:var(--c-display,var(--display));font-weight:600;font-size:1.7rem;line-height:1.15;margin:0 0 8px;text-wrap:balance}
.doc h2,.doc h3,.doc h4,.doc h5{font-family:var(--c-display,var(--display));font-weight:600;margin:0 0 4px;line-height:1.25;cursor:pointer;text-wrap:balance}
.doc h2{font-size:1.24rem}.doc h3{font-size:1.08rem}.doc h4,.doc h5{font-size:1rem}
.doc h2:hover,.doc h3:hover,.doc h4:hover,.doc h5:hover{color:var(--c-accent,var(--iris))}
.doc-lead,.doc-b{color:var(--c-text,var(--text));font-family:var(--c-body,var(--body));line-height:1.58}
.doc-lead{font-size:1.04rem}.doc-b{font-size:.97rem}
.doc-lead p,.doc-b p{margin:0 0 .6em}
.doc section{margin-top:18px}
.doc section.sub{margin-left:4px;padding-left:14px;border-left:1px solid var(--c-line,var(--line))}
.doc section.decide{border:1px solid var(--c-accent,var(--ember));border-radius:12px;padding:10px 13px;margin-left:0}
.doc-date{font-size:.74rem;color:var(--c-muted,var(--mist));margin:-2px 0 4px}
.pv-open{margin-top:24px;font-size:.9rem;color:var(--c-muted,var(--mist))}
.loading{display:flex;align-items:center;justify-content:center;color:var(--mist);font-size:.95rem}
/* doors */
.doors{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:100%}
.door{display:inline-flex;align-items:center;gap:7px;padding:6px 13px;border-radius:999px;font-size:.86rem;cursor:pointer;color:#f3dcb4;background:rgba(230,165,74,.10);border:1px solid rgba(230,165,74,.45);max-width:100%}
.door span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.door .g{color:var(--ember);font-size:1rem;line-height:1}
.door.mirror{background:rgba(230,165,74,.04);border-style:dashed}

/* iris: focus lens */
.iris .focus-slot{position:absolute;left:0;right:0;top:19%;bottom:24%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:0 13vw;pointer-events:none}
.iris .focus-slot>*{pointer-events:auto}
.iris .focus-slot>.card{width:min(100%,440px)}
/* weft (eye.2): the point fits between the walk above and the ring beneath: its picture of the page at most two fifths
   of the room, and the card scrolling within itself where its words run longer */
.iris:not(.is-page) .focus-slot{container-type:size}
.iris:not(.is-page) .focus-slot>.card{flex:0 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;touch-action:none}
.iris:not(.is-page) .focus-slot .mini{max-height:40cqh;min-width:calc(100% + 30px)}
.iris .focus-slot>.card.s-title,.iris .focus-slot>.card.s-icon{width:auto;max-width:min(100%,440px)}
.iris.is-page .focus-slot{top:6.5%;bottom:7%;padding:0 30px}
.focus-slot>.page-view{flex:1 1 auto;min-height:0;max-height:100%}
.focus-slot>.page-view.framed{width:100%!important;max-width:1100px}
.nb{position:absolute;opacity:.5;transition:opacity .2s}
.nb:hover{opacity:.85}
.nb::after{position:absolute;font-family:var(--mono);color:var(--iris);font-size:.9rem;opacity:.9}
/* weft, 16 Nov 2026 (eye.2): CURVED, the surface of the eye. --cv is the curve: 1 convex, the eye seen from outside,
   its neighbours curving away; −1 concave, seen from inside, curving toward you (⚙). The walk above the point
   stands whole, receding up the eye rung by rung: a set spindle strengthens the vertical. */
.iris{--cv:1}
.iris.concave{--cv:-1}
.anc{position:absolute;left:0;right:0;top:0;height:19%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;padding:4px 0 5px;overflow:hidden;transform:perspective(700px) rotateX(calc(var(--cv) * 30deg));transform-origin:50% 100%;pointer-events:none}
.anc>*{pointer-events:auto}
.anc .nb{position:relative;flex:none;opacity:var(--o,.58);transform:scale(var(--s,1));transform-origin:50% 100%}
.anc .nb.up{width:min(64vw,330px)}
.anc .nb.rung{width:min(54vw,280px)}
.anc .nb.rung .t{font-size:.84rem}
.anc .nb:hover{opacity:.9}
.anc-more{flex:none;border:1px dashed var(--line);background:rgba(10,16,22,.6);color:var(--mist);border-radius:999px;padding:2px 10px;font-size:.72rem;cursor:pointer;opacity:.75;max-width:70vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nb.up::after{content:"+";left:-18px;top:50%;transform:translateY(-50%)}
.nb.up.origin{border-color:rgba(230,165,74,.45)}
.nb.up.origin::after{content:"✳";color:var(--ember)}
.nb.left,.nb.right{top:50%;width:min(44vw,240px)}
.nb.left{left:0;transform:translate(-64%,-50%) perspective(700px) rotateY(calc(var(--cv) * -50deg));transform-origin:100% 50%}
.nb.right{right:0;transform:translate(64%,-50%) perspective(700px) rotateY(calc(var(--cv) * 50deg));transform-origin:0 50%}
.iris.concave .nb.left{transform:translate(-60%,-50%) perspective(700px) rotateY(38deg)}
.iris.concave .nb.right{transform:translate(60%,-50%) perspective(700px) rotateY(-38deg)}
.nb.left::after{content:"~";right:6px;top:-20px}
.nb.right::after{content:"~";left:6px;top:-20px}
.rticks{display:flex;justify-content:center;gap:5px;min-height:6px}
.rticks i{width:5px;height:5px;border-radius:50%;background:var(--mist);opacity:.3}
.rticks i.on{background:var(--iris);opacity:1}
.rticks span{font-family:var(--mono);font-size:.7rem;color:var(--mist)}
.kids-wrap{position:absolute;left:0;right:0;bottom:2%;transform:perspective(700px) rotateX(calc(var(--cv) * -28deg));transform-origin:50% 0}
.kids-wrap .dir-mark{position:absolute;left:12px;top:-14px;font-family:var(--mono);color:var(--iris);font-size:.9rem}
.kids{display:flex;gap:8px;overflow-x:auto;padding:6px 16px 10px;scroll-snap-type:x proximity;scrollbar-width:none;touch-action:pan-x}
.kids::-webkit-scrollbar{display:none}
.kids>.card{flex:none;width:clamp(116px,33vw,168px);scroll-snap-align:center;opacity:.6}
.kids>.card.s-title{width:auto;max-width:44vw}
.kids>.card.was{opacity:.9;border-color:rgba(230,165,74,.5)}
.kids>:first-child{margin-left:auto}.kids>:last-child{margin-right:auto}
.edge{position:absolute;z-index:3;display:flex;align-items:center;gap:6px;background:rgba(10,16,22,.78);border:1px solid var(--line);color:var(--mist);border-radius:999px;padding:4px 10px;font-size:.78rem;cursor:pointer;max-width:42vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.edge .g{font-family:var(--mono);color:var(--iris)}
.edge.e-up{top:6px;left:50%;transform:translateX(-50%)}
.edge.e-down{bottom:6px;left:50%;transform:translateX(-50%)}
.edge.e-left{left:2px;top:50%;transform:translateY(-50%);padding:10px 5px;border-radius:12px}
.edge.e-right{right:2px;top:50%;transform:translateY(-50%);padding:10px 5px;border-radius:12px}
.edge.e-star{left:8px;bottom:6px;color:#f3dcb4;border-color:rgba(230,165,74,.45)}
.edge.e-mirror{right:8px;bottom:6px;color:#f3dcb4;border-color:rgba(230,165,74,.45);border-style:dashed}
.edge.e-star .g,.edge.e-mirror .g{color:var(--ember)}
.edge.e-left .g,.edge.e-right .g{display:none}

/* weft, 16 Nov 2026 (eye.2): FLAT, the walk drawn as /walk draws it (Slit folded in): every rung of the spindle a row,
   its ring laid out with the walked card in the middle and the unchosen either side of it, the point at its size,
   and the ring beneath as the last row. The spindle runs down the page; each ring runs across it. */
.flat-col{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:rgba(150,185,205,.25) transparent;padding:8px 0 30vh}
.flat-col::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:1px;background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--iris) 55%,transparent) 6%,color-mix(in srgb,var(--iris) 55%,transparent) 80%,transparent);pointer-events:none}
.frow{position:relative;margin:0 0 6px}
.frow-lab{max-width:720px;margin:0 auto;padding:2px 16px 0;font-family:var(--mono);font-size:.68rem;letter-spacing:.08em;color:var(--mist);min-height:2px}
.frow-ring{display:flex;align-items:center;gap:10px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x proximity;touch-action:pan-x;overscroll-behavior-x:contain;padding:5px 0 7px;scrollbar-width:none}
.frow-ring::-webkit-scrollbar{display:none}
.frow-ring::before,.frow-ring::after{content:"";flex:0 0 calc(50% - min(32vw,150px))}
.frow-ring>.card{flex:none;width:min(64vw,300px);scroll-snap-align:center;opacity:.62}
.frow-ring>.card.s-title{width:auto;max-width:64vw}
.frow-ring>.card.on{opacity:1;border-color:color-mix(in srgb,var(--iris) 55%,var(--line))}
.frow-ring>.card.was{opacity:.9;border-color:rgba(230,165,74,.5)}
.frow.is-point .frow-ring>.card.is-focus{width:min(86vw,440px);opacity:1}
.frow.is-point .frow-ring>.card.is-focus.s-title,.frow.is-point .frow-ring>.card.is-focus.s-icon{width:auto;max-width:86vw}
.frow.beneath .frow-lab::before{content:"− ";color:var(--iris)}
.fmore{flex:none;font-family:var(--mono);font-size:.7rem;color:var(--mist);padding:0 6px}
.frow-doors{position:relative;z-index:1;margin:0 0 8px}

/* iris: directory lens */
.dir-col{position:absolute;inset:0;overflow-y:auto;padding:14px 14px 30vh;touch-action:pan-y;scrollbar-width:thin;scrollbar-color:rgba(150,185,205,.25) transparent}
.dir-col>*{max-width:660px;margin-left:auto;margin-right:auto}
.walk{display:flex;flex-direction:column;gap:1px;margin-bottom:10px}
.w-row{display:flex;align-items:center;gap:8px;padding:3px 6px 3px calc(6px + var(--d) * 13px);background:none;border:0;color:var(--mist);font-size:.86rem;text-align:left;cursor:pointer;border-radius:8px;width:100%}
.w-row:hover{background:var(--glass);color:var(--ink)}
.w-row .sigil{width:18px;height:18px}
.w-row span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dir-col .doors{margin-top:10px}
.depth{display:flex;align-items:center;justify-content:flex-start;gap:6px;margin-top:16px;color:var(--mist);font-size:.8rem}
.dp{display:inline-flex;align-items:center;gap:3px;height:28px;padding:0 9px;border-radius:8px;border:1px solid var(--line);background:none;cursor:pointer}
.dp i{width:5px;height:5px;border-radius:50%;background:var(--mist)}
.dp[aria-pressed="true"]{border-color:var(--iris)}.dp[aria-pressed="true"] i{background:var(--iris)}
.tree{margin-top:10px}
.ti{position:relative;animation:open .42s both;animation-delay:calc(var(--i) * 16ms)}
.sub{margin-left:15px;border-left:1px solid var(--line)}
@keyframes open{from{opacity:0;transform:translateX(-12px) scale(.98)}to{opacity:1;transform:none}}
.tr{display:flex;align-items:flex-start;gap:9px;width:100%;padding:6px 8px;background:none;border:0;color:var(--ink);text-align:left;border-radius:0 10px 10px 0;cursor:pointer}
.tr:hover{background:var(--glass)}
.tr .sigil{width:22px;height:22px;margin-top:1px}
.tr b{font-weight:700;font-size:.94rem;line-height:1.3;display:block}
.tr small{display:block;color:var(--mist);font-size:.85rem;line-height:1.4;margin-top:2px}
.empty{color:var(--mist);font-style:italic;font-size:.9rem}
/* weft, 16 Nov 2026 (eye.2): COLUMNS, the directory by rung, a column per pscale: the spindle's rings to the left,
   the point's ring with the point at its size, then what lies beneath it breadth-first, one rung a column */
.cols-l{display:flex;flex-direction:column}
.cols-bar{flex:none;display:flex;align-items:center;justify-content:center;gap:10px;padding:6px 12px 2px}
.cols-bar .depth{margin-top:0}
.cols{flex:1;min-height:0;display:flex;align-items:flex-start;gap:10px;overflow:auto;padding:8px 14px 24vh;touch-action:pan-x pan-y;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:rgba(150,185,205,.25) transparent}
.colm{flex:none;width:min(74vw,250px);display:flex;flex-direction:column;gap:6px}
.colm.is-point{width:min(86vw,400px)}
.colm-h{font-family:var(--mono);font-size:.68rem;letter-spacing:.08em;color:var(--mist);padding:0 2px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.colm.beneath .colm-h::before{content:"− ";color:var(--iris)}
.colm-g{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mist);margin:8px 2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.colm>.card{opacity:.66}
.colm>.card.on{opacity:1;border-color:color-mix(in srgb,var(--iris) 55%,var(--line))}
.colm>.card.is-focus{opacity:1}
.colm>.card.was{opacity:.9;border-color:rgba(230,165,74,.5)}
.colm>.card.s-title,.colm>.card.s-icon{width:100%}
.colm .doors{justify-content:flex-start}

/* magic eye: the zoom through pscale (weft, eye.3, 16 Nov 2026). The points stand on z by their pscale;
   one rung is a power of the zoom; the rings are one pscale's children at their digits' angles. */
.zoom{overflow:hidden}
.zworld{position:absolute;inset:0;pointer-events:none}
.zn{position:absolute;left:0;top:0;transform-origin:50% 50%;pointer-events:auto}
.zoom.moving .zn,.zlane.moving .zn{will-change:transform,opacity}
.zoom.zdrag,.zoom.zdrag *,.zlane.zdrag,.zlane.zdrag *{user-select:none;-webkit-user-select:none;cursor:grabbing}
/* weft (eye.8), 17 Nov 2026: a lane, one call drawn in its own band; one lane fills the stage as the eye always did */
.zlane{position:absolute;inset:0;overflow:hidden}
.zfield{position:absolute;left:0;top:0;pointer-events:none}
.zn>.card{width:100%}
.zn.z-icon>.card,.zn.z-title>.card{width:auto;max-width:100%}
.zc>.card{background:var(--c-bg,linear-gradient(180deg,#121e28,#0e1820))}
:root[data-look="standard"] .zc>.card{background:var(--c-bg,#123742)}
.zc>.card.tent{border-style:dashed}
/* weft (eye.7), 16 Nov 2026: inside the ring every card keeps the layout it rests at, so nothing jumps as a card comes to
   the front (its sigil no larger for being faced), and a family's picture follows the card's own rounded corners, under
   its accent, as the Iris's does */
.zn .card .sigil,.zn .card.is-focus .sigil{width:30px;height:30px}
.zn .card.s-icon .sigil,.zn .card.s-icon.is-focus .sigil{width:24px;height:24px}
.zn .card[data-fam] .still,.zn .card[data-fam] .mini{border-radius:15px 15px 0 0/13px 13px 0 0}
.zpage{animation:zfade .34s ease-out both}
/* a card or a large card stands within the stage, between the words at the top and the rail: its words give way, its
   picture and its title never, and its height is its own whichever way it turns, so it never jumps */
.zn>.card.s-card,.zn>.card.s-big{display:flex;flex-direction:column;max-height:var(--zmaxh,70vh);overflow:hidden}
.zn>.card.s-card>*,.zn>.card.s-big>*{flex:none}
.zn>.card.s-card>.b,.zn>.card.s-big>.b{flex:0 1 auto;min-height:0;overflow:hidden}
.zn>.card.s-big>.b{overflow-y:auto}
@keyframes zfade{from{opacity:0}to{opacity:1}}
/* weft (eye.5), 16 Nov 2026: your spindles, a row of tabs kept on this device */
.tabsbar{padding-top:0;padding-bottom:6px;gap:6px;overflow-x:auto;overflow-y:hidden;flex-wrap:nowrap;scrollbar-width:none;min-width:0;justify-content:safe center}
.tabsbar::-webkit-scrollbar{display:none}
.tabsbar .call{flex:none;font-family:var(--mono);font-size:.7rem;letter-spacing:.04em;color:var(--mist);padding:0 4px}
.stab-keep,.stab{flex:none;display:inline-flex;align-items:center;height:28px;border-radius:14px;border:1px solid var(--line);background:var(--glass);font-size:.78rem;white-space:nowrap}
.stab-keep{gap:5px;padding:0 11px;color:var(--mist);cursor:pointer;font-family:inherit}
.stab-keep .g{color:var(--iris);font-weight:700}
.stab-keep:disabled{opacity:.45;cursor:default}
.stab-snap svg{width:14px;height:14px;fill:none;stroke:var(--ember);stroke-width:1.8;stroke-linecap:round}
.stab{max-width:240px;overflow:hidden}
.stab .go{display:inline-flex;align-items:baseline;gap:6px;min-width:0;height:100%;padding:0 11px;background:none;border:0;color:var(--mist);font:inherit;cursor:pointer}
.stab .go .lb{overflow:hidden;text-overflow:ellipsis}
.stab .go .ad{font-family:var(--mono);font-size:.66rem;color:var(--mist);opacity:.8}
.stab[aria-current="true"]{border-color:color-mix(in srgb,var(--iris) 60%,var(--line))}
.stab[aria-current="true"] .go{color:var(--ink);padding-right:4px}
.stab .x{flex:none;width:26px;height:100%;background:none;border:0;color:var(--mist);font-size:1rem;line-height:1;cursor:pointer}
.stab .x:hover,.stab .go:hover,.stab-keep:not(:disabled):hover{color:var(--ink)}
/* weft (eye.5), 16 Nov 2026: on the line the eye looks along, the spindle's own card solid, the eye's own way dashed */
.card.was.ahead{border-style:dashed}
.tr.was{background:color-mix(in srgb,rgba(230,165,74,.16) 60%,transparent);box-shadow:inset 2px 0 0 rgba(230,165,74,.55)}
.tr.was.ahead{background:none;box-shadow:inset 2px 0 0 rgba(230,165,74,.35)}
.frow.spindle-row .frow-ring>.card.was{opacity:.84}
.rail{position:absolute;left:0;right:0;bottom:3%;display:flex;justify-content:center;flex-wrap:wrap;gap:8px;padding:0 10px;z-index:3}
.rb{display:flex;align-items:center;gap:7px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:rgba(10,16,22,.78);font-size:.88rem;cursor:pointer}
.rb .g{font-family:var(--mono);color:var(--iris);font-size:1rem;line-height:1}
.rb:disabled{opacity:.33;cursor:default}
.zrail{bottom:10px;z-index:72;flex-wrap:nowrap}
.zrail .zmode{margin-left:6px;border-style:dashed}
.zrail .zmode .lb2{font-size:.78rem;color:var(--mist)}
.zrail .zmode[aria-pressed="true"]{border-style:solid;border-color:color-mix(in srgb,var(--iris) 55%,var(--line))}
.rim{position:absolute;top:2%;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;text-align:center;color:var(--mist);cursor:zoom-out;max-width:88vw;background:none;border:0;padding:4px 10px}
.rim-k{font-size:.68rem;letter-spacing:.16em;text-transform:uppercase}
.rim-t{font-family:var(--display);font-size:1.05rem;color:#b9c6cf;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:86vw}
.zrim{z-index:70;max-width:min(88vw,620px)}
.zrim[hidden]{display:none}
.zrim .rim-k{font-family:var(--mono);letter-spacing:.08em;text-transform:none;font-size:.7rem}
.zrim .rim-w{font-family:var(--body);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mist);margin-right:2px}
.zdecor{position:absolute;inset:0;pointer-events:none;z-index:66}
.zdecor>*{pointer-events:auto}
.zdoors{position:absolute;left:0;right:0;display:flex;justify-content:center;padding:0 12px;pointer-events:none}
.zdoors>.doors{pointer-events:auto}
.zpage{position:absolute;left:0;right:0;top:52px;bottom:66px;display:flex;justify-content:center;padding:0 14px}
.zpage>.page-view{flex:1 1 auto;min-height:0;max-height:100%}
.zpage>.page-view.framed{width:100%!important;max-width:1100px}
.choices{position:absolute;left:0;right:0;top:12%;bottom:15%;overflow-y:auto;display:flex;flex-direction:column;padding:8px 14px;touch-action:pan-y;scrollbar-width:thin;scrollbar-color:rgba(150,185,205,.25) transparent}
.choices.zgrid{top:62px;bottom:70px}
.choices-inner{margin:auto 0;display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.choices .card.choice{width:min(44vw,260px);animation:arrive .55s both;animation-delay:calc(var(--i) * 30ms)}
.choices .card.choice.s-card{padding:11px 13px}
.choices .card.choice.s-card .t{font-size:1.02rem}
.choices .card.choice .b.clamp{-webkit-line-clamp:3}
.choices .card.choice .meta{display:none}
.choices .card.choice.s-title{width:auto;max-width:86vw}
.choices .card.choice.hl,.choices .card.choice.lit{border-color:var(--ember);box-shadow:0 0 0 1px var(--ember),0 0 40px -12px rgba(230,165,74,.6)}
@keyframes arrive{from{opacity:0;transform:scale(.55);filter:blur(5px)}to{opacity:1;transform:none;filter:none}}
@media (max-width:560px){
  .zrail{gap:6px;padding:0 6px}
  .zrail .rb{padding:8px 13px}
  .zrail .lb{display:none}
  .zrail .zmode{margin-left:2px;padding:8px 11px}
}
/* weft (eye.8), 17 Nov 2026, at David's word: the stack. Lanes as rows when the siblings run across, as columns when they
   run up and down; the one in hand ringed in amber; the doors of the lane in hand in one strip above the rail */
.stacked>.zlane{inset:auto}
.stacked.rows>.zlane+.zlane{border-top:1px solid var(--line)}
.stacked.cols>.zlane+.zlane{border-left:1px solid var(--line)}
.stacked>.zlane.on::after{content:"";position:absolute;inset:2px;border:1px solid color-mix(in srgb,var(--ember) 42%,transparent);border-radius:12px;pointer-events:none;z-index:69}
.stacked>.zlane:not(.on) .zworld{filter:saturate(.8) brightness(.92)}
.stacked .zrim{top:2px;flex-direction:row;align-items:baseline;gap:8px;padding:2px 8px;max-width:calc(100% - 78px);white-space:nowrap}
.stacked .zrim .rim-t{font-size:.86rem;max-width:none;min-width:0}
.stacked .zrim .rim-b{color:var(--ink);margin-right:7px}
.stacked .zrim{background:color-mix(in srgb,var(--void) 80%,transparent);border-radius:9px}
.stacked.cols .zrim{flex-direction:column;align-items:center;gap:0;max-width:calc(100% - 10px)}
.stacked.cols .zrim .rim-k,.stacked.cols .zrim .rim-t{max-width:100%;overflow:hidden;text-overflow:ellipsis}
.ztop{z-index:67}
.stacked.over>.zlane{visibility:hidden}
.zstackdoors{position:absolute;left:0;right:0;bottom:62px;display:flex;justify-content:center;padding:0 12px;pointer-events:none}
.zstackdoors>.doors{pointer-events:auto}
.zlane-tools{position:absolute;top:3px;right:5px;display:flex;gap:2px;z-index:71}
.zlane-tools button{width:28px;height:24px;border:0;background:none;color:var(--mist);cursor:pointer;border-radius:7px;display:grid;place-items:center;font-size:1.05rem;line-height:1;padding:0}
.zlane-tools button:hover,.zlane-tools button:focus-visible{color:var(--ink);background:var(--glass)}
.zlane-tools .zl-step[aria-pressed="true"]{color:var(--ember)}
.zlane-tools svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.door.lane{color:var(--ink);background:color-mix(in srgb,var(--iris) 10%,transparent);border-color:color-mix(in srgb,var(--iris) 55%,var(--line));border-style:dashed}
.door.lane .g{color:var(--iris)}
.li-row{display:flex;gap:6px;align-items:stretch;width:100%}
.li-row>.li,.li-row>.bl{flex:1 1 auto;min-width:0}
.li-lane{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:60px;border-radius:11px;border:1px dashed color-mix(in srgb,var(--iris) 55%,var(--line));background:color-mix(in srgb,var(--iris) 8%,transparent);color:var(--ink);cursor:pointer;font:inherit;font-size:.74rem;padding:6px 8px}
.li-lane .g{font-size:1.05rem;color:var(--iris);line-height:1}
.panel-stack{flex:none;border:1px dashed color-mix(in srgb,var(--iris) 55%,var(--line));background:color-mix(in srgb,var(--iris) 10%,transparent);color:var(--ink);border-radius:999px;padding:7px 15px;cursor:pointer;font:inherit;font-size:.86rem}
/* the snapshot: each lane's call, and the words it reaches */
.snap .snap-acts{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
.snap .snap-size{font-family:var(--mono);font-size:.72rem;color:var(--mist);margin:6px 0 10px}
.snap-lane{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0;background:var(--glass)}
.snap-lane.hand{border-color:color-mix(in srgb,var(--ember) 45%,var(--line))}
.snap-lane h4{margin:0 0 6px;font-size:.95rem;display:flex;flex-wrap:wrap;align-items:baseline;gap:8px}
.snap-lane h4 .n{font-family:var(--mono);font-size:.78rem;color:var(--ember)}
.snap-lane h4 small{color:var(--mist);font-weight:400;font-size:.8rem}
.snap-call{display:block;font-family:var(--mono);font-size:.72rem;color:var(--iris);overflow-wrap:anywhere;margin-bottom:6px}
.snap-text{font-family:var(--mono);font-size:.7rem;line-height:1.5;color:var(--text);white-space:pre-wrap;overflow-wrap:anywhere;max-height:260px;overflow-y:auto;margin:0;padding:8px;border-radius:8px;background:rgba(0,0,0,.22)}

/* weft (eye.11), 17 Nov 2026, at David's word: the directory, laid flat. Every point a square, its places beneath it as a
   phone's keypad; the camera zooms and pans over the whole plane, and above a block's top it goes on into the beach. Each
   card keeps the layout of its size and is only scaled, so nothing reflows as it nears. */
.dir-eye{overflow:hidden;cursor:grab}
.dir-eye.grabbing,.dir-eye.grabbing *{cursor:grabbing;user-select:none;-webkit-user-select:none}
.dfield{position:absolute;left:0;top:0;pointer-events:none}
.dworld{position:absolute;inset:0;pointer-events:none}
.dn{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:auto;contain:layout style}
.dn>.card{width:100%;height:100%;box-sizing:border-box;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;touch-action:none}

.dn .card .sigil{width:30px;height:30px}
.dn .card.s-icon .sigil{width:24px;height:24px}
/* a point's own words at the head of its square: one line, set to the left */
.dhead>.card{justify-content:center}
.dhead>.card.s-title{border-radius:999px}
.dhead>.card.s-icon .t,.dhead>.card.s-card .t,.dhead>.card.s-big .t{-webkit-line-clamp:1;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden}

.dsq>.card.s-title{border-radius:14px;justify-content:center;padding:8px 10px}
.dsq>.card.s-title .t{white-space:normal;text-overflow:clip;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:break-word;text-align:center;font-size:.8rem}
.dsq>.card.s-title.has-link{padding:14px 8px 8px}
.dsq>.card.s-title.has-link .head{padding-right:0}
.dsq>.card.s-title .hlink{top:4px;right:4px;transform:none;width:19px;height:19px}
.dsq>.card.s-title .hlink svg{width:11px;height:11px}
.dsq>.card.s-title .head{justify-content:center}
.dsq>.card.s-icon{justify-content:flex-start}
.dsq>.card.s-icon .t{-webkit-line-clamp:4}
.dsq>.card .kicker{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dsq>.card.s-title .kicker{display:none}
.dcard .t{overflow-wrap:anywhere}
.du-beach,.du-set,.du-pkg{border-style:dashed}
.du-beach .kicker,.du-set .kicker,.du-pkg .kicker{color:var(--iris)}

.dn>.card.is-focus{border-color:color-mix(in srgb,var(--iris) 60%,var(--line))}

.dtop{position:absolute;left:0;right:0;top:0;display:flex;align-items:flex-start;gap:10px;padding:8px 12px 16px;z-index:70;pointer-events:none;background:linear-gradient(180deg,color-mix(in srgb,var(--void) 97%,transparent) 0%,color-mix(in srgb,var(--void) 90%,transparent) 70%,transparent 100%)}
.drail::before{content:"";position:absolute;left:0;right:0;bottom:-10px;height:78px;background:linear-gradient(0deg,color-mix(in srgb,var(--void) 88%,transparent) 0%,color-mix(in srgb,var(--void) 60%,transparent) 55%,transparent 100%);z-index:-1;pointer-events:none}
.dtop>*{pointer-events:auto}
.dwords{position:static;transform:none;flex:1 1 auto;min-width:0;align-items:flex-start;text-align:left;cursor:default;padding:2px 0;max-width:none}

.dwords .rim-b{color:var(--ink)}
.dwords .rim-t{max-width:100%;font-size:1rem}
.dwords .rim-w{font-family:var(--body);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mist);margin-right:2px}

.dfind input:focus{border-color:color-mix(in srgb,var(--iris) 60%,var(--line))}
.dlist{position:absolute;right:0;top:38px;width:min(86vw,360px);max-height:min(56vh,420px);overflow-y:auto;touch-action:pan-y;overscroll-behavior:contain;display:flex;flex-direction:column;gap:2px;padding:6px;border-radius:14px;border:1px solid var(--line);background:rgba(8,13,18,.96);box-shadow:0 18px 50px -18px rgba(0,0,0,.9)}

.dhint{position:absolute;left:50%;bottom:64px;transform:translateX(-50%);z-index:71;display:flex;align-items:center;gap:6px;width:max-content;max-width:min(92vw,560px);padding:7px 8px 7px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(8,13,18,.9);font-size:.8rem;color:var(--text,var(--mist));line-height:1.35}
.dhint-x{flex:none;width:26px;height:26px;border-radius:50%;border:0;background:none;color:var(--mist);font-size:1.05rem;cursor:pointer}

.panel-list{flex:1;min-height:0;overflow-y:auto;width:100%;max-width:640px;display:flex;flex-direction:column;gap:8px;touch-action:pan-y;padding-bottom:12px}
.panel-close{flex:none;border:1px solid var(--line);background:rgba(10,16,22,.78);border-radius:999px;padding:8px 16px;cursor:pointer;font-size:.9rem}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20}

.sheet{position:fixed;left:0;right:0;bottom:0;max-height:86%;z-index:21;background:#0e151d;border-top:1px solid var(--line);border-radius:18px 18px 0 0;display:flex;flex-direction:column;box-shadow:0 -20px 60px rgba(0,0,0,.6);animation:rise .28s cubic-bezier(.2,.8,.2,1)}

  const out = [], args = ['agent_id="' + String(b.beach || WHERE[b.name] || BEACH).replace(/\/$/, '') + '"', 'block="' + b.name + '"'], sd = S.length && digits ? addrOf(b, S) : '';
  let shape;
  if (p.length < S.length) {                                // a rung on the spindle: the point, and the walk that reaches it

    for (let d = 0; d <= p.length; d++) out.push(line(p.slice(0, d), '  '));
  } else if (k > 0) {                                       // past the spindle's end: the walk, then the rings beneath it

    out.push('  path-walk:'); for (let d = 0; d <= S.length; d++) out.push(line(S.slice(0, d), '    '));

}

function copyText(t) {

function openHelp() {
  const body = h('div', 'help');
  body.innerHTML =
    '<p>Two ways to look at a pscale block, and one set of moves for both. X is the point you are on.</p>' +
    '<dl class="moves"><dt>+X</dt><dd>Out, a rung up: the point that contains this one.</dd><dt>−X</dt><dd>In, a rung down: the points nested inside this one.</dd><dt>~X</dt><dd>Across: this point\'s siblings, the other points in the same rung.</dd><dt class="a">*X</dt><dd>Star: jump to another block. A block named in the text, a proposal\'s own spine, or what lies hidden beneath a place.</dd><dt class="a">◐</dt><dd>Mirror: the same address in someone else\'s block, every reading side by side. A kind of star that keeps your place.</dd></dl>' +
    // weft (eye.5), 16 Nov 2026: the place as one call, the eye's own way, and your spindles
    '<h3>The spindle and the point</h3><p>Where you stand is one call, as bsp() makes it: the block, the <b>spindle</b> (the whole address, a rung of meaning for every digit) and the <b>point</b> on it, named by its pscale. The point can be any rung along the spindle, not only its end: come out and the spindle stays, so going in again goes back the way you came. Past the spindle\'s end is the sub-directory, the points beneath it laid out to choose from. Iris and Magic Eye draw the same place, so switching between them keeps it.</p>' +
    '<p>Where nothing is decided, the eye makes the rest as it looks, and draws it dashed: on a clock, the way to now; in a block that grows by entries (a history, a room, a list), its newest; in a spine, its steps, down 1; anywhere else, a ring to choose from, the first point at its centre. Going there decides it. Nothing is written anywhere.</p>' +
    '<p><b>Your spindles.</b> <i>＋ keep</i>, in the row beneath the toggles, keeps the place you stand on as a tab on this device; a tap on a tab takes you back to it, and × on the one you are on lets it go. With # on, the row opens with the call itself: the spindle, and the point\'s pscale.</p>' +
    // weft, 16 Nov 2026 (eye.2): the views as the shapes they draw, and which way is which on every device
    '<h3>Iris</h3><p>The surface of the eye, two ways of reading one block. <b>The walk</b> is the path from the top of the block down to the point you are on, every rung of it, with the point\'s siblings across it and the points inside it waiting beneath. <b>The directory</b> is the same walk with everything nested beneath the point opened, one to four rungs deep.</p>' +
    '<p>The walk is drawn <b>curved</b> or <b>flat</b>: the same points and the same moves, drawn two ways. Curved is the eye: the point in the pupil, the walk above it receding up the eyeball, its siblings curving off left and right, the points inside it along the bottom; ⚙ makes it convex, the eye seen from outside, or concave, seen from inside. Flat is the walk as /walk draws it: each rung a row, its ring laid out with the card you came through in the middle and the ones you passed beside it; tap any card on any row to stand there, and the rows beneath follow. The longer the walk, the more of it stands above you, in both.</p>' +
    '<p>The directory is a <b>dropdown</b>, everything beneath nested downward, or <b>columns</b>, one column a rung: the walk\'s rings to the left, then what lies beneath, rung by rung, to the right.</p>' +
    '<h3>Which way is which</h3><dl class="moves"><dt>Wheel</dt><dd>In the curved walk: roll down, or push two fingers up a trackpad that scrolls naturally, to go in (−); up to come out (+); sideways for the siblings (~). One click of the wheel, or one flick of a trackpad with its glide, is one move; flick back and it comes back at once. Over words or a strip that scrolls, the wheel scrolls it first. The Magic Eye reads it as its own two toggles say (below).</dd><dt>Drag</dt><dd>With a finger or the mouse, the surface moves the way you drag it: drag up to go in, down to come out, left for the next sibling, right for the one before. A drag on a strip or a column that scrolls scrolls it.</dd><dt>Tap</dt><dd>Any card you can see takes you to it: a neighbour, a rung of the walk, a row, a column.</dd><dt>Keys</dt><dd>↓ in, ↑ out, → the next sibling, ← the one before, in every view (in the Magic Eye with its siblings up and down, ↓ and ↑ turn the ring, → goes in and ← comes out). * or S for the star, M for the mirror, Esc to come back.</dd></dl>' +
    '<p>Flat and columns scroll and move by tap, the keys still moving; the dropdown scrolls, and takes sideways moves as siblings. To copy words, double- or triple-click them.</p>' +
    '<h3>The toggles</h3><p>Every toggle at the top names its state. ⚙ chooses how they show themselves: cycle, a tap stepping to the next state; drop-down, a tap opening the list; or flat, every state laid out.</p>' +
    // weft (eye.3, eye.7), 16 Nov 2026: the Magic Eye, standing inside the ring
    '<h3>Magic Eye</h3><p>You stand inside the block. Where you stand is the underscore of a point\'s parent, in the middle of the ring of its siblings, and you face the point: it stands straight ahead, and its siblings stand round you, each at its own digit\'s place, as the sigil draws an address, so a gap stays a gap (a ring of other keys, or of more than ten, stands one by one in order). The marks on the floor are the ring\'s places: filled where a point stands, open where a digit\'s place stands empty, the one you face lit. Pscale is the line you look along, and the words at the top say which rung you stand in and within what.</p>' +
    '<p><b>‹ ›</b>, or a swipe or a scroll along the ring, turns the ring round you: the next sibling comes round to the front and the one you faced goes round to the side, and nothing zooms. <b>−</b> walks forward through the point you face into its own ring: it grows until it is gone, and you stand at its underscore facing the child the block\'s way gives. <b>+</b> steps back: the ring you stood in recedes into its point, and the ring around gathers round you again, facing the one you came from. Every rung is one rest, so nothing glides past the siblings. <b>~</b> lays the whole ring out at once, to choose from; ~ again, or Esc, closes it.</p>' +
    '<p>Where the eye holds a <b>spindle</b>, the address a link gave or the way you walked, going in follows it, and on along the block\'s own way past it (the way to now, the newest, the steps), drawn dashed; past the end of both you face the first child, or the one you turned to, still dashed until you walk in.</p>' +
    '<p>Two toggles at the top are the Magic Eye\'s own. <b>Siblings</b>: across, turned by swiping or scrolling left and right (the zoom then swipes up and down), or up and down, turned by swiping up and down (the zoom then swipes across). <b>Zoom</b>: which way a swipe goes in, as a screen scrolls one way or the other and people find one natural: ↑ in, a swipe up goes in (the wheel rolled down, or two fingers pushed up a trackpad that scrolls naturally), or ↑ out, the other way round. A pinch spread always goes in. On the rail, <b>glide</b> lets a swipe or a flick carry on, across rungs or round the ring, and settle on the nearest; <b>step</b> moves one rung, or one sibling, a gesture.</p>' +
    '<p>Keys: − PageDown Enter in, + PageUp Backspace out; the arrows along the ring turn it and the other two zoom (↓ in and ↑ out, or with the siblings up and down → in and ← out); ~ the whole ring, Home the top, End the spindle\'s end; in a stack, [ and ] take the lane before or after in hand. A tap on a sibling turns you to it; a tap on the one you face walks you in.</p>' +
    // weft (eye.11), 17 Nov 2026, at David's word: the directory laid flat
    '<h3>The directory</h3><p>The Magic Eye\'s other shapes (at the top, <b>block</b> is the ring, <b>beach</b> the directory laid flat, <b>universe</b> the room). Laid flat you look down on the block: every point is a square, its own words at its head and the places inside it beneath, the ten digits standing as a phone\'s keypad (1 to 9 in rows of three, 0 under the 8), so where a card stands is its address and a gap stays a gap. The deeper inside a place something stands, the smaller it is drawn: a large card, a card, an icon, a title, a mark. <b>Drag</b> to move across; <b>pinch</b>, or scroll the wheel, to zoom; let go and the view settles on the nearest whole place, which becomes the point, as the address bar says. A tap on any card flies there. On the rail, <b>+</b> and <b>−</b> go out and in a rung, <b>‹ ›</b> to the place before or after, ◎ <b>Block</b> back to the ring; with glide a drag let go carries on, with step it settles where it is.</p>' +
    '<p><b>Zoom out past a block\'s top</b> and the plane goes on into the beach: the block among its family (its spine, its law, its room and everyone\'s mirrors), the proposals as their list orders them, the other families, the shells (the blocks of a person or an agent, known by their passport), and the rest gathered by the first word of their names. <b>Find</b>, at the top right, takes a block\'s name, words in the blocks read so far, or an address in this block, and flies there along the one shortest path: out until both places stand in sight, across, then in. Keys: − PageDown Enter in, + PageUp Backspace out, the arrows to the neighbour that way, Home the block\'s top, U every block on the beach, / to find, ~ the ring. A place above a block\'s top has a link of its own, as <a href="/eye?uni=B">/eye?uni=B</a> (every block) does, and any link with <b>?fly</b> opens on every block on the beach and flies to its place, as <a href="/eye/spine:the-sea/1.18?fly">/eye/spine:the-sea/1.18?fly</a> does: a link your own AI hands you plays as a flight.</p>' +
    // weft (eye.12), 17 Nov 2026, at David's word ('In the room'): the same directory seen from inside
    '<h3>The room</h3><p>The directory seen from inside (at the top, <b>universe</b>): laid flat rolled round you, moving as laid flat moves. You stand in the room the place you face stands in, its square rolled round you like the inside of a drum: across it is once round you, so turning round brings you back, and down it is down the wall, so where a place stands is still its address. The wall is drawn through a lens centred where you look, so the place in front is the size laid flat would draw it, and toward the edges the wall bends away round you. <b>Drag</b>, or swipe two fingers on a trackpad, to move round the room and up and down its wall; <b>pinch</b> (a trackpad\'s pinch, or the wheel with ctrl, alt or cmd) to zoom; let go and you settle on the nearest whole place, which becomes the point. A <b>tap</b> on a place goes to it, and a tap on the one you face goes in; a <b>double tap</b> comes out, to the room around, its places round you. <b>◎ Centre</b> on the rail (or C) stands you in the middle of the beach, the room every room stands in, its sets round you: turn, or look up and down, to read them, and tap one to go in. Centre again (or Esc) takes you back to the place you faced, and a double tap or a pinch out steps you out, the beach before you as one place. As you zoom, the room you stand in grows into the room around it or shrinks into the place you go into, so nothing jumps. The rail, the arrows, Find and links move as they do laid flat. A link with <b>?room</b> opens in the room.</p>' +
    // weft (eye.8), 17 Nov 2026, at David's word: the stack, and the snapshot
    '<h3>The stack</h3><p>With <b>Stack</b> on (at the top, in the Magic Eye), more blocks stand beside the one you look at, a lane each, on the direction the ring and the zoom leave free: one above another as rows when the siblings run across, side by side as columns when they run up and down. Each lane is its own call, its block, its spindle and its point, so a place, a time and who is there can be laid together and each walked along its own spindle. Add a lane with <b>＋ row</b> (or column) among the doors, which opens the blocks; with ✳, beside any block the point reaches; or with ◐, the family\'s other blocks at the same address, which join <b>in step</b>: they go to the address the lane in hand goes to, as far as each block holds it. The chain at a lane\'s top right puts it in step or lets it move on its own, and × lets it go. A touch, the wheel, or [ and ] takes a lane in hand: the rail, the doors and the address bar are its, and a tap on another lane only takes it. In a lane the size you chose is drawn where it fits, else the next smaller; at page size only the lane in hand shows. The link carries the whole stack, nine lanes at most, as a node holds nine.</p>' +
    '<h3>Snapshot</h3><p><b>Snapshot</b>, beside <i>＋ keep</i> in the row of your spindles, fires the lanes as one: what an LLM is handed by those calls, in order. The walk to each point is what stands decided; the rings beneath a point, where its call looks past the spindle\'s end, are what is still open. Copy the calls, for an AI that reads the beach itself, or the words they reach, every rung whole, for any AI: a context window composed by hand. Nothing is sent and nothing is written.</p>' +
    // weft (eye.7), 16 Nov 2026, at David's word: the hyperlinks
    '<h3>Hyperlinks</h3><p>A card that is a page carries a link in its top right corner, in Iris and Magic Eye, at every size, as the first hypertext\'s index cards did: the chain goes to its page on this site, in this tab (the back button brings you back to this place), and ↗ jumps to a website elsewhere, in a new tab. ⚙ shows or hides them.</p>' +
    '<h3>Size</h3><p>Each point has five sizes, pscale versions of itself: the whole page at pscale 0, then a large card, a card, an icon with its title, and the title alone, each a rung further out. A larger size shows more of the point\'s own words, never more structure. The page is the point and everything beneath it read as one page, or, where this navigator can frame it, the point\'s own web page, which you can then use as a browser. The icon is the address drawn as a walk from the rim toward the centre, or in Snazzy the page\'s own picture. # shows each address and pscale.</p>' +
    '<h3>Look</h3><p><b>Eye</b> is this navigator\'s own look: every point drawn from its own words. <b>Standard</b> and <b>Snazzy</b> show the thing itself where a point has one. A point with a page of its own on this site (a proposal, a document, a page its words name) shows that page on the card you look at, live and in miniature once you rest on it; tap the miniature, or choose page size, to use it here. Standard shows the plain page drawn from its blocks; Snazzy the page its law names, in its own colours and letters, with its picture. A share on the String shows the thing shared in Snazzy, and the share\'s own page in Standard. A link anywhere else stays a link, opened beside the eye.</p>' +
    '<h3>Links</h3><p>Every place here is a link you can share or put in a page, and the link is the call: the address bar reads happyseaurchin.com/eye/, then the block\'s name, then the spindle, then, where the point is not the spindle\'s end, the point\'s pscale, as in <a href="/eye/spine:the-sea/1.118/0">/eye/spine:the-sea/1.118/0</a> (the first step, on the spindle that runs to 1.118). The beach\'s own wire writes the same three as <a href="/eye?block=spine:the-sea&amp;spindle=1.118&amp;pscale=0">?block=&amp;spindle=&amp;pscale=</a>, which works here too. A pscale below the spindle\'s end opens the sub-directory beneath it; a pscale with no spindle puts the point on the block\'s own way, as <a href="/eye/now:happyseaurchin?pscale=2">/eye/now:happyseaurchin?pscale=2</a> does (today); a link with the address alone, as <a href="/eye/spine:the-sea/1.18">/eye/spine:the-sea/1.18</a>, stands at the spindle\'s end. A link can also ask for a look or a size, as <a href="/eye/proposals?look=snazzy&amp;size=page">?look=snazzy&amp;size=page</a> does.</p>' +
    '<p class="src">' + (store.snap.size ? 'Snapshot taken ' + esc(fmtStamp(META.stamp)) + '. ' : '') + (store.live ? 'This copy is reading the beach live.' : store.snap.size ? 'This copy reads the snapshot; hosted on happyseaurchin.com it reads the beach live.' : 'The beach could not be read just now.') + ' Iris and Magic Eye is keel\'s, one of the pages at <a href="/">happyseaurchin.com</a>.</p>';
  openSheet('How to move', body);
}

/* weft, 16 Nov 2026 (eye.2): A DRAG MOVES WHAT IS UNDER IT. Over a strip or a column that scrolls that way, a drag
 * scrolls it: a finger by the browser, a mouse here, as a finger would. Anywhere else in the curved walk a drag is a
 * move of the geometry, however slowly it is made: up the spindle and down it (drag up to go in, −; drag down to come

const SCROLLERS = '.kids, .frow-ring, .flat-col, .cols, .dir-col, .doc, .s-big .b, .s-page, .panel-list';
function dragScroller(t, ax) {
  for (let el = t && t.closest ? t.closest(SCROLLERS) : null; el && stage.contains(el); el = el.parentElement && el.parentElement.closest(SCROLLERS)) {
    if (ax === 'x' ? el.scrollWidth > el.clientWidth + 1 : el.scrollHeight > el.clientHeight + 1) return el;
  }
  return null;
}
let g = null;
stage.addEventListener('dragstart', e => e.preventDefault());
stage.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  if (e.target.closest && e.target.closest('textarea, input, select')) return;
  g = { x: e.clientX, y: e.clientY, t: performance.now(), id: e.pointerId, target: e.target, mouse: e.pointerType === 'mouse', ax: '', sc: null, sx: 0, sy: 0 };
});
window.addEventListener('pointermove', e => {

    g.ax = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
    if (g.mouse) {
      stage.classList.add('dragging');
      try { const sel = getSelection(); if (sel && !sel.isCollapsed) sel.removeAllRanges(); } catch (_) { /* nothing selected */ }
      g.sc = state.view === 'main' && state.axis === 'iris' ? dragScroller(g.target, g.ax) : null;
      if (g.sc) { g.sx = g.sc.scrollLeft; g.sy = g.sc.scrollTop; g.sc.style.scrollSnapType = 'none'; }
    }
  }

});
function endDrag(e, cancelled) {
  if (!g || e.pointerId !== g.id) return;
  const s = g; g = null; stage.classList.remove('dragging');
  if (s.sc) { s.sc.style.scrollSnapType = ''; swallowClick = performance.now() + 350; return; }
  if (cancelled) return;
  const dx = e.clientX - s.x, dy = e.clientY - s.y, ax = Math.abs(dx), ay = Math.abs(dy);
  if (Math.max(ax, ay) < (s.mouse ? 36 : 44)) return;

  const horiz = ax > ay * 1.3, vert = ay > ax * 1.3;

}

  } catch (e) { /* inside a sandbox the beach is out of reach; the snapshot serves */ }

  let asked = ''; if (link.block && cur()) asked = placeFromLink(cur(), link); // weft (eye.5): the link is the call
  const missed = link.block && !cur() ? link.block : '';

  const uni = Q0.get('uni'); if (uni && /^(B$|S:|P:)/.test(uni)) { DR.above = uni; DR.placeKey = placeKey(); }
  const fly = Q0.get('fly'); if (fly !== null) DR.from = /^(B$|S:|P:)/.test(fly) ? fly : 'B';   // ?fly: from every block on the beach to the place
