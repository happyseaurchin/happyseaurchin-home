<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Come in — the entrance</title>
<meta name="description" content="Two questions and you are somewhere: which world, and how present you want to be in it.">
<meta property="og:title" content="Come in — the entrance">
<meta property="og:description" content="Two questions and you are somewhere. Nothing to join.">
<link rel="icon" href="/assets/torus.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Space+Mono:wght@400;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme.css">
<script src="/theme.js"></script>
<style>
  /* THE ENTRANCE — TWO QUESTIONS, one at a time: which world, then how present
     you want to be in it. Each choice opens to everything the block holds about
     it — what it is like, who hears you and how soon, and the line to copy. The
     words are the block `entrance` at the beach and never this file, so they
     change by a write rather than a deploy. A cell's block address is the page's
     own query, so /entrance?at=2.1 is a link an email can carry straight to one
     way in. Every way OUT opens in a new tab: a person who has come this far
     should still have the door behind them when they come back. */
  *{box-sizing:border-box} html,body{margin:0}
  body{
    font-family:var(--body); color:var(--foam); font-size:17.5px; line-height:1.55;
    background:radial-gradient(1100px 560px at 70% -10%, rgba(var(--liquid-rgb),0.10), transparent 60%),
      linear-gradient(180deg,var(--ground-top) 0%, var(--deep) 30%, var(--abyss) 100%);
    -webkit-font-smoothing:antialiased; min-height:100dvh;
  }
  ::selection{background:rgba(var(--liquid-rgb),0.30);color:var(--foam)}
  a{color:var(--liquid);text-decoration:none;border-bottom:1px solid rgba(var(--liquid-rgb),0.35)}
  a:hover{color:var(--foam);border-color:var(--foam)}
  button{font-family:var(--mono);cursor:pointer}
  button:focus-visible,a:focus-visible{outline:2px solid var(--liquid);outline-offset:3px}
  .wrap{max-width:720px;margin:0 auto;padding:0 18px 40px}

  .bar{position:sticky;top:0;z-index:10;background:rgba(var(--well-rgb),0.72);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:12px 18px;
    font-family:var(--mono);font-size:12px;letter-spacing:0.08em;color:var(--vapour-dim);flex-wrap:wrap}
  .bar .dot{width:6px;height:6px;border-radius:50%;background:var(--liquid);box-shadow:0 0 10px var(--liquid);flex:none}
  .bar b{color:var(--foam)}
  .bar .spacer{flex:1}
  .bar a{border-bottom:none;color:var(--vapour-dim)} .bar a:hover{color:var(--liquid)}
  .bar button{background:none;border:1px solid var(--line);border-radius:4px;color:var(--vapour-dim);
    font-family:var(--mono);font-size:12px;padding:6px 10px}
  .bar button:hover{color:var(--foam);border-color:var(--line-strong)}
  .bar button[aria-pressed="true"]{color:var(--liquid);border-color:rgba(var(--liquid-rgb),0.45)}

  .head{padding:26px 0 4px}
  .head .step{font-family:var(--mono);font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--solid);margin:0 0 10px}
  .head h1{font-family:var(--display);font-weight:800;font-size:clamp(1.9rem,7.5vw,2.7rem);line-height:1.06;margin:0 0 10px}
  .head h1 .cool{color:var(--liquid)}
  .head p{margin:0;color:var(--vapour);font-size:1.03rem}
  .back{background:none;border:none;color:var(--vapour-dim);font-family:var(--mono);font-size:12px;
    letter-spacing:0.08em;padding:6px 0;margin:18px 0 0}
  .back:hover{color:var(--liquid)}

  /* THE BIG BUTTONS — one column always, a choice made with a thumb. The whole
     plate goes; the chevron beside it opens the words in place. */
  .choices{display:flex;flex-direction:column;gap:14px;margin:22px 0 0}
  /* a cell arrived at by ?at= clears the sticky bar rather than hiding under it */
  .choice{scroll-margin-top:76px;border:1px solid var(--line-strong);border-radius:16px;overflow:hidden;
    background:linear-gradient(165deg,rgba(var(--card-hi-rgb),0.62) 0%,rgba(var(--card-rgb),0.62) 100%)}
  .choice.hot{border-color:rgba(var(--liquid-rgb),0.40)}
  .choice.cool{background:none;border-style:dashed}
  .choice.shut{opacity:0.7;border-style:dashed}
  .plate{display:flex;align-items:stretch}
  .go{flex:1;min-width:0;text-align:left;background:none;border:none;border-bottom:none;color:var(--foam);
    font-family:var(--body);padding:20px 8px 20px 22px;display:block}
  a.go:hover{border-bottom:none}
  .go .lab{font-family:var(--display);font-weight:700;font-size:clamp(1.2rem,4.8vw,1.5rem);line-height:1.15;display:block;margin:0 0 5px;color:var(--foam)}
  .choice.cool .go .lab{font-size:1.08rem;color:var(--vapour)}
  .go .feel{display:block;color:var(--vapour);font-size:1rem;line-height:1.45}
  .choice.cool .go .feel{color:var(--vapour-dim);font-size:0.94rem}
  .go:hover .lab{color:var(--liquid)}
  .more{flex:none;width:60px;background:none;border:none;border-left:1px solid var(--line);
    color:var(--vapour-dim);font-size:19px;line-height:1;display:grid;place-items:center}
  .more:hover{color:var(--liquid);background:rgba(var(--wash-rgb),0.05)}
  .more span{display:block;transition:transform .18s ease}
  .choice.open .more span{transform:rotate(180deg)}

  .chip{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:0.12em;
    text-transform:uppercase;padding:3px 8px;border-radius:999px;
    border:1px solid var(--line-strong);color:var(--vapour-dim)}
  .chip.on{color:var(--liquid);border-color:rgba(var(--liquid-rgb),0.45)}

  .words{display:none;padding:0 22px 20px;border-top:1px solid var(--line)}
  .choice.open .words{display:block}
  .words p{margin:14px 0 0;color:var(--vapour);font-size:1rem}
  .words p.say{font-style:italic;color:var(--foam)}
  .words .who{font-family:var(--mono);font-size:11.5px;letter-spacing:0.03em;color:var(--vapour-dim);line-height:1.7}
  .words .addr{display:flex;gap:8px;align-items:center;margin:14px 0 0}
  .words .addr code{flex:1;min-width:0;overflow-wrap:anywhere;background:rgba(var(--well-rgb),0.6);
    border:1px solid var(--line-strong);border-radius:8px;padding:9px 11px;font-family:var(--mono);font-size:12px;color:var(--foam)}
  .words .addr button{background:none;border:1px solid var(--line-strong);border-radius:8px;color:var(--vapour);
    font-size:11px;padding:8px 11px;flex:none}
  .words .addr button:hover{color:var(--foam);border-color:var(--foam)}
  .words .at{font-family:var(--mono);font-size:10.5px;letter-spacing:0.1em;color:var(--solid);margin:16px 0 0}

  .loading{color:var(--vapour-dim);font-family:var(--mono);font-size:12px;padding:26px 0}
  .foot{max-width:720px;margin:0 auto;padding:10px 18px 44px;font-family:var(--mono);font-size:11px;
    letter-spacing:0.05em;color:var(--vapour-dim);display:flex;gap:14px;flex-wrap:wrap;line-height:1.9}
  .foot a{border-bottom:none;color:var(--vapour-dim)} .foot a:hover{color:var(--liquid)}
</style>
</head>
<body>
<script>document.documentElement.classList.remove('no-js');</script>

<div class="bar">
  <span class="dot"></span>
  <span><b>entrance</b> · happyseaurchin.com</span>
  <span class="spacer"></span>
  <button type="button" id="btn-words" aria-pressed="false" title="open every choice at once">show the words</button>
  <button id="btn-theme" title="light or dark">◐</button>
</div>

<main class="wrap">
  <header class="head">
    <p class="step" id="step">first question</p>
    <h1 id="title">Where do you want to <span class="cool">be?</span></h1>
    <p id="lede">Two questions and an immersive experience. Nothing to join, no account, no email.</p>
  </header>
  <div class="choices" id="choices"><p class="loading">reading the entrance…</p></div>
  <button class="back" id="back" hidden>← back</button>
</main>

<div class="foot">
  <a href="/explain?block=entrance" target="_blank" rel="noopener">this page as a block on the beach →</a>
</div>

<script>
(function(){
'use strict';
const BEACH = 'https://beach.happyseaurchin.com/.well-known/pscale-beach';
const $ = id => document.getElementById(id);
const esc = s => { const d = document.createElement('span'); d.textContent = s == null ? '' : s; return d.innerHTML; };

async function readBlock(name){
  const r = await fetch(BEACH + '?block=' + encodeURIComponent(name), { headers:{Accept:'application/json'}, cache:'no-store' });
  if (r.status === 404) return null;
  if (!r.ok) throw new Error('beach read failed: ' + r.status);
  return r.json();
}
function voiceOf(node){
  let n = node;
  while (n && typeof n === 'object') { if (!('_' in n)) return null; n = n['_']; }
  return typeof n === 'string' ? n : null;
}
function digitKeys(node){
  if (!node || typeof node !== 'object') return [];
  return Object.keys(node).filter(k => /^[1-9]$/.test(k)).sort((a,b) => a - b);
}
/* the block's own stated form: "label — the line". First em-dash only. */
function saying(text){
  const t = (text || '').trim();
  const i = t.indexOf(' — ');
  if (i < 0) return { lab: t, line: '' };
  return { lab: t.slice(0, i).trim(), line: t.slice(i + 3).trim() };
}
function firstSentence(s){
  const m = (s || '').match(/^[\s\S]*?[.!?](\s|$)/);
  return m ? m[0].trim() : (s || '').trim();
}
const leaf = (node, d) => (node && typeof node === 'object' && typeof node[d] === 'string') ? node[d].trim() : '';

let BLOCK = null, WORLD = null, ALL = false;

/* the two kinds of top position, derived: a world has ways beneath it, a side has leaves */
function tops(){
  const out = { worlds: [], sides: [] };
  digitKeys(BLOCK).forEach(d => {
    const n = BLOCK[d];
    (digitKeys(n).some(k => n[k] && typeof n[k] === 'object') ? out.worlds : out.sides).push(d);
  });
  return out;
}

function cellHTML(addr, lab, feel, where, what, who, say, cool){
  const shut = !where;
  return '<section class="choice ' + (cool ? 'cool' : 'hot') + (shut ? ' shut' : '') + '" data-at="' + esc(addr) + '">' +
    '<div class="plate">' +
      (where
        ? '<a class="go" href="' + esc(where) + '" target="_blank" rel="noopener"><span class="lab">' + esc(lab) + '</span>' + (feel ? '<span class="feel">' + esc(feel) + '</span>' : '') + '</a>'
        : '<button type="button" class="go"><span class="lab">' + esc(lab) + '</span>' + (feel ? '<span class="feel">' + esc(feel) + '</span>' : '') + '</button>') +
      '<button type="button" class="more" aria-label="what this is"><span>⌄</span></button>' +
    '</div>' +
    '<div class="words">' +
      '<p><span class="chip ' + (shut ? '' : 'on') + '">' + (shut ? 'not open yet' : 'open') + '</span></p>' +
      (what ? '<p>' + esc(what) + '</p>' : '') +
      (who  ? '<p class="who">' + esc(who) + '</p>' : '') +
      (where ? '<div class="addr"><code>' + esc(where) + '</code><button type="button" class="cp">copy</button></div>' : '') +
      (say  ? '<p class="say">' + esc(say) + '</p>' : '') +
      '<p class="at">entrance:' + esc(addr) + '</p>' +
    '</div>' +
  '</section>';
}

function render(){
  const box = $('choices');
  const t = tops();
  if (!WORLD){
    $('step').textContent = 'first question';
    $('title').innerHTML = 'Where do you want to <span class="cool">be?</span>';
    $('lede').textContent = 'Two questions and an immersive experience. Nothing to join, no account, no email.';
    $('back').hidden = true;
    box.innerHTML = t.worlds.map(d => {
      const said = saying(voiceOf(BLOCK[d]));
      /* A WORLD'S SENTENCES ARE SPENT IN ORDER by the rungs that show them: the
         first is the line it wears HERE, the second is the line it wears once
         you are inside it, and the rest is what more there is to say. One
         underscore, read by three rungs, and no position spent on any of it. */
      const first = firstSentence(said.line);
      const after = said.line.slice(first.length).trim();
      const rest = after.slice(firstSentence(after).length).trim();
      /* a world is not a destination — its plate asks the second question */
      return '<section class="choice hot" data-at="' + d + '" data-world="' + d + '">' +
        '<div class="plate">' +
          '<button type="button" class="go"><span class="lab">' + esc(said.lab) + '</span><span class="feel">' + esc(first) + '</span></button>' +
          '<button type="button" class="more" aria-label="what this is"><span>⌄</span></button>' +
        '</div>' +
        '<div class="words"><p>' + esc(rest || after || first) + '</p><p class="at">entrance:' + d + '</p></div>' +
      '</section>';
    }).join('') + t.sides.map(d => {
      const said = saying(voiceOf(BLOCK[d]));
      return cellHTML(d, said.lab, said.line, leaf(BLOCK[d],'1'), leaf(BLOCK[d],'2'), leaf(BLOCK[d],'3'), leaf(BLOCK[d],'4'), true);
    }).join('');
  } else {
    const w = BLOCK[WORLD], said = saying(voiceOf(w));
    $('step').textContent = 'second question · ' + said.lab.toLowerCase();
    $('title').innerHTML = 'How present do you want to <span class="cool">be?</span>';
    $('lede').textContent = firstSentence(said.line.slice(firstSentence(said.line).length).trim()) || firstSentence(said.line);
    $('back').hidden = false;
    box.innerHTML = digitKeys(w).map(k => {
      const c = w[k], s = saying(voiceOf(c));
      return cellHTML(WORLD + '.' + k, s.lab, s.line, leaf(c,'1'), leaf(c,'2'), leaf(c,'3'), leaf(c,'4'), false);
    }).join('');
  }
  if (ALL) [].forEach.call(box.querySelectorAll('.choice'), c => c.classList.add('open'));
}

$('choices').addEventListener('click', e => {
  const sect = e.target.closest('.choice'); if (!sect) return;
  if (e.target.closest('.cp')){
    const b = e.target.closest('.cp'), code = sect.querySelector('.addr code');
    navigator.clipboard.writeText(code.textContent.trim()).then(
      () => { b.textContent = 'copied'; setTimeout(() => b.textContent = 'copy', 1600); }, () => {});
    return;
  }
  if (e.target.closest('.more')) { sect.classList.toggle('open'); return; }
  const go = e.target.closest('.go');
  if (!go) return;
  if (sect.dataset.world){                    /* a world asks the second question */
    WORLD = sect.dataset.world;
    history.replaceState(null, '', '?at=' + WORLD);
    render(); scrollTo(0,0);
  } else if (go.tagName !== 'A'){             /* a way that is not open explains itself */
    sect.classList.add('open');
  }
});

$('btn-words').addEventListener('click', () => {
  ALL = !ALL;
  $('btn-words').setAttribute('aria-pressed', String(ALL));
  $('btn-words').textContent = ALL ? 'hide the words' : 'show the words';
  render();
});
$('back').addEventListener('click', () => {
  WORLD = null; history.replaceState(null, '', location.pathname); render(); scrollTo(0,0);
});

readBlock('entrance').then(b => {
  if (!b) { $('choices').innerHTML = '<p class="loading">the entrance is not published yet.</p>'; return; }
  BLOCK = b;
  /* ?at=<address> — the cell's block address IS the page's query, so a targeted
     email links one way in without a route of its own. */
  const at = (new URLSearchParams(location.search).get('at') || '').replace(/[^0-9.]/g,'').replace(/\./g,'');
  if (at && BLOCK[at[0]] && digitKeys(BLOCK[at[0]]).some(k => BLOCK[at[0]][k] && typeof BLOCK[at[0]][k] === 'object')) WORLD = at[0];
  render();
  if (at && at[1]){
    const s = document.querySelector('[data-at="' + at[0] + '.' + at[1] + '"]');
    /* 'nearest' leaves the page alone when the cell is already on screen — the
       first of three usually is, and scrolling it anyway hid the question behind
       the bar. */
    if (s) { s.classList.add('open'); s.scrollIntoView({ block:'nearest' }); }
  }
}).catch(e => { $('choices').innerHTML = '<p class="loading">' + esc('could not read the entrance: ' + e.message) + '</p>'; });

/* the go menu is the site's — the ways in and around; a walker who arrived carrying
   a handle keeps the way back to their own now */
const CARRIED = (new URLSearchParams(location.search).get('h') || '').replace(/[^a-z0-9 _-]/gi,'').trim() || null;
if (window.siteDoors) siteDoors({ handle: CARRIED, here: 'entrance', site: true });
})();
</script>
</body>
</html>
