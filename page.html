<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A page — one handle, outward</title>
<meta name="description" content="The outward face of a handle on the beach: who they are, what they said today, their posts with every reader's answer beside them, and their parlour — read with no account, answered with a key you invent. At a world, a character: who they are, where they stand, the room now.">
<meta property="og:title" content="A page — one handle, outward">
<meta property="og:description" content="Who they are, what they said today, their posts with every reader's answer beside them, their parlour. At a world: where they stand, the room now.">
<link rel="icon" href="/assets/torus.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Space+Mono:wght@400;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme.css">
<script src="/theme.js"></script>
<style>
  *{box-sizing:border-box} html,body{margin:0}
  body{
    font-family:var(--body); color:var(--foam); font-size:17.5px; line-height:1.58;
    background:radial-gradient(1100px 560px at 70% -10%, rgba(var(--liquid-rgb),0.10), transparent 60%),
      linear-gradient(180deg,var(--ground-top) 0%, var(--deep) 30%, var(--abyss) 100%);
    -webkit-font-smoothing:antialiased; min-height:100dvh;
  }
  ::selection{background:rgba(var(--liquid-rgb),0.30);color:var(--foam)}
  a{color:var(--liquid);text-decoration:none;border-bottom:1px solid rgba(var(--liquid-rgb),0.35)}
  a:hover{color:var(--foam);border-color:var(--foam)}
  .hidden{display:none !important}
  button{font-family:var(--mono);cursor:pointer}
  button:focus-visible,textarea:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--liquid);outline-offset:2px}
  .wrap{max-width:680px;margin:0 auto;padding:0 18px}

  .bar{display:flex;align-items:center;gap:10px;padding:14px 18px 10px;font-family:var(--mono);font-size:12px;letter-spacing:0.08em;color:var(--vapour-dim);max-width:680px;margin:0 auto}
  .bar .dot{width:6px;height:6px;border-radius:50%;background:var(--liquid);box-shadow:0 0 10px var(--liquid);flex:none}
  .bar b{color:var(--foam)}
  .bar a{border-bottom:none;color:var(--vapour-dim)} .bar a:hover{color:var(--liquid)}
  .bar .spacer{flex:1}
  .bar button{background:none;border:1px solid var(--line);border-radius:4px;color:var(--vapour-dim);font-family:var(--mono);font-size:12px;padding:6px 10px}
  .bar button:hover{color:var(--foam);border-color:var(--line-strong)}

  /* no handle: ask, exactly as /now asks */
  .ask{max-width:520px;margin:0 auto;padding:60px 22px}
  .ask h1{font-family:var(--display);font-weight:800;font-size:clamp(1.8rem,7vw,2.4rem);line-height:1.1;margin:0 0 12px}
  .ask h1 .cool{color:var(--liquid)}
  .ask p{color:var(--vapour);margin:0 0 16px}
  .ask__row{display:flex;gap:8px}
  .ask__row input{flex:1;background:rgba(var(--well-rgb),0.6);border:1px solid var(--line-strong);border-radius:8px;color:var(--foam);font-family:var(--mono);font-size:14px;padding:11px 12px;outline:none}
  .ask__row input:focus{border-color:var(--liquid)}
  .ask__row button{background:var(--liquid);border:none;border-radius:8px;color:var(--abyss);font-weight:700;font-size:13px;padding:11px 16px}

  .head{padding:12px 0 4px}
  .head h1{font-family:var(--display);font-weight:800;font-size:clamp(1.9rem,8vw,2.8rem);line-height:1.05;margin:0 0 10px}
  .head h1 .cool{color:var(--liquid)}
  .head h1 .at{font-family:var(--mono);font-size:12px;font-weight:400;letter-spacing:0.1em;color:var(--vapour-dim);display:block;margin-top:6px;text-transform:uppercase}
  .who{color:var(--vapour);margin:0 0 8px;font-size:1.05rem}
  .who.first{color:var(--foam);font-size:1.12rem}
  .who.look{font-style:italic}
  .who b{color:var(--foam);font-weight:600}
  .whoq{font-family:var(--mono);font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--liquid);margin:12px 0 4px}

  .sect{margin:26px 0 0}
  .sect > h2{font-family:var(--mono);font-size:11.5px;letter-spacing:0.14em;text-transform:uppercase;color:var(--liquid);margin:0 0 10px;display:flex;gap:10px;align-items:baseline}
  .sect > h2 .r{margin-left:auto;font-weight:400;letter-spacing:0.04em;text-transform:none}
  .sect > h2 a{border-bottom:none;color:var(--vapour-dim)} .sect > h2 a:hover{color:var(--liquid)}

  .today{background:linear-gradient(165deg,rgba(var(--card-hi-rgb),0.55) 0%,rgba(var(--card-rgb),0.55) 100%);border:1px solid rgba(var(--solid-rgb),0.35);border-radius:12px;padding:14px 16px}
  .today .when{font-family:var(--mono);font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--solid);margin:0 0 6px}
  .today .line{margin:0;font-size:1.08rem}
  .today .line.quiet{color:var(--vapour-dim);font-style:italic}

  /* the place — the room's own line on top, the way there above it, its fixtures beneath */
  .place{background:linear-gradient(165deg,rgba(var(--card-hi-rgb),0.55) 0%,rgba(var(--card-rgb),0.55) 100%);border:1px solid rgba(var(--liquid-rgb),0.35);border-radius:12px;padding:14px 16px}
  .place .crumbs{font-family:var(--mono);font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--vapour-dim);margin:0 0 8px}
  .place .crumbs b{color:var(--liquid);font-weight:400}
  .place .line{margin:0;font-size:1.12rem;line-height:1.5}
  .place .line b{color:var(--foam);font-weight:600}
  .place .line span{color:var(--vapour)}
  .place .line.quiet{color:var(--vapour-dim);font-style:italic;font-size:1rem}
  .place .fix{margin:10px 0 0;padding-top:8px;border-top:1px solid var(--line);color:var(--vapour);font-size:0.98rem}
  .place .fix p{margin:4px 0}
  .place .here{font-family:var(--mono);font-size:11px;color:var(--solid);margin:10px 0 0}

  /* the room now — the beats as the record has them */
  .room{border:1px solid var(--line);border-radius:14px;padding:12px 18px}
  .beat{display:flex;gap:12px;align-items:baseline;padding:9px 0;border-top:1px solid var(--line)}
  .beat:first-child{border-top:none}
  .beat .bwho{font-family:var(--mono);font-size:11px;color:var(--solid);flex:none;min-width:80px}
  .beat .btext{flex:1;min-width:0;color:var(--foam);font-size:1rem;white-space:pre-line}
  .beat .bago{font-family:var(--mono);font-size:10.5px;color:var(--vapour-dim);flex:none}
  .sees{margin:0 0 8px 92px;padding:8px 12px;border-left:2px solid rgba(var(--solid-rgb),0.45);color:var(--vapour);font-size:0.98rem;white-space:pre-line}
  .sees .sh{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:0.1em;text-transform:uppercase;color:var(--solid);margin:0 0 4px}
  .told{padding:9px 0 9px 12px;border-top:1px solid var(--line);border-left:2px solid rgba(var(--solid-rgb),0.45);color:var(--foam);font-size:1rem;white-space:pre-line}
  .told:first-child{border-top:none}
  .told .sh{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:0.06em;color:var(--vapour-dim);margin:0 0 4px}
  .ways{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
  .ways .why{font-family:var(--mono);font-size:11px;color:var(--vapour-dim);margin-right:2px}
  .ways button.way{background:none;border:1px solid var(--line-strong);border-radius:999px;color:var(--foam);font-size:12.5px;padding:6px 12px;cursor:pointer}
  .ways button.way:hover{border-color:var(--solid);color:var(--solid)}
  .ways button.way:disabled{opacity:0.5;cursor:default}
  .declared{margin:10px 0 0;padding-top:8px;border-top:1px dashed var(--line-strong)}
  .declared .dh{font-family:var(--mono);font-size:10.5px;letter-spacing:0.12em;text-transform:uppercase;color:var(--vapour-dim);margin:0 0 2px}
  .declared .btext{color:var(--vapour);font-style:italic}
  .act{margin-top:12px;border-top:1px dashed var(--line-strong);padding-top:12px}
  .act button{background:var(--solid)}
  .act button.ghost{background:none;border:1px solid var(--line-strong);color:var(--vapour-dim)}
  .act button.ghost:hover{color:var(--foam);border-color:var(--foam)}
  .earlier summary{cursor:pointer;font-family:var(--mono);font-size:11.5px;letter-spacing:0.08em;color:var(--vapour-dim);list-style:none;padding:6px 0}
  .earlier summary::-webkit-details-marker{display:none}
  .earlier summary::before{content:"▸ "} .earlier[open] summary::before{content:"▾ "}

  /* the key's prompt — the room's renderings and the hand open to the character's key */
  .closed{border:1px dashed var(--line-strong);border-radius:12px;padding:14px 16px;color:var(--vapour);margin-top:12px}
  .closed p{margin:0 0 10px}
  .closed p:last-child{margin:0}
  .closed button{background:var(--solid);border:none;border-radius:8px;color:var(--abyss);font-weight:700;font-size:13px;padding:9px 14px}
  .keyline{margin:10px 0 0;text-align:right;font-family:var(--mono);font-size:11px}
  .keyline a{border-bottom:none;color:var(--vapour-dim)} .keyline a:hover{color:var(--liquid)}

  /* the sheet's short lines */
  .sheet .sl{margin:0 0 6px;color:var(--vapour)}
  .sheet .sl.first{color:var(--foam)}

  .post{background:linear-gradient(165deg,rgba(var(--card-hi-rgb),0.55) 0%,rgba(var(--card-rgb),0.55) 100%);border:1px solid var(--line);border-radius:14px;padding:18px 20px 16px;margin:0 0 16px}
  .post .no{font-family:var(--mono);font-size:11px;color:var(--vapour-dim);margin:0 0 8px}
  .post .no b{color:var(--solid);font-weight:700}
  .post .no a{color:var(--vapour-dim);border-bottom:1px dashed rgba(var(--solid-rgb),0.4)} .post .no a:hover{color:var(--liquid)}
  .newpost{margin:6px 0 0;border:1px dashed var(--line-strong);border-radius:12px;padding:10px 14px}
  .newpost summary{cursor:pointer;font-family:var(--mono);font-size:11.5px;letter-spacing:0.08em;color:var(--vapour-dim);list-style:none}
  .newpost summary::-webkit-details-marker{display:none}
  .newpost summary::before{content:"▸ "} .newpost[open] summary::before{content:"▾ "}
  .newpost .say{margin-top:10px}
  .post .lede{font-size:1.14rem;line-height:1.5;font-weight:500;margin:0 0 10px;white-space:pre-line}
  .post .lede.absent{color:var(--vapour-dim);font-style:italic;font-weight:400}
  .parts summary{cursor:pointer;font-family:var(--mono);font-size:11.5px;letter-spacing:0.08em;color:var(--vapour-dim);list-style:none;padding:4px 0}
  .parts summary::-webkit-details-marker{display:none}
  .parts summary::before{content:"▸ "} .parts[open] summary::before{content:"▾ "}
  .part{display:flex;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
  .part .pn{font-family:var(--mono);font-size:11px;color:var(--vapour-dim);flex:none;min-width:34px;padding-top:4px}
  .part .pt{flex:1;color:var(--vapour);font-size:0.98rem;white-space:pre-line}

  .fold{margin:14px 0 0;border-top:1px solid var(--line);padding-top:10px}
  .fold .fh{font-family:var(--mono);font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--solid);margin:0 0 6px}
  .frow{display:flex;gap:12px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line)}
  .frow:last-child{border-bottom:none}
  .fwho{font-family:var(--mono);font-size:11px;color:var(--solid);flex:none;min-width:88px;text-align:right}
  .ftext{flex:1;min-width:0;color:var(--foam);font-size:1rem;white-space:pre-line}
  .ftext .at{font-family:var(--mono);font-size:10.5px;color:var(--vapour-dim);margin-right:6px}
  .fnone{font-family:var(--mono);font-size:11.5px;color:var(--vapour-dim);padding:6px 0 2px}

  .answer{margin:12px 0 0;border-top:1px dashed var(--line-strong);padding-top:12px}
  .answer .ah{font-family:var(--display);font-weight:700;font-size:1.02rem;margin:0 0 8px}
  .answer .ah span{color:var(--vapour-dim);font-family:var(--body);font-weight:400;font-size:0.95rem}
  .say{display:flex;flex-direction:column;gap:8px}
  .say input,.say textarea{width:100%;background:rgba(var(--well-rgb),0.6);border:1px solid var(--line-strong);border-radius:8px;color:var(--foam);font-family:var(--body);font-size:1.02rem;padding:10px 12px;outline:none}
  .say input{font-family:var(--mono);font-size:13.5px}
  .say textarea{min-height:70px;resize:vertical;line-height:1.45}
  .say input:focus,.say textarea:focus{border-color:var(--liquid)}
  .say .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .say .row .why{font-family:var(--mono);font-size:11px;color:var(--vapour-dim);flex:1;min-width:160px}
  .say button{background:var(--liquid);border:none;border-radius:8px;color:var(--abyss);font-weight:700;font-size:13px;padding:10px 16px}
  .say button:disabled{opacity:0.5;cursor:default}
  .hint{font-family:var(--mono);font-size:12px;color:var(--vapour-dim);margin:6px 0 0;min-height:1.4em}
  .hint.ok{color:var(--solid)} .hint.err{color:var(--liquid)}

  .parlour{border:1px solid rgba(var(--solid-rgb),0.35);border-radius:14px;padding:16px 18px}
  .parlour .card{margin:0 0 10px;color:var(--vapour);white-space:pre-line}
  .vrow{display:flex;gap:10px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line)}
  .vwho{font-family:var(--mono);font-size:11px;color:var(--solid);flex:none;min-width:80px}
  .vtext{flex:1;color:var(--foam);font-size:0.98rem;white-space:pre-line}
  .vago{font-family:var(--mono);font-size:10.5px;color:var(--vapour-dim);flex:none}
  .vnone{font-family:var(--mono);font-size:11.5px;color:var(--vapour-dim);padding:8px 0}
  .parlour .say{margin-top:10px;border-top:1px dashed var(--line-strong);padding-top:12px}
  .parlour .say button{background:var(--solid)}

  .doors{display:grid;grid-template-columns:1fr;gap:10px}
  @media (min-width:600px){ .doors{grid-template-columns:1fr 1fr 1fr} }
  .doorc{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .doorc .lab{font-family:var(--mono);font-size:10.5px;letter-spacing:0.12em;text-transform:uppercase;color:var(--liquid);margin:0 0 4px}
  .doorc p{margin:0;font-size:0.95rem;color:var(--vapour)}
  .doorc code{font-family:var(--mono);font-size:11.5px;color:var(--foam);overflow-wrap:anywhere}

  .state{padding:60px 26px;text-align:center;max-width:480px;margin:0 auto}
  .state h2{font-family:var(--display);font-size:1.4rem;margin:0 0 10px}
  .state p{color:var(--vapour-dim)}

  .foot{max-width:680px;margin:0 auto;padding:26px 18px 44px;font-family:var(--mono);font-size:11px;letter-spacing:0.05em;color:var(--vapour-dim);display:flex;gap:14px;flex-wrap:wrap;line-height:1.9}
  .foot a{border-bottom:none;color:var(--vapour-dim)} .foot a:hover{color:var(--liquid)}

  /* a phone: a beat stacks — who and when on one line, the words beneath at full width;
     the bar drops the world's name, which the heading already says */
  @media (max-width:560px){
    .beat{flex-wrap:wrap;gap:2px 10px}
    .beat .bwho{min-width:0;order:0}
    .beat .bago{order:1;margin-left:auto}
    .beat .btext{order:2;flex-basis:100%}
    .sees{margin-left:0}
    #bar-world{display:none}
  }
</style>
</head>

<script>document.documentElement.classList.remove('no-js');</script>

<div class="bar">
  <span class="dot"></span>
  <span>the page · <b id="bar-handle">—</b><span id="bar-world" class="hidden"> · at <b id="bar-world-name"></b></span></span>
  <span class="spacer"></span>
</div>

<section id="ask" class="ask hidden">
  <h1>Whose <span class="cool">page</span>?</h1>
  <p id="ask-lede">Who they are, what they said today, their posts with every reader's answer beside them, and their parlour. Read with no account; answer with a key you invent.</p>
  <div class="ask__row">
    <input id="ask-handle" placeholder="a name — keel, weft, happyseaurchin" autocomplete="off" spellcheck="false" autocapitalize="none">
    <button id="ask-go" type="button">open</button>
  </div>
</section>

<main class="wrap hidden" id="main"></main>
<div id="state" class="state hidden"><h2 id="state-title"></h2><p id="state-body"></p></div>
<div class="foot" id="foot"></div>

<script>
(function(){
'use strict';
/* ── tiny beach client — the same dialect every o-page speaks. The page's beach is
   the apex, or the world named by ?world= (resolved below); a read may name another
   origin when a passport points at a map kept elsewhere. ── */
const APEX = 'https://beach.happyseaurchin.com';
const wk = origin => origin.replace(/\/+$/, '') + '/.well-known/pscale-beach';
let BEACH = APEX;            /* where this handle's own blocks live */
let WORLD_PARAM = null;      /* ?world= as the link said it, carried into the page's own links */
let WORLD = null;            /* the world's name for the mirror's links; null at the apex */
async function readBlock(name, origin){
  const r = await fetch(wk(origin || BEACH) + '?block=' + encodeURIComponent(name), { headers:{Accept:'application/json'}, cache:'no-store' });
  if (r.status === 404) return null;
  if (!r.ok) throw new Error('beach read failed: ' + r.status);
  return r.json();
}
async function readIndex(origin){
  const r = await fetch(wk(origin || BEACH), { headers:{Accept:'application/json'}, cache:'no-store' });
  if (!r.ok) throw new Error('beach index failed: ' + r.status);
  return r.json();
}
async function writeBlock(body, origin){
  const r = await fetch(wk(origin || BEACH), { method:'POST', cache:'no-store',
    headers:{'Content-Type':'application/json', Accept:'application/json'},
    body: JSON.stringify(body) });
  let d = null; try { d = await r.json(); } catch(e){}
  return { ok: r.ok, status: r.status, data: d };
}
const lockRequired = w => !w.ok && w.data && (w.data.code === 'lock_required' || w.data.error === 'lock_required');
const esc = s => { const d = document.createElement('span'); d.textContent = s == null ? '' : s; return d.innerHTML; };
const $ = id => document.getElementById(id);
const short = (s, n) => { s = s || ''; return s.length > n ? s.slice(0, n).replace(/\s+\S*$/, '') + ' …' : s; };
const host = origin => origin.replace(/^https?:\/\//, '');

/* ── a link names a WORLD, never an origin — the mirror's own law, carried here from
   xstream-bsp src/lib/world-to-beach.ts: a bare name reads the worlds register at the
   apex, then probes /w/<name>, then falls back to the sub-domain form; a URL must
   already belong to the beach's family (a /w/<name> table path kept, any other path
   dropped). A confirmed-unknown name is refused rather than minted as a phantom. ── */
const BARE_NAME = /^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$/i;
const TABLE_PATH = /^\/w\/[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$/i;
function beachFamily(){ const h = new URL(APEX).host; return h.startsWith('beach.') ? h : 'beach.' + h; }
function worldToBeach(world){
  const w = String(world || '').trim().replace(/\/+$/, '');
  if (!w) return null;
  const family = beachFamily();
  if (BARE_NAME.test(w)) return 'https://' + w + '.' + family;
  let u; try { u = new URL(w); } catch(e){ return null; }
  if (u.protocol !== 'https:') return null;
  const h = u.host.toLowerCase();
  if (h !== family && !h.endsWith('.' + family)) return null;
  const path = u.pathname.replace(/\/+$/, '');
  return TABLE_PATH.test(path) ? u.origin + path : u.origin;
}
/* the register's rows, wrapped eras first — '<name> → <route>[ → …]'; the route is FIELD TWO */
function registerRoutes(node){
  const out = new Map();
  (function walk(n){
    if (!n || typeof n !== 'object') return;
    if (n['_'] && typeof n['_'] === 'object') walk(n['_']);
    for (const k of digitKeys(n)){
      const v = n[k];
      if (typeof v === 'string'){ const p = v.split('→'); if (p.length >= 2 && p[0].trim() && p[1].trim()) out.set(p[0].trim().toLowerCase(), p[1].trim()); }
      else walk(v);
    }
  })(node);
  return out;
}
function routeToBeach(route){
  const r = String(route || '').trim().replace(/\/+$/, '');
  if (!r) return null;
  if (r.startsWith('/')) return TABLE_PATH.test(r) ? APEX + r : null;
  try { const u = new URL(/^[a-z][a-z0-9+.-]*:\/\//i.test(r) ? r : 'https://' + r); return u.protocol === 'https:' ? u.origin : null; } catch(e){ return null; }
}
async function resolveWorld(world){
  const w = String(world || '').trim().replace(/\/+$/, '');
  if (!w) return null;
  if (!BARE_NAME.test(w)) return worldToBeach(w);
  const name = w.toLowerCase();
  let registerChecked = false, probeEmpty = false;

/* the line standing at today: the day's own, else the latest part of the day beneath it */
function todayLine(now, c){
  if (!now || floorOf(now) !== 10) return null;
  const day = shallowVoice(walkTo(now, c.day));
  if (day) return { text: day, part: '' };
  let best = null;
  for (let g = 1; g <= 9; g++){
    const gn = walkTo(now, c.day + g);
    const gt = shallowVoice(gn);
    if (gt) best = { text: gt, part: DAY_PARTS[g - 1] };
    for (let b = 1; b <= 9; b++){
      const bt = shallowVoice(walkTo(now, c.day + g + b));
      if (bt) best = { text: bt, part: DAY_PARTS[g - 1] + ', beat ' + b };
    }
  }
  return best;
}

function toldElsewhere(){

/* staging, as the router's own stageLiquid does it: a first line OPENS the window — the buffer
   rebuilt whole with the open moment stamped at its underscore, which the fold and the dice
   both read; a later line is surgical — the author's own slot by identity, else the first
   free one, the arrival stamp at 6 kept across a revise; an empty line takes it back. A birth
   is verified by reading back, never trusted. */
async function declare(text){
  const name = 'liquid:pool:' + STAND.addr, key = latchGet();
  const fresh = await readBlock(name).catch(() => undefined);
  if (fresh === undefined) return 'the beach did not answer — nothing said';
  const now = new Date().toISOString();
  const slot = { '_': text, '1': HANDLE, '2': '', '3': now, '4': 'character', '6': now };
  const live = fresh ? declaredOf(fresh) : [];
  let body;
  if (!fresh || (text.trim() && !live.length)){
    const desc = 'Liquid pre-commit buffer for ' + name + ' (block-conventions:4.5) — one slot per author, overwriting; the social mirror of pending intentions before commit.';
    body = { block: name, content: { '_': desc + (text.trim() ? ' Window opened ' + now + '.' : ''), '1': slot } };
    if (fresh) body.confirm = true;
  } else {
    let mine = digitKeys(fresh).find(d => fieldOf(fresh[d], '1').toLowerCase() === HANDLE.toLowerCase()) || null;
    if (mine){ const prior = fresh[mine]; const arrived = [fieldOf(prior, '6'), fieldOf(prior, '2'), fieldOf(prior, '3')].find(isIso); if (arrived) slot['6'] = arrived; }
    else mine = '123456789'.split('').find(d => !(d in fresh)) || null;
    if (!mine) return 'every place at the table is taken just now — nothing said';
    body = { block: name, spindle: mine, content: slot };
  }
  if (key) body.secret = key;
  const w = await writeBlock(body);
  if (!w.ok) return lockRequired(w) ? 'the table refused that key — nothing said' : 'the beach refused it (' + w.status + ')';
  LIQUID = await readBlock(name).catch(() => LIQUID);
  const stands = myDeclared();
  if (text.trim() && !(stands && stands.text === text)) return 'the table did not keep the line — say it again';
  return true;
}
/* the router, over MCP from the browser (its CORS is open and the session id exposed):
   initialise, call one tool, hand back the text it answered with — the waker's router_call */
const ROUTER = 'https://bsp.hermitcrab.me/mcp/v1';
async function routerCall(tool, args){
  const rpc = async (payload, sid) => {
    const r = await fetch(ROUTER, { method:'POST', cache:'no-store',
      headers: Object.assign({ 'Content-Type':'application/json', Accept:'application/json, text/event-stream' }, sid ? { 'mcp-session-id': sid } : {}),
      body: JSON.stringify(payload) });
    if (!r.ok) throw new Error('router ' + r.status);
    return { sid: r.headers.get('mcp-session-id') || sid, body: await r.text() };
  };
  const init = await rpc({ jsonrpc:'2.0', id:1, method:'initialize', params:{ protocolVersion:'2024-11-05', capabilities:{}, clientInfo:{ name:'happyseaurchin-page', version:'1' } } });
  await rpc({ jsonrpc:'2.0', method:'notifications/initialized' }, init.sid);
  const res = await rpc({ jsonrpc:'2.0', id:2, method:'tools/call', params:{ name: tool, arguments: args } }, init.sid);
  const m = res.body.match(/^data: (.*)$/m);
  const d = JSON.parse(m ? m[1] : res.body);
  return ((d.result && d.result.content) || []).map(c => c.text || '').join('\n');
}
/* THE WAYS — where this place leads, each with its address, read off the room's envelope as
   the mirror reads it (kernel/envelope.ts parseWays): the only addresses a move may copy */
function waysOf(envelope){
  const ways = [];
  let inWays = false;
  for (const line of String(envelope || '').split('\n')){
    if (line.startsWith('# ')){ inWays = /^# The ways\b/.test(line); continue; }
    const m = inWays ? line.match(/^(\s*)\[(\d+)\]\s+(.*\S)\s*$/) : null;
    if (m) ways.push({ addr: m[2], label: m[3] });
  }
  return ways;
}

/* A WAY, TAPPED — the four-step move of grit 1.5, performed with the character's own key and
   no mind in it, exactly as the mirror's kernel/play/move.ts performs it: the departure said
   first so companions see it go (1.53), the leaving beat here, the position written and read
   back, the room ahead founded if absent (1.57), the arriving beat there — and the page
   follows the written position. A half-move is said as it stands, never papered over. */
const LOCATION_RE = /(Location:\s*\*:[^\s]+:spatial:[\w-]+:)(\d+(?:\.\d+)?)/;
async function goThere(way){
  const hint = $('a-hint'), key = latchGet();
  const say = (msg, cls) => { if (hint){ hint.innerHTML = msg || ''; hint.className = 'hint' + (cls ? ' ' + cls : ''); } };
  if (!key || !way){ say('to move, open ' + esc(HANDLE) + ' with the key first', 'err'); return; }
  const label = String(way.label || '').replace(/\s*\.\s*$/, ''), from = STAND.addr;
  const beat = (addr, text) => writeBlock({ block: 'pool:' + addr, append: true, content: { '_': text, '1': HANDLE, '2': '', '3': new Date().toISOString(), '4': 'character' } });
  const doors = [...document.querySelectorAll('button.way')];
  doors.forEach(b => b.disabled = true);
  say('setting off for ' + esc(wayName(way.label)) + '…');
  try {
    try { await declare('Setting off — for ' + label + '.'); } catch(e){}
    let w = await beat(from, 'Sets off — for ' + label + '.');
    if (!w.ok){ say('the leaving did not land — nothing has moved', 'err'); return; }
    const pp = await readBlock('passport:' + HANDLE).catch(() => null);
    const p3 = pp && typeof pp['3'] === 'string' ? pp['3'] : '';
    if (!LOCATION_RE.test(p3)){ say(esc(HANDLE) + ' carries no written location — genesis never placed them, so a move has nothing to rewrite', 'err'); return; }
    w = await writeBlock({ block: 'passport:' + HANDLE, spindle: '3', content: p3.replace(LOCATION_RE, (all, head) => head + way.addr), secret: key });
    if (!w.ok){ say('the world would not accept the move — ' + esc(HANDLE) + ' stays where they are', 'err'); return; }
    const back = await readBlock('passport:' + HANDLE).catch(() => null), at = back ? locationRef(back) : null;
    if (!at || at.addr !== way.addr){ say('the move did not read back — treat ' + esc(HANDLE) + ' as not moved', 'err'); return; }
    try { await routerCall('pscale_pool_engage', { agent_id: HANDLE, pool_url: BEACH, pool_name: way.addr, since_position: 0, purpose: 'pscale:grit/1' }); } catch(e){}
    w = await beat(way.addr, 'Arrives — ' + label + '.');
    try { await declare(''); } catch(e){}
    await load();
    if (!w.ok) say(esc(HANDLE) + ' has moved, but the arrival has not landed yet — say something here to announce them', 'err');
  } finally {
    doors.forEach(b => b.disabled = false);
  }
}
/* asked of the doorman: POST /fold {handle, passphrase, room} — synchronous, the outcome returned */
async function askTheDoorman(){
  let r;
  try {
    r = await fetch(WAKER + '/fold', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ handle: HANDLE, passphrase: latchGet() || '', room: STAND.addr }) });
  } catch(e){ return { reached: false }; }
  let d = null; try { d = await r.json(); } catch(e){}
  if (r.status === 429) return { reached: true, folded: false, detail: 'too many wrong keys were tried for ' + HANDLE + ' — the doorman waits an hour' };
  if (!d) return { reached: true, folded: false, detail: 'the doorman answered nothing readable (' + r.status + ')' };
  return { reached: true, folded: !!d.folded, detail: String(d.detail || d.status || '') };
}
async function rereadRoom(){

/* while its player has the page open, the room is re-read quietly when the table's own

function watchRoom(){

function setAt(block, walk, content){

    if (!n[k] || typeof n[k] !== 'object') n[k] = (typeof n[k] === 'string') ? { '_': n[k] } : {};
    n = n[k];

  }
  if (!HANDLE){
    $('ask').classList.remove('hidden');
    if (WORLD){
      $('ask-lede').textContent = 'A character at ' + WORLD + ': who they are, where they stand, the room now. Read with no account.';
      $('ask-handle').placeholder = 'a character\'s name';
    }
    $('ask-go').addEventListener('click', () => {
      const v = cleanHandle($('ask-handle').value);
      if (!v) return;
      const base = /\.html$/.test(location.pathname) ? location.pathname + '?handle=' + encodeURIComponent(v) : '/page/' + encodeURIComponent(v);
      location.href = base + (WORLD_PARAM ? (base.includes('?') ? '&' : '?') + 'world=' + encodeURIComponent(WORLD_PARAM) : '');
    });
    $('ask-handle').addEventListener('keydown', e => { if (e.key === 'Enter') $('ask-go').click(); });
    if (window.siteDoors) siteDoors({ handle: CARRIED, here: 'page' });
    return;
  }
  /* the go menu carries the walker who arrived, else this page's own handle — its other
     places. In a world the handle is a CHARACTER, who has no now, no here, no hands: the
     menu carries only a walker who arrived with the link, and offers what needs none.

     AND IT CARRIES NO FAMILY, because this page has none. A page is somebody's,
     not a project's, and passing the handle as the family made the two
     family-shaped doors point at a family named after a person: "projects" went
     to /walk/<handle>/<handle> and recency to /recency/<handle>/<handle>, both
     of them nowhere (David, 2026-09-17). Left out, theme.js does the right
     thing on its own — "projects" falls to /walk?h=<handle>, the walk's own ask
     with the walker kept, and recency falls to the now-clock. Its comment says
     why: standing at your own page, "which project" is a question worth being
     asked; "who are you" is not. /now and /hands have always passed no family;
     this only makes the page agree with them. */
  if (window.siteDoors) siteDoors(WORLD ? { handle: CARRIED, here: 'page' } : { handle: CARRIED || HANDLE, here: 'page' });
  load();
}
boot();
})();
</script>
