<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Come in — the entrance</title>
<meta name="description" content="Six ways in on one screen: the real world or a made-up one, live, on a page, or through your own assistant.">
<meta property="og:title" content="Come in — the entrance">
<meta property="og:description" content="Six ways in on one screen. Nothing to join.">
<link rel="icon" href="/assets/torus.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Space+Mono:wght@400;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme.css">
<script src="/theme.js"></script>
<style>
  /* ENTRANCE 1 — THE RECTANGLE. Every way in on one screen, nothing hidden behind a
     step. The tiles carry LABELS only until 'show the words' is pressed, which is
     the whole of the interaction: the compact form of /group, where the bar holds
     the acts and the canvas holds nothing but what you can hit. Its sibling
     /entrance2 asks the same thing as two questions; they read the SAME block
     (entrance, at the beach), so neither can drift from the other or from an
     outreach email quoting the same sentences. */
  *{box-sizing:border-box} html,body{margin:0}
  body{
    font-family:var(--body); color:var(--foam); font-size:17.5px; line-height:1.55;
    background:radial-gradient(1100px 560px at 70% -10%, rgba(var(--liquid-rgb),0.10), transparent 60%),
      linear-gradient(180deg,var(--ground-top) 0%, var(--deep) 30%, var(--abyss) 100%);
    -webkit-font-smoothing:antialiased; min-height:100dvh;
  }
  ::selection{background:rgba(var(--liquid-rgb),0.30);color:var(--foam)}
  a{color:var(--liquid);text-decoration:none;border-bottom:1px solid rgba(var(--liquid-rgb),0.35)}
  a:hover{color:var(--foam);border-color:var(--foam)}
  button{font-family:var(--mono);cursor:pointer}
  button:focus-visible,a:focus-visible{outline:2px solid var(--liquid);outline-offset:3px}
  .wrap{max-width:1000px;margin:0 auto;padding:0 18px 20px}

  .bar{position:sticky;top:0;z-index:10;background:rgba(var(--well-rgb),0.72);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:12px 18px;
    font-family:var(--mono);font-size:12px;letter-spacing:0.08em;color:var(--vapour-dim);flex-wrap:wrap}
  .bar .dot{width:6px;height:6px;border-radius:50%;background:var(--liquid);box-shadow:0 0 10px var(--liquid);flex:none}
  .bar b{color:var(--foam)}
  .bar .spacer{flex:1}
  .bar a{border-bottom:none;color:var(--vapour-dim)} .bar a:hover{color:var(--liquid)}
  .bar button{background:none;border:1px solid var(--line);border-radius:4px;color:var(--vapour-dim);
    font-family:var(--mono);font-size:12px;padding:6px 10px}
  .bar button:hover{color:var(--foam);border-color:var(--line-strong)}
  .bar button[aria-pressed="true"]{color:var(--liquid);border-color:rgba(var(--liquid-rgb),0.45)}

  .head{padding:22px 0 2px}
  .head h1{font-family:var(--display);font-weight:800;font-size:clamp(1.8rem,7vw,2.5rem);line-height:1.05;margin:0 0 8px}
  .head h1 .cool{color:var(--liquid)}
  .head p{margin:0;color:var(--vapour);font-size:1.02rem}

  /* THE RECTANGLE — two worlds side by side, the description at the side.
     On a phone it stacks and the description falls to the foot, which is the only
     place a narrow column can honestly go. */
  .rect{display:grid;grid-template-columns:1fr;gap:18px;margin:22px 0 0;align-items:start}
  @media (min-width:800px){ .rect{grid-template-columns:1fr 1fr 0.66fr;gap:20px} }

  .col h2{font-family:var(--mono);font-size:11px;letter-spacing:0.14em;text-transform:uppercase;
    color:var(--solid);margin:0 0 4px;font-weight:400}
  .col .voice{margin:0 0 12px;color:var(--vapour-dim);font-size:0.95rem;display:none}
  body.words .col .voice{display:block}

  .tiles{display:flex;flex-direction:column;gap:10px}
  .tile{display:block;border:1px solid var(--line-strong);border-radius:12px;padding:14px 16px;
    background:linear-gradient(165deg,rgba(var(--card-hi-rgb),0.58) 0%,rgba(var(--card-rgb),0.58) 100%);
    border-bottom:1px solid var(--line-strong)}
  a.tile:hover{border-color:rgba(var(--liquid-rgb),0.55)}
  a.tile:hover .lab{color:var(--liquid)}
  .tile .lab{display:block;font-family:var(--display);font-weight:700;font-size:1.06rem;line-height:1.25;color:var(--foam)}
  .tile .blurb{display:none;margin:7px 0 0;color:var(--vapour);font-size:0.94rem;line-height:1.45}
  body.words .tile .blurb{display:block}
  .tile.shut{opacity:0.62;border-style:dashed}
  .tile .mark{display:block;margin:7px 0 0;font-family:var(--mono);font-size:10px;letter-spacing:0.12em;
    text-transform:uppercase;color:var(--vapour-dim)}

  /* the side — a description is not an experience, so it does not look like one */
  .col.side .tile{background:none;border-style:dashed}
  .col.side .tile .lab{font-family:var(--body);font-weight:400;font-size:1rem;color:var(--vapour)}
  .col.side a.tile:hover .lab{color:var(--liquid)}

  .loading{color:var(--vapour-dim);font-family:var(--mono);font-size:12px;padding:26px 0}
  .foot{max-width:1000px;margin:0 auto;padding:22px 18px 44px;font-family:var(--mono);font-size:11px;
    letter-spacing:0.05em;color:var(--vapour-dim);display:flex;gap:14px;flex-wrap:wrap;line-height:1.9}
  .foot a{border-bottom:none;color:var(--vapour-dim)} .foot a:hover{color:var(--liquid)}
</style>
</head>
<body>
<script>document.documentElement.classList.remove('no-js');</script>

<div class="bar">
  <span class="dot"></span>
  <span><b>entrance</b> · happyseaurchin.com</span>
  <span class="spacer"></span>
  <a href="/entrance2">one question at a time →</a>
  <button type="button" id="btn-words" aria-pressed="false" title="a line under every way in">show the words</button>
  <button id="btn-theme" title="light or dark">◐</button>
</div>

<main class="wrap">
  <header class="head">
    <h1>Come <span class="cool">in.</span></h1>
    <p id="lede">Pick a world, and how present you want to be in it. Nothing to join, no account, no email.</p>
  </header>
  <div class="rect" id="rect"><p class="loading">reading the entrance…</p></div>
</main>

<div class="foot">
  <a href="/entrance2">the same thing as two questions →</a>
  <a href="/experiences">the deep grid →</a>
  <a href="/explain?block=entrance">the words, as a block →</a>
</div>

<script>
(function(){
'use strict';
/* ── the same tiny beach client every o-page carries ── */
const BEACH = 'https://beach.happyseaurchin.com/.well-known/pscale-beach';
const $ = id => document.getElementById(id);
const esc = s => { const d = document.createElement('span'); d.textContent = s == null ? '' : s; return d.innerHTML; };

async function readBlock(name){
  const r = await fetch(BEACH + '?block=' + encodeURIComponent(name), { headers:{Accept:'application/json'}, cache:'no-store' });
  if (r.status === 404) return null;
  if (!r.ok) throw new Error('beach read failed: ' + r.status);
  return r.json();
}
function voiceOf(node){
  let n = node;
  while (n && typeof n === 'object') { if (!('_' in n)) return null; n = n['_']; }
  return typeof n === 'string' ? n : null;
}
function digitKeys(node){
  if (!node || typeof node !== 'object') return [];
  return Object.keys(node).filter(k => /^[1-9]$/.test(k)).sort((a,b) => a - b);
}
/* EVERY VOICE READS "label — the line", which is the block's own stated form. The
   split is on the FIRST em-dash only, because the lines that follow use em-dashes
   of their own and would otherwise be cut in half. */
function saying(text){
  const t = (text || '').trim();
  const i = t.indexOf(' — ');
  if (i < 0) return { lab: t, line: '' };
  return { lab: t.slice(0, i).trim(), line: t.slice(i + 3).trim() };
}
/* A world's underscore carries more than a button needs — its first sentence is the
   line, and what follows is the column's own voice, shown with the words. */
function firstSentence(s){
  const m = (s || '').match(/^[\s\S]*?[.!?](\s|$)/);
  return m ? m[0].trim() : (s || '').trim();
}

/* A CELL WITH NO ADDRESS IS NOT OPEN YET — the block says so and the page never
   decides it separately, so the two can never disagree. */
const addressOf = cell => (cell && typeof cell === 'object' && typeof cell['1'] === 'string') ? cell['1'].trim() : '';

function tile(cell, addr){
  const said = saying(voiceOf(cell));
  const where = addressOf(cell);
  const inner =
    '<span class="lab">' + esc(said.lab) + '</span>' +
    (said.line ? '<span class="blurb">' + esc(said.line) + '</span>' : '') +
    (where ? '' : '<span class="mark">not open yet</span>');
  return where
    ? '<a class="tile" href="' + esc(where) + '" data-at="' + esc(addr) + '">' + inner + '</a>'
    : '<div class="tile shut" data-at="' + esc(addr) + '">' + inner + '</div>';
}

function render(block){
  const tops = digitKeys(block);
  const worlds = [], sides = [];
  /* A WORLD is a position with ways beneath it; a SIDE is one whose children are
     leaves. Derived rather than listed, so a fourth world costs one write. */
  tops.forEach(d => {
    const node = block[d];
    const kids = digitKeys(node);
    const deep = kids.some(k => node[k] && typeof node[k] === 'object');
    (deep ? worlds : sides).push(d);
  });

  let html = worlds.map(d => {
    const w = block[d], said = saying(voiceOf(w));
    const rest = said.line.slice(firstSentence(said.line).length).trim();
    return '<section class="col">' +
      '<h2>' + esc(said.lab) + '</h2>' +
      '<p class="voice">' + esc(rest || said.line) + '</p>' +
      '<div class="tiles">' + digitKeys(w).map(k => tile(w[k], d + '.' + k)).join('') + '</div>' +
    '</section>';
  }).join('');

  if (sides.length) html += '<section class="col side">' +
    '<h2>or</h2>' +
    '<div class="tiles">' + sides.map(d => tile(block[d], String(d))).join('') + '</div>' +
  '</section>';

  $('rect').innerHTML = html || '<p class="loading">the entrance block holds nothing yet.</p>';
}

$('btn-words').addEventListener('click', () => {
  const on = !document.body.classList.contains('words');
  document.body.classList.toggle('words', on);
  $('btn-words').setAttribute('aria-pressed', String(on));
  $('btn-words').textContent = on ? 'hide the words' : 'show the words';
});

readBlock('entrance').then(b => {
  if (!b) { $('rect').innerHTML = '<p class="loading">the entrance is not published yet.</p>'; return; }
  render(b);
}).catch(e => { $('rect').innerHTML = '<p class="loading">' + esc('could not read the entrance: ' + e.message) + '</p>'; });

/* THE GO MENU IS A HANDLE'S OWN MENU — siteDoors lists the pages OF the handle in
   the URL, so at a door where nobody has a name yet it would offer doors that
   cannot open. It appears only for a walker who arrived carrying one. */
const CARRIED = (new URLSearchParams(location.search).get('h') || '').replace(/[^a-z0-9 _-]/gi,'').trim() || null;
if (CARRIED && window.siteDoors) siteDoors({ handle: CARRIED, here: 'entrance' });
})();
</script>
</body>
</html>
