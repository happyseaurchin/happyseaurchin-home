<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Proposals</title>
<meta name="description" content="Proposals kept on the beach, each drawn live from its own blocks: its steps, decisions anyone can answer under their own name, its room, and the threads that turn it into its project's page as the work begins.">
<meta property="og:title" content="Proposals">
<meta property="og:description" content="A proposal kept on the beach grows into its project's page: its steps, decisions anyone can answer, a room, and threads that tie the work to it as it begins.">
<link rel="icon" href="/assets/torus.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Space+Mono:wght@400;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme.css">
<script src="/theme.js"></script>
<style>
  /* One page for every proposal on the beach (function:proposal 4): /proposal lists them and
   * teaches the form, /proposal/<name> draws one family from its blocks. The band carries the
   * proposal's quipu, its spine as a cord, each step a cord hanging with a knot for every answer,
   * each thread a cord rising with a knot for every rung; below, a step a section, the detail one
   * tap down, and every decision takes an answer into its answerer's own mirror on the beach. */
  :root{
    --acc: var(--liquid);
    --ghost:#B79CF0; --rose:#F08FB0; --sky:#8FB8F0; --peach:#F0A06A; --err:#FF8A80;
  }
  :root[data-theme="light"]{ --ghost:#6A3FC0; --rose:#A8295F; --sky:#2E5FA8; --peach:#A8551F; --err:#B3261E; }
  :root[data-theme="light"] ::selection{background:rgba(var(--liquid-rgb),0.20)}
  *{box-sizing:border-box} html,body{margin:0}
  html{-webkit-text-size-adjust:100%;background:var(--abyss)}
  body{
    font-family:var(--body); color:var(--foam); font-size:17.5px; line-height:1.58;
    background:radial-gradient(1100px 560px at 70% -10%, rgba(var(--liquid-rgb),0.10), transparent 60%),
      linear-gradient(180deg,var(--ground-top) 0%, var(--deep) 30%, var(--abyss) 100%);
    background-attachment:fixed; -webkit-font-smoothing:antialiased; min-height:100dvh;
  }
  ::selection{background:rgba(var(--liquid-rgb),0.30);color:var(--foam)}
  a{color:var(--liquid);text-underline-offset:3px}
  a:focus-visible,button:focus-visible,summary:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--liquid);outline-offset:3px;border-radius:4px}

  .bar{display:flex;align-items:center;gap:10px;padding:14px 18px 10px;font-family:var(--mono);font-size:12px;letter-spacing:0.08em;color:var(--vapour-dim);max-width:72rem;margin:0 auto}
  .bar .dot{width:6px;height:6px;border-radius:50%;background:var(--liquid);box-shadow:0 0 10px var(--liquid);flex:none}
  .bar b{color:var(--foam);font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar>span:nth-child(2){min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar a{color:var(--vapour-dim);text-decoration:none;white-space:nowrap} .bar a:hover{color:var(--liquid)}
  .bar .spacer{flex:1}
  .bar button{background:none;border:1px solid var(--line);border-radius:4px;color:var(--vapour-dim);font-family:var(--mono);font-size:12px;padding:6px 10px;cursor:pointer}
  .bar button:hover{color:var(--foam);border-color:var(--line-strong)}

  .wrap{max-width:46rem;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}

  /* the band: the words, and the quipu */
  .band .wrap{max-width:72rem;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:2.2rem;align-items:center;padding-block:1.4rem 2.2rem}
  .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:var(--solid)}
  h1{font-family:var(--display);font-weight:800;font-size:clamp(2.2rem,6vw,3.6rem);line-height:1.0;letter-spacing:-0.02em;margin:0.4rem 0 0.9rem;text-wrap:balance}
  h1 a{color:inherit;text-decoration:none} h1 a:hover{color:var(--acc)}
  .lede{font-size:1.2rem;line-height:1.5;margin:0 0 0.8rem;max-width:36rem}
  .sub{color:var(--vapour);margin:0 0 1.3rem;max-width:36rem}
  .actions{display:flex;flex-wrap:wrap;gap:0.6rem}
  .btn{display:inline-flex;align-items:center;gap:0.4rem;font-family:var(--display);font-weight:700;font-size:0.95rem;letter-spacing:0.01em;padding:0.6rem 1rem;border-radius:999px;text-decoration:none;border:1px solid transparent;cursor:pointer}
  .btn.primary{background:var(--acc);color:var(--abyss)}
  .btn.line{border-color:var(--line-strong);color:var(--foam)}
  .btn.line:hover{border-color:var(--acc)}
  .phase{display:block;margin:1rem 0 0;padding:0.7rem 0.9rem;border:1px solid var(--line-strong);border-radius:8px;color:var(--vapour);font-size:0.97rem}
  .phase b{color:var(--foam)}

  .quipu{margin:0;min-width:0}
  .quipu svg{display:block;width:100%;height:auto;overflow:visible}
  .quipu figcaption{font-family:var(--mono);font-size:11.5px;line-height:1.6;color:var(--vapour-dim);margin-top:0.5rem}
  .quipu figcaption i{font-style:normal;display:inline-block;width:0.62rem;height:0.62rem;border-radius:50%;vertical-align:-0.05rem;margin:0 0.18rem 0 0.1rem}
  .quipu figcaption i.go{background:var(--bud)} .quipu figcaption i.wait{background:var(--solid)} .quipu figcaption i.change{background:var(--ghost)}
  .quipu figcaption i.th{background:var(--rose)} .quipu figcaption i.open{border:1.5px dashed var(--vapour-dim);box-sizing:border-box}
  .q-cord{fill:none;stroke:var(--vapour);stroke-width:4.5;stroke-linecap:round}
  .q-twist{fill:none;stroke:var(--abyss);stroke-width:1.3;stroke-dasharray:2 5;opacity:0.55}
  .q-end{fill:var(--vapour)}
  .q-pend{fill:none;stroke:var(--vapour-dim);stroke-width:2;stroke-linecap:round}
  .q-pend.lit{stroke:var(--acc)}
  .q-sub{fill:none;stroke:var(--vapour-dim);stroke-width:1.4;stroke-linecap:round;opacity:0.9}
  .q-thr{fill:none;stroke:var(--rose);stroke-width:2;stroke-linecap:round}
  .q-k.go{fill:var(--bud)} .q-k.wait{fill:var(--solid)} .q-k.change{fill:var(--ghost)} .q-k.none{fill:var(--vapour-dim)}
  .q-k.c1{fill:var(--liquid)} .q-k.c2{fill:var(--sky)} .q-k.c3{fill:var(--peach)} .q-k.c4{fill:var(--rose)}
  .q-k.rung{fill:var(--rose)}
  .q-open{fill:none;stroke:var(--vapour-dim);stroke-width:1.4;stroke-dasharray:2.4 2}
  .q-turn{fill:var(--line-strong)} .q-turn.on{fill:var(--acc)}
  .q-room{fill:var(--vapour-dim);opacity:0.75}
  .q-tassel{fill:var(--vapour-dim)}
  .q-n{font-family:var(--mono);font-size:11px;fill:var(--vapour-dim)}
  .q-name{font-family:var(--display);font-weight:700;font-size:12.5px;fill:var(--foam)}
  .q-more{font-family:var(--mono);font-size:9.5px;fill:var(--vapour-dim)}
  .q-hit{fill:transparent}
  a.q-a:hover .q-pend,a.q-a:focus .q-pend{stroke:var(--foam)}
  a.q-a:hover .q-n,a.q-a:focus .q-n,a.q-a:hover .q-name{fill:var(--acc)}
  a.q-a:focus{outline:none} a.q-a:focus-visible .q-hit{stroke:var(--liquid);stroke-width:1.5}

  /* the reading column */
  main{padding-block:1rem 3rem}
  section{padding-block:2.2rem 0.4rem;border-top:1px solid var(--line)}
  main>section:first-child{border-top:0}
  .addr{font-family:var(--mono);font-size:12px;letter-spacing:0.06em;color:var(--vapour-dim)}
  .addr b{color:var(--acc);font-weight:400}
  h2{font-family:var(--display);font-weight:800;font-size:1.65rem;line-height:1.12;letter-spacing:-0.01em;margin:0.3rem 0 0.8rem;text-wrap:balance}
  h3{font-family:var(--display);font-weight:700;font-size:1.18rem;margin:1.6rem 0 0.4rem;text-wrap:balance}
  p{margin:0 0 0.9rem}
  .lead{font-size:1.1rem;overflow-wrap:anywhere}
  .note{color:var(--vapour-dim);font-size:0.97rem}
  .ref{font-family:var(--mono);font-size:0.72em;letter-spacing:0.02em;color:var(--vapour-dim);border:1px solid var(--line);border-radius:4px;padding:0 0.3rem;white-space:normal;overflow-wrap:anywhere}
  .state{font-family:var(--mono);font-size:11px;letter-spacing:0.08em;padding:0.08rem 0.45rem;border-radius:999px;border:1px solid var(--acc);color:var(--acc);margin-left:0.4rem;white-space:nowrap}
  .state.lv0{border-color:var(--line-strong);color:var(--vapour-dim)}
  .statenote{border-left:3px solid var(--acc);padding:0.15rem 0 0.15rem 0.8rem;color:var(--vapour);font-size:0.98rem}
  .statenote b{font-family:var(--mono);font-weight:400;font-size:0.8rem;letter-spacing:0.06em;color:var(--acc)}

  .more{display:grid;gap:0.45rem;margin:0.4rem 0 1rem}
  details.fold{border:1px solid var(--line);border-radius:8px;background:rgba(var(--card-rgb),0.55);min-width:0}
  details.fold>summary{cursor:pointer;list-style:none;padding:0.7rem 0.95rem;display:flex;gap:0.7rem;align-items:baseline;font-family:var(--display);font-weight:700;font-size:1rem}
  details.fold>summary::-webkit-details-marker{display:none}
  details.fold>summary::before{content:"+";font-family:var(--mono);font-weight:400;color:var(--acc);width:0.8rem;flex:none}
  details.fold[open]>summary::before{content:"\2013"}
  details.fold>.in{padding:0.1rem 1rem 0.9rem 2.45rem;min-width:0;overflow-wrap:anywhere}
  details.fold>.in>:last-child{margin-bottom:0}
  .points{list-style:none;margin:0.4rem 0 0.6rem;padding:0;display:grid;gap:0.55rem}
  .points li{padding-left:0.9rem;border-left:2px solid var(--line-strong);overflow-wrap:anywhere}
  .points .pt{display:block;font-family:var(--display);font-weight:700;font-size:0.95rem;color:var(--foam)}
  .points .points{margin-top:0.4rem}
  .sideopen{border-top:1px dashed var(--line-strong);margin-top:1.4rem;padding-top:0.4rem}
  .sideopen h3{margin-top:0.8rem}

  /* where it stands */
  .stands{list-style:none;padding:0;margin:0.4rem 0 0.6rem}
  .stands a{display:grid;grid-template-columns:5.6rem minmax(0,1fr) auto;gap:0.8rem;align-items:center;padding:0.65rem 0.1rem;border-bottom:1px solid var(--line);color:var(--foam);text-decoration:none}
  .stands a:hover .what{color:var(--acc)}
  .stands .at{font-family:var(--mono);font-size:12px;color:var(--solid)}
  .stands .what{font-family:var(--display);font-weight:700;min-width:0;overflow-wrap:anywhere}
  .trail{list-style:none;padding:0;margin:0.4rem 0 1.2rem;display:grid;gap:0.35rem}
  .trail a{display:grid;grid-template-columns:1.6rem minmax(0,1fr) auto;gap:0.7rem;align-items:center;text-decoration:none;color:var(--foam);padding:0.4rem 0.1rem}
  .trail .n{font-family:var(--display);font-weight:800;color:var(--acc)}
  .trail .t{min-width:0;overflow-wrap:anywhere}
  .trail .bars{display:inline-flex;gap:3px}
  .trail .bars i{display:block;width:12px;height:6px;border-radius:2px;background:var(--line-strong)}
  .trail .bars i.on{background:var(--acc)}
  .trail .w{font-family:var(--mono);font-size:11px;letter-spacing:0.06em;color:var(--vapour-dim);margin-left:0.5rem}
  .tally{display:flex;flex-wrap:wrap;gap:0.3rem;justify-content:flex-end}
  .chip{font-family:var(--mono);font-size:11.5px;letter-spacing:0.04em;padding:0.12rem 0.5rem;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
  .chip.go{color:var(--bud)} .chip.wait{color:var(--solid)} .chip.change{color:var(--ghost)} .chip.none{color:var(--vapour-dim)}
  .chip.c1{color:var(--liquid)} .chip.c2{color:var(--sky)} .chip.c3{color:var(--peach)} .chip.c4{color:var(--rose)}
  .reading{border-left:3px solid var(--acc);background:rgba(var(--card-rgb),0.6);border-radius:0 6px 6px 0;padding:0.7rem 0.95rem;margin:0.5rem 0 0.9rem;min-width:0}
  .decide .reading{margin:0}
  .reading .lbl{display:block;font-family:var(--mono);font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--acc);margin-bottom:0.25rem}
  .reading p{margin:0;font-size:0.97rem;overflow-wrap:anywhere}
  .reading[hidden]{display:none}

  /* a decision: the one card on the page */
  .decide{border:1px solid var(--line-strong);border-left:4px solid var(--solid);background:rgba(var(--card-rgb),0.7);border-radius:8px;padding:1rem 1.1rem;margin:1.4rem 0 0.8rem;display:grid;gap:0.6rem;scroll-margin-top:1rem;min-width:0}
  .decide .top{display:flex;flex-wrap:wrap;gap:0.4rem 1rem;align-items:baseline;justify-content:space-between}
  .decide .tag{font-family:var(--mono);font-size:12px;letter-spacing:0.08em;color:var(--solid);text-transform:uppercase}
  .decide .who{font-size:0.92rem;color:var(--vapour-dim)}
  .decide .q{font-family:var(--display);font-weight:700;font-size:1.08rem;line-height:1.38;margin:0;overflow-wrap:anywhere}
  .decide .tally{justify-content:flex-start}
  .answers{list-style:none;margin:0;padding:0;display:grid;gap:0.45rem}
  .answers li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0.6rem;align-items:baseline;font-size:0.97rem}
  .answers li>span:last-child{min-width:0;overflow-wrap:anywhere}
  .answers .name{font-weight:600}
  .answers .mine .name::after{content:" (you)";font-weight:400;color:var(--vapour-dim)}
  .answers .empty{color:var(--vapour-dim)}
  details.add>summary{cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:0.4rem;font-family:var(--display);font-weight:700;color:var(--acc)}
  details.add>summary::-webkit-details-marker{display:none}
  details.add>summary::after{content:"\2192"}
  details.add[open]>summary::after{content:"\2193"}
  details.add[open]>summary{margin-bottom:0.7rem}
  .form{display:grid;gap:0.65rem}
  .choices{display:flex;flex-wrap:wrap;gap:0.45rem}
  .choices button{font-family:var(--mono);font-size:13px;letter-spacing:0.04em;padding:0.45rem 0.85rem;border-radius:999px;border:1px solid var(--line-strong);background:transparent;color:var(--foam);cursor:pointer;min-height:40px}
  .choices button[aria-pressed="true"]{color:var(--abyss);border-color:transparent}
  .choices button.go[aria-pressed="true"]{background:var(--bud)} .choices button.wait[aria-pressed="true"]{background:var(--solid)}
  .choices button.change[aria-pressed="true"]{background:var(--ghost)} .choices button.c1[aria-pressed="true"]{background:var(--liquid)}
  .choices button.c2[aria-pressed="true"]{background:var(--sky)} .choices button.c3[aria-pressed="true"]{background:var(--peach)} .choices button.c4[aria-pressed="true"]{background:var(--rose)}
  .field{position:relative}
  .form textarea,.form input{width:100%;font:inherit;font-size:1rem;padding:0.6rem 0.7rem;border-radius:6px;border:1px solid var(--line-strong);background:rgba(var(--well-rgb),0.7);color:var(--foam)}
  .form textarea{min-height:4.4rem;resize:vertical;padding-right:2.4rem}
  .form label{display:grid;gap:0.3rem;font-size:0.92rem;color:var(--vapour-dim)}
  .as{font-size:0.95rem;color:var(--vapour-dim)}
  .as b{color:var(--foam);font-weight:600}
  .linkish{border:0;background:none;padding:0;color:var(--liquid);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font:inherit}
  .send{justify-self:start;font-family:var(--display);font-weight:700;font-size:0.95rem;padding:0.55rem 1.15rem;border-radius:999px;border:0;background:var(--foam);color:var(--abyss);cursor:pointer}
  .send[disabled]{opacity:0.5;cursor:default}
  .hint{font-size:0.92rem;min-height:1.1rem;margin:0;color:var(--vapour-dim)}
  .means{font-size:0.88rem;line-height:1.4;margin:0;color:var(--vapour-dim)}
  .hint.err{color:var(--err)} .hint.ok{color:var(--bud)}

  /* the room, and the lines for one's own AI */
  .talk{list-style:none;margin:0.4rem 0 1rem;padding:0;display:grid;gap:0.7rem}
  .talk li{border-left:2px solid var(--line-strong);padding-left:0.85rem;min-width:0;overflow-wrap:anywhere}
  .talk .meta{font-family:var(--mono);font-size:11.5px;color:var(--vapour-dim)}
  .copyline textarea{width:100%;min-height:6.2rem;resize:vertical;font-family:var(--mono);font-size:13px;line-height:1.5;padding:0.7rem;border-radius:6px;border:1px solid var(--line);background:rgba(var(--well-rgb),0.7);color:var(--foam)}

  /* the index: the proposals on the shelf */
  .cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0.9rem;margin:0.6rem 0 1rem}
  .card{border:1px solid var(--line-strong);border-radius:10px;background:rgba(var(--card-rgb),0.6);padding:0.95rem 1rem 1rem;display:grid;gap:0.45rem;align-content:start;min-width:0}
  .card .nm{font-family:var(--display);font-weight:800;font-size:1.15rem;margin:0;overflow-wrap:anywhere}
  .card .nm a{color:var(--foam);text-decoration:none} .card .nm a:hover{color:var(--acc)}
  .card p{margin:0;font-size:0.97rem;overflow-wrap:anywhere}
  .card .stat{font-family:var(--mono);font-size:11.5px;letter-spacing:0.03em;color:var(--vapour-dim)}
  .card .go-links{display:flex;flex-wrap:wrap;gap:0.4rem 1rem;font-size:0.95rem}
  .steps{padding-left:1.4rem;display:grid;gap:0.45rem}
  .steps li::marker{font-family:var(--display);font-weight:800;color:var(--acc)}

  footer{border-top:1px solid var(--line);padding-block:1.6rem 2.6rem}
  footer p{font-size:0.92rem;color:var(--vapour-dim)}
  .src{font-size:0.88rem;color:var(--vapour-dim)} .src a{color:var(--vapour-dim)}

  @media (max-width: 860px){
    .band .wrap{grid-template-columns:minmax(0,1fr);gap:1.4rem;padding-block:1rem 1.8rem}
    .cards{grid-template-columns:minmax(0,1fr)}
  }
  @media (max-width: 560px){
    .stands a{grid-template-columns:minmax(0,1fr) auto}
    .stands .at{display:none}
    .bar #bar-all{display:none}
    details.fold>.in{padding-left:1rem}
  }
</style>
</head>
<body>

<div class="bar"><span class="dot"></span><span>proposals · <b id="bar-name">every one</b></span><span class="spacer"></span><a href="/proposal" id="bar-all">every proposal</a><button type="button" id="btn-theme" title="light or dark" aria-label="Switch between light and dark">◐</button></div>

<header class="band">
  <div class="wrap">
    <div id="bandText"><div class="eyebrow">Proposals · on the beach</div><h1>Reading the beach…</h1></div>
    <figure class="quipu" id="quipu"></figure>
  </div>
</header>

<main class="wrap" id="main"></main>

<footer><div class="wrap" id="foot"></div></footer>

<script src="https://beach.happyseaurchin.com/button/voice.js"></script>
<script src="/threads.js"></script>
<script>
(function () {
  'use strict';
  if (!window.beachVoice) {
    var away = function () { return Promise.resolve({ ok: false, error: 'the beach could not be reached just now' }); };
    window.beachVoice = { say: away, keep: away, ask: away, drop: away, button: { shown: function () { return false; }, set: away }, onButton: function () {} };
  }
  var BEACH = 'https://beach.happyseaurchin.com/.well-known/pscale-beach';
  var LEVELS = { 'NOT STARTED': 0, 'SCOPED': 1, 'SPECIFIED': 2, 'BUILDING': 3, 'BUILT': 4, 'LIVE': 5 };
  var KINDS = { 'GO': 'go', 'NOT YET': 'wait', 'CHANGE': 'change' };
  var CUSTOM = ['c1', 'c2', 'c3', 'c4'];
  var path = /^\/proposal\/([A-Za-z0-9-]+)\/?$/.exec(location.pathname);
  var NAME = ((path && path[1]) || new URLSearchParams(location.search).get('p') || '').toLowerCase().replace(/[^a-z0-9-]/g, '');

  function $(id) { return document.getElementById(id); }
  function esc(s) { var d = document.createElement('span'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
  var store = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
    del: function (k) { try { localStorage.removeItem(k); } catch (e) {} }
  };
  function clean(v) { return window.cleanHandle ? window.cleanHandle(v) : String(v || '').replace(/[^A-Za-z0-9_\s-]/g, '').replace(/\s+/g, ' ').trim().slice(0, 32); }
  var ME = clean(store.get('render:who') || '');

      var note = $('standsNote'), people = Object.keys(who), latest = '';
      Object.keys(TOUCHED).forEach(function (h) { if (who[h] && String(TOUCHED[h]) > latest) latest = TOUCHED[h]; });
      if (note && people.length) note.textContent = (DECS.length === 1 ? 'One decision' : cap(count(DECS.length)) + ' decisions') + ', answered so far by ' + people.length + (people.length === 1 ? ' person' : ' people') +
        (latest ? ', the latest ' + rel(latest) : '') + ', with the latest shared reading of them. Tap one to read it and answer.';
      paintAs();
      drawQuipu();
    }
    function paintAs() {
      var btn = buttonShown();
      document.querySelectorAll('.decide .as').forEach(function (el) {
        if (btn) { el.textContent = 'Answering through your beach button.'; return; }

        if (!el.querySelector('input')) el.innerHTML = '<label>Your name on the beach<input class="me" autocomplete="username" spellcheck="false" autocapitalize="off" maxlength="32" placeholder="your handle"></label>';
      });
      document.querySelectorAll('.decide .notme').forEach(function (b) { b.onclick = function () { ME = ''; store.del('render:who'); paintAnswers(); }; });
      var ats = DECS.map(function (d) { return d.at; }).join(', ');
      if ($('askLine')) $('askLine').value = 'Read the proposal spine:' + FAM + ' on https://beach.happyseaurchin.com (its law is function:' + FAM + ') and help me answer its decision points (' + ats + ') under my own handle' +
        (ME ? ', ' + ME : '') + '. Each answer goes in my own mirror, ' + FAM + ':' + (ME || '<my handle>') + ', at the decision’s address, opening with one of the words that decision ends with (GO, NOT YET or CHANGE unless it names its own), then a line in my own words.';
      if ($('foldLine')) $('foldLine').value = 'Sum up the answers to the proposal spine:' + FAM + ' on https://beach.happyseaurchin.com. For each decision, at ' + ats + ', call pscale_stream_engage with field ' + FAM + ', handle ' +
        (ME || '<my handle>') + ' and that address, and fold the answers it returns under the law that comes with them: who answered what, where they agree, where they differ, and what is still open. Keep each fold for everyone with keep=collective, then keep one fold of the whole proposal the same way at address 1.';
      if ($('askWrap')) $('askWrap').hidden = !btn;
    }
    function wireCard(card) {
      var at = card.getAttribute('data-at'), d = DECS.filter(function (x) { return x.at === at; })[0]; if (!d) return;
      var box = card.querySelector('textarea'), hint = card.querySelector('.hint'), send = card.querySelector('.send'), token = '';
      function say(cls, t) { hint.className = 'hint' + (cls ? ' ' + cls : ''); hint.textContent = t || ''; }
      var clear = window.keepDraft ? window.keepDraft(box, FAM + ':' + at) : function () {};
      if (window.dictate) window.dictate(box);
      card.querySelectorAll('.choices button').forEach(function (b) {
        b.addEventListener('click', function () {
          token = b.getAttribute('data-tok');
          card.querySelectorAll('.choices button').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
        });
      });
      send.addEventListener('click', function () {
        if (!token) { say('err', 'Choose ' + tokenWords(d) + ' first.'); return; }
        var typed = card.querySelector('.as input');
        var me = ME || (typed ? clean(typed.value) : '');
        if (!me && !buttonShown()) { say('err', 'Give your name on the beach first.'); if (typed) typed.focus(); return; }
        var line = box.value.trim().replace(/\s+/g, ' ');
        send.disabled = true; say('', 'Saying it on the beach…');
        beachVoice.say({ field: FAM, at: at, text: token + (line ? ' — ' + line : ''), name: me || undefined }).then(function (r) {
          if (!r || !r.ok) { say(r && r.quiet ? '' : 'err', r && r.quiet ? '' : errText(r)); return; }
          ME = clean(r.name || me); if (ME) store.set('render:who', ME);
          clear(); box.value = '';
          say('ok', 'Answered. It stands in your own mirror on the beach.');
          return readMirrors(FAM).then(function (m) { MIRRORS = m.mirrors || {}; FOLD = m.fold; TOUCHED = m.touched || {}; paintAnswers(); });
        }, function (e) { say('err', 'Couldn’t reach the beach: ' + e.message); }).then(function () { send.disabled = false; });
      });
    }
    function paintTalk() {
      readBlock('pool:' + L.room).then(function (pool) {
        var lines = entries(pool).sort(function (a, b) { return String(b['3']).localeCompare(String(a['3'])); }).slice(0, 5);
        $('talkList').innerHTML = lines.length ? lines.map(function (e) {
          var when = new Date(e['3']);
          return '<li><div class="meta">' + esc(e['1']) + (isNaN(when) ? '' : ' · ' + esc(when.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }))) + '</div>' + esc(voiceOf(e)) + '</li>';
        }).join('') : '<li class="note">Nothing said yet.</li>';
      }, function () { $('talkList').innerHTML = '<li class="note">The room couldn’t be read just now.</li>'; });
    }
    if (beachVoice.onButton) beachVoice.onButton(function () { paintAs(); });
  }

  /* the room's lines, wherever the pool's ladder has put them */
  function entries(n, out) {
    out = out || [];
    if (!n || typeof n !== 'object') return out;
    if (n._ && typeof n._ === 'object') entries(n._, out);
    for (var i = 1; i <= 9; i++) {
      var s = n[String(i)];
      if (!s || typeof s !== 'object') continue;
      if (typeof s['1'] === 'string' && typeof s['3'] === 'string') out.push(s); else entries(s, out);
    }
    return out;
  }
  function onResize(fn) { var t = 0, w = window.innerWidth; window.addEventListener('resize', function () { if (window.innerWidth === w) return; w = window.innerWidth; clearTimeout(t); t = setTimeout(fn, 150); }); }
  function copier(boxId, noteId) {
    return function () {
      var box = $(boxId);
      function picked() { box.focus(); box.select(); $(noteId).textContent = 'Selected: copy it with your keyboard or a long press.'; }
      try { navigator.clipboard.writeText(box.value).then(function () { $(noteId).textContent = 'Copied.'; }, picked); } catch (e) { picked(); }
    };
  }

  /* ════════ the index: every proposal the form lists, and the form itself ════════ */
  function indexPage() {
    document.title = 'Proposals';
    readBlock('function:proposal').then(function (form) {
      if (!form) { $('bandText').innerHTML = '<div class="eyebrow">Proposals</div><h1>Proposals</h1><p class="lede">The proposal form couldn’t be found on the beach just now.</p>'; return; }
      learnCase(JSON.stringify(form));
      var shelf = [], ex = form['8'];
      if (ex && typeof ex === 'object') for (var d = 1; d <= 9; d++) {
        var t = textOf(ex[String(d)]); if (!t) continue;
        var m = /^\s*([a-z0-9][a-z0-9-]*)\s*—\s*([\s\S]*?)(?:\s*·\s*(\S+))?\s*$/i.exec(t);
        if (m) shelf.push({ name: m[1].toLowerCase(), what: m[2].trim(), page: m[3] ? (/^https?:/.test(m[3]) ? m[3] : 'https://' + m[3]) : '' });
      }
      $('bandText').innerHTML = '<div class="eyebrow">The proposal form · on the beach</div>' +
        '<h1><a href="/proposal">Proposals</a></h1>' +
        '<p class="lede">A proposal kept on the beach grows into its project’s page. It starts as a few steps with a decision at each, answered by anyone in their own words; as the decisions stand and the work begins, threads tie each piece of work to it, so one address carries the proposal and then the project.</p>' +
        '<p class="sub">Every one is drawn live from its own blocks. Any AI with the beach connected can set one up from the form alone.</p>' +
        '<div class="actions"><a class="btn primary" href="#shelf">See them</a><a class="btn line" href="#make">Make one with your AI</a><a class="btn line" href="/explain?block=function:proposal">Read the form</a></div>';
      var sections = [];
      sections.push('<section id="shelf"><div class="addr">live from the beach · the form’s own list, at <b>function:proposal 8</b></div><h2>The proposals</h2>' +
        '<div class="cards">' + shelf.map(function (s) {
          return '<article class="card" id="c-' + esc(s.name) + '"><h3 class="nm"><a href="/proposal/' + esc(s.name) + '">' + esc(s.name) + '</a></h3>' +
            '<p>' + esc(cap(s.what)) + '</p><p class="stat" data-stat="' + esc(s.name) + '">reading…</p>' +
            '<div class="go-links"><a href="/proposal/' + esc(s.name) + '">Drawn from its blocks</a>' + (s.page ? '<a href="' + esc(s.page) + '">Its own page</a>' : '') + '</div></article>';
        }).join('') + '</div>' +
        '<p class="note">A crafted page earns its own look and one true drawing of something real; the drawing from its blocks needs no code at all, and exists the moment a spine and its law stand.</p></section>');
      var how = [];
      for (var k = 1; k <= 7; k++) { var r = form[String(k)]; if (r == null) continue; var sp = split(textOf(r)); how.push('<details class="fold"><summary>' + esc(sentenceCase(sp.title)) + '</summary><div class="in"><p>' + rich(cap(sp.rest)) + '</p></div></details>'); }
      sections.push('<section id="how"><div class="addr">the form, live from <b>function:proposal</b></div><h2>How a proposal works</h2>' +
        '<p class="lead">' + rich(split(textOf(form)).rest) + '</p><div class="more">' + how.join('') + '</div></section>');
      sections.push('<section id="make"><div class="addr">for your own AI</div><h2>Make one</h2>' +
        '<p>If your Claude has the beach connected, paste this in with what you want to propose, and who should decide. It reads the form, reads what already stands about the topic and the people, tells you what it is about to make, and writes the proposal as blocks under your own key. The page then exists at <code>happyseaurchin.com/proposal/&lt;its name&gt;</code>.</p>' +
        '<div class="copyline"><textarea id="makeLine" readonly aria-label="A line to paste into your own Claude"></textarea>' +
        '<p style="margin-top:0.6rem"><button type="button" class="linkish" id="copyMake">Copy the line</button> <span class="hint" id="copiedMake" aria-live="polite"></span></p></div>' +
        '<ol class="steps"><li>The steps: what we are building, how it works for the people who use it, the money, who pays at each scale, the build order. Or your own.</li>' +
        '<li>A decision at each step that needs one, answered GO, NOT YET or CHANGE, or with words of its own.</li>' +
        '<li>A room for talk, open to anyone.</li>' +
        '<li>As the decisions stand and work begins: each piece of work tied as a thread, so the page grows into the project’s own.</li></ol></section>');
      $('main').innerHTML = sections.join('');
      $('makeLine').value = 'Read function:proposal on https://beach.happyseaurchin.com, then function:document and function:thread, and help me set up a proposal on the beach, following its MAKING ONE at 7. The topic: <what you want to propose>. Who decides: <names>. Tell me what you are about to make before you write anything, and write it under my own key.';
      $('copyMake').addEventListener('click', copier('makeLine', 'copiedMake'));
      $('foot').innerHTML = '<p>The list is the form’s own, kept at function:proposal 8 by each proposal’s keeper when it is shared; every card and every cord above is read live from that proposal’s own blocks. The form: <a href="/explain?block=function:proposal">function:proposal</a>, on <a href="/explain?block=function:document">the document form</a> and <a href="/explain?block=function:thread">the thread</a>.</p><p id="create-your-own"><a href="/">happyseaurchin.com</a></p>';
      var groups = shelf.map(function (s) { return { name: s.name, short: s.name, href: '/proposal/' + s.name, title: s.name + ' · ' + s.what, steps: [], loose: [] }; });
      function redraw() {
        $('quipu').innerHTML = quipuSVG(groups.filter(function (g) { return g.steps.length; }).length ? groups : groups.map(function (g) { g.steps = [{ id: '', title: '', word: '', level: -1, main: null, rooms: [], threads: [] }]; return g; }),
          { w: figW(), h: 0, label: 'The proposals on the beach, each a bundle of cords: its steps hanging with a knot for every answer, its threads rising. Each bundle links to its page.' }) +
          '<figcaption>' + LEGEND + '</figcaption>';
      }
      redraw();
      onResize(redraw);
      shelf.forEach(function (s, i) {
        Promise.all([readBlock('spine:' + s.name), readBlock('function:' + s.name), readMirrors(s.name, true),
          window.beachThreads ? beachThreads.read(s.name).catch(function () { return { threads: [] }; }) : Promise.resolve({ threads: [] })]).then(function (four) {
          var spine = four[0], law = four[1], m = four[2], th = (four[3] && four[3].threads) || [];
          if (!spine) { var el0 = document.querySelector('[data-stat="' + s.name + '"]'); if (el0) el0.textContent = 'not yet on the beach'; return; }
          learnCase(JSON.stringify(spine));
          var steps = stepsOf(spine), decs = decisionsOf(steps), mirrors = m.mirrors || {};
          var g = quipuGroup(s.name, steps, mirrors, th); groups[i].steps = g.steps; groups[i].loose = g.loose;
          var people = {}, answers = 0, latest = '';
          decs.forEach(function (d) { answersAt(mirrors, d).forEach(function (a) { people[a.who] = 1; answers++; }); });
          Object.keys(m.touched || {}).forEach(function (h) { if (people[h] && String(m.touched[h]) > latest) latest = m.touched[h]; });
          var L2 = lawOf(law, s.name), phase = L2.phase || (steps.some(function (x) { return x.state; }) ? 'project' : 'proposal');
          var el = document.querySelector('[data-stat="' + s.name + '"]');
          if (el) el.textContent = [phase, steps.length + ' steps', decs.length + (decs.length === 1 ? ' decision' : ' decisions'),
            answers + (answers === 1 ? ' answer' : ' answers') + (Object.keys(people).length ? ' from ' + Object.keys(people).length + (Object.keys(people).length === 1 ? ' person' : ' people') : ''),
            th.length + (th.length === 1 ? ' thread' : ' threads')].join(' · ') + (latest ? ' · the latest answer ' + rel(latest) : '');
          redraw();
        }, function () { var el = document.querySelector('[data-stat="' + s.name + '"]'); if (el) el.textContent = 'couldn’t be read just now'; });
      });
    }, function () {
      $('bandText').innerHTML = '<div class="eyebrow">Proposals</div><h1>Proposals</h1><p class="lede">The beach couldn’t be read just now. Try again in a moment.</p>';
    });
  }

  if (NAME) proposalPage(); else indexPage();
})();
</script>
