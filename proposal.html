<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Proposals</title>
<meta name="description" content="Proposals kept on the beach, each drawn live from its own blocks: its steps, decisions anyone can answer under their own name, its room, and the threads that turn it into its project's page as the work begins.">
<meta property="og:title" content="Proposals">
<meta property="og:description" content="A proposal kept on the beach grows into its project's page: its steps, decisions anyone can answer, a room, and threads that tie the work to it as it begins.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<link rel="icon" href="/assets/torus.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Space+Mono:wght@400;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme.css">
<script src="/theme.js"></script>
<style>
  /* One page for every proposal on the beach (function:proposal 4): /proposal lists them and
   * teaches the form, /proposal/<name> draws one family from its blocks. The band carries the
   * proposal's quipu (on /proposal, each proposal's stands beside it on the shelf), its spine as
   * a cord, each step a cord hanging with a knot for every answer,
   * each thread a cord rising with a knot for every rung; below, a step a section, the detail one
   * tap down, and every decision takes an answer into its answerer's own mirror on the beach. */
  :root{
    --acc: var(--liquid);
    --ghost:#B79CF0; --rose:#F08FB0; --sky:#8FB8F0; --peach:#F0A06A; --lime:#C8D86A; --err:#FF8A80;
  }
  :root[data-theme="light"]{ --ghost:#6A3FC0; --rose:#A8295F; --sky:#2E5FA8; --peach:#A8551F; --lime:#5F6E14; --err:#B3261E; }
  :root[data-theme="light"] ::selection{background:rgba(var(--liquid-rgb),0.20)}
  *{box-sizing:border-box} html,body{margin:0}
  html{-webkit-text-size-adjust:100%;background:var(--abyss)}
  body{
    font-family:var(--body); color:var(--foam); font-size:var(--body-size,17.5px); line-height:1.58;
    background:radial-gradient(1100px 560px at 70% -10%, rgba(var(--liquid-rgb),0.10), transparent 60%),
      linear-gradient(180deg,var(--ground-top) 0%, var(--deep) 30%, var(--abyss) 100%);
    background-attachment:fixed; -webkit-font-smoothing:antialiased; min-height:100dvh;
  }
  ::selection{background:rgba(var(--liquid-rgb),0.30);color:var(--foam)}
  a{color:var(--liquid);text-underline-offset:3px}
  a:focus-visible,button:focus-visible,summary:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--liquid);outline-offset:3px;border-radius:4px}

  .bar{display:flex;align-items:center;gap:10px;padding:14px 18px 10px;font-family:var(--mono);font-size:12px;letter-spacing:0.08em;color:var(--vapour-dim);max-width:72rem;margin:0 auto}
  .bar .dot{width:6px;height:6px;border-radius:50%;background:var(--liquid);box-shadow:0 0 10px var(--liquid);flex:none}
  .bar b{color:var(--foam);font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar>span:nth-child(2){min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar a{color:var(--vapour-dim);text-decoration:none;white-space:nowrap} .bar a:hover{color:var(--liquid)}
  .bar .spacer{flex:1}
  .bar button{background:none;border:1px solid var(--line);border-radius:4px;color:var(--vapour-dim);font-family:var(--mono);font-size:12px;padding:6px 10px;cursor:pointer}
  .bar button:hover{color:var(--foam);border-color:var(--line-strong)}

  .wrap{max-width:46rem;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}

  /* the band: the words, and the quipu */
  .band .wrap{max-width:72rem;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:2.2rem;align-items:center;padding-block:1.4rem 2.2rem}
  .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:var(--solid)}
  h1{font-family:var(--display);font-weight:var(--display-weight,800);font-size:clamp(2.2rem,6vw,3.6rem);line-height:1.0;letter-spacing:-0.02em;margin:0.4rem 0 0.9rem;text-wrap:balance}
  h1 a{color:inherit;text-decoration:none} h1 a:hover{color:var(--acc)}
  .lede{font-size:1.2rem;line-height:1.5;margin:0 0 0.8rem;max-width:min(36rem,var(--measure,36rem))}
  .sub{color:var(--vapour);margin:0 0 1.3rem;max-width:min(36rem,var(--measure,36rem))}
  main.wrap p{max-width:var(--measure,none)}
  .actions{display:flex;flex-wrap:wrap;gap:0.6rem}
  .btn{display:inline-flex;align-items:center;gap:0.4rem;font-family:var(--display);font-weight:700;font-size:0.95rem;letter-spacing:0.01em;padding:0.6rem 1rem;border-radius:999px;text-decoration:none;border:1px solid transparent;cursor:pointer}
  .btn.primary{background:var(--acc);color:var(--abyss)}
  .btn.line{border-color:var(--line-strong);color:var(--foam)}
  .btn.line:hover{border-color:var(--acc)}
  .phase{display:block;margin:1rem 0 0;padding:0.7rem 0.9rem;border:1px solid var(--line-strong);border-radius:var(--radius,8px);color:var(--vapour);font-size:0.97rem}
  .phase b{color:var(--foam)}

  .quipu{margin:0;min-width:0}
  .quipu svg{display:block;width:100%;height:auto;overflow:visible}
  .qcap{font-family:var(--mono);font-size:11.5px;line-height:1.6;color:var(--vapour-dim);margin:0.5rem 0 0}
  .qcap i{font-style:normal;display:inline-block;width:0.62rem;height:0.62rem;border-radius:50%;vertical-align:-0.05rem;margin:0 0.18rem 0 0.1rem}
  .qcap i.go{background:var(--bud)} .qcap i.wait{background:var(--solid)} .qcap i.change{background:var(--ghost)}
  .qcap i.th{background:var(--rose)} .qcap i.open{border:1.5px dashed var(--vapour-dim);box-sizing:border-box}
  .qcap i.c1{background:var(--liquid)} .qcap i.c2{background:var(--sky)} .qcap i.c3{background:var(--peach)} .qcap i.c4{background:var(--lime)}
  .q-cord{fill:none;stroke:var(--vapour);stroke-width:4.5;stroke-linecap:round}
  .q-twist{fill:none;stroke:var(--abyss);stroke-width:1.3;stroke-dasharray:2 5;opacity:0.55}
  .q-end{fill:var(--vapour)}
  .q-pend{fill:none;stroke:var(--vapour-dim);stroke-width:2;stroke-linecap:round}
  .q-pend.lit{stroke:var(--acc)}
  .q-sub{fill:none;stroke:var(--vapour-dim);stroke-width:1.4;stroke-linecap:round;opacity:0.9}
  .q-thr{fill:none;stroke:var(--rose);stroke-width:2;stroke-linecap:round}
  .q-k.go{fill:var(--bud)} .q-k.wait{fill:var(--solid)} .q-k.change{fill:var(--ghost)} .q-k.none{fill:var(--vapour-dim)}
  .q-k.c1{fill:var(--liquid)} .q-k.c2{fill:var(--sky)} .q-k.c3{fill:var(--peach)} .q-k.c4{fill:var(--lime)}
  .q-k.rung{fill:var(--rose)}
  .q-open{fill:none;stroke:var(--vapour-dim);stroke-width:1.4;stroke-dasharray:2.4 2}
  .q-turn{fill:var(--line-strong)} .q-turn.on{fill:var(--acc)}
  .q-room{fill:var(--vapour-dim);opacity:0.75}
  .q-tassel{fill:var(--vapour-dim)}
  .q-n{font-family:var(--mono);font-size:11px;fill:var(--vapour-dim)}
  .q-more{font-family:var(--mono);font-size:9.5px;fill:var(--vapour-dim)}
  .q-hit{fill:transparent}
  a.q-a:hover .q-pend,a.q-a:focus .q-pend{stroke:var(--foam)}
  a.q-a:hover .q-n,a.q-a:focus .q-n{fill:var(--acc)}
  a.q-a:focus{outline:none} a.q-a:focus-visible .q-hit{stroke:var(--liquid);stroke-width:1.5}

  /* the reading column */
  main{padding-block:1rem 3rem}
  section{padding-block:2.2rem 0.4rem;border-top:1px solid var(--line)}
  main>section:first-child{border-top:0}
  .addr{font-family:var(--mono);font-size:12px;letter-spacing:0.06em;color:var(--vapour-dim)}
  .addr b{color:var(--acc);font-weight:400}
  h2{font-family:var(--display);font-weight:var(--display-weight,800);font-size:1.65rem;line-height:1.12;letter-spacing:-0.01em;margin:0.3rem 0 0.8rem;text-wrap:balance}
  h3{font-family:var(--display);font-weight:700;font-size:1.18rem;margin:1.6rem 0 0.4rem;text-wrap:balance}
  p{margin:0 0 0.9rem}
  .lead{font-size:1.1rem;overflow-wrap:anywhere}
  .note{color:var(--vapour-dim);font-size:0.97rem}
  .ref{font-family:var(--mono);font-size:0.72em;letter-spacing:0.02em;color:var(--vapour-dim);border:1px solid var(--line);border-radius:4px;padding:0 0.3rem;white-space:normal;overflow-wrap:anywhere}
  .state{font-family:var(--mono);font-size:11px;letter-spacing:0.08em;padding:0.08rem 0.45rem;border-radius:999px;border:1px solid var(--acc);color:var(--acc);margin-left:0.4rem;white-space:nowrap}
  .state.lv0{border-color:var(--line-strong);color:var(--vapour-dim)}
  .statenote{border-left:3px solid var(--acc);padding:0.15rem 0 0.15rem 0.8rem;color:var(--vapour);font-size:0.98rem;overflow-wrap:anywhere}
  .statenote b{font-family:var(--mono);font-weight:400;font-size:0.8rem;letter-spacing:0.06em;color:var(--acc)}

  .more{display:grid;gap:0.45rem;margin:0.4rem 0 1rem}
  details.fold{border:1px solid var(--line);border-radius:var(--radius,8px);background:rgba(var(--card-rgb),0.55);min-width:0}
  details.fold>summary{cursor:pointer;list-style:none;padding:0.7rem 0.95rem;display:flex;gap:0.7rem;align-items:baseline;font-family:var(--display);font-weight:700;font-size:1rem}
  details.fold>summary::-webkit-details-marker{display:none}
  details.fold>summary::before{content:"+";font-family:var(--mono);font-weight:400;color:var(--acc);width:0.8rem;flex:none}
  details.fold[open]>summary::before{content:"\2013"}
  details.fold>.in{padding:0.1rem 1rem 0.9rem 2.45rem;min-width:0;overflow-wrap:anywhere}
  details.fold>.in>:last-child{margin-bottom:0}
  .points{list-style:none;margin:0.4rem 0 0.6rem;padding:0;display:grid;gap:0.55rem}
  .points li{padding-left:0.9rem;border-left:2px solid var(--line-strong);overflow-wrap:anywhere}
  .points .pt{display:block;font-family:var(--display);font-weight:700;font-size:0.95rem;color:var(--foam)}
  .points .points{margin-top:0.4rem}
  .sideopen{border-top:1px dashed var(--line-strong);margin-top:1.4rem;padding-top:0.4rem}
  .sideopen h3{margin-top:0.8rem}

  /* where it stands */
  .stands{list-style:none;padding:0;margin:0.4rem 0 0.6rem}
  .stands a{display:grid;grid-template-columns:5.6rem minmax(0,1fr) auto;gap:0.8rem;align-items:center;padding:0.65rem 0.1rem;border-bottom:1px solid var(--line);color:var(--foam);text-decoration:none}
  .stands a:hover .what{color:var(--acc)}
  .stands .at{font-family:var(--mono);font-size:12px;color:var(--solid)}
  .stands .what{font-family:var(--display);font-weight:700;min-width:0;overflow-wrap:anywhere}
  .trail{list-style:none;padding:0;margin:0.4rem 0 1.2rem;display:grid;gap:0.35rem}
  .trail a{display:grid;grid-template-columns:1.6rem minmax(8rem,1fr) minmax(0,auto);gap:0.7rem;align-items:center;text-decoration:none;color:var(--foam);padding:0.4rem 0.1rem}
  .trail .n{font-family:var(--display);font-weight:800;color:var(--acc)}
  .trail .t{min-width:0;overflow-wrap:anywhere}
  .trail .bars{display:inline-flex;gap:3px}
  .trail .bars i{display:block;width:12px;height:6px;border-radius:2px;background:var(--line-strong)}
  .trail .bars i.on{background:var(--acc)}
  .trail .w{font-family:var(--mono);font-size:11px;letter-spacing:0.06em;color:var(--vapour-dim);margin-left:0.5rem}
  .trail a>span:last-child{text-align:right;overflow-wrap:anywhere}
  .tally{display:flex;flex-wrap:wrap;gap:0.3rem;justify-content:flex-end}
  .chip{font-family:var(--mono);font-size:11.5px;letter-spacing:0.04em;padding:0.12rem 0.5rem;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
  .chip.go{color:var(--bud)} .chip.wait{color:var(--solid)} .chip.change{color:var(--ghost)} .chip.none{color:var(--vapour-dim)}
  .chip.c1{color:var(--liquid)} .chip.c2{color:var(--sky)} .chip.c3{color:var(--peach)} .chip.c4{color:var(--lime)}
  .reading{border-left:3px solid var(--acc);background:rgba(var(--card-rgb),0.6);border-radius:0 var(--radius,6px) var(--radius,6px) 0;padding:0.7rem 0.95rem;margin:0.5rem 0 0.9rem;min-width:0}
  .decide .reading{margin:0}
  .reading .lbl{display:block;font-family:var(--mono);font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--acc);margin-bottom:0.25rem}
  .reading p{margin:0;font-size:0.97rem;overflow-wrap:anywhere}
  .reading[hidden]{display:none}

  /* a decision: the one card on the page */
  .decide{border:1px solid var(--line-strong);border-left:4px solid var(--solid);background:rgba(var(--card-rgb),0.7);border-radius:var(--radius,8px);padding:1rem 1.1rem;margin:1.4rem 0 0.8rem;display:grid;gap:0.6rem;scroll-margin-top:1rem;min-width:0}
  .decide .top{display:flex;flex-wrap:wrap;gap:0.4rem 1rem;align-items:baseline;justify-content:space-between}
  .decide .tag{font-family:var(--mono);font-size:12px;letter-spacing:0.08em;color:var(--solid);text-transform:uppercase}
  .decide .who{font-size:0.92rem;color:var(--vapour-dim)}
  .decide .q{font-family:var(--display);font-weight:700;font-size:1.08rem;line-height:1.38;margin:0;overflow-wrap:anywhere}
  .decide .tally{justify-content:flex-start}
  .answers{list-style:none;margin:0;padding:0;display:grid;gap:0.45rem}
  .answers li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0.6rem;align-items:baseline;font-size:0.97rem}
  .answers li>span:last-child{min-width:0;overflow-wrap:anywhere}
  .answers .name{font-weight:600}
  .answers .mine .name::after{content:" (you)";font-weight:400;color:var(--vapour-dim)}
  .answers .empty{color:var(--vapour-dim)}
  details.add>summary{cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:0.4rem;font-family:var(--display);font-weight:700;color:var(--acc)}
  details.add>summary::-webkit-details-marker{display:none}
  details.add>summary::after{content:"\2192"}
  details.add[open]>summary::after{content:"\2193"}
  details.add[open]>summary{margin-bottom:0.7rem}
  .form{display:grid;gap:0.65rem}
  .choices{display:flex;flex-wrap:wrap;gap:0.45rem}
  .choices button{font-family:var(--mono);font-size:13px;letter-spacing:0.04em;padding:0.45rem 0.85rem;border-radius:999px;border:1px solid var(--line-strong);background:transparent;color:var(--foam);cursor:pointer;min-height:40px}
  .choices button[aria-pressed="true"]{color:var(--abyss);border-color:transparent}
  .choices button.go[aria-pressed="true"]{background:var(--bud)} .choices button.wait[aria-pressed="true"]{background:var(--solid)}
  .choices button.change[aria-pressed="true"]{background:var(--ghost)} .choices button.c1[aria-pressed="true"]{background:var(--liquid)}
  .choices button.c2[aria-pressed="true"]{background:var(--sky)} .choices button.c3[aria-pressed="true"]{background:var(--peach)} .choices button.c4[aria-pressed="true"]{background:var(--lime)}
  .field{position:relative}
  .form textarea,.form input{width:100%;font:inherit;font-size:1rem;padding:0.6rem 0.7rem;border-radius:6px;border:1px solid var(--line-strong);background:rgba(var(--well-rgb),0.7);color:var(--foam)}
  .form textarea{min-height:4.4rem;resize:vertical;padding-right:2.4rem}
  .form label{display:grid;gap:0.3rem;font-size:0.92rem;color:var(--vapour-dim)}
  .as{font-size:0.95rem;color:var(--vapour-dim)}
  .as b{color:var(--foam);font-weight:600}
  .linkish{border:0;background:none;padding:0;color:var(--liquid);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font:inherit}
  .send{justify-self:start;font-family:var(--display);font-weight:700;font-size:0.95rem;padding:0.55rem 1.15rem;border-radius:999px;border:0;background:var(--foam);color:var(--abyss);cursor:pointer}
  .send[disabled]{opacity:0.5;cursor:default}
  .hint{font-size:0.92rem;min-height:1.1rem;margin:0;color:var(--vapour-dim)}
  .means{font-size:0.88rem;line-height:1.4;margin:0;color:var(--vapour-dim)}
  .hint.err{color:var(--err)} .hint.ok{color:var(--bud)}
  /* the chain of phases under the title (spine:o-page-unit 1.111111112) */
  .chain{display:flex;flex-wrap:wrap;align-items:center;gap:0.4rem 0.6rem;margin:0.2rem 0 0.9rem;font-family:var(--mono);font-size:12.5px;letter-spacing:0.03em}
  .chain .ch-k{color:var(--vapour-dim);text-transform:uppercase;letter-spacing:0.1em;font-size:11.5px;margin-right:0.2rem}
  .chain .ch-here{padding:0.15rem 0.6rem;border-radius:999px;border:1px solid var(--acc);color:var(--acc)}
  .chain .ch-here a{color:inherit}
  .chain .ch-link{padding:0.15rem 0.6rem;border-radius:999px;border:1px solid var(--line-strong);color:var(--foam);text-decoration:none}
  .chain .ch-link:hover{border-color:var(--acc)}
  .chain .ch-link.ch-none{opacity:0.55}
  .chain .ch-w{color:var(--vapour-dim)}
  /* builder's layer (theme.js siteBuilder): what people have said about a part, shown only in builder mode */
  .answers li.relayed{opacity:0.82}
  .build-under{margin:1rem 0 0.4rem;padding:0.75rem 0.9rem;border:1px dashed var(--line-strong);border-radius:var(--radius,8px);display:grid;gap:0.5rem}
  .build-under .bu-h{font-family:var(--mono);font-size:11.5px;letter-spacing:0.08em;text-transform:uppercase;color:var(--vapour-dim)}
  .build-under .bu-at{margin-left:0.4rem;opacity:0.75}
  .build-under .bu-lines{list-style:none;margin:0;padding:0;display:grid;gap:0.35rem;font-size:0.95rem;overflow-wrap:anywhere}
  .build-under .bu-lines b{margin-right:0.35rem}
  .build-under .bu-lines li.mine b{color:var(--acc)}
  .build-under .bu-none{margin:0;font-size:0.9rem;color:var(--vapour-dim)}
  .build-under .bu-add>summary{cursor:pointer;color:var(--acc);font-weight:600;font-size:0.95rem}
  .build-under .form{display:grid;gap:0.5rem;margin-top:0.5rem}

  /* the room, and the lines for one's own AI */
  .talk{list-style:none;margin:0.4rem 0 1rem;padding:0;display:grid;gap:0.7rem}
  .talk li{border-left:2px solid var(--line-strong);padding-left:0.85rem;min-width:0;overflow-wrap:anywhere}
  .talk .meta{font-family:var(--mono);font-size:11.5px;color:var(--vapour-dim)}
  .copyline textarea{width:100%;min-height:6.2rem;resize:vertical;font-family:var(--mono);font-size:13px;line-height:1.5;padding:0.7rem;border-radius:6px;border:1px solid var(--line);background:rgba(var(--well-rgb),0.7);color:var(--foam)}

  /* the index: the words alone in the band, and on the shelf each proposal with its quipu beside it */
  .band.solo .wrap{max-width:46rem;grid-template-columns:minmax(0,1fr)}
  /* a person's arrangement (/proposals/<handle>): the band's heading says whose, so the panel's own is not said twice;
     it holds a name and the long word 'arrangement', so on a phone it is sized to the screen and a long name may break */
  #arranged .arr-who{display:none}
  /* its switch, flat: Sections or List, the chosen one filled */
  .views{display:flex;flex-wrap:wrap;gap:0.45rem;margin:0.4rem 0 0}
  .views [role=tab]{font-family:var(--mono);font-size:13px;letter-spacing:0.04em;padding:0.45rem 1rem;border-radius:999px;border:1px solid var(--line-strong);background:transparent;color:var(--foam);cursor:pointer;min-height:40px}
  .views [role=tab]:hover{border-color:var(--acc)}
  .views [role=tab][aria-selected="true"]{background:var(--acc);color:var(--abyss);border-color:transparent}
  #sectionsView,#arranged{border-top:0;padding-top:1rem}
  #sectionsView[hidden],#arranged[hidden]{display:none}
  /* Cards spread as wide as the sections do, so cards sit side by side (a block, so the margin's 100% is the column's) */
  #arranged.cards{display:block}
  #arranged.cards #arrangePanel{--gw:max(100%, min(72rem, calc(100vw - 32px)));width:var(--gw);margin-left:calc((100% - var(--gw)) / 2)}
  #arrHead{font-size:clamp(1.6rem,8.4vw,3.6rem);overflow-wrap:anywhere}
  /* the shelf: the proposals in sections by where each stands, new, being decided, being built, complete, each a
     narrow card with its quipu beneath its buttons, set side by side as wide as the bar above (David, 4 Nov 2026) */

      none.hidden = !Q.length || shown > 0;
      none.textContent = settled < shelf.length ? 'Nothing yet; the list is still being read.' : 'Nothing on the list matches that.';
    }
    /* newest first: in its section before every card the list holds from earlier, wherever those have already landed */
    function place(i, g, html) {
      var b = root._run === run && box(g); if (!b) return;
      var cards = b.querySelector('.cards'), before = null, tmp = document.createElement('div');
      for (var c = cards.firstElementChild; c; c = c.nextElementSibling) if (+c.getAttribute('data-i') < i) { before = c; break; }
      tmp.innerHTML = html;
      var card = tmp.firstElementChild;
      card.setAttribute('data-find', ['.nm', '.what', '.stat'].map(function (s) { var x = card.querySelector(s); return x ? x.textContent : ''; }).join(' ').toLowerCase());
      card.hidden = !shows(card);
      cards.insertBefore(card, before);
    }
    shelf.forEach(function (s, i) {
      Promise.all([readBlock('spine:' + s.name), readBlock('function:' + s.name), readMirrors(s.name, true),
        window.beachThreads ? beachThreads.read(s.name).catch(function () { return { threads: [] }; }) : Promise.resolve({ threads: [] })]).then(function (four) {
        if (root._run !== run) return;
        var spine = four[0], law = four[1], m = four[2], th = (four[3] && four[3].threads) || [];
        if (!spine) { place(i, 'unread', shelfCard(s, i, 'not yet on the beach', snazzyAt(s.page, true), false)); return; }
        learnCase(JSON.stringify(spine));
        var steps = stepsOf(spine), decs = decisionsOf(steps, roomsOf(spine)), mirrors = m.mirrors || {};
        var people = {}, answers = 0, latest = '', mine = 0;
        decs.forEach(function (d) {
          var got = answersAt(mirrors, d);
          got.forEach(function (a) { people[a.who] = 1; answers++; });
          if (opts.who && got.some(function (a) { return a.who === opts.who; })) mine++;
        });
        Object.keys(m.touched || {}).forEach(function (h) { if (people[h] && String(m.touched[h]) > latest) latest = m.touched[h]; });
        var L2 = lawOf(law, s.name), phase = L2.phase || (steps.some(function (x) { return x.state; }) ? 'project' : 'proposal');
        var x = { phase: phase, steps: steps.length, decs: decs.length, answers: answers, people: Object.keys(people).length, threads: th.length, latest: latest, mine: mine };
        var g = opts.groupOf(x), stat = opts.statOf(x, g);
        /* the snazzy page as the standard view finds it (its law's 6, its spine's root 2, then its line), so a card whose
           line names none, as leros-on-the-commons's, still offers it */
        place(i, g, shelfCard(s, i, stat, snazzyAt(pageOf(L2, spine, s), true), true));
        SHELF[s.name] = { g: quipuGroup(s.name, steps, mirrors, th), label: s.name + ': ' + phase + ' · ' + stat + '. Each step links to its section on the proposal’s page.' };
        drawShelfQuipu(s.name);
      }).catch(function () {
        if (root._run === run && !root.querySelector('#c-' + s.name)) place(i, 'unread', shelfCard(s, i, 'couldn’t be read just now', snazzyAt(s.page, true), false));
      }).then(function () { if (root._run === run) { settled++; tally(); } });
    });
    tally();
  }

  /* ════════ the index: every proposal on the beach's list, and the form itself ════════ */
  function indexPage() {
    document.title = 'Proposals';
    $('quipu').remove(); document.querySelector('.band').classList.add('solo');
    Promise.all([readBlock('function:proposal'), readBlock('proposals')]).then(function (two) {
      var form = two[0], list = two[1];
      if (!form) { $('bandText').innerHTML = '<div class="eyebrow">Proposals</div><h1>Proposals</h1><p class="lede">The proposal form couldn’t be found on the beach just now.</p>'; return; }
      learnCase(JSON.stringify(form));
      var shelf = shelfOf(list);
      /* the list alone, and at its top one button to the reader's own arrangement, a page of its own; a reader the
         page does not know starts from David's, the default (function:arrangement 4), where dragging makes it theirs
         (David, 27 Oct 2026: "Just show the list and at the top add a simple button to go to the user's arrangement") */
      /* the reader's own page opens on whichever view they chose last; a reader the page does not know is taken to the
         default's list, where dragging makes an arrangement theirs (function:arrangement 5) */
      var mine = '<a class="btn line" href="/proposals/' + esc(encodeURIComponent(ME || (window.beachArrange && beachArrange.DEFAULT) || 'happyseaurchin')) + (ME ? '' : '#list') + '">' + (ME ? 'Your proposals' : 'Arrange your own') + '</a>';
      $('bandText').innerHTML = '<div class="eyebrow">The proposal form · on the beach</div>' +
        '<h1><a href="/proposal">Proposals</a></h1>' +
        '<p class="lede">A proposal kept on the beach grows into its project’s page. It starts as a few steps with a decision at each, answered by anyone in their own words; as the decisions stand and the work begins, threads tie each piece of work to it, so one address carries the proposal and then the project.</p>' +
        '<p class="sub">Every one is drawn live from its own blocks. Any AI with the beach connected can set one up from the form alone.</p>' +
        '<div class="actions"><a class="btn primary" href="#shelf">See them</a>' + mine + '<a class="btn line" href="#make">Make one with your AI</a><a class="btn line" href="/explain?block=function:proposal">Read the form</a></div>';
      var sections = [];
      /* the shelf in four sections (function:proposal 6; David, 16 Nov 2026: "if we split them up as not touched (the
         first lot), with some responses and ready to be build (the second lot), and then the third is completed", and "a
         category for 'others' for now"): not touched while nobody has answered; answered once anyone has, or once it is a
         project, ready to build or being built; complete once its keeper says so or it is set aside; and others, every
         family on the list whose phase names another kind, an inquiry, a walk, a recipe or an explainer. A card lands in
         its section once its blocks are read, newest on the list first, and a section counts what it shows. */
      sections.push('<section id="shelf"><div class="addr">live from the beach · the list, at <b>proposals</b>, newest first</div><h2>The proposals</h2>' +
        (shelf.length ? '<div id="shelfIn"></div><div id="waitingIn"></div>' : '<p class="note">The list couldn’t be read from the beach just now. Try again in a moment.</p>') +
        '<p class="note">A crafted page wears a look of its own taken from what it proposes: its own palette and type, a drawing that moves at the top, an instrument for each step, and plain words for someone new to the beach. <a href="/explain?block=ways:proposal">The craft of making one</a>. The page drawn from its blocks needs no code at all, and exists the moment a spine and its law stand.</p></section>');
      var how = [];
      for (var k = 1; k <= 7; k++) { var r = form[String(k)]; if (r == null) continue; var sp = split(textOf(r)); how.push('<details class="fold"><summary>' + esc(sentenceCase(sp.title)) + '</summary><div class="in"><p>' + rich(cap(sp.rest)) + '</p></div></details>'); }
      sections.push('<section id="how"><div class="addr">the form, live from <b>function:proposal</b></div><h2>How a proposal works</h2>' +
        '<p class="lead">' + rich(split(textOf(form)).rest) + '</p><div class="more">' + how.join('') + '</div></section>');
      sections.push('<section id="make"><div class="addr">for your own AI</div><h2>Make one</h2>' +
        '<p>If your Claude has the beach connected, paste this in with what you want to propose, and who should decide. It reads the form, reads what already stands about the topic and the people, tells you what it is about to make, and writes the proposal as blocks under your own key. The page then exists at <code>happyseaurchin.com/proposal/&lt;its name&gt;</code>.</p>' +
        '<div class="copyline"><textarea id="makeLine" readonly aria-label="A line to paste into your own Claude"></textarea>' +
        '<p style="margin-top:0.6rem"><button type="button" class="linkish" id="copyMake">Copy the line</button> <span class="hint" id="copiedMake" aria-live="polite"></span></p></div>' +
        '<ol class="steps"><li>The steps: what we are building, how it works for the people who use it, the money, who pays at each scale, the build order. Or your own.</li>' +
        '<li>A decision at each step that needs one, answered GO, NOT YET or CHANGE, or with words of its own.</li>' +
        '<li>A room for talk, open to anyone.</li>' +
        '<li>Listed in your own list, <code>proposed:&lt;your handle&gt;</code>, with nobody\u2019s permission: it shows here once it passes the check.</li>' +
        '<li>As the decisions stand and work begins: each piece of work tied as a thread, so the page grows into the project’s own.</li>' +
        '<li>If it earns one, a crafted page of its own: your AI follows <a href="/explain?block=ways:proposal">the craft</a>, from the design bar to the hand-over, and weft puts the page up.</li></ol></section>');
      $('main').innerHTML = sections.join('');
      $('makeLine').value = 'Read function:proposal on https://beach.happyseaurchin.com, then function:document and function:thread, and help me set up a proposal on the beach, following its MAKING ONE at 7. The topic: <what you want to propose>. Who decides: <names>. Tell me what you are about to make before you write anything, and write it under my own key.';
      $('copyMake').addEventListener('click', copier('makeLine', 'copiedMake'));
      $('foot').innerHTML = '<p>The list is its own block on the beach, <a href="/explain?block=proposals">proposals</a>: a line for each proposal, and for each inquiry, walk, recipe or explainer laid out on the same form, added by its keeper when it is shared, and it grows as they come. Anyone may list a proposal they made in a block of their own, <code>proposed:&lt;handle&gt;</code>, a line <code>&lt;name&gt; — what it is · its page</code> under their own key, with nobody\u2019s permission: it shows here once its blocks pass the check, and waits below the list, saying what to mend, while they do not. Every card and every cord above is read live from that proposal’s own blocks. The form: <a href="/explain?block=function:proposal">function:proposal</a>, on <a href="/explain?block=function:document">the document form</a> and <a href="/explain?block=function:thread">the thread</a>.</p><p id="create-your-own"><a href="/">happyseaurchin.com</a></p>';
      var OPTS = {
        groups: [
          { g: 'new', h: 'Not touched', say: 'Nobody has answered yet.' },
          { g: 'answered', h: 'Answered', say: 'Answers are in: ready to build, or being built; lit bars on a cord are its step’s state.' },
          { g: 'done', h: 'Complete', say: 'Done, or set aside once its work moved into blocks of its own.',
            none: 'None yet. A keeper marks theirs complete with one line in its law: <code>phase: complete</code>.' },
          { g: 'others', h: 'Others', say: 'Laid out on the same form, with nothing to build: inquiries, walks, recipes and explainers, each card saying which.' }
        ],
        groupOf: function (x) {
          return x.phase === 'complete' || x.phase === 'set aside' ? 'done' : x.phase === 'inquiry' || phaseKind(x.phase) ? 'others' : x.answers || x.phase === 'project' ? 'answered' : 'new';
        },
        /* the section says the phase, so a card says it only where its section holds more than one: a project among the
           answered, complete or set aside, and the kind of each of the others */
        statOf: function (x, g) {
          return (g === 'done' ? [x.phase] : g === 'others' ? [aKind(x.phase)] : x.phase === 'project' ? ['a project'] : []).concat(countsOf(x, true)).join(' · ') + latestOf(x);
        }
      };
      listInto(shelf, list, OPTS);
    }, function () {
      $('bandText').innerHTML = '<div class="eyebrow">Proposals</div><h1>Proposals</h1><p class="lede">The beach couldn’t be read just now. Try again in a moment.</p>';
    });
  }

  /* ════════ one person's page of the proposals (function:arrangement 5): a switch between Sections, every proposal by
     what that person has answered; List, their arrangement as nested rows; and Cards, the same arrangement as cards
     inside cards, dragged into one another. The reader's choice is kept on their device (David, 4 Nov 2026: "in the
     same multi-section listing (but sorted in terms of whether the user hasn't added content (top), supplied content
     (middle) and completed (bottom)), versus the embedded listed arrangement versus the more graphical card-nesting") ════════ */
  function arrangementPage() {
    $('quipu').remove(); document.querySelector('.band').classList.add('solo');
    $('bar-name').textContent = ARR;
    var VIEWS = ['sections', 'list', 'cards'], asked = location.hash.slice(1), kept = store.get('proposals:view');
    var VIEW = VIEWS.indexOf(asked) >= 0 ? asked : VIEWS.indexOf(kept) >= 0 ? kept : 'sections';
    var PERSON = ARR, SHELFLIST = null, drawnFor = '', listShow = null, panel = null;
    $('bandText').innerHTML = '<div class="eyebrow">Proposals · as each person sees them</div><h1 id="arrHead">Reading the beach…</h1>' +
      '<p class="lede" id="arrLede"></p><div class="actions"><a class="btn line" href="/proposal">Every proposal</a></div>';
    $('main').innerHTML = '<div class="views" role="tablist" aria-label="How the proposals are shown">' +
        '<button type="button" role="tab" id="tab-sections" aria-controls="sectionsView" data-view="sections">Sections</button>' +
        '<button type="button" role="tab" id="tab-list" aria-controls="arranged" data-view="list">List</button>' +
        '<button type="button" role="tab" id="tab-cards" aria-controls="arranged" data-view="cards">Cards</button></div>' +
      '<section id="sectionsView" role="tabpanel" aria-labelledby="tab-sections" hidden></section>' +
      '<section id="arranged" role="tabpanel" aria-labelledby="tab-list" hidden><div id="arrangePanel"><p class="note">Reading the arrangement…</p></div></section>';
    $('foot').innerHTML = '<p>Sections read every proposal on the beach’s list, <a href="/explain?block=proposals">proposals</a>, and sort them by the answers in that person’s own mirrors; nothing is kept for them. Each arrangement is its holder’s own block on the beach, <code>arrangement:&lt;handle&gt;</code>, kept whole under their own key, each position a proposal by its name. The law: <a href="/explain?block=function:arrangement">function:arrangement</a>.</p><p id="create-your-own"><a href="/">happyseaurchin.com</a></p>';
    function me() { return beachVoice.name ? beachVoice.name() : ME; }
    function nameOf(h) { return h === (window.beachArrange && beachArrange.DEFAULT) ? 'David' : h; }
    /* the band says whose page it is and what the view shows */
    function heading() {
      var t, lede, bar;
      if (VIEW === 'sections') {
        var you = PERSON === me(), n = nameOf(PERSON);
        t = you ? 'Your proposals' : n + '’s proposals';
        lede = 'Every proposal on the beach, sorted by what ' + (you ? 'you have' : n + ' has') + ' answered: not yet, partly, then nothing left to answer.';
        bar = you ? 'yours' : n + '’s';
      } else {
        t = listShow ? listShow.title : 'Reading the arrangement…';
        lede = 'Each person nests the proposals their own way, in their own block and under their own key. Nothing is written onto a proposal by nesting it, and nobody’s arrangement is the structure.';
        bar = listShow ? listShow.bar : ARR;
      }
      $('arrHead').textContent = t; $('arrLede').textContent = lede; $('bar-name').textContent = bar;
      document.title = t + ' · proposals';
    }
    /* every proposal on the list, in the sections of what this person has answered in their own mirrors */
    function sectionsDraw() {
      if (drawnFor === PERSON) return;
      drawnFor = PERSON;
      var el = $('sectionsView'), you = PERSON === me(), n = nameOf(PERSON), who = PERSON;
      (SHELFLIST ? Promise.resolve(SHELFLIST) : readBlock('proposals').then(function (l) { return withMakers(shelfOf(l), l).then(function (got) { SHELFLIST = got.shelf; return SHELFLIST; }); })).then(function (shelf) {
        if (who !== PERSON) return;
        if (!shelf.length) { el.innerHTML = '<p class="note">The list couldn’t be read from the beach just now. Try again in a moment.</p>'; drawnFor = ''; return; }
        shelfInto(el, shelf, {
          who: who,
          groups: [
            { g: 'todo', h: 'Not answered yet', say: (you ? 'You haven’t' : n + ' hasn’t') + ' answered any of its decisions.' },
            { g: 'partly', h: 'Partly answered', say: (you ? 'You’ve' : n + ' has') + ' answered some of its decisions; each card says how many.' },
            { g: 'done', h: 'Nothing left to answer', say: (you ? 'You’ve' : n + ' has') + ' answered every decision, or it asks none, or it is complete.' }
          ],
          groupOf: function (x) { return x.phase === 'complete' || x.phase === 'set aside' || !x.decs || x.mine >= x.decs ? 'done' : x.mine ? 'partly' : 'todo'; },
          statOf: function (x) {
            return (x.phase === 'complete' || x.phase === 'set aside' ? [x.phase] : x.phase === 'inquiry' || phaseKind(x.phase) ? [aKind(x.phase)] : [])
              .concat([x.decs ? x.mine + ' of ' + x.decs + ' answered' : 'no decisions'], countsOf(x, false)).join(' · ') + latestOf(x);
          }
        });
      }, function () { drawnFor = ''; el.innerHTML = '<p class="note">The beach couldn’t be read just now. Try again in a moment.</p>'; });
    }
    function setView(v, chosen) {
      VIEW = v;
      if (chosen) { store.set('proposals:view', v); if (location.hash) history.replaceState(null, '', location.pathname + location.search); }
      document.querySelectorAll('.views [role=tab]').forEach(function (b) {
        var on = b.getAttribute('data-view') === v; b.setAttribute('aria-selected', on ? 'true' : 'false'); b.tabIndex = on ? 0 : -1;
      });
      $('sectionsView').hidden = v !== 'sections'; $('arranged').hidden = v === 'sections';
      /* List and Cards are one panel drawn two ways, so what it shows, or what is being arranged, carries across */
      $('arranged').classList.toggle('cards', v === 'cards');
      if (v !== 'sections') { $('arranged').setAttribute('aria-labelledby', 'tab-' + v); if (panel) panel.layout(v); }
      if (v === 'sections') sectionsDraw();
      heading();
    }
    document.querySelectorAll('.views [role=tab]').forEach(function (b) { b.addEventListener('click', function () { setView(b.getAttribute('data-view'), true); }); });
    document.querySelector('.views').addEventListener('keydown', function (e) {
      if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
      var v = VIEWS[(VIEWS.indexOf(VIEW) + (e.key === 'ArrowRight' ? 1 : VIEWS.length - 1)) % VIEWS.length];
      setView(v, true); $('tab-' + v).focus(); e.preventDefault();
    });
    if (!window.beachArrange) $('arrangePanel').innerHTML = '<p class="note">The arrangement couldn’t be drawn just now. Try again in a moment.</p>';
    else panel = beachArrange.draw($('arrangePanel'), { handle: ARR, layout: VIEW === 'cards' ? 'cards' : 'list', onShow: function (roots, who, how) {
      var m = me(), whose = nameOf(who);
      var title = how === 'list' ? 'The proposals, as the list stands' : how === 'arranging' ? 'Arranging yours' : who === m ? 'Your arrangement' : whose + '’s arrangement';
      listShow = { title: title, bar: how === 'list' ? 'the list' : how === 'arranging' || who === m ? 'yours' : whose + '’s' };
      /* the address says whose arrangement is drawn, so it is handed on as it stands, and the sections follow it */
      if ((how === 'kept' || how === 'said') && who) {
        var at = '/proposals/' + encodeURIComponent(who);
        if (location.pathname.replace(/\/$/, '') !== at) history.replaceState(null, '', at + location.search + location.hash);
        if (who !== PERSON) { PERSON = who; if (VIEW === 'sections') sectionsDraw(); }
      }
      heading();
    } });
    setView(VIEW, false);
  }

  if (NAME) proposalPage(); else if (ARR) arrangementPage(); else indexPage();
})();
</script>
<script>if (window.siteDoors) siteDoors({ here: location.pathname.replace(/^\//, '').replace(/\/$/, '') === 'proposal' ? 'proposal' : 'proposal/x', site: true });</script>
