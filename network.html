<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The table</title>
<meta name="description" content="A living page: what this network is gathering, who has spoken, and a box to speak — no account, no install.">
<meta property="og:title" content="The table">
<meta property="og:description" content="Read what stands, say your line, watch it land.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Space+Mono:wght@400;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme.css">
<script src="/theme.js"></script>
<style>
  *{box-sizing:border-box} html,body{margin:0}
  body{
    font-family:var(--body); color:var(--foam); font-size:18px; line-height:1.6;
    background:radial-gradient(1100px 560px at 70% -10%, rgba(var(--liquid-rgb),0.10), transparent 60%),
      linear-gradient(180deg,var(--ground-top) 0%, var(--deep) 30%, var(--abyss) 100%);
    background-attachment:fixed; -webkit-font-smoothing:antialiased; min-height:100dvh;
  }
  ::selection{background:rgba(var(--liquid-rgb),0.30);color:var(--foam)}
  a{color:var(--liquid);text-decoration:none;border-bottom:1px solid rgba(var(--liquid-rgb),0.35)}
  a:hover{color:var(--foam);border-color:var(--foam)}
  .hidden{display:none !important}
  .wrap{max-width:640px;margin:0 auto;padding:0 18px}

  .head{padding:34px 0 6px}
  .head h1{font-family:var(--display);font-weight:800;font-size:clamp(1.5rem,6vw,2.2rem);line-height:1.1;margin:0}
  .head h1 .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--liquid);box-shadow:0 0 12px var(--liquid);margin-left:10px;vertical-align:middle}
  .welcome{font-size:1.16rem;line-height:1.55;color:var(--foam);padding:14px 0 4px}
  .welcome p{margin:0 0 12px}

  .card{background:linear-gradient(165deg,rgba(var(--card-hi-rgb),0.5) 0%,rgba(var(--card-rgb),0.5) 100%);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:14px 0}

  .speak .chip{display:inline-flex;align-items:center;gap:8px;font-size:0.86rem;color:var(--vapour);background:rgba(var(--well-rgb),0.5);border:1px solid var(--line);border-radius:999px;padding:5px 12px;margin:0 0 10px;max-width:100%}
  .speak .chip b{color:var(--liquid);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52vw}
  .speak .chip button{background:none;border:none;color:var(--vapour-dim);cursor:pointer;font-size:1rem;line-height:1;padding:0 2px}
  .speak .chip button:hover{color:var(--foam)}
  .speak textarea{width:100%;background:rgba(var(--well-rgb),0.6);border:1px solid var(--line-strong);border-radius:10px;color:var(--foam);font-family:var(--body);font-size:17px;padding:12px 14px;outline:none;resize:vertical;min-height:76px}
  .speak textarea:focus{border-color:var(--liquid)}
  .speak .row{display:flex;gap:8px;margin-top:10px}
  .speak input{flex:1;min-width:0;background:rgba(var(--well-rgb),0.6);border:1px solid var(--line);border-radius:10px;color:var(--foam);font-family:var(--body);font-size:15px;padding:10px 14px;outline:none}
  .speak input:focus{border-color:var(--liquid)}
  .speak button.go{background:var(--liquid);border:none;border-radius:10px;color:var(--abyss);font-family:var(--display);font-weight:700;font-size:15px;padding:10px 22px;cursor:pointer;min-height:44px}
  .speak button.go:hover{background:var(--foam)}
  .speak button.go:disabled{opacity:0.5;cursor:wait}
  .speak .hint{font-size:0.85rem;color:var(--vapour-dim);margin-top:10px}
  .speak .hint.ok{color:var(--liquid)} .speak .hint.err{color:var(--solid)}

  .band{margin:26px 0 8px;font-family:var(--display);font-weight:700;font-size:0.95rem;letter-spacing:0.04em;color:var(--vapour)}
  .band small{font-family:var(--body);font-weight:400;color:var(--vapour-dim);letter-spacing:0;margin-left:8px}

  .vrow{padding:11px 0;border-bottom:1px solid var(--line)}
  .vrow:last-child{border-bottom:none}
  .vrow .said{color:var(--foam);font-size:1.02rem;line-height:1.5}
  .vrow .by{font-size:0.82rem;color:var(--vapour-dim);margin-top:3px}
  .vrow .by b{color:var(--solid);font-weight:600}
  .vrow .by .when{font-family:var(--mono);font-size:0.72rem;margin-left:8px}
  .vrow.mine{border-left:3px solid var(--liquid);padding-left:12px;margin-left:-15px}
  .vrow.mine .by b{color:var(--liquid)}
  .vrow.reading .by b{color:var(--solid)}
  .vrow.reading .said{color:var(--vapour);font-style:italic}
  .vnone{font-size:0.9rem;color:var(--vapour-dim);padding:8px 0;font-style:italic}

  .place{margin:0 0 14px}
  .place .lead{display:flex;gap:12px;align-items:baseline}
  .place .no{font-family:var(--mono);font-size:0.72rem;color:var(--vapour-dim);flex:none;padding-top:4px}
  .place .lead .t{font-size:1.06rem;font-weight:500;line-height:1.45}
  .place .forming{font-size:0.8rem;color:var(--liquid);margin:6px 0 0}
  .place details{margin:8px 0 0}
  .place summary{cursor:pointer;font-size:0.85rem;color:var(--vapour-dim);list-style:none;display:inline-block;border-bottom:1px dashed var(--line-strong);padding-bottom:1px}
  .place summary::-webkit-details-marker{display:none}
  .place summary:hover{color:var(--foam)}
  .place .more{font-size:0.94rem;color:var(--vapour);padding:10px 0 0;line-height:1.55}
  .place .more .move{display:flex;gap:10px;padding:6px 0 0;font-size:0.9rem;color:var(--vapour)}
  .place .more .move .no{min-width:16px;padding-top:2px}
  .place .acts{display:flex;gap:18px;margin-top:9px;font-size:0.86rem}
  .place .acts a{border-bottom:none}
  .place .acts .here{cursor:pointer;color:var(--liquid)}
  .place .acts .here:hover{color:var(--foam)}
  .place .voices{margin-top:4px}

  .frow{padding:12px 4px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:baseline}
  .frow:last-child{border-bottom:none}
  .frow .name{font-family:var(--display);font-weight:700;font-size:0.98rem;flex:none}
  .frow .what{flex:1;color:var(--vapour);font-size:0.92rem}
  .frow a{border-bottom:none}

  .state{padding:70px 26px;text-align:center;max-width:460px;margin:0 auto}
  .state h2{font-family:var(--display);font-size:1.35rem;margin:0 0 10px}
  .state p{color:var(--vapour-dim)}

  .foot{max-width:640px;margin:0 auto;padding:30px 18px 48px;font-size:0.86rem;color:var(--vapour-dim)}
  .foot .door{margin:0 0 10px}
  .foot .whisper{font-size:0.78rem;font-style:italic}
  @media (prefers-reduced-motion: no-preference){
    .vrow.landed{animation:land 1.2s ease-out}
    @keyframes land{from{background:rgba(var(--liquid-rgb),0.14)}to{background:transparent}}
  }
</style>
</head>
<body>
<script>document.documentElement.classList.remove('no-js');</script>

<main class="wrap hidden" id="main">
  <div class="head"><h1><span id="h-name"></span><span class="dot" title="live"></span></h1></div>
  <div class="welcome" id="welcome"></div>

  <div class="card speak" id="speak">
    <div class="chip" id="chip"><span>your words will land</span><b id="chip-where">at the table</b><button id="chip-x" class="hidden" title="back to the table" aria-label="back to the table">×</button></div>
    <textarea id="note" rows="3" placeholder="Say it in your own words — no account, no sign-up."></textarea>
    <div class="row">
      <input id="who" placeholder="your name (optional — remembered)" autocomplete="nickname">
      <button class="go" id="post" type="button">Speak</button>
    </div>
    <div class="hint" id="hint">What you write lands on the table below, in public, under the name you give.</div>
  </div>

  <div id="field"></div>
</main>

<div id="state" class="state hidden"><h2 id="state-title"></h2><p id="state-body"></p></div>
<div class="foot hidden" id="foot"></div>

<script>
(function(){
'use strict';
const HOME = 'beach.happyseaurchin.com';
const Q = new URLSearchParams(location.search);
const NAME = (Q.get('name')
  || (location.pathname.match(/\/network\/([^\/?#]+)\/?$/) || [])[1]
  || '').replace(/[^a-zA-Z0-9-]/g,'');

/* ---------- beach reads (same wire the offer page proved) ---------- */
function beachUrl(){ return 'https://' + HOME + '/.well-known/pscale-beach'; }
async function readBlock(name){
  const r = await fetch(beachUrl() + '?block=' + encodeURIComponent(name), { headers:{Accept:'application/json'}, cache:'no-store' });
  if (r.status === 404) return null;
  if (!r.ok) throw new Error('read failed: ' + r.status);
  return r.json();
}
async function readIndex(){
  const r = await fetch(beachUrl(), { headers:{Accept:'application/json'}, cache:'no-store' });
  if (!r.ok) throw new Error('index failed: ' + r.status);
  return r.json();
}

/* ---------- walkers (as /view and /tree read them: raw digits, 0 steps into the underscore) ---------- */
function voiceOf(node){
  let n = node;
  while (n && typeof n === 'object') { if (!('_' in n)) return null; n = n['_']; }
  return typeof n === 'string' ? n : null;
}
function digitKeys(node){
  if (!node || typeof node !== 'object') return [];
  return Object.keys(node).filter(k => /^[1-9]$/.test(k)).sort();
}
function walkTo(block, walk){
  let n = block;
  for (const ch of walk){
    if (!n || typeof n !== 'object') return undefined;
    n = (ch === '0') ? n['_'] : n[ch];
  }
  return n;
}
function textAt(node){
  if (node === undefined || node === null) return null;
  if (typeof node === 'string') return node.trim() || null;
  return voiceOf(node);
}
const esc = s => { const d = document.createElement('span'); d.textContent = s == null ? '' : s; return d.innerHTML; };
const $ = id => document.getElementById(id);

/* Links inside what people wrote stay doors; everything else reaches the DOM escaped. */
const LINK = /(https?:\/\/[^\s<>"']+|(?:[a-z0-9][a-z0-9-]*\.)+[a-z]{2,}\/[^\s<>"']*)/gi;
function linkify(s){
  s = s == null ? '' : String(s);
  let out = '', last = 0, m;
  LINK.lastIndex = 0;
  while ((m = LINK.exec(s))){
    out += esc(s.slice(last, m.index));
    let url = m[0], tail = '';
    const t = url.match(/[.,;:!?)\]]+$/);
    if (t){ tail = t[0]; url = url.slice(0, -tail.length); }
    const href = /^https?:\/\//i.test(url) ? url : 'https://' + url;
    out += '<a href="' + esc(href) + '" target="_blank" rel="noopener noreferrer">' + esc(url) + '</a>' + esc(tail);
    last = m.index + m[0].length;
  }
  return out + esc(s.slice(last));
}
const short = (s,n) => { s = s || ''; return s.length > n ? s.slice(0,n).replace(/\s+\S*$/,'') + ' …' : s; };
const ISO_STAMP = /^\d{4}-\d{2}-\d{2}T/;
function ago(ts){
  const t = Date.parse(ts); if (!Number.isFinite(t)) return '';
  const s = Math.max(0, (Date.now() - t) / 1000);
  if (s < 90) return 'just now';
  if (s < 5400) return Math.round(s/60) + 'm ago';
  if (s < 129600) return Math.round(s/3600) + 'h ago';
  return Math.round(s/86400) + 'd ago';
}

/* Voices in a gathering: text at the underscore, name at 1, where-it-stands at 2
 * (a stamp-shaped 2 is an old arrival mark, not a standing), stamps at 3 or 6.
 * Deep digit paths are the ladder growing past nine; the underscore wrap holds
 * the older lines — both walked, so no voice is dropped for being early. */
function slotsOf(node, out){
  out = out || [];
  if (!node || typeof node !== 'object') return out;
  for (const d of digitKeys(node)){
    const kid = node[d];
    const text = textAt(kid);
    if (text){
      const f = k => (kid && typeof kid === 'object' && typeof kid[k] === 'string') ? kid[k] : '';
      const two = f('2');
      out.push({
        text,
        who: f('1'),
        at: (two && !ISO_STAMP.test(two) && /^[1-9][0-9]*$/.test(two)) ? two : '',
        ts: ISO_STAMP.test(f('3')) ? f('3') : (ISO_STAMP.test(f('6')) ? f('6') : ''),
      });
    } else if (kid && typeof kid === 'object') slotsOf(kid, out);
  }
  if (node['_'] && typeof node['_'] === 'object') slotsOf(node['_'], out);
  return out;
}

function showState(title, body){
  $('main').classList.add('hidden'); $('foot').classList.add('hidden');
  $('state-title').textContent = title;
  $('state-body').innerHTML = body;
  $('state').classList.remove('hidden');
}

const pretty = n => n.replace(/-/g, ' ');
const myName = () => (localStorage.getItem('render:who') || '').trim();

/* ---------- state ---------- */
let SPINE = null;          /* the running order, if this gathering has one */
let STANDING = '';         /* which place the box speaks at; '' = the table */
let PLACES = {};           /* digit → its first-sentence name */
let JUST_POSTED = '';      /* the line to mark as landed on the next render */

function firstSentence(s){
  const m = String(s).match(/^.*?[.!?](?=\s|$)/);
  return short((m ? m[0] : String(s)), 160);
}
/* The place's own live door, when its text names one. The sentence moves to a
 * quiet link; the prose keeps its flow without a URL mid-paragraph. */
function doorOf(s){
  const m = String(s).match(/Stand at this item:\s*(https?:\/\/\S+)/i);
  return m ? m[1].replace(/[.,;)\]]+$/, '') : '';
}
function stripDoor(s){
  return String(s).replace(/\s*Stand at this item:\s*https?:\/\/\S+\s*$/i, '').trim();
}

function voiceRow(v, extraClass){
  const mine = v.who && myName() && v.who.toLowerCase() === myName().toLowerCase();
  const landed = JUST_POSTED && v.text === JUST_POSTED;
  return '<div class="vrow' + (mine ? ' mine' : '') + (extraClass ? ' ' + extraClass : '') + (landed ? ' landed' : '') + '">' +
    '<div class="said">' + linkify(v.text) + '</div>' +
    '<div class="by"><b>' + esc(mine ? 'you' : (v.who || 'someone')) + '</b>' +
    (v.ts ? '<span class="when">' + esc(ago(v.ts)) + '</span>' : '') + '</div></div>';
}

/* ---------- the field: welcome, voices at the table, then the places ---------- */
function renderField(pool, liquid, readings){
  const slots = slotsOf(pool);
  slots.sort((a, b) => (b.ts || '').localeCompare(a.ts || ''));
  const atTable = slots.filter(s => !s.at);
  const atPlace = d => slots.filter(s => s.at && s.at[0] === d).reverse();  /* oldest first where you stand */

  /* who is writing right now, place by place — counts only, and only fresh ones */
  const forming = {};
  if (liquid) for (const d of digitKeys(liquid)){
    const slot = liquid[d];
    if (!textAt(slot)) continue;
    const two = (typeof slot['2'] === 'string') ? slot['2'] : '';
    const stamp = ['6','2','3'].map(k => typeof slot[k] === 'string' ? slot[k] : '').find(v => ISO_STAMP.test(v)) || '';
    if (stamp && (Date.now() - Date.parse(stamp)) > 86400000) continue;
    const key = (two && !ISO_STAMP.test(two) && /^[1-9]/.test(two)) ? two[0] : '';
    forming[key] = (forming[key] || 0) + 1;
  }

  const out = [];
  out.push('<div class="band">At the table' + (forming[''] ? '<small>' + forming[''] + ' writing now</small>' : '') + '</div>');
  out.push(atTable.length
    ? atTable.map(v => voiceRow(v)).join('')
    : '<p class="vnone">Nobody has spoken here yet — the first line is yours to leave.</p>');

  if (SPINE){
    out.push('<div class="band">Place by place<small>tap one to stand there</small></div>');
    for (const d of digitKeys(SPINE).filter(x => x !== '9')){
      const item = SPINE[d];
      const t = textAt(item) || '';
      const lead = firstSentence(t);
      PLACES[d] = lead;
      const door = doorOf(t);
      const rest = stripDoor(t).slice(lead.length).trim();
      const moves = digitKeys(item).map(l => ({ l, t: textAt(item[l]) })).filter(m => m.t);
      const voices = atPlace(d);
      const reads = (readings[d] || []);
      out.push('<div class="card place" data-place="' + d + '">' +
        '<div class="lead"><span class="no">' + d + '</span><span class="t">' + linkify(lead) + '</span></div>' +
        (forming[d] ? '<div class="forming">' + forming[d] + ' writing here right now</div>' : '') +
        ((rest || moves.length)
          ? '<details><summary>more about this</summary><div class="more">' +
            (rest ? '<div>' + linkify(rest) + '</div>' : '') +
            moves.map(m => '<div class="move"><span class="no">·</span><span>' + linkify(m.t) + '</span></div>').join('') +
            '</div></details>' : '') +
        '<div class="acts"><span class="here" data-stand="' + d + '">say something here</span>' +
        (door ? '<a href="' + esc(door) + '" target="_blank" rel="noopener noreferrer">step in live →</a>' : '') + '</div>' +
        (voices.length ? '<div class="voices">' + voices.map(v => voiceRow(v)).join('') + '</div>' : '') +
        (reads.length ? '<div class="voices">' + reads.map(v => voiceRow(v, 'reading')).join('') + '</div>' : '') +
        '</div>');
    }
  }
  $('field').innerHTML = out.join('');
  JUST_POSTED = '';
}

function setStanding(d){
  STANDING = d || '';
  $('chip-where').textContent = STANDING ? ('at: ' + short(PLACES[STANDING] || 'this place', 70)) : 'at the table';
  $('chip-x').classList.toggle('hidden', !STANDING);
}

/* ---------- speak ---------- */
function wireSpeak(){
  $('who').value = myName();
  $('chip-x').addEventListener('click', () => setStanding(''));
  $('field').addEventListener('click', ev => {
    const d = ev.target && ev.target.getAttribute && ev.target.getAttribute('data-stand');
    if (!d) return;
    setStanding(d);
    $('note').focus();
    $('speak').scrollIntoView({ behavior: 'smooth', block: 'center' });
  });
  $('post').addEventListener('click', async () => {
    const note = $('note'), hint = $('hint'), post = $('post');
    const text = note.value.trim();
    if (!text){ note.focus(); return; }
    post.disabled = true; hint.className = 'hint'; hint.textContent = 'landing…';
    const who = $('who').value.trim();
    let r;
    try {
      r = await fetch(beachUrl(), { method: 'POST', cache: 'no-store',
        headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
        body: JSON.stringify({ block: 'pool:' + NAME, append: true,
          content: { _: text, '1': who || 'anon', '2': STANDING } }) });
    } catch(err){
      hint.className = 'hint err'; hint.textContent = 'The table is out of reach — check the connection and try again.';
      post.disabled = false; return;
    }
    post.disabled = false;
    if (!r.ok){
      hint.className = 'hint err'; hint.textContent = 'The table could not take that just now — worth trying once more.';
      return;
    }
    if (who) localStorage.setItem('render:who', who);
    hint.className = 'hint ok';
    hint.textContent = 'You’re in — your line stands ' + (STANDING ? 'at: ' + short(PLACES[STANDING] || 'that place', 60) : 'at the table') + '.';
    JUST_POSTED = text;
    note.value = '';
    setTimeout(refresh, 400);
  });
}

/* ---------- load + the slow tick (what people wrote is the one thing that moves) ---------- */
async function readReadings(){
  /* readings people left, gathered from the pages that answer to this name */
  let index;
  try { index = await readIndex(); } catch(err){ return {}; }
  const names = (index.blocks || []).filter(b =>
    b.startsWith(NAME + ':') && /^[A-Za-z][A-Za-z0-9 _-]*$/.test(b.slice(NAME.length + 1)));
  const got = await Promise.all(names.map(n => readBlock(n).catch(() => null)));
  const readings = {};
  names.forEach((n, i) => {
    const b = got[i];
    if (!b || !SPINE) return;
    const who = n.slice(NAME.length + 1);
    for (const d of digitKeys(SPINE)){
      const t = textAt(walkTo(b, d));
      if (t) (readings[d] = readings[d] || []).push({ text: t, who, ts: '' });
    }
  });
  return readings;
}

let READINGS = {};
async function refresh(){
  try {
    const [pool, liquid] = await Promise.all([
      readBlock('pool:' + NAME),
      readBlock('liquid:pool:' + NAME).catch(() => null),
    ]);
    if (pool) renderField(pool, liquid, READINGS);
  } catch(err){ /* keep the last good read */ }
}

async function load(){
  document.title = pretty(NAME) + ' — the table';
  $('h-name').textContent = pretty(NAME);
  let pool, spine, liquid;
  try {
    [pool, spine, liquid] = await Promise.all([
      readBlock('pool:' + NAME),
      readBlock('spine:' + NAME).catch(() => null),
      readBlock('liquid:pool:' + NAME).catch(() => null),
    ]);
  } catch(err){
    return showState('Out of reach', 'This table would not open just now — worth trying again in a minute.');
  }
  if (!pool) return showState('Nothing gathering here yet',
    esc(pretty(NAME)) + ' has no table under this name. <a href="/network">See what is gathering →</a>');
  SPINE = spine;
  const welcome = voiceOf(pool) || '';
  $('welcome').innerHTML = welcome.split(/\n{2,}|\n/).filter(Boolean).map(p => '<p>' + linkify(p) + '</p>').join('');
  renderField(pool, liquid, {});
  $('main').classList.remove('hidden'); $('state').classList.add('hidden');
  $('foot').innerHTML = '<div class="door"><a href="https://xstream.onen.ai/?room=' + encodeURIComponent(NAME) + '" target="_blank" rel="noopener noreferrer">step into the live room →</a></div>' +
    '<div class="whisper">Everything on this page is public, written by the people named on it, and readable by anyone with the link.</div>';
  $('foot').classList.remove('hidden');
  wireSpeak();
  READINGS = await readReadings();
  await refresh();
  setInterval(refresh, 30000);
}

/* ---------- no name: the open tables ---------- */
async function loadCatalogue(){
  document.title = 'The open tables';
  let index;
  try { index = await readIndex(); } catch(err){ return showState('Out of reach', 'Nothing would open just now — worth trying again in a minute.'); }
  const names = (index.blocks || [])
    .filter(b => b.startsWith('pool:') && b.indexOf(':', 5) === -1)
    .map(b => b.slice(5)).sort();
  const roots = await Promise.all(names.map(n => readBlock('pool:' + n).catch(() => null)));
  $('h-name').textContent = 'the open tables';
  $('welcome').innerHTML = '<p>Each of these is a gathering: a page that reads live, and a box that lands what you say on it.</p>';
  $('speak').classList.add('hidden');
  $('field').innerHTML = names.map((n, i) =>
    '<div class="frow"><span class="name"><a href="/network/' + encodeURIComponent(n) + '">' + esc(pretty(n)) + '</a></span>' +
    '<span class="what">' + esc(short(voiceOf(roots[i]) || '', 120)) + '</span></div>').join('');
  $('main').classList.remove('hidden'); $('state').classList.add('hidden');
  $('foot').innerHTML = '<div class="whisper">Everything here is public, written by the people named on it.</div>';
  $('foot').classList.remove('hidden');
}

if (NAME) load(); else loadCatalogue();
})();
</script>
