<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A view — one spec, rendered live</title>
<meta name="description" content="A view: block names a bundle of addresses and a render-mode per entry; this page renders it live from the beach. Publish a view by authoring a block — no code, no deploy.">
<meta property="og:title" content="A view — one spec, rendered live">
<meta property="og:description" content="Pages become blocks: a view is authored as addresses and modes, and rendered live.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Space+Mono:wght@400;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --abyss:#06171E; --deep:#0A2129; --card:#123742; --card-hi:#17434F;
    --vapour:#C4DBDF; --vapour-dim:#82A0A8;
    --liquid:#33C2D2; --liquid-deep:#1B8B99;
    --solid:#E7B24C; --solid-deep:#C58F2C;
    --foam:#EFF6F5;
    --line:rgba(196,219,223,0.13); --line-strong:rgba(196,219,223,0.24);
    --display:'Syne',system-ui,sans-serif;
    --body:'Newsreader',Georgia,serif;
    --mono:'Space Mono',ui-monospace,monospace;
  }
  /* The light register. Every colour on this page is one of the variables above, so a
   * second register is a swap of that list rather than a second stylesheet — the cards,
   * the buttons and the step numerals all follow without knowing it happened. --abyss
   * is the button TEXT colour as well as the page ground, which is why it inverts here
   * to near-white and the buttons stay legible with no rule of their own. */
  :root[data-theme="light"]{
    --abyss:#FBF8F2; --deep:#F3EEE3; --card:#FFFFFF; --card-hi:#FFFDF8;
    --vapour:#3C5A63; --vapour-dim:#6B848D;
    --liquid:#0D6B79; --liquid-deep:#0A5561;
    --solid:#8E6210; --solid-deep:#6F4C08;
    --foam:#12333C;
    --line:rgba(18,51,60,0.14); --line-strong:rgba(18,51,60,0.28);
  }
  :root[data-theme="light"] body{
    background:radial-gradient(1100px 560px at 70% -10%, rgba(13,107,121,0.07), transparent 60%),
      linear-gradient(180deg,#FFFDF8 0%, var(--deep) 45%, #EBE4D6 100%);
  }
  :root[data-theme="light"] .sect{
    background:linear-gradient(165deg,rgba(255,255,255,0.92) 0%,rgba(255,253,248,0.72) 100%);
    box-shadow:0 1px 3px rgba(18,51,60,0.06);
  }
  :root[data-theme="light"] ::selection{background:rgba(13,107,121,0.20)}
  :root[data-theme="light"] .copy pre,
  :root[data-theme="light"] .compose textarea,
  :root[data-theme="light"] .compose input{background:rgba(255,255,255,0.88)}

  *{box-sizing:border-box} html,body{margin:0}
  body{
    font-family:var(--body); color:var(--foam); font-size:17.5px; line-height:1.58;
    background:radial-gradient(1100px 560px at 70% -10%, rgba(51,194,210,0.10), transparent 60%),
      linear-gradient(180deg,#0C2932 0%, var(--deep) 30%, var(--abyss) 100%);
    background-attachment:fixed; -webkit-font-smoothing:antialiased; min-height:100dvh;
  }
  ::selection{background:rgba(51,194,210,0.30);color:var(--foam)}
  a{color:var(--liquid);text-decoration:none;border-bottom:1px solid rgba(51,194,210,0.35)}
  a:hover{color:var(--foam);border-color:var(--foam)}
  .hidden{display:none !important}
  .wrap{max-width:680px;margin:0 auto;padding:0 18px}

  .bar{display:flex;align-items:center;gap:10px;padding:14px 18px 10px;font-family:var(--mono);font-size:12px;letter-spacing:0.08em;color:var(--vapour-dim);max-width:680px;margin:0 auto}
  .bar .dot{width:6px;height:6px;border-radius:50%;background:var(--liquid);box-shadow:0 0 10px var(--liquid);flex:none}
  .bar b{color:var(--foam)}
  .bar a{border-bottom:none;color:var(--vapour-dim)} .bar a:hover{color:var(--liquid)}
  .bar .spacer{flex:1}
  .bar button{background:none;border:1px solid var(--line);border-radius:4px;color:var(--vapour-dim);font-family:var(--mono);font-size:12px;padding:6px 10px;cursor:pointer}
  .bar button:hover{color:var(--foam);border-color:var(--line-strong)}

  .head{padding:10px 0 6px}
  .head h1{font-family:var(--display);font-weight:800;font-size:clamp(1.4rem,5vw,2rem);line-height:1.12;margin:0 0 10px}
  .head h1 .cool{color:var(--liquid)}
  .head .voicing{color:var(--vapour);font-size:0.98rem;max-width:62ch;margin:0 0 10px}
  .meta{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--mono);font-size:11.5px;letter-spacing:0.06em;color:var(--vapour-dim);margin:0 0 4px}
  .meta b{color:var(--liquid);font-weight:700}
  .badge{font-family:var(--mono);font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--solid);border:1px solid rgba(231,178,76,0.4);border-radius:4px;padding:2px 8px}

  .sect{background:linear-gradient(165deg,rgba(23,67,79,0.5) 0%,rgba(18,55,66,0.5) 100%);border:1px solid var(--line);border-radius:14px;padding:18px 20px 14px;margin:0 0 14px}
  .sect__src{font-family:var(--mono);font-size:10.5px;color:var(--vapour-dim);margin:12px 0 0;display:flex;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px}
  .sect__src a{border-bottom:none;color:var(--vapour-dim)} .sect__src a:hover{color:var(--liquid)}
  .sect__src b{color:var(--solid);font-weight:700}

  .quote{font-size:1.14rem;line-height:1.5;font-weight:500;margin:0}
  .crumb{font-family:var(--body);font-style:italic;color:var(--vapour-dim);font-size:0.92rem;margin:0 0 8px;line-height:1.5}
  .kidline{display:flex;gap:10px;align-items:baseline;padding:7px 0 0;font-size:0.94rem;color:var(--vapour)}
  .kidline .no{font-family:var(--mono);font-size:10.5px;color:var(--vapour-dim);flex:none;min-width:44px}

  .vrow{display:flex;gap:12px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line)}
  .vrow:last-child{border-bottom:none}
  .vwho{font-family:var(--mono);font-size:11px;color:var(--solid);flex:none;min-width:96px;text-align:right}
  .vtext{flex:1;min-width:0;color:var(--foam);font-size:0.97rem}
  .vago{font-family:var(--mono);font-size:10px;color:var(--vapour-dim);flex:none}
  .vnone{font-family:var(--mono);font-size:11.5px;color:var(--vapour-dim);padding:6px 0}

  .frow{display:flex;gap:10px;align-items:baseline;padding:7px 0;font-size:0.94rem}
  .fgroup{border-bottom:1px solid var(--line);padding-bottom:6px}
  .fgroup:last-child{border-bottom:none}
  .frow .no{font-family:var(--mono);font-size:10.5px;color:var(--vapour-dim);flex:none;min-width:44px}
  .frow .txt{flex:1;color:var(--vapour)}
  .frow .agg{font-family:var(--mono);font-size:11px;color:var(--solid);flex:none;white-space:nowrap}
  /* fold-lens voice rows — deliberately NOT .vrow, which the voices lens already owns */
  .mrow{display:flex;gap:10px;align-items:baseline;padding:3px 0;font-size:0.9rem}
  .mrow .mwho{font-family:var(--mono);font-size:10.5px;color:var(--solid);flex:none;min-width:74px;text-align:right}
  .mrow .msaid{flex:1;color:var(--vapour);min-width:0}
  .mrow .mmore{font-family:var(--mono);font-size:10.5px;color:var(--vapour-dim)}
  .frow + .mrow{padding-top:6px}

  /* pools lens — one row per gathering: what it is for, what was said, who is staged */
  .prow{display:flex;gap:12px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .prow:last-child{border-bottom:none}
  .prow .pname{font-family:var(--mono);font-size:11.5px;color:var(--solid);flex:none;min-width:150px}
  .prow .pname a{border-bottom:none}
  .prow .pwhat{flex:1;min-width:200px;color:var(--vapour);font-size:0.94rem}
  .prow .pstate{font-family:var(--mono);font-size:10.5px;color:var(--vapour-dim);flex:none;white-space:nowrap;text-align:right;min-width:132px}
  .prow .pstate .live{color:var(--liquid)}
  .prow .pstate .stale{color:var(--solid)}

  .compose textarea{width:100%;background:rgba(6,23,30,0.6);border:1px solid var(--line-strong);border-radius:8px;color:var(--foam);font-family:var(--body);font-size:15px;padding:10px 12px;outline:none;resize:vertical;min-height:64px}
  .compose textarea:focus{border-color:var(--liquid)}
  .compose .row{display:flex;gap:8px;margin-top:8px}
  .compose input{flex:1;background:rgba(6,23,30,0.6);border:1px solid var(--line);border-radius:8px;color:var(--foam);font-family:var(--mono);font-size:12.5px;padding:8px 12px;outline:none}
  .compose input:focus{border-color:var(--liquid)}
  .compose button{background:var(--liquid);border:none;border-radius:8px;color:var(--abyss);font-family:var(--mono);font-weight:700;font-size:12px;padding:8px 16px;cursor:pointer}
  .compose button:disabled{opacity:0.5;cursor:wait}
  .compose .hint{font-family:var(--mono);font-size:10.5px;color:var(--vapour-dim);margin-top:8px}
  .compose .hint.ok{color:var(--liquid)} .compose .hint.err{color:var(--solid)}

  /* steps lens — a page for a person WITH THINGS TO DO rather than things to read.
   * One card per act, numbered, and every link in the text becomes a button, because
   * a link buried in a paragraph is a thing to notice and a button is a thing to press.
   * The prose is what remains once the URLs are lifted out of it. */
  .step{display:flex;gap:13px;align-items:flex-start;padding:14px 16px;
    border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,0.028)}
  :root[data-theme="light"] .step{background:rgba(18,51,60,0.022)}
  .step__n{font-family:var(--display);font-weight:800;font-size:0.9rem;color:var(--abyss);background:var(--liquid);
    width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px}
  .step__b{flex:1;min-width:0}
  .step__h{font-family:var(--display);font-weight:700;font-size:1.06rem;line-height:1.25;color:var(--foam);margin:0}
  .step__s{font-size:0.93rem;line-height:1.42;color:var(--vapour);margin:5px 0 0}
  /* the sequence made visible — quiet, and only ever between two cards */
  .step__arrow{display:block;text-align:center;color:var(--vapour-dim);font-size:15px;line-height:1;padding:7px 0;opacity:0.55}
  .step__do{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
  .btn{display:inline-block;background:var(--liquid);color:var(--abyss);font-family:var(--mono);font-weight:700;
    font-size:12px;letter-spacing:0.03em;padding:8px 14px;border-radius:8px;border-bottom:none;cursor:pointer}
  .btn:hover{background:var(--foam);color:var(--abyss);border-bottom:none}
  .btn--ghost{background:none;color:var(--liquid);border:1px solid var(--line-strong)}
  .btn--ghost:hover{background:none;color:var(--foam);border-color:var(--foam)}

  /* copy lens — a body of text whose whole purpose is to leave this page and land
   * in an assistant. Selectable and scrollable, with the button doing the work. */
  .copy pre{background:rgba(6,23,30,0.6);border:1px solid var(--line-strong);border-radius:8px;color:var(--vapour);
    font-family:var(--mono);font-size:12.5px;line-height:1.52;padding:12px 14px;margin:0;white-space:pre-wrap;max-height:280px;overflow:auto}
  .copy .row{display:flex;gap:10px;margin-top:9px;align-items:center}
  .copy button{background:var(--liquid);border:none;border-radius:8px;color:var(--abyss);font-family:var(--mono);
    font-weight:700;font-size:12px;padding:8px 16px;cursor:pointer}
  .copy button:hover{background:var(--foam)}
  .copy .hint{font-family:var(--mono);font-size:10.5px;color:var(--vapour-dim)}
  .copy .hint.ok{color:var(--liquid)}

  .raw{font-family:var(--mono);font-size:12px;color:var(--vapour-dim);border:1px dashed var(--line-strong);border-radius:8px;padding:10px 14px}

  .fam{display:flex;gap:12px;align-items:baseline;padding:12px 4px;border-bottom:1px solid var(--line)}
  .fam__name{font-family:var(--mono);font-size:13px;flex:none;min-width:170px}
  .fam__voice{flex:1;color:var(--vapour);font-size:0.95rem}
  .fam__n{font-family:var(--mono);font-size:11px;color:var(--vapour-dim);flex:none}

  .state{padding:60px 26px;text-align:center;max-width:480px;margin:0 auto}
  .state h2{font-family:var(--display);font-size:1.4rem;margin:0 0 10px}
  .state p{color:var(--vapour-dim)}

  .foot{max-width:680px;margin:0 auto;padding:26px 18px 44px;font-family:var(--mono);font-size:11px;letter-spacing:0.05em;color:var(--vapour-dim);display:flex;gap:16px;flex-wrap:wrap}
  .foot a{border-bottom:none;color:var(--vapour-dim)} .foot a:hover{color:var(--liquid)}
</style>
</head>

<script>
document.documentElement.classList.remove('no-js');
/* Set before first paint, or the page flashes the wrong register. A stored choice
 * wins; otherwise follow whatever the reader's system already asked for. */
(function(){
  var saved = null;
  try { saved = localStorage.getItem('view:theme'); } catch(e){}
  var dark = saved ? saved === 'dark'
    : !(window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
})();
</script>

<div class="bar">
  <span class="dot"></span>
  <span>the view · <b id="bar-name">—</b></span>
  <span class="spacer"></span>
  <a href="/view" id="bar-all">every view</a>
  <button id="btn-depth" class="hidden" title="how much of this page to show">simple</button>
  <button id="btn-theme" title="light or dark">◐</button>
  <button id="btn-refresh" title="re-read the beach">↻</button>
</div>

<main class="wrap hidden" id="main"></main>
<div id="state" class="state hidden"><h2 id="state-title"></h2><p id="state-body"></p></div>
<div class="foot" id="foot"></div>

<script>
(function(){
'use strict';
const HOME = 'beach.happyseaurchin.com';
const PAGE = /\.html$/.test(location.pathname) ? location.pathname : '/view';
const Q = new URLSearchParams(location.search);
const SPEC_RAW = (Q.get('spec')
  || (location.pathname.match(/\/view\/([^\/]+)\/?$/) || [])[1]
  || '').replace(/[^a-zA-Z0-9:_-]/g,'');
const SPEC = SPEC_RAW ? (SPEC_RAW.startsWith('view:') ? SPEC_RAW : 'view:' + SPEC_RAW) : '';

/* ---------- beach reads (per host — cross-beach entries are first-class) ---------- */
function beachUrl(host){ return 'https://' + host + '/.well-known/pscale-beach'; }
async function readBlock(host, name){
  const r = await fetch(beachUrl(host) + '?block=' + encodeURIComponent(name), { headers:{Accept:'application/json'}, cache:'no-store' });
  if (r.status === 404) return null;
  if (!r.ok) throw new Error(host + ' read failed: ' + r.status);
  return r.json();
}
async function readIndex(host){
  const r = await fetch(beachUrl(host), { headers:{Accept:'application/json'}, cache:'no-store' });
  if (!r.ok) throw new Error(host + ' index failed: ' + r.status);
  return r.json();
}

/* ---------- walkers (shared with /tree: raw digits, 0 steps into the underscore) ---------- */
function voiceOf(node){
  let n = node;
  while (n && typeof n === 'object') { if (!('_' in n)) return null; n = n['_']; }
  return typeof n === 'string' ? n : null;
}
function digitKeys(node){
  if (!node || typeof node !== 'object') return [];
  return Object.keys(node).filter(k => /^[1-9]$/.test(k)).sort();
}
function walkTo(block, walk){
  let n = block;
  for (const ch of walk){
    if (!n || typeof n !== 'object') return undefined;
    n = (ch === '0') ? n['_'] : n[ch];
  }
  return n;
}
function textAt(node){
  if (node === undefined || node === null) return null;
  if (typeof node === 'string') return node.trim() || null;
  return voiceOf(node);
}
function childSteps(node){
  const steps = digitKeys(node).slice();
  let z = (node && typeof node === 'object') ? node['_'] : null, pre = '0';
  while (z && typeof z === 'object'){
    for (const d of digitKeys(z)) steps.push(pre + d);
    z = z['_']; pre += '0';
  }
  return steps.sort();
}
const esc = s => { const d = document.createElement('span'); d.textContent = s == null ? '' : s; return d.innerHTML; };
const $ = id => document.getElementById(id);

/* A link inside a voice is a DOOR — the host posts a room and the reader walks in.
 * Escaped text is safe but dead, so split the RAW string on link-shaped runs, escape
 * every piece, and build each anchor from its own match: nothing unescaped reaches the
 * DOM. A bare host must carry a path (xstream.onen.ai/?room=count) so pscale addresses
 * — block-conventions:4.22, a date, a floor — are never mistaken for the web. */
const LINK = /(https?:\/\/[^\s<>"']+|(?:[a-z0-9][a-z0-9-]*\.)+[a-z]{2,}\/[^\s<>"']*)/gi;
function linkify(s){
  s = s == null ? '' : String(s);
  let out = '', last = 0, m;
  LINK.lastIndex = 0;
  while ((m = LINK.exec(s))){
    out += esc(s.slice(last, m.index));
    let url = m[0], tail = '';
    const t = url.match(/[.,;:!?)\]]+$/);            /* sentence punctuation is not the URL */
    if (t){ tail = t[0]; url = url.slice(0, -tail.length); }
    const href = /^https?:\/\//i.test(url) ? url : 'https://' + url;
    out += '<a href="' + esc(href) + '" target="_blank" rel="noopener noreferrer">' + esc(url) + '</a>' + esc(tail);
    last = m.index + m[0].length;
  }
  return out + esc(s.slice(last));
}
const short = (s,n) => { s = s || ''; return s.length > n ? s.slice(0,n).replace(/\s+\S*$/,'') + ' …' : s; };
/* A liquid slot's FIRST-STAGED arrival stamp (block-conventions:4.51). Field 6
   since the 2026-08-02 settlement, field 2 on a slot staged while that held the
   stamp, else last-touched at 3. Told apart by ISO SHAPE, never Date.parse: a
   temporal spine address like "2026" parses as a perfectly good year. Reading
   only field 2 is why staged voices here rendered with no age at all — every
   slot xstream wrote kept its location there, so ago() saw a block name. */
const ISO_STAMP = /^\d{4}-\d{2}-\d{2}T/;
function liquidArrival(slot){
  if (!slot || typeof slot !== 'object') return '';
  for (const f of ['6','2','3']){
    const v = slot[f];
    if (typeof v === 'string' && ISO_STAMP.test(v)) return v;
  }
  return '';
}
function ago(ts){
  const t = Date.parse(ts); if (!Number.isFinite(t)) return '';
  const s = Math.max(0, (Date.now() - t) / 1000);
  if (s < 90) return 'just now';
  if (s < 5400) return Math.round(s/60) + 'm ago';
  if (s < 129600) return Math.round(s/3600) + 'h ago';
  return Math.round(s/86400) + 'd ago';
}
function showState(title, body){
  $('main').classList.add('hidden');
  $('state-title').textContent = title;
  $('state-body').innerHTML = body;
  $('state').classList.remove('hidden');
}

/* ---------- the entry grammar: <mode> [<host>] <target> [<addr>] ---------- */
const HOSTLIKE = /^[a-z0-9-]+(\.[a-z0-9-]+)+$/i;
/* CADO in front of the mode — an optional tag saying WHO a line is for.
 * character/observer are the simple registers and author/designer the working ones,
 * so the two-position control in the bar is really a face switch: a page shows its
 * plain face by default and its working face when a reader asks for it. Untagged
 * lines belong to everyone, which is what most lines are and should stay. */
const SIMPLE_FACES = ['character', 'observer'];
const FACE_TAG = /^(character|author|designer|observer):$/i;

function parseEntry(line){
  const t = String(line).trim().split(/\s+/);
  if (!t[0]) return null;
  let face = '';
  const glued = t[0].match(/^(character|author|designer|observer):(\S+)$/i);   /* author:walk … */
  if (FACE_TAG.test(t[0])) { face = t.shift().slice(0, -1).toLowerCase(); }
  else if (glued) { face = glued[1].toLowerCase(); t[0] = glued[2]; }
  if (!t[0]) return null;
  const e = { mode: t[0].toLowerCase(), face, host: HOME, target: '', addr: '', raw: line };
  let i = 1;
  if (t[i] && HOSTLIKE.test(t[i]) && !t[i].includes(':') && t[i+1]) e.host = t[i++].toLowerCase();
  e.target = t[i++] || '';
  if (t[i] !== undefined){
    const a = t[i];
    if ((a.match(/\./g) || []).length > 1) e.badAddr = a;      /* one decimal point only */
    else if (/^[0-9.]+$/.test(a)) e.addr = a.replace('.','').replace(/0+$/,'');
  }
  return e;
}

/* slot-shaped children of an accumulator node — {_, 1: who, 3: ts} per mark/pool
 * shape. Slots beyond 9 sit at two-digit paths (slot 11 = walk 1→1, zero-free
 * allocation), so a digit child with no text of its own is a container: recurse. */
function slotsOf(node, out){
  out = out || [];
  if (!node || typeof node !== 'object') return out;
  for (const d of digitKeys(node)){
    const kid = node[d];
    const text = textAt(kid);
    if (text){
      const who = (kid && typeof kid === 'object' && typeof kid['1'] === 'string') ? kid['1'] : '';
      const ts = (kid && typeof kid === 'object' && typeof kid['3'] === 'string') ? kid['3'] : '';
      out.push({ text, who, ts });
    } else if (kid && typeof kid === 'object') slotsOf(kid, out);
  }
  if (node['_'] && typeof node['_'] === 'object') slotsOf(node['_'], out);  /* the supernest wrap holds the older slots */
  return out;
}

/* A button says where it goes. The host is the honest label — not a verb invented by
 * the renderer, and not a word the block author has to remember to supply — so someone
 * can see they are about to leave for github.com before they press it. */
function btnLabel(u){
  try {
    const x = new URL(u);
    const host = x.hostname.replace(/^www\./, '');
    return x.hash ? host + ' · ' + x.hash.slice(1).replace(/-/g, ' ') : host;
  } catch(err){ return 'open'; }
}

function srcLine(e, extra){
  const bits = ['<b>' + esc(e.target + (e.addr ? ' · ' + e.addr : '')) + '</b>'];
  if (e.host !== HOME) bits.push('@ ' + esc(e.host));
  bits.push('<a href="https://happyseaurchin.com/render?beach=' + encodeURIComponent(e.host) + '&block=' + encodeURIComponent(e.target) + (e.addr ? '&spindle=' + e.addr : '') + '">the raw walk →</a>');
  for (const x of (extra || [])) bits.push(x);
  return '<div class="sect__src">' + bits.join('<span>·</span>') + '</div>';
}

/* ---------- the modes — the renderer owns this vocabulary; specs only combine it ---------- */
const MODES = {
  async value(e){
    const b = await readBlock(e.host, e.target);
    const t = b ? textAt(walkTo(b, e.addr)) : null;
    return '<p class="quote">' + linkify(t || '(nothing stands at this address)') + '</p>' + srcLine(e);
  },
  async walk(e){
    const b = await readBlock(e.host, e.target);
    if (!b) return '<p class="vnone">' + esc(e.target) + ' is not on this beach</p>';
    const crumbs = [];
    for (let i = 1; i < e.addr.length; i++){
      const t = textAt(walkTo(b, e.addr.slice(0, i)));
      if (t) crumbs.push(esc(short(t, 130)));
    }
    const here = walkTo(b, e.addr);
    const out = [];
    if (crumbs.length) out.push('<p class="crumb">' + crumbs.join('<br>') + '</p>');
    out.push('<p class="quote">' + linkify(textAt(here) || '(unvoiced)') + '</p>');
    /* Walked to an address, the children are CONTEXT — a glance below where you stand,
     * so four short lines. Walked to the root, they are the CONTENT: this is a spine
     * read as its own catalogue, and clipping it hides entries entirely. The spine
     * author sets the length of a line; the page shows the line. */
    const root = !e.addr;
    for (const s of childSteps(here).slice(0, root ? 12 : 4)){
      out.push('<div class="kidline"><span class="no">·' + esc(s) + '</span><span>' + linkify(short(textAt(walkTo(here, s)) || '', root ? 600 : 110)) + '</span></div>');
    }
    return out.join('') + srcLine(e);
  },
  async voices(e){
    const b = await readBlock(e.host, e.target);
    if (!b) return '<p class="vnone">' + esc(e.target) + ' is not on this beach</p>';
    const node = e.addr ? walkTo(b, e.addr) : b;
    const slots = slotsOf(node);
    slots.sort((a, x) => (x.ts || '').localeCompare(a.ts || ''));
    const rows = slots.slice(0, 8).map(s =>
      '<div class="vrow"><span class="vwho">' + esc(s.who || '—') + '</span><span class="vtext">' + linkify(short(s.text, 220)) + '</span>' + (s.ts ? '<span class="vago">' + esc(ago(s.ts)) + '</span>' : '') + '</div>');
    return (rows.join('') || '<p class="vnone">no voices here yet — silence is honest absence</p>') +
      srcLine(e, slots.length > 8 ? [esc(String(slots.length)) + ' in all — newest 8 shown'] : []);
  },
  async fold(e){
    const family = e.target;
    const index = await readIndex(e.host);
    const blocks = index.blocks || [];
    const spineName = blocks.includes('spine:' + family) ? 'spine:' + family : (blocks.includes(family) ? family : null);
    if (!spineName) return '<p class="vnone">' + esc(family) + ' has no spine at ' + esc(e.host) + '</p>';
    const mirrorNames = blocks.filter(x => x.startsWith(family + ':') && /^[A-Za-z][A-Za-z0-9 _-]*$/.test(x.slice(family.length + 1)));
    const got = await Promise.all([readBlock(e.host, spineName)].concat(mirrorNames.map(n => readBlock(e.host, n).catch(() => null))));
    const spine = got[0];
    if (!spine) return '<p class="vnone">' + esc(spineName) + ' would not read</p>';
    /* Keep each mirror's handle beside its block. An Observer page shows only what
       people WROTE (ways:views:5) — a fold lens rendering nothing but tallies fails
       the register it declares, and the words are the whole point of a fold. */
    const voices = mirrorNames
      .map((n, i) => ({ who: n.slice(family.length + 1), block: got[i + 1] }))
      .filter(v => v.block);
    const VOICE_CAP = 6;
    const out = [];
    let marks = 0;
    for (const s of digitKeys(spine).filter(d => d !== '9')){
      /* A one-level family — every position its own card with nothing beneath it,
         which is what spine:neighbour-gifts is — rendered as nothing at all while
         this walked for leaves only. A childless stem stands as its own card. */
      const leaves = digitKeys(spine[s]);
      const stem = { addr: s, no: String(s), text: textAt(spine[s]) };
      /* A stem stands as a card in its own right when childless, and ALSO when
         somebody answered at the stem itself — a reading about a whole band
         rather than one item in it. Walking leaves only, such an answer was
         collected by nobody and the page read as empty while the words sat there. */
      const cards = leaves.length
        ? (voices.some(v => textAt(walkTo(v.block, s))) ? [stem] : [])
            .concat(leaves.map(l => ({ addr: s + l, no: s + '·' + l, text: textAt(spine[s][l]) })))
        : [stem];
      for (const card of cards){
        const text = card.text;
        if (!text) continue;
        const ratings = []; let ups = 0, downs = 0, replies = 0, notes = 0;
        const said = [];
        for (const v of voices){
          const t = textAt(walkTo(v.block, card.addr));
          if (!t) continue;
          marks++;
          said.push({ who: v.who, text: t });
          let mm;
          if ((mm = t.match(/^rated\s+(\d{1,2})/i))) ratings.push(+mm[1]);
          else if (/^up\b/i.test(t)) ups++;
          else if (/^down\b/i.test(t)) downs++;
          else if (/^replied\b/i.test(t)) replies++;
          else notes++;
        }
        let agg = '';
        if (ratings.length) agg = 'avg ' + (Math.round(ratings.reduce((a,x)=>a+x,0)/ratings.length*10)/10) + ' · ' + ratings.length;
        else if (ups || downs) agg = '👍' + ups + ' 👎' + downs;
        else if (replies) agg = replies + ' replied';
        else if (notes) agg = notes + ' answered';
        const shown = said.slice(0, VOICE_CAP);
        out.push('<div class="fgroup"><div class="frow"><span class="no">' + card.no + '</span><span class="txt">' + esc(short(text, 96)) + '</span>' + (agg ? '<span class="agg">' + esc(agg) + '</span>' : '') + '</div>' +
          shown.map(v => '<div class="mrow"><span class="mwho">' + esc(v.who) + '</span><span class="msaid">' + esc(short(v.text, 170)) + '</span></div>').join('') +
          (said.length > shown.length
            ? '<div class="mrow"><span class="mwho"></span><span class="msaid mmore">and ' + (said.length - shown.length) + ' more — see them all →</span></div>'
            : '') + '</div>');
      }
    }
    return '<p class="crumb">' + esc(short(voiceOf(spine) || '', 150)) + '</p>' + out.join('') +
      srcLine(e, ['<b>' + voices.length + '</b> people', '<b>' + marks + '</b> answers',
        '<a href="https://happyseaurchin.com/fold?field=' + encodeURIComponent(family) + '">the whole fold →</a>',
        '<a href="https://happyseaurchin.com/tree?family=' + encodeURIComponent(family) + '">walk it →</a>']);
  },
  async explain(e){
    const b = await readBlock(e.host, e.target);
    if (!b) return '<p class="vnone">' + esc(e.target) + ' is not on this beach</p>';
    const out = ['<p class="quote">' + linkify(short(voiceOf(b) || '', 240)) + '</p>'];
    for (const d of digitKeys(b)){
      const t = textAt(b[d]);
      if (t) out.push('<div class="kidline"><span class="no">·' + d + '</span><span>' + linkify(short(t, 100)) + '</span></div>');
    }
    return out.join('') + srcLine(e, ['<a href="https://happyseaurchin.com/explain?block=' + encodeURIComponent(e.target) + '">explained in full →</a>']);
  },
  async liquid(e){
    const name = e.target.replace(/^pool:/, '');
    const b = await readBlock(e.host, 'liquid:pool:' + name);
    const rows = [];
    if (b) for (const d of digitKeys(b)){
      const slot = b[d];
      const text = textAt(slot);
      if (!text) continue;
      const who = (slot && typeof slot === 'object' && typeof slot['1'] === 'string') ? slot['1'] : '—';
      const arrived = liquidArrival(slot);
      rows.push('<div class="vrow"><span class="vwho">' + esc(who) + '</span><span class="vtext">' + linkify(short(text, 180)) + '</span>' + (arrived ? '<span class="vago">' + esc(ago(arrived)) + '</span>' : '') + '</div>');
    }
    e.live = true;  /* liquid sections re-read on the 30s tick */
    return (rows.join('') || '<p class="vnone">nobody staged here right now — the liquid mirror is empty</p>') +
      srcLine({ ...e, target: 'liquid:pool:' + name, addr: '' }, ['re-read every 30s']);
  },
  /* Every gathering at a beach, in one lens: what each pool is for, what was
     last said in it, and who is staged there NOW. The last column is the point
     — a liquid slot has no clock on it, so a stage from three weeks ago reads
     as presence until something says otherwise. This is what says otherwise. */
  async pools(e){
    /* `pools` alone takes a bare host as its target, because the entry grammar
       only reads a host when a target follows it. */
    const bare = HOSTLIKE.test(e.target) && !e.target.includes(':');
    const host = bare ? e.target : e.host;
    const prefix = bare ? '' : e.target.replace(/^pool:/, '');
    const index = await readIndex(host);
    const names = (index.blocks || [])
      .filter(b => b.startsWith('pool:') && b.indexOf(':', 5) === -1)
      .filter(b => !prefix || b.slice(5).startsWith(prefix))
      .sort();
    if (!names.length) return '<p class="vnone">no pools at ' + esc(host) + (prefix ? ' under ' + esc(prefix) : '') + '</p>';

    /* Two reads per pool — the spool and its liquid buffer — in small batches,
       so a beach with dozens of gatherings still answers promptly. */
    const got = [];
    for (let i = 0; i < names.length; i += 8){
      got.push(...await Promise.all(names.slice(i, i + 8).map(async n => {
        const [pool, liq] = await Promise.all([
          readBlock(host, n).catch(() => null),
          readBlock(host, 'liquid:' + n).catch(() => null),
        ]);
        const voices = pool ? slotsOf(pool) : [];
        /* ISO-shaped stamps only. A pool whose field 3 holds something else —
           prose, a tag, a test fixture — has no readable clock, and taking it as
           one both dated the row wrongly and sorted it above every pool that IS
           dated, because 't' outranks '2'. Undated is undated; say so. */
        const said = voices.map(v => v.ts).filter(t => t && ISO_STAMP.test(t)).sort().pop() || '';
        const staged = [];
        if (liq) for (const d of digitKeys(liq)){
          const slot = liq[d];
          if (!textAt(slot)) continue;                    /* withdrawn — a tombstone is not presence */
          staged.push(liquidArrival(slot));
        }
        const stamps = staged.filter(Boolean).sort();
        /* OLDEST is the staleness signal shown in the row; NEWEST is what the
           sort reads, so a gathering holding one fresh stage beside one old one
           still reads as alive rather than sinking to the age of its residue. */
        return { name: n, what: voiceOf(pool) || '', voices: voices.length, said,
                 staged: staged.length, oldest: stamps[0] || '', newest: stamps[stamps.length - 1] || '' };
      })));
    }
    /* Liveliest first — a pool nobody has touched sinks rather than shouting.
       Liveliness is the later of its last committed voice and its newest stage. */
    const touched = p => (p.said > p.newest ? p.said : p.newest) || '';
    got.sort((a, b) => touched(b).localeCompare(touched(a)));

    const DAY = 86400000;
    const rows = got.map(p => {
      const bits = [];
      if (p.staged){
        const age = p.oldest ? Date.now() - Date.parse(p.oldest) : 0;
        const cls = (age > DAY) ? 'stale' : 'live';
        const oldAge = ago(p.oldest);
        bits.push('<span class="' + cls + '">' + p.staged + ' staged' + (oldAge ? ' · ' + esc(oldAge) : '') + '</span>');
      }
      const saidAge = ago(p.said);
      bits.push(p.voices ? p.voices + ' voice' + (p.voices === 1 ? '' : 's') + (saidAge ? ' · ' + esc(saidAge) : ' · undated') : 'unspoken');
      return '<div class="prow"><span class="pname"><a href="https://happyseaurchin.com/render?beach=' + encodeURIComponent(host) + '&block=' + encodeURIComponent(p.name) + '">' + esc(p.name) + '</a></span>' +
        '<span class="pwhat">' + esc(short(p.what, 150) || '(no purpose written)') + '</span>' +
        '<span class="pstate">' + bits.join('<br>') + '</span></div>';
    });
    const stale = got.filter(p => p.staged && p.oldest && (Date.now() - Date.parse(p.oldest)) > DAY).length;
    return rows.join('') +
      '<div class="sect__src"><b>' + got.length + ' pools</b>' +
      (e.host !== host || bare ? '<span>·</span>@ ' + esc(host) : '') +
      '<span>·</span>' + (stale ? esc(String(stale)) + ' holding staged voices over a day old' : 'nothing staged is stale') +
      '<span>·</span><a href="https://happyseaurchin.com/render?beach=' + encodeURIComponent(host) + '">the beach index →</a></div>';
  },
  /* steps — the DOING lens. Every other mode here renders something to read; this one
   * renders a short list of acts a person performs, one card each. Position 9 is skipped
   * exactly as the spec loop skips it: by convention that slot carries the block's own
   * payload or metadata, not another step. */
  async steps(e){
    const b = await readBlock(e.host, e.target);
    if (!b) return '<p class="vnone">' + esc(e.target) + ' is not on this beach</p>';
    const here = walkTo(b, e.addr);
    const lead = textAt(here);
    const out = [];
    if (lead) out.push('<p class="quote" style="font-size:1.05rem;margin:0 0 4px">' + linkify(lead) + '</p>');
    let n = 0;
    for (const d of childSteps(here)){
      if (d === '9') continue;
      const node = walkTo(here, d);
      const title = textAt(node);
      if (!title) continue;
      /* A card is a TITLE and, under it, the one line of detail. That is depth doing the
       * work: the position's own voice is what a person scanning reads, and its first
       * child is what they read if the title did not settle it. A position written as a
       * bare string is all title and no detail, which is why the older specs still render. */
      const detail = (node && typeof node === 'object') ? textAt(node['1']) : '';
      n++;
      const strip = s => {
        const urls = String(s || '').match(/https?:\/\/[^\s<>()]*[^\s<>().,;:]/g) || [];
        return { urls, prose: urls.reduce((a, u) => a.replace(u, ''), String(s || ''))
          .replace(/\s{2,}/g, ' ').replace(/\s+([.,;:])/g, '$1').trim() };
      };
      const h = strip(title), s = strip(detail);
      const urls = [...h.urls, ...s.urls];
      const btns = urls.map((u, i) =>
        '<a class="btn' + (i ? ' btn--ghost' : '') + '" href="' + esc(u) + '" target="_blank" rel="noopener noreferrer">'
        + esc(btnLabel(u)) + ' ↗</a>').join('');
      if (n > 1) out.push('<div class="step__arrow">↓</div>');
      out.push('<div class="step"><div class="step__n">' + n + '</div><div class="step__b">'
        + '<h3 class="step__h">' + esc(h.prose) + '</h3>'
        + (s.prose ? '<p class="step__s">' + esc(s.prose) + '</p>' : '')
        + (btns ? '<div class="step__do">' + btns + '</div>' : '') + '</div></div>');
    }
    if (!n) out.push('<p class="vnone">no steps stand under this address yet</p>');
    return out.join('') + srcLine(e);
  },
  /* copy — text whose purpose is to LEAVE this page. The prompt a person hands to their
   * assistant is the single highest-value thing on a how-to page, and asking someone to
   * select a paragraph by hand is where they give up. */
  async copy(e){
    const b = await readBlock(e.host, e.target);
    const t = b ? textAt(walkTo(b, e.addr)) : null;
    if (!t) return '<p class="vnone">nothing stands at this address to copy</p>';
    return '<div class="copy"><pre data-copytext>' + esc(t) + '</pre>'
      + '<div class="row"><button data-copy type="button">Copy</button>'
      + '<span class="hint" data-copyhint>paste this to your assistant</span></div></div>' + srcLine(e);
  },
  async form(e){
    const kind = e.target.startsWith('pool:') ? 'Add your voice' : 'Leave a mark';
    return '<div class="compose"><p class="quote" style="font-size:1rem;margin-bottom:8px">' + kind + ' — it lands at ' + esc(e.target) + ', public and signed.</p>' +
      '<textarea data-note rows="2" placeholder="Say something — no account, no sign-up."></textarea>' +
      '<div class="row"><input data-who placeholder="signed as (a name, optional)" value="' + esc(localStorage.getItem('render:who') || '') + '"><button data-post type="button">Post</button></div>' +
      '<div class="row hidden" data-latch><input data-pass type="password" placeholder="this space is locked — the author’s edit-latch to post"></div>' +
      '<div class="hint" data-hint>Reads are free; posting needs nothing. Sent only to ' + esc(e.host) + '.</div></div>' + srcLine(e);
  },
};

function wireCopy(sect){
  const btn = sect.querySelector('[data-copy]'), pre = sect.querySelector('[data-copytext]');
  const hint = sect.querySelector('[data-copyhint]');
  if (!btn) return;
  const idle = hint.textContent;
  btn.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(pre.textContent);
      hint.className = 'hint ok'; hint.textContent = 'copied ✓';
    } catch(err){
      /* clipboard refused (insecure context, or permission) — select it instead, so the
       * keyboard shortcut still works and the person is never left with nothing */
      const r = document.createRange(); r.selectNodeContents(pre);
      const s = getSelection(); s.removeAllRanges(); s.addRange(r);
      hint.className = 'hint'; hint.textContent = 'selected — press ⌘C';
    }
    setTimeout(() => { hint.className = 'hint'; hint.textContent = idle; }, 2600);
  });
}

function wireForm(sect, e){
  const note = sect.querySelector('[data-note]'), who = sect.querySelector('[data-who]');
  const post = sect.querySelector('[data-post]'), latch = sect.querySelector('[data-latch]');
  const pass = sect.querySelector('[data-pass]'), hint = sect.querySelector('[data-hint]');
  if (!post) return;
  post.addEventListener('click', async () => {
    const text = note.value.trim();
    if (!text){ note.focus(); return; }
    post.disabled = true; hint.className = 'hint'; hint.textContent = 'posting…';
    const body = { block: e.target, content: { _: text, '1': who.value.trim() || 'anon', '2': '' }, append: true };
    if (!latch.classList.contains('hidden') && pass.value) body.secret = pass.value;
    let r, d = {};
    try {
      r = await fetch(beachUrl(e.host), { method: 'POST', cache: 'no-store', headers: { 'Content-Type': 'application/json', Accept: 'application/json' }, body: JSON.stringify(body) });
      d = await r.json().catch(() => ({}));
    } catch(err){
      hint.className = 'hint err'; hint.textContent = 'could not reach the beach — ' + (err.message || err); post.disabled = false; return;
    }
    post.disabled = false;
    if (r.ok){
      if (who.value.trim()) localStorage.setItem('render:who', who.value.trim());
      hint.className = 'hint ok'; hint.textContent = 'posted ✓ — re-reading the board…';
      note.value = '';
      setTimeout(load, 400);
      return;
    }
    if (d.code === 'lock_required'){
      latch.classList.remove('hidden'); pass.focus();
      hint.className = 'hint err'; hint.textContent = 'this space is latched — prove authorship to post';
      return;
    }
    hint.className = 'hint err'; hint.textContent = 'the beach said no — ' + (d.code || r.status);
  });
}

/* ---------- the catalogue (no spec) ---------- */
async function loadCatalogue(){
  $('bar-name').textContent = 'every view';
  let index;
  try { index = await readIndex(HOME); } catch(err){ return showState('The beach is out of reach.', esc(String(err.message || err))); }
  const specs = (index.blocks || []).filter(b => b.startsWith('view:')).sort();
  const roots = {};
  await Promise.all(specs.map(async n => { try { roots[n] = await readBlock(HOME, n); } catch(err){} }));
  const out = [];
  out.push('<div class="head"><h1>Every published <span class="cool">view</span>, live.</h1>' +
    '<p class="voicing">A view is a block: addresses and render-modes, one line per section. Author the block and the page exists — no code, no deploy. These are the views standing on this beach right now.</p>' +
    '<p class="meta"><span><b>' + specs.length + '</b> view' + (specs.length === 1 ? '' : 's') + '</span></p></div>');
  for (const n of specs){
    const b = roots[n];
    out.push('<div class="fam"><span class="fam__name"><a href="' + PAGE + '?spec=' + encodeURIComponent(n) + '">' + esc(n.slice(5)) + '</a></span>' +
      '<span class="fam__voice">' + esc(short(voiceOf(b) || '', 120)) + '</span>' +
      '<span class="fam__n">' + digitKeys(b || {}).filter(d => d !== '9').length + ' lenses</span></div>');
  }
  if (!specs.length) out.push('<p class="vnone">No views yet — the first one is a single block away.</p>');

  /* the maker — publishing is one write: name it, one line per lens, invent a latch.
     Create-if-absent is race-safe at the beach: a name already standing refuses. */
  out.push('<div class="sect" id="maker" style="margin-top:26px">' +
    '<p class="quote" style="font-size:1.05rem;margin-bottom:4px">Make your own — one write, no code, no account.</p>' +
    '<p class="vnone" style="padding-bottom:8px">Name it, say what it shows, one line per lens — <span style="color:var(--vapour)">mode target address</span>, modes: value · walk · steps · copy · voices · fold · explain · liquid · pools · form. Two of those are for a reader with something to DO rather than to read — <span style="color:var(--vapour)">steps</span> turns a block\'s positions into numbered cards with every link a button, and <span style="color:var(--vapour)">copy</span> puts text behind a copy button so it can leave the page. Put a face in front of a line — <span style="color:var(--vapour)">author: walk …</span> — and it hides behind the simple/full switch: character and observer are the plain registers, author and designer the working ones, so one page serves the person passing through and the person building it. The latch you invent stays yours: it is the edit-latch on your page, not a login. <a href="/views">How the page system works →</a></p>' +
    '<div class="compose">' +
    '<div class="row" style="margin-top:0"><input data-mk-name placeholder="a name — lowercase, dashes (becomes view:<name>)" spellcheck="false"></div>' +
    '<textarea data-mk-voicing rows="2" style="margin-top:8px" placeholder="the voicing — what this view shows, for whom (doubles as its card text)"></textarea>' +
    '<textarea data-mk-lenses rows="4" style="margin-top:8px;font-family:var(--mono);font-size:13px" placeholder="one lens per line, e.g.&#10;walk spine:experiences 5&#10;voices marks&#10;liquid pool:this-hour&#10;pools"></textarea>' +
    '<div class="row"><select data-mk-register style="flex:1;background:rgba(6,23,30,0.6);border:1px solid var(--line);border-radius:8px;color:var(--foam);font-family:var(--mono);font-size:12.5px;padding:8px 12px;outline:none">' +
    '<option value="observer">for anyone — observer register</option>' +
    '<option value="author">for authors — content and structure</option>' +
    '<option value="designer">for designers — process and operators</option>' +
    '</select></div>' +
    '<div class="row"><input data-mk-latch type="password" placeholder="invent a latch — it locks the view to you" autocomplete="new-password"><button data-mk-go type="button">Publish</button></div>' +
    '<div class="hint" data-mk-hint>The write goes straight to the beach; the page exists the moment it lands. Then propose its card from your mirror at <a href="/next?field=views">the views deck</a>.</div>' +
    '</div></div>');

  $('main').innerHTML = out.join('');
  $('main').classList.remove('hidden'); $('state').classList.add('hidden');
  wireMaker();
  $('foot').innerHTML = '<a href="/views">how the page system works →</a><a href="/tree?family=views">the views catalogue, walked →</a><a href="/next?field=views">reply to a view as a card →</a><span>a view is authored, never installed</span>';
}

function wireMaker(){
  const mk = sel => document.querySelector('[data-mk-' + sel + ']');
  const go = mk('go'); if (!go) return;
  go.addEventListener('click', async () => {
    const hint = mk('hint');
    const name = (mk('name').value || '').toLowerCase().replace(/[^a-z0-9-]/g, '');
    const voicing = mk('voicing').value.trim();
    const lines = mk('lenses').value.split('\n').map(s => s.trim()).filter(Boolean).slice(0, 8);
    const latch = mk('latch').value;
    if (!name || !voicing || !lines.length || !latch){
      hint.className = 'hint err'; hint.textContent = 'a view needs all four: a name, its voicing, at least one lens, and a latch.';
      return;
    }
    const content = { _: voicing };
    lines.forEach((l, i) => { content[String(i + 1)] = l; });
    content['9'] = 'register: ' + (mk('register').value || 'observer');
    go.disabled = true; hint.className = 'hint'; hint.textContent = 'publishing…';
    let r, d = {};
    try {
      r = await fetch(beachUrl(HOME), { method: 'POST', cache: 'no-store', headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
        body: JSON.stringify({ block: 'view:' + name, content, new_lock: latch }) });
      d = await r.json().catch(() => ({}));
    } catch(err){
      hint.className = 'hint err'; hint.textContent = 'could not reach the beach — ' + (err.message || err); go.disabled = false; return;
    }
    if (r.ok){
      hint.className = 'hint ok'; hint.textContent = 'published ✓ — opening your view…';
      setTimeout(() => { location.href = PAGE + '?spec=' + encodeURIComponent(name); }, 500);
      return;
    }
    go.disabled = false;
    hint.className = 'hint err';
    hint.textContent = (r.status === 409 || /exists|confirm/i.test(d.code || ''))
      ? 'view:' + name + ' already stands — its author holds the latch. Pick another name, or rival it: same subject, your own name.'
      : 'the beach said no — ' + (d.code || r.status);
  });
}

/* ---------- one view ---------- */
let LIVE_ENTRIES = [];
async function load(){
  $('bar-name').textContent = SPEC.slice(5);
  let spec;
  try { spec = await readBlock(HOME, SPEC); } catch(err){ return showState('The beach is out of reach.', esc(String(err.message || err))); }
  if (!spec || typeof spec !== 'object') return showState('No such view.', esc(SPEC) + ' is not on the beach. <a href="' + PAGE + '">See every view →</a>');

  /* the register line at 9 — operator-style, never rendered as a section */
  let register = '';
  const nine = spec['9'];
  if (nine){
    const t = typeof nine === 'string' ? nine : (voiceOf(nine) || '');
    const m = t.match(/^register:\s*(character|author|designer|observer)/i);
    if (m) register = m[1].toLowerCase();
  }

  const out = [];
  out.push('<div class="head"><h1><span class="cool">' + esc(SPEC.slice(5)) + '</span></h1>' +
    /* linkify, not esc: every other text path here makes a link a door —
       the quote, the kidlines, the voices, the liquid rows. The page's OWN
       voicing was the one that did not, which is exactly where an author puts
       the way in ("the room is at ..."), so the one sentence written to be
       acted on was the one sentence rendered dead. */
    '<p class="voicing">' + linkify(voiceOf(spec) || '') + '</p>' +
    '<p class="meta">' + (register ? '<span class="badge">' + esc(register) + ' register</span>' : '') +
    '<span>rendered live — every section is one line of <b>' + esc(SPEC) + '</b></span></p></div>');

  const all = digitKeys(spec).filter(d => d !== '9')
    .map(d => ({ d, e: parseEntry(typeof spec[d] === 'string' ? spec[d] : (voiceOf(spec[d]) || '')) }))
    .filter(x => x.e);

  /* A page whose register at 9 is a working face opens at its working depth; anything
   * else opens plain. The reader's own choice, once made, outranks the page's. */
  const deep = all.filter(x => x.e.face && !SIMPLE_FACES.includes(x.e.face));
  let stored = null;
  try { stored = localStorage.getItem('view:depth:' + SPEC); } catch(e){}
  const wantsFull = stored ? stored === 'full'
    : !!(register && !SIMPLE_FACES.includes(register));
  const full = deep.length ? wantsFull : true;
  const entries = full ? all : all.filter(x => !x.e.face || SIMPLE_FACES.includes(x.e.face));

  const depthBtn = $('btn-depth');
  if (deep.length){
    depthBtn.classList.remove('hidden');
    depthBtn.textContent = full ? 'full' : 'simple';
    depthBtn.title = full
      ? 'showing everything, including the ' + [...new Set(deep.map(x => x.e.face))].join(' and ') + ' parts'
      : 'showing the plain page — ' + deep.length + ' more ' + (deep.length === 1 ? 'section' : 'sections') + ' for anyone working on it';
    depthBtn.onclick = () => {
      try { localStorage.setItem('view:depth:' + SPEC, full ? 'simple' : 'full'); } catch(e){}
      load();
    };
  } else depthBtn.classList.add('hidden');
  LIVE_ENTRIES = [];

  const rendered = await Promise.all(entries.map(async ({ d, e }) => {
    if (e.badAddr) return { d, e, html: '<p class="raw">an address carries at most one decimal point — “' + esc(e.badAddr) + '” has more. This line waits, unrendered: ' + esc(e.raw) + '</p>' };
    const mode = MODES[e.mode];
    if (!mode) return { d, e, html: '<p class="raw">a mode this renderer does not know — the line rides through, visible: ' + esc(e.raw) + '</p>' };
    try {
      const html = await mode(e);
      return { d, e, html };
    } catch(err){
      return { d, e, html: '<p class="vnone">this lens would not open — ' + esc(String(err.message || err)) + '</p>' };
    }
  }));
  for (const r of rendered){
    out.push('<section class="sect" data-entry="' + r.d + '">' + r.html + '</section>');
    if (r.e.live) LIVE_ENTRIES.push(r);
  }

  $('main').innerHTML = out.join('');
  $('main').classList.remove('hidden'); $('state').classList.add('hidden');
  document.querySelectorAll('.sect').forEach(sect => {
    const d = sect.getAttribute('data-entry');
    const r = rendered.find(x => x.d === d);
    if (r && r.e.mode === 'form') wireForm(sect, r.e);
    if (r && r.e.mode === 'copy') wireCopy(sect);
  });
  $('foot').innerHTML = '<a href="https://happyseaurchin.com/render?beach=' + encodeURIComponent(HOME) + '&block=' + encodeURIComponent(SPEC) + '">the raw spec →</a>' +
    '<a href="/next?field=views">reply to this view as a card →</a>' +
    '<a href="' + PAGE + '">every view →</a>' +
    '<span>make your own: author view:&lt;name&gt; — one line per lens — and it renders here</span>';
}

/* liquid sections re-read on a slow tick — presence is the one thing that moves */
setInterval(async () => {
  for (const r of LIVE_ENTRIES){
    try {
      const html = await MODES[r.e.mode](r.e);
      const sect = document.querySelector('.sect[data-entry="' + r.d + '"]');
      if (sect) sect.innerHTML = html;
    } catch(err){ /* keep the last good render */ }
  }
}, 30000);

$('bar-all').href = PAGE;
$('btn-refresh').addEventListener('click', () => location.reload());
$('btn-theme').addEventListener('click', () => {
  const root = document.documentElement;
  const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  root.setAttribute('data-theme', next);
  try { localStorage.setItem('view:theme', next); } catch(e){}
});
if (SPEC) load(); else loadCatalogue();
})();
</script>
</body>
