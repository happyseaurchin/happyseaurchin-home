  :root {
    color-scheme: light;
    --paper: #f8f2e2; --sheet: rgba(250, 245, 231, 0.94); --ink: #1d1a15; --dim: #675f50; --line: rgba(29, 26, 21, 0.18);
    --accent: #d9481a; --gold: #e3a91f; --track: rgba(29, 26, 21, 0.16); --press: rgba(29, 26, 21, 0.08);
    --serif: 'Forage Serif', 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
    --sans: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
  }
  :root[data-theme=dark] { color-scheme: dark; --paper: #141a16; --sheet: rgba(14, 19, 16, 0.92); --ink: #ece7db; --dim: #a9a291; --line: rgba(236, 231, 219, 0.18); --accent: #ff8a4c; --gold: #ffd25a; --track: rgba(236, 231, 219, 0.18); --press: rgba(236, 231, 219, 0.1); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme=light]) { color-scheme: dark; --paper: #141a16; --sheet: rgba(14, 19, 16, 0.92); --ink: #ece7db; --dim: #a9a291; --line: rgba(236, 231, 219, 0.18); --accent: #ff8a4c; --gold: #ffd25a; --track: rgba(236, 231, 219, 0.18); --press: rgba(236, 231, 219, 0.1); }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); font-family: var(--sans); overflow: hidden; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
  body { position: fixed; inset: 0; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  canvas#sky { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
  [hidden] { display: none !important; }

  /* the strip along the top while flying */
  #hud { position: fixed; left: 0; right: 0; top: 0; padding: calc(8px + var(--safe-t)) 10px 0; display: grid; grid-template-columns: 44px 1fr 44px; align-items: start; pointer-events: none; z-index: 3; }
  #hud .icon { pointer-events: auto; width: 44px; height: 44px; border-radius: 22px; border: 0; background: var(--sheet); display: grid; place-items: center; box-shadow: 0 1px 6px rgba(0,0,0,0.12); }
  #hud .icon svg { width: 22px; height: 22px; stroke: var(--ink); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; color: var(--ink); }
  #hud .icon:active { background: var(--paper); }
  .mid { justify-self: center; text-align: center; background: var(--sheet); border-radius: 18px; padding: 5px 16px 8px; min-width: 150px; box-shadow: 0 1px 6px rgba(0,0,0,0.12); }
  #km { font-family: var(--serif); font-style: italic; font-size: 26px; line-height: 1.05; font-variant-numeric: tabular-nums; letter-spacing: 0.01em; }
  #km small { font-size: 15px; color: var(--dim); margin-left: 3px; }
  #land { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); margin-top: 1px; white-space: nowrap; }
  #enrow { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 6px; }
  #engly { width: 12px; height: 12px; fill: var(--gold); flex: none; }
  #store { position: relative; height: 7px; border-radius: 4px; background: var(--track); margin: 0; width: 128px; overflow: hidden; }
  #store i { position: absolute; left: 0; top: 0; bottom: 0; width: 60%; border-radius: 4px; background: var(--gold); transition: width 0.25s linear; }
  #store.low i { background: var(--accent); animation: low 0.9s ease-in-out infinite alternate; }
  #store.fed i { box-shadow: 0 0 0 2px var(--gold); }
  @keyframes low { from { opacity: 1; } to { opacity: 0.45; } }
  #livebar { position: fixed; left: 0; right: 0; top: calc(98px + var(--safe-t)); text-align: center; font-size: 12px; color: var(--ink); pointer-events: none; z-index: 2; text-shadow: 0 0 4px var(--paper), 0 0 2px var(--paper); }

  #banner { position: fixed; left: 0; right: 0; top: calc(112px + var(--safe-t)); text-align: center; font-family: var(--serif); font-style: italic; font-size: 28px; color: var(--ink); pointer-events: none; opacity: 0; transition: opacity 0.9s ease; z-index: 2; text-shadow: 0 0 10px var(--paper), 0 0 4px var(--paper), 0 0 2px var(--paper); }
  #banner.on { opacity: 1; }
  #hint { position: fixed; left: 12px; right: 12px; bottom: calc(18px + var(--safe-b)); text-align: center; pointer-events: none; z-index: 2; opacity: 0; transition: opacity 0.6s ease; }
  #hint span { display: inline-block; background: var(--sheet); border-radius: 999px; padding: 9px 16px; font-size: 15px; box-shadow: 0 1px 6px rgba(0,0,0,0.12); }
  #hint.on { opacity: 1; }

  /* the sheets: the title, the end of a flight, the room, a pause */
  .panel { position: fixed; left: 50%; bottom: calc(14px + var(--safe-b)); transform: translateX(-50%); width: min(440px, calc(100% - 20px)); max-height: calc(100% - 28px - var(--safe-t) - var(--safe-b)); overflow-y: auto; background: var(--sheet); border-radius: 22px; padding: 20px 20px 16px; box-shadow: 0 6px 30px rgba(0,0,0,0.18); z-index: 4; -webkit-overflow-scrolling: touch; }
  .panel h1 { font-family: var(--serif); font-style: italic; font-weight: 400; font-size: 64px; line-height: 0.95; margin: 0 0 6px; letter-spacing: -0.01em; }
  .panel h2 { font-family: var(--serif); font-style: italic; font-weight: 400; font-size: 34px; line-height: 1; margin: 0 0 10px; }
  .lede { margin: 0 0 16px; font-size: 16px; line-height: 1.4; color: var(--dim); }
  .go { display: flex; gap: 10px; flex-wrap: wrap; margin: 8px 0 4px; }
  .primary, .secondary { border-radius: 999px; padding: 13px 24px; font-size: 17px; border: 1.5px solid var(--ink); min-height: 48px; }
  .primary { background: var(--ink); color: var(--paper); font-weight: 600; flex: 1 1 auto; }
  .secondary { background: transparent; }
  .primary:active, .secondary:active { transform: translateY(1px); }
  .opts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
  .opts button { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 7px 12px; font-size: 13px; color: var(--dim); min-height: 36px; }
  .board { margin-top: 14px; font-size: 14px; }
  .board h3 { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); font-weight: 600; margin: 0 0 4px; }
  .board ol { list-style: none; margin: 0; padding: 0; }
  .board li { display: grid; grid-template-columns: 1.6em 1fr auto; gap: 8px; align-items: baseline; padding: 7px 4px; border-top: 1px solid var(--line); border-radius: 6px; }
  .board li.tap { cursor: pointer; }
  .board li.tap:active, .board li.ghost { background: var(--press); }
  .board .rk { color: var(--dim); font-size: 12px; }
  .board .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .board .sc { font-family: var(--serif); font-style: italic; font-size: 17px; font-variant-numeric: tabular-nums; }
  .board .sc em { font-style: normal; font-family: var(--sans); font-size: 11px; color: var(--dim); margin-left: 4px; }
  .board p { margin: 6px 0 0; color: var(--dim); font-size: 13px; line-height: 1.4; }
  .why { margin: 0; font-size: 15px; color: var(--dim); }
  .big { font-family: var(--serif); font-style: italic; font-size: 72px; line-height: 1; margin: 2px 0 0; font-variant-numeric: tabular-nums; }
  .big small { font-size: 28px; color: var(--dim); margin-left: 6px; }
  .land { font-family: var(--serif); font-style: italic; font-size: 22px; margin: 2px 0 8px; }
  #endBrought { margin: 0 0 6px; font-size: 15px; }
  #keep { margin-top: 10px; }
  #keep button { border: 1.5px solid var(--ink); background: transparent; border-radius: 999px; padding: 9px 16px; font-size: 15px; min-height: 42px; }
  #keep p, #made { margin: 6px 0 0; font-size: 13px; color: var(--dim); line-height: 1.4; }
  label { display: block; font-size: 13px; color: var(--dim); margin: 6px 0 10px; }
  input[type=text] { display: block; width: 100%; margin-top: 4px; font: inherit; font-size: 17px; color: var(--ink); background: transparent; border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; user-select: text; -webkit-user-select: text; }
  .sides { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 4px 0 12px; }
  .sides button { border: 1.5px solid var(--line); background: transparent; border-radius: 14px; padding: 10px 6px; font-size: 14px; line-height: 1.2; min-height: 52px; }
  .sides button[aria-checked=true] { border-color: var(--ink); background: var(--press); font-weight: 600; }
  #roster { list-style: none; margin: 0 0 8px; padding: 0; font-size: 14px; }
  #roster li { display: flex; justify-content: space-between; gap: 8px; padding: 7px 2px; border-top: 1px solid var(--line); }
  #roster li span:last-child { color: var(--dim); font-size: 13px; }
  #wire { font-size: 13px; color: var(--dim); margin: 4px 0 8px; line-height: 1.4; }
  .small h2 { margin-bottom: 14px; }
  @media (max-height: 560px) { .panel h1 { font-size: 46px; } .lede { margin-bottom: 8px; } .big { font-size: 54px; } }
  @media (prefers-reduced-motion: reduce) { #banner, #hint, #store i { transition: none; } #store.low i { animation: none; } }
</style>

<script defer src="https://beach.happyseaurchin.com/button/game.js" data-game="forage"></script>

  <button id="pause" class="icon" aria-label="Pause"><svg viewBox="0 0 24 24"><path d="M9 6v12M15 6v12"/></svg></button>
  <div class="mid"><div id="km">0.0<small>km</small></div><div id="land">Barley stubble</div><div id="enrow"><svg id="engly" viewBox="0 0 12 12" aria-hidden="true"><ellipse cx="4" cy="4.5" rx="2.6" ry="1.7" transform="rotate(35 4 4.5)"/><ellipse cx="8" cy="7.5" rx="2.6" ry="1.7" transform="rotate(35 8 7.5)"/></svg><div id="store" role="meter" aria-label="Your energy" aria-valuemin="0" aria-valuemax="100" aria-valuenow="70"><i></i></div></div></div>

<section id="title" class="panel">
  <h1>Forage</h1>
  <p class="lede">Stay in the flock and starve, or dart out to feed and race back before the hawk finds you.</p>
  <div class="go"><button id="fly" class="primary">Fly</button><button id="together" class="secondary" hidden>Fly together</button></div>
  <div class="opts"><button id="optView"></button><button id="optSound"></button><button id="optTheme"></button></div>
  <div id="today" class="board"></div>
</section>

<section id="end" class="panel" hidden>
  <p id="endWhy" class="why"></p>
  <div class="big"><span id="endKm">0.0</span><small>km</small></div>
  <p id="endLand" class="land"></p>
  <p id="endBrought"></p>
  <div class="go"><button id="again" class="primary">Again</button><button id="asHawk" class="secondary">Come back as the hawk</button></div>
  <div id="keep" hidden><button id="keepBtn">Put it on the day's board</button><p id="keepState"></p></div>
  <p id="made" hidden></p>
  <div id="endBoard" class="board"></div>
</section>

<section id="lobby" class="panel" hidden>
  <h2>Fly together</h2>
  <label>Your name<input id="lobbyName" type="text" maxlength="32" autocomplete="nickname" spellcheck="false"></label>
  <div class="sides" role="radiogroup" aria-label="Your side">
    <button data-side="0" role="radio" aria-checked="true">In the flock</button>
    <button data-side="1" role="radio" aria-checked="false">The other flock</button>
    <button data-side="2" role="radio" aria-checked="false">The hawk</button>
  </div>
  <ul id="roster"></ul>
  <p id="wire"></p>
  <div class="go"><button id="liveGo" class="primary">Fly</button><button id="liveBack" class="secondary">Back</button></div>
</section>

<section id="paused" class="panel small" hidden>
  <h2>Paused</h2>
  <div class="go"><button id="resume" class="primary">Fly on</button><button id="quit" class="secondary">End this flight</button></div>
</section>

<script>
// ENGINE START — Forage's world, stepped thirty times a second. Nothing in it reads a clock, a screen or
// Math.random, and it uses no sine, cosine, power or arctangent, only + − × ÷ and the square root, which every
// browser rounds alike; so a run's taps re-run to the same flight on any phone. That is how the day's board
// checks a run, and how a kept run flies again as a ghost.
// Every bird carries two things: its breath, spent in the open and won back in the flock's shelter, and its
// energy, spent all the time and won back only by eating. Food is energy, and each kind gives it differently.
var ENGINE = (function () {
  'use strict';
  var VERSION = 'fg3', VERSION4 = 'fg4', HZ = 30, DT = 1 / HZ, M_PER_U = 4;
  // a unit is four metres; speeds are units a second
  var V_CRUISE = 5, V_EX = 4.4, V_SPRINT = 9, V_MIN = 2.2, V_EAT = 0.4;
  var A_IN = 14, A_BIRD = 22, A_DODGE = 32;
  // energy: spent at a base rate that rises with the distance flown, more when working hard in the open; the
  // computer's birds spend less (they are the flock's old hands); below EN_WEAK a bird weakens, at nothing it drops
  var EN_BASE = 0.007, EN_WORK = 0.014, EN_CPU = 0.11, EN_START = 0.7, EN_WEAK = 0.25, FULL_SLOW = 1.4, FULL_EASE = 0.12;
  var R_SEP = 1.25, R_JOIN = 2.0, R_DETACH = 5.5, R_LOST = 30, GRAB_R = 0.85;
  var REC = 0.18, DRAIN = 0.045;                 // breath: back in shelter, out in the air
  var NBIRDS = 26, NFLOCK = 20;
  var BAND_LEN = 300, ROW = 11, ROW0 = 36, REVEAL = 26, BEHIND = 24;
  var IN = 0, OUT = 1, LOST = 2, CAUGHT = 3;
  var FOLLOW = 0, DART = 1, HOME = 2, FLYTO = 3;
  var H_ARRIVE = 0, H_CIRCLE = 1, H_STOOP = 2, H_PULL = 3, H_CARRY = 4, H_LEAVE = 5, H_GONE = 6, H_FREE = 7;

  /* the food, and what each kind does for a bird: E energy, eaten over H seconds on the ground, B breath at
   * once, F how heavy it sits after (heaviness slows a bird and wears off) */
  var FOOD = [
    { key: 'grain', name: 'grain', E: 0.12, H: 0.3, B: 0, F: 0.06 },
    { key: 'haw', name: 'haws', E: 0.15, H: 0.35, B: 0, F: 0.07 },
    { key: 'midge', name: 'midges', E: 0.07, H: 0.15, B: 0.4, F: 0, drift: 1 },
    { key: 'worm', name: 'worms', E: 0.32, H: 0.9, B: 0, F: 0.35 },
    { key: 'apple', name: 'windfalls', E: 0.5, H: 1.5, B: 0, F: 0.8 },
    { key: 'seed', name: 'seeds', E: 0.11, H: 0.25, B: 0, F: 0.05 },
    { key: 'beetle', name: 'beetles', E: 0.27, H: 0.7, B: 0, F: 0.3 }
  ];
  // the country, a band at a time; hawk 0 is the sparrowhawk (from cover, low and quick), 1 the peregrine (from high)
  var KIND = [
    { key: 'stubble', name: 'Barley stubble', food: [0, 0, 0, 6], dens: 0.6, n: [3, 5], off: [9, 19], hawk: 1, rate: 0.8 },
    { key: 'hedges', name: 'Hawthorn hedges', food: [1, 1, 6], dens: 0.5, n: [2, 4], off: [10, 21], hawk: 0, rate: 1.0 },
    { key: 'meadow', name: 'Water meadows', food: [2, 2, 3], dens: 0.48, n: [2, 3], off: [10, 22], hawk: 1, rate: 1.0 },
    { key: 'plough', name: 'Plough', food: [3, 3, 6], dens: 0.38, n: [1, 3], off: [11, 23], hawk: 1, rate: 1.05 },
    { key: 'orchard', name: 'Old orchard', food: [4, 4, 1], dens: 0.36, n: [1, 2], off: [11, 22], hawk: 0, rate: 1.2 },
    { key: 'heath', name: 'Heath', food: [5, 5, 6], dens: 0.42, n: [2, 4], off: [12, 24], hawk: 1, rate: 1.15 },
    { key: 'marsh', name: 'Saltmarsh', food: [5, 2, 2], dens: 0.44, n: [2, 3], off: [11, 23], hawk: 1, rate: 1.1 }
  ];
  var HAWK = [
    { key: 'sparrowhawk', name: 'sparrowhawk', v: 12, a: 16, cruise: 7, stoop: 2.8, orb: 9 },
    { key: 'peregrine', name: 'peregrine', v: 14.5, a: 9, cruise: 8, stoop: 2.4, orb: 11 }
  ];

  // ── hashing and noise: integers only, so the country is the same everywhere ──
  function mix(h) {
    h = Math.imul(h ^ (h >>> 16), 0x7feb352d);
    h = Math.imul(h ^ (h >>> 15), 0x846ca68b);
    return (h ^ (h >>> 16)) >>> 0;
  }
  function hash3(a, b, c) { return mix(Math.imul(a | 0, 0x27d4eb2d) ^ Math.imul((b | 0) + 0x165667b1, 0x85ebca6b) ^ Math.imul((c | 0) + 0x61c88647, 0xc2b2ae35)); }
  function h01(a, b, c) { return hash3(a, b, c) / 4294967296; }
  function hs(a, b, c) { return hash3(a, b, c) / 2147483648 - 1; }
  function strHash(s) { var h = 2166136261; for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  function smooth(f) { return f * f * (3 - 2 * f); }
  function n1(t, salt) { var i = Math.floor(t), u = smooth(t - i), a = hs(i, salt, 7), b = hs(i + 1, salt, 7); return a + (b - a) * u; }
  function n2(x, y, salt) {
    var i = Math.floor(x), j = Math.floor(y), ux = smooth(x - i), uy = smooth(y - j);
    var a = h01(i, j, salt), b = h01(i + 1, j, salt), c = h01(i, j + 1, salt), d = h01(i + 1, j + 1, salt);
    return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
  }
  function rnd(w) {
    var a = w.rs = (w.rs + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }

  // ── the country: a day's route north, its bands and its patches ──
  /* ON THE FLOCK WORLD (27 Nov 2026, lane coil.1, thread:155; /games/world.js, world:flock-world): given a world and
   * a room, the flight's bands are the world's own ground along the room's crossing, a band at every 1.2 km of it,
   * and the room joins the seed, so two rooms on one day fly two countries. With no world, the country is the day's
   * alone, as every fg3 proof was flown, and re-runs as it always did. */
  function country(day, nf, wo) {
    var room = wo && wo.W ? String(wo.room == null ? 1 : wo.room) : '';
    var seed = strHash('forage ' + day + (room ? ' ' + room : ''));
    var C = { day: String(day), seed: seed, nf: nf === 2 ? 2 : 1, lat: nf === 2 ? [-14, 14] : [0], bk: {} };
    if (room) { C.W = wo.W; C.room = room; C.mark = wo.W.mark; C.cr = wo.W.crossing(day, 'forage', room); C.g = {}; }
    return C;
  }
  /* the world's nine kinds as Forage's seven lands: woods give cover as the hedges do, the high ridge is heath */
  var WKIND = { stubble: 0, hedges: 1, meadow: 2, plough: 3, orchard: 4, heath: 5, marsh: 6, woods: 1, ridge: 5 };
  function routeX(C, y) { return 36 * n1(y / 360, (C.seed ^ 0x5bd1) | 0) + 10 * n1(y / 100, (C.seed ^ 0x2c9f) | 0); }
  function routeDir(C, y, o) { var dx = (routeX(C, y + 3) - routeX(C, y - 3)) / 6, l = Math.sqrt(dx * dx + 1); o.x = dx / l; o.y = 1 / l; return o; }
  function bandAt(y) { return y < 0 ? 0 : Math.floor(y / BAND_LEN); }
  function bandKind(C, k) {
    if (k <= 0) return 0;
    var c = C.bk[k]; if (c !== undefined) return c;
    if (C.W) { var at = C.cr.at((k * BAND_LEN + BAND_LEN / 2) * M_PER_U / 1000); return (C.bk[k] = WKIND[C.W.ground(at.x, at.y, C.g).key]); }
    var cyc = Math.floor((k - 1) / 6), a = [1, 2, 3, 4, 5, 6];
    for (var i = 5; i > 0; i--) { var j = Math.floor(h01(C.seed, cyc, 40 + i) * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; }
    return (C.bk[k] = a[(k - 1) % 6]);
  }
  function kindAt(C, y) { return KIND[bandKind(C, bandAt(y))]; }
  /* a patch: where food lies out beyond a lane's edge, row r (every ROW units north), or null */
  function patch(C, r, lane) {
    var y0 = ROW0 + r * ROW, K = kindAt(C, y0), D = y0 * 0.004, s = r * 2 + lane, sd = C.seed;
    if (h01(sd, s, 11) >= K.dens / (1 + D / 14)) return null;
    var side = h01(sd, s, 12) < 0.5 ? -1 : 1;
    var off = K.off[0] + (K.off[1] - K.off[0]) * h01(sd, s, 13) + (D < 10 ? D * 0.5 : 5);
    var cy = y0 + hs(sd, s, 14) * 3, cx = routeX(C, cy) + C.lat[lane] + side * off;
    var ty = K.food[Math.floor(h01(sd, s, 15) * K.food.length)];
    var n = K.n[0] + Math.floor(h01(sd, s, 16) * (K.n[1] - K.n[0] + 1));
    if (FOOD[ty].E >= 0.3 && n > 2) n = 2;
    var rad = 1.0 + 1.0 * h01(sd, s, 17) + n * 0.25;
    return { r: r, lane: lane, s: s, x: cx, y: cy, rad: rad, ty: ty, n: n, side: side, band: K.key };
  }
  function drift(id, t, o) {
    var q = t / 2.6, k = Math.floor(q), u = smooth(q - k);
    var ax = hs(id, k, 31), ay = hs(id, k, 32), bx = hs(id, k + 1, 31), by = hs(id, k + 1, 32);
    o.x = (ax + (bx - ax) * u) * 2.2; o.y = (ay + (by - ay) * u) * 2.2; return o;
  }

  // ── the world ──
  /* how fast a bird can fly: its breath, how heavy it is with food, its hunger, and, inside the flock, the shelter
   * it sits in (a tired bird in the draft keeps the flock's pace, as a tired rider does in a peloton); a bird eating
   * is on the ground */
  function vmax(b) {
    if (b.eat > 0) return V_EAT;
    var v = V_EX + (V_SPRINT - V_EX) * Math.sqrt(b.b) - FULL_SLOW * b.full;
    if (b.en < EN_WEAK) v *= 0.8 + 0.8 * b.en;
    if (b.st === IN) v += (1 - b.e) * 2.6;
    return v < V_MIN ? V_MIN : v;
  }
  function addBird(w, fl, x, y, ctl) {
    var b = { id: w.birds.length, fl: fl, st: IN, x: x, y: y, px: x, py: y, vx: 0, vy: V_CRUISE, ax: 0, ay: 0, b: 0.85 + 0.15 * rnd(w), e: 0.3, e2: 0.3,
      ctl: ctl, ord: FOLLOW, ot: -1, ox: 0, oy: 0, en: 0.75 + 0.25 * rnd(w), full: 0, eat: 0, ef: -1, ate: 0, sv: 0, out: 0, cool: 2 + 6 * rnd(w), cour: 0.35 + 0.65 * rnd(w), side: rnd(w) < 0.5 ? -1 : 1,
      tired: 0, wel: 0, dodge: 0, ddx: 0, ddy: 0, nd: 1, nb: -1, kb: -1, kp: -1, q: -1 };
    w.birds.push(b); return b;
  }
  function addHawk(w, kind, x, y, fl, ctl) {
    var h = { id: w.hawks.length, k: kind, st: ctl >= 0 ? H_FREE : H_ARRIVE, x: x, y: y, px: x, py: y, vx: 0, vy: V_CRUISE, tg: -1, tm: 0, mis: 0, life: 0, ctl: ctl,
      ax: 0, ay: 0, atm: 0, alt: 1, fl: fl, cb: -1, ox: x, oy: y + 8, sw: 1, cat: 0, les: 0, cw: 0, lx: 0, ly: -1 };
    w.hawks.push(h); return h;
  }
  function create(o) {
    o = o || {};
    var nf = o.flocks === 2 ? 2 : 1, C = country(o.day, nf, o.world);
    var w = { v: C.W ? VERSION4 : VERSION, day: C.day, seed: C.seed, c: C, frame: 0, t: 0, rs: (C.seed ^ 0x2545f491) | 0, flocks: [], birds: [], hawks: [], food: [], fmap: {},
      nr: 0, hc: 0, nh: 32, hn: 0, pl: [], ev: [], fx: [], over: false, attract: !!o.attract, nohawk: !!o.nohawk };
    for (var i = 0; i < nf; i++) {
      var f = { i: i, lat: C.lat[i], dist: 0, ate: 0, nIn: 0, outN: 0, cx: 0, cy: 0, mvx: 0, mvy: V_CRUISE, rad: 3,
        fdx: 0, fdy: 1, turn: 0, alarm: 0, band: 0, end: '', sc: 0, fc: 4, jt: 20, ins: [] };
      w.flocks.push(f);
      var x0 = routeX(C, 0) + f.lat, n = o.size != null ? o.size : NBIRDS;
      for (var k = 0; k < n; k++) {
        var row = Math.floor(k / 5), col = k % 5;
        addBird(w, i, x0 + (col - 2 + (row % 2) * 0.5) * 1.5 + hs(C.seed, k, 3 + i) * 0.6, -row * 1.4 + hs(C.seed, k, 5 + i) * 0.6, -1);
      }
    }
    stats(w);
    (o.players || []).forEach(function (p) { addPlayer(w, p); });
    stats(w);
    return w;
  }
  /* a player joins: a bird near the middle of their flock, or a hawk of their own */
  function addPlayer(w, p) {
    var pi = w.pl.length;
    var pl = { name: String(p.name || ''), kind: p.kind === 'h' ? 'h' : 'b', fl: p.fl === 1 && w.flocks.length > 1 ? 1 : 0, id: -1, ate: 0, end: '', km: 0, band: '', by: '', fr: 0, caught: 0, pid: p.pid || '' };
    w.pl.push(pl);
    if (pl.kind === 'b') {
      var f = w.flocks[pl.fl], best = null, bd = 1e18, i;
      for (i = 0; i < w.birds.length; i++) {
        var b = w.birds[i]; if (b.fl !== pl.fl || b.ctl >= 0 || b.st !== IN) continue;
        var dx = b.x - f.cx, dy = b.y - f.cy, d2 = dx * dx + dy * dy; if (d2 < bd) { bd = d2; best = b; }
      }
      if (!best) best = addBird(w, pl.fl, f.cx, f.cy, -1);
      best.ctl = pi; best.ord = FOLLOW; best.b = 1; best.en = EN_START; best.full = 0; best.eat = 0; best.ef = -1;
      if (best.st !== IN) { best.st = OUT; best.ord = HOME; }
      var ahead = null; bd = 1e18;
      for (i = 0; i < w.birds.length; i++) {
        var o = w.birds[i]; if (o === best || o.fl !== pl.fl || o.st !== IN || o.y <= best.y) continue;
        var ex = o.x - best.x, ey = o.y - best.y, q = ex * ex + ey * ey; if (q < bd) { bd = q; ahead = o; }
      }
      best.ot = ahead ? ahead.id : -1;
      pl.id = best.id;
    } else {
      var f2 = w.flocks[pl.fl];
      var h = addHawk(w, 1, f2.cx + 12, f2.cy + 18, pl.fl, pi);
      h.alt = 0.7; h.ox = f2.cx + 6; h.oy = f2.cy + 14;
      pl.id = h.id;
    }
    return pi;
  }

  // ── one step ──
  var tmp = { x: 0, y: 0 }, cands = [];
  function step(w) {
    w.fx.length = 0;
    w.frame++; w.t = w.frame * DT;
    stats(w);
    foodStep(w);
    if (!w.nohawk) hawkSpawn(w);
    think(w);
    moveBirds(w);
    resolveBirds(w);
    moveHawks(w);
    stores(w);
    ends(w);
  }

  function stats(w) {
    for (var i = 0; i < w.flocks.length; i++) {
      var f = w.flocks[i], ins = f.ins; ins.length = 0;
      var sx = 0, sy = 0, svx = 0, svy = 0, out = 0, k, b;
      for (k = 0; k < w.birds.length; k++) {
        b = w.birds[k]; if (b.fl !== i) continue;
        if (b.st === IN) { ins.push(b); sx += b.x; sy += b.y; svx += b.vx; svy += b.vy; } else if (b.st === OUT) out++;
      }
      var n = ins.length; f.nIn = n; f.outN = out;
      if (n) {
        f.cx = sx / n; f.cy = sy / n; f.mvx = svx / n; f.mvy = svy / n;
        var r2 = 0; for (k = 0; k < n; k++) { var ex = ins[k].x - f.cx, ey = ins[k].y - f.cy; r2 += ex * ex + ey * ey; }
        f.rad = Math.sqrt(r2 / n) + 0.6;
      }
      if (w.frame > 0 && !f.end && n) f.dist += (f.mvy > 0 ? f.mvy : 0) * DT;
      // where the flock wants to go: north along the day's route, kept to its lane, swerving from a stooping hawk
      routeDir(w.c, f.cy, tmp);
      var rdx = tmp.x, rdy = tmp.y, lane = routeX(w.c, f.cy + 6) + f.lat - f.cx;
      var dx = rdx + lane * 0.05, dy = rdy, alarm = 0;
      for (k = 0; k < w.hawks.length; k++) {
        var H = w.hawks[k]; if (H.st === H_GONE) continue;
        var hx = f.cx - H.x, hy = f.cy - H.y, d2 = hx * hx + hy * hy;
        if (H.st === H_STOOP && d2 < 196) {
          var d = Math.sqrt(d2), dot = hx * rdx + hy * rdy, px = hx - rdx * dot, py = hy - rdy * dot, pl = Math.sqrt(px * px + py * py);
          if (pl > 0.01) { var s = 1.1 * (1 - d / 14); dx += px / pl * s; dy += py / pl * s; }
          alarm = 1;
        } else if ((H.st === H_CIRCLE || H.st === H_ARRIVE || H.st === H_FREE) && d2 < 400 && !alarm) alarm = 0.5;
      }
      f.alarm = alarm;
      var l = Math.sqrt(dx * dx + dy * dy); dx /= l; dy /= l;
      var ox = f.fdx, oy = f.fdy;
      f.fdx += (dx - f.fdx) * 0.14; f.fdy += (dy - f.fdy) * 0.14;
      l = Math.sqrt(f.fdx * f.fdx + f.fdy * f.fdy) || 1; f.fdx /= l; f.fdy /= l;
      var cr = ox * f.fdy - oy * f.fdx; if (cr < 0) cr = -cr;
      f.turn += (cr * HZ - f.turn) * 0.2;
      var bd = bandAt(f.cy);
      if (bd !== f.band && n && !f.end) { f.band = bd; w.fx.push({ k: 'band', f: i, band: bd }); }
    }
  }

  function foodStep(w) {
    var maxCy = -1e9, minCy = 1e9, i, f;
    for (i = 0; i < w.flocks.length; i++) { f = w.flocks[i]; if (!f.nIn) continue; if (f.cy > maxCy) maxCy = f.cy; if (f.cy < minCy) minCy = f.cy; }
    if (maxCy < -1e8) return;
    while (ROW0 + w.nr * ROW < maxCy + REVEAL + 14) { genRow(w, w.nr); w.nr++; }
    var keep = 0;
    for (i = 0; i < w.food.length; i++) {
      var it = w.food[i];
      if (it.st === 0 && maxCy >= it.ry) { it.st = 1; w.fx.push({ k: 'food', id: it.id }); }
      if (it.st === 1 && minCy > it.by + BEHIND) { it.st = 3; if (it.tg >= 0) it.tg = -1; }
      if (it.st === 1 && FOOD[it.ty].drift) { drift(it.id, w.t, tmp); it.x = it.bx + tmp.x; it.y = it.by + tmp.y; }
      if (it.st >= 2 && minCy > it.by + BEHIND + 12) { delete w.fmap[it.id]; continue; }
      w.food[keep++] = it;
    }
    w.food.length = keep;
  }
  function genRow(w, r) {
    for (var lane = 0; lane < w.flocks.length; lane++) {
      var P = patch(w.c, r, lane); if (!P) continue;
      for (var k = 0; k < P.n; k++) {
        var id = P.s * 8 + k;
        var it = { id: id, ty: P.ty, v: FOOD[P.ty].v, bx: P.x + hs(w.seed, id, 18) * P.rad * 0.6, by: P.y + hs(w.seed, id, 19) * P.rad * 0.6, x: 0, y: 0, st: 0, tg: -1, tb: -1, ry: 0 };
        it.x = it.bx; it.y = it.by; it.ry = it.by - REVEAL - k * 1.7;
        w.food.push(it); w.fmap[id] = it;
      }
    }
  }

  /* the computer birds decide, each in turn twice a second: rest at the front when tired, dart out when fresh */

  function sides() { Array.prototype.forEach.call(document.querySelectorAll('.sides button'), function (b) { b.setAttribute('aria-checked', String(+b.getAttribute('data-side') === S.side)); }); }
  function openLobby() {
    var Rm = hub(); if (!Rm) return;
    audioInit(); lobbyOn = true; mode = 'lobby'; screen('lobby');
    $('lobbyName').value = S.name || (plug() && plug().name && clean(plug().name())) || '';
    sides(); roster();
    if (!R.joined) joinRoom();
  }
  var wired = false;
  function joinRoom() {
    var Rm = hub(); if (!Rm) return;
    if (!wired) {
      wired = true;
      Rm.on('peer', function (v) { peerOf(v.id, v.name).direct = !!v.direct; roster(); if (R.joined) hello(v.id); });
      Rm.on('direct', function (v) { var p = peerOf(v.id, v.name); p.direct = !!v.direct; roster(); if (v.direct) hello(v.id); });
      Rm.on('ping', function (v) { var p = peerOf(v.id, v.name); p.direct = !!v.direct; p.ping = v.direct ? v.ping.direct : v.ping.relayed; });
      Rm.on('gone', function (v) { delete R.peers[v.id]; roster(); if (mode === 'live') electHost(); });
      Rm.on('message', onMessage);
    }
    $('wire').textContent = 'Opening the room…';
    var name = clean($('lobbyName').value) || S.name || undefined;
    /* a room holds a dozen: the room plug seats the thirteenth in the next, pool:forage:2, and on, each its own crossing
       of the flock world (spine:flock-world 1.113) */
    Rm.join({ name: name, max: 12 }).then(function (j) {
      if (!j || !j.ok) { $('wire').textContent = 'The room can’t be opened just now' + (j && j.error ? ': ' + j.error : '') + '.'; return; }
      R.joined = true; R.id = j.id; R.name = j.name; R.wire = j.wire; R.room = roomNo(j.room);
      if (!S.name && !/^guest-\d+$/.test(j.name)) { S.name = clean(j.name); }
      roster(); hello();
      clearInterval(helloTimer); helloTimer = setInterval(function () { hello(); if (mode === 'live') electHost(); }, 2500);
    });
  }
  function leaveRoom() {
    var Rm = hub(); clearInterval(helloTimer);
    if (Rm && R.joined) Rm.leave();
    R.joined = false; R.peers = {}; R.host = false; R.live = false;
  }
  function peerOf(id, name) { var p = R.peers[id]; if (!p) p = R.peers[id] = { id: id, name: clean(name) || 'someone', side: 0, st: 'lobby', direct: false, ping: null, seen: now(), said: false }; else if (name && clean(name) && !p.said) p.name = clean(name); return p; }
  function hello(to) { var Rm = hub(); if (!Rm || !R.joined) return; Rm.send('hi', { s: S.side, st: mode === 'live' ? 'run' : 'lobby', run: R.run, n: clean($('lobbyName').value) || S.name }, to ? { to: to } : undefined); }
  function roster() {
    var ul = $('roster'); ul.innerHTML = '';
    var names = ['in the flock', 'the other flock', 'the hawk'];
    function row(name, side, extra) { var li = document.createElement('li'), a = document.createElement('span'), b = document.createElement('span'); a.textContent = name; b.textContent = names[side] + (extra ? ' · ' + extra : ''); li.appendChild(a); li.appendChild(b); ul.appendChild(li); }
    if (R.joined) row((clean($('lobbyName').value) || R.name) + ' (you)', S.side, '');
    var ids = Object.keys(R.peers), relayed = 0;
    ids.forEach(function (id) { var p = R.peers[id]; if (!p.direct) relayed++; row(p.name, p.side, p.st === 'run' ? 'flying' : p.direct ? '' : 'slow line'); });
    if (!R.joined) return;
    $('wire').textContent = !ids.length ? 'Nobody else is here yet. Fly now among the computer’s birds, or wait: the room tells you who comes.'
      : relayed ? 'Someone here is not connected directly yet: until they are, their flight moves in steps, a second or two behind.'
      : ids.length === 1 ? 'One other here. Fly when you are both ready.' : ids.length + ' others here. Fly when you are ready.';
  }
  function onMessage(msg) {
    if (!msg || !msg.from) return;
    var p = peerOf(msg.from, msg.name), b = msg.body || {};
    p.seen = now();
    if (msg.kind === 'hi') { p.side = clamp(+b.s || 0, 0, 2); p.st = b.st === 'run' ? 'run' : 'lobby'; if (b.n && clean(b.n)) { p.name = clean(b.n); p.said = true; } roster(); return; }
    if (msg.kind === 'go') {
      if (b.s != null) p.side = clamp(+b.s || 0, 0, 2); if (b.n && clean(b.n)) { p.name = clean(b.n); p.said = true; }
      if (mode === 'live' && R.host) admit(msg.from); else if ((mode === 'lobby' || mode === 'end-live') && isLowest() && !flyingElsewhere()) startLive();   // on the end screen too: the room flies on (anteroom.1)
      return;
    }
    if (msg.kind === 'start') { if (b.run && b.run !== R.run) beginLive(b, msg.from); return; }
    if (msg.kind === 's') { takeSnap(b, msg.from); return; }
    if (msg.kind === 'o') { if (mode === 'live' && R.host) hostOrder(msg.from, b); return; }
    if (msg.kind === 'own') { if (mode === 'live' && b.run === R.run) { R.myPi = b.pi; me = b.pi; } return; }
  }
  function ids() { var a = [R.id]; Object.keys(R.peers).forEach(function (id) { if (now() - R.peers[id].seen < 9000) a.push(id); }); return a.sort(); }
  function isLowest() { return ids()[0] === R.id; }
  $('liveGo').addEventListener('click', function () {
    S.name = clean($('lobbyName').value) || S.name; put('name', S.name);
    var Rm = hub(); if (!Rm || !R.joined) return;
    if (isLowest() && !flyingElsewhere()) startLive(); else Rm.send('go', { s: S.side, n: S.name });
  });
  function flyingElsewhere() { return Object.keys(R.peers).some(function (id) { return R.peers[id].st === 'run' && now() - R.peers[id].seen < 9000; }); }
  /* the host begins a flight: the day's country, a flock or two, each player's side */
  function startLive() {
    var Rm = hub(); if (!Rm) return;
    var list = [{ pid: R.id, name: clean($('lobbyName').value) || R.name, side: S.side }];
    Object.keys(R.peers).forEach(function (id) { var p = R.peers[id]; if (now() - p.seen < 9000) list.push({ pid: id, name: p.name, side: p.side }); });
    var two = list.some(function (x) { return x.side === 1; });
    var run = R.id + '-' + Date.now().toString(36), day = today();
    var players = list.map(function (x) { return { pid: x.pid, name: x.name, kind: x.side === 2 ? 'h' : 'b', fl: x.side === 1 ? 1 : 0 }; });
    var w0 = E.create({ day: day, flocks: two ? 2 : 1, players: players, world: onWorld(R.room) });
    var body = { run: run, snap: E.snap(w0) };
    Rm.send('start', body);
    beginLive(body, R.id, w0);
  }
  function beginLive(b, from, w0) {
    var nw = w0 || E.adopt(b.snap); if (!nw) return;
    R.run = b.run; R.live = true; R.lastSnapFrame = nw.frame; R.snapAt = now(); R.host = from === R.id; R.hostId = from; R.acks = {}; R.seq = 0; R.unacked = [];
    w = nw; useCountry(w.c);
    me = -1; for (var i = 0; i < w.pl.length; i++) if (w.pl[i].pid === R.id) me = i;
    R.myPi = me;
    mode = 'live'; endShown = false; endAt = 0; paused = false; pending = []; fxs = []; cam.ready = false;
    screen('run'); hud(true); $('livebar').hidden = false; livebar();
    $('pause').setAttribute('aria-label', 'Leave the flight'); $('pause').innerHTML = '<svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg>';
    bannerShow(E.kindAt(w.c, 0).name);
    hello();
  }
  function admit(pid) {
    // a player who arrives while the flock is flying takes a computer's bird on their side, or comes as a hawk
    var Rm = hub(), p = R.peers[pid]; if (!Rm || !p) return;
    var pi = -1;
    for (var i = 0; i < w.pl.length; i++) if (w.pl[i].pid === pid && (!w.pl[i].end || w.pl[i].kind === 'h')) pi = i;
    if (pi < 0) pi = E.takeOver(w, { pid: pid, name: p.name, kind: p.side === 2 ? 'h' : 'b', fl: p.side === 1 ? 1 : 0 });
    if (pi < 0) pi = E.takeOver(w, { pid: pid, name: p.name, kind: 'h', fl: 0 });
    if (pi >= 0) Rm.send('start', { run: R.run, snap: E.snap(w) }, { to: pid });
  }
  function sendOrder(c, a, a2) {
    var Rm = hub(); if (!Rm || !R.hostId) return;
    R.seq++; R.unacked.push([R.seq, c, a | 0, a2 | 0]);
    Rm.send('o', { q: R.seq, c: c, a: a | 0, a2: a2 | 0, pi: me }, { to: R.hostId });
  }
  function hostOrder(from, b) {
    var pi = -1; for (var i = 0; i < w.pl.length; i++) if (w.pl[i].pid === from && (!w.pl[i].end || w.pl[i].kind === 'h')) pi = i;
    if (pi < 0) return;
    if (!R.acks[from] || b.q > R.acks[from]) { R.acks[from] = b.q; E.order(w, pi, String(b.c || '').slice(0, 1), b.a | 0, b.a2 | 0); }
  }
  function liveBeforeStep() {}
  function liveAfterStep() {
    var Rm = hub(); if (!Rm) return;
    if (R.host) {
      var t = now(), ps = Rm.peers(), snapNow = null;
      for (var i = 0; i < ps.length; i++) {
        var p = ps[i], last = R.sentAt[p.id] || 0, every = p.direct ? 250 : 2000;
        if (t - last < every) continue;
        R.sentAt[p.id] = t;
        if (!snapNow) snapNow = E.snap(w);
        Rm.send('s', { run: R.run, ack: R.acks[p.id] || 0, snap: snapNow }, { to: p.id, reliable: p.direct ? false : true });
      }
      // the world's own rebirths: a player who fell out comes back as the hawk
      for (var k = 0; k < w.pl.length; k++) { var pl = w.pl[k]; if (pl.kind === 'b' && pl.end && !pl.reborn && w.frame - pl.fr > 45) { pl.reborn = true; var np = E.rebirth(w, k); if (np !== false && np >= 0 && pl.pid === R.id) { me = np; R.myPi = np; } else if (np !== false && np >= 0) Rm.send('own', { run: R.run, pi: np }, { to: pl.pid }); } }
    }
    if (w.over || !w.flocks.some(function (f) { return !f.end; })) { if (!endShown) { endShown = true; setTimeout(liveEnd, 1600); } }
    if (!R.host && now() - R.snapAt > 4500) electHost();
    livebarAt();
  }
  /* a page that is not the host takes the host's world as it comes, then flies it forward to now, its own orders
   * not yet taken there laid on again */
  function takeSnap(b, from) {
    if (!b || !b.snap || b.run !== R.run || mode !== 'live') return;
    if (from !== R.hostId) {
      if (R.host) { if (b.snap.fr > w.frame + 30 || (from < R.id && b.snap.fr >= w.frame - 30)) { R.host = false; R.hostId = from; R.lastSnapFrame = -1; } else return; }
      else { R.hostId = from; R.lastSnapFrame = -1; }
    }
    if (b.snap.fr < R.lastSnapFrame) return;
    var nw = E.adopt(b.snap); if (!nw) return;
    R.lastSnapFrame = b.snap.fr; R.snapAt = now();
    var ahead = Math.round(((R.peers[from] && R.peers[from].ping) || 120) / 2 / 1000 / DT);
    // keep what the eye has: where each bird is drawn now, eased onto where the host says it is
    var old = w;
    w = nw;
    R.unacked = (R.unacked || []).filter(function (o) { return o[0] > (b.ack || 0); });
    R.unacked.forEach(function (o) { E.order(w, me, o[1], o[2], o[3]); });
    for (var i = 0; i < ahead && i < 10; i++) E.step(w);
    var tc = now(), k;
    if (old) {
      for (k = 0; k < w.birds.length && k < old.birds.length; k++) { var a = old.birds[k], c = w.birds[k]; if (c.st > 1 || a.st > 1) continue; var dx = a.x - c.x, dy = a.y - c.y; if (dx * dx + dy * dy < 16) { c.cx = dx; c.cy = dy; c.ct = tc; } }
      for (k = 0; k < w.hawks.length && k < old.hawks.length; k++) { var ha = old.hawks[k], hc = w.hawks[k]; var ex = ha.x - hc.x, ey = ha.y - hc.y; if (ex * ex + ey * ey < 25) { hc.cx = ex; hc.cy = ey; hc.ct = tc; } }
    }
    for (k = 0; k < w.pl.length; k++) if (w.pl[k].pid === R.id && (!w.pl[k].end || w.pl[k].kind === 'h')) me = k;
  }
  function electHost() {
    if (mode !== 'live' || R.host) return;
    if (R.hostId && R.peers[R.hostId] && now() - R.snapAt < 4500) return;     // the host is speaking
    var silent = R.hostId, list = ids().filter(function (id) { return id !== silent; }), lo = list[0];
    if (lo === R.id) { R.host = true; R.hostId = R.id; R.acks = {}; R.sentAt = {}; }
    else if (lo) { R.hostId = lo; R.snapAt = now(); }
  }
  var lbAt = 0;
  function livebarAt() { if (now() > lbAt) { lbAt = now() + 1000; livebar(); } }
  function livebar() {
    if (mode !== 'live') { $('livebar').hidden = true; return; }
    var n = 0; for (var i = 0; i < w.pl.length; i++) if (!w.pl[i].end || w.pl[i].kind === 'h') n++;
    $('livebar').hidden = false;
    $('livebar').textContent = 'together · ' + n + ' flying' + (R.host ? '' : '');
  }
  function liveEnd() {
    if (mode !== 'live') return;
    var p = null; for (var i = 0; i < w.pl.length; i++) if (w.pl[i].pid === R.id && w.pl[i].kind === 'b') p = w.pl[i];
    $('livebar').hidden = true;
    if (p && p.end) {
      fillEnd(p, true);
      lastProof = (w.c.W ? 'fg4L~' + w.day + '~' + w.c.room + '~' + w.c.mark : 'fg3L~' + w.day) + '~' + (p.km.toFixed(1)) + '_' + p.ate; lastLine = 'FLEW ' + p.km.toFixed(1) + ' km · ' + p.band + ' · ate ' + p.ate + ' · together'; runDay = w.day;
      $('keep').hidden = !(plug() && p.km > 0); $('keepState').textContent = ''; $('made').hidden = true;
    } else {
      $('endWhy').textContent = 'The flight is over.'; $('endKm').textContent = '–'; $('endLand').textContent = ''; $('endBrought').textContent = '';
      $('keep').hidden = true;
      var hp = null; for (i = 0; i < w.pl.length; i++) if (w.pl[i].pid === R.id && w.pl[i].kind === 'h') hp = w.pl[i];
      if (hp) $('endBrought').textContent = 'As the hawk you took ' + hp.caught + '.';
      $('again').textContent = 'Back to the room';
    }
    $('asHawk').hidden = true;
    R.live = false; mode = 'end-live'; screen('end'); hello();
    boardInto($('endBoard'), 0);
  }

  // ── the buttons ──
  $('fly').addEventListener('click', function () { startSolo(); });
  $('together').addEventListener('click', function () { openLobby(); });
  $('again').addEventListener('click', function () { if (mode === 'end-live') { mode = 'lobby'; openLobby(); return; } startSolo(); });
  $('asHawk').addEventListener('click', function () { asHawk(); });
  $('liveBack').addEventListener('click', function () { leaveRoom(); mode = 'title'; pauseIcon(); attract(); screen('title'); titleBoard(); });
  window.addEventListener('keydown', function (ev) {
    if (ev.key !== 'Escape') return;
    if (paused) $('resume').click(); else if (mode === 'run' || mode === 'hawk') $('pause').click();
  });
  cv.addEventListener('contextmenu', function (ev) { ev.preventDefault(); });
  Array.prototype.forEach.call(document.querySelectorAll('.sides button'), function (b) { b.addEventListener('click', function () { S.side = +b.getAttribute('data-side'); put('side', String(S.side)); sides(); hello(); roster(); }); });
  $('lobbyName').addEventListener('change', function () { S.name = clean($('lobbyName').value); put('name', S.name); hello(); roster(); });
  $('optView').addEventListener('click', function () { S.view = S.view === 'bird' ? 'sky' : 'bird'; put('view', S.view); opts(); });
  $('viewBtn').addEventListener('click', function () { S.view = S.view === 'bird' ? 'sky' : 'bird'; put('view', S.view); opts(); cam.ready = cam.ready; });
  $('optSound').addEventListener('click', function () { S.sound = !S.sound; put('sound', S.sound ? 'on' : 'off'); if (S.sound) audioInit(); else if (A.c) { try { A.wind.gain.setTargetAtTime(0, A.c.currentTime, 0.1); } catch (e) {} } opts(); });
  $('optTheme').addEventListener('click', function () { S.theme = S.theme === 'auto' ? (dark() ? 'light' : 'dark') : S.theme === 'light' ? 'dark' : 'auto'; put('theme', S.theme); applyTheme(); opts(); });
  $('pause').addEventListener('click', function () {
    if (mode === 'live') { leaveLive(); return; }
    if (mode !== 'run' && mode !== 'hawk') return;
    paused = true; screen('paused');
  });
  function leaveLive() { leaveRoom(); $('livebar').hidden = true; mode = 'title'; pauseIcon(); attract(); screen('title'); titleBoard(); }
  function pauseIcon() { $('pause').setAttribute('aria-label', 'Pause'); $('pause').innerHTML = '<svg viewBox="0 0 24 24"><path d="M9 6v12M15 6v12"/></svg>'; }
  $('resume').addEventListener('click', function () { paused = false; screen('run'); last = now(); });
  $('quit').addEventListener('click', function () {
    paused = false;
    if (mode === 'hawk') { endHawk(); return; }
    var p = myPl(); if (p && !p.end) { var f = w.flocks[p.fl]; p.end = 'left'; p.km = Math.floor(f.dist * 0.04) / 10; p.band = E.kindAt(w.c, f.cy).name; }
    mode = 'title'; attract(); screen('title'); titleBoard();
  });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden && (mode === 'run' || mode === 'hawk') && !endShown && !paused) { paused = true; screen('paused'); }
    if (document.hidden && mode === 'live' && R.host) { /* the next page takes up the world after its silence */ }
  });
  window.addEventListener('resize', function () { layout(); });
  if (reduceQ.addEventListener) reduceQ.addEventListener('change', function () { cam.ready = false; });
  if (window.matchMedia) { var mq = matchMedia('(prefers-color-scheme: dark)'); if (mq.addEventListener) mq.addEventListener('change', function () { applyTheme(); }); }

  function titleBoard() {
    boardInto($('today'), 0);
    $('together').hidden = !hub();
  }

  // ── the loop ──
  /* light on the battery: the title draws thirty times a second, play sixty; a phone that cannot keep up is drawn
   * at a lower resolution rather than at a lower rate */
  var last = now(), acc = 0, nth = 0, slow = 16.7, slowAt = now() + 4000, rdt = 0;
  function frame() {
    var t = now(), dt = Math.min(0.25, (t - last) / 1000); last = t;
    if (w && !paused) {
      acc += dt; var n = 0;
      while (acc >= DT && n < 6) { acc -= DT; tick(); n++; }
      if (n >= 6) acc = 0;
    }
    nth++; rdt += dt;
    var calm = mode === 'title' || paused || !$('end').hidden;
    if (w && (!calm || nth % 2 === 0)) { render(paused ? 1 : acc / DT, rdt); rdt = 0; hud(false); soundscape(dt); }
    if (!calm && !document.hidden) {
      slow += (dt * 1000 - slow) * 0.05;
      if (t > slowAt) { slowAt = t + 2500; if (slow > 23 && dprCap > 1 && (window.devicePixelRatio || 1) > 1) { dprCap = Math.max(1, dprCap - 0.5); layout(); dropChunks(); slow = 16.7; } }
    } else slowAt = Math.max(slowAt, t + 3000);
    if (banner.t && now() > banner.t) { $('banner').classList.remove('on'); banner.t = 0; }
    if (hintAt && now() > hintAt) { $('hint').classList.remove('on'); hintAt = 0; hintText = ''; }
    requestAnimationFrame(frame);
  }

  // ── a hook for testing the page from outside: the state, and taps by meaning rather than by place ──
  window.__forage = {
    world: function () { return w; }, me: function () { return me; }, mode: function () { return mode; }, cam: cam,
    order: function (c, a, a2) { issue(c, a, a2); }, tap: function (x, y) { tap(x, y, false); },
    start: startSolo, asHawk: asHawk, screenOf: function (x, y) { return toScreen(x, y, { x: 0, y: 0 }); },
    fast: function (n) { for (var i = 0; i < n; i++) tick(); },
    look: function (x, y, z) { lookAt = x == null ? null : { x: x, y: y, z: z }; cam.ready = false; },
    routeX: function (y) { return E.routeX(w.c, y); },
    prof: function (on) { var r = PROF; PROF = on ? { ground: 0, things: 0, rest: 0, n: 0 } : null; return r; },
    setView: function (v) { S.view = v; opts(); }, engine: E
  };

  try { var td = today(); for (var ki = localStorage.length - 1; ki >= 0; ki--) { var key = localStorage.key(ki); if (key && key.indexOf(GAME + ':best:') === 0 && key !== GAME + ':best:' + td) localStorage.removeItem(key); } } catch (e) {}
  layout(); applyTheme(); opts(); attract(); screen('title');
  setTimeout(titleBoard, 50);
  window.addEventListener('load', function () { setTimeout(titleBoard, 300); });
  requestAnimationFrame(frame);
})();
