<style>
:root{
  /* Migration: the day's country drawn as a living survey map; the flock in ink, you in survey red.
     Layout: one full-bleed live map; the HUD pinned to the safe edges; cards rise as bottom sheets. */
  --ink:#14161b;
  --paper:#f1efe8;
  --signal:#e3173f;
  --night:#161c2b;
  --gold:#e9c46a;
  --display:"IM Fell English SC","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --italic:"IM Fell English","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --pill:rgba(241,239,232,.93);
  --pillInk:#14161b;
  --pillLine:rgba(20,22,27,.16);
  --barBg:rgba(20,22,27,.16);
  color-scheme:light;
}
body.night{
  --pill:rgba(22,28,43,.9);
  --pillInk:#eef0f6;
  --pillLine:rgba(238,240,246,.18);
  --barBg:rgba(238,240,246,.18);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--night)}
body{font-family:var(--ui);color:var(--pillInk);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none;-webkit-touch-callout:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* ---------- in-flight HUD ---------- */
.hud{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;
  padding:calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 12px) calc(env(safe-area-inset-bottom) + 14px) calc(env(safe-area-inset-left) + 12px);
  opacity:0;transition:opacity .5s}
.hud.on{opacity:1}
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:8px}
.pill{background:var(--pill);color:var(--pillInk);border:1px solid var(--pillLine);border-radius:999px;padding:8px 12px;font-weight:700;font-size:13px;line-height:1.1;box-shadow:0 1px 8px rgba(0,0,0,.14);font-variant-numeric:tabular-nums;white-space:nowrap}
#clock{justify-self:start;display:flex;align-items:center;gap:7px}
#clock i{width:10px;height:10px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 2px rgba(233,196,106,.35);flex:none}
body.night #clock i{background:#cfd6ee;box-shadow:0 0 0 2px rgba(207,214,238,.25)}
#count{display:flex;flex-direction:column;align-items:center;border-radius:16px;padding:6px 16px 7px;min-width:84px}
#count b{font-size:27px;line-height:1;font-weight:800;letter-spacing:-.01em}
#count span{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;opacity:.72;margin-top:3px;font-weight:700}
#count small{font-size:10.5px;font-weight:750;margin-top:3px;opacity:.85;letter-spacing:.02em}
#count small:empty{display:none}
#clock .ct{display:flex;flex-direction:column;gap:2px}
#clock small{font-size:11px;font-weight:750}
#clock small:empty{display:none}
#clock small.ok{color:#1d7a3e}#clock small.near{color:#a85600}#clock small.short{color:#c62f22}
body.night #clock small.ok{color:#7fe0a0}body.night #clock small.near{color:#ffc07a}body.night #clock small.short{color:#ff8a80}
.pace{display:none;gap:4px;pointer-events:auto;background:var(--pill);border:1px solid var(--pillLine);border-radius:999px;padding:4px;box-shadow:0 1px 8px rgba(0,0,0,.14)}
.pace.on{display:flex}
.pace button{appearance:none;border:0;background:none;border-radius:999px;padding:9px 16px;font:700 14px var(--ui);color:var(--pillInk);cursor:pointer;min-width:76px}
.pace button[aria-pressed="true"]{background:var(--ink);color:#fff}
body.night .pace button[aria-pressed="true"]{background:#eef0f6;color:#14161b}
.btns{justify-self:end;display:flex;gap:6px;pointer-events:auto}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--pill);color:var(--pillInk);border:1px solid var(--pillLine);padding:0;cursor:pointer;box-shadow:0 1px 8px rgba(0,0,0,.14)}
.ib svg{width:20px;height:20px;display:block}
#toasts{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top) + 92px);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;padding:0 16px}
.toast{max-width:min(92vw,440px);text-align:center;white-space:normal;font-weight:650;font-size:14px;line-height:1.25;padding:8px 14px;transition:opacity .45s,transform .45s;opacity:0;transform:translateY(-6px)}
.toast.in{opacity:1;transform:none}
.toast.me{border-color:rgba(227,23,63,.55)}
.bottom{display:flex;flex-direction:column;align-items:center;gap:8px}
#status{font-size:13px}
#status.lead{background:#14161b;color:#fff;border-color:rgba(255,255,255,.55)}
.bars{width:min(440px,100%);display:grid;gap:5px;background:var(--pill);border:1px solid var(--pillLine);border-radius:16px;padding:9px 12px 10px;box-shadow:0 1px 8px rgba(0,0,0,.14)}
.bar{display:grid;grid-template-columns:44px 1fr 64px;align-items:center;gap:8px;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.bar .tr{height:12px;border-radius:6px;background:var(--barBg);overflow:hidden;position:relative}
.bar .fl{position:absolute;inset:0;transform-origin:left center;background:var(--pillInk);border-radius:6px}
.bar.me .fl{background:var(--signal)}
.bar .v{text-align:right;font-variant-numeric:tabular-nums;text-transform:none;letter-spacing:0}
.bar.front{opacity:.9}
.bar.front .tr{height:8px}
.bar.front.hide{display:none}
#hint{font-size:12.5px;font-weight:650;transition:opacity .6s;white-space:normal;text-align:center;max-width:min(440px,100%);line-height:1.3}
#hint.gone{opacity:0}

/* ---------- title ---------- */
.title{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:space-between;align-items:center;text-align:center;
  padding:calc(env(safe-area-inset-top) + 9vh) 20px calc(env(safe-area-inset-bottom) + 30px);
  background:linear-gradient(180deg,rgba(14,17,26,.62) 0%,rgba(14,17,26,.18) 38%,rgba(14,17,26,0) 55%,rgba(14,17,26,.5) 100%);
  color:var(--paper);transition:opacity .6s;pointer-events:auto}
.title.off{opacity:0;pointer-events:none}
.title h1{font-family:var(--display);font-weight:400;font-size:clamp(38px,11vw,84px);letter-spacing:.14em;margin:0 0 0 .14em;line-height:.95;text-wrap:balance;text-shadow:0 2px 24px rgba(0,0,0,.35)}
.title .day{font-family:var(--italic);font-style:italic;font-size:clamp(17px,4.6vw,22px);margin:14px 0 0;opacity:.95;text-wrap:balance}
.title .route{font-family:var(--italic);font-style:italic;font-size:clamp(15px,4vw,19px);margin:4px 0 0;opacity:.85;text-wrap:balance}
.go{display:flex;flex-direction:column;align-items:center;gap:12px;width:min(360px,100%)}
.fly{appearance:none;border:0;border-radius:999px;background:var(--signal);color:#fff;font-family:var(--display);font-size:26px;letter-spacing:.2em;padding:14px 0 15px .2em;width:min(280px,100%);cursor:pointer;box-shadow:0 6px 26px rgba(227,23,63,.38),0 2px 0 rgba(0,0,0,.25)}
.fly:active{transform:translateY(1px)}
.alt{appearance:none;background:none;border:0;color:var(--paper);font-family:var(--italic);font-style:italic;font-size:17px;padding:6px 10px;cursor:pointer;text-decoration:underline;text-underline-offset:4px;text-decoration-color:rgba(241,239,232,.45)}
.alt[hidden]{display:none}
.who{display:flex;align-items:center;gap:6px;font-family:var(--italic);font-style:italic;font-size:16px;opacity:.92}
.who input{width:8.5em;background:rgba(241,239,232,.12);border:1px solid rgba(241,239,232,.35);border-radius:8px;color:var(--paper);font-family:var(--italic);font-style:italic;font-size:16px;padding:4px 8px;text-align:center}
.best{font-size:13px;font-weight:650;opacity:.8;min-height:1.2em;letter-spacing:.02em}
.birds{display:flex;align-items:center;gap:6px;font-family:var(--italic);font-style:italic;font-size:16px}
.birds button{appearance:none;border:1px solid rgba(241,239,232,.45);background:rgba(241,239,232,.1);color:var(--paper);border-radius:999px;padding:5px 11px;font:700 14px var(--ui);cursor:pointer;min-width:42px}
.birds button[aria-pressed="true"]{background:var(--paper);color:var(--ink)}

/* ---------- end sheet and menu ---------- */
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;width:min(560px,100%);max-height:82%;overflow:auto;background:var(--paper);color:var(--ink);
  border-radius:22px 22px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.35);padding:18px 20px calc(env(safe-area-inset-bottom) + 18px);
  transform:translateY(105%);transition:transform .55s cubic-bezier(.2,.8,.2,1);pointer-events:auto;touch-action:pan-y}
.sheet.on{transform:none}
.grab{width:42px;height:5px;border-radius:3px;background:rgba(20,22,27,.18);margin:0 auto 12px}
.res{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.res b{font-family:var(--display);font-weight:400;font-size:68px;line-height:.9;color:var(--signal);font-variant-numeric:lining-nums}
.res span{font-family:var(--italic);font-style:italic;font-size:21px;line-height:1.2;text-wrap:balance;flex:1;min-width:12em}
.line{margin:8px 0 14px;font-size:14px;font-weight:600;opacity:.75;font-variant-numeric:tabular-nums}
.line.rival{margin-top:-8px}
.line.rival:empty{display:none}
.split{display:grid;grid-template-columns:132px 1fr;gap:16px;align-items:start}
#eMap{width:132px;height:220px;border-radius:10px;background:#7a8a5a;display:block}
.board h3{font-family:var(--display);font-weight:400;font-size:17px;letter-spacing:.08em;margin:0 0 6px}
.board ol{margin:0;padding:0;list-style:none;display:grid;gap:5px;font-size:13.5px;line-height:1.25}
.board li{display:grid;grid-template-columns:22px 1fr;gap:6px}
.board li em{font-style:normal;font-weight:800;font-variant-numeric:tabular-nums;opacity:.6}
.board li.you{color:var(--signal);font-weight:700}
.board .none{font-family:var(--italic);font-style:italic;opacity:.7;font-size:15px}
.acts{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:18px}
.acts .fly{width:auto;padding:12px 30px 13px calc(30px + .2em);font-size:22px}
.next{font-size:13px;font-weight:650;opacity:.7;text-align:center;margin-top:10px;font-variant-numeric:tabular-nums}
.sheet .alt{color:var(--ink);text-decoration-color:rgba(20,22,27,.35)}
.menu .row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid rgba(20,22,27,.1);font-size:16px;font-weight:600}
.menu .row:last-child{border:0}
.menu h3{font-family:var(--display);font-weight:400;font-size:22px;letter-spacing:.1em;margin:0 0 4px}
.tog{appearance:none;border:1px solid rgba(20,22,27,.25);background:#fff;border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px;cursor:pointer;min-width:74px}
.tog[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
@media (max-width:360px){.split{grid-template-columns:104px 1fr}#eMap{width:104px;height:174px}.res b{font-size:56px}}
@media (prefers-reduced-motion:reduce){.sheet,.toast,.title,.hud{transition:none}}

<body>
<canvas id="cv" aria-label="Migration: the flock crossing the day's country" role="img"></canvas>

<div class="hud" id="hud">

      </button>
      <button class="ib" id="bSound" aria-label="Sound off" title="Sound">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="iSound"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
      </button>
      <button class="ib" id="bMenu" aria-label="Menu" title="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 7h14M5 12h14M5 17h14"/></svg>
      </button>
    </div>
  </div>
  <div class="bottom">
    <div class="pill" id="status">following</div>
    <div class="bars" aria-live="off">
      <div class="bar me"><span>you</span><div class="tr"><div class="fl" id="fMe"></div></div><span class="v" id="vMe">air 0%</span></div>
      <div class="bar front" id="rowFront"><span>front</span><div class="tr"><div class="fl" id="fFront"></div></div><span class="v" id="vFront">100%</span></div>
    </div>
    <div class="pill" id="hint">Tap a bird to follow it · tap ahead to leapfrog · tap yourself for pace · fly over resting birds to lift them</div>
  </div>
</div>
<div id="toasts" aria-live="polite"></div>

<div class="title" id="title">
  <div>
    <h1>Migration IV</h1>
    <p class="day" id="tDay"></p>
    <p class="route" id="tRoute"></p>
  </div>
  <div class="go">
    <button class="fly" id="fly">Fly</button>
    <button class="alt" id="alone" hidden>practise alone</button>
    <label class="who" for="tName">flying as <input id="tName" maxlength="16" autocomplete="off" spellcheck="false"></label>
    <div class="birds" id="tBirds" role="group" aria-label="Birds in the sky"><span>birds</span></div>
    <div class="best" id="tBest"></div>
  </div>
</div>

<div class="sheet" id="end" role="dialog" aria-label="Run result">
  <div class="grab"></div>
  <div class="res"><b id="eNum">0</b><span id="eWhat"></span></div>
  <div class="line" id="eLine"></div>
  <div class="line rival" id="eRival"></div>
  <div class="split">
    <canvas id="eMap" width="264" height="440" aria-label="The day's country with your line"></canvas>
    <div class="board"><h3>Today's board</h3><div id="eBoard"></div></div>
  </div>
  <div class="acts">
    <button class="fly" id="again">Fly again</button>
    <button class="alt" id="eAlone" hidden>practise alone</button>
  </div>
  <div class="next" id="eNext"></div>
</div>

<div class="sheet menu" id="menu" role="dialog" aria-label="Menu">
  <div class="grab"></div>
  <h3>Migration IV</h3>
  <div class="row"><span>View</span><button class="tog" id="mView">sky</button></div>
  <div class="row"><span>Reduce motion</span><button class="tog" id="mMotion" aria-pressed="false">off</button></div>
  <div class="row"><span>Sound</span><button class="tog" id="mSound" aria-pressed="true">on</button></div>
  <div class="row"><span id="mRestartL">Start the day again</span><button class="tog" id="mRestart">restart</button></div>
  <div class="row"><span>Back to the start screen</span><button class="tog" id="mLeave">leave</button></div>
  <div class="acts"><button class="fly" id="mResume">Resume</button></div>
</div>

<script>
"use strict";
(function () {

//  Constants and small helpers

const ROUTE = 15200;      // start to roost, map units

const STEP = 1 / 60;
const TAU = Math.PI * 2;

const PACE_NAMES = ['slow', 'steady', 'fast'];

function makeParams(key) {

  P.marshes = [
    { x: lineX(m0y) + ms * rr(600, 1300), y: m0y, r: rr(400, 520) },
    { x: lineX(m1y) - ms * rr(500, 1300), y: m1y, r: rr(330, 440) }

  if (R() < 0.65) { const y = -rr(0.13, 0.18) * ROUTE; P.marshes.push({ x: lineX(y) + sgn() * rr(800, 1500), y, r: rr(280, 360) }); }

    const dir = sgn(), sp = rr(40, 56), yc = -rr(0.45, 0.68) * ROUTE, tArr = rr(85, 130), xl = lineX(yc);

  }

    const dir = sgn(), sp = rr(30, 44), yc = -rr(0.16, 0.23) * ROUTE, tArr = rr(22, 38), xl = lineX(yc);
    const vx = dir * sp;

  }
  P.wind = { a: rr(0, 6.283), m: rr(8, 17), f: rr(0.01, 0.03), p: rr(0, 6.283) };
  P.start.y = 0;
  P.towns = [];
  for (let k = 0; k < 11; k++) P.towns.push({ x: rr(-4800, 4800), y: rr(-ROUTE - 1700, 2000), r: rr(90, 180) });

    roost: np() + ' ' + pick(['Mere', 'Water', 'Flats', 'Carr', 'Moss']),
    start: np() + ' ' + pick(['Pool', 'Water', 'Tarn']),
    ridges: [], passes: [],
    marshes: P.marshes.map(() => np() + ' ' + pick(['Fen', 'Marsh', 'Levels', 'Moss', 'Carr'])),
    rivers: shuffled(RIV, R).slice(0, 2).map((n) => 'the ' + n),
    towns: P.towns.map(() => np() + pick(TOWN))
  };
  for (let k = 0; k < P.ridges.length; k++) { const n = np(); P.names.ridges.push(n + ' ' + pick(HILL)); P.names.passes.push(n + ' ' + pick(PASS)); }

}

  $('eWhat').textContent = E.kind === 'home' ? (r.n === 1 ? 'bird' : 'birds') + ' you brought home to ' + W.P.names.roost : E.km ? 'Night fell ' + E.km + ' km short of ' + W.P.names.roost : 'You came down short of ' + W.P.names.roost;
  endLine(); rivalLine();
  $('again').textContent = W.live ? 'Fly on' : 'Fly again';
  $('eNext').textContent = '';
  drawEndMap(); renderBoard();
  $('end').classList.add('on');
}
function endLine() {
  const E = W.myEnd, bits = [];
  if (E.kind === 'home') { bits.push(myGroupCount() + ' home together'); bits.push('landed ' + fmtT(E.landT)); }
  const gth = W.gath.get(W.me) || 0; if (gth > 0) bits.push('gathered ' + gth);
  bits.push('led ' + fmtT(W.stats.led)); bits.push('largest flock ' + W.stats.maxFlock);
  const t = bits.join(' · '); if ($('eLine').textContent !== t) $('eLine').textContent = t;
}
function rivalLine() { // how the computer's player did
  const K = W.keen >= 0 ? W.birds[W.keen] : null, el = $('eRival');
  if (!K || K.i === W.me) { el.textContent = ''; return; }
  const t = K.st === 1 ? K.name + ' brought ' + yoursHome(K) + ' home' : K.st === 0 ? K.name + ' is still flying, ' + yoursWith(K) + ' of its own with it' : K.name + ' came down short';
  if (el.textContent !== t) el.textContent = t;
}
function hideEnd() { S.endShown = false; $('end').classList.remove('on'); }
function skyHasRoom() { return W.phase === 'fly' && W.t < DAY - 25 && W.birds.some((b) => b.own === 'ai' && b.st === 0); }
function flyOn() { // in a live sky, after landing: become another bird still in the air
  const me = myBird();
  if (!skyHasRoom()) { $('eNext').textContent = 'The flocks are settling. Next dawn in ' + fmtT(DAY + NIGHT_HOLD - W.t); return; }
  hideEnd();
  if (me) me.own = 'ai';
  W.me = -1;
  if (W.host) hostAssign(Net.id, S.name);
  else { Net.wantBird = true; Net.helloAt = 0; Net.fresh = true; }
}
function renderBoard() {
  const box = $('eBoard'); box.innerHTML = '';
  const list = W.board;
  const mine = store.d.best && W.P && store.d.best[W.P.key];
  if (!list || !list.length) {
    const p = document.createElement('p'); p.className = 'none';
    p.textContent = Board.ok() ? 'Nothing on the board yet today.' : (mine ? 'Your best today: ' + mine.line : 'Your runs today will show here.');
    box.appendChild(p); return;
  }
  const ol = document.createElement('ol');
  list.slice(0, 8).forEach((e, i) => {
    const li = document.createElement('li'); const em = document.createElement('em'); em.textContent = i + 1;
    const sp = document.createElement('span'); sp.textContent = e.line + (e.who ? ' · ' + e.who : '');
    if (e.who && (e.who === Net.name || e.who === S.name)) li.className = 'you';
    li.appendChild(em); li.appendChild(sp); ol.appendChild(li);
  });
  box.appendChild(ol);
}
function drawEndMap() {
  const c = $('eMap'), x = c.getContext('2d'), w = c.width, h = c.height, P = W.P, B = Tiles.ovB;
  x.setTransform(1, 0, 0, 1, 0, 0); x.fillStyle = Tiles.base; x.fillRect(0, 0, w, h);
  if (!B) return;
  const sc = Math.min(w / B.w, h / B.h), ox = (w - B.w * sc) / 2, oy = (h - B.h * sc) / 2;
  if (Tiles.ov) x.drawImage(Tiles.ov, ox, oy, B.w * sc, B.h * sc);
  const X = (vx) => ox + (vx - B.x0) * sc, Y = (vy) => oy + (vy - B.y0) * sc;
  x.lineJoin = 'round'; x.lineCap = 'round';
  for (const g of W.ghosts) { x.setLineDash([4, 4]); x.strokeStyle = 'rgba(255,255,255,0.85)'; x.lineWidth = 2; x.beginPath(); g.path.forEach((p, i) => (i ? x.lineTo(X(p[0]), Y(p[1])) : x.moveTo(X(p[0]), Y(p[1])))); x.stroke(); x.setLineDash([]); }
  if (W.rec.length > 1) { x.strokeStyle = '#ffffff'; x.lineWidth = 3; x.beginPath(); W.rec.forEach((p, i) => (i ? x.lineTo(X(p[0]), Y(p[1])) : x.moveTo(X(p[0]), Y(p[1])))); x.stroke(); }
  x.strokeStyle = '#fff'; x.lineWidth = 2; x.beginPath(); x.arc(X(P.roost.x), Y(P.roost.y), 7, 0, TAU); x.stroke();
  x.fillStyle = '#15171c'; x.beginPath(); x.arc(X(P.start.x), Y(P.start.y), 4, 0, TAU); x.fill();
}
function openMenu() {
  S.menu = true; $('menu').classList.add('on');
  $('mRestartL').textContent = W.live ? 'Practise alone instead' : 'Start the day again';
  if (!W.live) S.paused = true;
}
function closeMenu() { S.menu = false; $('menu').classList.remove('on'); S.paused = false; }

// =====================================================================
//  One finger
// =====================================================================
function pickBird(sx, sy) {
  const me = myBird(); const R = lerp(26, 46, cam.blend); let best = null, bd = R * R;
  for (const b of W.birds) { if (b === me || b.st !== 0 || !b.on) continue; const dx = b.sx - sx, dy = b.sy - sy, d = dx * dx + dy * dy; if (d < bd) { bd = d; best = b; } }
  return best;
}
function resolveAction(sx, sy) {
  const me = myBird(); if (!me || me.st !== 0 || S.mode !== 'fly' || S.endShown) return { kind: 'none' };
  const hit = pickBird(sx, sy);
  const dMe = Math.hypot(sx - me.sx, sy - me.sy);
  if (dMe < lerp(24, 40, cam.blend) && (!hit || dMe < Math.hypot(sx - hit.sx, sy - hit.sy))) return { kind: 'pace' }; // tap yourself: your pace
  if (hit) return { kind: 'follow', bird: hit, back: hit.root === me.root && isBehind(hit, me) };
  const p = toWorld(sx, sy), h = Math.atan2(p.y - me.y, p.x - me.x);
  if (me.tg < 0) { const turn = Math.abs(angDiff(me.hd, h)); if (me.pend < 0 && turn > 1.3 && flockSize(me) > 1) return { kind: 'turnaway', h, p }; return { kind: 'steer', h, p }; }
  const R = frontOf(me), fh = R && R.st === 0 ? R.hd : me.hd;
  if (Math.abs(angDiff(fh, h)) < 0.95) return { kind: me.tg === R.i ? 'lead' : 'up', h, p }; // only from right behind the front can you take it
  return { kind: 'away', h, p };
}
function commitAction(a) {
  const me = myBird(); if (!me || !a) return;
  if (a.p) W.fx.push({ k: 'tap', a: me.i, x: a.p.x, y: a.p.y, t0: performance.now() });
  switch (a.kind) {
    case 'follow': myFollow(a.bird); break;
    case 'lead': myTakeFront(a.h); break;
    case 'up': myUp(); break;
    case 'pace': cyclePace(); break;
    case 'away': myPeel(a.h); break;
    case 'turnaway': myTurnAway(a.h); break;
    case 'steer': me.hdes = a.h; me.pend = -1; note(); break;
  }
}
function bindInput() {
  const cv = G.cv;
  cv.addEventListener('pointerdown', (e) => {
    if (!e.isPrimary || S.mode !== 'fly') return;
    Sound.init();
    try { cv.setPointerCapture(e.pointerId); } catch (er) {}
    const act = resolveAction(e.clientX, e.clientY);
    S.press = { id: e.pointerId, x: e.clientX, y: e.clientY, x0: e.clientX, y0: e.clientY, t: performance.now(), act };
    if (act.kind === 'steer') { const me = myBird(); if (me) { me.hdes = act.h; me.pend = -1; } }
    e.preventDefault();
  });
  cv.addEventListener('pointermove', (e) => {
    const p = S.press; if (!p || p.id !== e.pointerId) return;
    p.x = e.clientX; p.y = e.clientY; p.act = resolveAction(p.x, p.y);
    if (p.act.kind === 'steer') { const me = myBird(); if (me) { me.hdes = p.act.h; me.pend = -1; } }
  });
  const up = (e) => {
    const p = S.press; if (!p || p.id !== e.pointerId) return; S.press = null;
    commitAction(resolveAction(e.clientX, e.clientY));
  };
  cv.addEventListener('pointerup', up);
  cv.addEventListener('pointercancel', () => { S.press = null; });
  cv.addEventListener('contextmenu', (e) => e.preventDefault());
  window.addEventListener('keydown', (e) => {
    if (S.mode !== 'fly' || e.target.tagName === 'INPUT') return;
    const me = myBird(); if (!me || me.st !== 0) return;
    if (e.key === 'v') setView(cam.mode === 'sky' ? 'bird' : 'sky');
    if (e.key === 'ArrowUp' || e.key === 'w') { if (me.tg < 0) setPace(S.pace + 1); else { const R = frontOf(me); commitAction({ kind: me.tg === R.i ? 'lead' : 'up', h: R.hd }); } }
    if ((e.key === 'ArrowDown' || e.key === 's') && me.tg < 0) setPace(S.pace - 1);
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { const h = me.hd + (e.key === 'ArrowLeft' ? -0.5 : 0.5); commitAction(me.tg < 0 ? { kind: 'steer', h } : { kind: 'away', h: me.hd + (e.key === 'ArrowLeft' ? -1.4 : 1.4) }); }
    if (e.key === ' ' || e.key === 'Enter') { // follow the nearest bird ahead
      let best = null, bd = 1e9; const c = Math.cos(me.hd), s = Math.sin(me.hd);
      for (const b of W.birds) { if (b === me || b.st !== 0) continue; const dx = b.x - me.x, dy = b.y - me.y, f = dx * c + dy * s; if (f < 8) continue; const d = Math.hypot(dx, dy); if (d < bd && d < 200) { bd = d; best = b; } }
      if (best) myFollow(best);
      e.preventDefault();
    }
  });
  $('bView').addEventListener('click', () => { setView(cam.mode === 'sky' ? 'bird' : 'sky'); toast(cam.mode === 'sky' ? 'Sky view' : "Bird's view"); });
  $('bSound').addEventListener('click', () => { Sound.init(); Sound.setMuted(!Sound.muted); store.d.muted = Sound.muted; store.save(); setSoundUI(); });
  $('bMenu').addEventListener('click', () => openMenu());
  $('mResume').addEventListener('click', () => closeMenu());
  $('mView').addEventListener('click', () => setView(cam.mode === 'sky' ? 'bird' : 'sky'));
  $('mMotion').addEventListener('click', () => { setMotion(!S.rm); store.d.rm = S.rm; store.save(); });
  $('mSound').addEventListener('click', () => { Sound.init(); Sound.setMuted(!Sound.muted); store.d.muted = Sound.muted; store.save(); setSoundUI(); });
  $('mRestart').addEventListener('click', () => { closeMenu(); newTrainingRun(); });
  $('mLeave').addEventListener('click', () => { closeMenu(); showTitle(); });
  $('fly').addEventListener('click', () => startFly(false));
  $('alone').addEventListener('click', () => startFly(true));
  $('again').addEventListener('click', () => {
    Sound.init();
    if (!W.live) { hideEnd(); newTrainingRun(); return; }
    flyOn();
  });
  $('eAlone').addEventListener('click', () => { hideEnd(); Net.leave(); newTrainingRun(); });
  $('tName').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); startFly(false); } });
  window.addEventListener('resize', resize);
  document.addEventListener('visibilitychange', () => { if (document.hidden) { if (!W.live && S.mode === 'fly') S.paused = true; } else { S.paused = S.menu && !W.live; lastT = performance.now(); } });
  window.addEventListener('pagehide', () => Net.leave());
  if (RMQ.addEventListener) RMQ.addEventListener('change', (e) => { if (S.rmUser == null) setMotion(e.matches); });
}

// =====================================================================
//  The loop
// =====================================================================
let lastT = performance.now(), acc = 0;
function tick(dt) {
  W.t += dt;
  computeStructure();
  if (W.host) {
    hostAI(dt);
    if (W.phase === 'fly' && W.t >= DAY) W.phase = 'night';
    if (W.live && W.phase === 'night' && W.t >= DAY + NIGHT_HOLD) onDawn(true);
  }
  const B = W.birds;
  for (let k = 0; k < B.length; k++) { const b = B[k]; if (canControl(b)) stepBird(b, dt); else smoothRemote(b, dt); }
  if (S.mode === 'title') { S.attractT += dt; if (W.t > 95) { spawnFlock(FILL); W.t = 12; W.run++; } }
  checkMyRun(dt);
}
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - lastT) / 1000; lastT = now; if (dt > 0.1) dt = 0.1; if (dt < 0) dt = 0;
  if (!W.P) return;
  if (!S.paused && !(W.live && !W.adopted)) { acc += dt; let n = 0; while (acc >= STEP && n < 5) { tick(STEP); acc -= STEP; n++; } if (n === 5) acc = 0; }
  updateCamera(dt);
  Tiles.pump();
  if (S.mode === 'title' && (FRAME & 1)) FRAME++; else draw(now);
  hudUpdate(dt);
  netPump(dt);
  const me = myBird();
  if (me && me.st === 0 && S.mode === 'fly') { W.F.env(me.x, me.y, W.t, PL); const fl = flockOf(me); Sound.update(dt, me.drag, PL.storm, me.sp / V, fl ? fl.size : 1); }
  else Sound.update(dt, 0.1, 0, 0.5, 0);
  if (S.mode === 'fly' && W.live && S.endShown && W.phase === 'night') $('eNext').textContent = 'Next dawn in ' + fmtT(DAY + NIGHT_HOLD - W.t);
}

// =====================================================================
//  Boot
// =====================================================================
function start(data) {
  data = data || {};
  store.load();
  G.cv = $('cv'); G.ctx = G.cv.getContext('2d', { alpha: false });
  resize();
  S.name = store.d.name || PLAYER_NAMES[Math.floor(Math.random() * PLAYER_NAMES.length)];
  $('tName').value = S.name;
  Sound.muted = data.muted != null ? !!data.muted : !!store.d.muted; setSoundUI();
  if (data.rm != null) S.rmUser = data.rm; else if (store.d.rm != null) S.rmUser = store.d.rm;
  setMotion(S.rmUser != null ? !!S.rmUser : !!RMQ.matches);
  setView(data.view || store.d.view || 'sky');
  Tiles.init();
  bindInput();
  FILL = BIRD_CHOICES.includes(store.d.fill) ? store.d.fill : 24;
  const tb = $('tBirds');
  for (const n of BIRD_CHOICES) {
    const bt = document.createElement('button'); bt.textContent = n; bt.setAttribute('aria-pressed', String(n === FILL));
    bt.addEventListener('click', () => { FILL = n; store.d.fill = n; store.save(); for (const o of tb.querySelectorAll('button')) o.setAttribute('aria-pressed', String(+o.textContent === n)); showTitle(); });
    tb.appendChild(bt);
  }
  showTitle();
  try { if (document.fonts && document.fonts.load) { document.fonts.load('16px "IM Fell English SC"'); document.fonts.load('italic 16px "IM Fell English"'); } } catch (e) {}
  window.addEventListener('load', () => { if (S.mode === 'title') { const k = dayKey(); if (!W.P || W.P.key !== k) showTitle(); else fillTitle(); } });
  requestAnimationFrame((t) => { lastT = t; frame(t); });
  const hot = window.claude && window.claude.hot;
  if (hot && typeof hot.snapshot === 'function') { try { hot.snapshot(() => ({ view: cam.mode, muted: Sound.muted, rm: S.rmUser })); } catch (e) {} }
  window.__migration = { W, cam, S, Net, sim: simFor, tick, newTrainingRun, spawnFlock, setCountry, makeParams, startFly, myBird, setView, myFollow, myTakeFront, myUp, myPeel, setPace, cyclePace, spareOf, yoursWith, yoursHome, drawNow: () => draw(performance.now()) };
}
function simFor(seconds) { // headless check of a whole day with computer birds only
  const n = Math.round(seconds / STEP); for (let k = 0; k < n; k++) tick(STEP);
  const groups = {}; let home = 0, down = 0;
  for (const b of W.birds) { if (b.st === 1) { home++; groups[b.grp] = (groups[b.grp] || 0) + 1; } if (b.st === 2) down++; }

const hot = window.claude && window.claude.hot;
if (hot && typeof hot.ready === 'function') { try { hot.ready(start); } catch (e) { start({}); } }
else start((hot && hot.data) || {});

})();
