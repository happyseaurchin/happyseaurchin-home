<style>
/* THE BRIGHTON ROOM'S OWN LOOK (premiere.html's palette), since a delegate comes here from the room */
:root{
  --bg:#eef1f4; --surface:#f7f8fa; --ink:#151a22; --ink-2:#4b5466; --ink-3:#687184;
  --rule:rgba(21,26,34,.12); --rule-2:rgba(21,26,34,.26);
  --green:#17866a; --violet:#6b45c9; --link:#2459b8; --spark:#d0661a; --flame:#c8341a;
  --display:"Newsreader", Georgia, "Times New Roman", serif;
  --ui:"IBM Plex Sans Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f131a; --surface:#161b24; --ink:#e8ecf2; --ink-2:#a9b2c1; --ink-3:#8a93a4;
  --rule:rgba(232,236,242,.12); --rule-2:rgba(232,236,242,.26);
  --green:#22a07e; --violet:#9479ee; --link:#8ab4ff; --spark:#f08a3c; --flame:#ff6a4a;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0f131a; --surface:#161b24; --ink:#e8ecf2; --ink-2:#a9b2c1; --ink-3:#8a93a4;
  --rule:rgba(232,236,242,.12); --rule-2:rgba(232,236,242,.26);
  --green:#22a07e; --violet:#9479ee; --link:#8ab4ff; --spark:#f08a3c; --flame:#ff6a4a;
  color-scheme:dark;}

/* THE SITE'S OWN BAR (theme.js), its tokens said in this page's palette, as premiere.html says them */
:root{
  --foam:var(--ink); --vapour:var(--ink-2); --vapour-dim:var(--ink-3); --abyss:var(--bg);
  --line:var(--rule); --line-strong:var(--rule-2);
  --liquid:#0D6B79; --liquid-rgb:13,107,121; --solid:#8E6210; --solid-rgb:142,98,16;
  --well-rgb:247,248,250; --wash-rgb:21,26,34;
  --body:var(--display); --mono:"Space Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --liquid:#33C2D2; --liquid-rgb:51,194,210; --solid:#E7B24C; --solid-rgb:231,178,76; --well-rgb:22,27,36; --wash-rgb:232,236,242;}}
:root[data-theme="dark"]{
  --liquid:#33C2D2; --liquid-rgb:51,194,210; --solid:#E7B24C; --solid-rgb:231,178,76; --well-rgb:22,27,36; --wash-rgb:232,236,242;}
.sitebar{position:relative;z-index:8;display:flex;align-items:center;gap:10px;
  margin:0 calc(-1 * max(16px, env(safe-area-inset-right, 0px))) 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  padding:calc(12px + env(safe-area-inset-top, 0px)) max(18px, env(safe-area-inset-right, 0px)) 12px max(18px, env(safe-area-inset-left, 0px));
  background:var(--bg);border-bottom:1px solid var(--rule);
  font-family:var(--mono);font-size:12px;line-height:1.4;letter-spacing:.08em;color:var(--ink-3)}
.sitebar .dot{width:6px;height:6px;border-radius:50%;background:var(--solid);box-shadow:0 0 10px var(--solid);flex:none}
.sitebar b{font-weight:700;color:var(--ink)}
.sitebar .spacer{flex:1}
@media (max-width:520px){.sitebar .sub{display:none}}
.sitebar button{font-family:var(--mono);font-size:12px;line-height:inherit;letter-spacing:normal;color:var(--ink-3);background:none;border:1px solid var(--rule);border-radius:4px;padding:6px 10px}
.sitebar button:hover{color:var(--ink);border-color:var(--rule-2)}
.framed .sitebar,.screen .sitebar{display:none !important}
/* the site's dictation glyph (theme.js dictate), as theme.css draws it */
.dictate{position:absolute;z-index:2;width:22px;height:22px;margin:0;padding:0;display:flex;align-items:center;justify-content:center;box-sizing:border-box;
  background:rgba(var(--well-rgb),0.55);border:1px solid var(--line);border-radius:50%;color:var(--ink-3);cursor:pointer}
.dictate svg{width:13px;height:13px;fill:currentColor;display:block}
.dictate:hover{color:var(--foam);border-color:var(--line-strong)}
.dictate.on{color:var(--liquid);border-color:rgba(var(--liquid-rgb),0.55);animation:dictate-pulse 1.6s ease-in-out infinite}
.dictate[hidden]{display:none}
@keyframes dictate-pulse{0%,100%{box-shadow:0 0 0 0 rgba(var(--liquid-rgb),0.45)}50%{box-shadow:0 0 0 7px rgba(var(--liquid-rgb),0)}}
@media (prefers-reduced-motion:reduce){.dictate.on{animation:none;box-shadow:0 0 0 3px rgba(var(--liquid-rgb),0.3)}}

*{box-sizing:border-box}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--display);font-size:18px;line-height:1.6;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto}
header.xhead{padding-block:36px 4px}
.kicker{font-family:var(--ui);font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:0 0 10px}
h1{font-family:var(--display);font-weight:500;font-size:clamp(34px, 7vw, 52px);line-height:1.05;letter-spacing:-.01em;margin:0 0 14px;text-wrap:balance}
h2{font-family:var(--display);font-weight:500;font-size:26px;line-height:1.2;margin:0 0 12px;text-wrap:balance}
h3{font-family:var(--ui);font-weight:500;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin:22px 0 8px}
p{margin:0 0 14px}
.lede{font-size:20px;line-height:1.5;color:var(--ink-2);max-width:60ch}
a{color:var(--link);text-underline-offset:3px}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--link);outline-offset:2px;border-radius:3px}
section{padding-block:18px 10px}
.muted{color:var(--ink-3)}
.note{font-family:var(--ui);font-size:14px;line-height:1.45;color:var(--ink-3);margin:6px 0 14px;max-width:60ch}
button{font-family:var(--ui);font-size:15px;color:var(--ink);background:transparent;border:1px solid var(--rule-2);border-radius:999px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--ink-2)}
button.go{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button.go.big{font-size:17px;padding:10px 22px}
button.mlink{border:0;padding:4px 2px;text-decoration:underline;text-underline-offset:3px;color:var(--link);border-radius:4px}
button:disabled{opacity:.5;cursor:default}
.hint{font-family:var(--ui);font-size:14px;line-height:1.45;color:var(--ink-2);min-height:1.2em;margin:8px 0 0}
.hint.err{color:var(--flame)} .hint.ok{color:var(--green)}

/* the box: the line's four parts (function:<stage> 1) */
#say{border:1px solid var(--rule);border-radius:14px;background:var(--surface);padding:16px 18px 18px;margin-top:10px}
#say h2{margin-bottom:6px}
.youline{font-family:var(--ui);font-size:15px;color:var(--ink-2);margin:0 0 10px}
.youline b{color:var(--ink);font-weight:500}
.f{display:grid;gap:4px;font-family:var(--ui);font-size:14px;color:var(--ink-2);margin:0 0 12px;max-width:560px}
.f input{font-family:var(--ui);font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--rule-2);border-radius:8px;padding:8px 34px 8px 10px;width:100%;min-width:0}
.sizes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:2px 0 14px;max-width:560px}
.sizes button{border-radius:10px;text-align:left;padding:8px 12px;font-size:16px;display:flex;flex-direction:column;gap:1px}
.sizes button small{font-size:13px;color:var(--ink-3);line-height:1.3}
.sizes button[aria-pressed="true"]{border-color:var(--violet);box-shadow:inset 0 0 0 1px var(--violet)}

/* the stage: the count kept today, and the recommendations as they come */
.count{display:flex;flex-direction:column;gap:2px;margin:4px 0 6px}
.count .row{display:grid;grid-template-columns:minmax(0,8.5em) minmax(0,1fr);gap:4px 14px;padding:9px 0;border-top:1px solid var(--rule);font-family:var(--ui);font-size:16px;line-height:1.45}
.count .row:first-child{border-top:0}
.count .lab{font-weight:500;color:var(--ink);text-transform:uppercase;letter-spacing:.04em;font-size:14px;padding-top:2px}
.count p{font-family:var(--ui);font-size:16px;margin:6px 0}
ul.lines{list-style:none;padding:0;margin:0}
ul.lines li{padding:9px 0;border-top:1px solid var(--rule);font-family:var(--ui);font-size:15px;line-height:1.45}
ul.lines li:first-child{border-top:0}
ul.lines b{font-weight:500;font-size:16px}
ul.lines .size{color:var(--violet)}
ul.lines .why{display:block;color:var(--ink-2)}
ul.lines .by{color:var(--ink-3)}
.again{margin-top:12px}
#qr{display:none}
.home{font-family:var(--ui);font-size:14px;color:var(--ink-3);margin:24px 0 0}
.home a{color:inherit;text-underline-offset:2px}
.framed .home{display:none}

/* THE BIG SCREEN (?screen), for the evening stage: no box, the count large, and a code to scan to recommend */
.screen body{font-size:22px}
.screen .wrap{max-width:1500px}
.screen #say,.screen .home,.screen .again,.screen #stageHint:empty{display:none}
.screen h1{font-size:clamp(48px, 5vw, 84px)}
.screen .lede{font-size:26px}
@media (min-width:1000px){.screen #stage{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:20px 56px;align-items:start}}
.screen .count .row{font-size:24px;grid-template-columns:minmax(0,7em) minmax(0,1fr);padding:14px 0}
.screen .count .lab{font-size:20px}
.screen .count p{font-size:24px}
.screen ul.lines li{font-size:20px;padding:12px 0}
.screen ul.lines b{font-size:22px}
.screen #qr{display:flex;align-items:center;gap:18px;margin:0 0 18px}
#qrCode svg{display:block;width:150px;height:150px}
#qr p{font-family:var(--ui);font-size:20px;line-height:1.35;margin:0}
#qr b{display:block;font-size:24px;color:var(--ink);font-weight:500}
</style>

<body data-beach-button="off">
<div class="bar sitebar"><span class="dot"></span><span><b>stage</b><span class="sub" id="barSub"> · the people’s stage</span></span><span class="spacer"></span></div>
<div class="wrap">
<header class="xhead">
  <p class="kicker" id="kicker">The people’s stage</p>
  <h1 id="xTitle">Opening&hellip;</h1>
  <p class="lede" id="xLede"></p>
</header>

<section id="say" hidden aria-label="Recommend someone">
  <h2>Recommend someone you met</h2>
  <p class="youline" id="youLine"></p>
  <label class="f" id="meBox" hidden>Your handle <input id="me" autocomplete="username" spellcheck="false" autocapitalize="off" maxlength="32"></label>
  <p class="note" id="meNote" hidden></p>
  <label class="f">Who should be heard <input id="whom" list="known" spellcheck="false" autocapitalize="off" maxlength="32" placeholder="their handle"></label>
  <datalist id="known"></datalist>

<section id="stage" aria-label="Who the delegates are asking to hear">

    <h2 id="stageHead">Who the delegates are asking to hear</h2>

  </div>
  <div>
    <div id="qr"><div id="qrCode" role="img"></div><p><span>Recommend someone you met:</span><b id="qrUrl"></b></p></div>

<p class="home" id="home"><a href="/">happyseaurchin.com</a></p>
</div>
<script src="https://beach.happyseaurchin.com/button/voice.js"></script>
<script>
/* THE PEOPLE'S STAGE — a stage family on the clock (keel's function:brighton-stage, 20 October 2026): after meeting
 * someone, a delegate says who should be heard, by a table, a room, a hall or everyone, why, and how they met, one
 * line in their own mirror, <stage>:<handle>, at the beat it is said; the count of distinct voices, kept at the bare
 * name at the day's address at set times, decides, never money. This page is the box for that line and the stage
 * read back: the count kept today, and every standing recommendation as it comes. ?screen is the same page for a big
 * screen at an evening stage, with no box. Nothing about a stage is written here: its law is function:<stage>. */
(function(){
'use strict';
/* the voice, or, where it could not be reached, a stand-in that says so */
if (!window.beachVoice){
  const away = () => Promise.resolve({ ok:false, error:'the beach could not be reached just now' });
  window.beachVoice = { say: away, keep: away, ask: away, drop: away, name: () => '', button: { shown: () => false, set: away }, onButton(){} };
}
const BEACH = 'https://beach.happyseaurchin.com/.well-known/pscale-beach';
const SITE = 'https://happyseaurchin.com';
const $ = id => document.getElementById(id);
const esc = s => { const d = document.createElement('span'); d.textContent = s == null ? '' : String(s); return d.innerHTML; };
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch(e){} }
};
const clean = v => window.cleanHandle ? window.cleanHandle(v) : String(v || '').replace(/[^A-Za-z0-9_\s-]/g, '').replace(/\s+/g, ' ').trim().slice(0, 32);
function voice(n){ while (n && typeof n === 'object'){ if (!('_' in n)) return null; n = n._; } return typeof n === 'string' && n.trim() ? n.trim() : null; }
const floorOf = b => { let n = b, f = 0; while (n && typeof n === 'object' && '_' in n){ f++; n = n._; } return f; };
const walk = (b, addr) => { let n = b; for (const d of String(addr)){ if (!n || typeof n !== 'object') return undefined; n = n[d === '0' ? '_' : d]; } return n; };
const cap = t => { t = String(t || '').trim(); return t ? t.charAt(0).toUpperCase() + t.slice(1) : t; };
function hint(id, cls, t){ const el = $(id); if (!el) return; el.className = 'hint' + (cls ? ' ' + cls : ''); el.textContent = t || ''; }

const qs = new URLSearchParams(location.search);
const FAM = String((location.pathname.match(/\/stage\/([A-Za-z0-9][A-Za-z0-9-]*)/) || [])[1] || qs.get('x') || 'brighton-stage')
  .toLowerCase().replace(/[^a-z0-9-]/g, '').slice(0, 64);
const SCREEN = document.documentElement.classList.contains('screen');
const SIZES = ['a table', 'a room', 'a hall', 'everyone'];   /* the line's four sizes (function:<stage> 1) */
let FLOOR = 10, ME = '', SIZE = '', ROOM = null, MINE = null, PAIRED = '', PAIRED_HANDS = [], HINTS = {};

/* ── the beach ── */
/* a block read straight, with the moment the beach served it (X-Pscale-Now: iso | ten-digit address | voicing) */
async function readNow(name){
  const r = await fetch(BEACH + '?block=' + encodeURIComponent(name), { headers:{ Accept:'application/json' }, cache:'no-store' });
  if (r.status !== 404 && !r.ok) throw new Error('the beach answered ' + r.status);
  const now = (r.headers.get('X-Pscale-Now') || '').split(' | ');
  return { b: r.status === 404 ? null : await r.json(), addr: /^\d{10}$/.test(now[1] || '') ? now[1] : '' };
}
async function post(body){
  const r = await fetch(BEACH, { method:'POST', cache:'no-store', headers:{ 'Content-Type':'application/json', Accept:'application/json' }, body: JSON.stringify(body) });
  let d = null; try { d = await r.json(); } catch(e){}
  return { ok: r.ok && !(d && d.error), status: r.status, code: d && d.code, error: d && (d.error || d.message) };
}
/* every mirror of a family, and its fold, as one read the site keeps a few seconds for a crowd (api/mirrors) */
async function shared(fam){
  const r = await fetch('/api/mirrors?family=' + encodeURIComponent(fam), { headers:{ Accept:'application/json' } });
  if (!r.ok) throw new Error('the stage answered ' + r.status);
  return r.json();
}
/* the stage as everyone reads it, with the person's own mirror read fresh beside it */
async function loadStage(){
  const got = await shared(FAM);
  if (ME){ try { MINE = await readNow(FAM + ':' + ME); if (MINE.b) got.mirrors[ME] = MINE.b; } catch(e){} }
  ROOM = got;
}

/* ── the lines ── */
/* every line in a mirror on the clock, with its address (the beat, then a lane beneath it), oldest first */
function linesOf(b){
  const out = [];
  (function go(n, a){
    if (n == null) return;
    if (typeof n === 'string'){ if (a.length >= FLOOR) out.push({ a, t: n }); return; }
    if (typeof n !== 'object') return;
    if (typeof n._ === 'string'){ if (a.length >= FLOOR) out.push({ a, t: n._ }); }
    else if (n._ && typeof n._ === 'object') go(n._, a + '0');
    for (let d = 1; d <= 9; d++) go(n[String(d)], a + d);
  })(b, '');
  return out.sort((x, y) => x.a < y.a ? -1 : x.a > y.a ? 1 : 0);
}
/* the line under the law's first branch, 'RECOMMEND <handle> — <size> — <why> — <how we met>', or 'WITHDRAW <handle>' */
function parseLine(t){
  const s = String(t || '').trim();
  let m = /^WITHDRAW\s+(.+?)\s*$/i.exec(s);
  if (m) return { whom: clean(m[1]), out: true };
  m = /^RECOMMEND\s+(.+?)\s+[—–-]+\s+(a table|a room|a hall|everyone)\s+[—–-]+\s+([\s\S]+)$/i.exec(s);
  if (!m) return null;
  const parts = m[3].split(/\s+[—–]\s+/);
  return { whom: clean(m[1]), size: m[2].toLowerCase(), why: (parts.length > 1 ? parts.slice(0, -1).join(' — ') : parts[0]).trim(), how: parts.length > 1 ? parts[parts.length - 1].trim() : '' };
}
/* each sayer's standing view of each person they named: their latest line about them, a WITHDRAW taking it back */
function standing(mirrors){
  const recs = [];
  Object.keys(mirrors || {}).forEach(h => {
    const last = {};
    linesOf(mirrors[h]).forEach(l => { const p = parseLine(l.t); if (p && p.whom) last[p.whom.toLowerCase()] = Object.assign({ by: h, a: l.a }, p); });
    Object.keys(last).forEach(k => { const p = last[k]; if (!p.out && p.whom.toLowerCase() !== h.toLowerCase()) recs.push(p); });
  });
  return recs.sort((x, y) => x.a < y.a ? 1 : x.a > y.a ? -1 : 0);   /* the newest first */
}
const recHTML = (r, own) => '<li><b>' + esc(r.whom) + '</b> · <span class="size">' + esc(r.size) + '</span>' +
  (own ? ' <button type="button" class="mlink" data-w="' + esc(r.whom) + '">withdraw</button>' : ' <span class="by">— ' + esc(r.by) + '</span>') +
  (r.why ? '<span class="why">' + esc(r.why) + '</span>' : '') + '</li>';

/* ── painting the stage ── */
/* THE COUNT at the bare name, at the day's address (function:<stage> 5), as it was last kept: shown line by line,
 * a line's opening before a colon as its label, so a count kept one line per size reads as rows */
function paintCount(){
  /* the day is the now's first eight digits: an address's trailing zeros only name its rung (as api/news reads a day) */
  const el = $('count'), day = ROOM && ROOM.now && /^\d{10}$/.test(String(ROOM.now.address || '')) ? String(ROOM.now.address).slice(0, 8) : '';
  const text = day && ROOM.fold ? voice(walk(ROOM.fold, day)) : null;
  if (!text){ el.innerHTML = '<p class="muted">Nobody has been counted onto a stage yet today. The count is kept at set times through the day; the recommendations stand beside it as they come.</p>'; return; }
  el.innerHTML = text.split(/\n+/).map(l => l.trim()).filter(Boolean).map(l => {
    const m = /^([^:]{1,40}):\s*([\s\S]*)$/.exec(l);
    return m ? '<div class="row"><span class="lab">' + esc(m[1]) + '</span><span>' + esc(m[2]) + '</span></div>' : '<p>' + esc(l) + '</p>';
  }).join('');
}
function paintLines(){
  const recs = standing(ROOM && ROOM.mirrors), n = SCREEN ? 8 : 12;
  $('lines').innerHTML = recs.length ? recs.slice(0, n).map(r => recHTML(r, false)).join('') : '<li class="muted">No recommendation yet.</li>';
  const known = new Set();
  recs.forEach(r => { known.add(r.whom); known.add(r.by); });
  (PAIRED_HANDS || []).forEach(h => known.add(h));
  if (ME) known.delete(ME);
  $('known').innerHTML = Array.from(known).sort().map(h => '<option value="' + esc(h) + '">').join('');
}
function paintMine(){
  const el = $('mine');
  if (!ME || !MINE || !MINE.b){ el.innerHTML = ''; return; }
  const own = standing({ [ME]: MINE.b });
  el.innerHTML = own.length ? '<h3>Your recommendations</h3><ul class="lines">' + own.map(r => recHTML(r, true)).join('') + '</ul>' : '';
  el.querySelectorAll('[data-w]').forEach(b => { b.onclick = () => say('WITHDRAW ' + b.dataset.w, 'Withdrawn: ' + b.dataset.w + '.'); });
}
async function refresh(){
  try { await loadStage(); paintCount(); paintLines(); paintMine(); hint('stageHint', '', ''); }
  catch(e){ hint('stageHint', 'err', 'Couldn’t read the stage just now: ' + e.message); }
}

/* ── saying a line ── */
/* the key this device keeps for a name, where the beach's voice looks for it: the mirror's own, else one kept for
 * another of their blocks (the room's, which gave a newcomer theirs, among them) */
function keptKey(h){
  const k = store.get('next-latch:' + FAM + ':' + h) || store.get('passport-latch:' + h) || store.get('now-latch:' + h);
  if (k) return k;
  try { for (let i = 0; i < localStorage.length; i++){ const n = localStorage.key(i); if (/^next-latch:/.test(n) && n.slice(-(h.length + 1)) === ':' + h) return localStorage.getItem(n); } } catch(e){}
  return '';
}
/* THE MIRROR, founded before its first line at the family's floor, as /walk founds one: the beach's voice founds a
 * mirror one level deep, and a line said there at a ten-digit beat lands beneath the wrong digits. Locked to the
 * person's key, the one this device keeps, else the one they give the browser, as the voice asks for it */
async function ensureMirror(h){
  const block = FAM + ':' + h;
  if ((await readNow(block)).b) return { ok: true };
  let root = 'MIRROR — ' + h + '’s recommendations on the people’s stage (spine:' + FAM + '), each at the beat it was said: who should be heard, by how many, why, and how they met. Sovereign to them; a later line about the same person is their standing view of them, and WITHDRAW takes it back. Founded from happyseaurchin.com/stage.';
  for (let i = 0; i < FLOOR; i++) root = { _: root };
  let key = keptKey(h), asked = 0, last = null;
  for (;;){
    if (!key){
      if (asked++ === 2) return last || { ok: false, quiet: true };
      const v = window.prompt((last ? 'That key is not the one ' + h + '’s words are kept under. Enter it again' : 'This puts your recommendations on the people’s stage as ' + h + ', locked to you.\nEnter your key: the one your premiere gave you, or your passport’s') + ' (kept on this device — check the first letter: phones capitalise it):');
      if (v === null || !v.trim()) return { ok: false, quiet: true };
      key = v.trim();
    }
    let w = await post({ block, content: root, new_lock: key });
    if (!w.ok && w.code === 'handle_bound') w = await post({ block, content: root, secret: key, new_lock: key });
    if (w.ok || w.code === 'confirm_required'){ store.set('next-latch:' + block, key); return { ok: true }; }
    if (!(w.code === 'lock_required' || w.code === 'handle_bound' || w.status === 403)) return w;
    last = w; key = '';
  }
}
/* where a line goes in the person's own mirror: the beat, or the next free lane beneath it (function:<stage> 1) */
function freeAt(b, addr){
  const n = walk(b, addr);
  if (n == null || n === '') return addr;
  if (typeof n === 'string') return addr + '.2';
  if (!voice(n)) return addr;
  for (let d = 2; d <= 9; d++) if (n[String(d)] == null) return addr + '.' + d;
  return null;
}
function errText(r){
  const code = r && r.code;
  if (code === 'lock_required' || code === 'handle_bound' || (r && r.status === 403)) return 'That handle’s words are kept under another key. If it is yours, try again with the key you used before.';
  return 'Not said: ' + ((r && r.error) || 'the beach did not answer') + '.';
}
async function say(line, done){
  const me = ME || clean($('me').value);
  if (!me){ hint('sayHint', 'err', 'Give your handle first: the one the room gave you.'); $('me').focus(); return false; }
  $('rec').disabled = true; hint('sayHint', '', 'Saying it on the stage…');
  try {
    const born = await ensureMirror(me);
    if (!born.ok){ hint('sayHint', born.quiet ? '' : 'err', born.quiet ? '' : errText(born)); return false; }
    const own = await readNow(FAM + ':' + me);
    const at = own.addr ? freeAt(own.b, own.addr) : null;
    if (!at){ hint('sayHint', 'err', own.addr ? 'Nine lines in this beat already: try again in a few minutes.' : 'The beach didn’t say what time it is: try again in a moment.'); return false; }
    const r = await beachVoice.say({ field: FAM, at, text: line, name: me });
    if (!r || !r.ok){ hint('sayHint', r && r.quiet ? '' : 'err', r && r.quiet ? '' : errText(r)); return false; }
    ME = me; store.set('render:who', me); paintYou();
    hint('sayHint', 'ok', done);
    await refresh();
    return true;
  } catch(e){ hint('sayHint', 'err', 'Couldn’t reach the beach: ' + e.message); return false; }
  finally { $('rec').disabled = false; }
}
let clearWhy = () => {}, clearHow = () => {};
async function recommend(){
  const me = ME || clean($('me').value), whom = clean($('whom').value), why = $('why').value.trim().replace(/\s+/g, ' '), how = $('how').value.trim().replace(/\s+/g, ' ');
  if (!whom){ hint('sayHint', 'err', 'Who should be heard? Give their handle.'); $('whom').focus(); return; }
  if (me && whom.toLowerCase() === me.toLowerCase()){ hint('sayHint', 'err', 'Nobody counts for themselves: recommend someone you met.'); return; }
  if (!SIZE){ hint('sayHint', 'err', 'Choose who should hear them: a table, a room, a hall or everyone.'); return; }
  if (!why){ hint('sayHint', 'err', 'Say why, in a sentence: what they could do for the people who would hear them.'); $('why').focus(); return; }
  if (!how){ hint('sayHint', 'err', 'Say how you met: where and when, or your ten-minutes link. A line counts only with both.'); $('how').focus(); return; }
  if (await say('RECOMMEND ' + whom + ' — ' + SIZE + ' — ' + why + ' — ' + how, 'Said: ' + whom + ', for ' + SIZE + '.')){
    $('whom').value = ''; $('why').value = ''; $('how').value = ''; clearWhy(); clearHow(); SIZE = ''; paintSizes();
  }
}

/* ── the box ── */
function paintSizes(){
  $('sizes').innerHTML = SIZES.map(s => '<button type="button" data-s="' + esc(s) + '" aria-pressed="' + (s === SIZE) + '">' + esc(s) + (HINTS[s] ? '<small>' + esc(HINTS[s]) + '</small>' : '') + '</button>').join('');
  $('sizes').querySelectorAll('button').forEach(b => { b.onclick = () => { SIZE = b.dataset.s; paintSizes(); }; });
}
function paintYou(){
  const known = !!ME;
  $('youLine').innerHTML = known ? 'Recommending as <b>' + esc(ME) + '</b> · <button type="button" class="mlink" id="notMe">not you?</button>' : '';
  $('meBox').hidden = known; $('meNote').hidden = known;
  if (known) $('notMe').onclick = () => { ME = ''; MINE = null; $('me').value = ''; paintYou(); paintMine(); $('me').focus(); };
}
/* the room a stage's law names (function:<stage> reads by a function:<room>): its people offered as names to pick */
async function loadPaired(){
  if (!PAIRED) return;
  try { const got = await shared(PAIRED); PAIRED_HANDS = Object.keys(got.mirrors || {}); paintLines(); } catch(e){}
}

/* the code a phone scans, on the big screen (vendor/qrcode.js, as stack.html and the news sheets load it) */
function paintQr(){
  const url = SITE + '/stage/' + FAM;
  $('qrUrl').textContent = url.replace(/^https?:\/\//, '');
  const s = document.createElement('script'); s.src = '/vendor/qrcode.js';
  s.onload = () => {
    const q = window.qrcode(0, 'M'); q.addData(url); q.make();
    const n = q.getModuleCount(); let d = '';
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += 'M' + c + ' ' + r + 'h1v1h-1z';
    $('qrCode').setAttribute('aria-label', 'A code for ' + url);
    $('qrCode').innerHTML = '<svg viewBox="-4 -4 ' + (n + 8) + ' ' + (n + 8) + '" shape-rendering="crispEdges" aria-hidden="true"><rect x="-4" y="-4" width="' + (n + 8) + '" height="' + (n + 8) + '" fill="#fff"/><path d="' + d + '" fill="#000"/></svg>';
  };
  document.head.appendChild(s);
}

async function init(){
  if (window.siteDoors) siteDoors({ handle: null, here: 'stage/' + FAM, site: true });
  let spine = null, op = null;
  try { [spine, op] = await Promise.all([readNow('spine:' + FAM).then(r => r.b), readNow('function:' + FAM).then(r => r.b)]); }
  catch(e){ $('xTitle').textContent = 'The beach can’t be reached just now'; $('xLede').textContent = 'The stage is read from the beach, so it needs the beach to answer. Try again in a moment.'; return; }
  if (!spine){ $('xTitle').textContent = 'No stage called “' + FAM + '” stands on the beach'; $('xLede').textContent = 'Check the name in the link.'; return; }
  FLOOR = floorOf(spine) || 10;
  /* the title is the root's opening words in capitals, the kicker what follows them, the lede the first sentence after the colon */
  const root = voice(spine) || '', c = root.indexOf(':'), head = c > 0 ? root.slice(0, c) : root;
  const caps = /^([A-Z’'][A-Z’'\s]*[A-Z’'])\b(.*)$/.exec(head);
  const title = caps ? caps[1].toLowerCase().replace(/(^|\s)\S/g, x => x.toUpperCase()) : head;
  $('xTitle').textContent = title; document.title = title;
  $('kicker').textContent = caps && caps[2].replace(/^[\s,]+/, '') ? caps[2].replace(/^[\s,]+/, '') : 'The people’s stage';
  $('xLede').textContent = c > 0 ? cap((root.slice(c + 1).match(/^[^.]*\./) || [root.slice(c + 1)])[0]) : '';
  $('barSub').textContent = ' · ' + title;
  /* the sizes' audiences, as the law's second branch says them: 'a table (about eight people, …)' */
  const sizesLaw = voice(op && op['2']) || '';
  SIZES.forEach(s => { const m = new RegExp(s.replace(' ', '\\s+') + '\\s*\\(([^)]+)\\)', 'i').exec(sizesLaw); if (m) HINTS[s] = m[1]; });
  PAIRED = ((JSON.stringify(op || {}).match(/function:[a-z0-9-]+/g) || []).map(x => x.slice(9)).find(n => n !== FAM)) || '';
  if (SCREEN){
    paintQr(); await refresh(); setInterval(refresh, 20000);
    /* a screen left showing the stage stays awake, where the browser allows it */
    if (navigator.wakeLock){ const hold = () => navigator.wakeLock.request('screen').catch(() => {}); hold(); document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') hold(); }); }
    return;
  }
  ME = clean(store.get('render:who') || '');
  $('meNote').innerHTML = 'The handle your premiere gave you, or your own on the beach. No name yet? ' +
    (PAIRED ? '<a href="/premiere/' + encodeURIComponent(PAIRED) + '">Have your premiere first</a>: it gives you a name, and a key kept on this phone.' : 'Have a premiere first: it gives you a name and a key.');
  paintYou(); paintSizes();
  clearWhy = window.keepDraft ? window.keepDraft($('why'), FAM + ':why') : clearWhy;
  clearHow = window.keepDraft ? window.keepDraft($('how'), FAM + ':how') : clearHow;
  if (window.dictate){ window.dictate($('why')); window.dictate($('how')); }
  $('say').hidden = false;
  await refresh();
  loadPaired();
}

$('rec').addEventListener('click', recommend);
$('again').addEventListener('click', () => { hint('stageHint', '', 'Reading the stage again…'); refresh(); });
init();
})();
</script>
