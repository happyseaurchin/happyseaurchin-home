<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tracks — a path drawn as parallel tracks</title>
<meta name="description" content="A project's path drawn as parallel tracks: each part a brick along its track, marked by where it stands at the last fold, read live from the beach. Tap a track to lay its parts out, tap a part to read it or to add your own word.">
<meta property="og:title" content="Tracks — a path drawn as parallel tracks">
<meta property="og:description" content="Each part a brick along its track, marked by where it stands; every person's own word beside it; the cards taken from it; read live from the beach.">
<link rel="icon" href="/assets/torus.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;500&family=Young+Serif&display=swap">
<link rel="stylesheet" href="/theme.css">
<script src="/theme.js"></script>
<style>
  /* TRACKS — a path (function:path) drawn as parallel tracks. Each first part of spine:<V>-path is a
     lane: its name on the left, its parts as parallelograms along a rail in digit order, a part's
     children smaller just after it, a ladder (a run down digit 1, function:path 1.1) one unbroken
     stretch. A brick's mark is the fold's line at that part (<V>-path, function:path 2). A tap on a
     lane lays its parts out beneath it; a tap on a part opens what it is and when it is done (the
     spine), where it stands (the fold), each hand's own word there (<V>-path:<handle>), the cards
     taken from it (ahead:<handle>, the part at the card's 5) and a box for the reader's own word,
     written into their own mirror. Nothing here is kept but on the beach; the page stores no part.
     /tracks/<project>[/<handle>] or /tracks?f=<project>. The look is David's sketch, Beach Venture
     Tracks v4 (2026-10-09, pool:weft 173 and 175); the data is the beach's. */
  :root{
    --shore:#EDF1EE; --paper:#F9FBF9; --ink:#122E2B; --muted:#56706A; --thread:#C2CFCA;
    --done:#2B8A75; --doing:#1A83A6; --blocked:#B4552A; --held:#A87D0C; --accent:#2F4FA2;
    --shadow:rgba(10,30,28,.20);
    --f-display:"Young Serif", Georgia, "Times New Roman", serif;
    --f-body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --f-mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --shore:#0E1C1B; --paper:#152826; --ink:#E1EAE6; --muted:#97ACA6; --thread:#2D4642;
      --done:#5ABDA6; --doing:#5DB7D5; --blocked:#E58C5E; --held:#E0B64A; --accent:#9FB3F1;
      --shadow:rgba(0,0,0,.55); color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --shore:#0E1C1B; --paper:#152826; --ink:#E1EAE6; --muted:#97ACA6; --thread:#2D4642;
    --done:#5ABDA6; --doing:#5DB7D5; --blocked:#E58C5E; --held:#E0B64A; --accent:#9FB3F1;
    --shadow:rgba(0,0,0,.55); color-scheme:dark;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html{scroll-padding-top:4rem}
  body{margin:0;background:var(--shore);color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.5;-webkit-font-smoothing:antialiased}
  a{color:var(--accent);text-underline-offset:2px}
  button{font:inherit}
  button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  code{font-family:var(--f-mono);font-size:.86em;color:var(--ink);overflow-wrap:anywhere}

  /* the bar every page here carries: theme.js gathers its buttons under options and adds the places */
  .bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px clamp(16px,4vw,40px);
    background:color-mix(in srgb,var(--shore) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    border-bottom:1px solid var(--thread);font-family:var(--f-mono);font-size:12px;letter-spacing:.04em;color:var(--muted)}
  .bar .dot{width:7px;height:7px;border-radius:50%;background:var(--doing);flex:none}
  .bar b{color:var(--ink);font-weight:500}
  .bar .bar-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar .spacer{flex:1}
  .bar button{background:none;border:1px solid var(--thread);border-radius:4px;color:var(--muted);font-family:var(--f-mono);font-size:12px;padding:6px 10px;cursor:pointer}
  .bar button:hover{color:var(--ink);border-color:var(--ink)}

  .wrap{max-width:1180px;margin-inline:auto;display:grid;gap:2rem;padding:clamp(20px,4vw,40px) clamp(16px,4vw,40px)}

  /* header */
  .eyebrow{margin:0 0 .45rem;font-family:var(--f-mono);font-size:.76rem;letter-spacing:.04em;color:var(--muted)}
  h1{font-family:var(--f-display);font-weight:400;font-size:clamp(2rem,5vw,3.2rem);line-height:1.05;margin:0;text-wrap:balance}
  .lede{max-width:62ch;margin:.8rem 0 0}
  .whole{max-width:66ch;margin:.2rem 0 0;padding:.55rem .85rem;border-left:3px solid var(--doing);background:color-mix(in srgb,var(--doing) 7%,transparent);border-radius:0 8px 8px 0}
  .whole summary{cursor:pointer;list-style:none}
  .whole summary::-webkit-details-marker{display:none}
  .whole summary .k{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-right:.4rem}
  .whole summary .more{color:var(--accent);font-size:.88rem;white-space:nowrap}
  .whole[open] summary .more{display:none}
  .whole p{margin:.45rem 0 0}
  .stamp{margin:.7rem 0 0;color:var(--muted);font-size:.9rem}
  .stamp .addr{color:var(--ink);font-family:var(--f-mono);font-variant-numeric:tabular-nums;margin-right:.35rem}

  /* status vocabulary: colour and form together */
  [data-s="done"]{--c:var(--done)}
  [data-s="doing"]{--c:var(--doing)}
  [data-s="next"],[data-s="other"]{--c:var(--ink)}
  [data-s="blocked"]{--c:var(--blocked)}
  [data-s="none"]{--c:var(--muted)}
  [data-s="held"]{--c:var(--held)}

  /* the parallelogram brick, at three sizes in a lane and a mini in the key and the chips */
  .pg{--bw:clamp(1.5rem,4.6vw,3.4rem);position:relative;display:inline-block;flex:0 1 auto;width:var(--bw);min-width:4px;height:1.75rem;margin-left:.32rem;
    transform:skewX(-20deg);border:1.5px solid var(--c);border-radius:2px;background:var(--c);z-index:1}
  .pg.join{margin-left:-1.5px}
  .pg[data-s="doing"]{background:linear-gradient(90deg,var(--c) 50%,var(--paper) 50%)}
  .pg[data-s="next"],.pg[data-s="other"]{background:var(--paper)}
  .pg[data-s="none"]{background:var(--paper);border-style:dashed}
  .pg[data-s="blocked"]::after{content:"";position:absolute;left:22%;right:22%;top:50%;height:2px;margin-top:-1px;border-radius:1px;background:var(--shore)}
  .pg.kid{--bw:clamp(1.1rem,3.2vw,2.3rem);height:1.2rem}
  .pg.kid2{--bw:clamp(.8rem,2.3vw,1.6rem);height:.95rem}
  .pg[data-s="held"]{flex:none;width:.8rem;height:.8rem;transform:rotate(45deg);border-radius:1px}
  .pg.mini{flex:none;width:.95rem;height:.8rem;margin-left:0}
  .pg.mini[data-s="held"]{width:.62rem;height:.62rem}
  .pg.mini[data-s="blocked"]::after{height:1.5px;margin-top:-.75px;left:18%;right:18%}
  /* waits on someone: a dot over the brick, on while that person's switch is on */
  .pg.waiting::before{content:"";position:absolute;top:-.6rem;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--blocked);transform:skewX(20deg)}

  /* key and switches */
  .board{display:grid;gap:1rem}
  .legend{display:flex;flex-wrap:wrap;gap:.5rem 1.1rem;font-size:.88rem;align-items:center}
  .legend .item{display:inline-flex;align-items:center;gap:.5rem}
  .legend .n{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
  .toggle{display:inline-flex;align-items:center;gap:.45rem;border:1px solid var(--thread);background:transparent;color:var(--ink);border-radius:999px;padding:.3rem .8rem;cursor:pointer;font-size:.88rem}
  .toggle .dotr{width:8px;height:8px;border-radius:50%;background:var(--blocked)}
  .wait-pill[aria-pressed="true"]{border-color:var(--blocked);background:color-mix(in srgb,var(--blocked) 12%,transparent)}
  #num-toggle[aria-pressed="true"]{border-color:var(--ink);background:color-mix(in srgb,var(--ink) 8%,transparent)}
  body:not(.nums) .addr,body:not(.nums) .addr-ref{display:none}
  .board-note{margin:0;max-width:66ch}

  /* the lanes */
  .tracks{list-style:none;margin:0;padding:0;border-bottom:1px solid var(--thread)}
  .track{border-top:1px solid var(--thread)}
  .row{display:grid;grid-template-columns:minmax(6.4rem,11.5rem) minmax(0,1fr);align-items:center;gap:.9rem;width:100%;padding:.55rem .4rem;border:0;background:transparent;color:var(--ink);text-align:left;cursor:pointer}
  .row:hover{background:color-mix(in srgb,var(--ink) 4%,transparent)}
  .row[aria-expanded="true"]{background:var(--paper)}
  .tname{font-family:var(--f-display);font-size:1.08rem;line-height:1.2;text-wrap:balance;display:flex;align-items:center;gap:.5rem;min-width:0}
  .tname .caret{font-family:var(--f-body);font-size:.8rem;color:var(--muted);transition:transform .2s ease;flex:none}
  .tname .addr{font-family:var(--f-mono);font-size:.74rem;color:var(--muted);flex:none}
  .row[aria-expanded="true"] .caret{transform:rotate(90deg)}
  /* room at both ends for the slant of the first and last brick, so a full lane is never clipped */
  .lane{position:relative;display:flex;align-items:center;min-width:0;padding-block:.7rem;padding-left:.15rem;padding-right:.7rem;overflow:hidden}
  .lane::before{content:"";position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;border-radius:1px;background:var(--thread)}
  .heldtag{position:relative;z-index:1;flex:none;display:inline-flex;align-items:center;gap:.35rem;margin-left:.6rem;padding:.08rem .45rem .08rem .4rem;border-radius:999px;background:var(--shore);
    border:1px solid color-mix(in srgb,var(--held) 55%,var(--thread));font-family:var(--f-mono);font-size:.7rem;color:var(--ink);white-space:nowrap}
  .row[aria-expanded="true"] .heldtag{background:var(--paper)}
  .heldtag .pg{width:.55rem;height:.55rem;margin-left:0}
  /* a part and what is inside it, on one underlay: the small bricks belong to the part they follow */
  .grp{position:relative;z-index:1;display:inline-flex;align-items:center;flex:0 1 auto;min-width:0;margin-left:.32rem;padding:.26rem .36rem;border-radius:7px;
    background:color-mix(in srgb,var(--ink) 8%,var(--shore));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ink) 12%,transparent)}
  .row[aria-expanded="true"] .grp{background:color-mix(in srgb,var(--ink) 7%,var(--paper))}
  .grp > .pg:first-child{margin-left:0}

  /* a lane's line, opened beneath it */
  .line{background:var(--paper);padding:.2rem clamp(.6rem,2.5vw,1.4rem) 1.3rem;display:grid;gap:.9rem;overflow:hidden}
  .line:not([hidden]){animation:open .2s ease-out}
  @keyframes open{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
  .tline{margin:0;color:var(--muted);max-width:66ch}
  .tstand{margin:0;max-width:66ch;font-size:.95rem}
  .tstand .chip{margin-right:.4rem}
  .linkish{border:0;background:none;padding:0;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:2px;font-size:.9rem}
  .tiles{list-style:none;margin:0;padding:0 .6rem;display:flex;flex-wrap:wrap;gap:.7rem .8rem}
  .tiles li{display:flex;align-items:center;min-width:0}
  /* each part a column; what is inside it hangs beneath on a thread, deeper by its depth */
  .tiles.tree{align-items:flex-start;gap:1rem 1.1rem}
  .tiles.tree > li.col{flex-direction:column;align-items:flex-start;gap:.45rem}
  .headrow{display:flex;align-items:center;gap:.35rem;min-width:0}
  .conn{color:var(--muted);font-family:var(--f-mono)}
  .hang{list-style:none;margin:0 0 0 .75rem;padding:.15rem 0 .1rem .85rem;border-left:2px solid color-mix(in srgb,var(--ink) 16%,transparent);display:grid;gap:.4rem;justify-items:start}
  .hang.flat{margin:0 .6rem;border-left-color:color-mix(in srgb,var(--held) 55%,transparent)}
  .hang li{display:flex;align-items:center;min-width:0}
  .hang li.lv2{margin-left:1rem}
  .hang li.lv3{margin-left:2rem}
  .hang li.step::before{content:"↓";color:var(--muted);font-family:var(--f-mono);font-size:.78rem;margin-right:.35rem}
  .cardchip{display:inline-flex;align-items:center;gap:.45rem;max-width:19rem;border:1px dashed color-mix(in srgb,var(--held) 65%,var(--thread));background:color-mix(in srgb,var(--held) 9%,var(--paper));
    color:var(--ink);border-radius:999px;padding:.24rem .7rem .24rem .55rem;font-size:.84rem;text-align:left;cursor:pointer}
  .cardchip:hover{border-style:solid}
  .cardchip .who{font-family:var(--f-mono);font-size:.68rem;color:var(--muted);white-space:nowrap}
  .cardchip.on{box-shadow:0 0 0 2px var(--accent)}
  .tile{transform:skewX(-14deg);border:1.5px solid color-mix(in srgb,var(--c,var(--thread)) 55%,var(--thread));background:color-mix(in srgb,var(--c,var(--thread)) 11%,var(--paper));
    color:var(--ink);border-radius:3px;padding:.6rem 1.05rem;min-width:8.6rem;max-width:22rem;cursor:pointer;text-align:left;transition:border-color .15s,box-shadow .15s}
  .tile:hover{border-color:var(--c,var(--ink))}
  .tile .in{transform:skewX(14deg);display:flex;align-items:center;gap:.55rem}
  .tile .addr{font-family:var(--f-mono);font-size:.74rem;color:var(--muted);font-variant-numeric:tabular-nums}
  .tile .tt{font-size:.95rem;line-height:1.25}
  .tile .who{font-family:var(--f-mono);font-size:.68rem;color:var(--muted)}
  .tile[data-s="next"],.tile[data-s="other"]{background:var(--paper)}
  .tile[data-s="none"]{border-style:dashed;background:transparent}
  .tile.small{min-width:7rem;padding:.45rem .85rem}
  .tile.small .tt{font-size:.88rem}
  .tile.on{box-shadow:0 0 0 2px var(--accent)}
  .tile.waiting{box-shadow:0 0 0 1.5px var(--blocked)}
  .tile.waiting.on{box-shadow:0 0 0 2px var(--accent)}

  /* chips */
  .chip{display:inline-flex;align-items:center;gap:.4rem;font-family:var(--f-mono);font-size:.72rem;padding:.08rem .5rem;border-radius:999px;border:1px solid color-mix(in srgb,var(--c) 50%,transparent);color:var(--ink);white-space:nowrap;vertical-align:.1em}

  /* where things live */
  .where{border-top:1px solid var(--thread);padding-top:1.4rem}
  .where h2{font-family:var(--f-display);font-weight:400;font-size:1.35rem;margin:0 0 .9rem}
  .where dl{display:grid;grid-template-columns:minmax(0,13rem) minmax(0,1fr);gap:.75rem 1.5rem;margin:0}
  .where dt{font-weight:700}
  .where dd{margin:0;max-width:66ch}
  .foot{font-size:.9rem;color:var(--muted);display:grid;gap:.6rem}
  .foot p{margin:0;max-width:70ch}
  .foot .links{display:flex;flex-wrap:wrap;gap:.4rem 1.2rem}

  /* the reading sheet */
  .sheet{position:fixed;z-index:30;background:var(--paper);color:var(--ink);border:1px solid var(--thread);box-shadow:0 18px 48px var(--shadow);overflow:auto;padding:1.1rem 1.25rem 1.4rem}
  .sheet:not([hidden]){animation:rise .2s ease-out}
  @keyframes rise{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
  .sheet-top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem}
  .sheet .addrline{font-family:var(--f-mono);font-size:.76rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:.4rem .6rem;align-items:center}
  .sheet-acts{display:flex;gap:.4rem;flex:none}
  .close,.navb{border:1px solid var(--thread);background:transparent;color:var(--ink);border-radius:999px;padding:.3rem .8rem;cursor:pointer;flex:none}
  .navb{padding:.3rem .65rem;font-family:var(--f-mono)}
  .close:hover,.navb:hover{border-color:var(--ink)}
  .navb:disabled{opacity:.35;cursor:default;border-color:var(--thread)}
  .sheet h3{font-family:var(--f-display);font-weight:400;font-size:1.55rem;line-height:1.15;margin:.55rem 0 .15rem;text-wrap:balance}
  .sheet .track-of{margin:0;font-size:.85rem;color:var(--muted)}
  .sheet .track-of .linkish{font-size:.85rem}
  .sheet section{margin-top:1rem}
  .sheet h4{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 .25rem;font-weight:700}
  .sheet p{margin:0;max-width:60ch}
  .refs{font-family:var(--f-mono);font-size:.74rem;color:var(--muted);margin-top:1rem!important;overflow-wrap:anywhere}
  .note{margin-top:1rem;padding:.7rem .9rem;border-left:3px solid var(--c,var(--thread));background:color-mix(in srgb,var(--c,var(--thread)) 9%,transparent)}
  .note p + p{margin-top:.45rem}
  .stands .chip{margin-right:.4rem}
  .stands .when{display:block;margin-top:.25rem;font-size:.8rem;color:var(--muted)}
  .readings,.cards{list-style:none;margin:0;padding:0;display:grid;gap:.5rem}
  .readings li,.cards li{padding:.5rem .7rem .55rem;border-left:2px solid var(--thread);background:color-mix(in srgb,var(--ink) 4%,transparent);border-radius:0 6px 6px 0}
  .readings li .chip{margin-right:.4rem}
  .cards li{border-left-color:color-mix(in srgb,var(--held) 60%,var(--thread))}
  .readings .who,.cards .who{display:flex;flex-wrap:wrap;gap:.2rem .7rem;margin-top:.3rem;font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
  .readings .who b,.cards .who b{color:var(--ink);font-weight:500}
  .empty{color:var(--muted);font-style:italic;margin:0}
  .inside-list{list-style:none;margin:0;padding:0;display:grid;gap:.3rem}
  .linkrow{display:flex;align-items:center;gap:.55rem;width:100%;text-align:left;border:1px solid var(--thread);background:transparent;color:var(--ink);border-radius:8px;padding:.4rem .65rem;cursor:pointer}
  .linkrow:hover{border-color:var(--ink)}
  .linkrow .mk{margin-left:auto;font-family:var(--f-mono);font-size:.72rem;color:var(--muted);white-space:nowrap}
  .sheet .go{margin-top:1.1rem;display:flex;flex-wrap:wrap;gap:.4rem 1rem;font-size:.92rem}

  /* your own word, into your own mirror */
  .say{margin-top:1.3rem!important;padding-top:1rem;border-top:1px solid var(--thread);display:grid;gap:.55rem}
  .say h4{margin:0}
  .marks{display:flex;flex-wrap:wrap;gap:.4rem}
  .marks button{display:inline-flex;align-items:center;gap:.35rem;border:1px solid color-mix(in srgb,var(--c) 55%,var(--thread));background:transparent;color:var(--ink);border-radius:999px;padding:.22rem .7rem;cursor:pointer;font-size:.85rem}
  .marks button[aria-pressed="true"]{background:color-mix(in srgb,var(--c) 22%,var(--paper));border-color:var(--c)}
  .say-box{position:relative}
  .say textarea{display:block;width:100%;min-height:5.5rem;font:inherit;padding:.55rem .7rem;border:1px solid var(--thread);border-radius:8px;background:var(--shore);color:var(--ink);resize:vertical}
  .say .row2{display:flex;flex-wrap:wrap;gap:.5rem}
  .say input{flex:1 1 8rem;min-width:0;font:inherit;padding:.48rem .65rem;border:1px solid var(--thread);border-radius:8px;background:var(--shore);color:var(--ink)}
  .btn{border:1px solid var(--accent);background:var(--accent);color:var(--paper);border-radius:999px;padding:.45rem 1rem;cursor:pointer;flex:none}
  .btn:disabled{opacity:.5;cursor:default}
  .hint{font-size:.86rem;color:var(--muted);margin:0}
  .hint.err{color:var(--blocked)}
  .hint.ok{color:var(--done)}

  @media (min-width:900px){
    /* below the bar, so its options and places stay in reach while a part is open */
    .sheet{top:calc(env(safe-area-inset-top,0px) + 64px);right:16px;bottom:16px;width:min(26rem,38vw);border-radius:14px}
    body.sheet-open .wrap{padding-right:calc(min(26rem,38vw) + 40px)}
    .pg{height:1.95rem}
    .pg.kid{height:1.3rem}
    .pg.kid2{height:1rem}
  }
  @media (max-width:899.98px){
    .sheet{left:0;right:0;bottom:0;max-height:74vh;border-radius:14px 14px 0 0;padding-bottom:calc(1.4rem + env(safe-area-inset-bottom,0px))}
    body.sheet-open .wrap{padding-bottom:76vh}
  }
  @media (max-width:720px){
    .where dl{grid-template-columns:minmax(0,1fr);gap:.2rem}
    .where dd{margin-bottom:.7rem}
    .tname{font-size:1rem}
    .row{gap:.6rem;padding-inline:.2rem;grid-template-columns:8rem minmax(0,1fr)}
    .pg{--bw:clamp(1.2rem,4.6vw,3.4rem)}
    .pg.kid{--bw:clamp(.9rem,3.2vw,2.3rem)}
    .heldtag{margin-left:.35rem;padding-inline:.35rem}
    .heldtag .dw{display:none}
    .tile{min-width:8.2rem;padding:.55rem .9rem}
  }
  @media (prefers-reduced-motion:reduce){

/* ── a part: its words (the spine), where it stands (the fold), whose word (the mirrors), whose card (the hands) ── */

/* the deepest node the mirror already holds on the way to the address decides the write: a string
 * written at an existing node is its line; a missing branch is written whole from the last node that
 * stands; a line standing where a branch must grow is kept as that branch's own line, never lost */
async function writeWord(addr, line, name, secret){
  const block = FAMILY + ':' + name;
  let mirror = await readBlock(block);
  if (mirror !== null && typeof mirror !== 'object') return { ok: false, status: 0, data: { error: block + ' is not a block this page can write into' } };
  if (!mirror){
    let root = 'MIRROR — ' + name + '’s readings on the ' + FAMILY + ' field (spine:' + FAMILY + '), at the spine’s own addresses, in own words, revisable forever. Sovereign; silence at an address is honest absence. First entry written from /tracks.';
    for (let i = 0; i < FLOOR; i++) root = { '_': root };
    const born = await post({ block, new_lock: secret, content: root });
    if (!born.ok) return born;
    mirror = root;
  }
  const ds = String(addr).split('');
  let node = mirror, depth = 0;
  while (depth < ds.length && node[ds[depth]] && typeof node[ds[depth]] === 'object'){ node = node[ds[depth]]; depth++; }
  if (depth === ds.length) return post({ block, spindle: addr, content: line, secret });
  const there = node[ds[depth]], rest = ds.slice(depth + 1);
  if (!rest.length) return post({ block, spindle: addr, content: line, secret });
  let content = line;
  for (let i = rest.length - 1; i >= 0; i--) content = { [rest[i]]: content };
  if (typeof there === 'string' && there.trim()) content['_'] = there;
  return post({ block, spindle: ds.slice(0, depth + 1).join(''), content, secret });
}
async function sendWord(addr){
  const hint = $('say-hint'), send = $('say-send');
  const say = (cls, t) => { hint.className = 'hint' + (cls ? ' ' + cls : ''); hint.textContent = t; };
  let text = $('say-text').value.trim().replace(/\s+/g, ' ');
  if (!text){ $('say-text').focus(); return; }
  const name = clean($('say-who').value);
  if (!name || name.length > 32){ say('err', 'Your name, up to 32 letters, digits, spaces, - or _: it is how your word is signed.'); $('say-who').focus(); return; }
  const block = FAMILY + ':' + name;
  const secret = $('say-key').value.trim() || latchFor(block, name);
  if (!secret){ say('err', 'Your key: the one your passport uses, or, with no passport yet, one you invent. It keeps your words yours.'); $('say-key').focus(); return; }
  const m = MARK_RE.exec(text);
  if (MARK && !(m && WORDS().indexOf(m[1]) >= 0)) text = MARK + ' — ' + text;
  send.disabled = true;
  say('', 'putting it beside the part…');
  try {
    const w = await writeWord(addr, text, name, secret);
    if (!w.ok){ say('err', refusal(w)); send.disabled = false; return; }
    store.set('next-latch:' + block, secret);
    store.set('venture:who', name);
    if (!store.get('render:who')) store.set('render:who', name);
    clearDraft();
    await reload(addr);
    const h2 = $('say-hint');
    if (h2){ h2.className = 'hint ok'; h2.textContent = 'It stands beside the part in your name. Writing again here replaces it; the next fold reads it.'; }
  } catch(e){ say('err', 'Could not put that on the beach: ' + e.message); send.disabled = false; }
}

/* ── where each thing lives — named from the family, so any path draws its own ── */
function drawWhere(){
  const code = name => '<a href="' + RENDER + encodeURIComponent(name) + '" target="_blank" rel="noopener"><code>' + esc(name) + '</code></a>';
  const codeT = name => '<code>' + esc(name) + '</code>';
  const hands = MIRRORS.map(m => '<span data-name="' + esc(m.who) + '">' + esc(m.who) + '</span>').join(', ');
  const rowsW = [
    ['The parts', code('spine:' + FAMILY) + ', written by the project’s designers: each part says what it is and when it is done, and never where it stands. Anyone else proposes a part in their own ' + codeT('spine:' + FAMILY + ':‹handle›') + ', and the designers adopt it or not.'],
    ['Where each part stands', (HAS.has(FAMILY) ? code(FAMILY) : codeT(FAMILY)) + ', folded once a day from what was done: one line per part, opening DONE, DOING, BLOCKED or NEXT, with its pointer; its first line says when it was last folded, and by whom.' + (touched(FAMILY) ? ' Last written ' + esc(when(touched(FAMILY))) + '.' : ' Not folded yet.')],
    ['Each person’s word', 'Their own mirror, ' + codeT(FAMILY + ':‹handle›') + ', at the part’s address, opening DONE, DOING, BLOCKED or OFFER' + (MAKE ? ' (or WANT, on a thing made together)' : '') + '. The box under every part writes it, signed with your key; the fold reads it.' + (hands ? ' Mirrors here now: ' + hands + '.' : '')],
    ['What each person holds', 'Their hand, ' + codeT('ahead:‹handle›') + ', shown on <a href="/next">/next</a>. A card taken from a part names that part, and lands on the clock when it is done.'],
    ['Waits on', 'A part whose fold line is BLOCKED and points at someone’s hand, ' + codeT('[ahead:‹handle›]') + ', or with a card taken from it still open in that hand. The switch above dots them.']
  ];
  if (!OWN && HAS.has('spine:' + PROJECT)) rowsW.push(['When things happen', 'The clock, ' + code('spine:' + PROJECT) + ', walked at <a href="/walk/' + encodeURIComponent(PROJECT) + '">/walk/' + esc(PROJECT) + '</a>.']);
  rowsW.push(['The law', (LAW ? code('function:' + FAMILY) : codeT('function:' + FAMILY)) + ', on the form ' + code(MAKE ? 'function:make' : 'function:path') + ': how the parts are written and how each day’s work is folded onto them.']);
  $('where').innerHTML = rowsW.map(r => '<dt>' + esc(r[0]) + '</dt><dd>' + r[1] + '</dd>').join('');
  $('where-s').hidden = false;
}
function drawFoot(){
  const hand = HANDLE ? '/next/' + encodeURIComponent(HANDLE) : '/next';
  $('foot').innerHTML = '<p>Read live from the beach each time the page opens, and written only into the reader’s own mirror. The parts are never edited here.</p>' +
    '<div class="links"><a href="' + esc(pathPage()) + '">The path, part by part →</a>' +
    (!OWN && HAS.has('spine:' + PROJECT) ? '<a href="/walk/' + encodeURIComponent(PROJECT) + (HANDLE ? '/' + encodeURIComponent(HANDLE) : '') + '">The clock, walked →</a>' : '') +
    '<a href="' + esc(hand) + '">' + (HANDLE ? esc(HANDLE) + '’s hand' : 'Your hand') + ' →</a></div>';
}
function render(){
  buildModel();
  const keep = OPEN;
  OPEN = null;
  drawHead(); drawLegend(); drawTracks(); drawWhere(); drawFoot();
  if (keep && rows[keep]) toggle(keep, true);
  document.body.classList.toggle('nums', NUMS);
  applyWait();
}
/* a blip on the way to the beach is not an answer from it: the read is tried again, twice, before the page says so */
async function loadSoon(){
  for (let i = 0; ; i++){
    try { return await load(); }
    catch(e){ if (i >= 2) throw e; await new Promise(r => setTimeout(r, 1200 * (i + 1))); }
  }
}
async function reload(addr){
  await loadSoon();
  render();
  if (addr) goPart(addr);
}
function note(html){ const n = $('board-note'); n.innerHTML = html; n.hidden = false; $('legend').textContent = ''; }

document.body.classList.toggle('nums', NUMS);
loadSoon().then(() => {
  if (!FAMILY){
    $('title').textContent = 'Tracks';
    $('lede').textContent = 'A project’s path drawn as parallel tracks: each part a brick along its track, marked by where it stands.';
    note('No path called <b>' + esc(WANT) + '</b> stands on the beach yet. A path’s parts live at <code>spine:‹project›-path</code> (<a href="' + RENDER + 'function%3Apath" target="_blank" rel="noopener">function:path</a>). The beach venture’s does: <a href="/tracks/beach-venture">/tracks/beach-venture</a>.');
    return;
  }
  if (NOTPATH){
    $('title').textContent = WANT;
    $('lede').textContent = 'This family is not a path, so it is not drawn as tracks.';
    const where = NOTPATH === 'meeting' ? '<a href="/ring/' + encodeURIComponent(WANT) + '">/ring/' + esc(WANT) + '</a>' : '<a href="/walk/' + encodeURIComponent(WANT) + '">/walk/' + esc(WANT) + '</a>';
    note('<b>' + esc(WANT) + '</b> is ' + (NOTPATH === 'clock' ? 'a clock' : NOTPATH === 'missing' ? 'a family with no spine to read' : 'a ' + esc(NOTPATH)) + ', read at ' + where + '. Tracks draw a path: the parts of what a project makes, beside its clock.');
    return;
  }
  render();
  const want = canon(decodeURIComponent((location.hash || '').slice(1)));
  if (want && rows[want.charAt(0)]){
    toggle(want.charAt(0), true);
    if (want.length > 1 && ORDER.indexOf(want) >= 0) goPart(want);
  }
  if (window.nameLinks) window.nameLinks(document.body, { watch: true, blocks: Array.from(HAS) });
}).catch(e => { note(esc('Couldn’t read the beach: ' + e.message)); });

if (window.siteDoors) window.siteDoors({ handle: HANDLE, family: WANT, here: 'tracks', site: true });
})();
</script>
