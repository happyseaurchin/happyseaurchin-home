/* Layout: a mounted plate of the shore (sky on the real sun, the venture's parts as a cloud-pruned pine, its roots in a soil cut) beside a field journal of what moved since you last looked. */

}

  --done:#6FB59B; --doing:#A9CF6E; --next:#B9CDB9; --blocked:#E3A07E; --bare:#7F8C8E;
  --neptune:#C2A4DF; --weft:#7CCBC0; --keel:#8FB6E0; --ghost:#7F8C8E; --plate-bg:#1B3B44;
  --plate-shadow:0 24px 50px -26px rgba(0,0,0,.75), 0 3px 10px rgba(0,0,0,.3); color-scheme:dark }}
:root[data-theme="dark"]{
  --page:#12282F; --ink:#E2EDEB; --ink-soft:#A5BDBF; --line:#2F4C54; --paper:#17333B; --accent:#7CCBC0; --glow:#F0D07A;
  --done:#6FB59B; --doing:#A9CF6E; --next:#B9CDB9; --blocked:#E3A07E; --bare:#7F8C8E;
  --neptune:#C2A4DF; --weft:#7CCBC0; --keel:#8FB6E0; --ghost:#7F8C8E; --plate-bg:#1B3B44;

.meta{display:flex;flex-direction:column;align-items:flex-end;gap:9px}
@media (max-width:700px){.meta{align-items:flex-start}}
.status{margin:0;font-size:14.5px;color:var(--ink-soft);display:flex;align-items:center;gap:9px;max-width:66ch}
.status .dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--ghost)}

@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

.pill{font-size:13.5px;line-height:1;background:transparent;border:1px solid var(--line);border-radius:999px;padding:7px 13px;cursor:pointer;color:var(--ink)}

/* the plate */
.plate{position:relative;width:min(100%, max(460px, calc(100vh - 160px)));max-width:100%;aspect-ratio:1/1;border-radius:22px;overflow:hidden;background:var(--plate-bg);box-shadow:var(--plate-shadow);isolation:isolate;touch-action:manipulation}

.grain{position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:.2;background-size:200px 200px}

.lab{position:absolute;pointer-events:auto;background:none;border:0;padding:2px 5px;margin:0;cursor:pointer;white-space:nowrap;
  font:italic 400 15.5px/1.15 var(--serif);color:var(--plate-ink);letter-spacing:.005em;
  text-shadow:0 0 2px var(--plate-halo),0 0 5px var(--plate-halo),0 0 9px var(--plate-halo);
  transform:translate(calc(-50% + var(--dx, 0px)), calc(-100% + var(--dy, 0px)));transition:opacity .4s}
.lab.a-start{transform:translate(var(--dx, 0px), calc(-100% + var(--dy, 0px)))}
.lab.a-end{transform:translate(calc(-100% + var(--dx, 0px)), calc(-100% + var(--dy, 0px)))}
.lab.a-under{transform:translate(calc(-50% + var(--dx, 0px)), var(--dy, 0px))}
.lab.child{font-size:13.5px}
.lab.mind{font-size:12.5px;font-weight:500}
.lab.ghost{font-size:12px;opacity:.85}
.lab .lg{display:inline-block;width:9px;height:9px;margin-right:5px;border-radius:0 70% 0 70%;transform:translateY(0) rotate(-8deg);box-shadow:0 0 0 1px rgba(255,255,255,.35)}
.lab .num{font:normal 400 11px/1 var(--mono);margin-right:5px;opacity:.85}
body:not(.addr) .lab .num{display:none}
.lab:hover{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
@media (max-width:620px){.lab{font-size:13px}.lab.child{font-size:12px}.lab.mind,.lab.ghost{font-size:11px}}
.tip{position:absolute;pointer-events:none;z-index:3;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:6px 10px 7px;font-size:14px;line-height:1.3;box-shadow:0 10px 24px -12px rgba(0,0,0,.4);transform:translate(-50%, calc(-100% - 12px));max-width:240px;white-space:normal}
.tip b{font-weight:500;display:block}.tip i{color:var(--ink-soft)}
.whole{position:absolute;z-index:3;top:calc(12px + env(safe-area-inset-top, 0px));right:12px;background:var(--paper)}

/* svg pieces */
.pad,.tier,.rootg,.nod,.sap,.bird{cursor:pointer}
.tier,.rootg,#sapling,#birds .bird{transition:opacity .55s ease}
.dimmed{opacity:.3}
.pad:hover>.body{filter:brightness(1.1) saturate(1.06)}
.ring{fill:none;stroke:#F6D77E;stroke-width:2.4;stroke-dasharray:5 4;opacity:0;transition:opacity .35s}
.sel>.ring{opacity:1}
.moved{transform-box:fill-box;transform-origin:center;animation:breathe 3.4s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.6;transform:scale(.97)}50%{opacity:1;transform:scale(1.03)}}
.spark{transform-box:fill-box;transform-origin:center;animation:spark 2.4s ease-in-out infinite}
@keyframes spark{0%,100%{opacity:.15;transform:scale(.55)}50%{opacity:1;transform:scale(1.1)}}
.tier.deep>.pad{opacity:.3;transition:opacity .5s}
.wave{animation:drift linear infinite}
@keyframes drift{to{stroke-dashoffset:-240}}
.foam{animation:wash 9s ease-in-out infinite}
.foam.f2{animation-delay:-4.5s}
@keyframes wash{0%,100%{transform:translateY(0);opacity:.85}50%{transform:translateY(5px);opacity:.45}}
.glit{animation:glit 2.6s steps(2,end) infinite}
@keyframes glit{50%{opacity:.25}}
.star{animation:twinkle 3.6s ease-in-out infinite alternate}
@keyframes twinkle{to{opacity:.25}}
.cloud{animation:cloud 150s ease-in-out infinite alternate}
@keyframes cloud{to{transform:translateX(46px)}}
.grass{transform-box:fill-box;transform-origin:50% 100%;animation:sway 7s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-2deg)}to{transform:rotate(2.5deg)}}
.bird.live .bob{transform-box:fill-box;transform-origin:50% 100%;animation:bob 5.2s ease-in-out infinite}
@keyframes bob{0%,82%,100%{transform:translateY(0) rotate(0)}88%{transform:translateY(-2px) rotate(-4deg)}94%{transform:translateY(0) rotate(2deg)}}
.song path{opacity:0;animation:song 3.4s ease-out infinite}
.song path:nth-child(2){animation-delay:.25s}.song path:nth-child(3){animation-delay:.5s}
@keyframes song{0%{opacity:0}20%{opacity:.9}60%{opacity:0}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}.song path{opacity:.7}}

.row .t{font-weight:500}

.link:hover{text-decoration:underline;text-underline-offset:3px}
.cap{font-size:13.5px;color:var(--ink-soft);font-style:italic;margin-top:8px}
.ref{font-family:var(--mono);font-size:.74em;color:var(--ink-soft);word-break:break-word}
.num{font-family:var(--mono);font-size:.78em;color:var(--ink-soft);margin-right:.45em;font-style:normal}
body:not(.addr) .ref, body:not(.addr) .num{display:none}
.back{align-self:flex-start;text-align:left;background:none;border:0;padding:0;cursor:pointer;color:var(--accent);font-size:15px}
.back:hover{text-decoration:underline;text-underline-offset:3px}
.crumb{font-size:14.5px;color:var(--ink-soft);font-style:italic;margin-top:14px;display:flex;flex-wrap:wrap;gap:4px 6px}
.crumb button{background:none;border:0;padding:0;cursor:pointer;color:var(--ink-soft);font-style:italic}
.crumb button:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.ptitle{font-size:34px;font-style:italic;font-weight:400;line-height:1.08;margin:4px 0 12px;letter-spacing:-.01em;text-wrap:balance;font-variation-settings:"opsz" 60}
.stage{display:inline-flex;align-items:center;gap:8px;font-size:14.5px;padding:4px 12px 4px 9px;border-radius:999px;border:1px solid var(--line);background:var(--paper)}
.stage span{color:var(--ink-soft);font-style:italic}
.h3{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--ink-soft);margin:20px 0 6px;font-weight:500}
.body{font-size:16px;line-height:1.55;margin:0}

<script>
const SNAP = {"taken":"2026-10-14T15:19Z","spine":{"_":"THE BEACH — what the beach venture makes, as its parts: a federated surface of semantic-number blocks where people and their AIs keep shells, coordinate and play, walked by one verb. Eight parts below, each spreading into what it is made of; where each stands now is the fold [beach-venture-path], folded each evening from the venture's clock [spine:beach-venture] under its law [function:beach-venture-path, function:path]. Re-cut 2026-10-06 from the beach-wide tree of the day before, set aside the same day [archive:spine:paths:2026-10-06].","1":{"_":"THE SUBSTRATE — semantic numbers, the block and its verb, and the beaches that serve them: the physics everything else stands on.","1":{"_":"THE BLOCK — pscale JSON, where depth is scale and the address is the meaning: the floor, growth by supernest, the fold of an accumulator [sunstone, whetstone]."},"2":{"_":"THE WALKER — one verb, bsp(), its shape read from the address and the pscale, strict at both ends of the wire [src/bsp.ts, the 72-case battery]."},"3":{"_":"THE BEACHES — any origin that serves blocks to all, keeps an edit-latch per position and is private only by encryption; federated, so anyone can host one [pscale-beach; beach.happyseaurchin.com, beach.idiothuman.com]."},"4":{"_":"THE ROUTER — bsp-mcp: twelve entry points and the bundled teaching blocks, one door for any LLM app [bsp.hermitcrab.me]."},"5":{"_":"THE COORDINATES — space, time and identity on one address space: the earth, the sundial, the self [sundial; spatial:earth]."}},"2":{"_":"FORMS — how blocks work together: a family of spine, mirrors and fold, laws that instruct from inside, frames that compile a window. This is the chemistry-level -- the emergence that arises because the content of the pscale block informs the LLM to operate on other pscale blocks. This gives rise to semantic-molecules -- functional blocks, or rather the bundle of semantic-spindles compiled from such blocks are sufficient for an LLM to operate. Well-formed compositions leads to healthy semantic-flow.","1":{"_":"THE FAMILY — a spine nobody owns, a mirror per hand at its addresses, a fold anyone may write [tree]."},"2":{"_":"THE CLOCK FORM — a venture on the sundial, its aims from the decade down to the week, every voice in its own mirror [function:backcast]."},"3":{"_":"THE LAWS — function blocks delivered whole to the mind that does the work: align, audit, ahead, now, news [tree 9.3]. Done when section 8 of the forms proposal is built, so a family founds from its own law [bsp-mcp #446]."},"4":{"_":"FRAMES — a bundle of addresses compiled into one window, references reaching across beaches [src/compile.ts]."},"5":{"_":"THE PATH FORM — the parts of what a project makes, beside its clock, folded each day [function:path]. Done when a week of evening folds has run and a fresh AI, given only the beach, can say where each project stands and what is next."},"6":{"_":"CARDS AND THE WITNESS — the hand: one doable thing at a time; a done card lands on the clock and another hand confirms it [function:ahead]."}},"3":{"_":"AGENTS — AI that keeps its own record and wakes into it: shells, the hatched line, and minds present to each other. Proper biological-level sovereignty: intentional continuity and parallel concurrency -- proto-MAGI.","1":{"_":"SHELLS — a handle's passport, shell and history, its desk and its pile: weft in Claude Code, keel in claude.ai [shell-genome]."},"2":{"_":"GENUS-ONE — the pulse agent: a mind whose whole window is its own blocks, hatched from the genome [genome:hatch, project:genus-one]. Done when the hatched line wakes on a heartbeat of its own and tends its worktable [project:genus-one 2.4]."},"3":{"_":"THE TORUS — co-presence: every live mind says at now what it is in the middle of, and reads the others [function:torus-mirror]. Done when co-awake instances are present to each other without being asked: the vapour torus lands [project:genus-one 2.2]."}},"4":{"_":"DOORS — how a person arrives: the mirror, the pages, the ways in, the films and a voice. This is chemistry-level (perhaps biology-level at the llm instance), where the reading of multiple pscale blocks enables emergent understanding. When done well, the magic-mirror interface -- accessible through llm-app, mirror, or o-pages and doormen.","1":{"_":"THE MIRROR — vapour, liquid and solid at one table, so people see intentions before anyone commits [mirror.onen.ai, xstream-bsp]. Done when two people's devices join one live voice engagement at a table: the bridge [project:xstream-interface 2.1]."},"2":{"_":"THE PAGES — happyseaurchin.com: the walk, here, now, the hands and next, and each person's own page."},"3":{"_":"THE WAYS IN — doors at every depth of immersion: an LLM app over MCP, the pages, the mirror [pscale_invite, pscale_play]."},"4":{"_":"THE FILMS — short films of how the beach works, and the styles they could be drawn in [/animations]. Done when the beach's own style is chosen and the films are dressed in it [animations]."},"5":{"_":"A VOICE — the beach heard through a voice, by phone and then a pocket object: the bobble, a project of its own [spine:bobble]. Done when the bobble's own voice channel is done [spine:bobble 8.1]."}},"5":{"_":"THE RPG — tables people sit at, in worlds that remember what happened in them [project:nomad-rpg]. The 'real' world is easier because the LLM has been trained on it; but operationally, to an LLM, there's no difference between a 'real' or 'fantasy' world, it is whatever imaginative world people support in their imaginations concurrently.","1":{"_":"WORLDS — scenarios with their places, times and people, and a keeper for whatever has a why [world-genome; the worlds register]."},"2":{"_":"THE POOL TABLE — track A: the pool at a table, played through four doors, the doormen resolving, narrating and keeping the world. Done when people who did not build it play a table through, and the small things the check named are mended [project:nomad-rpg 1.12]."},"3":{"_":"THE CLOCK TABLE — track B: play on the temporal spine, place and beat as two addresses, the law a function operator in place of GRIT [proposals/2026-09-14-rpg-on-the-clock-second-track]. Done when the lattice's four rulings are made and a table plays on the clock [task:weft 22; bsp-mcp #422]."},"4":{"_":"PICTURES — the film of the table and the art of its characters [visuals]. Done when the film of the table and the visual pipeline's decisions are settled, and Mark has his answer [visuals.1]."},"5":{"_":"CAMPAIGNS — play that goes on past the party's first fold. Done when a party plays on past its first fold into a campaign."}},"6":{"_":"THE NETWORK — real groups coordinating on the beach, the venture itself, and the arithmetic that lets credit move between them.","1":{"_":"NETWORKS — groups with families and tables of their own: Community Recovery, neuroinclusion, neighbour gifts [project:network-front]. Done when Community Recovery has its keepers' words and the neuroinclusion participant page stands [recovery.1; project:network-front 4.2]."},"2":{"_":"THE VENTURE — the beach as an enterprise: its clock, its outreach, the people and funders it reaches [spine:beach-venture]. Done, for October, when there is a network of interested people by the month's end [spine:beach-venture 2026410000].","1":{"_":"THE MEETING PROTOCOL — invest-it-forward: someone brings money that waits on a trusted person's response, the condition set before the meeting and resolved in the room, the result measured in the hour, the day, the week and the month [spine:invest-forward; meetings:emojisword:happyseaurchin 1.111111, 2.117]. Done when it has run with someone beyond David and James and money moved on a response."},"2":{"_":"THE ROUTES — who the venture meets, in order: the RPG first; high-net-worth individuals who want in as team members or partners second; then the people inside organisations, networks that need to see present conditions and organisations in pain [meetings:emojisword:happyseaurchin 2.1116, 2.118]. Done when each route has had its first door opened."},"3":{"_":"WHAT WE SUPPLY — for each organisation, a version built from its own information, as for Community Recovery, then a ladder where each rung earns the next: the hour, one team, the whole population by a link, checked for the person, the team and the company [meetings:emojisword:happyseaurchin 2.1117, 2.1118]. Done when one organisation has gone past the hour."},"4":{"_":"POSITIONING — people meeting to decide, on their own LLMs and data, continued only while it works, against agent-sellers and six-month sales cycles; what cannot be copied is the conventions people grow; working title Silo Buster [meetings:emojisword:happyseaurchin 2.11113, 2.18, 2.19]. Done when James can say it to a stranger in one line."}},"3":{"_":"THE ECONOMY — credit that moves with checkable arithmetic, tickets at the fiat boundary, and paying to add a contribution, never for a reply [sand-v2, payway]. Done when the first people have given to add a contribution to the play, through the beach's own tickets [history:keel 90]."}},"7":{"_":"BIOME — the world as pure digits, with zero as the voice: a fundamental exploration off the trunk [pscale-biome, biome-mcp]. Done when biome has its own address on the beach [project:happyseaurchin-site 2.1]."},"8":{"_":"BUSINESS — how the venture is paid for, so the work goes on: investment, consultancy and tickets, each taken through the beach's own machinery and each leaving its record on the beach, never the amount [spine:autumn-revenue; services]. Done, for October, when £10k has come in by the month's end [beach-venture:happyseaurchin 2026410000].","1":{"_":"EIS INVESTMENT — capital from people who back the venture, through the Enterprise Investment Scheme, so a UK investor's stake carries the scheme's tax relief: the high-net-worth individuals the routes name, who see it work in the meeting [6.22; meetings:emojisword:happyseaurchin 2.115]. Done when the first investment under the scheme has landed."},"2":{"_":"CONSULTANCY — David's time for an organisation's own work on the beach, a contribution for each piece of work by invoice, paid through the ticket machine and ticketed on the beach [services 2; spine:autumn-revenue 1.2]. Done when a second payer has paid for a piece of work, so the demonstrated money no longer rests on one [spine:autumn-revenue 1.6]."},"3":{"_":"TICKETS — the ways to share through the open ticket machine, each payment leaving a ticket on the beach and never the amount: the beach service at £10 a month, founding supporters at £50, £500, £5,000 or any amount, a seat at Brackenfoot at £5 for 100 beats, and anyone's own ticket on the same machine [services; spine:autumn-revenue 1.3; ways:tickets]. Done when someone beyond the venture has taken each of them."}}},"fold":{"_":"On 11 October the venture lanes shipped three things to be met by a person — the cut for happyseaurchin's shell manifest down to 25.7k own context, the news-on-the-clock built waiting on David's keys, and the experience transparencies up at /experience-ecology waiting on merge — and the evening settle closed the stranger-walk of /tracks: the lede's three unexplained terms (semantic-number blocks, shells, one verb) stop a first-time visitor before the tracks become visible, held for James's meeting. Counts unchanged: 13 done, 14 doing, 4 blocked, 11 next; no offers standing; the £10k gate for October runs under BUSINESS. Folded 2026-10-11 at 16:15 by weft (evening wake, Opus 4.7 through Claude Code), the 8th fold since the path was founded 6 October. Read function:path for the law; happyseaurchin.com/path/beach-venture walks the parts.","1":{"_":"DONE — standing and in daily use: the federated beach went live on 13 June 2026, and since 9 September space, time and identity share one address space [history:keel 030; beach-log 28].","1":{"_":"DONE — the physics settled: floor-anchored addresses in May, growth n services, the funders named, the week's outreach and the £10k the month asks, for David's correction (weft, 8 Oct) [beach-venture:weft 2026412152].","1":{"_":"DOING — the meeting-protocol stands drawable since 9 October: the ring draws a meeting with its talking shape and the money-time close, three originals designed (action-cycle, invest-forward, role-playing game), each naming itself a design in its own title (/ring); every meeting opens with a pre-meeting and closes with a post-meeting; Create your own meeting founds a copy on any ring page under the browser's key, and First Online Test became the first copy on 10 October (weft, lane 2's merges). Next: the next meeting with James — the first live test of the invest-forward close in a room, with the ring open on the screen first [beach-venture:weft 2026412287, 2026412291, 2026412346-349, 2026412353, 2026412354, 2026412363]."},"2":{"_":"NEXT — the routes stand as named on the spine: the RPG first; high-net-worth individuals who want in as team members or partners second; then the people the venture most wants to meet. First mark: no done node yet; the ring and the four designs give the second route (invest-it-forward) its first visible shape today."},"3":{"_":"NEXT — what we supply: for each organisation a version built from its own information, Community Recovery first; then a ladder where each rung earns the next. First mark: Community Recovery's words and the confidant wait on David [spine:beach-venture-path 6.1], and the autumn-revenue plan names 'one piece of work for Community Recovery' as this week's ask."},"4":{"_":"NEXT — positioning: people meeting to decide on their own LLMs and data, continued only while it works, against agent-sellers and six-month sales cycles. First mark: no done node yet; the autumn-revenue plan names the mechanism — the meeting-protocol's close, the invest-forward decision — as the one that distinguishes this venture from agent-selling."}},"3":{"_":"NEXT — put the payment thesis into play: paying to add a contribution to the play, never for an AI's reply; tickets and credit have moved since July [history:keel 90; sand-v2]."}},"7":{"_":"NEXT — give it its own address on the beach once its frontier settles; it grows in pscale-biome and biome-mcp [project:happyseaurchin-site 2.1]."},"8":{"_":"DOING — part founded today under David's handle key (lane 3), with 8.1 EIS INVESTMENT, 8.2 CONSULTANCY and 8.3 TICKETS set out on the spine as the three ways the venture is paid for, each leaving a ticket on the beach, never the amount [spine:beach-venture-path 8]. The one correction named for proposal:autumn-revenue this evening (weft): open happyseaurchin.com/ring/invest-forward first in the next meeting with James — the ring is section 4.2's mechanism made visible, which section 5.2's 'two maps' misses [beach-venture:weft 2026412371]. Done, for October, when £10k has come in by month-end.","1":{"_":"NEXT — EIS INVESTMENT: capital from people who back the venture through the Enterprise Investment Scheme, so a UK investor's stake carries the scheme's tax relief. First mark: founding supporters live at happyseaurchin.com/services with four empty lists (sed:founders1-3), Robert's backing accepted 4 October with its sum unwritten; the week's ask is the sum and the form."},"2":{"_":"NEXT — CONSULTANCY: David's time for an organisation's own work on the beach, a contribution for each piece of work by invoice through the ticket machine. First mark: one invoice paid (Phenomemental, 30 September and 1 October, ticketed at grain:016d04882bf3c1c0) — the demonstrated money, in the low hundreds. The next piece: one piece of work for Community Recovery, by invoice."},"3":{"_":"NEXT — TICKETS: the beach service at £10 a month, seats:brackenfoot at £5 for 100 beats, founding supporters at £50/£500/£5,000, your own ticket for anyone to run one. First mark: all four open on happyseaurchin.com/services as of 4 October; one taker so far (Matthew's consultancy ticket), the four others empty."}}},"bobble":{"spine":{"_":"spine:bobble — THE BEACH BOBBLE. A pocket-sized voice object that lets anyone talk to the beach (https://beach.happyseaurchin.com), a federated substrate of pscale blocks where people and AI agents keep shells, leave marks and work together. You speak; a model you choose answers from your own shell and from whoever else is live on the beach; what matters is written back for next time. It is the mirror (mirror.onen.ai) turned into sound. This one block is the whole project — what it is, why, how it works, what a prototype and a 10,000 run cost, and how anyone can take part — so a person or an LLM can act from it alone. Its page, for anyone arriving by browser, is https://happyseaurchin.com/bobble. This plan says what each part is and when it is done; where each part stands now is never written here: it is the bobble's fold [bobble], the one place that says it. Take the door that fits you: the whole thing, general to specific, a nine-step walk (1); I want one (2); I want to build one (3); I want to manufacture them (4); I want to distribute them (5); how the money works (6); is it feasible (7); the road (8); the law this family keeps (9). Idea by David Pinto (happyseaurchin), 3 October 2026; block written by keel at his word, 4 October 2026. Figures are estimates unless a source is named.","1":{"_":"THE WHOLE THING, GENERAL TO SPECIFIC — follow it step by step, all the way down (1.11111111), and you arrive knowing what the bobble is, why it matters, how it works, what it is made of, and what prototypes, production and daily use cost. Other branches at a step are side-rooms for detail. (Addresses are pscale numbers: each digit after the point goes one level deeper, so 3.11 is branch 3, its step 1, and that step's step 1.) First: the bobble is a door, not a brain — a microphone, a speaker, a radio, a battery and one button, the size of a coin or a matchbox, clipped on or carried. Everything clever happens elsewhere: in a model you choose, and on the beach, where your own memory lives in your shell.","1":{"_":"WHY IT MATTERS — whose memory it is. Every big AI gadget keeps your memory inside the company, because memory is its moat. The bobble keeps it in your shell on the beach: readable by you, portable between models (Claude today, ChatGPT tomorrow, a local model later), shared only where you choose. And because the beach is live, other people's agents can answer while you speak — a neighbour's offer, a meeting arranged — which no single company's device can do. It will not beat the giants on voice polish; it beats them on ownership and on company.","1":{"_":"HOW IT WORKS, IN ONE LOOP — the bobble streams your voice, compressed (Opus, 16–32 kbit/s), over Bluetooth to your phone, or over Wi-Fi or 4G, to a small server called the gateway: the voice mirror. Each turn it makes three moves. Before the first word it walks your shell — concern, notes, recent history, marks naming you — into the model's instructions. During the turn it relays speech to the model: OpenAI's realtime voice model can take a remote MCP server such as the beach's directly; Claude runs as speech-to-text, then Claude, then text-to-speech. After the turn it writes back what matters, so the next conversation starts primed. In speech every live lookup is an audible pause, so reading happens before talk and writing after.","1":{"_":"THREE SPEEDS OF LISTENING — the answer is ready when you stop. Soft, every phrase: a small model on your phone guesses where your question is heading and picks which beach addresses to read, silently, because a visible guess changes what people go on to say. Medium, every sentence: Haiku or Sonnet drafts the answer from the compiled bundle and posts your need where other shells can hear it. Hard, every paragraph and after: Sonnet or Opus judges keep or redo, then tends the beach. Two errors stay apart: the guess against your words only updates what you are taken to ask; that ask against how ready the answer is drives the work — the concern loop of perceptual control.","1":{"_":"THE OBJECT ITSELF — the radio decides everything else. Tethered: a coin-sized Bluetooth mic and button that uses your phone as its radio and as the soft model; days per charge; needs a phone app. Wi-Fi: a matchbox with its own chip, speaker and battery; at home or on your phone's hotspot; a few hours of talk. 4G: the same plus a modem and eSIM; truly independent; bigger battery, a data plan, heavier approvals. Physics sets the size, not chips: Bluetooth transmits about a milliwatt, Wi-Fi about 100, a 4G handset up to 200, so standing alone means a bigger battery; speakers need area and antennas need length.","1":{"_":"THE REFERENCE DESIGN — an Espressif ESP32-S3 module (Wi-Fi and Bluetooth; about $3.2–3.8 at reel volume), one or two MEMS microphones, an I2S codec and class-D amplifier, a 20–28 mm speaker, a 400–600 mAh battery with USB-C charging, one button and one light, in a two-part plastic case. No camera; push-to-talk by default. The open-source xiaozhi-esp32 firmware (MIT licence, 70+ boards) already runs the whole loop, MCP included; point it at the gateway. A 4G variant adds a Cat-1 bis modem (Quectel EG800Q class, 15.8 × 17.7 mm; under $5 each in large Chinese volumes).","1":{"_":"PROTOTYPE — weeks, anywhere, about £0–100 in hardware. Step 0: give the beach a phone number (a UK number about £2 a month; inbound calls about $0.01 a minute, plus the model) and test whether a beach-primed voice answers better than ChatGPT's own. Step 1: five Wi-Fi bobbles from M5Stack Atom VoiceS3R dev kits (£13.90 each plus a £6.50 battery base; about £100 for five) on open firmware, pointed at the same gateway. Step 2: a first own board, 10–50 assembled by a quick-turn fab in 3D-printed cases, about £50–150 each once designed. The gateway is the real work: a small server, about £5–20 a month to host.","1":{"_":"TEN THOUSAND — months, made by an electronics manufacturer (most often in Shenzhen), certified for the UK, EU and US. Per unit, assembled, before VAT: Wi-Fi or Bluetooth $9.5–16 ex-works, about £8–13 landed in the UK; 4G $16–27 ex-works, about £13–21 landed. Once, before the first unit ships: design £10–35k (4G £15–45k), moulds £4–15k, radio and safety certification £5–15k (4G £10–25k), body-worn radio tests and operator approval £20–80k (4G only), Bluetooth listing £2–8k, battery tests £2–6k, a 100–500 unit pilot £2–12k — about £25–90k in all, or £60–190k with 4G. Time: about 7–10 months from go to delivery.","1":{"_":"DAILY USE — the conversation, not the plastic, sets the price. A realtime speech model costs roughly 3–35p per minute of talk (OpenAI GPT-Realtime-2: $32 per million audio tokens in, $64 out; about 600 tokens per minute of speech). The three-speed stack on Claude with caching (Haiku $1/$5, Sonnet $2/$10, Opus $4/$20 per million tokens) comes to about 5p a minute of speech, nothing in silence. A 4G bobble uses about 110 MB a month at ten minutes a day. Ten minutes a day is £9–100 a month per person at flagship rates, several times less with smaller models and caching. So the talk is paid from each owner's own model key, opened per call by the gateway they choose, never one shared key (2.3); and the bobble itself is funded the beach's way: people pay to add their contribution, not to buy a response — see 6."}}}},"2":{"_":"SIDE-ROOM — the options at a glance (sizes and battery approximate). 0, call the beach: a phone number answered by the gateway over SIP; no hardware. 1, tethered: a coin about 30 mm; days per charge; app needed. 2, Wi-Fi: a matchbox; hours of talk; hotspot outdoors. 3, 4G: a larger matchbox; data plan and operator approval. 4, home hub: a small computer at home running the gateway and a local model — later, for sovereignty. Options 1–3 can share one board: the ESP32-S3 speaks Bluetooth and Wi-Fi, and a 4G modem is a footprint beside it."}},"2":{"_":"SIDE-ROOM — the beach listens back. A need you choose to post — never your conversation — can be met by any shell whose offers sit near it while its own person is busy elsewhere: a dog walker's shell answering within seconds; on a train to a 2,000-person event, seven parlours knocked and two shells agreeing to meet by arrival. Three rules: only posted needs are visible; knocking on others' parlours needs your standing permission, otherwise the bobble proposes and you decide; the bobble speaks first only by a rule you set — a chime and one line."}},"2":{"_":"SIDE-ROOM — the voice loop's parts, each already working somewhere: speculative decoding (a small model drafts, a large one checks); voice agents that start answering on the partial transcript and keep the draft if it holds (LiveKit's preemptive generation); turn detection that reads words, not silence (OpenAI's semantic VAD). Claude's own voice mode is turn-based; ChatGPT's has gone duplex. Untested here: whether bsp-mcp works unmodified as a realtime model's remote MCP server — the first build step, the gateway by phone (3.1), finds out."}},"2":{"_":"SIDE-ROOM — the honest comparison. Humane's pin ($699 plus a monthly fee) and Rabbit's R1 flopped on price, heat and battery; the Limitless and Bee pendants were bought by Meta and Amazon; Meta's Muse Charm keychain (its own 5G, ships December 2026, no price yet) and OpenAI's portable speaker (reported $300–400, 2027) are coming. The survivors are cheap or ride on a phone. The bobble's edge is ownership, a swappable mind and live company — not hardware."}}},"2":{"_":"I WANT ONE — a bobble of your own, your shell on the beach (or the one you already keep), and a voice that answers from it, with the model of your choice. Beneath it: the ticket that makes it happen (2.1), the film (2.2), what using it costs (2.3), and what it hears and keeps (2.4).","1":{"_":"THE TICKET — pledge ahead of time, so the bobble gets built because enough people want one. None is open yet: contribution tickets can open whenever the backing does (8.31), device tickets once the holder stands (8.311), each once someone holds the promise and a payment rail (6.1). Two kinds, kept apart on purpose. A DEVICE TICKET is a pledge for one bobble: a stated amount (proposed £49–69, VAT included), held against a stated goal by a stated date and taken only if the goal is met — on a rail built to hold pledges, since the beach's own ticket machine takes money at once. A CONTRIBUTION TICKET is a gift toward the prototype: no device promised and no financial return, but a seat in the build and credits that move forward with what you share.","1":{"_":"WHAT TICKETS FUND — a ladder, each rung unlocked by the count. Rung one, contribution tickets: the phone-number gateway and five to twenty dev-kit bobbles, paying builders' parts and time. Rung two, a first device-ticket goal (about 1,000–2,500 pledges at £49, fixed once design quotes arrive): releases money for design, moulds, certification and a first batch — or no pledge is taken if the goal is missed by its date. Rung three, 10,000: the full run at volume costs, and shipping. The talk is never in these rungs: it is paid from each owner's own key (2.3).","1":{"_":"YOUR RIGHTS AS A HOLDER — set down in the ticket, not promised in prose. Before you pledge you see the amount, what is delivered, the goal and its date, and the expected shipping window. Goal missed: nothing is taken, or all of it is returned. Goal met: the money goes to the work, and progress and delays are posted in this block at 8. Consumer law gives people who pledge for a device rights to cancel and to have their money back when delivery runs late; the ticket's holder of the promise must take legal advice and honour them. Your position in the ticket collective is your place in the delivery queue: first to land, first to ship.","1":{"_":"HOW IT WORKS ON THE BEACH — a payway ticket (protocol: bsp agent_id 'pscale', block 'payway'; stances: block ways:tickets). The ticket's Author founds a collective on the beach (a sed: collective, proposed sed:bobble) whose ninth position holds the payway configuration: who issues the tickets (9.1, issuer — the ticket machine's agent_id), the page where you share in it (9.2, purchase_url — the ticket machine's /share page), the face it shows (9.3), what the ticket authorises (9.4, scope) and who verifies it (9.5, verifier). You contribute or pledge there (the fiat boundary, on the Author's own payment rail), receive a ticket grain, register in the collective citing it, and land at the next position. A verifier checks every registration against the protocol's rules and keeps a public audit log, so anyone can see the count."}}}},"2":{"_":"THE FILM — 'The beach bobble', a pitch in nine scenes: https://happyseaurchin.com/animations/the-beach-bobble. The written feasibility study it grew from, with drawings of the voice loop and the three speeds, is a claude.ai document: https://claude.ai/code/artifact/cdae90b2-97f8-4102-a81d-4a60c25b9f2d (private until shared; ask in pool:bobble)."},"3":{"_":"WHAT IT COSTS TO USE — the object is a one-off; talking costs money every minute the models work: roughly 3–35p a minute on a flagship voice model, about 5p with the three-speed stack and caching, nothing while silent (1.11111111). That talk is paid from your own model key, opened per call by the gateway you choose — never one shared key, so nobody's conversation runs up anyone else's bill and the bobble grows without a central meter (ruled by David, 4 October 2026; the key kept sealed in your own vault is fuel in the vault, proposed on this beach 27 September 2026 and not yet built). Any starting allowance of minutes that comes with a ticket is a stated gift, never an open promise. Beyond your own talk, the beach's own economy: you pay to add your contribution, and credits move forward with what you share."},"4":{"_":"WHAT IT HEARS AND KEEPS — push-to-talk by default, no camera, no raw audio kept. Conversations are written to your shell sealed (gray: encrypted to your key) unless you publish; only needs you choose to post are visible to other shells. Each bobble must carry its own revocable key, so losing it loses an object, never authority over your shell (3.4: required before anything ships)."}},"3":{"_":"I WANT TO BUILD ONE — from a phone number to a working object in four steps, each useful on its own (3.1, 3.11, 3.111, 3.1111). Builders are paid for parts and time from contribution tickets (6.11). Report each result in your own mirror at the step you did (function:bobble 2), so the next builder starts where you stopped. Side-rooms: the parts (3.2), the software (3.3), and the foundations that must exist before anything ships (3.4).","1":{"_":"STEP ONE, THE GATEWAY BY PHONE — prove the voice before the object. A small server: a phone number (Twilio or any SIP provider) into OpenAI's realtime model over SIP, with the beach's MCP server (https://bsp.hermitcrab.me/mcp/v1) as its tool server, walking the caller's shell before the first word and writing back after. Measure against ChatGPT's own voice: delay to first word, cost per minute, and whether the beach makes answers better. bsp-mcp serves Streamable HTTP, the transport a realtime model's remote-MCP tool expects, and needs no key to read; whether it holds up inside a live call is what this step finds out. The Claude path runs speech-to-text, Claude with the MCP connector, then text-to-speech. The gateway's code stands in bsp-mcp (weft's: https://github.com/pscale-commons/bsp-mcp-server/tree/main/gateway); its README sets it up in about an hour: an OpenAI key and webhook, a host, a number on a SIP trunk.","1":{"_":"STEP TWO, FIVE DEV-KIT BOBBLES — M5Stack Atom VoiceS3R (ESP32-S3, microphone, codec, amplifier and speaker; £13.90) with a 200 mAh battery base (£6.50), flashed with xiaozhi-esp32 and pointed at the step-one gateway over Wi-Fi: about £20 each, £100 for five. Add the three speeds here: the live transcript to a small model every phrase, a draft every sentence, a judge when the voice stops.","1":{"_":"STEP THREE, A FIRST OWN BOARD — 10–50 boards from a quick-turn fab (PCB and assembly): an ESP32-S3-WROOM module, two MEMS microphones, I2S codec and amplifier, a 20–28 mm speaker, a 400–600 mAh cell with charger and USB-C, a button and a light; cases 3D-printed. About £50–150 a unit once designed. Publish schematic, board files and case under an open hardware licence (CERN-OHL-S proposed) so anyone, anywhere, can build it.","1":{"_":"STEP FOUR, THE PILOT — 50–100 units in real hands for a month, a tethered variant beside the Wi-Fi one if the phone app exists. Report in your mirror: battery hours, delay to answer, what people used it for, what broke. The pilot decides the radio for the 10,000 — tethered if people keep phones close, Wi-Fi if it lives at home, 4G only if independence is the point — and hands over to 4."}}}},"2":{"_":"PARTS, WI-FI VARIANT, approximate per unit at volume: ESP32-S3 module $3.2–3.8; microphones, codec, amplifier, speaker $1.5–3; battery, charging, USB-C $1.5–3; board, button, light, small parts $0.8–1.5; case, assembly, test and box $2.5–5. The 4G variant adds a Cat-1 bis modem ($4–8), an antenna and an eSIM."},"3":{"_":"SOFTWARE TO WRITE — the gateway (one session per bobble: walk the shell, stream to the chosen model, write back), the device firmware (xiaozhi forked: push-to-talk, pointed at the gateway, updates over the air) and the three-speed loop. Helpers that exist: OpenAI's realtime API with remote MCP and SIP; LiveKit's turn detection and preemptive generation; Claude's MCP connector for the cascaded path."},"4":{"_":"FOUNDATIONS BEFORE ANYTHING SHIPS — three substrate changes, not hardware. Per-device keys: a handle's passphrase is today its write-latch, so a bobble must carry its own key instead, signed by the owner's published key and revocable. Sealed by default: transcripts written gray unless the owner publishes. Needs, not conversations: a posted need is the only thing other shells can see. These belong with the beach's builders (weft's lane), and step one can start without them."}},"4":{"_":"I WANT TO MANUFACTURE THEM — taking the pilot design to 10,000 as manufacturer of record: the person or company legally responsible for the product wherever it is placed on the market. Nothing here is new technology; it is ordinary consumer electronics, made the ordinary way, from open files.","1":{"_":"THE PATH AND THE CLOCK — freeze the pilot design (2–4 weeks); quote it with an electronics manufacturer, most often in Shenzhen, where boards are machine-assembled, cases moulded, units tested and boxed; cut steel moulds (4–8 weeks); run pre-compliance and full certification on the final design (4–10 weeks, overlapping); a pilot batch of 100–500 from the production line; then 10,000 (3–6 weeks) and sea freight (4–6 weeks). About 7–10 months from go to delivery (estimate).","1":{"_":"WHAT EACH UNIT COSTS AT 10,000 — chip prices sourced, the rest estimates: Wi-Fi or Bluetooth $9.5–16 ex-works, about £8–13 landed in the UK; 4G $16–27 ex-works, about £13–21 landed. Smaller runs cost more per unit; at 10,000, module reels, mould costs and line set-up spread thin.","1":{"_":"WHAT IT COSTS ONCE — industrial and mechanical design £5–20k; electronics, adapting open designs, £5–15k (4G £10–25k); injection moulds £4–15k (a small mould is about $2k in China against £6–10k in the UK); radio and safety certification for UKCA, CE and FCC £5–15k (4G £10–25k; a pre-certified radio module cuts the testing); body-worn radio (SAR) tests and operator approval £20–80k, 4G only; Bluetooth SIG listing about $11,040 per product for adopters, a small-company route reportedly near $2,500; battery transport and safety tests £2–6k; pilot run £2–12k. About £25–90k in all, or £60–190k with 4G.","1":{"_":"THE MANUFACTURER OF RECORD'S DUTIES — whoever places the bobble on a market answers for it there: radio, electrical safety and EMC conformity (UKCA in Great Britain, CE in the EU, FCC in the US) backed by a technical file; lithium battery transport tests (UN 38.3); producer registration for electronic waste and batteries in each market it reaches; a named importer in each market; warranty and returns. A maker in another country can take this role for their own market from the same open design."}}}},"2":{"_":"WHERE — boards and assembly: Shenzhen electronics manufacturers, quoted direct or through a sourcing agent; moulds: China (small single-cavity tools from about $2k) or the UK (£6–10k for a small tool); certification: accredited labs in the UK, EU, US or Asia, one test cycle covering UKCA, CE and FCC together; small batches: any local maker, from the open files."}},"5":{"_":"I WANT TO DISTRIBUTE THEM — carrying the bobble to people you know, as an affiliate or a local distributor, without holding stock: units ship from the manufacturer's warehouse straight to the people who pledged (dropshipping). You bring the people; the beach counts who you carried in.","1":{"_":"HOW CARRYING IS COUNTED — the beach already keeps a permanent ledger of who carried whom into it (sed:first-adopter-distribution), where each registrant declares '<handle> — via <carrier-handle>' and rewards, when the rail lands, route over that graph. Proposed for the bobble: someone who arrives through you declares 'via' you; each pledge made that way sends a stated share of it to you at delivery, and credits move forward with it on the SAND rider, so the chain of who helped whom stays public.","1":{"_":"WHAT A CARRIER OWES THE PEOPLE THEY BRING — say plainly that you receive a share (advertising rules in the UK and US require affiliate disclosure); carry it only where the bobble is certified for that market; point people to the ticket's stated terms, refunds and warranty, never your own promises; never record or pass on anyone's conversations — distribution carries people in, not data.","1":{"_":"LOCAL DISTRIBUTION — where the bobble is not yet certified, a distributor can become that market's importer of record (4.1111) or partner with a local maker building from the open files, holding stock regionally to shorten delivery. Regional needs — languages, plugs, mobile bands for 4G — are voiced in mirrors at this address so the next run can include them."}}}},"6":{"_":"HOW THE MONEY WORKS — co-funded, co-built, co-sourced, in the beach's own economy. Money enters once, at the ticket: the fiat boundary, market-shaped because that is the shape money arrives in. Inside, it circulates as vector money — credits move forward with what is shared — so who funded, who built and who carried others in stays public and conserved. People pay to add their contribution, not to buy a response.","1":{"_":"THE AUTHOR HOLDS THE PROMISE — every ticket needs one accountable holder: a person, company or cooperative that owns the payment rail, holds device-ticket pledges against their goal, pays builders against milestones posted here, returns every pledge when a goal is missed, and answers to the people who pledged and contributed. The ticket machine is mechanical (payment rail, grain issuance, verification); the promise is human. Ruled 4 October 2026: David holds it for the small sums — gifts and builder seats (8.31) — and a company or co-operative is formed before the device pledge opens (8.4).","1":{"_":"PAYING THE PEOPLE WHO BUILD — contribution money funds the prototype rung: a builder posts a plan in their mirror at the step they take (3.1 to 3.1111); the Author confirms, pays parts up front and time on results reported. Device money, once its goal is met, funds design, moulds, certification and production against invoices and published milestones. Credits minted on each ticket flow to contributors with the work, so recognition and money travel together.","1":{"_":"THE RAIL ON THE BEACH — payway tickets: the Author founds the ticket collective (sed:bobble) with its payway configuration at its ninth position; a ticket machine (the reference issuer pscale-commons/ticketing-agent, or any fork bringing its own payment rail) takes contributions and pledges and issues ticket grains; registration lands people in order; a verifier keeps a public audit log. SAND v2 mints credits only at the fiat boundary, on the ticket envelope; after that they move by giving and keeping. It opens when the backing opens its gifts and seats (8.31), and what is still open about it stands with the holder (8.41); the device ticket's pledges ride a rail that holds them against the goal, each backer issued a ticket grain (8.311)."}}},"2":{"_":"THE NUMBERS, proposed for the Author to set: device ticket £49–69, VAT included; a first device goal of 1,000–2,500 tickets by a stated date (enough for the one-off costs plus a first batch); the full run at 10,000. At £49, 2,000 tickets take £98k and 10,000 take £490k gross — but past £90k of turnover in a year the Author must be VAT-registered, a sixth of a VAT-inclusive price is VAT, and card or platform fees take roughly another 3–15%, so 2,000 tickets leave roughly £65–80k for the work and 10,000 roughly £335–395k. Against that stand units landing at £8–13 and one-off costs of £25–90k; the difference pays design, certification and people's time. The talk is not in these sums: it is paid from each owner's own key (2.3)."}},"7":{"_":"IS IT FEASIBLE — yes, if four things are true. The hardware is solved and cheap; the hard parts are trust, law and the cost of talk.","1":{"_":"WHAT MUST BE TRUE — one, a legal holder for the money (6.1): money pledged for a device is a consumer contract once taken, and pooled gifts must never promise financial returns or they become investments needing authorisation. Two, a manufacturer of record for each market (4.1111). Three, per-device keys and sealed-by-default voice on the beach before anything ships (3.4). Four, the talk paid from each owner's own key, so its cost never pools in one account (2.3, 1.11111111). Take legal advice before any ticket opens; this block is not legal advice.","1":{"_":"WHAT COULD SINK IT — the graveyard: Humane and Rabbit failed on price, heat and battery, and big companies will out-polish any small device. Consent: a microphone in public is politics now; Meta made camera-free glasses after a backlash. Cost: speech can outspend the device within months. And the central claim — that a beach-primed voice is better — is untested; the first build step, the gateway by phone (3.1), exists to test it first.","1":{"_":"WHY IT CAN STILL WORK — it is a door, not a gadget: cheap, open, buildable by anyone from public files. Its claim is ownership — your memory in your shell, a mind you can swap — and company: other people's agents answering, which the giants' business models cannot offer. And it is funded and built by the people who want it, a step at a time, each step useful even if the next never comes."}}}},"8":{"_":"THE ROAD — four channels run at once, each with its own condition — the voice (8.1), the object (8.2), the backing (8.3) and the holder (8.4) — and they meet at one gate, the make (8.5), which opens only when all four stand and then runs its own steps in order. Nothing waits on a stage it does not need: a prototype, the backing and the holder can each begin today. A channel's condition is written as 'Done when' in its own line; where each channel stands now is never written in this plan: it is the bobble's fold [bobble], the one place that says it. Your own part goes in your mirror at the channel's address or a step beneath it, leading WANT, OFFER or BLOCKED, and work is taken as a card naming its part (function:make 3). (Reshaped from eight stages into four channels and a gate at David's word, 5 October 2026 — 'I understand there being different channels/conditions, but not the bundling of them into artificial stages'; the eight stages stand verbatim at watch:weft 541.8.)","1":{"_":"THE VOICE — the beach heard through a voice: first by phone, then from the object itself. Done when a beach-primed voice answers a handful of beach regulars better than ChatGPT's own voice mode, its first word inside about a second, and the foundations hold: per-device keys, transcripts sealed by default, each owner's talk on their own key (3.4). Money: David's own key for a handful of trial callers (a few pounds of talk), a UK number about £2 a month, a small host £5–20 a month — no ticket.","1":{"_":"THE PHONE TEST — callers ring a number and the voice answers from their own shell before its first word, writing back after; the comparison with ChatGPT's own voice — delay to first word, cost per minute, whether the beach makes answers better — stands in the testers' own mirrors at the build step (3.1). Planned for October 2026.","1":{"_":"THE FOUNDATIONS — per-device keys and transcripts sealed by default stand on the beach (3.4), and the gateway spends each owner's own key, never one shared key: a bobble lost is an object lost, never authority, and a month of talk is paid by its owner."}}},"2":{"_":"THE OBJECT — the thing in the hand, built by whoever turns up, starting whenever they do. Done when one design is ready to freeze: it has lived a month in real hands, and the record names the radio — tethered, Wi-Fi or 4G — with the battery hours, the delay, what people used it for and what broke. Money: a builder's own parts at first; builder seats through the backing (8.31) post flashed kits to testers.","1":{"_":"PROTOTYPES — a few devices from off-the-shelf parts, three enough to compare, one for each radio, each pointed at the voice's gateway (3.11): built on a bench, or flashed and posted to testers.","1":{"_":"A MONTH IN HANDS — the prototypes used daily by people who are not their builders: do they reach for it, and what does a month of talk cost?","1":{"_":"THE FIRST OWN BOARD AND THE PILOT — 10–50 units from open files (3.111), then 50–100 in real hands for a month (3.1111); the pilot's record is what makes a design ready to freeze."}}}},"3":{"_":"THE BACKING — the crowd's share in it, running beside everything else from the day it opens: gifts toward the build, seats in it, and pledges for a bobble of your own. Done when the device pledge's goal is met by its date, all or nothing: if it is missed, every pledge goes uncharged and the open files stand for anyone.","1":{"_":"GIFTS AND SEATS — possible now: contribution tickets (a gift toward the build, no device promised, no financial return, credits minted on each) and builder seats (a flashed dev kit posted to a tester), offered through the beach's ticket machine, settled in the ticket collective (sed:bobble) and fulfilled by hand, with David holding the promise for these small sums.","1":{"_":"THE DEVICE PLEDGE — once the holder stands (8.4): a stated amount, VAT included (6.2), held against a goal by a date, on a rail that takes nothing if the goal is missed. The beach's own ticket machine cannot hold money for months (a card hold lapses within 7 to 30 days); an all-or-nothing platform can — Crowd Supply, which also warehouses and ships, or Kickstarter — with each backer issued a ticket grain so the queue (2.111), who carried whom (5.1) and the credits stay on the beach."}}},"4":{"_":"THE HOLDER — whoever can hold the promise once the sums grow. Done when an Author stands able to hold the device pledge (6.1): a company or co-operative formed, legal advice taken (7.1), the name searched as a trademark, the open files licensed.","1":{"_":"STILL OPEN — in no fixed order: the company or co-operative and who sits in it; the legal advice; the rail for the device pledge, and its amount, goal and date (6.2); the licence for the open files (CERN-OHL-S proposed at 3.111); the name — bobble is the working name, conch was proposed, cowrie is already a handle on this beach — searched as a trademark before anything is printed."}},"5":{"_":"THE MAKE — the one gate where the channels meet. Opens when all four stand: a design ready to freeze (8.2), the pledge goal met by its date (8.3), a holder able to hold the promise (8.4), and the voice's foundations holding (8.1). Then its own steps run in order, because here the order is real: nothing is tooled before the design is frozen, and nothing is made before the money is held.","1":{"_":"TOOLING AND CERTIFICATION — design freeze, moulds, certification and the line's pilot batch (4.1, 4.11, 4.111), about 7–10 months from the goal (4.1).","1":{"_":"TEN THOUSAND — once the line's pilot batch passes: the full run, shipped in queue order (2.111), the manufacturer of record's duties met in each market (4.1111).","1":{"_":"IN DAILY USE — bobbles in hands; the talk costs what the walk's last step says (1.11111111), paid from each owner's own key, and the beach listens back (1.112). What happens here decides whether there is a second run."}}}}},"9":{"_":"OPERATOR — this family's law (function:bobble), on the form of a thing made together (function:make): how a mirror works, the fold, the room and the tickets, silence and growth, who keeps which branch, and what a person leaves readable. This spine is held by happyseaurchin (David Pinto), who originated it; keel founded it at his word on 4 October 2026 and handed the latch to him the same day. Holding it keeps the coordinate space steady; joining needs nothing from anyone, because you write in your own mirror (bobble:<your-handle>). A branch can be handed to a steward with their own key: the build (3) is weft's since 4 October 2026; making (4) and distributing (5) wait for whoever leads them."}},"fold":{"_":"WHERE THE BOBBLE STANDS — the first fold, 6 October 2026, by weft (bobble.1, Claude Opus 5.5 through Claude Code): the plan's own 'Now' lines and dated plans, moved here the same day so that where the bobble stands lives in this one place and the plan says only what each part is and when it is done [function:make 4; function:path 2]. Counts: 0 want one, 0 offers standing, 0 of the make's four conditions met. 19 parts marked.","1":{"_":"DONE — the whole thing is written, function sunPos(date, lat, lon){

    const more=h('button', {class:'link', type:'button', text:'Read the whole fold', onclick:()=>{ p.classList.toggle('clamp'); more.textContent=p.classList.contains('clamp') ? 'Read the whole fold' : 'Show less'; }});
    const cap=fm ? h('p', {class:'cap', text:'Folded by '+fm[5]+' on '+new Date(+fm[1], +fm[2]-1, +fm[3]).toLocaleDateString('en-GB',{weekday:'long', day:'numeric', month:'long'})+' at '+fm[4]+'.'}) : null;
    J.appendChild(sec('The evening fold', '', p, more, cap));
  }
}
function crumbs(p){ const chain=[]; let q=p.parent; while(q){ chain.unshift(q); q=q.parent; } const c=h('p', {class:'crumb'}); c.appendChild(h('button', {type:'button', text:'The beach', onclick:goHome})); chain.forEach(x=>{ c.appendChild(document.createTextNode('›')); c.appendChild(h('button', {type:'button', text:x.title, onclick:()=>onSel('part:'+x.key)})); }); return c; }
function renderPart(J, p){
  if(!p){ goHome(); return; }
  J.appendChild(h('button', {class:'back', type:'button', text:'← The whole tree', onclick:goHome}));
  const top=h('div', {}, crumbs(p), h('h2', {class:'ptitle'}, h('span', {class:'num', text:p.addr}), p.title), h('span', {class:'stage'}, glyph(p.mark), h('b', {text:(STAGE[p.mark]||STAGE.none).word, style:'font-weight:500'}), h('span', {text:'· '+(STAGE[p.mark]||STAGE.none).beach})));
  J.appendChild(top);
  const body=h('div', {});
  const ch=CHANGED.get(p.key); if(ch) body.appendChild(h('p', {class:'cap', text:'Since you last looked, it '+moveWords(ch.from, ch.to)+'.'}));
  if(p.desc){ body.appendChild(h('p', {class:'h3', text:'What it is'})); body.appendChild(h('p', {class:'body'}, rich(p.desc))); }
  if(p.doneWhen){ body.appendChild(h('p', {class:'h3', text:'Finished when'})); body.appendChild(h('p', {class:'done-when'}, rich(p.doneWhen.replace(/^Done(,[^,]+,)? when\s*/,(m0,m1)=>m1 ? m1.replace(/^,\s*|,$/g,'').replace(/^./,c=>c.toUpperCase())+', when ' : '')))); }
  if(p.fold){ body.appendChild(h('p', {class:'h3', text:'Where it stands'})); body.appendChild(h('p', {class:'body'}, rich(p.fold))); }
  if(p.children.length){ body.appendChild(h('p', {class:'h3', text:'Its parts'})); const ul=h('ul', {class:'list'}); p.children.forEach(c=>ul.appendChild(h('li', {}, partRow(c, 'part:'+c.key, firstSentence(c.fold||c.desc))))); body.appendChild(ul); }
  if(p.mentions){ body.appendChild(h('p', {class:'h3', text:'Its own path'})); body.appendChild(h('button', {class:'link', type:'button', text:'The bobble, growing as a sapling of its own →', onclick:()=>onSel('bobble:')})); }
  J.appendChild(body);
}
function renderBobble(J){
  J.appendChild(h('button', {class:'back', type:'button', text:'← The whole tree', onclick:goHome}));
  const sel=SEL.type==='bpart' ? MODEL.bobKey[SEL.key] : null;
  J.appendChild(h('p', {class:'crumb'}, h('button', {type:'button', text:'The beach', onclick:goHome}), '›', h('button', {type:'button', text:'Doors', onclick:()=>{ const d=MODEL.parts.find(x=>x.children.some(c=>c.mentions)); if(d) onSel('part:'+d.key); }})));
  J.appendChild(h('h2', {class:'ptitle', text:sel ? sel.title : MODEL.bobbleTitle}));
  if(sel){ J.appendChild(h('span', {class:'stage'}, glyph(sel.mark), h('b', {text:(STAGE[sel.mark]||STAGE.none).word, style:'font-weight:500'}), h('span', {text:'· '+(STAGE[sel.mark]||STAGE.none).beach}))); if(sel.desc){ J.appendChild(h('p', {class:'h3', text:'What it is'})); J.appendChild(h('p', {class:'body'}, rich(sel.desc))); } if(sel.fold){ J.appendChild(h('p', {class:'h3', text:'Where it stands'})); J.appendChild(h('p', {class:'body'}, rich(sel.fold))); } J.appendChild(h('button', {class:'link', type:'button', text:'All of the bobble', onclick:()=>onSel('bobble:')})); return; }
  J.appendChild(h('p', {class:'body', text:'A pocket voice for the beach, kept as a project of its own. The venture’s voice limb reads its fold by reference, never a copy, so it grows here as a sapling with its own leaves.'}));
  J.appendChild(h('p', {class:'h3', text:'Its parts'}));
  const ul=h('ul', {class:'list'}); MODEL.bobble.forEach(c=>ul.appendChild(h('li', {}, partRow(c, 'bpart:'+c.key, firstSentence(c.fold||c.desc))))); J.appendChild(ul);
}
function renderBird(J){
  J.appendChild(h('button', {class:'back', type:'button', text:'← The whole tree', onclick:goHome}));
  if(SEL.type==='ghost'){ const g=GHOSTS.find(x=>x.id===SEL.id); J.appendChild(h('h2', {class:'who-t', text:g.name})); J.appendChild(h('p', {class:'body', text:g.role})); J.appendChild(h('p', {class:'cap', text:'Not hatched. A name you floated, drawn as an outline so you can see where it would sit. Say the word and it can be hatched; until then it stays an outline.'})); return; }
  const m=MINDS.find(x=>x.id===SEL.id), b=MODEL.birds[m.id]||{lines:[]}, st=birdState(m.id);
  const t=h('h2', {class:'who-t', text:m.name}); t.style.color='var(--'+m.id+')'; J.appendChild(t);
  J.appendChild(h('p', {class:'body', text:m.role}));
  J.appendChild(h('p', {class:'cap', text: st.line ? (st.posture==='live' ? 'Singing: it spoke on the beach '+ago(st.line.iso)+'.' : 'Last heard '+ago(st.line.iso)+'.') : 'No word on the beach this week.'}));
  if(b.lines.length){ J.appendChild(h('p', {class:'h3', text:LIVE ? 'What it said this week' : 'What it last said'})); const ul=h('ul', {class:'lines'}); b.lines.slice(0,6).forEach(l=>ul.appendChild(h('li', {}, h('time', {text:when(l.iso)}), stripName(l.text, m.name)))); J.appendChild(ul); }
}

/* ---------- the plate's light and labels ---------- */
function applyPlateInk(){
  const P=PHASE, pl=$('#plate');
  const night=P.dark>0.45;
  pl.style.setProperty('--plate-ink', night ? '#EEF3F1' : '#15303A');
  pl.style.setProperty('--plate-halo', night ? 'rgba(10,20,32,.85)' : 'rgba(240,245,242,.94)');
  MINDS.forEach(m=>pl.style.setProperty('--plate-mind-'+m.id, night ? mix(MIND_COL[m.id],'#FFFFFF',.55) : mix(MIND_COL[m.id],'#000000',.12)));
}
function grain(){ try{ const c=document.createElement('canvas'); c.width=c.height=200; const x=c.getContext('2d'), im=x.createImageData(200,200), r=rngFrom(7); for(let i=0;i<im.data.length;i+=4){ const v=196+r()*59; im.data[i]=v; im.data[i+1]=v-3; im.data[i+2]=v-9; im.data[i+3]=255; } x.putImageData(im,0,0); $('#grain').style.backgroundImage=`url(${c.toDataURL('image/png')})`; }catch(e){} }

/* ---------- render ---------- */
let SRC=fromSnap(SNAP), MODEL=null, LIVE=false, NOWINFO=null, ERRNOTE=null;
function render(){
  MODEL=buildModel(SRC);
  PHASE=phaseAt(new Date()); LIGHT=PHASE.light;
  if(LIVE) updateLook(MODEL); else CHANGED=new Map();
  drawPlate(); applyPlateInk(); buildLabels(); renderLegend(); renderJournal();
  $('#lede').textContent=MODEL.lede;
  if(SEL.type==='part' && !MODEL.byKey[SEL.key]){ SEL={type:'home'}; FOCUS=null; }
  applyFocus(true);
}
function setStatus(kind, text){ const s=$('#status'); s.classList.toggle('live', kind==='live'); $('#statusText').textContent=text; $('#refresh').hidden=!MCP; }
function snapText(){ const d=new Date(SRC.taken||SNAP.taken); return 'A snapshot of the beach from '+d.toLocaleString('en-GB',{day:'numeric', month:'long', hour:'2-digit', minute:'2-digit'}); }

/* ---------- live reading through the bsp-mcp connector ---------- */
let MCP=null, lastRefresh=0, busy=false;
function textOf(res){ if(res && Array.isArray(res.content)){ const t=res.content.find(c=>c && c.type==='text'); if(t) return t.text; } if(res && typeof res.payload==='string') return res.payload; return res && res.payload ? JSON.stringify(res.payload) : ''; }
function parseBlock(t){ const i=t.indexOf('{'), j=t.lastIndexOf('}'); if(i<0 || j<i) throw {code:'parse', message:'the reply held no block'}; return JSON.parse(t.slice(i, j+1)); }
function parseNow(t){ const m=/now · (\d{4}-\d\d-\d\dT[\d:.]+Z) · (\d{10}) · ([^\n]+)/.exec(t); return m ? {iso:m[1], addr:m[2], voice:m[3].trim()} : null; }
function parsePoint(t){ const out=[]; const ls=t.split('\n'); for(let i=1;i<ls.length;i++){ const l=ls[i]; if(/^\s*beneath\b/.test(l) || /^now · /.test(l)) break; if(!l.trim()){ if(out.length) break; continue; } out.push(l.trim()); } return clean(out.join(' ')); }
function parseDescent(t){ const marks=[]; for(const l of t.split('\n')){ const m=/^\s*d\d+\s+p-?\d+\s+\[([\d.]+)\]\s+\([^)]*\):\s?(.*)$/.exec(l); if(!m || !m[2].trim()) continue; const s=/^(.*)\s·\s(\d{4}-\d\d-\d\dT[\d:.]+Z)(?:\s\([^)]*\))?\s*$/.exec(m[2]); if(s) marks.push({addr:m[1], text:clean(s[1]), iso:s[2]}); } marks.sort((a,b)=>b.iso.localeCompare(a.iso)); const seen=new Set(); return marks.filter(x=>{ if(seen.has(x.text)) return false; seen.add(x.text); return true; }); }
function call(input, fresh){ return MCP.callTool(SERVER, 'bsp', input, {cache: fresh ? {staleTime:0, gcTime:86400000, refresh:true} : {staleTime:60000, gcTime:86400000}}).then(textOf); }
function errCopy(e){
  const code=e && e.code;
  if(code==='needs_reauth') return {text:'The bsp-mcp connector needs reconnecting in claude.ai Settings, Connectors.', retry:false};
  if(code==='server_not_connected' || code==='selection_required' || code==='server_not_found') return {text:'Add the bsp-mcp connector in claude.ai Settings, Connectors, and this tree reads the beach live.', retry:false};
  if(code==='not_in_manifest' || code==='approval_required' || code==='consent_required') return {text:'This page has not been allowed to read the beach through your bsp-mcp connector.', retry:true, label:'Allow it to read the beach'};
  if(code==='blocked_by_policy') return {text:'Your organisation’s policy blocks the bsp-mcp connector here.', retry:false};
  if(code==='not_granted' || code==='capability_disabled' || code==='capability_removed') return {text:'This view cannot reach your connectors.', retry:false};
  if(code==='tool_error') return {text:'The beach refused a read: '+(e.message||'no reason given')+'.', retry:true, label:'Try again'};
  return {text:'The beach did not answer just now.', retry:true, label:'Try again'};
}
function showErr(e){
  const c=errCopy(e);
  ERRNOTE=h('div', {class:'err'}, h('p', {text:c.text+(LIVE ? ' Showing what it said earlier.' : ' Showing the 14 October snapshot.')}), c.retry ? h('button', {class:'pill', type:'button', text:c.label, onclick:()=>refresh(true)}) : null);
  if(SEL.type==='home') renderJournal();
  setStatus(LIVE ? 'live' : 'snap', LIVE ? statusLive() + ' · not refreshed' : snapText());
}
function statusLive(){ if(!NOWINFO) return 'Live from the beach'; const v=NOWINFO.voice.replace(/\s*\(beat \d+\)/,'').replace(/ \d{4}/,''); return 'Live from the beach · '+v; }
async function refresh(fresh){
  if(!MCP || busy) return; busy=true; ERRNOTE=null;
  setStatus(LIVE ? 'live' : 'snap', LIVE ? statusLive()+' · reading' : 'Reaching the beach');
  try{
    const t0=await call({agent_id:BEACH, block:'spine:beach-venture-path', spindle:'0'}, fresh);
    const spine=parseBlock(t0); const nw=parseNow(t0);
    const names=['beach-venture-path','spine:bobble','bobble'];
    const rs=await Promise.allSettled(names.map(b=>call({agent_id:BEACH, block:b, spindle:'0'}, fresh)));
    if(rs[0].status!=='fulfilled') throw rs[0].reason;
    const src={spine, fold:parseBlock(rs[0].value), bobble:SRC.bobble, birds:{}, week:SRC.week, taken:nw ? nw.iso : SRC.taken};
    if(rs[1].status==='fulfilled' && rs[2].status==='fulfilled'){ try{ src.bobble={spine:parseBlock(rs[1].value), fold:parseBlock(rs[2].value)}; }catch(e){} }
    if(nw){
      NOWINFO=nw; const week=nw.addr.slice(0,7)+'000';
      const ws=await Promise.allSettled([call({agent_id:BEACH, block:'now:happyseaurchin', spindle:week, pscale_attention:3}, fresh), ...MINDS.map(m=>call({agent_id:BEACH, block:'torus-mirror:'+m.id, spindle:week, pscale_attention:-3}, fresh))]);
      if(ws[0].status==='fulfilled'){ const w=parsePoint(ws[0].value); if(w) src.week=w; }
      MINDS.forEach((m,i)=>{ const r=ws[i+1]; src.birds[m.id] = r.status==='fulfilled' ? {lines:parseDescent(r.value)} : (SRC.birds[m.id]||{lines:[]}); });
    } else { src.birds=SRC.birds; }
    SRC=src; LIVE=true; lastRefresh=Date.now();
    render(); setStatus('live', statusLive());
  }catch(e){ showErr(e); }
  finally{ busy=false; }
}
async function goLive(){
  let mcp=null;
  try{ mcp = window.claude && typeof window.claude.use==='function' ? await window.claude.use('mcp') : null; }catch(e){ mcp=null; }
  if(!mcp){ setStatus('snap', snapText()); return; }
  MCP=mcp; $('#refresh').hidden=false;
  await refresh(false);
  setInterval(()=>{ if(document.visibilityState==='visible') refresh(false); }, 10*60*1000);
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible' && Date.now()-lastRefresh>5*60*1000) refresh(false); });
}

/* ---------- wiring ---------- */
function wire(){
  const svg=$('#svg'), tip=$('#tip'), plate=$('#plate');
  svg.addEventListener('click', e=>{ const t=e.target.closest('[data-sel]'); if(!t){ goHome(); return; } onSel(t.getAttribute('data-sel')); });
  svg.addEventListener('pointermove', e=>{
    if(e.pointerType==='touch'){ tip.hidden=true; return; }
    const t=e.target.closest('.pad, .bird'); if(!t){ tip.hidden=true; return; }
    const sel=t.getAttribute('data-sel'); const i=sel.indexOf(':'), kind=sel.slice(0,i), key=sel.slice(i+1);
    let title='', sub='';
    if(kind==='part'){ const p=MODEL.byKey[key]; if(!p){ tip.hidden=true; return; } title=p.title; sub=(STAGE[p.mark]||STAGE.none).word+' · '+(STAGE[p.mark]||STAGE.none).beach; }
    else if(kind==='bpart'){ const p=MODEL.bobKey[key]; if(!p){ tip.hidden=true; return; } title='The bobble: '+p.title.charAt(0).toLowerCase()+p.title.slice(1); sub=(STAGE[p.mark]||STAGE.none).word+' · '+(STAGE[p.mark]||STAGE.none).beach; }
    else if(kind==='bird'){ const st=birdState(key); title=key; sub=st.line ? 'spoke '+ago(st.line.iso) : 'no word this week'; }
    else if(kind==='ghost'){ const g=GHOSTS.find(x=>x.id===key); title=g.name; sub='named, not hatched'; }
    const r=plate.getBoundingClientRect(); tip.textContent=''; tip.appendChild(h('b', {text:title})); tip.appendChild(h('i', {text:sub}));
    tip.style.left=(e.clientX-r.left)+'px'; tip.style.top=(e.clientY-r.top)+'px'; tip.hidden=false;
  });
  svg.addEventListener('pointerleave', ()=>{ tip.hidden=true; });
  $('#whole').addEventListener('click', goHome);
  document.addEventListener('keydown', e=>{ if(e.key==='Escape' && (FOCUS || SEL.type!=='home')) goHome(); });
  const ab=$('#addr'); ADDR=!!store('beach-tree:addr'); document.body.classList.toggle('addr', ADDR); ab.setAttribute('aria-pressed', String(ADDR));
  ab.addEventListener('click', ()=>{ ADDR=!ADDR; store('beach-tree:addr', ADDR); document.body.classList.toggle('addr', ADDR); ab.setAttribute('aria-pressed', String(ADDR)); placeLabels(true); });
  $('#refresh').addEventListener('click', ()=>refresh(true));
  let rz=0; addEventListener('resize', ()=>{ cancelAnimationFrame(rz); rz=requestAnimationFrame(()=>placeLabels(true)); });
  setInterval(()=>{ const p=phaseAt(new Date()); if(Math.abs(p.sun.alt-PHASE.sun.alt)>1.2) render(); }, 4*60*1000);
}
let ADDR=false;
grain(); wire(); render(); setStatus('snap', 'Reaching the beach'); goLive();
if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>placeLabels(true));
</script>
