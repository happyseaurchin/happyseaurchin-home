<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Six ways in — the entrance</title>
<meta name="description" content="Six ways in, in three pairs: experience it, read it the usual way, or meet it on its own terms.">
<meta property="og:title" content="Six ways in — the entrance">
<meta property="og:description" content="Experience it, read it the usual way, or meet it on its own terms.">
<link rel="icon" href="/assets/torus.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Space+Mono:wght@400;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme.css">
<script src="/theme.js"></script>
<style>
  /* THE ENTRANCE, SIX WAYS — the door drawn as three bands of two square plates,
     running beside /entrance and leaving it exactly as it stands. A band is the
     register a person arrives in (experience it · the usual way · on its own
     terms); a plate, tapped, frosts its picture and shows the ways in beneath it.
     The words are the block `entrance2` at the beach and never this file, and a
     plate or a way written there as an address (entrance:1) is read from that
     address, so the two worlds keep one voice in `entrance`. The pictures are
     this page's own. Every way OUT opens in a new tab, as on /entrance: whoever
     came this far keeps the door behind them. */
  *{box-sizing:border-box} html,body{margin:0}
  body{
    font-family:var(--body); color:var(--foam); font-size:17.5px; line-height:1.55;
    background:linear-gradient(180deg,var(--ground-top) 0%, var(--deep) 30%, var(--abyss) 100%);
    -webkit-font-smoothing:antialiased; min-height:100dvh;
  }
  ::selection{background:rgba(var(--liquid-rgb),0.30);color:var(--foam)}
  a{color:var(--liquid);text-decoration:none;border-bottom:1px solid rgba(var(--liquid-rgb),0.35)}
  a:hover{color:var(--foam);border-color:var(--foam)}
  button{font-family:var(--mono);cursor:pointer}
  button:focus-visible,a:focus-visible{outline:2px solid var(--liquid);outline-offset:3px}

  .bar{position:sticky;top:0;z-index:20;background:rgba(var(--well-rgb),0.72);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:12px 18px;
    font-family:var(--mono);font-size:12px;letter-spacing:0.08em;color:var(--vapour-dim)}
  .bar .dot{width:6px;height:6px;border-radius:50%;background:var(--liquid);box-shadow:0 0 10px var(--liquid);flex:none}
  .bar b{color:var(--foam)}
  .bar .spacer{flex:1}
  .bar button{background:none;border:1px solid var(--line);border-radius:4px;color:var(--vapour-dim);
    font-family:var(--mono);font-size:12px;padding:6px 10px}
  .bar button:hover{color:var(--foam);border-color:var(--line-strong)}

  .intro{max-width:1180px;margin:0 auto;padding:22px 18px 18px}
  .intro h1{font-family:var(--display);font-weight:800;font-size:clamp(1.7rem,5vw,2.4rem);line-height:1.06;margin:0 0 6px}
  .intro h1 .cool{color:var(--liquid)}
  .intro p{margin:0;color:var(--vapour);font-size:1.02rem}
  .loading{max-width:1180px;margin:0 auto;padding:26px 18px;color:var(--vapour-dim);font-family:var(--mono);font-size:12px}

  /* THE BAND — full width, its own colour (the house family hue, soft in both
     registers), a title and a line, then the pair. The pair is capped so a band
     fits one laptop screen: a square is never taller than the screen can show
     beneath its title. */
  .band{background:hsl(var(--fam-h) var(--fam-s) var(--fam-l) / 0.55);
    border-top:1px solid hsl(var(--fam-h) var(--fam-s) var(--fam-line-l) / 0.45);
    padding:clamp(22px,4vw,40px) 0 clamp(26px,4.5vw,46px)}
  .band-in{margin:0 auto;padding:0 18px;max-width:min(1180px, calc((100dvh - 150px) * 2 + 60px))}
  .band-head{display:flex;align-items:baseline;gap:6px 16px;flex-wrap:wrap;margin:0 0 clamp(14px,2.4vw,22px)}
  .band-head h2{font-family:var(--display);font-weight:800;font-size:clamp(1.35rem,3.6vw,2rem);line-height:1.1;margin:0;
    color:hsl(var(--fam-h) 60% var(--fam-ink-l))}
  .band-head p{margin:0;flex:1 1 320px;color:var(--vapour);font-size:1.02rem}
  .pair{display:grid;grid-template-columns:1fr 1fr;gap:clamp(12px,2vw,22px);align-items:start}
  @media (max-width:640px){ .pair{grid-template-columns:1fr} }

  /* THE PLATE — a square, a picture filling it, the label on a scrim at its
     foot. Type is sized by the plate itself (cqi), so a label grows with its
     square whatever the screen. */
  .plate{position:relative;aspect-ratio:1/1;border-radius:20px;overflow:hidden;container-type:inline-size;
    scroll-margin-top:80px;border:1px solid var(--line-strong);background:hsl(var(--fam-h) var(--fam-s) var(--fam-l))}
  .pic{position:absolute;inset:0;background-size:cover;background-position:center;
    transition:filter .35s ease, transform .35s ease, opacity .35s ease}
  .pic .ink{position:absolute;inset:6%;-webkit-mask-size:contain;mask-size:contain;
    -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;opacity:0.85}
  .pic .ink.a{background:var(--liquid)} .pic .ink.b{background:var(--solid)}
  .pic .glyphs{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;place-items:center;padding:8% 10% 22%;
    font-family:var(--display);font-weight:800;font-size:28cqi;line-height:1}
  .pic .glyphs span:nth-child(1),.pic .glyphs span:nth-child(4){color:var(--solid)}
  .pic .glyphs span:nth-child(2),.pic .glyphs span:nth-child(3){color:var(--liquid)}
  /* a photo frosts by blur; a drawing (masks, type) fades instead — a blur over
     masked layers blanks the whole paint in Chromium */
  .plate.open .pic.photo{filter:blur(18px) saturate(1.1);transform:scale(1.12)}
  .plate.open .pic.art{opacity:0.16}

  .face{position:absolute;inset:0;width:100%;display:flex;flex-direction:column;justify-content:flex-end;text-align:left;
    border:none;border-radius:0;color:var(--foam);font-family:var(--body);padding:clamp(16px,6cqi,34px);
    background:linear-gradient(180deg, transparent 42%, rgba(var(--well-rgb),0.62) 72%, rgba(var(--well-rgb),0.88) 100%)}
  .face .lab{font-family:var(--display);font-weight:800;font-size:clamp(1.35rem,8.4cqi,2.9rem);line-height:1.02;display:block;margin:0 0 6px}
  .face .feel{display:block;color:var(--vapour);font-size:clamp(0.98rem,4.1cqi,1.3rem);line-height:1.35}
  .face .tap{position:absolute;top:clamp(12px,4cqi,20px);right:clamp(12px,4cqi,20px);font-family:var(--mono);font-size:11px;
    letter-spacing:0.12em;text-transform:uppercase;color:var(--foam);background:rgba(var(--well-rgb),0.55);
    border:1px solid var(--line-strong);border-radius:999px;padding:5px 10px}
  .face:hover .lab{color:var(--liquid)}
  .plate.open .face{visibility:hidden}

  /* FROSTED — the picture blurs behind a wash of the ground, and the ways in
     stand on it. Milky on paper, smoky on the dark: frost in either register. */
  .ways{position:absolute;inset:0;display:none;flex-direction:column;gap:clamp(8px,2.4cqi,12px);overflow:auto;
    padding:clamp(14px,5cqi,28px);background:rgba(var(--well-rgb),0.50)}
  /* OPEN, A PLATE MAY GROW: the button screen never scrolls, the explanation may.
     It keeps at least its square (min-height set on opening) and lengthens
     downward when its ways need more, rather than hiding them in a scroll. */
  .plate.open{aspect-ratio:auto}
  .plate.open .ways{display:flex;position:relative;inset:auto;min-height:inherit;overflow:visible}
  .ways-head{display:flex;align-items:flex-start;gap:10px;margin:0 0 2px}
  .ways-head .t{flex:1;min-width:0}
  .ways-head b{display:block;font-family:var(--display);font-weight:800;font-size:clamp(1.1rem,5.6cqi,1.8rem);line-height:1.08}
  .ways-head span{display:block;color:var(--vapour);font-size:clamp(0.9rem,3.6cqi,1.08rem);margin-top:3px}
  .x{flex:none;background:rgba(var(--card-rgb),0.7);border:1px solid var(--line-strong);border-radius:999px;color:var(--foam);
    width:36px;height:36px;font-size:18px;line-height:1;display:grid;place-items:center}
  .x:hover{border-color:var(--foam)}

  /* no backdrop-filter here: stacked over the blurred picture it blanks the
     whole paint in Chromium, and the frost is already the picture's own blur */
  .way{border:1px solid var(--line-strong);border-radius:14px;overflow:hidden;flex:none;
    background:rgba(var(--card-rgb),0.84)}
  .way.shut{border-style:dashed;background:rgba(var(--card-rgb),0.55)}
  .way .row{display:flex;align-items:stretch}
  .way .go{flex:1;min-width:0;text-align:left;background:none;border:none;border-bottom:none;color:var(--foam);
    font-family:var(--body);padding:clamp(10px,3cqi,15px) 8px clamp(10px,3cqi,15px) clamp(12px,4cqi,18px);display:block}
  a.go:hover{border-bottom:none}
  .way .go .l{font-family:var(--display);font-weight:700;font-size:clamp(1rem,4.3cqi,1.3rem);line-height:1.15;display:block;margin:0 0 3px}
  .way .go .f{display:block;color:var(--vapour);font-size:clamp(0.86rem,3.3cqi,1rem);line-height:1.4}
  .way.shut .go .l{color:var(--vapour)}
  .way .go:hover .l{color:var(--liquid)}
  .way .more{flex:none;width:48px;background:none;border:none;border-left:1px solid var(--line);
    color:var(--vapour-dim);font-size:18px;line-height:1;display:grid;place-items:center}
  .way .more:hover{color:var(--liquid)}
  .way .more span{display:block;transition:transform .18s ease}
  .way.open .more span{transform:rotate(180deg)}

  .chip{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:0.12em;
    text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid var(--line-strong);color:var(--vapour-dim)}
  .chip.on{color:var(--liquid);border-color:rgba(var(--liquid-rgb),0.45)}
  .words{display:none;padding:0 clamp(12px,4cqi,18px) 14px;border-top:1px solid var(--line)}
  .way.open .words{display:block}
  .words p{margin:12px 0 0;color:var(--vapour);font-size:0.97rem}
  .words p.say{font-style:italic;color:var(--foam)}
  .words .who{font-family:var(--mono);font-size:11.5px;letter-spacing:0.03em;color:var(--vapour-dim);line-height:1.7}
  .words .addr{display:flex;gap:8px;align-items:center;margin:12px 0 0}
  .words .addr code{flex:1;min-width:0;overflow-wrap:anywhere;background:rgba(var(--well-rgb),0.6);
    border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px;font-family:var(--mono);font-size:12px;color:var(--foam)}
  .words .addr button{background:none;border:1px solid var(--line-strong);border-radius:8px;color:var(--vapour);
    font-size:11px;padding:7px 10px;flex:none}
  .words .addr button:hover{color:var(--foam);border-color:var(--foam)}
  .words .at{font-family:var(--mono);font-size:10.5px;letter-spacing:0.1em;color:var(--solid);margin:14px 0 0}

  .foot{max-width:1180px;margin:0 auto;padding:22px 18px 10px;font-family:var(--mono);font-size:11px;
    letter-spacing:0.05em;color:var(--vapour-dim);display:flex;gap:14px;flex-wrap:wrap;line-height:1.9}
  .foot a{border-bottom:none;color:var(--vapour-dim)} .foot a:hover{color:var(--liquid)}

  @media (prefers-reduced-motion:reduce){ .pic,.way .more span{transition:none} }
</style>
</head>
<body>
<script>document.documentElement.classList.remove('no-js');</script>

<div class="bar">
  <span class="dot"></span>
  <span><b>entrance</b> · six ways in</span>
  <span class="spacer"></span>
  <button id="btn-theme" title="light or dark">◐</button>
</div>

<header class="intro">
  <h1>Six ways <span class="cool">in.</span></h1>
  <p>Scroll through them all, then come back to whichever pulls. Nothing to join, no account.</p>
</header>

<main id="bands"><p class="loading">reading the entrance…</p></main>

<div class="foot">
  <a href="/explain?block=entrance2" target="_blank" rel="noopener">this page as a block on the beach →</a>
</div>

<script>
(function(){
'use strict';
const BEACH = 'https://beach.happyseaurchin.com/.well-known/pscale-beach';
const $ = id => document.getElementById(id);
const esc = s => { const d = document.createElement('span'); d.textContent = s == null ? '' : s; return d.innerHTML; };

/* The pictures are the page's own, keyed by the plate's address in entrance2:
   a photo fills the square; inks are line drawings masked in the two accents
   (teal and amber), so they follow light and dark; glyphs are set in type. */
const PICTURE = {
  '1.1': { photo: 'real.webp',    at: '50% 42%' },
  '1.2': { photo: 'fantasy.webp', at: '50% 50%' },
  '2.1': { photo: 'map.png',      at: '50% 45%' },
  '2.2': { glyphs: ['$', '€', '¥', '£'] },
  '3.1': { inks: ['meld-a.svg', 'meld-b.svg'] },
  '3.2': { inks: ['spiral-a.svg', 'spiral-b.svg'] }
};
/* one steady hue per band, soft in both registers (theme.css --fam-*) */
const HUE = { '1': 34, '2': 208, '3': 268 };

const loaded = {};
function readBlock(name){
  if (!loaded[name]) loaded[name] = fetch(BEACH + '?block=' + encodeURIComponent(name), { headers:{Accept:'application/json'}, cache:'no-store' })
    .then(r => r.status === 404 ? null : (r.ok ? r.json() : Promise.reject(new Error('beach read failed: ' + r.status))));
  return loaded[name];
}
function voiceOf(node){
  let n = node;
  while (n && typeof n === 'object') { if (!('_' in n)) return null; n = n['_']; }
  return typeof n === 'string' ? n : null;
}
function digitKeys(node){
  if (!node || typeof node !== 'object') return [];
  return Object.keys(node).filter(k => /^[1-9]$/.test(k)).sort((a,b) => a - b);
}
/* the block's own stated form: "label — the line". First em-dash only. */
function saying(text){
  const t = (text || '').trim();
  const i = t.indexOf(' — ');
  if (i < 0) return { lab: t, line: '' };
  return { lab: t.slice(0, i).trim(), line: t.slice(i + 3).trim() };
}
function firstSentence(s){
  const m = (s || '').match(/^[\s\S]*?[.!?](\s|$)/);
  return m ? m[0].trim() : (s || '').trim();
}
const leaf = (node, d) => (node && typeof node === 'object' && typeof node[d] === 'string') ? node[d].trim() : '';
/* a floor-1 address, written with its one decimal: "311" → "3.11" */
const addr = digits => digits.length > 1 ? digits[0] + '.' + digits.slice(1) : digits;

/* A PLATE OR A WAY WRITTEN AS AN ADDRESS is read from that address — the local
   reference grammar the substrate already speaks (bsp-mcp src/compile.ts):
   name:address, the address the final digit run, so a colon-bearing name keeps
   its colons. Anything else is taken as written; a reference that cannot be
   read degrades to its own words and never breaks the page. */
const REF = /^([a-z][a-z0-9-]*(?::[a-z][a-z0-9-]*)*):([1-9][0-9.]*)$/i;
async function resolve(value, home){
  if (typeof value !== 'string') return { node: value, name: home.name, at: home.at };
  const m = value.trim().match(REF);
  if (!m) return { node: value, name: home.name, at: home.at };
  const b = await readBlock(m[1]).catch(() => null);
  let n = b; const digits = m[2].replace(/\./g, '');
  for (const d of digits) n = (n && typeof n === 'object') ? n[d] : undefined;
  return n === undefined ? { node: value, name: home.name, at: home.at } : { node: n, name: m[1], at: digits };
}

function pictureHTML(at){
  const p = PICTURE[at];
  if (!p) return '<div class="pic"></div>';
  if (p.photo) return '<div class="pic photo" style="background-image:url(/assets/entrance2/' + p.photo + ');background-position:' + (p.at || 'center') + '"></div>';
  if (p.glyphs) return '<div class="pic art"><div class="glyphs" aria-hidden="true">' + p.glyphs.map(g => '<span>' + esc(g) + '</span>').join('') + '</div></div>';
  return '<div class="pic art">' + p.inks.map((f, i) => {
    const u = 'url(/assets/entrance2/' + f + ')';
    return '<div class="ink ' + (i ? 'b' : 'a') + '" style="-webkit-mask-image:' + u + ';mask-image:' + u + '"></div>';
  }).join('') + '</div>';
}

function wayHTML(way){
  const c = way.node, s = saying(voiceOf(c) || (typeof c === 'string' ? c : ''));
  const where = leaf(c,'1'), what = leaf(c,'2'), who = leaf(c,'3'), say = leaf(c,'4');
  const shut = !where;
  const out = where && !/^mailto:/i.test(where) ? ' target="_blank" rel="noopener"' : '';
  const inner = '<span class="l">' + esc(s.lab) + '</span>' + (s.line ? '<span class="f">' + esc(s.line) + '</span>' : '');
  return '<div class="way' + (shut ? ' shut' : '') + '" data-at="' + esc(way.self) + '">' +
    '<div class="row">' +
      (shut ? '<button type="button" class="go">' + inner + '</button>'
            : '<a class="go" href="' + esc(where) + '"' + out + '>' + inner + '</a>') +
      '<button type="button" class="more" aria-label="what this is"><span>⌄</span></button>' +
    '</div>' +
    '<div class="words">' +
      '<p><span class="chip ' + (shut ? '' : 'on') + '">' + (shut ? 'not open yet' : 'open') + '</span></p>' +
      (what ? '<p>' + esc(what) + '</p>' : '') +
      (who  ? '<p class="who">' + esc(who) + '</p>' : '') +
      (where ? '<div class="addr"><code>' + esc(where.replace(/^mailto:/i, '')) + '</code><button type="button" class="cp">copy</button></div>' : '') +
      (say && say !== where.replace(/^mailto:/i, '') ? '<p class="say">' + esc(say) + '</p>' : '') +
      '<p class="at">' + esc(way.name + ':' + addr(way.at)) + '</p>' +
    '</div>' +
  '</div>';
}

async function plateHTML(b, p, raw){
  const self = b + p;
  const plate = await resolve(raw, { name: 'entrance2', at: self });
  const s = saying(voiceOf(plate.node) || '');
  const first = firstSentence(s.line), rest = s.line.slice(first.length).trim();
  const ways = await Promise.all(digitKeys(plate.node).map(async k => {
    const w = await resolve(plate.node[k], { name: plate.name, at: plate.at + k });
    return wayHTML({ node: w.node, name: w.name, at: w.at, self: self + k });
  }));
  return '<article class="plate" id="p' + self + '" data-at="' + self + '">' +
    pictureHTML(addr(self)) +
    '<button type="button" class="face" aria-expanded="false" aria-controls="w' + self + '">' +
      '<span class="tap">' + ways.length + (ways.length === 1 ? ' way' : ' ways') + ' in</span>' +
      '<span class="lab">' + esc(s.lab) + '</span>' + (first ? '<span class="feel">' + esc(first) + '</span>' : '') +
    '</button>' +
    '<div class="ways" id="w' + self + '" role="group" aria-label="' + esc(s.lab) + ' — ways in">' +
      '<div class="ways-head"><div class="t"><b>' + esc(s.lab) + '</b>' + (rest || first ? '<span>' + esc(firstSentence(rest) || first) + '</span>' : '') + '</div>' +
        '<button type="button" class="x" aria-label="close">×</button></div>' +
      ways.join('') +
    '</div>' +
  '</article>';
}

async function render(block){
  const bands = await Promise.all(digitKeys(block).map(async b => {
    const band = block[b], s = saying(voiceOf(band));
    const plates = await Promise.all(digitKeys(band).map(p => plateHTML(b, p, band[p])));
    return '<section class="band" style="--fam-h:' + (HUE[b] || 190) + '" data-at="' + b + '">' +
      '<div class="band-in">' +
        '<header class="band-head"><h2>' + esc(s.lab) + '</h2>' + (s.line ? '<p>' + esc(s.line) + '</p>' : '') + '</header>' +
        '<div class="pair">' + plates.join('') + '</div>' +
      '</div></section>';
  }));
  $('bands').innerHTML = bands.join('');
}

/* ONE PLATE OPEN AT A TIME — a page of frosted squares is a page of nothing. */
function openPlate(el, focus){
  document.querySelectorAll('.plate.open').forEach(o => { if (o !== el) closePlate(o); });
  el.style.minHeight = el.getBoundingClientRect().height + 'px';   /* keep the square it was */
  el.classList.add('open');
  el.querySelector('.face').setAttribute('aria-expanded', 'true');
  history.replaceState(null, '', '?at=' + addr(el.dataset.at));
  if (focus) { const f = el.querySelector('.way .go'); if (f) f.focus({ preventScroll: true }); }
}
function closePlate(el){
  el.classList.remove('open');
  el.style.minHeight = '';
  el.querySelectorAll('.way.open').forEach(w => w.classList.remove('open'));
  const face = el.querySelector('.face'); face.setAttribute('aria-expanded', 'false');
  if (!document.querySelector('.plate.open')) history.replaceState(null, '', location.pathname);
  return face;
}

$('bands').addEventListener('click', e => {
  const plate = e.target.closest('.plate'); if (!plate) return;
  if (e.target.closest('.face')) { openPlate(plate, true); return; }
  if (e.target.closest('.x')) { closePlate(plate).focus(); return; }
  const way = e.target.closest('.way');
  if (!way) { if (e.target.closest('.ways') && !e.target.closest('.ways-head')) closePlate(plate); return; }
  if (e.target.closest('.cp')){
    const b = e.target.closest('.cp'), code = way.querySelector('.addr code');
    navigator.clipboard.writeText(code.textContent.trim()).then(
      () => { b.textContent = 'copied'; setTimeout(() => b.textContent = 'copy', 1600); }, () => {});
    return;
  }
  if (e.target.closest('.more')) { way.classList.toggle('open'); return; }
  const go = e.target.closest('.go');
  if (go && go.tagName !== 'A') way.classList.add('open');   /* a way not open yet explains itself */
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  const open = document.querySelector('.plate.open');
  if (open) closePlate(open).focus();
});

readBlock('entrance2').then(async b => {
  if (!b) { $('bands').innerHTML = '<p class="loading">the entrance is not published yet.</p>'; return; }
  await render(b);
  /* ?at=<address> — a plate's address IS the page's query, and a way's address
     opens its words too, so an email can link one way in with no route of its own. */
  const at = (new URLSearchParams(location.search).get('at') || '').replace(/[^0-9]/g, '');
  if (at.length >= 2){
    const plate = $('p' + at.slice(0, 2));
    if (plate){
      openPlate(plate, false);
      const way = at.length >= 3 ? plate.querySelector('.way[data-at="' + at.slice(0, 3) + '"]') : null;
      if (way) way.classList.add('open');
      plate.scrollIntoView({ block: 'center' });
    }
  } else if (at.length === 1){
    const band = document.querySelector('.band[data-at="' + at + '"]');
    if (band) band.scrollIntoView({ block: 'start' });
  }
}).catch(e => { $('bands').innerHTML = '<p class="loading">' + esc('could not read the entrance: ' + e.message) + '</p>'; });

/* the go menu is a handle's own menu — only for a walker who arrived carrying one */
const CARRIED = (new URLSearchParams(location.search).get('h') || '').replace(/[^a-z0-9 _-]/gi,'').trim() || null;
if (CARRIED && window.siteDoors) siteDoors({ handle: CARRIED, here: 'entrance' });
})();
</script>
</body>
</html>
