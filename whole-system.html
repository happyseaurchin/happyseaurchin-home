<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A whole system</title>
<meta name="description" content="One person's whole system: how they understand things to fit together, in their own structure and their own words, read live from the beach. What a mind meld reads.">
<meta property="og:type" content="website">
<meta property="og:title" content="A whole system">
<meta property="og:description" content="One person's whole system, in their own structure and their own words: what a mind meld reads.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Space+Mono:wght@400;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme.css">
<script src="/theme.js"></script>
<!-- /whole-system/<handle>, and /systemic-fulcrum for David's: the standard reader of one person's whole system,
     whole-system:<handle> on the beach (else the older solution-set:<handle>), drawn as it stands: its opening,
     then each part one tap deep, every address behind a switch. Put up the evening of 17 November 2026 by weft,
     lane tranche.2, at David's word, from keel's correction on thread 49 (pool:weft 623): a meld reads two whole
     systems, so each needs a page a person can read. Everything is read live; the page writes nothing. -->
<style>
  *{box-sizing:border-box} html,body{margin:0}
  body{font-family:var(--body);color:var(--foam);font-size:17.5px;line-height:1.6;
    background:radial-gradient(1100px 560px at 70% -10%, rgba(var(--liquid-rgb),0.10), transparent 60%),
      linear-gradient(180deg,var(--ground-top) 0%, var(--deep) 30%, var(--abyss) 100%);
    background-attachment:fixed;-webkit-font-smoothing:antialiased;min-height:100dvh}
  a{color:var(--liquid);text-decoration:none;border-bottom:1px solid rgba(var(--liquid-rgb),0.35)}
  a:hover{color:var(--foam);border-color:var(--foam)}
  .wrap{max-width:860px;margin:0 auto;padding:0 18px 80px}
  .bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 0 10px;
    font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:var(--vapour-dim)}
  .bar > span{flex:1}
  .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--vapour-dim);margin:18px 0 6px}
  h1{font-family:var(--display);font-weight:800;font-size:clamp(2rem,8vw,3.1rem);line-height:1.05;margin:0 0 14px;overflow-wrap:anywhere}
  .lede{font-size:18.5px;margin:0 0 14px}
  .marks{color:var(--vapour-dim);font-size:15px;margin:0 0 18px;padding:10px 14px;border-left:2px solid var(--line-strong)}
  .acts{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 30px}
  .acts a{font-family:var(--mono);font-size:13px;border:1px solid var(--liquid);border-radius:6px;padding:7px 13px}
  .acts a.quiet{border-color:var(--line-strong);color:var(--vapour)}
  .switch{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;color:var(--vapour-dim);cursor:pointer}
  .part{border-top:1px solid var(--line);padding:22px 0 8px}
  .part > .head{font-family:var(--display);font-weight:700;font-size:1.05rem;letter-spacing:.04em;line-height:1.3;margin:0 0 8px;overflow-wrap:anywhere}
  .part > p{margin:0 0 12px;overflow-wrap:anywhere}
  details{margin:6px 0 6px;border-left:2px solid var(--line);padding:2px 0 2px 14px}
  details[open]{border-left-color:rgba(var(--liquid-rgb),0.6)}
  summary{cursor:pointer;font-size:16.5px;line-height:1.45;color:var(--foam);overflow-wrap:anywhere}
  summary .h{font-family:var(--mono);font-size:12.5px;letter-spacing:.05em;color:var(--liquid)}
  details > p{margin:8px 0 10px;font-size:16.5px;color:var(--vapour);overflow-wrap:anywhere}
  .addr{display:none;font-family:var(--mono);font-size:11px;color:var(--vapour-dim);margin-left:8px}
  body.addrs .addr{display:inline}
  .note{color:var(--vapour-dim);font-size:15.5px}
  .foot{font-family:var(--mono);font-size:11px;color:var(--vapour-dim);margin:48px 0 0;line-height:1.9;overflow-wrap:anywhere}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar"><span>a whole system</span><label class="switch"><input type="checkbox" id="addrs"> addresses</label></div>
  <div class="eyebrow" id="eyebrow">A whole system</div>
  <h1 id="title">Reading…</h1>
  <p class="lede" id="lede"></p>
  <p class="marks" id="marks" hidden></p>
  <div class="acts" id="acts"></div>
  <div id="parts"><p class="note">Reading it from the beach…</p></div>
  <p class="foot" id="foot"></p>
</div>
<script>
(function () {
  'use strict';
  var BEACH = 'https://beach.happyseaurchin.com/.well-known/pscale-beach';
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function linkify(s) { return esc(s).replace(/https?:\/\/[^\s<]+[^\s<.,;:)]/g, function (u) { return '<a href="' + u + '" rel="noopener">' + u + '</a>'; }); }
  function voice(n) { while (n && typeof n === 'object') { if (!('_' in n)) return null; n = n._; } return typeof n === 'string' ? n : null; }
  function headOf(t) { var i = String(t || '').indexOf(' — '); return i > 0 && i < 90 ? { head: t.slice(0, i), body: t.slice(i + 3) } : { head: '', body: t || '' }; }

  /* whose: /systemic-fulcrum is David's; /whole-system/<handle>; else ?h=<handle> */
  var path = location.pathname.replace(/\.html$/, '').replace(/\/+$/, '');
  var m = /^\/whole-system\/([A-Za-z0-9][A-Za-z0-9_-]{0,31})$/.exec(path);
  var q = /[?&]h=([A-Za-z0-9][A-Za-z0-9_-]{0,31})(?:[&#]|$)/.exec(location.search);
  var H = /^\/systemic-fulcrum$/.test(path) ? 'happyseaurchin' : m ? m[1] : q ? q[1] : '';

  try { if (localStorage.getItem('whole-system:addrs') === '1') { $('addrs').checked = true; document.body.classList.add('addrs'); } } catch (e) {}
  $('addrs').addEventListener('change', function () {
    document.body.classList.toggle('addrs', this.checked);
    try { localStorage.setItem('whole-system:addrs', this.checked ? '1' : '0'); } catch (e) {}
  });

  function read(name) {
    return fetch(BEACH + '?block=' + encodeURIComponent(name), { headers: { Accept: 'application/json' }, cache: 'no-store' })
      .then(function (r) { if (r.status === 404) return null; if (!r.ok) throw new Error('beach ' + r.status); return r.json(); });
  }
  function addr(path) { return path.length > 1 ? path[0] + '.' + path.slice(1) : path; }

  /* a part one tap deep: its heading and words, then each part beneath it, as deep as it goes */
  function inner(node, path) {
    var out = '';
    for (var d = 1; d <= 9; d++) {
      var c = node && typeof node === 'object' ? node[String(d)] : undefined;
      if (c == null) continue;
      var p = path + d, t = typeof c === 'string' ? c : (voice(c) || ''), h = headOf(t);
      var label = h.head ? '<span class="h">' + esc(h.head) + '</span>' + (h.body ? ' ' + esc(h.body.length > 140 ? h.body.slice(0, 140).replace(/\s+\S*$/, '') + ' …' : h.body) : '') : esc(t.length > 160 ? t.slice(0, 160).replace(/\s+\S*$/, '') + ' …' : t);
      out += '<details id="a-' + p + '"><summary>' + label + '<span class="addr">' + addr(p) + '</span></summary>' +
        '<p>' + linkify(t) + '</p>' + (typeof c === 'object' ? inner(c, p) : '') + '</details>';
    }
    return out;
  }
  function draw(b, block) {
    var root = voice(b) || '', h = headOf(root);
    var title = h.head ? h.head.charAt(0) + h.head.slice(1).toLowerCase() : (H || 'A whole system');
    if (h.head && /\s/.test(h.head)) title = h.head;
    $('title').textContent = title;
    document.title = title + ' · a whole system';
    $('eyebrow').textContent = 'A whole system · ' + H;
    $('lede').innerHTML = linkify(h.head ? h.body : root);
    var marks = '', parts = '';
    for (var d = 1; d <= 9; d++) {
      var c = b[String(d)]; if (c == null) continue;
      var t = typeof c === 'string' ? c : (voice(c) || ''), hh = headOf(t);
      if (/^WHOSE SYSTEM/.test(hh.head || '')) marks = hh.body;
      parts += '<section class="part" id="a-' + d + '"><div class="head">' + esc(hh.head || ('Part ' + d)) + '<span class="addr">' + d + '</span></div>' +
        '<p>' + linkify(hh.head ? hh.body : t) + '</p>' + (typeof c === 'object' ? inner(c, String(d)) : '') + '</section>';
    }
    if (marks) { $('marks').hidden = false; $('marks').innerHTML = linkify(marks); }
    $('parts').innerHTML = parts || '<p class="note">Only its opening stands so far.</p>';
    var acts = '<a href="/mind-meld' + (H === 'happyseaurchin' ? '' : '?with=' + encodeURIComponent(H)) + '">Meld with ' + esc(H === 'happyseaurchin' ? 'David' : H) + '</a>';
    if (H === 'happyseaurchin') acts += '<a class="quiet" href="https://crumful.com/spine">Read the book</a>';
    acts += '<a class="quiet" href="/view/whole-systems">Every whole system</a>';
    $('acts').innerHTML = acts;
    $('foot').innerHTML = 'Read as the page opens from <a href="/explain?block=' + encodeURIComponent(block) + '">' + esc(block) + '</a> at beach.happyseaurchin.com. The page writes nothing. A meld reads this block beside another person’s whole system, region by region across <a href="/systemic-kernel">the systemic kernel</a>.';
    if (location.hash) { var el = document.getElementById(location.hash.slice(1)); if (el) { var x = el; while (x && x.tagName) { if (x.tagName === 'DETAILS') x.open = true; x = x.parentNode; } el.scrollIntoView({ block: 'start' }); } }
  }
  function none(msg) {
    $('title').textContent = H ? H : 'A whole system';
    $('parts').innerHTML = '<p class="note">' + msg + '</p>';
    $('acts').innerHTML = '<a href="/mind-meld">Write yours at the mind-meld</a><a class="quiet" href="/view/whole-systems">Every whole system</a>';
  }

  if (!H) { none('Name whose whole system to read: /whole-system/<their name>. Every one on the beach is listed at <a href="/view/whole-systems">/view/whole-systems</a>.'); return; }
  read('whole-system:' + H).then(function (b) {
    if (b && voice(b)) return draw(b, 'whole-system:' + H);
    return read('solution-set:' + H).then(function (o) {
      if (o && voice(o)) return draw(o, 'solution-set:' + H);
      none('No whole system stands for ' + esc(H) + ' on the beach yet.');
    });
  }).catch(function () {
    none('The beach couldn’t be read just now.' + (H === 'happyseaurchin' ? ' David’s book is at <a href="https://crumful.com/spine">crumful.com/spine</a>.' : ''));
  });
})();
</script>
<script>if (window.siteDoors) siteDoors({ here: 'whole-system', site: true });</script>
</body>
</html>
