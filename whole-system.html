<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Whole systems</title>
<meta name="description" content="Whole systems on the beach: how a person, or an AI, understands things to fit together, in their own shape and their own words. A mind meld reads two side by side. Each is drawn here plainly from its block, and some also have a page made for people.">
<link rel="canonical" href="https://happyseaurchin.com/whole-system">
<meta property="og:type" content="website">
<meta property="og:title" content="Whole systems">
<meta property="og:description" content="How a person, or an AI, understands things to fit together, in their own shape and their own words: what a mind meld reads, two side by side.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Space+Mono:wght@400;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme.css">
<script src="/theme.js"></script>
<!-- /whole-system: every whole system on the beach, read from the list block whole-systems (a line each,
     '<handle> — what · <page>', kept like the proposals list), each card with two buttons: Snazzy, the page its
     holder made for people, where the line names one, and Standard. /whole-system/<handle> is the standard view,
     whole-system:<handle> (else the older solution-set:<handle>) drawn as it stands: its opening, its parts as a
     contents list and as sections, everything beneath a part one tap down, every address behind a switch.
     Put up 17 November 2026 by weft, lane tranche.2, at David's word ('like proposals … a block of whole-systems').
     Everything is read live; the page writes nothing. -->
<style>
  *{box-sizing:border-box} html,body{margin:0} [hidden]{display:none !important}
  body{font-family:var(--body);color:var(--foam);font-size:17.5px;line-height:1.6;
    background:radial-gradient(1100px 560px at 70% -10%, rgba(var(--liquid-rgb),0.10), transparent 60%),
      linear-gradient(180deg,var(--ground-top) 0%, var(--deep) 30%, var(--abyss) 100%);
    background-attachment:fixed;-webkit-font-smoothing:antialiased;min-height:100dvh}
  a{color:var(--liquid);text-decoration:none;border-bottom:1px solid rgba(var(--liquid-rgb),0.35)}
  a:hover{color:var(--foam);border-color:var(--foam)}
  code{font-family:var(--mono);font-size:.86em}
  .wrap{max-width:900px;margin:0 auto;padding:0 18px 80px}
  .bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 0 10px;
    font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:var(--vapour-dim)}
  .bar > span{flex:1}
  .bar b{color:var(--foam);font-weight:400}
  .bar a{border-bottom:none;color:var(--vapour-dim)} .bar a:hover{color:var(--liquid)}
  .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--vapour-dim);margin:18px 0 6px}
  .eyebrow a{border-bottom:none;color:inherit} .eyebrow a:hover{color:var(--liquid)}
  h1{font-family:var(--display);font-weight:800;font-size:clamp(2rem,7vw,3rem);line-height:1.06;margin:0 0 14px;overflow-wrap:anywhere}
  h1.long{font-size:clamp(1.55rem,5.2vw,2.3rem);line-height:1.12}
  .lede{font-size:18.5px;margin:0 0 14px;max-width:70ch;overflow-wrap:anywhere}
  .lede p{margin:0 0 6px}
  .more{margin:4px 0 0}
  .more summary{font-family:var(--mono);font-size:12px;letter-spacing:.04em;color:var(--liquid);cursor:pointer}
  .more p{margin:8px 0 0}
  .lede .more p{font-size:17px;color:var(--vapour)}
  .sub{color:var(--vapour);margin:0 0 18px;max-width:70ch}
  .marks{color:var(--vapour-dim);font-size:15px;margin:0 0 18px;padding:8px 14px;border-left:2px solid var(--line-strong);max-width:70ch;overflow-wrap:anywhere}
  .marks p{margin:0}
  .acts{display:flex;flex-wrap:wrap;gap:10px;margin:4px 0 26px}
  .acts:empty{display:none}
  .btn{display:inline-block;font-family:var(--mono);font-size:13px;line-height:1.3;border:1px solid var(--liquid);border-radius:6px;padding:8px 14px;color:var(--liquid)}
  .btn:hover{border-color:var(--foam)}
  .btn.snazzy{background:var(--liquid);color:var(--abyss);border-color:var(--liquid)}
  .btn.snazzy:hover{background:var(--foam);border-color:var(--foam);color:var(--abyss)}
  .btn.quiet{border-color:var(--line-strong);color:var(--vapour)}
  .switch{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
  /* the contents: the block's parts, one line each */
  .toc{margin:0 0 30px;padding:14px 16px 12px;border:1px solid var(--line);border-radius:12px;background:rgba(var(--card-rgb),0.35)}
  .toc h2{display:flex;align-items:center;gap:12px;font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--vapour-dim);margin:0 0 8px;font-weight:400}
  .toc h2 > span{flex:1}
  .toc .switch{text-transform:none;letter-spacing:.04em}
  .toc ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:2px 20px}
  .toc li a{border-bottom:none;color:var(--foam);display:flex;gap:10px;padding:4px 0;font-size:16px;line-height:1.35}
  .toc li a:hover{color:var(--liquid)}
  .toc .n{font-family:var(--mono);font-size:12px;color:var(--liquid);min-width:1.1em;padding-top:2px}
  /* a part, and what is beneath it */
  .part{border-top:1px solid var(--line);padding:24px 0 10px;scroll-margin-top:16px}
  .part h2{font-family:var(--display);font-weight:700;font-size:clamp(1.25rem,4.2vw,1.55rem);line-height:1.2;margin:0 0 10px;overflow-wrap:anywhere}
  .part h2 .n{font-family:var(--mono);font-size:13px;font-weight:400;color:var(--liquid);margin-right:10px;vertical-align:2px}
  .part > p{margin:0 0 14px;max-width:70ch;overflow-wrap:anywhere}
  details,.leaf{margin:5px 0;border-left:2px solid var(--line);padding:3px 0 3px 14px;max-width:72ch}
  details[open]{border-left-color:rgba(var(--liquid-rgb),0.6)}
  summary{cursor:pointer;font-size:16.5px;line-height:1.45;color:var(--foam);overflow-wrap:anywhere}
  summary .h{font-weight:600}
  details > p{margin:6px 0 10px;font-size:16.5px;color:var(--vapour);overflow-wrap:anywhere}
  .leaf{font-size:16.5px;line-height:1.5;color:var(--vapour);overflow-wrap:anywhere}
  .leaf b{color:var(--foam);font-weight:600}
  .addr{display:none;font-family:var(--mono);font-size:11px;font-weight:400;color:var(--vapour-dim);margin-left:8px;letter-spacing:0}
  body.addrs .addr{display:inline}
  .ref{font-family:var(--mono);font-size:.8em;color:var(--vapour-dim)}
  /* the list */
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin:6px 0 36px}
  .card{display:flex;flex-direction:column;background:linear-gradient(165deg,rgba(var(--card-hi-rgb),0.55) 0%,rgba(var(--card-rgb),0.55) 100%);border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px}
  .card .no{font-family:var(--mono);font-size:11px;color:var(--vapour-dim);letter-spacing:.06em}
  .card h3{font-family:var(--display);font-weight:700;font-size:1.3rem;line-height:1.15;margin:2px 0 8px;overflow-wrap:anywhere}
  .card h3 a{border-bottom:none;color:var(--foam)} .card h3 a:hover{color:var(--liquid)}
  .card .what{margin:0 0 14px;font-size:15.5px;line-height:1.5;color:var(--vapour);flex:1;overflow-wrap:anywhere}
  .card .btns{display:flex;flex-wrap:wrap;gap:8px}
  .card .btn{font-size:12.5px;padding:6px 12px}
  .card .meld{margin:12px 0 0;font-family:var(--mono);font-size:12px}
  .card .meld a{border-bottom:none}
  .yours{border-top:1px solid var(--line);padding:24px 0 0}
  .yours h2{font-family:var(--display);font-weight:700;font-size:1.35rem;margin:0 0 8px}
  .yours p{max-width:70ch;margin:0 0 12px}
  .copyline{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;margin:6px 0 14px}
  .copyline code{flex:1 1 280px;font-size:13px;line-height:1.55;background:rgba(var(--card-rgb),0.6);border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:var(--foam);overflow-wrap:anywhere}
  .copyline button{font-family:var(--mono);font-size:12.5px;border:1px solid var(--liquid);border-radius:6px;background:none;color:var(--liquid);padding:9px 14px;cursor:pointer}
  .copyline button:hover{border-color:var(--foam);color:var(--foam)}
  .note{color:var(--vapour-dim);font-size:15.5px}
  .foot{font-family:var(--mono);font-size:11.5px;color:var(--vapour-dim);margin:48px 0 0;line-height:1.9;overflow-wrap:anywhere}
  .foot p{margin:0 0 8px}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar"><span>whole systems · <b id="bar-name">every one</b></span></div>
  <main id="main">
    <div class="eyebrow" id="eyebrow">Whole systems</div>
    <h1 id="title">Whole systems</h1>
    <div class="lede" id="lede"></div>
    <div class="marks" id="marks" hidden></div>
    <div class="acts" id="acts"></div>
    <nav class="toc" id="toc" hidden></nav>
    <div id="body"><p class="note">Reading it from the beach…</p></div>
  </main>
  <footer class="foot" id="foot"></footer>
</div>
<script>
(function () {
  'use strict';
  var BEACH = 'https://beach.happyseaurchin.com/.well-known/pscale-beach';
  var LIST = 'whole-systems';
  var LINE = 'Read function:systemic-kernel at https://beach.happyseaurchin.com and follow its 4.1 with me: find or write my whole system.';
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function voice(n) { while (n && typeof n === 'object') { if (!('_' in n)) return null; n = n._; } return typeof n === 'string' ? n : null; }
  function textOf(n) { return typeof n === 'string' ? n.trim() : (voice(n) || '').trim(); }
  function readBlock(name) {
    return fetch(BEACH + '?block=' + encodeURIComponent(name), { headers: { Accept: 'application/json' }, cache: 'no-store' })
      .then(function (r) { if (r.status === 404) return null; if (!r.ok) throw new Error('the beach answered ' + r.status); return r.json(); });
  }

  /* whose: /whole-system/<handle>, else ?h=<handle>; the bare address is the list. /systemic-fulcrum is sent to
     David's by a redirect until his snazzy page takes that address; read here too, for a copy served without it */
  var path = location.pathname.replace(/\.html$/, '').replace(/\/+$/, '');
  var m = /^\/whole-system\/([A-Za-z0-9][A-Za-z0-9_-]{0,31})$/.exec(path);
  var q = /[?&]h=([A-Za-z0-9][A-Za-z0-9_-]{0,31})(?:[&#]|$)/.exec(location.search);
  var H = /^\/systemic-fulcrum$/.test(path) ? 'happyseaurchin' : m ? m[1] : q ? q[1] : '';

  /* ── the list: whole-systems, an accumulator read at any floor (proposal.html's own walk) ── */
  function listed(b) {
    var floor = 1, n = b, out = [];
    while (n && typeof n === 'object' && n._ && typeof n._ === 'object') { floor++; n = n._; }
    (function walk(n, depth) {
      if (depth === floor) { var t = textOf(n); if (t) out.push(t); return; }
      if (!n || typeof n !== 'object') return;
      if (n._ && typeof n._ === 'object') walk(n._, depth + 1);
      for (var d = 1; d <= 9; d++) if (n[String(d)] != null) walk(n[String(d)], depth + 1);
    })(b, 0);
    return out;
  }
  /* a page of this site opens on whichever copy of the site is serving */
  function pageHref(u) {
    if (!u) return '';
    var x = /^https?:\/\//i.test(u) ? u : 'https://' + u;
    var own = /^https?:\/\/(?:www\.)?happyseaurchin\.com(\/\S*)?$/i.exec(x);
    return own ? (own[1] || '/') : x;
  }
  /* a line: '<handle> — what it is · <its page>', the page only where its holder has made one */
  function lineOf(t) {
    var mm = /^\s*([A-Za-z0-9][A-Za-z0-9_-]{0,31})\s+—\s+([\s\S]+?)\s*$/.exec(t); if (!mm) return null;
    var what = mm[2], page = '', p = /\s+·\s+((?:https?:\/\/|(?:[a-z0-9-]+\.)+[a-z]{2,}\/)\S*)$/i.exec(what);
    if (p) { page = p[1].replace(/[.,;]+$/, ''); what = what.slice(0, p.index).trim(); }
    return { h: mm[1], what: what, page: pageHref(page) };
  }
  function linesOf(b) { return b ? listed(b).map(lineOf).filter(Boolean) : []; }
  function meldHref(h) { return h === 'happyseaurchin' ? '/mind-meld' : '/mind-meld?with=' + encodeURIComponent(h); }
  function meldName(h) { return h === 'happyseaurchin' ? 'David' : h; }

  /* ── headings as the text writes them (proposal.html's own learner): a heading on the beach is often in
     capitals; on the page each word is set as the block itself writes it mid-sentence, the commonest way winning ── */
  var CASES = {};
  var SMALL = /^(?:a|an|the|of|and|or|in|on|at|to|for|by|with|from|is|it|as|its|be|this|that|what|who|how|why|where|when|we|you|your|our|their|they|next|now|not|no|yet|one|two|three|first|all|each|every|most|has|have|do|does)$/i;
  function learnCase(text) {
    var re = /[A-Za-z][A-Za-z’'\-]*[A-Za-z]/g, mm, toks = [];
    while ((mm = re.exec(text))) toks.push([mm[0], mm.index]);
    function caps(w) { return w === w.toUpperCase(); }
    for (var j = 0; j < toks.length; j++) {
      var w = toks[j][0], at = toks[j][1], p = toks[j - 1], n = toks[j + 1];
      if (/[\/:]/.test(text.charAt(at - 1)) || /^(?::|\/|\.\d)/.test(text.slice(at + w.length, at + w.length + 2))) continue;
      if (caps(w)) {
        if ((p && caps(p[0]) && at - (p[1] + p[0].length) <= 3) || (n && caps(n[0]) && n[1] - (at + w.length) <= 3)) continue;
      } else if (/^[A-Z]/.test(w) && (at === 0 || /(?:[.?!]\s+|—\s+|["{(]\s*)$/.test(text.slice(Math.max(0, at - 3), at)))) continue;
      var c = CASES[w.toUpperCase()] || (CASES[w.toUpperCase()] = {});
      c[w] = (c[w] || 0) + 1;
    }
  }
  /* a heading in capitals before its ' — ' says nothing of how a word is written, so it is not learnt from */
  function learn(b) {
    (function walk(n) {
      if (typeof n === 'string') { var c = /^[^a-z]{2,80}? — /.exec(n); learnCase(c ? n.slice(c[0].length) : n); return; }
      if (!n || typeof n !== 'object') return;
      Object.keys(n).forEach(function (k) { walk(n[k]); });
    })(b);
  }
  function formOf(k) {
    var c = CASES[k], best = '', n = 0;
    if (c) Object.keys(c).forEach(function (f) { if (c[f] > n || (c[f] === n && f !== f.toUpperCase())) { best = f; n = c[f]; } });
    return best;
  }
  function sentenceCase(t) {
    var first = true;
    return String(t || '').replace(/[A-Za-z][A-Za-z’'\-]*/g, function (w) {
      var out = w;
      if (w === w.toUpperCase()) out = (!SMALL.test(w) && formOf(w)) || w.toLowerCase();
      if (first) { out = out.charAt(0).toUpperCase() + out.slice(1); first = false; }
      return out;
    });
  }
  /* a heading in capitals is set word by word; each part of 'VOLUME 0 · RELIGION' opens with a capital */
  function cased(h) { return /[a-z]/.test(h) ? h : h.split(' · ').map(sentenceCase).join(' · '); }
  /* words that open with a lone lowercase word take a capital once their heading is lifted off them */
  function capFirst(t) { return /^[a-z]+(?=[\s,;:.)!?]|$)/.test(t) ? t.charAt(0).toUpperCase() + t.slice(1) : t; }

  /* a part's heading as its own words give it: a heading in capitals before its ' — ' (FULCRUM '25: RECTA & VERSA);
     else what stands before the first ' — ', ': ' or '. ', when that comes early; a short part is its own heading */
  function heading(t) {
    t = String(t || '').trim();
    var caps = /^([^a-z]{2,80}?) — /.exec(t);
    if (caps) return { head: cased(caps[1]), body: capFirst(t.slice(caps[0].length).trim()) };
    var seps = [' — ', ': ', '. '], at = -1, sep = '';
    seps.forEach(function (s) { var i = t.indexOf(s); if (i > 0 && i <= 80 && (at < 0 || i < at)) { at = i; sep = s; } });
    if (at > 0) return { head: cased(t.slice(0, at).replace(/[.:]$/, '')), body: capFirst(t.slice(at + sep.length).trim()) };
    if (t.length <= 90) return { head: cased(t.replace(/\.$/, '')), body: '' };
    var s = /^([\s\S]{20,140}?[.!?])\s+([\s\S]+)$/.exec(t);
    if (s) return { head: s[1].replace(/\.$/, ''), body: s[2] };
    return { head: t.split(/\s+/).slice(0, 9).join(' ') + ' …', body: t, teaser: true };
  }

  /* a block's words for a person: its references as small marks, its links as links (proposal.html's own) */
  function rich(t) {
    var h = esc(t);
    h = h.replace(/\[([^\]\n]{1,160})\]/g, '<span class="ref">$1</span>');
    h = h.replace(/\bhttps?:\/\/[^\s<>"')\]]+/g, function (u) { var c = u.replace(/[.,;:!?]+$/, ''); return '<a href="' + c + '" rel="noopener">' + c.replace(/^https?:\/\//, '') + '</a>' + u.slice(c.length); });
    h = h.replace(/(^|[\s(])((?:[a-z0-9-]+\.)?(?:happyseaurchin\.com|onen\.ai)\/[^\s<>"')\],;]*)/g, function (all, pre, u) { var c = u.replace(/[.:!?]+$/, ''); return pre + '<a href="https://' + c + '">' + c + '</a>' + u.slice(c.length); });
    return h;
  }
  function addr(p) { return p.length > 1 ? p.charAt(0) + '.' + p.slice(1) : p; }

  /* ── the standard view ── */
  /* every address behind a switch, the choice kept on this device */
  function bindAddrs() {
    var box = $('addrs'); if (!box) return;
    try { if (localStorage.getItem('whole-system:addrs') === '1') { box.checked = true; document.body.classList.add('addrs'); } } catch (e) {}
    box.addEventListener('change', function () {
      document.body.classList.toggle('addrs', this.checked);
      try { localStorage.setItem('whole-system:addrs', this.checked ? '1' : '0'); } catch (e) {}
    });
  }
  /* a long opening shows its first sentences, the rest one tap down */
  function clipAt(t, n) {
    var re = /[.!?]["')\]]?\s+(?=[A-Z0-9"“‘'(])/g, mm, cut = -1;
    while ((mm = re.exec(t))) { var end = mm.index + mm[0].length; if (end > n && cut > 0) break; cut = end; if (end > n) break; }
    if (cut < 0 || t.length - cut < 40) return { head: t, rest: '' };
    return { head: t.slice(0, cut).trim(), rest: t.slice(cut).trim() };
  }
  function folded(t, n, label) {
    var c = clipAt(String(t || '').trim(), n);
    return '<p>' + rich(c.head) + '</p>' + (c.rest ? '<details class="more"><summary>' + label + '</summary><p>' + rich(c.rest) + '</p></details>' : '');
  }

  /* everything beneath a part, one tap down: a short line stands as it is; a longer one, or one with parts of
     its own, folds under its heading, its words inside never repeating the heading */
  function beneath(node, path) {
    var out = '';
    for (var d = 1; d <= 9; d++) {
      var c = node && typeof node === 'object' ? node[String(d)] : undefined;
      if (c == null) continue;
      var p = path + d, t = textOf(c), kids = typeof c === 'object' ? beneath(c, p) : '';
      if (!t && !kids) continue;
      var s = heading(t), a = '<span class="addr">' + addr(p) + '</span>';
      if (!kids && t.length <= 200) {
        out += '<div class="leaf" id="a-' + p + '">' + (s.body ? '<b>' + esc(s.head) + '</b> ' + rich(s.body) : rich(t)) + a + '</div>';
      } else {
        out += '<details id="a-' + p + '"><summary><span class="h">' + esc(s.head) + '</span>' + a + '</summary>' +
          (s.body ? '<p>' + rich(s.body) + '</p>' : '') + kids + '</details>';
      }
    }
    return out;
  }
  function drawSystem(b, block, L) {
    learn(b);
    var root = heading(textOf(b)), title = root.teaser ? H : root.head || H;
    document.title = title + ' · a whole system';
    $('bar-name').textContent = H;
    $('eyebrow').innerHTML = '<a href="/whole-system">Whole systems</a> · ' + esc(H);
    $('title').textContent = title;
    $('title').classList.toggle('long', title.length > 26);
    $('lede').innerHTML = folded(root.teaser ? textOf(b) : root.body, 460, 'The rest of its opening');
    var marks = '', toc = '', parts = '';
    for (var d = 1; d <= 9; d++) {
      var c = b[String(d)]; if (c == null) continue;
      var t = textOf(c), s = heading(t);
      /* whose system and whose hand: lifted under the title, once */
      if (/^whose (?:system|hand)/i.test(s.head)) { marks = s.body || t; continue; }
      toc += '<li><a href="#a-' + d + '"><span class="n">' + d + '</span><span>' + esc(s.head) + '</span></a></li>';
      parts += '<section class="part" id="a-' + d + '"><h2><span class="n">' + d + '</span>' + esc(s.head) + '</h2>' +
        (s.body ? '<p>' + rich(s.body) + '</p>' : '') + (typeof c === 'object' ? beneath(c, String(d)) : '') + '</section>';
    }
    if (marks) { $('marks').hidden = false; $('marks').innerHTML = folded(marks, 140, 'Whose hand wrote it'); }
    if (toc) {
      $('toc').hidden = false;
      $('toc').innerHTML = '<h2><span>Its parts</span><label class="switch"><input type="checkbox" id="addrs"> addresses</label></h2><ol>' + toc + '</ol>';
      bindAddrs();
    }
    $('body').innerHTML = parts || '<p class="note">Only its opening stands so far.</p>';
    /* two buttons, two addresses, each always itself: its snazzy page, where the list names one; this, the standard */
    var acts = '';
    if (L && L.page) acts += '<a class="btn snazzy" href="' + esc(L.page) + '">Snazzy</a>';
    acts += '<a class="btn" href="' + meldHref(H) + '">Meld with ' + esc(meldName(H)) + '</a>';
    if (H === 'happyseaurchin') acts += '<a class="btn quiet" href="https://crumful.com/spine">Read the book</a>';
    acts += '<a class="btn quiet" href="/whole-system">Every whole system</a>';
    $('acts').innerHTML = acts;
    $('foot').innerHTML = '<p>The standard view, read live from <a href="/explain?block=' + encodeURIComponent(block) + '">' + esc(block) + '</a> on the beach; the page writes nothing. A whole system is written for an AI to read: a <a href="' + meldHref(H) + '">mind meld</a> reads it beside another, region by region across <a href="/systemic-kernel">the systemic kernel</a>.' +
      (L ? ' Its line in the list: <a href="/whole-system">whole-systems</a>' + (L.page ? ', which names its snazzy page.' : '.') : ' It is not on <a href="/whole-system">the list</a> yet.') + '</p><p id="create-your-own"><a href="/">happyseaurchin.com</a></p>';
    if (location.hash) {
      var el = document.getElementById(location.hash.slice(1));
      if (el) { var x = el; while (x && x.tagName) { if (x.tagName === 'DETAILS') x.open = true; x = x.parentNode; } el.scrollIntoView({ block: 'start' }); }
    }
  }

  /* ── the list page ── */
  function card(L, i) {
    var std = '/whole-system/' + encodeURIComponent(L.h);
    return '<article class="card" id="c-' + esc(L.h) + '"><span class="no">' + (i + 1) + '</span>' +
      '<h3><a href="' + std + '">' + esc(L.h) + '</a></h3><p class="what">' + rich(capFirst(L.what)) + '</p><div class="btns">' +
      (L.page ? '<a class="btn snazzy" href="' + esc(L.page) + '">Snazzy</a>' : '') +
      '<a class="btn' + (L.page ? ' quiet' : '') + '" href="' + std + '">Standard</a></div>' +
      '<p class="meld"><a href="' + meldHref(L.h) + '">Meld with ' + esc(meldName(L.h)) + ' →</a></p></article>';
  }
  function drawList(lines) {
    $('lede').innerHTML = '<p>How a person, or an AI, understands things to fit together, in their own shape and their own words. A <a href="/mind-meld">mind meld</a> reads two of them side by side.</p>';
    var cards = lines.map(card).join('');
    $('body').innerHTML = '<p class="sub">Each opens plainly, drawn from its block on the beach: <b>Standard</b>. Where its holder has made a page for people to enjoy, <b>Snazzy</b> opens it.</p>' +
      (cards ? '<div class="cards">' + cards + '</div>' : '<p class="note">None is on the list yet.</p>') +
      '<section class="yours"><h2>Write yours</h2><p>How you understand things to fit together, in your own shape: what you hold true, what you have made or practised that carries it, how you think and come to a view. It may already exist, as a book, a site or your notes; if so, your AI points to it and never rewrites it. Otherwise it stands on the beach at <code>whole-system:&lt;your name&gt;</code>. With your AI connected to the beach, paste it this line:</p>' +
      '<div class="copyline"><code id="line">' + esc(LINE) + '</code><button type="button" id="copy">Copy</button></div>' +
      '<p class="note">Not connected yet? The first step of <a href="/mind-meld">the mind meld</a> shows how. Once yours stands, ask David to add it to this list.</p></section>';
    $('copy').addEventListener('click', function () {
      var b = this, done = function () { b.textContent = 'Copied'; setTimeout(function () { b.textContent = 'Copy'; }, 1800); };
      if (navigator.clipboard) navigator.clipboard.writeText(LINE).then(done, function () {}); else done();
    });
    $('foot').innerHTML = '<p>The list is its own block on the beach, <a href="/explain?block=' + LIST + '">' + LIST + '</a>: one line for each whole system, kept like <a href="/proposal">the proposals</a> list, and every card is read live from it. Every whole-system block on the beach, listed or not, is gathered at <a href="/view/whole-systems">/view/whole-systems</a>.</p><p id="create-your-own"><a href="/">happyseaurchin.com</a></p>';
  }

  function none(msg) {
    $('title').textContent = H || 'Whole systems';
    $('body').innerHTML = '<p class="note">' + msg + '</p>';
    $('acts').innerHTML = '<a class="btn" href="/whole-system">Every whole system</a>';
  }

  if (!H) {
    readBlock(LIST).then(function (b) { drawList(linesOf(b)); }).catch(function () {
      $('body').innerHTML = '<p class="note">The beach couldn’t be read just now. Try again in a moment.</p>';
    });
    return;
  }
  $('bar-name').textContent = H;
  /* the list first: its line names the snazzy page, and says where a system stands under its older name, so the
     block that is there is read first */
  readBlock(LIST).then(linesOf, function () { return []; }).then(function (lines) {
    var L = lines.filter(function (x) { return x.h.toLowerCase() === H.toLowerCase(); })[0] || null;
    var names = ['whole-system:' + H, 'solution-set:' + H];
    if (L && L.what.indexOf('solution-set:' + L.h) >= 0) names.reverse();
    return readBlock(names[0]).then(function (b) {
      if (b && textOf(b)) return { b: b, block: names[0] };
      return readBlock(names[1]).then(function (o) { return o && textOf(o) ? { b: o, block: names[1] } : null; });
    }).then(function (got) {
      if (got) drawSystem(got.b, got.block, L);
      else none('No whole system stands for ' + esc(H) + ' on the beach yet.');
    });
  }).catch(function () {
    none('The beach couldn’t be read just now.' + (H === 'happyseaurchin' ? ' David’s book is at <a href="https://crumful.com/spine">crumful.com/spine</a>.' : ''));
  });
})();
</script>
<script>if (window.siteDoors) siteDoors({ here: /^\/whole-system\/./.test(location.pathname) ? 'whole-system/x' : 'whole-system', site: true });</script>
</body>
</html>
