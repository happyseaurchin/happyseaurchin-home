<style>
/* One page for every schematic on the beach (function:schematic 6): /schematic lists them, /schematic/<name> draws one
   family from its blocks, spine:<name>-schematic and function:<name>-schematic, with no code and no deploy for a new one.
   Its default style is the drawing office of a working plant, made generic from the schematics proposal's own page
   (/schematics): drafting film by day, the band in CAD's night in either theme, a title block on every sheet, a sheet
   for each face, a callout where a part is a schematic of its own, every comment a redline where it falls, and the
   observer's sheet lit by what the law's live line names. A maker's own version is named at the law's 6 ('page:'),
   offered as Snazzy beside this, the Standard; neither ever sends the reader to the other. */
:root {
  --paper: #edf1f0; --paper-2: #e2e8e7; --sheet: #f8faf9;
  --grid: rgba(18, 94, 110, 0.07); --grid-2: rgba(18, 94, 110, 0.12);
  --ink: #13212a; --ink-2: #485a63; --ink-3: #6c7d85; --rule: #c4cfd1; --rule-2: #a5b5b9;
  --proc: #0d6e7c; --inst: #92640a; --sig: #6a3fa3; --live: #1b8a4b; --red: #d2271c; --err: #c0271c;
  /* model space: the band, a night in either theme */
  --n-bg: #0b1216; --n-bg-2: #101a20; --n-bg-3: #16232b; --n-hover: #183039; --n-on: #1d3a44;
  --n-grid: rgba(98, 178, 196, 0.07); --n-grid-2: rgba(98, 178, 196, 0.15);
  --n-ink: #e5eef0; --n-ink-2: #a9bcc2; --n-dim: #6f8890; --n-faint: #2f424b; --n-rule: #243640;
  --n-proc: #45cfe1; --n-inst: #f2c94d; --n-sig: #ce8bff; --n-live: #58e08b; --n-red: #ff5a4d;
  --display: 'Saira Stencil One', 'Barlow Condensed', Impact, sans-serif;
  --cond: 'Barlow Condensed', 'Arial Narrow', sans-serif;
  --body: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'B612 Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --gut: clamp(16px, 3.2vw, 44px);
  /* the site's own tokens, said in this palette, so the bar's menus, threads.js and the dictation glyph wear it */
  --foam: var(--ink); --vapour: var(--ink-2); --vapour-dim: var(--ink-2); --line: var(--rule); --line-strong: var(--rule-2);
  --liquid: #0d6e7c; --liquid-rgb: 13,110,124; --solid: #92640a; --solid-rgb: 146,100,10; --abyss: #edf1f0;
  --well-rgb: 248,250,249; --wash-rgb: 226,232,231;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0e1519; --paper-2: #121c21; --sheet: #162027; --grid: rgba(110, 190, 210, 0.05); --grid-2: rgba(110, 190, 210, 0.09);
    --ink: #e1eaec; --ink-2: #9cb0b7; --ink-3: #74888f; --rule: #263741; --rule-2: #354955;
    --proc: #4fd2e3; --inst: #efc552; --sig: #c693ff; --live: #5ade8e; --red: #ff6154; --err: #ff8a7e;
    --liquid: #4fd2e3; --liquid-rgb: 79,210,227; --solid: #efc552; --solid-rgb: 239,197,82; --abyss: #0e1519;
    --well-rgb: 22,32,39; --wash-rgb: 18,28,33; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0e1519; --paper-2: #121c21; --sheet: #162027; --grid: rgba(110, 190, 210, 0.05); --grid-2: rgba(110, 190, 210, 0.09);
  --ink: #e1eaec; --ink-2: #9cb0b7; --ink-3: #74888f; --rule: #263741; --rule-2: #354955;
  --proc: #4fd2e3; --inst: #efc552; --sig: #c693ff; --live: #5ade8e; --red: #ff6154; --err: #ff8a7e;
  --liquid: #4fd2e3; --liquid-rgb: 79,210,227; --solid: #efc552; --solid-rgb: 239,197,82; --abyss: #0e1519;
  --well-rgb: 22,32,39; --wash-rgb: 18,28,33; color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; background: var(--paper); }
body {
  margin: 0; color: var(--ink); font-family: var(--body); font-size: 1.0625rem; line-height: 1.6; background-color: var(--paper);
  /* drafting film: a 5 mm grid, every fifth line stronger */
  background-image: linear-gradient(var(--grid-2) 1px, transparent 1px), linear-gradient(90deg, var(--grid-2) 1px, transparent 1px),
    linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 100px 100px, 100px 100px, 20px 20px, 20px 20px; background-position: -1px -1px; min-height: 100dvh;
}
a { color: var(--proc); text-underline-offset: 3px; }
a:focus-visible, button:focus-visible, summary:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--inst); outline-offset: 3px; border-radius: 4px; }
.wrap { max-width: 82rem; margin: 0 auto; padding-left: max(var(--gut), env(safe-area-inset-left, 0px)); padding-right: max(var(--gut), env(safe-area-inset-right, 0px)); }
.addr-only { display: none !important; }
body.addr-on .addr-only { display: revert !important; }
body.addr-on span.addr-only, body.addr-on code.addr-only, body.addr-on b.addr-only, body.addr-on a.addr-only { display: inline !important; }
[hidden] { display: none !important; }

/* the site's bar */
.bar { display: flex; align-items: center; gap: 10px; padding: 14px var(--gut) 10px; font-family: var(--mono); font-size: 12px; letter-spacing: 0.06em; color: var(--ink-2); max-width: 82rem; margin: 0 auto; }
.bar .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--proc); flex: none; }
.bar b { color: var(--ink); font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar > span:nth-child(2) { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar a { color: var(--ink-2); text-decoration: none; white-space: nowrap; } .bar a:hover { color: var(--proc); }
.bar .spacer { flex: 1; }
.bar button { background: var(--sheet); border: 1px solid var(--rule-2); border-radius: 4px; color: var(--ink-2); font-family: var(--mono); font-size: 12px; padding: 5px 9px; cursor: pointer; }
.bar button:hover { color: var(--ink); border-color: var(--proc); }

/* the title block at the head of the drawing */
.top .wrap { padding-block: 0.6rem 2rem; }
.eyebrow { font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-2); }
.eyebrow b { font-weight: 400; color: var(--red); } .eyebrow b.built { color: var(--live); }
.titlegrid { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 1.2rem 3rem; align-items: end; margin-top: 1rem; }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(2.6rem, 8.6vw, 6.4rem); line-height: 0.9; letter-spacing: 0.01em; margin: 0; overflow-wrap: anywhere; }
h1 a { color: inherit; text-decoration: none; }
.sub { font-family: var(--cond); font-weight: 600; font-size: clamp(1.2rem, 2.4vw, 1.55rem); line-height: 1.22; margin: 0.9rem 0 0; text-wrap: balance; }
.lede { font-size: 1.16rem; line-height: 1.5; margin: 0 0 1.1rem; max-width: 38rem; text-wrap: pretty; }
.actions { display: flex; flex-wrap: wrap; gap: 0.55rem; }
.btn { display: inline-flex; align-items: center; gap: 0.45rem; font-family: var(--cond); font-weight: 700; font-size: 1.02rem; letter-spacing: 0.04em; text-transform: uppercase; padding: 0.52rem 1rem; border-radius: 3px; text-decoration: none; border: 1.5px solid var(--ink); color: var(--ink); background: var(--sheet); cursor: pointer; }
.btn:hover { border-color: var(--proc); color: var(--proc); }
.btn.solid { background: var(--ink); color: var(--paper); }
.btn.solid:hover { background: var(--proc); border-color: var(--proc); color: var(--paper); }
.btn svg { width: 0.95em; height: 0.95em; }
.titlestrip { margin-top: 1.5rem; display: grid; grid-template-columns: repeat(5, minmax(0, auto)); border: 1.5px solid var(--ink); background: var(--sheet); font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.05em; text-transform: uppercase; width: fit-content; max-width: 100%; }
.titlestrip > div { padding: 0.35rem 0.75rem 0.4rem; border-left: 1px solid var(--rule-2); min-width: 0; }
.titlestrip > div:first-child { border-left: 0; }
.titlestrip span { display: block; font-size: 0.6rem; color: var(--ink-3); letter-spacing: 0.12em; }
.titlestrip b { font-weight: 400; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.titlestrip .stamp { color: var(--red); } .titlestrip .stamp.built { color: var(--live); }

/* the band: model space, where the process is plotted sheet by sheet */
.band { background: var(--n-bg); color: var(--n-ink); border-block: 1.5px solid #000;
  background-image: linear-gradient(var(--n-grid-2) 1px, transparent 1px), linear-gradient(90deg, var(--n-grid-2) 1px, transparent 1px),
    linear-gradient(var(--n-grid) 1px, transparent 1px), linear-gradient(90deg, var(--n-grid) 1px, transparent 1px);
  background-size: 120px 120px, 120px 120px, 24px 24px, 24px 24px; }
.band .wrap { padding-block: 1rem 1.4rem; }
.bandhead { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.6rem 1rem; }
.tabs, .bandtools, .plex { display: flex; flex-wrap: wrap; gap: 0.35rem; align-items: center; }
.tab { font-family: var(--cond); font-weight: 600; font-size: 0.98rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--n-ink-2); background: var(--n-bg-2); border: 1px solid var(--n-rule); border-bottom-width: 2px; border-radius: 3px 3px 0 0; padding: 0.32rem 0.75rem 0.28rem; cursor: pointer; display: inline-flex; gap: 0.45rem; align-items: baseline; }
.tab .k { font-family: var(--mono); font-size: 0.8rem; color: var(--n-inst); }
.tab:hover { color: var(--n-ink); border-color: var(--n-dim); }
.tab[aria-selected="true"] { color: var(--n-ink); background: var(--n-bg-3); border-color: var(--n-proc); }
.tab[aria-selected="true"] .k { color: var(--n-proc); }
.ntool { font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--n-ink-2); background: none; border: 1px solid var(--n-rule); border-radius: 3px; padding: 0.3rem 0.55rem; cursor: pointer; }
.ntool:hover { color: var(--n-ink); border-color: var(--n-proc); }
.ntool[aria-pressed="true"] { color: var(--n-bg); background: var(--n-proc); border-color: var(--n-proc); }
.plex { gap: 0; } .plex .ntool { border-radius: 0; margin-left: -1px; } .plex .ntool:first-of-type { border-radius: 3px 0 0 3px; } .plex .ntool:last-of-type { border-radius: 0 3px 3px 0; }
.plex .lbl { font-family: var(--mono); font-size: 0.62rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--n-dim); margin-right: 0.45rem; }
.sheetwrap { margin-top: 0.6rem; }
#plant { display: block; width: 100%; height: auto; touch-action: manipulation; }
.bandcap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0.3rem 1.2rem; margin-top: 0.55rem; font-size: 0.95rem; color: var(--n-ink-2); }
.bandcap p { margin: 0; }
.bandcap b { font-family: var(--cond); font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--n-ink); margin-right: 0.35rem; }
.bandcap .hint2 { font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.04em; color: var(--n-dim); }
/* the player's way in, under the player's sheet: the whole in plain words and its door */
.howto { margin-top: 0.8rem; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 0.7rem 1.4rem; border: 1px solid var(--n-rule); border-left: 3px solid var(--n-proc); border-radius: 4px; background: var(--n-bg-2); padding: 0.75rem 1rem; }
.howto p { margin: 0; font-size: 1.02rem; line-height: 1.5; color: var(--n-ink); }
.howto p b { font-family: var(--cond); font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--n-proc); margin-right: 0.4rem; }
.howto .ask { grid-column: 1 / -1; font-size: 0.95rem; color: var(--n-ink-2); }
.howto .ask b { color: var(--n-inst); }

/* the drawing's own type and strokes */
#plant text { font-family: var(--cond); fill: var(--n-ink); }
.d-mono { font-family: var(--mono) !important; }
.d-title { font-weight: 700; letter-spacing: 0.04em; }
.d-sub { fill: var(--n-ink-2) !important; font-family: var(--body) !important; }
.d-dim { fill: var(--n-dim) !important; }
.d-proc { fill: var(--n-proc) !important; } .d-inst { fill: var(--n-inst) !important; } .d-red { fill: var(--n-red) !important; }
.d-live { fill: var(--n-live) !important; } .d-sig { fill: var(--n-sig) !important; }
.s-ink { stroke: var(--n-ink); fill: none; } .s-proc { stroke: var(--n-proc); fill: none; } .s-inst { stroke: var(--n-inst); fill: none; }
.s-sig { stroke: var(--n-sig); fill: none; stroke-dasharray: 5 4; } .s-dim { stroke: var(--n-faint); fill: none; } .s-dim2 { stroke: var(--n-dim); fill: none; }
.s-red { stroke: var(--n-red); fill: none; } .s-live { stroke: var(--n-live); fill: none; } .s-tag { stroke: var(--n-sig); fill: none; }
.f-unit { fill: var(--n-bg-2); } .f-bg { fill: var(--n-bg); }
.hit { cursor: pointer; }
.hit:hover .f-unit, .hit:focus .f-unit { fill: var(--n-hover); }
.hit:focus { outline: none; }
.hit:focus .s-ink, .hit:focus .s-proc { stroke: var(--n-inst); }
.hit.on .f-unit { fill: var(--n-on); } .hit.on .s-ink { stroke: var(--n-proc); }
a.door-flag:hover path { stroke: var(--n-ink); } a.door-flag:hover text { fill: var(--n-ink) !important; }
/* plotting: a stroke draws itself in, the pen ahead of the ink */
.plot .pl { stroke-dasharray: 1; stroke-dashoffset: 1; animation: plot var(--pd, 700ms) cubic-bezier(.4, .1, .3, 1) forwards; animation-delay: var(--dl, 0ms); }
.plot .fd { opacity: 0; animation: fadein 420ms ease forwards; animation-delay: var(--dl, 0ms); }
.plot .pl.plf { opacity: 0; animation: plot var(--pd, 700ms) cubic-bezier(.4, .1, .3, 1) forwards, fadein 300ms ease forwards; animation-delay: var(--dl, 0ms), var(--dl, 0ms); }
@keyframes plot { to { stroke-dashoffset: 0; } }
@keyframes fadein { to { opacity: 1; } }
.flow { stroke-dasharray: 7 7; animation: flow 1.1s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -14; } }
.blink { animation: blink 1.6s ease-in-out infinite; }
@keyframes blink { 50% { opacity: 0.25; } }

/* the part card: one part, its door, its ask and everyone's comments, in the band's night */
.partcard { margin-top: 0.9rem; border: 1px solid var(--n-rule); border-top: 2px solid var(--n-proc); background: var(--n-bg-2); border-radius: 4px; padding: 0.95rem 1.1rem 1.1rem; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 0.8rem 2rem; scroll-margin-top: 1rem; }
.pc-head { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 0.4rem 0.9rem; align-items: baseline; justify-content: space-between; }
.pc-face { font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--n-inst); }
.pc-face .addr-only { color: var(--n-dim); }
.pc-trail { font-size: 0.86rem; color: var(--n-ink-2); }
.pc-x { font: 400 1.4rem/1 var(--body); color: var(--n-ink-2); background: none; border: 0; cursor: pointer; padding: 0 0.3rem; }
.pc-x:hover { color: var(--n-ink); }
.pc-title { grid-column: 1 / -1; font-family: var(--cond); font-weight: 700; font-size: clamp(1.45rem, 3vw, 1.9rem); line-height: 1.05; letter-spacing: 0.03em; text-transform: uppercase; margin: -0.2rem 0 0; color: var(--n-ink); overflow-wrap: anywhere; }
.pc-body { margin: 0 0 0.6rem; font-size: 1.04rem; line-height: 1.55; color: var(--n-ink); }
.pc-refs { display: flex; flex-wrap: wrap; gap: 0.35rem; margin: 0 0 0.7rem; }
.ref { font-family: var(--mono); font-size: 0.7rem; color: var(--n-sig); border: 1px solid rgba(206, 139, 255, 0.45); border-radius: 2px; padding: 0.08rem 0.4rem; text-decoration: none; overflow-wrap: anywhere; }
a.ref:hover { border-color: var(--n-sig); }
.pc-door { display: inline-flex; align-items: center; gap: 0.5rem; font-family: var(--cond); font-weight: 700; font-size: 1.02rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--n-bg); background: var(--n-proc); border-radius: 3px; padding: 0.5rem 0.9rem; text-decoration: none; max-width: 100%; white-space: nowrap; }
.pc-door:hover { background: var(--n-ink); }
.pc-door small { font-family: var(--mono); font-size: 0.66rem; letter-spacing: 0.02em; text-transform: none; font-weight: 400; opacity: 0.8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.pc-note { margin: 0.7rem 0 0; padding: 0.5rem 0.75rem; border-left: 3px solid var(--n-dim); background: rgba(169, 188, 194, 0.06); font-size: 0.95rem; color: var(--n-ink); }
.pc-note b { display: block; font-family: var(--mono); font-weight: 400; font-size: 0.66rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--n-dim); margin-bottom: 0.15rem; }
.pc-note.ask { border-left-color: var(--n-inst); background: rgba(242, 201, 77, 0.07); } .pc-note.ask b { color: var(--n-inst); }
.pc-note.state { border-left-color: var(--n-live); } .pc-note.state b { color: var(--n-live); }
.pc-note.state.st-inst { border-left-color: var(--n-inst); } .pc-note.state.st-inst b { color: var(--n-inst); }
.pc-note.state.st-red { border-left-color: var(--n-red); } .pc-note.state.st-red b { color: var(--n-red); }
.pc-note.moved { border-left-color: var(--n-inst); } .pc-note.moved b { color: var(--n-inst); }
.pc-note.callout { border-left-color: var(--n-proc); } .pc-note.callout b { color: var(--n-proc); }
.pc-note.pins { border-left-color: var(--n-sig); } .pc-note.pins b { color: var(--n-sig); }
.pc-note a { color: var(--n-proc); }
.pc-kids { margin: 0.8rem 0 0; padding: 0; list-style: none; display: grid; gap: 0.45rem; }
.pc-kids li { font-size: 0.93rem; color: var(--n-ink-2); padding-left: 0.7rem; border-left: 1px solid var(--n-rule); }
.pc-kids li ul { margin-top: 0.35rem; }
.pc-kids .kt { font: inherit; font-family: var(--cond); font-weight: 700; font-size: 1rem; letter-spacing: 0.04em; text-transform: uppercase; color: var(--n-proc); background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
.pc-kids .kt:hover { color: var(--n-ink); }
.pc-kidsh { margin: 0.9rem 0 0; font-family: var(--mono); font-size: 0.66rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--n-dim); }
.nlinkish { border: 0; background: none; padding: 0; color: var(--n-proc); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font: inherit; }
.pc-say h4 { margin: 0 0 0.45rem; font-family: var(--mono); font-weight: 400; font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--n-red); }
.redlines { list-style: none; margin: 0 0 0.75rem; padding: 0; display: grid; gap: 0.45rem; max-height: 17rem; overflow: auto; }
.redlines li { border: 1px solid rgba(255, 90, 77, 0.38); border-radius: 3px; padding: 0.42rem 0.6rem 0.48rem; font-size: 0.96rem; line-height: 1.45; color: var(--n-ink); overflow-wrap: anywhere; white-space: pre-line; }
.redlines li .w { display: block; font-family: var(--mono); font-size: 0.66rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--n-red); margin-bottom: 0.1rem; white-space: normal; }
.redlines li.mine { border-color: var(--n-red); background: rgba(255, 90, 77, 0.07); }
.redlines li.none { border-style: dashed; color: var(--n-dim); font-style: italic; }
.redlines li.fold { border-color: rgba(242, 201, 77, 0.5); } .redlines li.fold .w { color: var(--n-inst); }
.nform { display: grid; gap: 0.5rem; }
.nform .field { position: relative; }
.nform textarea, .nform input { width: 100%; font: inherit; font-size: 1rem; padding: 0.55rem 0.65rem; border-radius: 3px; border: 1px solid var(--n-rule); background: var(--n-bg); color: var(--n-ink); }

<body>

<div class="bar"><span class="dot"></span><span>schematics · <b id="bar-name">every one</b></span><span class="spacer"></span><a href="/schematic" id="bar-all">every schematic</a><button type="button" id="btn-theme" title="light or dark" aria-label="Switch between light and dark">◐</button></div>

<header class="top">
  <div class="wrap">
    <div class="eyebrow" id="eyebrow">Schematics · on the beach</div>
    <div class="titlegrid">
      <div><h1 id="title">Reading the beach…</h1><p class="sub" id="sub"></p></div>
      <div><p class="lede" id="lede"></p><div class="actions" id="actions"></div></div>
    </div>
    <div class="titlestrip" id="strip" hidden></div>
  </div>
</header>

<section class="band" id="band" aria-label="The schematic, drawn sheet by sheet at each face" hidden>
  <div class="wrap">
    <div class="bandhead">
      <div class="tabs" role="tablist" aria-label="The four faces">
        <button class="tab" role="tab" type="button" data-sheet="C" aria-selected="true"><span class="k">C</span><span class="w">player</span></button>
        <button class="tab" role="tab" type="button" data-sheet="A" aria-selected="false"><span class="k">A</span><span class="w">maker</span></button>
        <button class="tab" role="tab" type="button" data-sheet="D" aria-selected="false"><span class="k">D</span><span class="w">designer</span></button>
        <button class="tab" role="tab" type="button" data-sheet="O" aria-selected="false"><span class="k">O</span><span class="w">observer</span></button>
      </div>
      <div class="bandtools">
        <div class="plex" role="group" aria-label="How deep to look"><span class="lbl">plex</span><button class="ntool" type="button" data-plex="1" aria-pressed="false" title="plex 1: each part's line alone">Easy</button><button class="ntool" type="button" data-plex="0" aria-pressed="true" title="plex 0: with the ring of its parts">Normal</button><button class="ntool" type="button" data-plex="-1" aria-pressed="false" title="plex −1: two rungs down, with the blocks they stand in">Detailed</button></div>
        <button class="ntool" type="button" id="btn-addr" aria-pressed="false" title="show the addresses and the blocks each part stands in">Numbers</button>
        <button class="ntool" type="button" id="replay" title="plot this sheet again">↺</button>
      </div>
    </div>
    <div class="sheetwrap"><svg id="plant" viewBox="0 0 1200 640" role="img" aria-labelledby="plantDesc"><desc id="plantDesc">The schematic, drawn as an engineer draws a working plant.</desc></svg></div>
    <div class="bandcap"><p id="bandCap"></p><span class="hint2">Tap any part to read it, go to it, or comment on it</span></div>
    <div class="howto" id="howto" hidden></div>
    <div class="partcard" id="partcard" hidden aria-live="polite"></div>
  </div>
</section>

<main class="wrap" id="main"></main>

<footer><div class="wrap" id="foot"></div></footer>

        after(under2, c0, c1);
      }
      /* SHEET D — the piping and instruments: each part opened into its own parts, with the blocks it stands in, and
         each detail on a panel of its own, called out where it serves */
      function panelH(q) { var kids = q.kids.map(part).filter(Boolean), h = 42 + kids.length * 26, refs = q.refs.map(blockOf).filter(Boolean).length; if (PLEX < 0) kids.forEach(function (k) { h += k.kids.length * 16; }); return h + (refs ? 24 : 4) + 6; }
      function drawD(p) {
        var items = makers().concat(details()), cols = narrow ? 1 : 4, pw = narrow ? 388 : 262, gap = 28, x0 = narrow ? 16 : (W - (cols * pw + (cols - 1) * gap)) / 2;
        var tops = [], P = {}; for (var c = 0; c < cols; c++) tops.push(narrow ? 40 : 46);
        items.forEach(function (q) { var col = 0; for (var i = 1; i < cols; i++) if (tops[i] < tops[col] - 1) col = i; var h = panelH(q); P[q.addr] = [x0 + col * (pw + gap), tops[col], pw, h]; tops[col] += h + 26; });
        frame(Math.ceil(Math.max.apply(null, tops) + 12 + 96));
        items.forEach(function (q) {
          var r = P[q.addr], x = r[0], y = r[1], w = r[2], h = r[3];
          var g = E('g', null, p); hitbox(g, q.addr, q.title);
          pl(E('rect', { x: x, y: y, width: w, height: h, rx: 4, 'class': (q.detail ? 's-sig' : 's-ink') + ' f-unit', 'stroke-width': 1.8 }, g), 520);
          pl(E('path', { d: 'M' + x + ' ' + (y + 30) + 'h' + w, 'class': 's-dim', 'stroke-width': 1 }, g), 200);
          fit([text(g, x + 12, y + 21, (q.detail ? 'DETAIL ' + q.addr + ' · ' : '') + up(q.title), 'd-title' + (q.detail ? ' d-sig' : ''), { 'font-size': 14.5 })], w - 44, 14.5);
          bubble(g, x + w - 16, y + 15, q.addr);
          if (own(q.addr)) cloud(p, x - 7, y - 7, w + 14, 44, own(q.addr), 8);
          var ry = y + 44;
          q.kids.map(part).filter(Boolean).forEach(function (s, k) {
            var rg = E('g', null, p); hitbox(rg, s.addr, s.title);
            E('rect', { x: x + 2, y: ry - 14, width: w - 4, height: 24, 'class': 'f-unit', style: 'fill:transparent' }, rg);
            pl(E('circle', { cx: x + 18, cy: ry - 2, r: 7.5, 'class': s.cites.length ? 's-sig' : 's-inst', 'stroke-width': 1.3 }, rg), 260);
            text(rg, x + 18, ry + 1.2, String(k + 1), 'd-mono ' + (s.cites.length ? 'd-sig' : 'd-inst'), { 'text-anchor': 'middle', 'font-size': 8.5 });

            var mk = (s.door ? '↗' : '') + (s.ask ? '?' : '') + (s.cites.length ? '◇' + s.cites.join('') : '');

            if (own(s.addr)) cloud(p, x + 4, ry - 15, w - 8, 25, own(s.addr), 6);
            ry += 26;
            if (PLEX < 0) s.kids.map(part).filter(Boolean).forEach(function (t2) { var tg = E('g', null, p); hitbox(tg, t2.addr, t2.title); fit([text(tg, x + 40, ry - 4, '· ' + clip(up(t2.title), 34), 'd-mono', { 'font-size': 9.4, style: 'fill:var(--n-ink-2)' })], w - 52, 9.4); ry += 16; });
          });
          var refs = q.refs.map(blockOf).filter(Boolean).slice(0, narrow ? 4 : 3);
          if (refs.length) {
            var rx = x + 10, ryy = y + h - 12;
            refs.forEach(function (b) {
              var wq = Math.min(w - 20, b.length * 5.4 + 22); if (rx + wq > x + w - 6) return;
              var a2 = E('a', { href: '/explain?block=' + encodeURIComponent(b) }, p);
              pl(E('path', { d: 'M' + rx + ' ' + (ryy - 8) + 'h' + (wq - 8) + 'l7 6-7 6h-' + (wq - 8) + 'z', 'class': 's-tag', 'stroke-width': 1 }, a2), 200);
              text(a2, rx + 5, ryy + 1.5, b, 'd-mono', { 'font-size': 8.4, style: 'fill:var(--n-sig)' });
              rx += wq + 6;
            });
          }
          if (q.cites.length) text(g, x + w - 12, y + 21, '◇' + q.cites.join(''), 'd-sig d-mono', { 'text-anchor': 'end', 'font-size': 11 });
        });
      }

      /* ── showing a sheet. It changes only when the reader taps its tab: the player's sheet draws itself in once,
         when the band first comes into view, and stays; ↺ plots the sheet showing again ── */
      function caption(s) { var S = SHEETS[s], who = L.faces[s]; $('bandCap').innerHTML = '<b>' + S.title + '</b><span>' + S.words + (who ? ' Here, the ' + esc(S.face) + ' is ' + esc(who.charAt(0).toLowerCase() + who.slice(1)) + '.' : '') + '</span>'; }
      function howto(s) {
        var h = $('howto'); h.hidden = s !== 'C';
        if (s !== 'C') return;
        h.innerHTML = '<p><b>' + esc(TITLE) + '</b>' + rich(cap(WHOLE.body)) + '</p>' + (WHOLE.door ? '<a class="pc-door" href="' + esc(WHOLE.door) + '">' + DOOR.replace('aria-hidden', 'width="15" height="15" aria-hidden') + 'Open ' + esc(TITLE) + '</a>' : '') +
          (WHOLE.ask ? '<p class="ask"><b>It asks:</b> ' + esc(WHOLE.ask) + '</p>' : '');
      }
      function show(s, animate) {
        FACE = s; narrow = svg.parentNode.clientWidth < 700;
        while (svg.lastChild && svg.lastChild !== desc) svg.removeChild(svg.lastChild);
        defs();
        plotting = !!animate && !reduce; clock = 0; FITS = 0;
        var layer = E('g', { 'class': plotting ? 'plot' : '' }, svg);
        if (s === 'C') drawC(layer); else if (s === 'D') drawD(layer); else drawA(layer, s);
        titleBlock(layer, s);
        busyUntil = 0;
        if (plotting) {
          var budget = s === 'C' ? 2400 : 3200, f = clock > budget ? budget / clock : 1;
          layer.querySelectorAll('.pl, .fd').forEach(function (el) {
            el.style.setProperty('--dl', Math.round((parseFloat(el.style.getPropertyValue('--dl')) || 0) * f) + 'ms');
            var pd = parseFloat(el.style.getPropertyValue('--pd')); if (pd) el.style.setProperty('--pd', Math.round(Math.max(240, pd * Math.max(f, 0.55))) + 'ms');
          });
          busyUntil = Date.now() + Math.min(clock, budget) + 900;
        }
        document.querySelectorAll('.tab').forEach(function (t) { t.setAttribute('aria-selected', String(t.getAttribute('data-sheet') === s)); });
        desc.textContent = SHEETS[s].title + ' of ' + TITLE + ': ' + SHEETS[s].words;
        caption(s); howto(s); fitTitles();
        if (s === 'O' && !LIVE) readLive().then(function () { if (FACE === 'O') later(); }, function () {});
        if (CUR && (s === 'D' || PLEX < 0)) paintCard();
      }
      function later() { clearTimeout(laterT); if (!started) return; var wait = busyUntil - Date.now(); if (wait > 0) laterT = setTimeout(function () { show(FACE, false); }, wait); else show(FACE, false); }
      function url() { try { var q = new URLSearchParams(location.search); if (FACE === 'C') q.delete('face'); else q.set('face', FACE.toLowerCase()); if (!PLEX) q.delete('plex'); else q.set('plex', String(PLEX)); var s2 = q.toString(); history.replaceState(null, '', location.pathname + (s2 ? '?' + s2 : '') + location.hash); } catch (e) {} }
      function start() {
        $('band').hidden = false;
        document.querySelectorAll('.tab').forEach(function (t) {
          var w = L.faces[t.getAttribute('data-sheet')]; if (w) t.title = 'the ' + SHEETS[t.getAttribute('data-sheet')].face + ': ' + w;
          t.addEventListener('click', function () { clearTimeout(laterT); show(t.getAttribute('data-sheet'), true); url(); });
        });
        document.querySelectorAll('.plex .ntool').forEach(function (b) {
          b.setAttribute('aria-pressed', String(+b.getAttribute('data-plex') === PLEX));
          b.addEventListener('click', function () { PLEX = +b.getAttribute('data-plex'); document.querySelectorAll('.plex .ntool').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); }); clearTimeout(laterT); show(FACE, false); if (CUR) paintCard(); url(); });
        });
        $('btn-addr').addEventListener('click', function () { var on = !document.body.classList.contains('addr-on'); document.body.classList.toggle('addr-on', on); $('btn-addr').setAttribute('aria-pressed', String(on)); store.set('schematic:addr', on ? '1' : '0'); if (CUR) paintCard(); });
        if (store.get('schematic:addr') === '1') { document.body.classList.add('addr-on'); $('btn-addr').setAttribute('aria-pressed', 'true'); }
        $('replay').addEventListener('click', function () { clearTimeout(laterT); show(FACE, true); });
        var lastNarrow = svg.parentNode.clientWidth < 700;
        window.addEventListener('resize', function () { var n = svg.parentNode.clientWidth < 700; if (n !== lastNarrow) { lastNarrow = n; later(); } });
        if (document.fonts) { if (document.fonts.ready) document.fonts.ready.then(fitTitles, function () {}); if (document.fonts.addEventListener) document.fonts.addEventListener('loadingdone', fitTitles); }
        started = true;

        if (reduce || !('IntersectionObserver' in window)) show(FACE, false);
        else { show(FACE, false); var io = new IntersectionObserver(function (es) { if (es[0].isIntersecting) { io.disconnect(); show(FACE, true); } }, { threshold: 0.3 }); io.observe(svg); }
      }
      function mark(addr) { svg.querySelectorAll('.hit').forEach(function (h) { h.classList.toggle('on', h.getAttribute('data-addr') === addr); }); }
      return { start: start, later: later, mark: mark };
    })();
  }

  /* ════════ every schematic on the beach: each family whose law says 'mode: schematic' (function:schematic 6) ════════ */
  function indexPage() {
    document.title = 'Schematics';
    $('bar-name').textContent = 'every one';
    $('eyebrow').textContent = 'The schematic form · on the beach';

    $('sub').textContent = 'Each process running on the beach, drawn at the face of whoever reads it.';
    Promise.all([readBlock('function:schematic'), readIndex()]).then(function (two) {
      var form = two[0], ix = two[1];
      if (form) learnCase(JSON.stringify(form));
      $('lede').innerHTML = form ? rich(cap(sentences(parseLine(textOf(form)).body, 360))) : 'The schematic form couldn’t be read from the beach just now.';
      $('actions').innerHTML = '<a class="btn solid" href="#shelf">See them</a><a class="btn" href="/explain?block=function:schematic">Read the form</a><a class="btn" href="#make">Make one with your AI</a>';

        '<section class="sec" id="make" data-sheet="Sheet 02 · make one"><div class="addr">for your own AI</div><h2>Make one</h2>' +

          '<div class="copyline"><textarea id="makeLine" readonly aria-label="A line to paste into your own Claude"></textarea><div class="row"><button type="button" class="linkish" id="copyMake">Copy the line</button><span class="ok" id="copiedMake" aria-live="polite"></span></div></div>' +
          '<ol class="steps"><li>The whole at 1, as the one who uses it meets it, with its door.</li><li>The few parts its maker made, at 1.1 to 1.7, in the order they are met.</li><li>The machinery inside each, for the designer, each part citing the blocks it stands in at their positions.</li><li>An ask at a part’s 8 where its keeper wants to hear something; its state at 9 while work on it runs.</li><li>Its law: the faces for this process, its room, what the observer’s view reads live, its keeper and its phase.</li></ol></section>';

      $('copyMake').addEventListener('click', copier('makeLine', 'copiedMake'));

          return { name: nm, whole: w, law: L2, parts: parts + 1, touched: ((ix && ix.touched) || {})['spine:' + nm + '-schematic'] || '' };
        }, function () { return null; });
      })).then(function (got) {
        var list = got.filter(Boolean).sort(function (a, b) { return String(b.touched).localeCompare(String(a.touched)); });
        $('cards').innerHTML = list.length ? list.map(function (s) {
          var page = s.law.page ? siteURL(s.law.page) : '';
          return '<article class="card"><h3 class="nm"><a href="/schematic/' + esc(s.name) + '">' + esc(titleCase(s.whole.title || s.name)) + '</a></h3>' +
            '<p>' + rich(cap(sentences(s.whole.body, 220))) + '</p>' +

  if (NAME) schematicPage(); else indexPage();
})();
