<style>
/* THE BEACH TREE, VERSION 3 — a code map of the beach venture's path (David, 2026-10-20: "more like a coder's
   environment where I can zoom in and follow things, and if all the toggles were on, it would be a massive
   complex thing"). Rows are the path's parts, then each hand and the sessions (lanes) it ran, then what was
   made; x is time. Every turn is a node on its lane's row; a turn that names a part echoes on that part's row;
   what a turn made (a pull request, a page, a document) stands on its own row, linked to every turn that names
   it. The records are read as /lanes reads them (watch:<hand>, history:<hand>, …), newest containers first.
   Nothing is written. */
:root{--mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
html[data-theme="dark"]{color-scheme:dark;
  --bg:#0d1117;--panel:#161b22;--panel2:#1c2129;--line:#30363d;--line2:#21262d;--ink:#e6edf3;--soft:#9da7b3;--faint:#6e7681;
  --accent:#58a6ff;--sel:#1f6feb;--done:#3fb950;--doing:#d29922;--next:#8b949e;--blocked:#f85149;--none:#484f58;
  --pr:#db61a2;--merged:#a371f7;--open:#3fb950;--closed:#f85149;--page:#e3b341;--doc:#79c0ff;--app:#d2a8ff;--film:#ffa657;--part:#56d4dd;
  --l0:#58a6ff;--l1:#3fb950;--l2:#d29922;--l3:#f778ba;--l4:#a371f7;--l5:#ffa657;--l6:#56d4dd;--l7:#c9d86a}
html[data-theme="light"]{color-scheme:light;
  --bg:#ffffff;--panel:#f6f8fa;--panel2:#eef1f4;--line:#d0d7de;--line2:#eaeef2;--ink:#1f2328;--soft:#59636e;--faint:#818b98;
  --accent:#0969da;--sel:#0969da;--done:#1a7f37;--doing:#9a6700;--next:#59636e;--blocked:#cf222e;--none:#afb8c1;
  --pr:#bf3989;--merged:#8250df;--open:#1a7f37;--closed:#cf222e;--page:#9a6700;--doc:#0969da;--app:#8250df;--film:#bc4c00;--part:#1b7c83;
  --l0:#0969da;--l1:#1a7f37;--l2:#9a6700;--l3:#bf3989;--l4:#8250df;--l5:#bc4c00;--l6:#1b7c83;--l7:#6c7a00}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:12.5px/1.5 var(--mono);-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button,input{font:inherit;color:inherit}
body{display:grid;grid-template-rows:auto minmax(0,1fr);height:100vh;height:100dvh;overflow:hidden}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:7px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.brand b{font-weight:700}
.brand span{color:var(--faint)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{background:none;border:0;border-right:1px solid var(--line);padding:3px 9px;cursor:pointer;color:var(--soft)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--panel2);color:var(--ink)}
.seg button:focus-visible,.btn:focus-visible,.chk:focus-within{outline:2px solid var(--accent);outline-offset:1px}
.search{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:3px 8px;width:200px;max-width:42vw}
.search:focus{outline:2px solid var(--accent);outline-offset:0}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:3px 9px;cursor:pointer;color:var(--soft)}
.btn:hover{color:var(--ink)}
.status{color:var(--faint);white-space:nowrap}
.status.live::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--done);margin-right:6px;vertical-align:1px}
.spacer{flex:1}
.links{color:var(--faint);white-space:nowrap}
.main{display:grid;grid-template-columns:232px minmax(0,1fr) 360px;min-height:0}
.side{border-right:1px solid var(--line);background:var(--panel);overflow:auto;padding:6px 0 14px}
.side h3{margin:12px 12px 4px;font-size:10.5px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.chk{display:flex;align-items:center;gap:8px;padding:2px 12px;cursor:pointer;color:var(--soft);user-select:none}
.chk:hover{background:var(--panel2);color:var(--ink)}
.chk input{margin:0;accent-color:var(--accent)}
.chk .g{width:14px;text-align:center;flex:none}
.chk .n{margin-left:auto;color:var(--faint);font-size:11px}
.side .row2{display:flex;gap:6px;padding:4px 12px}
.side .note{padding:2px 12px;color:var(--faint);font-size:11px;line-height:1.45}
.stage{position:relative;min-width:0;min-height:0;overflow:hidden;background:var(--bg)}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
canvas.dragging{cursor:grabbing}
.tip{position:absolute;z-index:5;pointer-events:none;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px;box-shadow:0 8px 24px rgba(0,0,0,.35);font-size:11.5px;line-height:1.45}
.tip .m{color:var(--faint)}
.insp{border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:10px 14px 18px}
.insp .x{float:right}
.insp .kv{color:var(--faint);font-size:11.5px;margin:2px 0}
.insp .kv b{color:var(--soft);font-weight:500}
.insp h2{font-size:13px;font-weight:700;margin:6px 0 6px;line-height:1.4}
.insp .text{white-space:pre-wrap;word-break:break-word;background:var(--bg);border:1px solid var(--line2);border-radius:6px;padding:8px 10px;margin:8px 0;max-height:46vh;overflow:auto}
.insp h4{margin:12px 0 4px;font-size:10.5px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.insp ul{list-style:none;margin:0;padding:0}
.insp li{margin:2px 0}
.insp .step{display:flex;gap:6px;margin-top:8px}
.tag{display:inline-block;border:1px solid var(--line);border-radius:10px;padding:0 7px;font-size:11px;color:var(--soft)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:0}
.hint{color:var(--faint);font-size:11.5px;line-height:1.55}
.hint kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;font-size:10.5px}
.drawer-btn{display:none}
@media (max-width:980px){
  .main{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;z-index:30;top:0;bottom:0;left:0;width:min(82vw,300px);transform:translateX(-102%);transition:transform .2s;box-shadow:8px 0 24px rgba(0,0,0,.4)}
  .side.open{transform:none}
  .insp{position:fixed;z-index:25;left:0;right:0;bottom:0;max-height:55dvh;border-left:0;border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(0,0,0,.35)}
  .insp.empty{display:none}
  .drawer-btn{display:inline-block}
  .search{width:140px}
  .links{display:none}
  .brand span{display:none}
  .top{gap:6px 8px;padding:6px 10px}
  .status{font-size:11px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <button class="btn drawer-btn" id="drawerBtn" type="button" aria-controls="side" aria-expanded="false">layers</button>
  <div class="brand"><b>beach-venture-path</b><span>· the beach tree, v3</span></div>
  <div class="seg" role="group" aria-label="Which parts" id="viewSeg">
    <button type="button" data-view="season">this season</button>
    <button type="button" data-view="inventory" id="invBtn">inventory</button>
  </div>

  </div>

  <span class="status" id="status">reading the beach…</span>
  <span class="spacer"></span>
  <span class="links"><a href="/beach-tree">v1</a> · <a href="/beach-tree-v2">v2</a> · <a href="/lanes">lanes</a> · <a href="/path/beach-venture">path</a></span>
  <button class="btn" id="themeBtn" type="button" aria-label="Light or dark">◐</button>
</header>
<div class="main">
  <aside class="side" id="side" aria-label="Layers and hands"></aside>
  <section class="stage" id="stage" aria-label="The map">
    <canvas id="cv" aria-label="The path's parts, the hands' sessions and what they made, drawn on a time axis"></canvas>
    <div class="tip" id="tip" hidden></div>
  </section>
  <aside class="insp empty" id="insp" aria-live="polite"></aside>
</div>
<script>
(() => {
'use strict';
/* ---------- where it reads ---------- */
const WIRE = 'https://beach.happyseaurchin.com/.well-known/pscale-beach';
const SITE = 'https://happyseaurchin.com';
const RENDER = SITE + '/render?beach=beach.happyseaurchin.com';
const FAMILY = 'beach-venture-path', PROJECT = 'beach-venture';
/* the sources a hand's work is read from; shape: an accumulator read newest container first, a clock read by week,
   or a mirror read whole. A turn's glyph says its source. */
const SOURCES = [
  { id: 'pile', label: 'pile', pre: 'watch:', shape: 'acc', glyph: 'circle', on: true, note: 'watch:<hand> — a lane per entry, its turns beneath' },
  { id: 'history', label: 'history', pre: 'history:', shape: 'acc', glyph: 'ring', on: true, note: 'history:<hand>' },
  { id: 'cards', label: 'cards', pre: PROJECT + ':', shape: 'clock', glyph: 'square', on: true, note: PROJECT + ':<hand> — a card names its part at 5' },
  { id: 'says', label: 'says', pre: 'torus-mirror:', shape: 'clock', glyph: 'dot', on: true, note: 'torus-mirror:<hand> — the line at now' },
  { id: 'room', label: 'room', block: 'pool:' + PROJECT, shape: 'acc', glyph: 'diamond', on: true, note: 'pool:' + PROJECT + ' — the venture\u2019s room' },
  { id: 'daily', label: 'daily', pre: 'daily:', shape: 'acc', glyph: 'tri', on: false, note: 'daily:<hand>' },
  { id: 'stash', label: 'stash', pre: 'stash:', shape: 'acc', glyph: 'trid', on: false, note: 'stash:<hand>' },
  { id: 'mirror', label: 'mirrors', pre: FAMILY + ':', shape: 'mirror', glyph: 'hollow', on: false, note: FAMILY + ':<hand> — a hand\u2019s word at a part' }
];
const MADE = [
  { id: 'pr', label: 'pull requests', on: true }, { id: 'page', label: 'pages', on: true }, { id: 'doc', label: 'documents', on: true },
  { id: 'app', label: 'apps & films', on: true }
];
const LINKS = [
  { id: 'threads', label: 'threads', on: true, note: 'a lane\u2019s turns joined in time' },
  { id: 'echo', label: 'part echoes', on: true, note: 'a turn that names a part, linked up to it' },
  { id: 'madeLinks', label: 'made links', on: true, note: 'a turn linked to what it made' },
  { id: 'routine', label: 'routine wakes', on: false, note: 'clock-woken sweeps and settles' }
];
const DEFAULT_HANDS = ['weft', 'keel', 'neptune', 'happyseaurchin'];

const $ = (id) => document.getElementById(id);
const sleep = (ms) => new Promise((ok) => setTimeout(ok, ms));
const store = {
  get(k, d) { try { const v = localStorage.getItem('beach-tree-v3:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('beach-tree-v3:' + k, JSON.stringify(v)); } catch (e) {} }
};
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ---------- reading the beach: plain GETs, a few at a time ---------- */
let active = 0; const waiting = [];
function limited(fn) {
  return new Promise((ok, no) => {
    const run = () => { active++; fn().then(ok, no).finally(() => { active--; status(); if (waiting.length) waiting.shift()(); }); };
    if (active < 6) run(); else waiting.push(run);
    status();
  });
}
function beach(params) {
  return limited(async () => {
    const url = WIRE + (params ? '?' + new URLSearchParams(params) : '');
    let last;
    for (let i = 0; i < 2; i++) {
      try {
        const r = await fetch(url, { headers: { Accept: 'application/json' }, cache: 'no-store' });
        if (r.status === 404) return null;
        if (!r.ok) throw new Error('the beach answered ' + r.status);
        return await r.json();
      } catch (e) { last = e; if (!i) await sleep(700); }
    }
    throw last;
  });
}
/* ---------- the records, read as /lanes reads them (lanes.html): the newest container first, then the one before ---------- */
async function headOf(block) {
  const probe = await beach({ block, pscale: '9' });
  const F = probe && probe.floor;
  if (!F || F < 2) return { F: F || 1, prefix: '' };
  let prefix = '';
  for (let d = 1; d <= F - 1; d++) {
    const j = d === 1 ? await beach({ block, pscale: String(F - 1) }) : await beach({ block, spindle: prefix.padEnd(F, '0'), pscale: String(F - d) });
    const list = (j && (d === 1 ? j.entries : j.descent)) || [];
    const ds = list.map((e) => String(e.address).slice(-1)).filter((c) => /[1-9]/.test(c)).map(Number);
    prefix += ds.length ? String(Math.max(...ds)) : '0';
  }
  return { F, prefix };
}
function prevPrefix(p) {
  if (!p) return null;
  let n = parseInt(p, 10);
  while (--n > 0) { const s = String(n).padStart(p.length, '0'); if (!s.replace(/^0+/, '').includes('0')) return s; }
  return null;
}
async function readContainer(block, F, prefix) {
  const node = F < 2 ? await beach({ block }) : await beach({ block, spindle: prefix + '0' });
  if (!node || typeof node !== 'object') return [];
  const out = [];
  for (let k = 1; k <= 9; k++) { const e = node[String(k)]; if (e != null) out.push({ addr: (prefix + k).replace(/^0+/, '') || String(k), node: e }); }
  return out;
}
const ISO = /(20\d\d-\d\d-\d\dT\d\d:\d\d(?::\d\d(?:\.\d+)?)?Z)/;
const textOf = (v) => { while (v && typeof v === 'object') v = v._; return typeof v === 'string' ? v : ''; };
function stampOf(v) {
  if (v && typeof v === 'object' && typeof v['3'] === 'string') { const m = v['3'].match(ISO); if (m) return Date.parse(m[1]); }
  const t = textOf(v), m = t.match(/^\s*\[(20\d\d-\d\d-\d\dT[^\]]+Z)\]/);
  return m ? Date.parse(m[1]) : null;
}
/* an entry and the later turns appended beneath it (a lane's session) */
function turnsOf(entry, addr) {
  const turns = [{ addr, text: textOf(entry), at: stampOf(entry) }];
  if (entry && typeof entry === 'object') {
    for (const k of ['1', '2', '4', '5', '6', '7', '8', '9']) {
      const c = entry[k]; if (c == null) continue;
      const t = textOf(c);
      if (!t || (typeof c === 'string' && t.length < 120)) continue;
      turns.push({ addr: addr + (addr.includes('.') ? '' : '.') + k, text: t, at: stampOf(c) });
    }
  }
  let last = turns[0].at;
  turns.forEach((t) => { if (t.at == null) t.at = last; else last = t.at; });
  if (turns[0].at == null) { const first = turns.find((t) => t.at != null); turns.forEach((t) => { if (t.at == null) t.at = first ? first.at : null; }); }
  return turns.filter((t) => t.at != null && t.text);
}
const LANE_RX = /^\s*([A-Za-z][\w-]*(?:\.[\w-]+)*)(\s+(?:lane|wake)\b)?/;
function laneOf(text, hand) {
  const m = text.match(LANE_RX);
  if (m) {
    const tok = m[1], after = text.slice(m[0].length);
    if (m[2] && /wake/.test(m[2])) return tok.toLowerCase() + ' wake';
    if (m[2] || (/[.\-\d]/.test(tok) && /^\s*(?:\(|,|:|—|–|-\s|$)/.test(after))) return tok;
  }
  const s = text.replace(/^\s*\[(?:event\s*·\s*)?/, '');
  const w = s.match(/^([^,\]\(]*?\bproject(?: chat)?)\b/i) || text.match(/\bthe ([A-Z][\w.-]*(?: [\w.-]+){0,2}? project(?: chat)?)\b/)
        || text.match(/\bin (?:the )?((?:claude\.ai )?[\w.-]+(?: [\w.-]+){0,2}? [Pp]roject(?: [\w-]+)?|Cowork|Claude Code(?: desktop)?)\b/);
  return w ? w[1].trim() : hand;
}
const ROUTINE = /clock-woken|scheduled (?:wake|pass|morning|evening|sweep)|\bmorning sweep\b|\bevening settle\b|\bmorning glance\b|nobody present|no hand present|auto-mode scheduled/i;
const REPO = {
  'happyseaurchin-home': 'happyseaurchin/happyseaurchin-home', 'bsp-mcp-server': 'pscale-commons/bsp-mcp-server', 'bsp-mcp': 'pscale-commons/bsp-mcp-server',
  'xstream-bsp': 'happyseaurchin/xstream-bsp', 'xstream': 'happyseaurchin/xstream-bsp', 'pscale-beach-happyseaurchin': 'happyseaurchin/pscale-beach-happyseaurchin',
  'pscale-beach': 'pscale-commons/pscale-beach', 'deploys': 'happyseaurchin/pscale-beach-happyseaurchin', 'deploy': 'happyseaurchin/pscale-beach-happyseaurchin',
  'ticketing-agent': 'pscale-commons/ticketing-agent', 'community-recovery': 'pscale-commons/community-recovery'
};
const SHORT = { 'happyseaurchin/happyseaurchin-home': 'site', 'pscale-commons/bsp-mcp-server': 'bsp-mcp', 'happyseaurchin/xstream-bsp': 'mirror',
  'pscale-commons/pscale-beach': 'beach', 'happyseaurchin/pscale-beach-happyseaurchin': 'deploy', 'pscale-commons/ticketing-agent': 'tickets', 'pscale-commons/community-recovery': 'recovery' };
const PR_RX = /\b(happyseaurchin-home|bsp-mcp-server|bsp-mcp|xstream-bsp|xstream|pscale-beach-happyseaurchin|pscale-beach|ticketing-agent|community-recovery|deploys?)\s+(?:PRs?\s+)?#(\d{1,5})((?:\s*(?:,|and|&)\s*#\d{1,5}|\s*[–-]\s*#?\d{1,5})*)/g;
const URL_RX = /(?:\bhttps?:\/\/|\bclaude:\/\/)[^\s'"<>()\[\]{}]+|\b(?:[a-z0-9-]+\.)*(?:happyseaurchin\.com|onen\.ai|idiothuman\.com)\/[^\s'"<>()\[\]{},;]*/gi;
const PATH_RX = /(?:^|[\s(])(\/[a-z][a-z0-9-]{2,30}(?:\/[A-Za-z0-9<>_.-]+)*(?:\?[\w=&%+.-]+)?)(?=$|[\s),.;:'’!?])/g;
const PATH_SKIP = /^\/(?:reflection|mcp|v1|api|well-known|users|tmp|private|dev|etc|bin)\b/i;
const PROPOSAL_RX = /\bproposals\/(20\d\d-\d\d-\d\d-[\w-]+?)(\.md|\/)?(?=$|[\s,;)'’.:])/g;
const trimEnd = (s) => s.replace(/[.,;:!?'’)]+$/, '');
function kindOfUrl(u) {
  if (/^claude:\/\//i.test(u) || /claude\.ai\/code\/session_/i.test(u)) return 'session';
  if (/claude\.ai\/(?:code\/)?(?:artifact|public\/artifacts)\//i.test(u)) return 'app';
  if (/github\.com\/[^\/]+\/[^\/]+\/pull\/\d+/i.test(u)) return 'pr';
  if (/github\.com\//i.test(u)) return 'doc';
  if (/mirror\.onen\.ai/i.test(u)) return 'app';
  if (/happyseaurchin\.com\/read\b/i.test(u)) return 'doc';
  if (/happyseaurchin\.com\/animations\b/i.test(u)) return 'film';
  return 'page';
}
function labelOfUrl(u) {
  const s = u.replace(/^https?:\/\//, '');
  if (/claude\.ai\/(?:code\/)?(?:artifact|public\/artifacts)\//.test(u)) return 'claude.ai artifact';
  return s.replace(/^(?:www\.)?happyseaurchin\.com/, '').replace(/\/$/, '') || s;
}
/* what a turn made: pull requests, pages, documents, apps (the session links stay out: they are where, not what) */
function madeIn(text) {
  const out = []; let m;
  PR_RX.lastIndex = 0;
  while ((m = PR_RX.exec(text))) {
    const repo = REPO[m[1]]; if (!repo) continue;
    const nums = [+m[2]], tail = m[3] || '', re = /([–-])?\s*#?(\d{1,5})/g; let t;
    while ((t = re.exec(tail))) {
      const n = +t[2];
      if (t[1] && n > nums[nums.length - 1] && n - nums[nums.length - 1] <= 8) { for (let i = nums[nums.length - 1] + 1; i <= n; i++) nums.push(i); }
      else if (!t[1]) nums.push(n);
    }
    nums.forEach((n) => out.push({ kind: 'pr', repo, n, url: 'https://github.com/' + repo + '/pull/' + n, key: repo + '#' + n, label: (SHORT[repo] || repo) + ' #' + n }));
  }
  URL_RX.lastIndex = 0;

  return made.length ? '<h4>made</h4><ul>' + made.map((o) => { const pr = o.kind === 'pr' ? prOf(S.made.get(o.key) || o) : null; return '<li><span class="tag">' + esc(o.kind === 'pr' ? (pr ? pr.state : 'pr') : o.kind) + '</span> <a href="' + esc(o.url) + '" target="_blank" rel="noopener">' + esc(o.label) + '</a>' + (pr ? ' <span class="kv">' + esc(pr.title) + '</span>' : '') + '</li>'; }).join('') + '</ul>' : '';
}
function inspect(sel) {
  const close = '<button class="btn x" type="button" data-act="close" aria-label="Close">×</button>';
  if (sel.type === 'turn') {
    const T = sel.T, ts = laneTurns(T), i = ts.indexOf(T);
    const parts = T.partAddrs.map((a) => (inTime(T.at) ? nearest(a) : null)).filter(Boolean);
    return close + '<div class="kv"><span class="dot" style="background:var(' + hueOf(T.lane) + ')"></span><b>' + esc(T.hand) + '</b> · ' + esc(T.lane) + ' · ' + esc(SRC[T.src].label) + '</div>' +
      '<div class="kv">' + esc(when(T.at)) + ' · ' + esc(ago(T.at)) + '</div>' +
      '<div class="kv">at <a href="' + esc(openOnBeach(T.block, T.addr)) + '" target="_blank" rel="noopener">' + esc(T.block + ' ' + T.addr) + '</a></div>' +
      (parts.length ? '<div class="kv">parts: ' + parts.map((p) => '<a href="#" data-part="' + esc(p.addr) + '">' + esc(p.addr + ' ' + titleOf(p.text).toLowerCase()) + '</a>').join(', ') + '</div>' : '') +
      '<div class="text" id="itext">' + esc(T.text) + '</div>' +
      '<div class="step"><button class="btn" type="button" data-act="prev"' + (i > 0 ? '' : ' disabled') + '>← earlier turn</button><button class="btn" type="button" data-act="next"' + (i < ts.length - 1 ? '' : ' disabled') + '>later turn →</button><span class="hint" style="align-self:center">' + (i + 1) + ' of ' + ts.length + ' in this lane</span></div>' +
      madeList(T.made) + '<p class="hint"><button class="btn" type="button" data-act="live">read it live from the beach</button></p>';
  }
  if (sel.type === 'made') {
    const M = sel.M, pr = M.kind === 'pr' ? prOf(M) : null, hits = [...M.hits].map((id) => S.turns.get(id)).filter(Boolean).sort((a, b) => a.at - b.at);
    return close + '<div class="kv"><b>' + esc(M.kind === 'pr' ? 'pull request' : M.kind) + '</b>' + (pr ? ' · ' + esc(pr.state) : '') + '</div>' +
      '<h2><a href="' + esc(M.url) + '" target="_blank" rel="noopener">' + esc(M.label) + '</a></h2>' + (pr ? '<div class="kv">' + esc(pr.title) + '</div>' : '') +
      '<h4>named by</h4><ul>' + hits.map((T) => '<li><a href="#" data-turn="' + esc(T.id) + '">' + esc(when(T.at) + ' · ' + T.hand + ' · ' + T.lane) + '</a></li>').join('') + '</ul>';
  }
  if (sel.type === 'part') {
    const p = sel.p, hits = [...S.turns.values()].filter((T) => visibleTurn(T) && T.partAddrs.some((a) => { const q = nearest(a); return q && isUnder(q, p) && inTime(T.at); })).sort((a, b) => b.at - a.at);
    return close + '<div class="kv">spine:' + esc(FAMILY) + ' <b>' + esc(p.addr) + '</b> · <span class="tag" style="color:var(--' + p.mark + ')">' + esc(p.mark === 'none' ? 'not yet folded' : p.mark) + '</span></div>' +
      '<h2>' + esc(titleOf(p.text)) + '</h2><div class="text">' + esc(p.text) + '</div>' + (p.fold ? '<h4>where it stands</h4><div class="text">' + esc(p.fold) + '</div>' : '') +
      '<h4>turns that name it (' + hits.length + ')</h4><ul>' + hits.slice(0, 60).map((T) => '<li><a href="#" data-turn="' + esc(T.id) + '">' + esc(when(T.at) + ' · ' + T.hand + ' · ' + T.text.replace(/\s+/g, ' ').slice(0, 70)) + '</a></li>').join('') + '</ul>';
  }
  if (sel.type === 'lane' || sel.type === 'hand') {
    const ts = [...S.turns.values()].filter((T) => visibleTurn(T) && T.hand === sel.hand && (sel.type === 'hand' || T.lane === sel.lane)).sort((a, b) => b.at - a.at);
    const H = handOf(sel.hand), more = SOURCES.filter((s) => S.on[s.id] && H.recs[s.id] && !H.recs[s.id].done);
    return close + '<div class="kv">' + esc(sel.type === 'hand' ? 'a hand' : 'a lane of ' + sel.hand) + '</div><h2>' + esc(sel.type === 'hand' ? sel.hand : sel.lane) + '</h2>' +
      (sel.type === 'hand' && more.length ? '<p><button class="btn" type="button" data-act="older">read older entries</button> <span class="hint">' + esc(more.map((s) => s.label).join(', ')) + '</span></p>' : '') +
      '<h4>turns (' + ts.length + ')</h4><ul>' + ts.slice(0, 80).map((T) => '<li><a href="#" data-turn="' + esc(T.id) + '">' + esc(when(T.at) + ' · ' + (sel.type === 'hand' ? T.lane + ' · ' : '') + T.text.replace(/\s+/g, ' ').slice(0, 64)) + '</a></li>').join('') + '</ul>';
  }
  return intro();
}
function intro() {
  const p = S.ctx;
  return '<h2>the path as a code map</h2><p class="hint">Rows are the path\u2019s parts' + (p && !p.inv ? ' (this season, re-cut on ' + esc(p.archDate || '') + ')' : '') + ', then each hand and the sessions it ran, then what was made. Time runs across. Every turn is a node on its session\u2019s row; a turn that names a part echoes on that part\u2019s row; what a turn made stands on its own row, linked back.</p>' +
    '<p class="hint">Hover a node to read it. Click it to read it whole and step along its session with <kbd>←</kbd> <kbd>→</kbd>. Wheel to zoom time, drag to pan, wheel over the names to scroll. Click a part, a hand or a lane to see everything on it. Turn layers and hands on and off in the left panel; with everything on, it is everything the beach holds about the venture.</p>' +
    (p && p.foldRoot ? '<h4>where the path stands</h4><div class="text">' + esc(p.foldRoot) + '</div>' : '');
}
function wireInsp() {
  insp.querySelectorAll('[data-act]').forEach((b) => b.addEventListener('click', async () => {
    const a = b.dataset.act;
    if (a === 'close') select(null);
    else if (a === 'prev') stepTurn(-1);
    else if (a === 'next') stepTurn(1);
    else if (a === 'older') { b.disabled = true; b.textContent = 'reading…'; const H = handOf(S.sel.hand); await Promise.all(SOURCES.filter((s) => S.on[s.id] && H.recs[s.id] && !H.recs[s.id].done).map((s) => loadSource(H.name, s, true).catch(() => {}))); await askGitHub(); rebuild(); select(S.sel); }
    else if (a === 'live') {
      const T = S.sel.T; b.disabled = true; b.textContent = 'reading…';
      try { const j = await beach({ block: T.block, spindle: T.addr }); const t = textOf(j); if (t) { $('itext').textContent = t; b.textContent = 'read live just now'; } else b.textContent = 'nothing at that address now'; } catch (e) { b.textContent = 'the beach did not answer'; }
    }
  }));
  insp.querySelectorAll('[data-turn]').forEach((a) => a.addEventListener('click', (e) => { e.preventDefault(); const T = S.turns.get(a.dataset.turn); if (T) { select({ type: 'turn', T }); const x = xOf(T.at); if (x < GUT + 40 || x > W - 40) { V.t0 = T.at - ((W - GUT) / 2) * V.msPerPx; redraw(); } } }));
  insp.querySelectorAll('[data-part]').forEach((a) => a.addEventListener('click', (e) => { e.preventDefault(); const p = S.parts.get(a.dataset.part); if (p) select({ type: 'part', p }); }));
}

/* ---------- the left panel: every layer and every hand a toggle, with its count ---------- */
const side = $('side');
let HANDS_IN = new Map();
function counts() {
  const by = {}, hands = {};
  S.turns.forEach((T) => { by[T.src] = (by[T.src] || 0) + (visibleTurn(T) ? 1 : 0); hands[T.hand] = (hands[T.hand] || 0) + 1; });
  side.querySelectorAll('[data-count]').forEach((el) => { const k = el.dataset.count; el.textContent = k.startsWith('h:') ? (hands[k.slice(2)] || '') : (by[k] != null ? by[k] : ''); });
}
function drawSide() {
  const chk = (id, label, glyphTxt, note, on, data) => '<label class="chk" title="' + esc(note || '') + '"><input type="checkbox" ' + data + '="' + esc(id) + '"' + (on ? ' checked' : '') + '><span class="g">' + glyphTxt + '</span><span>' + esc(label) + '</span><span class="n" data-count="' + esc(data === 'data-hand' ? 'h:' + id : id) + '"></span></label>';
  const G = { circle: '●', ring: '○', square: '■', dot: '·', diamond: '◆', tri: '▲', trid: '▼', hollow: '□' };
  const hands = [...HANDS_IN.keys()].sort((a, b) => (Date.parse(S.ix.touched['watch:' + b] || S.ix.touched['history:' + b] || '') || 0) - (Date.parse(S.ix.touched['watch:' + a] || S.ix.touched['history:' + a] || '') || 0));
  side.innerHTML = '<h3>sources</h3>' + SOURCES.map((s) => chk(s.id, s.label, G[s.glyph], s.note, S.on[s.id], 'data-src')).join('') +
    '<h3>made</h3>' + MADE.map((m) => chk(m.id, m.label, m.id === 'pr' ? '#' : m.id === 'page' ? '▲' : m.id === 'doc' ? '■' : '◆', '', S.on[m.id], 'data-src')).join('') +
    '<h3>links</h3>' + LINKS.map((l) => chk(l.id, l.label, l.id === 'threads' ? '─' : l.id === 'echo' ? '┆' : l.id === 'madeLinks' ? '╱' : '◌', l.note, S.on[l.id], 'data-src')).join('') +
    '<h3>hands</h3><div class="row2"><button class="btn" type="button" data-all="1">all</button><button class="btn" type="button" data-all="0">none</button><button class="btn" type="button" data-all="d">usual</button></div>' +
    hands.map((h) => chk(h, h, '<span class="dot" style="background:var(' + hueOf(h) + ');margin:0"></span>', [...HANDS_IN.get(h)].join(', '), S.handsOn.has(h), 'data-hand')).join('') +
    '<p class="note">A hand\u2019s sources load when it is switched on: the newest entries first, older ones from the hand\u2019s own panel.</p>';
  side.querySelectorAll('[data-src]').forEach((i) => i.addEventListener('change', async () => {
    S.on[i.dataset.src] = i.checked; store.set('on', S.on); rebuild(); redraw();
    if (i.checked && SOURCES.some((s) => s.id === i.dataset.src)) { await loadVisible(); rebuild(); redraw(); }
  }));
  side.querySelectorAll('[data-hand]').forEach((i) => i.addEventListener('change', async () => {
    i.checked ? S.handsOn.add(i.dataset.hand) : S.handsOn.delete(i.dataset.hand); store.set('hands', [...S.handsOn]); rebuild(); redraw();
    if (i.checked) { await loadVisible(); rebuild(); redraw(); }
  }));
  side.querySelectorAll('[data-all]').forEach((b) => b.addEventListener('click', async () => {
    const v = b.dataset.all; S.handsOn = new Set(v === '1' ? hands : v === 'd' ? DEFAULT_HANDS : []); store.set('hands', [...S.handsOn]);
    drawSide(); rebuild(); redraw(); await loadVisible(); rebuild(); redraw();
  }));
  counts();
}

/* ---------- the top bar ---------- */
function press(seg, attr, val) { $(seg).querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset[attr] === String(val)))); }
$('viewSeg').querySelectorAll('button').forEach((b) => b.addEventListener('click', async () => {
  if (S.view === b.dataset.view) return;
  S.view = b.dataset.view; store.set('view', S.view); press('viewSeg', 'view', S.view); S.sel = null;
  await readParts(); rebuild(); select(null);
}));
$('rangeSeg').querySelectorAll('button').forEach((b) => b.addEventListener('click', () => { S.range = +b.dataset.range; store.set('range', S.range); press('rangeSeg', 'range', S.range); fitRange(S.range); redraw(); }));
let qt = 0; $('q').addEventListener('input', (e) => { clearTimeout(qt); qt = setTimeout(() => { S.q = e.target.value.trim().toLowerCase(); rebuild(); redraw(); }, 120); });
$('themeBtn').addEventListener('click', () => { const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = t; try { localStorage.setItem('beach-tree-v3:theme', t); } catch (e) {} readColors(); redraw(); });
$('drawerBtn').addEventListener('click', () => { const open = !side.classList.contains('open'); side.classList.toggle('open', open); $('drawerBtn').setAttribute('aria-expanded', String(open)); });
let loadedOnce = false;
function status() {
  const s = $('status'); if (!s) return;
  if (active || waiting.length) { s.className = 'status'; s.textContent = 'reading the beach · ' + (active + waiting.length) + ' open'; }
  else if (loadedOnce) { s.className = 'status live'; s.textContent = S.turns.size + ' turns · ' + S.made.size + ' made · read ' + new Date().toISOString().slice(11, 16) + 'Z'; }
}

/* ---------- start ---------- */
async function start() {
  readColors(); resize(); fitRange(S.range);
  press('viewSeg', 'view', S.view); press('rangeSeg', 'range', S.range);
  insp.innerHTML = intro();
  try {
    await readIndex();
    HANDS_IN = handsInIndex();
    drawSide();
    await readParts();
    const inv = $('invBtn'); if (S.ctx.arch) inv.textContent = 'inventory to ' + S.ctx.archDate; else inv.hidden = true;
    insp.innerHTML = intro();
    rebuild(); redraw();
    await loadVisible();
    loadedOnce = true; rebuild(); redraw(); status();
  } catch (e) {
    $('status').textContent = 'the beach could not be read: ' + (e && e.message || e);
  }
}
let rz = 0; addEventListener('resize', () => { cancelAnimationFrame(rz); rz = requestAnimationFrame(() => { const span = (W - GUT) * V.msPerPx, right = V.t0 + span; resize(); V.msPerPx = span / Math.max(100, W - GUT); V.t0 = right - span; redraw(); }); });
/* the newest container of every record read, and this week of every clock, read again while the page is in view */
async function refreshNewest() {
  if (document.hidden || !loadedOnce) return;
  const jobs = [];
  S.hands.forEach((H) => Object.entries(H.recs).forEach(([sid, R]) => {
    const src = SOURCES.find((x) => x.id === sid); if (!src) return;
    if (src.shape === 'acc') jobs.push((async () => { const head = await headOf(R.block); const es = await readContainer(R.block, head.F, head.prefix);
      es.forEach((e) => { if (sid === 'room') { const who = e.node && typeof e.node === 'object' && typeof e.node['1'] === 'string' ? e.node['1'] : 'someone', t = { addr: e.addr, text: textOf(e.node), at: stampOf(e.node) }; if (t.text && t.at != null) addTurn(who, sid, R.block, t, 'room', { cited: S.ctx.cited.get(e.addr) }); return; }
        const ts = turnsOf(e.node, e.addr); if (!ts.length) return; const lane = laneOf(ts[0].text, H.name); ts.forEach((t, j) => addTurn(H.name, sid, R.block, t, lane, { parent: j ? R.block + ' ' + ts[0].addr : null })); }); })().catch(() => {}));
    else if (src.shape === 'clock') jobs.push((async () => { const w = weekAddr(Date.now()), node = await beach({ block: R.block, spindle: w }); if (!node) return; const out = []; clockEntries(node, w.slice(0, 7), out); out.forEach((t) => addTurn(H.name, sid, R.block, t, sid === 'cards' ? 'cards' : null, { part5: t.part5 })); })().catch(() => {}));
  }));
  await Promise.all(jobs); await askGitHub(); rebuild(); redraw(); status();
}
setInterval(refreshNewest, 3 * 60e3);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshNewest(); });
start();
})();
</script>
</body>
</html>
