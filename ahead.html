<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ahead — what stands ahead of you</title>
<meta name="description" content="Your piles of the indexical future — intents at the grain they are sized for, never arriving unless pulled into now. Tomorrow, permanently.">
<meta property="og:title" content="Ahead — what stands ahead of you">
<meta property="og:description" content="Your piles of the indexical future — intents at the grain they are sized for, never arriving unless pulled into now.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Space+Mono:wght@400;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme.css">
<script src="/theme.js"></script>
<style>
  *{box-sizing:border-box} html,body{margin:0}
  body{
    font-family:var(--body); color:var(--foam); font-size:17px; line-height:1.55;
    background:radial-gradient(1100px 560px at 70% -10%, rgba(var(--liquid-rgb),0.10), transparent 60%),
      linear-gradient(180deg,var(--ground-top) 0%, var(--deep) 30%, var(--abyss) 100%);
    -webkit-font-smoothing:antialiased; min-height:100dvh;
  }
  ::selection{background:rgba(var(--liquid-rgb),0.30);color:var(--foam)}
  a{color:var(--liquid);text-decoration:none;border-bottom:1px solid rgba(var(--liquid-rgb),0.35)}
  a:hover{color:var(--foam);border-color:var(--foam)}
  .hidden{display:none !important}
  button{font-family:var(--mono)}
  textarea:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--liquid);outline-offset:2px}

  .bar{position:sticky;top:0;z-index:10;background:rgba(var(--well-rgb),0.72);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:12px 18px;
    font-family:var(--mono);font-size:12px;letter-spacing:0.08em;color:var(--vapour-dim)}
  .bar .dot{width:6px;height:6px;border-radius:50%;background:var(--liquid);box-shadow:0 0 10px var(--liquid);flex:none}
  .bar b{color:var(--foam)}
  .bar a{border-bottom:none;color:var(--vapour-dim)} .bar a:hover{color:var(--liquid)}
  .bar .spacer{flex:1}

  .ask{padding:80px 26px;max-width:560px;margin:0 auto}
  .ask h1{font-family:var(--display);font-weight:800;font-size:clamp(2rem,7vw,3rem);line-height:1.06;margin:0 0 14px}
  .ask h1 .cool{color:var(--liquid)}
  .ask p{color:var(--vapour);margin:0 0 22px;max-width:44ch}
  .ask__row{display:flex;gap:10px;max-width:420px}
  .ask__row input{flex:1;min-width:0;background:rgba(var(--well-rgb),0.55);border:1px solid var(--line-strong);
    border-radius:4px;padding:13px 15px;color:var(--foam);font-family:var(--mono);font-size:14px}
  .ask__row button{flex:none;font-weight:700;font-size:13px;letter-spacing:0.04em;text-transform:uppercase;
    color:var(--abyss);background:var(--liquid);border:none;border-radius:4px;padding:13px 22px;cursor:pointer}
  .ask__row button:hover{background:var(--foam)}

  .wrap{max-width:860px;margin:0 auto;padding:0 18px 90px}

  /* the temporal separator — a rung's name on a hairline, walk-style */
  .sep{display:flex;align-items:center;gap:12px;margin:30px 0 10px;
    font-family:var(--mono);font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:var(--vapour-dim)}
  .sep::after{content:"";height:1px;background:var(--line);flex:1}

  /* the pile — a horizontal strip of minimal cards, the /now band idiom */
  .pile{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:thin}
  .card{flex:none;width:150px;border:1px solid var(--line);border-radius:8px;padding:9px 11px;cursor:text;
    background:rgba(var(--well-rgb),0.35)}
  .card .tx{display:block;font-size:12.5px;line-height:1.45;color:var(--vapour);max-height:7.2em;overflow:hidden;white-space:pre-wrap}
  .card:hover{border-color:var(--line-strong)}
  .card.blank{border-style:dashed;opacity:0.65}
  .card.blank:focus-within{opacity:1;border-style:solid;border-color:var(--line-strong)}
  .card textarea{width:100%;min-height:5.6em;background:none;border:none;resize:none;padding:0;margin:0;
    color:var(--foam);font-family:var(--body);font-size:12.5px;line-height:1.45;outline:none}

  .foot{margin:44px 0 0;padding-top:16px;border-top:1px solid var(--line);
    font-family:var(--mono);font-size:12px;color:var(--vapour-dim);line-height:2}

  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:40;
    background:rgba(var(--well-rgb),0.95);border:1px solid var(--line-strong);border-radius:8px;
    color:var(--foam);font-family:var(--mono);font-size:12.5px;padding:10px 16px;opacity:0;transition:opacity 0.25s}
  .toast.show{opacity:1}
</style>
</head>
<body>

<div class="bar">
  <span class="dot"></span>
  <span><b>ahead</b> · <span id="bar-handle">—</span></span>
  <span class="spacer"></span>
  <a id="bar-now" href="/now">your now</a>
  <a id="bar-morning" href="/morning">the morning</a>
</div>

<section id="ask" class="ask hidden">
  <h1>What stands <span class="cool">ahead</span> of you.</h1>
  <p>Piles of intent at the grain they are sized for — tomorrow, permanently. Nothing here
     takes a date, books anybody, or arrives on its own. Whose ahead is this?</p>
  <div class="ask__row">
    <input id="ask-handle" placeholder="your handle" autocomplete="off" spellcheck="false">
    <button id="ask-go">open</button>
  </div>
</section>

<main id="page" class="wrap hidden">
  <div id="piles"></div>
  <footer class="foot">
    nothing here arrives on its own — doing lands in <a id="f-now" href="/now">your now</a>, in its own time
  </footer>
</main>

<div id="toast" class="toast"></div>

<script>
'use strict';
document.documentElement.classList.remove('no-js');

const BEACH = 'https://beach.happyseaurchin.com/.well-known/pscale-beach';
async function readBlock(name){
  const r = await fetch(BEACH + '?block=' + encodeURIComponent(name), { headers:{Accept:'application/json'}, cache:'no-store' });
  if (r.status === 404) return null;
  if (!r.ok) throw new Error('beach read failed: ' + r.status);
  return r.json();
}
async function writeBlock(body){
  const r = await fetch(BEACH, { method:'POST', cache:'no-store',
    headers:{'Content-Type':'application/json', Accept:'application/json'},
    body: JSON.stringify(body) });
  let d = null; try { d = await r.json(); } catch(e){}
  return { ok: r.ok, status: r.status, data: d };
}
const lockRequired = w => !w.ok && w.data && (w.data.code === 'lock_required' || w.data.error === 'lock_required');
const esc = s => { const d = document.createElement('span'); d.textContent = s == null ? '' : s; return d.innerHTML; };
const $ = id => document.getElementById(id);

/* the piles, nearest first — digit is rung (function:ahead 1) */
const PILES = [
  { d: '1', label: 'within hours' },
  { d: '2', label: 'tomorrow' },
  { d: '3', label: 'a week out' },
  { d: '4', label: 'a month out' },
  { d: '5', label: 'a season out' },
  { d: '6', label: 'a year out' },
  { d: '7', label: 'a decade out' },
];

let HANDLE = null;
{
  const m = location.pathname.match(/\/ahead\/([^\/]+)\/?$/);
  const q = new URLSearchParams(location.search).get('handle');
  HANDLE = ((m && decodeURIComponent(m[1])) || q || '').replace(/[^a-z0-9 _-]/gi, '').trim() || null;
}
let BLOCK = null;
const latchKey = () => 'ahead-latch:' + HANDLE;

function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._h); toast._h = setTimeout(() => t.classList.remove('show'), 2600);
}

/* items of a pile: digit-leaf strings, address-ordered, supernest-tolerant */
function itemsOf(node, at, out){
  out = out || [];
  if (node == null) return out;
  if (typeof node === 'string'){ if (node.trim()) out.push({ addr: at, text: node.trim() }); return out; }
  for (const k of Object.keys(node).sort()){
    if (k === '_' || /^[1-9]$/.test(k)) itemsOf(node[k], at + (k === '_' ? '0' : k), out);
  }
  return out;
}

function render(){
  const box = $('piles');
  box.innerHTML = '';
  PILES.forEach(p => {
    const sep = document.createElement('div');
    sep.className = 'sep';
    sep.textContent = p.label;
    box.appendChild(sep);
    const strip = document.createElement('div');
    strip.className = 'pile';
    const items = BLOCK ? itemsOf(BLOCK[p.d], p.d) : [];
    items.forEach(it => {
      const c = document.createElement('div');
      c.className = 'card';
      c.innerHTML = '<span class="tx">' + esc(it.text) + '</span>';
      c.addEventListener('click', () => editCard(c, p, it));
      strip.appendChild(c);
    });
    strip.appendChild(blankCard(p));
    box.appendChild(strip);
  });
}

function blankCard(p){
  const c = document.createElement('div');
  c.className = 'card blank';
  const ta = document.createElement('textarea');
  ta.placeholder = '…';
  c.appendChild(ta);
  const commit = async () => {
    const text = ta.value.trim();
    if (!text) return;
    ta.disabled = true;
    const ok = await land(p.d, text);
    if (!ok){ ta.disabled = false; return; }
    await refresh();
  };
  ta.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); commit(); } });
  ta.addEventListener('blur', commit);
  return c;
}

function editCard(cardEl, p, it){
  if (cardEl.querySelector('textarea')) return;
  const ta = document.createElement('textarea');
  ta.value = it.text;
  cardEl.innerHTML = '';
  cardEl.appendChild(ta);
  ta.focus();
  const commit = async () => {
    const text = ta.value.trim();
    if (text === it.text){ render(); return; }
    ta.disabled = true;
    const ok = await revise(it.addr, text);
    if (!ok){ ta.disabled = false; return; }
    await refresh();
  };
  ta.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); commit(); } });
  ta.addEventListener('blur', commit);
}

async function withLatch(body){
  const latch = localStorage.getItem(latchKey());
  if (latch) body.secret = latch;
  let w = await writeBlock(body);
  if (lockRequired(w)){
    const v = prompt('ahead:' + HANDLE + ' is latched — enter your key (kept on this device):');
    if (v === null || !v.trim()) return { ok: false };
    body.secret = v.trim();
    w = await writeBlock(body);
    if (w.ok) localStorage.setItem(latchKey(), v.trim());
  }
  return w;
}

/* land an intent in a pile — the first landing founds the block, born locked */
async function land(pile, text){
  const fresh = await readBlock('ahead:' + HANDLE).catch(() => undefined);
  if (fresh === undefined){ toast('the beach did not answer — nothing landed'); return false; }
  if (fresh === null){
    let latch = localStorage.getItem(latchKey());
    if (!latch){
      const v = prompt('First landing founds your ahead, locked to you.\nInvent a key that is yours alone (kept on this device):');
      if (v === null || !v.trim()) return false;
      latch = v.trim();
    }
    const root = { '_': 'AHEAD — ' + HANDLE + "'s piles of the indexical future (spine:ahead): intents at the grain they are sized for, unordered within their pile, never arriving unless pulled into now and landed in the mirror as record. Sovereign; a pile is appetite, not sequence." };
    root[pile] = { '1': text };
    const w = await writeBlock({ block: 'ahead:' + HANDLE, content: root, new_lock: latch });
    if (!w.ok){ toast('the founding was refused (' + w.status + ')'); return false; }
    localStorage.setItem(latchKey(), latch);
    toast('ahead founded, latched to ' + HANDLE);
    return true;
  }
  BLOCK = fresh;
  const body = BLOCK[pile] && typeof BLOCK[pile] === 'object'
    ? { block: 'ahead:' + HANDLE, spindle: pile, append: true, content: text }
    : { block: 'ahead:' + HANDLE, spindle: pile, content: { '1': text } };
  const w = await withLatch(body);
  if (!w.ok){ if (w.status) toast('the beach refused it (' + w.status + ')'); return false; }
  return true;
}

/* revise an item in place — merge-safe if it ever grew children; empty clears */
async function revise(addr, text){
  const fresh = await readBlock('ahead:' + HANDLE).catch(() => undefined);
  if (fresh === undefined){ toast('the beach did not answer — nothing written'); return false; }
  if (fresh) BLOCK = fresh;
  let n = BLOCK;
  for (const ch of String(addr)){ n = (n && typeof n === 'object') ? (ch === '0' ? n['_'] : n[ch]) : undefined; }
  const content = (n && typeof n === 'object') ? Object.assign({}, n, { '_': text }) : text;
  const w = await withLatch({ block: 'ahead:' + HANDLE, spindle: addr, content: content });
  if (!w.ok){ if (w.status) toast('the beach refused it (' + w.status + ')'); return false; }
  return true;
}

async function refresh(){
  BLOCK = await readBlock('ahead:' + HANDLE).catch(() => BLOCK);
  render();
}

async function boot(){
  if (!HANDLE){
    $('ask').classList.remove('hidden');
    $('ask-go').addEventListener('click', () => {
      const v = $('ask-handle').value.replace(/[^a-z0-9 _-]/gi, '').trim();
      if (v) location.href = '/ahead/' + encodeURIComponent(v);
    });
    $('ask-handle').addEventListener('keydown', e => { if (e.key === 'Enter') $('ask-go').click(); });
    return;
  }
  $('page').classList.remove('hidden');
  $('bar-handle').textContent = HANDLE;
  $('bar-now').href = '/now/' + encodeURIComponent(HANDLE);
  $('bar-morning').href = '/morning/' + encodeURIComponent(HANDLE);
  $('f-now').href = '/now/' + encodeURIComponent(HANDLE);
  render();
  BLOCK = await readBlock('ahead:' + HANDLE).catch(() => null);
  render();
}
boot();
</script>
</body>
</html>
