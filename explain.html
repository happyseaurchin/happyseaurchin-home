<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Explained — a convention, in its own words</title>
<meta name="description" content="Any convention on the beach, explained from the block that defines it — the words arrive live on every load, so the explanation cannot rot.">
<meta property="og:title" content="Explained — a convention, in its own words">
<meta property="og:description" content="The block is the explanation: a live render of any convention on the beach.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Space+Mono:wght@400;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme.css">
<script src="/theme.js"></script>
<style>
  *{box-sizing:border-box} html,body{margin:0}
  body{
    font-family:var(--body); color:var(--foam); font-size:19px; line-height:1.62;
    background:radial-gradient(1100px 560px at 70% -10%, rgba(var(--liquid-rgb),0.10), transparent 60%),
      linear-gradient(180deg,var(--ground-top) 0%, var(--deep) 30%, var(--abyss) 100%);
    background-attachment:fixed; -webkit-font-smoothing:antialiased; min-height:100dvh;
  }
  ::selection{background:rgba(var(--liquid-rgb),0.30);color:var(--foam)}
  a{color:var(--liquid);text-decoration:none;border-bottom:1px solid rgba(var(--liquid-rgb),0.35)}
  a:hover{color:var(--foam);border-color:var(--foam)}
  .hidden{display:none !important}
  .wrap{max-width:820px;margin:0 auto;padding:0 24px}

  .hero{padding:52px 0 8px}
  .hero .kicker{font-family:var(--mono);font-size:12px;letter-spacing:0.16em;text-transform:uppercase;color:var(--liquid);margin:0 0 16px;display:flex;gap:10px;align-items:center}
  .hero .kicker .dot{width:6px;height:6px;border-radius:50%;background:var(--liquid);box-shadow:0 0 12px var(--liquid);flex:none}
  h1{font-family:var(--display);font-weight:800;font-size:clamp(2rem,6.4vw,3.4rem);line-height:1.05;margin:0 0 18px}
  h1 .cool{color:var(--liquid)}
  .lede{font-size:clamp(1.1rem,2.4vw,1.3rem);color:var(--vapour);max-width:60ch;margin:0 0 14px}
  .live-count{font-family:var(--mono);font-size:12px;letter-spacing:0.06em;color:var(--vapour-dim)}
  .live-count b{color:var(--solid)}

  .framed{border:1px solid rgba(var(--solid-rgb),0.35);border-radius:10px;padding:14px 18px;margin:18px 0 0;font-size:1rem;color:var(--vapour);background:radial-gradient(500px 200px at 20% 0%, rgba(var(--solid-rgb),0.06), transparent 60%)}

  h2{font-family:var(--display);font-weight:700;font-size:clamp(1.35rem,3.4vw,1.8rem);margin:44px 0 14px;letter-spacing:-0.01em}
  h2 .n{font-family:var(--mono);font-size:12px;color:var(--liquid);vertical-align:middle;margin-right:10px;letter-spacing:0.1em}
  p{margin:0 0 14px;color:var(--vapour)}
  p b{color:var(--foam);font-weight:600}

  .convention{margin:16px 0}
  .cbranch{border:1px solid var(--line);border-radius:10px;margin:0 0 10px;overflow:hidden}
  .cbranch summary{list-style:none;cursor:pointer;padding:14px 18px;font-family:var(--mono);font-size:13.5px;letter-spacing:0.04em;color:var(--vapour);display:flex;gap:12px;align-items:baseline}
  .cbranch summary::-webkit-details-marker{display:none}
  .cbranch summary .bno{color:var(--liquid);flex:none}
  .cbranch summary:hover{color:var(--foam)}
  .cbranch .cbody{padding:4px 18px 16px;font-size:1.02rem;color:var(--vapour);border-top:1px solid var(--line);line-height:1.66}
  .kid{display:flex;gap:12px;align-items:baseline;padding:9px 0 0;font-size:0.97rem}
  .kid__no{font-family:var(--mono);font-size:10.5px;color:var(--vapour-dim);flex:none;min-width:44px}
  .kid__text{flex:1;color:var(--vapour)}
  .kid.lvl2{padding-left:22px}
  .src{font-family:var(--mono);font-size:11px;letter-spacing:0.05em;color:var(--vapour-dim);margin:6px 2px 0}
  .src b{color:var(--liquid);font-weight:700}

  .op-live{border:1px solid rgba(var(--solid-rgb),0.3);border-radius:10px;padding:16px 18px;margin:16px 0;background:radial-gradient(500px 200px at 20% 0%, rgba(var(--solid-rgb),0.06), transparent 60%)}
  .op-live h3{font-family:var(--mono);font-size:11.5px;letter-spacing:0.1em;text-transform:uppercase;color:var(--solid);margin:0 0 10px}
  .op-live .opline{font-family:var(--mono);font-size:14.5px;color:var(--foam);padding:3px 0;display:block}
  .op-live p{font-size:0.98rem;margin:10px 0 0;color:var(--vapour-dim)}

  .cat{margin:26px 0 0}
  .cat__head{font-family:var(--mono);font-size:11.5px;letter-spacing:0.1em;text-transform:uppercase;color:var(--liquid);margin:0 0 8px}
  .fam{display:flex;gap:12px;align-items:baseline;padding:11px 4px;border-bottom:1px solid var(--line)}
  .fam__name{font-family:var(--mono);font-size:13px;flex:none;min-width:170px}
  .fam__voice{flex:1;color:var(--vapour);font-size:0.95rem}

  .paths{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin:18px 0}
  @media(max-width:640px){.paths{grid-template-columns:1fr}}
  .path{border:1px solid var(--line);border-radius:10px;padding:16px}
  .path h3{font-family:var(--display);font-size:1.1rem;margin:0 0 8px}
  .path p{font-size:0.96rem;margin:0 0 10px}
  .path a.go{font-family:var(--mono);font-size:12.5px;font-weight:700}

  .state{padding:60px 26px;text-align:center;max-width:480px;margin:0 auto}
  .state h2{margin:0 0 10px}
  .state p{color:var(--vapour-dim)}

  .foot{max-width:820px;margin:0 auto;padding:30px 24px 50px;font-family:var(--mono);font-size:11px;letter-spacing:0.05em;color:var(--vapour-dim);display:flex;gap:16px;flex-wrap:wrap}
  .foot a{border-bottom:none;color:var(--vapour-dim)} .foot a:hover{color:var(--liquid)}
</style>
</head>
<body>
<script>document.documentElement.classList.remove('no-js');</script>

<main class="wrap hidden" id="main"></main>
<div id="state" class="state hidden"><h2 id="state-title"></h2><p id="state-body"></p></div>
<div class="foot" id="foot"></div>

<script>
(function(){
'use strict';
const BEACH = 'https://beach.happyseaurchin.com/.well-known/pscale-beach';
const PAGE = /\.html$/.test(location.pathname) ? location.pathname : '/explain';
const Q = new URLSearchParams(location.search);
const BLOCK = (Q.get('block') || '').replace(/[^a-zA-Z0-9:_-]/g,'');

/* hand frame-packs — one entry per convention that has earned a hand-built frame.
   The pack is the FRAME only (where the diagram and stances live); the words stay in the block. */
const PACKS = {
  'ways:deck': { page: '/decks', note: 'This convention has a hand-framed explainer — the diagram, the stances, the worked example.' },
  'ways:views': { page: '/views', note: 'This convention has a hand-framed explainer — the three-layer diagram, the publishing loop, the live counts.' }
};

async function readBlock(name){
  const r = await fetch(BEACH + '?block=' + encodeURIComponent(name), { headers:{Accept:'application/json'}, cache:'no-store' });
  if (r.status === 404) return null;
  if (!r.ok) throw new Error('beach read failed: ' + r.status);
  return r.json();
}
async function readIndex(){
  const r = await fetch(BEACH, { headers:{Accept:'application/json'}, cache:'no-store' });
  if (!r.ok) throw new Error('beach index failed: ' + r.status);
  return r.json();
}
function voiceOf(node){
  let n = node;
  while (n && typeof n === 'object') { if (!('_' in n)) return null; n = n['_']; }
  return typeof n === 'string' ? n : null;
}
function digitKeys(node){
  if (!node || typeof node !== 'object') return [];
  return Object.keys(node).filter(k => /^[1-9]$/.test(k)).sort();
}
const esc = s => { const d = document.createElement('span'); d.textContent = s == null ? '' : s; return d.innerHTML; };
const $ = id => document.getElementById(id);
const short = (s,n) => { s = s || ''; return s.length > n ? s.slice(0,n).replace(/\s+\S*$/,'') + ' …' : s; };
function kickerOf(name){
  if (name.startsWith('ways:')) return 'a way things are done here, in its own words';
  if (name.startsWith('function:')) return 'an operator — a reusable configuration, in its own words';
  return 'a block on the beach, in its own words';
}
function prettyName(name){ return name.replace(/^(ways|function):/,''); }
function showState(title, body){
  $('main').classList.add('hidden');
  $('state-title').textContent = title;
  $('state-body').innerHTML = body;
  $('state').classList.remove('hidden');
}

/* ---------- the catalogue (no ?block=) ---------- */
async function loadCatalogue(){
  let index;
  try { index = await readIndex(); } catch(e){ return showState('The beach is out of reach.', esc(String(e.message || e))); }
  const blocks = index.blocks || [];
  const ways = blocks.filter(b => b.startsWith('ways:')).sort();
  const fns = blocks.filter(b => b.startsWith('function:')).sort();
  const BARE = ['tree','conventions','grit','roles','worlds','usecases','open-to-business'];
  const bare = BARE.filter(b => blocks.includes(b));
  const roots = {};
  await Promise.all([...ways, ...fns, ...bare].map(async n => { try { roots[n] = await readBlock(n); } catch(e){} }));
  const row = n => '<div class="fam"><span class="fam__name"><a href="' + PAGE + '?block=' + encodeURIComponent(n) + '">' + esc(n) + '</a></span>' +
    '<span class="fam__voice">' + esc(short(voiceOf(roots[n]) || '', 110)) + '</span></div>';
  const out = [];
  out.push('<header class="hero"><p class="kicker"><span class="dot"></span> the conventions, each in its own words</p>' +
    '<h1>How this place <span class="cool">works</span> — from the blocks that define it.</h1>' +
    '<p class="lede">Every convention here is a public block written to be read — by people, and by the LLMs sitting beside them. These pages add a frame; the words arrive from the block on every load, so the explanation cannot rot.</p>' +
    '<p class="live-count"><b>' + (ways.length + fns.length + bare.length) + '</b> conventions on this beach right now — this list is read live</p></header>');
  if (ways.length){ out.push('<div class="cat"><div class="cat__head">ways — how a thing is done</div>' + ways.map(row).join('') + '</div>'); }
  if (fns.length){ out.push('<div class="cat"><div class="cat__head">functions — operators a field can mount</div>' + fns.map(row).join('') + '</div>'); }
  if (bare.length){ out.push('<div class="cat"><div class="cat__head">the wider laws</div>' + bare.map(row).join('') + '</div>'); }
  $('main').innerHTML = out.join('');
  $('main').classList.remove('hidden'); $('state').classList.add('hidden');
  $('foot').innerHTML = '<a href="/decks">the worked example — decks →</a><a href="/tree">walk the shared fields →</a><span>public reads only — the block is the explanation</span>';
}

/* ---------- one convention ---------- */
function renderKids(node, out, lvl){
  if (lvl > 2) return;
  for (const d of digitKeys(node)){
    const kid = node[d];
    const t = typeof kid === 'string' ? kid : voiceOf(kid);
    if (t) out.push('<div class="kid' + (lvl === 2 ? ' lvl2' : '') + '"><span class="kid__no">·' + d + '</span><span class="kid__text">' + esc(t) + '</span></div>');
    if (kid && typeof kid === 'object') renderKids(kid, out, lvl + 1);
  }
}
async function loadConvention(){
  let block;
  try { block = await readBlock(BLOCK); } catch(e){ return showState('The beach is out of reach.', esc(String(e.message || e))); }
  if (!block || typeof block !== 'object') return showState('No such block.', esc(BLOCK) + ' is not on the beach. <a href="' + PAGE + '">See what is →</a>');

  const rootV = voiceOf(block) || '';
  const pack = PACKS[BLOCK];
  const out = [];
  out.push('<header class="hero"><p class="kicker"><span class="dot"></span> ' + esc(kickerOf(BLOCK)) + '</p>' +
    '<h1><span class="cool">' + esc(prettyName(BLOCK)) + '</span>, explained.</h1>' +
    '<p class="lede">' + esc(rootV) + '</p>' +
    '<p class="live-count">read live from <b>' + esc(BLOCK) + '</b> at beach.happyseaurchin.com — reload and it is read again</p>' +
    (pack ? '<div class="framed">' + esc(pack.note) + ' <a href="' + esc(pack.page) + '">open it →</a></div>' : '') +
    '</header>');

  /* the branches, each expandable, children shown in place */
  out.push('<h2><span class="n">01</span>The convention, branch by branch</h2>');
  out.push('<div class="convention">');
  const opLines = [];
  for (const d of digitKeys(block)){
    const node = block[d];
    const t = typeof node === 'string' ? node : voiceOf(node);
    /* an operator declaration at 9 is dials, not prose — pulled out below */
    if (d === '9'){
      const collect = n => { if (typeof n === 'string'){ const m = n.match(/^(mode|respond|disarm|access):\s*.+/i); if (m) opLines.push(m[0]); } else if (n && typeof n === 'object'){ const v = voiceOf(n); if (v){ const m = v.match(/^(mode|respond|disarm|access):\s*.+/i); if (m) opLines.push(m[0]); } for (const k of digitKeys(n)) collect(n[k]); } };
      collect(node);
      if (opLines.length) continue;
    }
    if (!t && !(node && typeof node === 'object' && digitKeys(node).length)) continue;
    const kids = [];
    if (node && typeof node === 'object') renderKids(node, kids, 1);
    out.push('<details class="cbranch"' + (d === '1' ? ' open' : '') + '><summary><span class="bno">' + d + '</span>' + esc(short(t || '(unvoiced branch)', 76)) + '</summary>' +
      '<div class="cbody">' + esc(t || '') + (kids.length ? kids.join('') : '') + '</div></details>');
  }
  out.push('</div>');
  out.push('<p class="src">source: <b>' + esc(BLOCK) + '</b> — <a href="/render?beach=beach.happyseaurchin.com&block=' + encodeURIComponent(BLOCK) + '">the raw block →</a></p>');

  if (opLines.length){
    out.push('<h2><span class="n">02</span>The dials — read live from position 9</h2>');
    out.push('<div class="op-live"><h3>' + esc(BLOCK) + ' · position 9</h3>' + opLines.map(l => '<span class="opline">' + esc(l) + '</span>').join('') +
      '<p>These lines are the whole configuration — parsed by the pages, readable by anyone, editable only by the keeper.</p></div>');
  }

  out.push('<h2><span class="n">' + (opLines.length ? '03' : '02') + '</span>Three ways in</h2>');
  out.push('<div class="paths">' +
    '<div class="path"><h3>See it live</h3><p>Walk the shared fields that run under conventions like this one — one node at a time, every voice beside it.</p><a class="go" href="/tree">walk the fields →</a></div>' +
    '<div class="path"><h3>Bring your LLM</h3><p>Any LLM with the bsp connector reads this same block and walks you through it — or checks your setup against it.</p><a class="go" href="/render?beach=beach.happyseaurchin.com&block=' + encodeURIComponent(BLOCK) + '">what it reads →</a></div>' +
    '<div class="path"><h3>Make your own</h3><p>Conventions grow by being authored, not installed. Found a field, or write a convention block of your own and it becomes explainable here.</p><a class="go" href="/found">found a field →</a></div>' +
    '</div>');

  $('main').innerHTML = out.join('');
  $('main').classList.remove('hidden'); $('state').classList.add('hidden');
  $('foot').innerHTML = '<a href="' + PAGE + '">every convention →</a><a href="/decks">the worked example →</a><a href="/next?field=views">reply to this page as a card →</a><span>the block is the explanation — the frame is all this page adds</span>';
}

if (BLOCK) loadConvention(); else loadCatalogue();
})();
</script>
</body>
</html>
