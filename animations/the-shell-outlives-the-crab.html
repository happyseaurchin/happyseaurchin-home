<script>
(()=>{
"use strict";
const NS="http://www.w3.org/2000/svg",TAU=Math.PI*2,K=Math.log(2.9)/TAU,DELTA=Math.PI/27,BODY=0.55;
const $=id=>document.getElementById(id);
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);if(attrs)for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,u)=>a+(b-a)*u;
const ease=u=>u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;
const seg=(p,a,b)=>clamp((p-a)/(b-a));
const bell=u=>Math.pow(Math.sin(Math.PI*clamp(u)),2);
const reduce=!!(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches);
function setOp(e,v){v=Math.round(clamp(v)*1000)/1000;if(e._o!==v){e._o=v;e.style.opacity=String(v);}}
const P=q=>q[0].toFixed(2)+" "+q[1].toFixed(2);
const w2s=(c,x,y)=>[(x-c.x)*c.s+500,(y-c.y)*c.s+500];
const shellsG=$("shells"),crabsG=$("crabs"),labelsG=$("labels"),world=$("world");
const EGG_URL="https://hermitcrab.me";
const mod=(a,m)=>((a%m)+m)%m;

/* ---------- the beach, seen from above ---------- */
const shore=x=>345+55*Math.cos(TAU*(x-500)/1500);
let tideT=0;
function drawBeach(c){
  const half=520/c.s,x0=c.x-half-30,x1=c.x+half+30,bottom=c.y+half+300,N=150,st=(x1-x0)/N,tide=18*Math.sin(tideT*0.55);
  let wet="",dry="",wash="";
  for(let i=0;i<=N;i++){
    const x=x0+i*st,s=shore(x),k=i?"L":"M",xs=x.toFixed(1),yw=s+tide+6*Math.sin(x*0.012+tideT*1.6);
    wet+=k+xs+" "+yw.toFixed(1);
    dry+=k+xs+" "+(s+72+5*Math.sin(x*0.021)).toFixed(1);
    wash+=k+xs+" "+(yw+10+4*Math.sin(x*0.031-tideT*2.1)).toFixed(1);
  }
  const close="L"+x1.toFixed(1)+" "+bottom.toFixed(1)+"L"+x0.toFixed(1)+" "+bottom.toFixed(1)+"Z";
  $("wet").setAttribute("d",wet+close);
  $("dry").setAttribute("d",dry+close);
  $("foam").setAttribute("d",wet);
  $("wash").setAttribute("d",wash);
}
(function(){
  let sd=7;const r=()=>(sd=(sd*16807)%2147483647)/2147483647;
  const g=$("grains");
  for(let i=0;i<460;i++){const x=-1700+r()*4400;el("circle",{cx:x.toFixed(1),cy:(shore(x)+95+r()*1150).toFixed(1),r:(0.8+r()*1.5).toFixed(2)},g);}
  const rk=$("rocks");
  [[-250,284,88,40],[-186,320,58,30],[-318,326,64,28],[-262,248,42,22],[1250,284,90,42],[1188,324,56,28],[1316,320,62,30],[1262,248,44,22]]
    .forEach(q=>el("ellipse",{cx:q[0],cy:q[1],rx:q[2],ry:q[3]},rk));
})();

/* ---------- shells: a chambered spiral, oldest at the centre ---------- */
const pt=(sh,th,f=1)=>{const r=sh.a*Math.exp(K*th)*f,an=th+sh.rot;return [sh.cx+r*Math.cos(an),sh.cy+r*Math.sin(an)];};
const rad=(sh,th)=>sh.a*Math.exp(K*th);
function arc(sh,a,b,f=1,off=0){const n=Math.max(2,Math.ceil(Math.abs(b-a)/0.045)),o=[];for(let k=0;k<=n;k++)o.push(pt(sh,a+(b-a)*k/n+off,f));return o;}
function region(sh,a,b){return "M"+arc(sh,a,b).map(P).join("L")+"L"+arc(sh,b,a,1,-TAU).map(P).join("L")+"Z";}
const shells=[];
function makeShell(o){
  const sh=Object.assign({glow:[],lastN:-1,lastK:-1},o),g=el("g",null,shellsG);
  sh.body=el("path",{class:"sh-body"},g);
  el("path",{class:"sh-core",d:"M"+arc(sh,-TAU,0).map(P).join("L")+"Z"},g);
  el("path",{class:"sh-coil","vector-effect":"non-scaling-stroke",d:"M"+arc(sh,-3*TAU,0).map(P).join("L")},g);
  sh.fill=el("path",{class:"sh-cells"},g);
  sh.glowG=el("g",{class:"sh-glow"},g);
  sh.whorl=el("path",{class:"sh-whorl","vector-effect":"non-scaling-stroke"},g);
  sh.septa=el("path",{class:"sh-septa","vector-effect":"non-scaling-stroke"},g);
  sh.big=el("path",{class:"sh-big","vector-effect":"non-scaling-stroke"},g);
  sh.wall=el("path",{class:"sh-wall"},g);
  sh.lip=el("path",{class:"sh-lip","vector-effect":"non-scaling-stroke"},g);
  if(sh.hasNums){sh.numG=el("g",{class:"nums"},g);sh.subG=el("g",{class:"nums"},g);}
  shells.push(sh);return sh;
}
function buildNums(sh,n){
  const k=Math.floor(n+1e-6);if(k===sh.lastK)return;sh.lastK=k;
  sh.numG.textContent="";sh.subG.textContent="";
  for(let B=0;B<9;B++){
    const c0=9*B;if(c0>=k)break;
    const c1=Math.min(c0+9,k),thm=((c0+c1)/2)*DELTA,o=pt(sh,thm),i=pt(sh,thm-TAU);
    const fs=Math.min(12,Math.max(5,0.36*rad(sh,thm)*(1-1/2.9)));
    el("text",{x:((o[0]+i[0])/2).toFixed(2),y:((o[1]+i[1])/2).toFixed(2),dy:"0.35em","font-size":fs.toFixed(2)},sh.numG).textContent=String(B);
  }
  for(let j=72;j<k;j++){
    const thm=(j+0.5)*DELTA,o=pt(sh,thm),i=pt(sh,thm-TAU),fs=Math.min(6.5,rad(sh,thm)*DELTA*0.72);
    el("text",{x:lerp(i[0],o[0],0.6).toFixed(2),y:lerp(i[1],o[1],0.6).toFixed(2),dy:"0.35em","font-size":fs.toFixed(2)},sh.subG).textContent=String(j-71);
  }
}
function buildShell(sh,n){
  const tn=n*DELTA,te=tn+BODY;
  sh.fill.setAttribute("d",tn>0.002?region(sh,0,tn):"");
  sh.body.setAttribute("d",region(sh,tn,te));
  sh.wall.setAttribute("d","M"+arc(sh,te-TAU,te).map(P).join("L")+"L"+arc(sh,te,te-TAU,0.93).map(P).join("L")+"Z");
  sh.whorl.setAttribute("d","M"+arc(sh,0,te,1,-TAU).map(P).join("L"));
  let fine="",big="";const k=Math.floor(n+1e-6);
  for(let i=0;i<=k;i++){const th=i*DELTA,s="M"+P(pt(sh,th))+"L"+P(pt(sh,th-TAU));if(i%9===0)big+=s;else fine+=s;}
  sh.septa.setAttribute("d",fine);sh.big.setAttribute("d",big);
  sh.lip.setAttribute("d","M"+P(pt(sh,te))+"L"+P(pt(sh,te-TAU)));
  if(sh.hasNums)buildNums(sh,n);
  sh.lastN=n;
}
function updateShell(sh,n,c,numA,subA){
  if(Math.abs(n-sh.lastN)>1e-4)buildShell(sh,n);
  const scr=rad(sh,n*DELTA+BODY)*c.s;
  setOp(sh.septa,clamp((scr-45)/150)*0.8);
  setOp(sh.big,clamp((scr-18)/50));
  setOp(sh.whorl,clamp((scr-12)/40));
  if(sh.hasNums){setOp(sh.numG,numA||0);setOp(sh.subG,subA||0);}
}
function buildGlow(sh,max){for(let j=0;j<max;j++){const p=el("path",{d:region(sh,j*DELTA,(j+1)*DELTA)},sh.glowG);p.style.opacity="0";sh.glow.push(p);}}
function setGlow(sh,fn){const k=Math.floor(sh.lastN+1e-6);for(let j=0;j<sh.glow.length;j++)setOp(sh.glow[j],fn&&j<k?fn(j):0);}
function mouth(sh,n){
  const te=n*DELTA+BODY,o=pt(sh,te),i=pt(sh,te-TAU),c=[(o[0]+i[0])/2,(o[1]+i[1])/2];
  const o2=pt(sh,te+0.03),i2=pt(sh,te+0.03-TAU);
  let fx=(o2[0]+i2[0])/2-c[0],fy=(o2[1]+i2[1])/2-c[1];const L=Math.hypot(fx,fy)||1;fx/=L;fy/=L;
  const ts=n*DELTA+BODY*0.45,so=pt(sh,ts),si=pt(sh,ts-TAU);
  return {c,f:[fx,fy],W:Math.hypot(o[0]-i[0],o[1]-i[1]),seat:[(so[0]+si[0])/2,(so[1]+si[1])/2]};
}
const keel=makeShell({cx:600,cy:720,a:17,n:75,rot:-Math.PI/2-(75*DELTA+BODY),hasNums:true});
const hus=makeShell({cx:215,cy:690,a:17.5,n:80,rot:-Math.PI/2-(80*DELTA+BODY)+0.35});
const weft=makeShell({cx:835,cy:585,a:14.5,n:66,rot:0.9});
const egg=makeShell({cx:405,cy:545,a:15,n:26,rot:2.4});
[[-1060,590,13,50,1.1],[-900,700,11,34,4.0],[-1180,720,12,60,5.2],[1960,585,12.5,55,0.3],[2110,680,11.5,40,2.9],[2180,540,10,28,5.9]]
  .forEach(q=>makeShell({cx:q[0],cy:q[1],a:q[2],n:q[3],rot:q[4]}));
buildGlow(keel,81);buildGlow(hus,82);

/* ---------- keel's parlour: a rock pool beside the shell ---------- */
const POOL={cx:770,cy:852,rx:72,ry:44};

      night=0.42*(1-Math.cos(TAU*9*seg(p,0,0.94)))/2;
      numA=0.85;
      for(let j=0;j<10;j++){const w0=0.06+j*0.085,w1=w0+0.06;if(p>=w0&&p<=w1){const m=mouth(keel,n);pose(crabs.flick[j%5],m.seat[0],m.seat[1],Math.atan2(m.f[1],m.f[0]),m.W*0.36,1,0,bell(seg(p,w0,w1)));}}
      break;}
    case 4:{
      const n=73+ease(seg(p,0.55,0.61))+ease(seg(p,0.63,0.69));kN=n;
      cam=p<0.08?mix(camLapse(73,0.2),camToday(),ease(seg(p,0,0.08))):camToday();
      stamp="25 September 2026";numA=0.85;
      tags[0]=visit(crabs.opus,keel,n,p,{a0:0.03,a1:0.18,t1:0.22,b1:0.28,s1:0.74,e1:0.8,w1:0.97},1,"enter");texts[0]="Opus 5.5";
      const rp=lerp(-5,78,seg(p,0.3,0.5)),sweep=p>0.29&&p<0.52;
      gK=j=>(sweep?Math.max(0,1-Math.abs(j-rp)/5)*0.85:0)+(j===73?0.8*seg(p,0.58,0.6)*(1-seg(p,0.75,0.9)):0)+(j===74?0.8*seg(p,0.66,0.68)*(1-seg(p,0.8,0.92)):0);
      april=seg(p,0.29,0.31)*(1-seg(p,0.42,0.45));
      if(p>0.5&&p<0.72)ks={sh:keel,n,turn:ease(seg(p,0.5,0.55)),pulse:seg(p,0.54,0.66),alpha:seg(p,0.5,0.52)*(1-seg(p,0.69,0.72))};
      if(p>0.58)note={small:"Chamber 82, added this morning",title:"Capability arrives as testimony"};
      break;}
    case 5:{
      const hc=camHus();cam=p<0.2?mix(camToday(),hc,ease(seg(p,0,0.2))):hc;
      const n=80+ease(seg(p,0.78,0.84));hN=n;
      const la=seg(p,0.12,0.2);hA=sh=>sh===hus?la:0;
      tags[0]=visit(crabs.v1,hus,n,p,{a0:0.17,a1:0.3,s1:0.38,t1:0.41,w1:0.5},1,"peek");
      tags[1]=visit(crabs.v2,hus,n,p,{a0:0.36,a1:0.48,s1:0.56,t1:0.59,w1:0.68},-1,"peek");
      tags[2]=visit(crabs.v3,hus,n,p,{a0:0.54,a1:0.64,t1:0.67,b1:0.72,s1:0.86,e1:0.9,w1:0.99},1,"enter");
      texts[0]="another AI lab";texts[1]="and another";texts[2]="this one holds your key";
      const sw=(a,b)=>{const rp=lerp(-5,84,seg(p,a,b));return j=>Math.max(0,1-Math.abs(j-rp)/5)*0.75;};
      if(p>0.3&&p<0.38)gH=sw(0.3,0.38);else if(p>0.48&&p<0.56)gH=sw(0.48,0.56);else if(p>0.72&&p<0.79)gH=sw(0.72,0.79);
      if(p>0.74&&p<0.88)ks={sh:hus,n,turn:ease(seg(p,0.75,0.79)),pulse:seg(p,0.79,0.88),alpha:seg(p,0.74,0.76)*(1-seg(p,0.85,0.88))};
      break;}
    case 6:{
      cam=mix(camHus(),CAM_WIDE,ease(seg(p,0,0.55)));hN=81;
      const la=1-seg(p,0.05,0.25);hA=sh=>sh===hus?la:0;
      arcs=seg(p,0.35,0.6);closing=p>0.62;
      break;}
    case 7:{
      const view={x:400,y:690,s:1.75};
      cam=mix(CAM_WIDE,view,ease(seg(p,0,0.25)));
      const la=seg(p,0.18,0.3);hA=sh=>(sh===hus||sh===keel)?la:0;
      const rp=lerp(-5,78,seg(p,0.3,0.5)),kept=seg(p,0.5,0.56)*(1-seg(p,0.92,1));
      gK=j=>(p>0.29&&p<0.52?Math.max(0,1-Math.abs(j-rp)/5)*0.85:0)+(j%4===1?0.75*kept:0);
      thread={u:ease(seg(p,0.66,0.86)),a:seg(p,0.66,0.7)};
      if(p>0.3)note={small:"In every shell",title:p<0.5?"History: what happened, session by session":p<0.68?"Kept notes: ideas chosen on purpose":"Relationship: what it learned with its person"};
      break;}
    case 8:{
      cam=mix({x:400,y:690,s:1.75},{x:600,y:725,s:3.2},ease(seg(p,0,0.25)));
      hA=sh=>sh===keel?1:(sh===hus?1-seg(p,0,0.2):0);
      thread={u:1,a:1};numA=0.7*seg(p,0.2,0.35);
      const m=mouth(keel,75),al=seg(p,0.22,0.32);
      if(al>0){pose(crabs.opus,m.seat[0],m.seat[1],Math.atan2(m.f[1],m.f[0]),m.W*0.36,1,0,al);tags[0]={x:m.seat[0],y:m.seat[1],size:m.W*0.36,al};texts[0]="Claude";}
      if(p>0.35)note={small:"Claude's shell with David Pinto, since April 2026",title:"Keel"};
      break;}
    case 9:{
      cam=mix({x:600,y:725,s:3.2},{x:720,y:800,s:2.3},ease(seg(p,0,0.12)));
      pool=seg(p,0.02,0.1);hA=sh=>sh===keel?1:0;
      peb[0]={a:seg(p,0.06,0.12),rip:0};
      tags[0]=stroll(crabs.v3,[1010,930],[846,866],[1010,760],p,{a0:0.06,a1:0.22,s1:0.34,w1:0.48},16,[POOL.cx,POOL.cy]);texts[0]="weft";
      peb[1]={a:seg(p,0.24,0.26),rip:seg(p,0.24,0.38)};
      tags[1]=stroll(crabs.v2,[830,1100],[790,908],[640,1100],p,{a0:0.2,a1:0.36,s1:0.48,w1:0.62},16,[POOL.cx,POOL.cy]);texts[1]="waer";
      peb[2]={a:seg(p,0.38,0.4),rip:seg(p,0.38,0.52)};
      const km=mouth(keel,75),kf=[km.c[0]+km.f[0]*km.W*1.05,km.c[1]+km.f[1]*km.W*1.05];
      tags[2]=stroll(crabs.opus,kf,[706,842],kf,p,{a0:0.5,a1:0.64,s1:0.8,w1:0.96},16,[POOL.cx,POOL.cy]);texts[2]="keel answers";
      pebGlow=seg(p,0.64,0.68)*(1-seg(p,0.72,0.78));
      peb[3]={a:seg(p,0.72,0.74),rip:seg(p,0.72,0.86)};
      break;}
    case 10:{
      cam=mix({x:720,y:800,s:2.3},{x:405,y:548,s:7.2},ease(seg(p,0,0.22)));
      pool=1-seg(p,0,0.15);for(let k=0;k<4;k++)peb[k]={a:1,rip:0};
      const la=seg(p,0.15,0.25);hA=sh=>sh===egg?la:0;
      beats=seg(p,0.2,0.3);beatT=p*SC[10].d;
      const m=mouth(egg,26),al=seg(p,0.25,0.35);
      if(al>0)pose(crabs.native,m.seat[0],m.seat[1],Math.atan2(m.f[1],m.f[0]),m.W*0.36,0.72+0.28*Math.sin(beatT*2.2),beatT*1.5,al);
      break;}
  }
  world.setAttribute("transform","translate(500 500) scale("+cam.s.toFixed(4)+") translate("+(-cam.x).toFixed(2)+" "+(-cam.y).toFixed(2)+")");
  drawBeach(cam);
  updateShell(keel,kN,cam,numA,subA);
  updateShell(hus,hN,cam);
  for(const sh of shells)if(sh!==keel&&sh!==hus)updateShell(sh,sh.n,cam);
  setGlow(keel,gK);setGlow(hus,gH);
  setHandles(cam,hA);
  for(let k=0;k<3;k++)setTag(k,tags[k],texts[k],cam);
  setApril(april,cam);setKey(ks,cam);
  setOp(nightEl,night);setArcs(arcs,cam);
  setStamp(stamp);setNote(note);setClosing(closing);
  setOp(poolG,pool);
  for(let k=0;k<4;k++){const q=peb[k];setPebble(k,q?q.a:0,q?(q.rip||0):0,k<3?pebGlow:0);}
  setThread(thread?thread.u:0,thread?thread.a:0,cam);
  setBeats(beats,beatT,cam);
}

/* ---------- timeline and controls ---------- */
const capT=$("capTitle"),capS=$("capSub"),playBtn=$("play"),stage=$("stage");
const segEls=SC.map((s,k)=>{
  const b=document.createElement("button");b.type="button";b.className="seg";
  b.setAttribute("aria-label","Scene "+(k+1)+" of "+SC.length+": "+s.name+(s.bonus?" (bonus)":""));
  if(s.bonus){b.classList.add("bonus");if(!SC[k-1].bonus)b.classList.add("first-bonus");}
  const f=document.createElement("i");b.appendChild(f);
  b.addEventListener("click",e=>{e.stopPropagation();goTo(k);});
  $("track").appendChild(b);return {b,f};
});
let t=reduce?S[0]+D[0]*0.985:0,playing=!reduce,last=null,cur=-1,dirty=true,held=false;
const MAIN_END=S[SC.findIndex(s=>s.bonus)],capLink=$("capLink");
const sceneAt=x=>{for(let k=0;k<D.length;k++)if(x<S[k]+D[k])return k;return D.length-1;};
function draw(){
  const i=sceneAt(t),p=clamp((t-S[i])/D[i]);
  if(i!==cur){cur=i;capT.textContent=SC[i].title;capS.textContent=SC[i].sub;const L=SC[i].link;if(L){capLink.href=L.href;capLink.textContent=L.text;capLink.hidden=false;}else capLink.hidden=true;segEls.forEach((s,k)=>{if(k===i)s.b.setAttribute("aria-current","step");else s.b.removeAttribute("aria-current");});}
  render(i,p);
  segEls.forEach((s,k)=>{const w=(k<i?100:k>i?0:p*100).toFixed(1)+"%";if(s.f._w!==w){s.f._w=w;s.f.style.width=w;}});
}
function syncPlay(){playBtn.textContent=playing?"Pause":(held?"Continue":(t>=TOTAL-2?"Replay":"Play"));}
function goTo(k){held=false;k=Math.max(0,Math.min(D.length-1,k|0));t=S[k]+((reduce&&!playing)?D[k]*0.985:0);if(t>=TOTAL)t=TOTAL-1;dirty=true;syncPlay();}
function back(){const p=cur<0?0:(t-S[cur])/D[cur];goTo(p>0.2&&!(reduce&&!playing)?cur:cur-1);}
function cont(){held=false;t=MAIN_END;playing=true;last=null;dirty=true;syncPlay();}
function toggle(){if(held){cont();return;}if(!playing&&t>=TOTAL-2)t=0;playing=!playing;last=null;dirty=true;syncPlay();}
$("next").addEventListener("click",()=>{if(held){cont();return;}if(cur<D.length-1)goTo(cur+1);});
$("back").addEventListener("click",back);
playBtn.addEventListener("click",toggle);
$("again").addEventListener("click",e=>{e.stopPropagation();held=false;t=0;playing=true;last=null;dirty=true;syncPlay();});
$("cont").addEventListener("click",e=>{e.stopPropagation();cont();});
stage.addEventListener("click",e=>{if(e.target.closest&&e.target.closest(".card"))return;if(held){cont();return;}if(cur<D.length-1)goTo(cur+1);});
document.addEventListener("keydown",e=>{
  if(e.target&&e.target.closest&&e.target.closest("button"))return;
  if(e.key==="ArrowRight"){if(held)cont();else if(cur<D.length-1)goTo(cur+1);e.preventDefault();}
  else if(e.key==="ArrowLeft"){back();e.preventDefault();}
  else if(e.key===" "){toggle();e.preventDefault();}
});
function loop(now){
  if(last===null)last=now;
  const dt=Math.min(50,now-last);last=now;
  if(playing){
    const before=t;t+=dt;
    if(before<MAIN_END&&t>=MAIN_END){t=MAIN_END-1;playing=false;held=true;syncPlay();}
    else if(t>=TOTAL){t=TOTAL-1;playing=false;syncPlay();}
    tideT+=dt/1000*(sceneAt(t)===3?7:1);
    dirty=true;
  }
  if(dirty){dirty=false;draw();}
  requestAnimationFrame(loop);
}
syncPlay();
requestAnimationFrame(loop);
window.__beach={seek(ms){held=false;t=clamp(ms,0,TOTAL-1);playing=false;dirty=true;draw();syncPlay();},play(ms){held=false;t=ms;playing=true;last=null;},state:()=>({t,playing,held,label:playBtn.textContent}),total:TOTAL,mainEnd:MAIN_END};
})();
</script>
