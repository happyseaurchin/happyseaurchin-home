<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Reflexive CBA IV</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400..800;1,6..72,400..800&display=swap">
<style>
/* Layout: a one-screen app, the third Reflexive CBA. Top bar (name; then three choosers, each with a faint word above it: which states show, the context the pictures are read in, and the slides, whose button plays the set chosen and whose arrow chooses another); a full-bleed stage where the animation runs, with columns of state buttons (social top, relational middle, psychological bottom): C, B and A. On a wide screen all three stand, and B slides between C and A to open the gap being worked; on a phone two stand, C | B or B | A. A lit button floats its words in the gap beside it; the same level lit on both sides of a gap brings up the move between them, which opens as a card. In the relational picture, which runs under the columns, the letters at the head of the columns are switches: bold C a line no one crosses, bold B one group each side, bold A moving together. A bottom bar holds the scale and its tools. */
:root {
  --paper: #F3F6F5;
  --panel: #E7EDEB;
  --glass: rgba(243, 246, 245, .9);
  --stage: #E8EDEB;
  --stage-a: #F2EDD6;
  --ink: #16212B;
  --ink-2: #4E5B66;
  --rule: #B4C0C5;
  --c: #7B8692;
  --fulcrum: #C27D0E;
  --fulcrum-ink: #8F5A00;
  --a: #1E7D6C;
  --a-ink: #176A5C;
  --a-on: #FFFFFF;
  --c-on: #0B1116;
  --scrim: rgba(22, 33, 43, .28);
  --frost: rgba(243, 246, 245, .58);
  --frost-edge: rgba(255, 255, 255, .55);
  --display: "Newsreader", Georgia, "Times New Roman", serif;
  --body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0D1316; --panel: #16201F; --glass: rgba(13, 19, 22, .88); --stage: #081013; --stage-a: #15130B;
    --ink: #E3EAEC; --ink-2: #9EAEB6; --rule: #36464E;
    --c: #8B97A2; --fulcrum: #E6A63C; --fulcrum-ink: #F0BC63; --a: #4FC3A9; --a-ink: #6FD3BC; --a-on: #04201A;
    --scrim: rgba(0, 0, 0, .52);
    --frost: rgba(13, 19, 22, .55);
    --frost-edge: rgba(227, 234, 236, .14);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0D1316; --panel: #16201F; --glass: rgba(13, 19, 22, .88); --stage: #081013; --stage-a: #15130B;
  --ink: #E3EAEC; --ink-2: #9EAEB6; --rule: #36464E;
  --c: #8B97A2; --fulcrum: #E6A63C; --fulcrum-ink: #F0BC63; --a: #4FC3A9; --a-ink: #6FD3BC; --a-on: #04201A;
  --scrim: rgba(0, 0, 0, .52);
  --frost: rgba(13, 19, 22, .55);
  --frost-edge: rgba(227, 234, 236, .14);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; overflow: auto;
  background: var(--paper); color: var(--ink);
  font-family: var(--body); font-size: 15px; line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
button:focus-visible, a:focus-visible, textarea:focus-visible { outline: 2px solid var(--a); outline-offset: 2px; }
.app { height: 100%; min-height: 460px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }

.bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px;
  padding-block: 9px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--paper); position: relative; z-index: 3;
}
.bar.top { border-bottom: 1px solid var(--rule); }
.bar.bottom { border-top: 1px solid var(--rule); }
.brand { margin: 0 auto 0 0; font-family: var(--display); font-size: 23px; font-weight: 600; letter-spacing: -.01em; white-space: nowrap; line-height: 1.1; }
.brand em { font-style: italic; font-weight: 500; color: var(--fulcrum-ink); }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 999px; padding: 2px; gap: 2px; }
.seg button { border: 0; background: transparent; border-radius: 999px; padding: 6px 12px; font-size: 14px; cursor: pointer; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.btn { border: 1px solid var(--rule); background: transparent; border-radius: 999px; padding: 6px 13px; font-size: 14px; cursor: pointer; white-space: nowrap; }
.btn:hover, .seg button:hover { border-color: var(--ink-2); }
.btn[aria-pressed="true"] { border-color: var(--fulcrum); color: var(--fulcrum-ink); }
.btn .short { display: none; }
.ctx { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.ctx[hidden] { display: none; }
.ctx-lab { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
#play { margin-left: auto; }

.stage { position: relative; min-height: 0; overflow: hidden; background: var(--stage); }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }

.rail {
  position: absolute; top: 12px; bottom: 12px; width: 158px; z-index: 2;
  display: flex; flex-direction: column; justify-content: space-between; gap: 10px;
  pointer-events: none; transition: opacity .3s;
}
.rail > * { pointer-events: auto; }
.col-c { left: max(12px, env(safe-area-inset-left, 0px)); }
.col-a { right: max(12px, env(safe-area-inset-right, 0px)); }
.col-b { left: calc(50% - 79px); }
/* On a wide screen B rides between C and A: where it stands decides which gap is open. */
.col-b.floating { transition: left .45s cubic-bezier(.3, .7, .2, 1); }
.col-b.floating.dragging { transition: none; }
.rail-top { display: grid; gap: 6px; }
.rail-head { margin: 0; height: 30px; display: flex; align-items: center; gap: 8px; padding-left: 2px; pointer-events: none; }
/* The letters are switches: bold puts that state's rule on the picture, normal lifts it. */
.rail-head .cl {
  pointer-events: auto; cursor: pointer; display: inline-grid; place-items: center;
  min-width: 36px; height: 30px; padding: 0 7px 1px 5px; border-radius: 999px;
  border: 1px solid var(--rule); background: transparent;
  font-family: var(--display); font-style: italic; font-weight: 400; font-size: 25px; line-height: 1;
  transition: background-color .2s, border-color .2s, box-shadow .2s, opacity .2s;
}
.rail-head .cl:hover { border-color: currentColor; }
.rail-head .cl:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.rail-head .cl[aria-pressed="true"] {
  font-weight: 800; border-color: currentColor; box-shadow: inset 0 0 0 1px currentColor;
  background: var(--paper); background: color-mix(in srgb, currentColor 18%, var(--paper));
}
/* Bold, but its column is out of the view in play: set, and waiting for its gap. */
.rail-head .cl.idle { border-style: dashed; box-shadow: none; opacity: .55; }
.col-c .cl { color: var(--c); }
.col-b .cl { color: var(--fulcrum-ink); }
.col-a .cl { color: var(--a-ink); }
.grip {
  display: none; pointer-events: auto; margin-left: auto; align-items: center; gap: 4px;
  border: 1px solid var(--rule); background: var(--glass); color: var(--ink-2); border-radius: 999px;
  padding: 3px 11px; font-size: 13px; line-height: 1.3; cursor: grab; touch-action: none; white-space: nowrap;
}
.grip:hover { border-color: var(--ink-2); color: var(--ink); }
.col-b.floating .grip { display: inline-flex; }
.col-b.dragging .grip { cursor: grabbing; border-color: var(--fulcrum); color: var(--fulcrum-ink); }
/* Riding between C and A, B is slim: the phone's tabs on a line of glass, so the picture shows past it. */
.col-b.floating { width: 50px; }
.col-b.floating::before { content: ""; position: absolute; z-index: -1; left: 50%; top: 36px; bottom: 0; width: 2px; margin-left: -1px; border-radius: 2px; background: var(--fulcrum); opacity: .35; }
/* The glass runs behind B's buttons, joining them: each sits whole on the line. */
.col-b.floating .lvl:not([aria-pressed="true"]) { background: var(--paper); }
.col-b.floating .rail-head { justify-content: center; gap: 2px; padding-left: 0; }
.col-b.floating .rail-head .cl { font-size: 22px; min-width: 30px; height: 28px; padding: 0 5px 1px 3px; }
.col-b.floating .grip { margin-left: 0; padding: 2px 5px; }
.col-b.floating .grip .gl { display: none; }
.col-b.floating .lvl { padding: 12px 2px; text-align: center; }
.col-b.floating .lvl .lt, .col-b.floating .lvl .lv { display: none; }
.col-b.floating .lvl .lv-s { display: block; font-family: var(--mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
.lvl {
  --col: var(--c);
  display: grid; gap: 2px; width: 100%; text-align: left; cursor: pointer;
  padding: 9px 11px; border-radius: 12px; border: 1px solid var(--col); background: var(--glass);
  transition: border-color .25s, background-color .25s, box-shadow .25s;
}
.col-b .lvl { --col: var(--fulcrum); }
.col-a .lvl { --col: var(--a); }
.lvl:hover { background: var(--paper); }
/* Lit: tinted with its column's colour. Out: the one whose words or move are showing now. */
.lvl[aria-pressed="true"] { background: var(--paper); background: color-mix(in srgb, var(--col) 24%, var(--paper)); box-shadow: inset 0 0 0 1px var(--col); }
.lvl.focal { box-shadow: inset 0 0 0 1px var(--col), 0 0 0 2px var(--stage), 0 0 0 4px var(--col); }
.lvl .lv { font-family: var(--mono); font-size: 10.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-2); }
.lvl .lv-s { display: none; }
.lvl .lt { font-weight: 700; font-size: 14px; line-height: 1.25; }
.view-seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

/* The words float over the running animation beside their button: at most three, chosen by the scale behind them. */
.cloud { position: absolute; z-index: 4; pointer-events: none; }
/* Shift-tap on empty floor: something new there. */
.pop { position: absolute; z-index: 6; display: grid; gap: 2px; padding: 6px; min-width: 190px; background: var(--paper); border: 1px solid var(--rule); border-radius: 12px; box-shadow: 0 10px 28px rgba(0, 0, 0, .2); }
.pop[hidden] { display: none; }
.pop button { display: flex; align-items: center; gap: 10px; border: 0; background: transparent; border-radius: 8px; padding: 8px 10px; font-size: 14.5px; text-align: left; cursor: pointer; color: var(--ink); }
.pop button:hover, .pop button:focus-visible { background: var(--panel); outline: none; }
.pop button.minor { font-size: 13px; color: var(--ink-2); padding: 6px 10px; }
.pop .ic { width: 18px; height: 18px; flex: none; }
.pop .sep { height: 1px; background: var(--rule); margin: 3px 6px; }
.pop .ph { margin: 2px 10px 4px; font-family: var(--mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.pop .ic.tick { visibility: hidden; }
.pop button[aria-checked="true"] .ic.tick { visibility: visible; }
.pop button[aria-checked="true"] { font-weight: 700; }
/* The context the pictures are read in: a menu under its button at the top. */
.ctx-menu { position: fixed; z-index: 9; min-width: 168px; }
.btn.on { border-color: var(--fulcrum); color: var(--fulcrum-ink); }
.btn .chev { display: inline-block; margin-left: 4px; font-size: 11px; opacity: .7; }
/* The top bar's choosers: a faint word above each says what it chooses; the button shows what is chosen now. */
.bar.top { align-items: flex-end; }
.pick { display: inline-flex; flex-direction: column; align-items: flex-start; gap: 3px; }
.pick-lab { padding-left: 13px; font-family: var(--mono); font-size: 9.5px; line-height: 1; letter-spacing: .13em; text-transform: uppercase; color: var(--ink-2); opacity: .72; }
.pick-btn { display: inline-flex; align-items: center; justify-content: space-between; gap: 6px; min-width: 104px; }
.split { display: inline-flex; }
.split .btn { border-color: var(--fulcrum); }
.split-main { display: inline-flex; align-items: center; gap: 8px; border-radius: 999px 0 0 999px; border-right-width: 0; font-family: var(--display); font-style: italic; font-size: 16px; padding-block: 5px; }
.split-main .play { font-style: normal; font-size: 9px; color: var(--fulcrum-ink); }
.split-more { border-radius: 0 999px 999px 0; padding-left: 9px; padding-right: 11px; }
.split-more .chev { margin-left: 0; }
.split .btn:hover { background: var(--panel); }
/* The slides: one at a time, low over the room, which runs on behind them and can be set by them. */
.deck { position: absolute; inset: 0; z-index: 7; display: flex; align-items: flex-end; justify-content: center; padding: 12px; pointer-events: none; }
.deck[hidden] { display: none; }
.deck-card {
  pointer-events: auto; position: relative; width: min(800px, 100%); max-height: 68%; overflow: hidden;
  display: flex; flex-direction: column; padding: 14px 20px 14px;
  background: var(--frost); color: var(--ink); border: 1px solid var(--frost-edge); border-radius: 18px; box-shadow: 0 14px 40px rgba(0, 0, 0, .2);
  -webkit-backdrop-filter: blur(8px) saturate(1.4); backdrop-filter: blur(8px) saturate(1.4);
}
/* Where glass cannot be frosted, the slide stays solid. */
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { .deck-card { background: var(--paper); border-color: var(--rule); } }
.deck-top { display: flex; align-items: center; gap: 10px; flex: none; }
.deck-body { flex: 1 1 auto; min-height: 0; overflow: auto; overscroll-behavior: contain; }
.deck-kick { flex: 1; margin: 0; font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); }
.deck-kick b { color: var(--fulcrum-ink); font-weight: 500; }
.deck-lead { margin: 6px 0 0; font-family: var(--display); font-weight: 500; font-size: clamp(25px, 1.5vw + 17px, 40px); line-height: 1.12; text-wrap: balance; }
.deck-blurb { margin: 10px 0 0; font-size: 17px; line-height: 1.55; color: var(--ink-2); max-width: 66ch; }
.deck-blurb:empty, .deck-src:empty, .deck-widget:empty { display: none; }
.deck-src { margin: 10px 0 0; font-size: 12.5px; color: var(--ink-2); }
.deck-src a { color: var(--ink-2); }
.deck-widget .lead:first-child, .deck-widget .tally:first-child, .deck-widget .voices-head:first-child { margin-top: 10px; }
.deck-foot { display: flex; align-items: center; gap: 10px; margin-top: 12px; flex: none; }
.deck-dots { flex: 1; display: flex; justify-content: center; flex-wrap: wrap; gap: 6px; }
.deck-dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--rule); }
.deck-dots i.on { background: var(--fulcrum); }
.deck-foot .btn[disabled] { opacity: .35; cursor: default; }
.deck-card { touch-action: pan-y; }
.stage.decked .hint { visibility: hidden; }
#deck-menu { min-width: 260px; }
.ctx-menu .dm { display: grid; gap: 1px; text-align: left; }
.ctx-menu .dm small { font-size: 12px; font-weight: 400; color: var(--ink-2); }
.split-main[aria-pressed="true"] { background: var(--panel); }
.cloud-chips { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; }
.cloud[data-side="r"] .cloud-chips { align-items: flex-end; }
.chip {
  pointer-events: auto; box-shadow: 0 6px 18px rgba(0, 0, 0, .18);
  border: 1px solid var(--c); background: var(--paper); color: var(--ink); border-radius: 999px;
  padding: 6px 13px; font-size: 15px; font-weight: 700; cursor: pointer; line-height: 1.2; text-align: left;
  opacity: 0; transform: translate(var(--dx, 0), calc(var(--dy, 0px) + 6px)) rotate(var(--rot, 0deg)) scale(.9);
  transition: opacity .28s ease, transform .32s ease;
}
.cloud[data-col="b"] .chip { border-color: var(--fulcrum); }
.cloud[data-col="a"] .chip { border-color: var(--a); }
.cloud.open .chip { opacity: 1; transform: translate(var(--dx, 0), var(--dy, 0px)) rotate(var(--rot, 0deg)) scale(1); }
.chip.key { background: var(--c); border-color: var(--c); color: var(--c-on); font-size: 16.5px; padding: 7px 15px; }
.cloud[data-col="b"] .chip.key { background: var(--fulcrum); border-color: var(--fulcrum); color: #1b1203; }
.cloud[data-col="a"] .chip.key { background: var(--a); border-color: var(--a); color: var(--a-on); }
.chip:hover { border-color: var(--ink-2); }
.chip:focus-visible { outline: 2px solid var(--a); outline-offset: 2px; }

/* The move between two states at one level: a line across the gap, the step itself on it. */
.moves { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
.move { position: absolute; display: flex; justify-content: center; align-items: center; opacity: 0; transition: opacity .35s ease; }
.move.in { opacity: 1; }
.move[data-gap="cb"] { --from: var(--c); --to: var(--fulcrum); }
.move[data-gap="ba"] { --from: var(--fulcrum); --to: var(--a); }
.mv-line { position: absolute; left: 6px; right: 14px; top: 50%; height: 2px; margin-top: -1px; border-radius: 2px; background: var(--to); background: linear-gradient(90deg, var(--from), var(--to)); transition: top .3s ease; }
.mv-line::after { content: ""; position: absolute; right: -9px; top: -5px; border: 6px solid transparent; border-left: 9px solid var(--to); border-right: 0; }
.mv {
  position: relative; pointer-events: auto; max-width: min(360px, calc(100% - 30px)); display: grid; gap: 3px; text-align: left; cursor: pointer;
  padding: 8px 14px 9px; border-radius: 14px; border: 1px solid var(--rule); background: var(--paper); color: var(--ink);
  box-shadow: 0 6px 18px rgba(0, 0, 0, .16); transform: scale(.94); transition: transform .35s ease, box-shadow .35s ease, border-color .25s;
}
.move.in .mv { transform: none; }
.move.dp .mv { border-color: var(--fulcrum); }
.move.hot .mv { border-color: var(--ink-2); box-shadow: 0 0 0 3px color-mix(in srgb, var(--to) 35%, transparent), 0 10px 28px rgba(0, 0, 0, .24); }
.mv:hover { border-color: var(--ink-2); }
.mv-lab { font-family: var(--mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.move.dp .mv-lab { color: var(--fulcrum-ink); }
.mv-text { font-family: var(--display); font-size: 18px; line-height: 1.2; text-wrap: balance; }
.mv-short { display: none; font-family: var(--display); font-size: 16.5px; line-height: 1.2; text-wrap: balance; }
.move:not(.hot) .mv { padding: 6px 13px; border-radius: 999px; }
.move:not(.hot) .mv-lab, .move:not(.hot) .mv-text { display: none; }
.move:not(.hot) .mv-short { display: block; }
.wchip.key { background: var(--c); border-color: var(--c); color: var(--c-on); }
.wchip.key[data-col="b"] { background: var(--fulcrum); border-color: var(--fulcrum); color: #1b1203; }
.wchip.key[data-col="a"] { background: var(--a); border-color: var(--a); color: var(--a-on); }
.sides { margin-top: 14px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.sides .chips { margin-top: 6px; }
.chips.words li { padding: 0; border: 0; }
.wchip { border: 1px solid var(--rule); background: transparent; border-radius: 999px; padding: 4px 11px; font-size: 14px; font-weight: 700; cursor: pointer; text-align: left; }
.wchip[data-col="c"] { border-color: var(--c); }
.wchip[data-col="b"] { border-color: var(--fulcrum); }
.wchip[data-col="a"] { border-color: var(--a); }
.wchip:hover { background: var(--panel); }
.ctext { margin: 12px 0 0; font-size: 16px; line-height: 1.55; max-width: 60ch; }
.ctext a { color: var(--ink); }
.cnote { margin: 12px 0 0; font-size: 13px; color: var(--ink-2); }

/* Which way the contents flow, at the foot of the psychological view. */
.dir { min-width: 42px; font-size: 18px; line-height: 1.1; padding-block: 4px; }
.stepper { display: inline-flex; align-items: center; gap: 4px; }
.stepper .num { min-width: 1.4em; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
.stepper .btn { padding: 4px 11px; font-size: 16px; line-height: 1.2; }

.stage-title, .hint {
  position: absolute; z-index: 1; margin: 0; text-align: center; pointer-events: none;
  left: 180px; right: 180px;
}
.stage-title { top: 12px; font-family: var(--display); font-style: italic; font-size: 19px; line-height: 1.3; color: var(--ink); text-wrap: balance; }
.hint { bottom: 12px; font-size: 13px; color: var(--ink-2); text-wrap: balance; white-space: pre-line; }
@media (max-width: 900px) {
  /* Room for two lines either way, so the drawing area holds still as the words change. */
  .stage-title { min-height: 2.6em; }
  .hint { min-height: 2.9em; display: flex; align-items: flex-end; justify-content: center; }
}
.hint.flash { color: var(--fulcrum-ink); }

.overlay { position: absolute; inset: 0; z-index: 5; display: grid; place-items: center; padding: 14px; }
.overlay[hidden] { display: none; }

.practice { margin-top: 16px; padding: 12px 14px; background: var(--panel); border-radius: 12px; display: grid; gap: 6px; }
.pr-lab { margin: 0; font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.pr-row { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 8px; align-items: baseline; font-size: 14.5px; }

.lead { margin: 12px 0 0; color: var(--ink-2); }
.checks { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 8px; }

.trow { display: grid; grid-template-columns: 30px minmax(0, 1fr) 40px 40px 40px; align-items: center; gap: 8px; }
.trow .tname { font-size: 14px; color: var(--ink-2); }
.trow .num { text-align: center; font-size: 18px; font-variant-numeric: tabular-nums; font-weight: 700; }
.step { width: 40px; height: 36px; border-radius: 10px; border: 1px solid var(--rule); background: transparent; cursor: pointer; font-size: 18px; }

.tbar i { display: block; height: 100%; transition: width .3s; }
.tbar .s-c { background: var(--c); }
.tbar .s-b { background: var(--fulcrum); }
.tbar .s-a { background: var(--a); }
.readout { margin: 8px 0 0; font-family: var(--display); font-style: italic; font-size: 22px; }
textarea { width: 100%; margin-top: 12px; min-height: 160px; resize: vertical; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); font: inherit; font-size: 16px; line-height: 1.5; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 10px; }
.note { font-size: 13px; color: var(--ink-2); }
.truths { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 10px; }
.truths li { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 1px 10px; align-items: baseline; }
.truths .n { font-family: var(--display); font-style: italic; font-size: 22px; line-height: 1; text-align: center; color: var(--ink-2); }
.truths .ours .n { color: var(--fulcrum-ink); }

.voice .said { grid-column: 1; margin: 0; font-size: 15px; white-space: pre-wrap; overflow-wrap: anywhere; }

.many { margin: 0; padding: 8px 12px; border: 1px dashed var(--fulcrum); border-radius: 10px; font-size: 14px; }

<script>
(() => {
  'use strict';
  const TAU = Math.PI * 2;
  const $ = s => document.querySelector(s);
  const $$ = s => Array.from(document.querySelectorAll(s));
  const stage = $('#stage');
  const cv = $('#cv');
  const ctx = cv.getContext('2d');
  const reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  const clamp = (v, lo, hi) => (lo > hi ? (lo + hi) / 2 : Math.min(hi, Math.max(lo, v)));
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const avg = arr => arr.reduce((s, v) => s + v, 0) / (arr.length || 1);
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  let W = 1, H = 1, DPR = 1, T = 0, last = 0;
  let paused = reduce;
  let scale = 'rel';
  let fade = 1;
  let FREE = { x0: 0, x1: 1, y0: 0, y1: 1 };
  let COL = {};
  let dark = false;

  function hexRgb(h) {
    h = (h || '#888888').replace('#', '').trim();
    if (h.length === 3) h = h.split('').map(c => c + c).join('');
    const n = parseInt(h, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  function rgba(hex, a) { const c = hexRgb(hex); return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }
  function readColors() {
    const cs = getComputedStyle(document.documentElement);
    const g = n => cs.getPropertyValue(n).trim();
    COL = { ink: g('--ink'), ink2: g('--ink-2'), rule: g('--rule'), c: g('--c'), b: g('--fulcrum'), bInk: g('--fulcrum-ink'), a: g('--a'), aInk: g('--a-ink'), stage: g('--stage'), stageA: g('--stage-a') || g('--stage') };
    const s = hexRgb(COL.stage);
    dark = (0.2126 * s[0] + 0.7152 * s[1] + 0.0722 * s[2]) < 110;
  }
  const pcol = (p, a) => 'hsla(' + p.hue + ',' + (dark ? 55 : 46) + '%,' + (dark ? 68 : 36) + '%,' + a + ')';
  const MONO = '"IBM Plex Mono", ui-monospace, Menlo, monospace';
  const SERIF = 'Newsreader, Georgia, serif';

  /* ---------- layout ---------- */
  // The open gap: between the columns at the edges, or, when B rides between C and A, the wider of its two sides.
  // The title, the hint and the flow buttons live there, and so does the psychological picture; the relational and
  // social pictures run the whole width under B, since what B does to them is the point.
  function openGap() {
    const sr = stage.getBoundingClientRect();
    let l = 0, r = 0;
    $$('.rail').forEach(el => {
      if (el.classList.contains('floating') || getComputedStyle(el).display === 'none') return;

  const ov = $('#ov'), card = $('#card'), body = $('#card-body');
  let lastFocus = null;
  function practiceHTML(p) {
    return '<div class="practice"><p class="pr-lab">' + p.label + '</p>' +
      '<div class="pr-row"><span class="tag tag-' + p.fromK + '">' + p.fromK.toUpperCase() + '</span><span>' + p.from + '</span></div>' +
      '<div class="pr-move"><span class="arrow" aria-hidden="true">↓</span><strong>' + p.move + '</strong></div>' +
      '<div class="pr-row"><span class="tag tag-' + p.toK + '">' + p.toK.toUpperCase() + '</span><span>' + p.to + '</span></div></div>';
  }
  function show(eyebrow, title, side, html) {
    $('#card-eyebrow').textContent = eyebrow;
    $('#card-title').textContent = title;
    card.dataset.side = side;
    body.innerHTML = html;
    lastFocus = document.activeElement;
    ov.hidden = false;
    card.scrollTop = 0;
    $('#card-close').focus();
  }
  function closeCard() {
    ov.hidden = true;
    if (lastFocus && lastFocus.focus && document.contains(lastFocus)) lastFocus.focus();
  }

  /* ---------- states, words and moves ---------- */
  // Three columns of state, each read at three levels. A lit button floats its words in the gap beside it; the same
  // level lit on both sides of a gap brings up the move between them. A phone shows C | B or B | A; a wide screen
  // shows all three, with B riding between C and A to open the gap being worked.
  const LVN = { soc: 'Social', rel: 'Relational', psy: 'Psychological' };
  const SCN = { psy: 'psychological', rel: 'relational', soc: 'social' };
  const COLS = { c: 'C', b: 'B', a: 'A' };
  const SLIDE = { ba: 0, cba: 0.5, cb: 1 };
  const VIEW_KEY = 'reflexive-cba3-view';
  const cloud = $('#cloud'), movesBox = $('#moves'), grip = $('#grip');
  const wideMQ = window.matchMedia ? window.matchMedia('(min-width: 961px)') : { matches: true };
  const isWide = () => !!wideMQ.matches;
  let view = 'cba';            // which states show: C | B, C | B | A (wide screens only), or B | A
  let slide = 0.5;             // on a wide screen, where B stands between C (0) and A (1)
  const lit = new Set();       // the lit states, as column and level: 'c-soc'
  let focus = null;            // the state whose words or move are out
  let focusMode = 'words';     // 'move' just after it completed a pair, then 'words'
  let hotMove = null;          // the move that has just appeared
  let movesSeen = false, cloudSig = null, layoutUntil = 0, drag = null;
  const moveEls = new Map();
  const MV_BANDS = { top: 0, bottom: Infinity };   // the foot of the top move and the head of the bottom one, in the drawing's gap
  const hashKey = k => k.split('').reduce((h, c) => (h * 31 + c.charCodeAt(0)) | 0, 7);
  const effView = () => (isWide() ? view : (view === 'ba' ? 'ba' : 'cb'));
  // B looks back at C as the room arrives, and on toward A once the B | A gap is open.
  const bFacing = () => (isWide() ? (slide >= 0.5 ? 'c' : 'a') : (effView() === 'cb' ? 'c' : 'a'));
  const gapOf = col => (col === 'c' ? 'cb' : col === 'a' ? 'ba' : (bFacing() === 'c' ? 'cb' : 'ba'));
  function setOf(col, lvl, gap) {
    if (col === 'c') return LEVELS['cb-' + lvl].expected;
    if (col === 'a') return LEVELS['ba-' + lvl].potential;
    return (gap || gapOf('b')) === 'cb' ? LEVELS['cb-' + lvl].potential : LEVELS['ba-' + lvl].expected;
  }
  function relRect(el) {
    if (!el || getComputedStyle(el).display === 'none') return null;
    const sr = stage.getBoundingClientRect(), b = el.getBoundingClientRect();
    if (!b.width) return null;
    return { left: b.left - sr.left, right: b.right - sr.left, top: b.top - sr.top, bottom: b.bottom - sr.top };
  }
  // Where B stands on a wide screen: just right of C, centred, or just left of A.
  function bSpan() {
    const sr = stage.getBoundingClientRect();
    const cr = $('#col-c').getBoundingClientRect(), ar = $('#col-a').getBoundingClientRect(), bw = $('#col-b').offsetWidth;
    const cR = cr.right - sr.left, aL = ar.left - sr.left;
    return { cR, aL, bw, x0: cR + 16, x1: aL - 16 - bw };
  }
  function placeB() {
    const b = $('#col-b'), wide = isWide();
    b.classList.toggle('floating', wide);
    stage.dataset.view = effView();
    if (!wide) { b.style.removeProperty('left'); return; }
    const s = bSpan();
    b.style.left = (s.x0 + (s.x1 - s.x0) * slide) + 'px';
  }
  // A gap counts as open once it is wide enough to hold a move; on a wide screen, judged where B is heading.
  function gapWillOpen(gap) {
    if (!isWide()) return effView() === gap;
    const s = bSpan(), xB = s.x0 + (s.x1 - s.x0) * slide;
    return gap === 'cb' ? xB - s.cR >= 150 : s.aL - (xB + s.bw) >= 150;
  }
  function gapNow(gap) {
    const l = relRect($('#col-' + gap[0])), r = relRect($('#col-' + gap[1]));
    if (!l || !r || r.left - l.right < 150) return null;
    return { lo: l.right, hi: r.left };
  }

  function syncView() {
    if (isWide() && !drag) slide = SLIDE[view];
    const ev = effView();
    $$('.view-seg button').forEach(b => b.setAttribute('aria-pressed', String(isWide() ? b.dataset.v === view : b.dataset.v === ev)));
    const n = slide < 0.25 ? 0 : slide > 0.75 ? 2 : 1;
    grip.setAttribute('aria-valuenow', String(n));
    grip.setAttribute('aria-valuetext', ['B | A', 'C | B | A', 'C | B'][n]);
    placeB();
  }
  function setView(v) {
    view = v;
    try { localStorage.setItem(VIEW_KEY, v); } catch (e) {}
    syncView();
    // Words beside a column that has left the screen fold away.
    if (focus && !relRect($('#col-' + focus[0]))) { focus = null; hotMove = null; }
    placeTexts();
    render();
  }
  // On a wide screen, lighting a state beside a closed gap opens it.
  function ensureGap(cell) {
    if (isWide() && !gapWillOpen(gapOf(cell[0]))) setView('cba');
  }
  function newMoves(cell) {
    const col = cell[0], lvl = cell.slice(2), out = [];
    const pairs = { c: [['b', 'cb']], a: [['b', 'ba']], b: [['c', 'cb'], ['a', 'ba']] }[col];
    pairs.forEach(p => { if (lit.has(p[0] + '-' + lvl) && gapWillOpen(p[1])) out.push(p[1] + '-' + lvl); });
    return out;
  }
  function tapCell(cell) {
    hotMove = null;
    if (!lit.has(cell)) {
      lit.add(cell);
      ensureGap(cell);
      const made = newMoves(cell);
      focus = cell;
      focusMode = made.length ? 'move' : 'words';
      hotMove = made[0] || null;
    } else if (focus !== cell) {
      ensureGap(cell);
      focus = cell; focusMode = 'words';
    } else if (focusMode === 'move') {
      focusMode = 'words';
    } else {
      lit.delete(cell); focus = null;
    }
    render();
  }
  // The letters are the rules' switches. A tap bolds a letter and puts its rule on the picture; a tap on a bold one
  // lifts it. C needs the C | B gap and A the B | A gap: on a wide screen a letter bolded beside a closed gap opens
  // it, and a bold letter left waiting by the slider (dashed) opens its gap again rather than going out.
  const ruleLive = k => (k === 'c' ? effView() !== 'ba' : k === 'a' ? effView() !== 'cb' : true);
  function tapRule(k) {
    if (BOLD[k] && !ruleLive(k)) { if (isWide()) setView('cba'); else render(); return; }
    BOLD[k] = !BOLD[k];
    if (BOLD[k] && !ruleLive(k) && isWide()) setView('cba');
    else render();
    if (scale === 'psy') flash(BOLD[k] ? (ruleLive(k) ? k.toUpperCase() + ': focus drawn to Q' + QOF[k] : k.toUpperCase() + ' holds on the other side of the glass') : k.toUpperCase() + ' normal: no pull to Q' + QOF[k]);
  }

  function render() {
    $$('.lvl[data-cell]').forEach(b => {
      const cell = b.dataset.cell, col = cell[0], lvl = cell.slice(2), f = setOf(col, lvl);
      b.querySelector('.lt').textContent = f.title;
      b.setAttribute('aria-pressed', String(lit.has(cell)));
      b.classList.toggle('focal', focus === cell);
      b.setAttribute('aria-label', COLS[col] + ', ' + LVN[lvl] + ': ' + f.title);
      if (col === 'b') b.title = f.title;
    });
    if (syncRules()) updateText();
    syncLetters();
    const want = focus && focusMode === 'words' ? focus + '|' + gapOf(focus[0]) + '|' + scale : null;
    if (!want) closeCloud();
    else if (want !== cloudSig) fillCloud(focus);
    syncOverlays();
    layoutUntil = performance.now() + 650;
  }
  function syncOverlays() { placeTexts(); syncMoves(); syncCloud(); }

  // A move stands at its level, across the gap, clear of the title above and the hint below;
  // its line keeps to the level of the buttons it joins as nearly as the step allows.
  // The room between the title and the hint, where they stand over this stretch of the stage.
  function vBounds(lo, hi) {
    const over = r => r && r.left < hi && r.right > lo;
    const tb = relRect($('#stage-title')), hb = relRect($('#hint'));
    return { top: over(tb) ? tb.bottom : 4, bottom: over(hb) ? hb.top : H - 4 };
  }
  function placeMove(el, cell) {
    const br = relRect($('#lv-' + cell));
    const y = br ? (br.top + br.bottom) / 2 : H / 2;
    const h = el.offsetHeight || 44;
    const lo = parseFloat(el.style.left) || 0, vb = vBounds(lo, lo + (parseFloat(el.style.width) || W));
    const top = clamp(y - h / 2, vb.top + 4, vb.bottom - 4 - h);
    el.style.top = top + 'px';
    el.firstChild.style.top = clamp(y - top, Math.min(10, h / 2), Math.max(h - 10, h / 2)) + 'px';
  }
  function moveEl(id) {
    let el = moveEls.get(id);
    if (el) return el;
    const p = LEVELS[id].practice;
    el = document.createElement('div');
    el.className = 'move' + (/^Decision/.test(p.label) ? ' dp' : '');
    el.dataset.move = id;
    el.dataset.gap = id.slice(0, 2);
    const line = document.createElement('i'); line.className = 'mv-line'; line.setAttribute('aria-hidden', 'true');
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'mv';
    const lab = document.createElement('span'); lab.className = 'mv-lab'; lab.textContent = p.label;
    const tx = document.createElement('span'); tx.className = 'mv-text'; tx.textContent = p.move;
    // Settled, a move shows its short name, the highlighted word of the state it leads to; just made, it shows in full.
    const sh = document.createElement('span'); sh.className = 'mv-short'; sh.textContent = LEVELS[id].potential.key;
    b.append(lab, tx, sh);
    b.setAttribute('aria-label', COLS[id[0]] + ' to ' + COLS[id[1]] + ', ' + LVN[id.slice(3)] + ', ' + p.label + ': ' + p.move);
    b.addEventListener('click', () => openMove(id));
    el.append(line, b);
    movesBox.appendChild(el);
    moveEls.set(id, el);
    requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('in')));
    if (!movesSeen) { movesSeen = true; flash('A move: tap it for the whole step'); }
    return el;
  }
  function syncMoves() {
    const vis = [];
    ['cb', 'ba'].forEach(gap => {
      const gb = gapNow(gap);
      if (!gb) return;
      ['soc', 'rel', 'psy'].forEach(lvl => { if (lit.has(gap[0] + '-' + lvl) && lit.has(gap[1] + '-' + lvl)) vis.push({ id: gap + '-' + lvl, gap, lvl, gb }); });
    });
    const keep = new Set(vis.map(m => m.id));
    moveEls.forEach((el, id) => { if (!keep.has(id)) { el.remove(); moveEls.delete(id); } });
    let top = 0, bottom = Infinity;
    vis.forEach(m => {
      const el = moveEl(m.id);
      el.classList.toggle('hot', hotMove === m.id);
      el.style.left = m.gb.lo + 'px';
      el.style.width = (m.gb.hi - m.gb.lo) + 'px';
      placeMove(el, m.gap[0] + '-' + m.lvl);
      // Note where moves stand across the top and the foot of the gap the drawing lives in.
      if (Math.abs(m.gb.lo - (FREE.x0 - 10)) < 3) {
        const t = parseFloat(el.style.top) || 0, h = el.offsetHeight;
        if (m.lvl === 'soc') top = Math.max(top, t + h);
        if (m.lvl === 'psy') bottom = Math.min(bottom, t);
      }
    });
    MV_BANDS.top = top; MV_BANDS.bottom = bottom;
  }

  function fillCloud(cell) {
    const col = cell[0], lvl = cell.slice(2), gap = gapOf(col), f = setOf(col, lvl, gap);
    const find = label => f.chips.find(c => c[0] === label);
    const keyChip = find(f.key);
    const extras = ((f.extra && f.extra[scale]) || []).map(find).filter(Boolean).slice(0, 2);
    const list = extras.length === 2 ? [extras[0], keyChip, extras[1]] : [keyChip].concat(extras);
    const onLeft = gap[0] === col;   // the column stands on the left of its gap, so the words spread rightwards
    cloud.dataset.side = onLeft ? 'l' : 'r';
    cloud.dataset.col = col;
    cloud.dataset.gap = gap;
    cloud.setAttribute('aria-label', COLS[col] + ', ' + LVN[lvl] + ': ' + f.title + ', at the ' + SCN[scale] + ' scale');
    const box = $('#cloud-chips');
    box.textContent = '';
    const rnd = mulberry32(hashKey(cell + gap + scale));
    list.forEach((c, i) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'chip' + (c === keyChip ? ' key' : '');
      b.textContent = c[0];
      b.style.setProperty('--dx', ((onLeft ? 1 : -1) * Math.round(4 + rnd() * 22)) + 'px');
      b.style.setProperty('--rot', ((rnd() - 0.5) * 4).toFixed(1) + 'deg');
      b.style.transitionDelay = (reduce ? 0 : i * 60) + 'ms';
      b.addEventListener('click', () => openChip(col, lvl, gap, c));
      box.appendChild(b);
    });
    cloud.hidden = false;
    cloud.classList.remove('open');
    cloudSig = cell + '|' + gap + '|' + scale;
    requestAnimationFrame(() => cloud.classList.add('open'));
  }
  function syncCloud() {
    if (cloud.hidden || !focus) return;
    const lvl = focus.slice(2), gb = gapNow(cloud.dataset.gap), br = relRect($('#lv-' + focus));
    if (!gb || !br) { cloud.style.visibility = 'hidden'; return; }
    cloud.style.visibility = '';
    const lo = gb.lo + 10, hi = gb.hi - 10;
    cloud.style.maxWidth = Math.max(140, hi - lo - 24) + 'px';
    const onLeft = cloud.dataset.side === 'l';
    cloud.style.left = onLeft ? lo + 'px' : 'auto';
    cloud.style.right = onLeft ? 'auto' : (W - hi) + 'px';
    // Beside its button, clear of the title, the hint, and the move standing at the same level.
    const ch = cloud.offsetHeight, vb = vBounds(lo, hi);
    let y = (br.top + br.bottom) / 2 - ch / 2;
    const mv = moveEls.get(cloud.dataset.gap + '-' + lvl), mr = mv ? relRect(mv) : null;
    if (mr) y = lvl === 'psy' ? mr.top - 10 - ch : mr.bottom + 10;
    cloud.style.top = clamp(y, vb.top + 6, vb.bottom - 8 - ch) + 'px';
  }
  function closeCloud() {
    cloud.hidden = true;
    cloud.classList.remove('open');
    cloudSig = null;
  }

  function noteFor(col, gap) {
    if (col === 'c') return 'C: the current form. Light B at the same level for the move between them.';
    if (col === 'a') return 'A: the potential form, once the room aligns.';
    return gap === 'cb' ? 'B, as the room arrives from C. In B | A, these buttons show what still holds B back.' : 'B, facing A: the current form it still has to leave. Light A at the same level for the move.';
  }
  function openChip(col, lvl, gap, c, back) {
    const f = setOf(col, lvl, gap);
    let html = '<p class="ctext">' + c[1] + '</p>';
    if (c[0] === f.key) html += practiceHTML(LEVELS[gap + '-' + lvl].practice);
    html += '<p class="cnote">' + noteFor(col, gap) + '</p>';
    if (back) html += '<div class="row"><button class="btn" type="button" id="back">← The move</button></div>';
    show(COLS[col] + ' · ' + LVN[lvl] + ' · ' + f.title, c[0], col, html);
    if (back) $('#back').addEventListener('click', () => openMove(back));
  }
  function openMove(id) {
    const gap = id.slice(0, 2), lvl = id.slice(3), p = LEVELS[id].practice;
    const side = col => {
      const f = setOf(col, lvl, gap);
      return '<div><p class="pr-lab">' + COLS[col] + ' · ' + f.title + '</p><ul class="chips words">' +
        f.chips.map((c, i) => '<li><button type="button" class="wchip' + (c[0] === f.key ? ' key' : '') + '" data-col="' + col + '" data-i="' + i + '">' + c[0] + '</button></li>').join('') + '</ul></div>';
    };
    const html = practiceHTML(p) + '<div class="sides">' + side(gap[0]) + side(gap[1]) + '</div>' +
      '<p class="cnote">' + (gap === 'cb' ? 'C → B is open to all: the decision to try B is made in the room.' : 'B → A begins once the room holds B.') + '</p>';
    show(COLS[gap[0]] + ' → ' + COLS[gap[1]] + ' · ' + LVN[lvl], p.move, 'move', html);
    body.querySelectorAll('.wchip').forEach(b => b.addEventListener('click', () => {
      const col = b.dataset.col;
      openChip(col, lvl, gap, setOf(col, lvl, gap).chips[Number(b.dataset.i)], id);
    }));
  }

  // B slides on a wide screen: drag it, or use the arrow keys on its handle. It settles at one of three places.
  grip.addEventListener('pointerdown', e => {
    if (!isWide()) return;
    e.preventDefault();
    const s = bSpan();
    drag = { id: e.pointerId, x: e.clientX, s: slide, span: Math.max(1, s.x1 - s.x0) };
    $('#col-b').classList.add('dragging');
    try { grip.setPointerCapture(e.pointerId); } catch (err) {}
  });
  grip.addEventListener('pointermove', e => {

  const tally = { c: 0, b: 0, a: 0 };

    const bar = $('#tbar');

    ['c', 'b', 'a'].forEach(k => { bar.querySelector('.s-' + k).style.width = (n ? tally[k] / n * 100 : 0) + '%'; });

    if (!n) { out.textContent = 'Ask for a show of hands.'; return; }
    const val = i => (i < tally.c ? 0 : i < tally.c + tally.b ? 1 : 2);
    const m1 = val(Math.floor((n - 1) / 2)), m2 = val(Math.floor(n / 2));
    const names = ['C', 'B', 'A'];
    out.textContent = m1 === m2 ? 'Most of the room: ' + names[m1] : (m1 === 0 && m2 === 1 ? 'Phasing C → B' : m1 === 1 && m2 === 2 ? 'Phasing B → A' : 'Split between C and A');

  const escH = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const deckEl = $('#deck'), deckCard = $('#deck-card'), deckMenu = $('#deck-menu'), deckBtn = $('#btn-deck'), decksBtn = $('#btn-decks');
  const DECK_KEY = 'reflexive-cba3-deck';
  let deckId = 'why', slideAt = 0, deckBase = null, deckReturn = null;
  try { const d = localStorage.getItem(DECK_KEY); if (DECKS.some(k => k.id === d)) deckId = d; } catch (e) {}
  const deckOf = id => DECKS.find(k => k.id === id) || DECKS[0];
  const deckOpen = () => !deckEl.hidden;
  const deckMenuOpen = () => !deckMenu.hidden;
  function syncDeckBtn() { $('#deck-name').textContent = deckOf(deckId).name; }

  // The room as the slides found it, and as a slide would have it.
  function roomNow() { return { scale, view, bold: ['c', 'b', 'a'].filter(k => BOLD[k]).join(''), context }; }
  function setRoom(st) {
    if (st.context != null && st.context !== context) setContext(st.context, true);
    if (st.scale && st.scale !== scale) setScale(st.scale);
    if (st.view && st.view !== view && (isWide() || st.view !== 'cba')) setView(st.view);
    if (st.bold != null && st.bold !== roomNow().bold) { ['c', 'b', 'a'].forEach(k => { BOLD[k] = st.bold.indexOf(k) >= 0; }); render(); }
    // A demonstration needs people: at least so many (those added stay when the slides close).
    if (st.people && scale === 'rel') { for (let i = people.length; i < st.people; i++) if (!addPerson()) break; }
  }
  function showSlide(i) {
    const d = deckOf(deckId), n = d.slides.length;
    slideAt = clamp(i, 0, n - 1);
    const s = d.slides[slideAt];
    if (deckBase) setRoom(Object.assign({}, deckBase, s.show || {}));
    $('#deck-kick').innerHTML = escH(d.name) + ' · ' + (slideAt + 1) + ' / ' + n + (s.kick ? ' · <b>' + escH(s.kick) + '</b>' : '');
    $('#deck-lead').textContent = s.lead;
    $('#deck-blurb').innerHTML = s.blurb || '';
    const w = $('#deck-widget');
    w.innerHTML = s.widget ? WIDGETS[s.widget].html() : '';
    if (s.widget) WIDGETS[s.widget].wire(w);
    $('#deck-src').innerHTML = s.src ? 'Sources: ' + s.src : (s.note || '');
    $('#deck-dots').innerHTML = d.slides.map((_, k) => '<i' + (k === slideAt ? ' class="on"' : '') + '></i>').join('');
    $('#deck-prev').disabled = slideAt === 0;
    $('#deck-next').textContent = slideAt === n - 1 ? 'Done' : 'Next ›';
    $('#deck-body').scrollTop = 0;
  }
  function openDeck(id) {
    closeDeckMenu(); closeCtx(); closePop();
    if (!ov.hidden) closeCard();
    if (focus) { focus = null; hotMove = null; render(); }
    if (id) { deckId = id; try { localStorage.setItem(DECK_KEY, id); } catch (e) {} syncDeckBtn(); }
    const d = deckOf(deckId);
    // Remember the room only for what these slides set, to put it back as it was after.
    if (!deckOpen()) {
      const sets = new Set();
      d.slides.forEach(s => Object.keys(s.show || {}).forEach(k => sets.add(k)));
      const now = roomNow();
      deckBase = {};
      sets.forEach(k => { deckBase[k] = now[k]; });
      deckReturn = document.activeElement;
    } else {
      d.slides.forEach(s => Object.keys(s.show || {}).forEach(k => { if (!(k in deckBase)) deckBase[k] = roomNow()[k]; }));
    }
    deckEl.hidden = false;
    stage.classList.add('decked');
    deckBtn.setAttribute('aria-pressed', 'true');
    showSlide(0);
    $('#deck-next').focus({ preventScroll: true });
  }
  function closeDeck() {
    if (deckEl.hidden) return;
    deckEl.hidden = true;
    stage.classList.remove('decked');
    deckBtn.setAttribute('aria-pressed', 'false');
    $('#deck-widget').innerHTML = '';
    if (deckBase) setRoom(deckBase);
    deckBase = null;
    (deckReturn && document.contains(deckReturn) && deckReturn !== document.body ? deckReturn : deckBtn).focus({ preventScroll: true });
  }
  function closeDeckMenu(refocus) {
    if (deckMenu.hidden) return;
    deckMenu.hidden = true; deckMenu.innerHTML = '';
    decksBtn.setAttribute('aria-expanded', 'false');
    if (refocus) decksBtn.focus({ preventScroll: true });
  }
  function openDeckMenu() {
    closeCtx(); closePop();
    deckMenu.innerHTML = '<p class="ph">Slides</p>';
    DECKS.forEach(d => {
      const b = document.createElement('button');
      b.type = 'button'; b.setAttribute('role', 'menuitemradio'); b.setAttribute('aria-checked', String(d.id === deckId));
      b.innerHTML = ICON.tick + '<span class="dm"><span>' + escH(d.name) + '</span><small>' + escH(d.about) + ' · ' + d.slides.length + '</small></span>';
      b.addEventListener('click', () => openDeck(d.id));
      deckMenu.appendChild(b);
    });
    deckMenu.hidden = false;
    decksBtn.setAttribute('aria-expanded', 'true');
    const br = decksBtn.getBoundingClientRect(), w = deckMenu.offsetWidth;
    deckMenu.style.top = Math.round(br.bottom + 6) + 'px';
    deckMenu.style.left = Math.round(clamp(br.right - w, 8, window.innerWidth - w - 8)) + 'px';
    (deckMenu.querySelector('[aria-checked="true"]') || deckMenu.querySelector('button')).focus({ preventScroll: true });
  }
  syncDeckBtn();
  deckBtn.setAttribute('aria-pressed', 'false');
  deckBtn.addEventListener('click', () => (deckOpen() ? closeDeck() : openDeck()));
  decksBtn.addEventListener('click', () => (deckMenuOpen() ? closeDeckMenu() : openDeckMenu()));
  deckMenu.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closeDeckMenu(true); e.stopPropagation(); return; }
    if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
    const bs = Array.from(deckMenu.querySelectorAll('button')), i = bs.indexOf(document.activeElement);
    bs[(i + (e.key === 'ArrowDown' ? 1 : bs.length - 1)) % bs.length].focus(); e.preventDefault();
  });
  document.addEventListener('pointerdown', e => { if (deckMenuOpen() && !deckMenu.contains(e.target) && !decksBtn.contains(e.target)) closeDeckMenu(); }, true);
  window.addEventListener('resize', () => closeDeckMenu());
  $('#deck-prev').addEventListener('click', () => showSlide(slideAt - 1));
  $('#deck-next').addEventListener('click', () => { if (slideAt >= deckOf(deckId).slides.length - 1) closeDeck(); else showSlide(slideAt + 1); });
  $('#deck-close').addEventListener('click', closeDeck);
  // Keys while the slides are up: arrows and Page keys step, Home and End jump, Escape closes; not while typing.
  document.addEventListener('keydown', e => {
    if (!deckOpen() || ctxOpen() || deckMenuOpen() || popOpen() || !ov.hidden) return;
    const t = e.target && e.target.closest ? e.target : null;
    if (t && t.closest('textarea, input')) { if (e.key === 'Escape') t.blur(); return; }
    if (t && t.closest('[role="slider"]')) return;
    const n = deckOf(deckId).slides.length;
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || (e.key === ' ' && !(t && t.closest('button')))) { showSlide(slideAt + 1); e.preventDefault(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { showSlide(slideAt - 1); e.preventDefault(); }
    else if (e.key === 'Home') { showSlide(0); e.preventDefault(); }
    else if (e.key === 'End') { showSlide(n - 1); e.preventDefault(); }
    else if (e.key === 'Escape') { closeDeck(); e.stopImmediatePropagation(); e.preventDefault(); }
  }, true);
  // A swipe across a slide steps through them.
  let swipe = null;
  deckCard.addEventListener('pointerdown', e => { if (e.target.closest('button, a, textarea, input, label')) return; swipe = { x: e.clientX, y: e.clientY }; });
  deckCard.addEventListener('pointerup', e => {
    if (!swipe) return;
    const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y;
    swipe = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) showSlide(slideAt + (dx < 0 ? 1 : -1));
  });
  deckCard.addEventListener('pointercancel', () => { swipe = null; });

  /* ---------- start ---------- */
  readColors();
  try {
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    if (mq.addEventListener) mq.addEventListener('change', readColors); else if (mq.addListener) mq.addListener(readColors);
  } catch (e) {}
  new MutationObserver(readColors).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme', 'class', 'style'] });
  view = isWide() ? 'cba' : 'cb';
  try { const v = localStorage.getItem(VIEW_KEY); if (v === 'cb' || v === 'cba' || v === 'ba') view = v; } catch (e) {}
  syncView();
  try {
    if (wideMQ.addEventListener) wideMQ.addEventListener('change', () => { syncView(); render(); });
    else if (wideMQ.addListener) wideMQ.addListener(() => { syncView(); render(); });
  } catch (e) {}
  resize();
  if ('ResizeObserver' in window) new ResizeObserver(resize).observe(stage);
  else window.addEventListener('resize', resize);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { computeFree(); });
  addPerson((FREE.x0 + FREE.x1) / 2, (FREE.y0 + FREE.y1) / 2);
  people.forEach(p => { p.alpha = 1; });
  syncPsySet();
  if (paused) setPaused(true);
  updateText();
  requestAnimationFrame(frame);
})();
</script>

</body></html>
