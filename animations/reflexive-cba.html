<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reflexive CBA</title>
<meta name="description" content="A one-screen app for the room: people as complex systems at three scales, psychological, relational and social, the turns from C to B and from B to A, a show of hands, and what is true here and now.">
<meta property="og:title" content="Reflexive CBA">
<meta property="og:description" content="The room’s own app: three scales, two turns, a show of hands, and what is true here and now.">
<meta property="og:image" content="https://happyseaurchin.com/animations/reflexive-cba.jpg">

<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
</head>
<body>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..600&display=swap">
<style>
/* Layout: a one-screen app. Top bar (name, C to B or B to A, whole system, room check, insights); a full-bleed stage where the animation runs, with two rails of level buttons on its edges (social top, relational middle, psychological bottom); a bottom bar for the scale and its tools. Cards open over the stage. Same family as The Fulcrum Turn, The State Stack and The Two Turns. */
:root {
  --paper: #F3F6F5;
  --panel: #E7EDEB;
  --glass: rgba(243, 246, 245, .9);
  --stage: #E8EDEB;
  --ink: #16212B;
  --ink-2: #4E5B66;
  --rule: #B4C0C5;
  --c: #7B8692;
  --fulcrum: #C27D0E;
  --fulcrum-ink: #8F5A00;
  --a: #1E7D6C;
  --a-ink: #176A5C;
  --scrim: rgba(22, 33, 43, .28);
  --display: "Newsreader", Georgia, "Times New Roman", serif;
  --body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0D1316; --panel: #16201F; --glass: rgba(13, 19, 22, .88); --stage: #081013;
    --ink: #E3EAEC; --ink-2: #9EAEB6; --rule: #36464E;
    --c: #8B97A2; --fulcrum: #E6A63C; --fulcrum-ink: #F0BC63; --a: #4FC3A9; --a-ink: #6FD3BC;
    --scrim: rgba(0, 0, 0, .52);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0D1316; --panel: #16201F; --glass: rgba(13, 19, 22, .88); --stage: #081013;
  --ink: #E3EAEC; --ink-2: #9EAEB6; --rule: #36464E;
  --c: #8B97A2; --fulcrum: #E6A63C; --fulcrum-ink: #F0BC63; --a: #4FC3A9; --a-ink: #6FD3BC;
  --scrim: rgba(0, 0, 0, .52);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; overflow: auto;
  background: var(--paper); color: var(--ink);
  font-family: var(--body); font-size: 15px; line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
button:focus-visible, a:focus-visible, textarea:focus-visible { outline: 2px solid var(--a); outline-offset: 2px; }
.app { height: 100%; min-height: 460px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }

.bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px;
  padding-block: 9px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--paper); position: relative; z-index: 3;
}
.bar.top { border-bottom: 1px solid var(--rule); }
.bar.bottom { border-top: 1px solid var(--rule); }
.brand { margin: 0 auto 0 0; font-family: var(--display); font-size: 23px; font-weight: 600; letter-spacing: -.01em; white-space: nowrap; line-height: 1.1; }
.brand em { font-style: italic; font-weight: 500; color: var(--fulcrum-ink); }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 999px; padding: 2px; gap: 2px; }
.seg button { border: 0; background: transparent; border-radius: 999px; padding: 6px 12px; font-size: 14px; cursor: pointer; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.btn { border: 1px solid var(--rule); background: transparent; border-radius: 999px; padding: 6px 13px; font-size: 14px; cursor: pointer; white-space: nowrap; }
.btn:hover, .seg button:hover { border-color: var(--ink-2); }
.btn[aria-pressed="true"] { border-color: var(--fulcrum); color: var(--fulcrum-ink); }
.btn .short { display: none; }
.ctx { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.ctx[hidden] { display: none; }
.ctx-lab { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
#play { margin-left: auto; }

.stage { position: relative; min-height: 0; overflow: hidden; background: var(--stage); }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }

.rail {
  position: absolute; top: 12px; bottom: 12px; width: 158px; z-index: 2;
  display: flex; flex-direction: column; justify-content: space-between; gap: 10px;
  pointer-events: none; transition: opacity .3s;
}
.rail > * { pointer-events: auto; }
.rail-l { left: max(12px, env(safe-area-inset-left, 0px)); }
.rail-r { right: max(12px, env(safe-area-inset-right, 0px)); }
.rail-top { display: grid; gap: 6px; }
.rail-head { margin: 0; font-family: var(--display); font-style: italic; font-size: 20px; line-height: 1; padding-left: 2px; }
.rail-l .rail-head { color: var(--ink-2); }
.rail-r .rail-head { color: var(--a-ink); }
.rail-sub { margin: -2px 0 2px; padding-left: 2px; font-family: var(--mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; line-height: 1.3; color: var(--ink-2); }
.lvl {
  display: grid; gap: 2px; width: 100%; text-align: left; cursor: pointer;
  padding: 9px 11px; border-radius: 12px; border: 1px solid var(--rule); background: var(--glass);
}
.rail-l .lvl { border-color: var(--c); }
.rail-r .lvl { border-color: var(--a); }
.lvl:hover { background: var(--paper); }
.lvl .lv { font-family: var(--mono); font-size: 10.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-2); }
.lvl .lt { font-weight: 700; font-size: 14px; line-height: 1.25; }
.stage[data-phase="cb"] .rail-r, .stage[data-phase="ba"] .rail-l { opacity: .55; }

.stage-title, .hint {
  position: absolute; z-index: 1; margin: 0; text-align: center; pointer-events: none;
  left: 180px; right: 180px;
}
.stage-title { top: 12px; font-family: var(--display); font-style: italic; font-size: 19px; line-height: 1.3; color: var(--ink); text-wrap: balance; }
.hint { bottom: 12px; font-size: 13px; color: var(--ink-2); text-wrap: balance; }
@media (max-width: 900px) {
  /* Room for two lines either way, so the drawing area holds still as the words change. */
  .stage-title { min-height: 2.6em; }
  .hint { min-height: 2.9em; display: flex; align-items: flex-end; justify-content: center; }
}
.hint.flash { color: var(--fulcrum-ink); }

.overlay { position: absolute; inset: 0; z-index: 5; display: grid; place-items: center; padding: 14px; }
.overlay[hidden] { display: none; }
.scrim { position: absolute; inset: 0; background: var(--scrim); }
.card {
  position: relative; width: min(580px, 100%); max-height: 100%; overflow: auto;
  background: var(--paper); color: var(--ink); border: 1px solid var(--rule); border-radius: 16px;
  padding: 18px 20px 20px; box-shadow: 0 12px 34px rgba(0, 0, 0, .2);
}
.card-head { display: flex; align-items: flex-start; gap: 12px; }
.card-head > div { flex: 1; min-width: 0; }
.eyebrow { margin: 0; font-family: var(--mono); font-size: 11.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-2); }
.card h2 { margin: 4px 0 0; font-family: var(--display); font-weight: 500; font-size: 30px; line-height: 1.1; text-wrap: balance; }
.x { flex: none; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--rule); background: transparent; cursor: pointer; font-size: 20px; line-height: 1; }
.chips { list-style: none; margin: 14px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.chips li { border: 1px solid var(--rule); border-radius: 999px; padding: 4px 11px; font-size: 14.5px; font-weight: 700; }
.card[data-side="cb"] .chips li { border-color: var(--c); }
.card[data-side="ba"] .chips li { border-color: var(--a); }
.practice { margin-top: 16px; padding: 12px 14px; background: var(--panel); border-radius: 12px; display: grid; gap: 6px; }
.pr-lab { margin: 0; font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.pr-row { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 8px; align-items: baseline; font-size: 14.5px; }
.pr-move { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 8px; align-items: baseline; font-size: 15.5px; }
.pr-move .arrow { text-align: center; color: var(--ink-2); }
.tag { font-family: var(--display); font-style: italic; font-size: 19px; line-height: 1; text-align: center; }
.tag-c { color: var(--c); }
.tag-b { color: var(--fulcrum-ink); }
.tag-a { color: var(--a-ink); }
.more { margin-top: 14px; }
.detail { margin-top: 12px; display: grid; gap: 10px; }
.detail p { margin: 0; font-size: 15px; line-height: 1.55; max-width: 62ch; }
.detail a, .card a { color: var(--ink); }
.lead { margin: 12px 0 0; color: var(--ink-2); }
.checks { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 8px; }
.checks li { display: grid; gap: 1px; padding: 9px 12px; border: 1px solid var(--rule); border-radius: 12px; font-size: 16px; }
.checks .lv { font-family: var(--mono); font-size: 10.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-2); }
.tally { margin-top: 14px; display: grid; gap: 8px; }
.trow { display: grid; grid-template-columns: 30px minmax(0, 1fr) 40px 40px 40px; align-items: center; gap: 8px; }
.trow .tname { font-size: 14px; color: var(--ink-2); }
.trow .num { text-align: center; font-size: 18px; font-variant-numeric: tabular-nums; font-weight: 700; }
.step { width: 40px; height: 36px; border-radius: 10px; border: 1px solid var(--rule); background: transparent; cursor: pointer; font-size: 18px; }
.tbar { display: flex; height: 12px; border-radius: 999px; overflow: hidden; background: var(--panel); margin-top: 8px; }
.tbar i { display: block; height: 100%; transition: width .3s; }
.tbar .s-c { background: var(--c); }
.tbar .s-b { background: var(--fulcrum); }
.tbar .s-a { background: var(--a); }
.readout { margin: 8px 0 0; font-family: var(--display); font-style: italic; font-size: 22px; }
textarea { width: 100%; margin-top: 12px; min-height: 160px; resize: vertical; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); font: inherit; font-size: 16px; line-height: 1.5; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 10px; }
.note { font-size: 13px; color: var(--ink-2); }
.btn-true { font-family: var(--display); font-style: italic; font-size: 16px; border-color: var(--fulcrum); }
.truths { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 10px; }
.truths li { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 1px 10px; align-items: baseline; }
.truths .n { font-family: var(--display); font-style: italic; font-size: 22px; line-height: 1; text-align: center; color: var(--ink-2); }
.truths .ours .n { color: var(--fulcrum-ink); }
.truths .tw { font-weight: 700; font-size: 17px; }
.truths .tl { grid-column: 2; font-size: 15px; color: var(--ink-2); }
.given { margin: 14px 0 0; font-size: 15px; }
.ask { margin: 6px 0 0; font-family: var(--display); font-weight: 500; font-size: 28px; line-height: 1.15; text-wrap: balance; }
.wave { margin: 10px 0 0; font-size: 15px; color: var(--ink-2); max-width: 60ch; }
.voices-head { margin: 20px 0 0; }
.voices { margin-top: 8px; display: grid; gap: 8px; }
.voice { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 8px; align-items: start; padding: 9px 12px; border-left: 3px solid var(--rule); background: var(--panel); border-radius: 0 10px 10px 0; }
.voice.seed { border-left-color: var(--fulcrum); }
.voice .who { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.voice .said { grid-column: 1; margin: 0; font-size: 15px; white-space: pre-wrap; overflow-wrap: anywhere; }
.voice .rm { grid-column: 2; grid-row: 1 / span 2; border: 0; background: transparent; cursor: pointer; color: var(--ink-2); font-size: 18px; line-height: 1; padding: 2px 4px; }
.many { margin: 0; padding: 8px 12px; border: 1px dashed var(--fulcrum); border-radius: 10px; font-size: 14px; }
.field { width: 100%; margin-top: 10px; padding: 9px 12px; border-radius: 12px; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); font: inherit; font-size: 16px; }
textarea.field { min-height: 92px; resize: vertical; line-height: 1.5; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (max-width: 760px) {
  .brand { font-size: 20px; }
  .rail { width: 112px; top: 10px; bottom: 10px; gap: 8px; }
  .stage[data-phase="cb"] .rail-r, .stage[data-phase="ba"] .rail-l { display: none; }
  .lvl { padding: 7px 8px; border-radius: 10px; }
  .lvl .lv { font-size: 9.5px; }
  .lvl .lt { font-size: 12.5px; }
  .rail-head { font-size: 17px; }
  .stage-title { font-size: 16px; }
  .hint { font-size: 12px; }
  .seg button { padding: 6px 9px; font-size: 13px; }
  .btn { padding: 6px 10px; font-size: 13px; }
  .btn-true { font-size: 15px; padding: 5px 11px; }
  .ask { font-size: 24px; }
  .btn .full { display: none; }
  .btn .short { display: inline; }
  .ctx-lab { display: none; }
  .card { padding: 16px 16px 18px; }
  .card h2 { font-size: 25px; }
  .chips { gap: 5px; }
  .chips li { font-size: 13.5px; padding: 3px 9px; }
  .lead { font-size: 14px; }
  .checks { gap: 6px; }
  .checks li { font-size: 15px; padding: 7px 10px; }
  .trow { grid-template-columns: 26px minmax(0, 1fr) 38px 34px 38px; gap: 6px; }
  .step { width: 38px; height: 34px; }
}
@media (max-width: 380px) {
  .bar { gap: 8px 7px; }
  .btn { padding: 6px 9px; }
  .btn-true { padding: 5px 9px; }
}
@media (prefers-reduced-motion: reduce) {
  .rail, .tbar i { transition: none; }
}
</style>

<div class="app">
  <header class="bar top">
    <p class="brand">Reflexive <em>CBA</em></p>
    <div class="seg" role="group" aria-label="Which turn">
      <button type="button" id="ph-cb" aria-pressed="true">C → B</button>
      <button type="button" id="ph-ba" aria-pressed="false">B → A</button>
    </div>
    <button class="btn btn-true" type="button" id="btn-true"><span class="full">What is true</span><span class="short">What’s true</span></button>
    <button class="btn" type="button" id="btn-whole"><span class="full">Whole system</span><span class="short">System</span></button>
    <button class="btn" type="button" id="btn-room"><span class="full">Where are we?</span><span class="short">Where?</span></button>
    <button class="btn" type="button" id="btn-ins">Insights</button>
  </header>

  <main class="stage" id="stage" data-phase="cb">
    <canvas id="cv" role="img" aria-label="Relational scale: people as complex systems in a room"></canvas>
    <p class="stage-title" id="stage-title">Relational · a room of complex systems</p>
    <p class="hint" id="hint">Tap to add a person</p>

    <nav class="rail rail-l" aria-label="C to B">
      <div class="rail-top">
        <p class="rail-head">C → B</p>
        <p class="rail-sub">Open to all</p>
        <button class="lvl" type="button" id="lv-cb-soc" data-card="cb-soc"><span class="lv">Social</span><span class="lt">The race</span></button>
      </div>
      <button class="lvl" type="button" id="lv-cb-rel" data-card="cb-rel"><span class="lv">Relational</span><span class="lt">Reliance or reflection</span></button>
      <button class="lvl" type="button" id="lv-cb-psy" data-card="cb-psy"><span class="lv">Psychological</span><span class="lt">What an LLM is</span></button>
    </nav>

    <nav class="rail rail-r" aria-label="B to A">
      <div class="rail-top">
        <p class="rail-head">B → A</p>
        <p class="rail-sub">Once the room holds B</p>
        <button class="lvl" type="button" id="lv-ba-soc" data-card="ba-soc"><span class="lv">Social</span><span class="lt">MAGI, not Machus</span></button>
      </div>
      <button class="lvl" type="button" id="lv-ba-rel" data-card="ba-rel"><span class="lv">Relational</span><span class="lt">Traces, not messages</span></button>
      <button class="lvl" type="button" id="lv-ba-psy" data-card="ba-psy"><span class="lv">Psychological</span><span class="lt">Your own loci</span></button>
    </nav>

    <div class="overlay" id="ov" hidden>
      <div class="scrim" data-close></div>
      <section class="card" id="card" role="dialog" aria-modal="true" aria-labelledby="card-title">
        <div class="card-head">
          <div>
            <p class="eyebrow" id="card-eyebrow"></p>
            <h2 id="card-title"></h2>
          </div>
          <button class="x" type="button" id="card-close" data-close aria-label="Close">×</button>
        </div>
        <div id="card-body"></div>
      </section>
    </div>
  </main>

  <footer class="bar bottom">
    <div class="seg" role="group" aria-label="Scale">
      <button type="button" id="sc-psy" data-scale="psy" aria-pressed="false">Psychological</button>
      <button type="button" id="sc-rel" data-scale="rel" aria-pressed="true">Relational</button>
      <button type="button" id="sc-soc" data-scale="soc" aria-pressed="false">Social</button>
    </div>
    <div class="ctx" id="ctx-rel">
      <button class="btn" type="button" id="add"><span class="full">Add person</span><span class="short">Add</span></button>
      <button class="btn" type="button" id="auto" aria-pressed="false"><span class="full">Phase groups</span><span class="short">Phase</span></button>
      <button class="btn" type="button" id="reset"><span class="full">Start again</span><span class="short">Reset</span></button>
    </div>
    <div class="ctx" id="ctx-psy" hidden>
      <span class="ctx-lab">Phasing at</span>
      <button class="btn" type="button" id="q4" data-q="4" aria-pressed="true">Q4 · C</button>
      <button class="btn" type="button" id="q3" data-q="3" aria-pressed="false">Q3 · B</button>
      <button class="btn" type="button" id="q2" data-q="2" aria-pressed="false">Q2 · A</button>
    </div>
    <div class="ctx" id="ctx-soc" hidden>
      <button class="btn" type="button" id="f-all" data-focus="all" aria-pressed="true">All three</button>
      <button class="btn" type="button" id="f-c" data-focus="c" aria-pressed="false">C</button>
      <button class="btn" type="button" id="f-b" data-focus="b" aria-pressed="false">B</button>
      <button class="btn" type="button" id="f-a" data-focus="a" aria-pressed="false">A</button>
    </div>
    <button class="btn" type="button" id="play" aria-pressed="false">Pause</button>
  </footer>
</div>

<script>
(() => {
  'use strict';
  const TAU = Math.PI * 2;
  const $ = s => document.querySelector(s);
  const $$ = s => Array.from(document.querySelectorAll(s));
  const stage = $('#stage');
  const cv = $('#cv');
  const ctx = cv.getContext('2d');
  const reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  const clamp = (v, lo, hi) => (lo > hi ? (lo + hi) / 2 : Math.min(hi, Math.max(lo, v)));
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const avg = arr => arr.reduce((s, v) => s + v, 0) / (arr.length || 1);
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  let W = 1, H = 1, DPR = 1, T = 0, last = 0;
  let paused = reduce;
  let scale = 'rel';
  let phase = 'cb';
  let fade = 1;
  let FREE = { x0: 0, x1: 1, y0: 0, y1: 1 };
  let COL = {};
  let dark = false;

  function hexRgb(h) {
    h = (h || '#888888').replace('#', '').trim();

  /* ---------- layout ---------- */
  function computeFree() {
    const old = FREE;

    let l = 0, r = 0;
    $$('.rail').forEach(el => {
      if (getComputedStyle(el).display === 'none') return;
      const b = el.getBoundingClientRect();
      if (!b.width) return;

      else r = Math.max(r, sr.right - b.left);

    ['#stage-title', '#hint'].forEach(s => { const el = $(s); el.style.left = (l + 12) + 'px'; el.style.right = (r + 12) + 'px'; });
    const tb = $('#stage-title').getBoundingClientRect();
    const hb = $('#hint').getBoundingClientRect();

    if (people.length && old.x1 > old.x0 + 2) {
      const dx = ((FREE.x0 + FREE.x1) - (old.x0 + old.x1)) / 2;
      const dy = ((FREE.y0 + FREE.y1) - (old.y0 + old.y1)) / 2;
      if (Math.abs(dx) > 1 || Math.abs(dy) > 1) {
        people.forEach(p => { p.x += dx; p.y += dy; p.wx += dx; p.wy += dy; });

  function resize() {

  /* ---------- people (relational) ---------- */
  const HUES = [205, 28, 165, 285, 345, 48, 120, 235, 12];
  const KINDS = ['tri', 'circ', 'sq'];
  let people = [], groups = [], particles = [];

  function makePerson(x, y) {
    const id = nextId++;
    const rnd = mulberry32(id * 7919 + 13);
    const sign = () => (rnd() < 0.5 ? -1 : 1);
    const shapes = [];
    const ns = 3 + Math.floor(rnd() * 3);
    for (let i = 0; i < ns; i++) shapes.push({ kind: KINDS[Math.floor(rnd() * 3)], orbit: 0.18 + rnd() * 0.4, ang: rnd() * TAU, os: (0.25 + rnd() * 0.6) * sign(), rot: rnd() * TAU, rs: (0.6 + rnd() * 1.8) * sign(), size: 0.22 + rnd() * 0.16 });

    for (let i = 0; i < 22; i++) many.push({ kind: KINDS[Math.floor(rnd() * 3)], orbit: 0.12 + rnd() * 0.72, ang: rnd() * TAU, os: (0.08 + rnd() * 0.3) * sign(), rot: rnd() * TAU, rs: (0.3 + rnd() * 1.4) * sign(), size: 0.08 + rnd() * 0.09, seed: rnd() * 100 });

  function addPerson(x, y) {

      let best = null, bestGap = -1;
      for (let i = 0; i < 12; i++) {

      x = best[0]; y = best[1];

    const p = makePerson(clamp(x, FREE.x0 + r, FREE.x1 - r), clamp(y, FREE.y0 + r, FREE.y1 - r));

  function resetPeople() {

  function blob(p, x, y, r, t, n, extra) {

      '<li><span class="n">1</span><span class="tw">Physically embodied</span><span class="tl">One body, one life, a limited time. This is real, and we are present.</span></li>' +
      '<li><span class="n">2</span><span class="tw">Temporally immanent</span><span class="tl">The time is now, facing forward: towards what our children will live into.</span></li>' +
      '<li class="ours"><span class="n">3</span><span class="tw">Virtually immersed</span><span class="tl">In what we think, and who we take ourselves to be. This one depends on us.</span></li>' +
      '</ol>' +
      '<p class="given">The first two are true because they are true. The third depends on us.</p>' +
      '<p class="ask">What are we going to do about it today?</p>' +
      '<p class="wave">A wave is coming, and the boat has to point the right way, with all of us on it. Alone, we’re doomed. Together, we’re braver, and we have a chance.</p>' +
      '<div class="practice"><p class="pr-lab">The decision point</p>' +
      '<div class="pr-row"><span class="tag tag-b">B</span><span>Whether this is the meeting that matters is yours to decide: here, or later.</span></div>' +
      '<div class="pr-move"><span class="arrow" aria-hidden="true">↓</span><strong>Step in this direction, not sure where it leads.</strong></div>' +
      '<div class="pr-row"><span class="tag tag-a">A</span><span>Try it, live it, move forward: iterative social validation. Two of us, five, a hundred, a million, a billion.</span></div></div>' +
      '<button class="btn more" type="button" id="more" aria-expanded="false" aria-controls="detail">Read more</button>' +
      '<div class="detail" id="detail" hidden>' +
      '<p><strong>Physically embodied.</strong> Not a talk show and not a thought experiment: this is real, we are present, and we are facing it, each with a limited amount of life to live. It is the one thing LLMs do not have yet, though the robots are coming.</p>' +
      '<p><strong>Temporally immanent.</strong> The time is now. Not yesterday or tomorrow, not what people said last year or built ten years ago, not the organisations made for us, not what we hope or pray for. Oriented to the future rather than the past. Look at the direction of travel, in AI, in overconsumption, in the environment: that is the wave.</p>' +
      '<p><strong>Virtually immersed.</strong> We are immersed in what we think and identify with: ideas, religions, who we thought we were and who we will be. Enough alignment among them is the clarity an LLM can help bring. It may evaporate, so keep looking: check the waves now and then, and turn towards them. Aligned, we become part of something big. Done well, we have a chance.</p>' +
      '<p>Here and now: the time is now, and the location is here. Fulcrum named each person’s end-point temporally immanent, physically embodied and socially immersed (Volume 0); virtual immersion is the addition for the age of AI.</p>' +
      '</div>' +
      '<p class="pr-lab voices-head">Voices · each of us has our own</p>' +
      '<div class="voices" id="voices" aria-live="polite"></div>' +
      '<label class="sr" for="v-who">Your name</label><input class="field" id="v-who" type="text" autocomplete="off" placeholder="Your name (optional)">' +
      '<label class="sr" for="v-text">Your voice</label><textarea class="field" id="v-text" placeholder="What is true for you, here and now? What will you do about it today?"></textarea>' +
      '<div class="row"><button class="btn" type="button" id="v-add">Add your voice</button><span class="note">Kept on this device. Up to nine are read as they are; past nine, a synthesis.</span></div>';
    show('What is true', 'Here and now', 'true', html);
    $('#more').addEventListener('click', () => {
      const d = $('#detail'), m = $('#more');
      d.hidden = !d.hidden;
      m.setAttribute('aria-expanded', String(!d.hidden));
      m.textContent = d.hidden ? 'Read more' : 'Show less';
    });
    renderVoices();
    $('#v-add').addEventListener('click', () => {
      const t = $('#v-text').value.trim();
      if (!t) { $('#v-text').focus(); return; }
      voices.push({ who: $('#v-who').value.trim().slice(0, 40), text: t.slice(0, 1200), at: Date.now() });
      saveVoices();
      $('#v-text').value = ''; $('#v-who').value = '';
      renderVoices();
    });
  }
  $('#btn-true').addEventListener('click', openTrue);

  /* ---------- start ---------- */
  readColors();
  try {
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    if (mq.addEventListener) mq.addEventListener('change', readColors); else if (mq.addListener) mq.addListener(readColors);
  } catch (e) {}
  new MutationObserver(readColors).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme', 'class', 'style'] });
  try { const p = localStorage.getItem('reflexive-cba-phase'); if (p === 'ba' || p === 'cb') { phase = p; stage.dataset.phase = p; $('#ph-cb').setAttribute('aria-pressed', String(p === 'cb')); $('#ph-ba').setAttribute('aria-pressed', String(p === 'ba')); } } catch (e) {}
  resize();
  if ('ResizeObserver' in window) new ResizeObserver(resize).observe(stage);
  else window.addEventListener('resize', resize);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { computeFree(); });
  addPerson((FREE.x0 + FREE.x1) / 2, (FREE.y0 + FREE.y1) / 2);
  people.forEach(p => { p.alpha = 1; });
  if (paused) setPaused(true);
  updateText();
  requestAnimationFrame(frame);
})();
</script>
