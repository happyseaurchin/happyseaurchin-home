<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Reflexive CBA II</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..600&display=swap">
<style>
/* Layout: a one-screen app, the fork of Reflexive CBA. Top bar (name, Expected or Potential, what is true, whole system, room check, insights); a full-bleed stage where the animation runs, with two rails of level buttons on its edges (social top, relational middle, psychological bottom): C to B on the left, read downwards, B to A on the right, read upwards, so the presenter traces the U. Each button spreads a small cloud of words over the stage; a word opens its card. A bottom bar holds the scale and its tools. */
:root {
  --paper: #F3F6F5;
  --panel: #E7EDEB;
  --glass: rgba(243, 246, 245, .9);
  --stage: #E8EDEB;
  --ink: #16212B;
  --ink-2: #4E5B66;
  --rule: #B4C0C5;
  --c: #7B8692;
  --fulcrum: #C27D0E;
  --fulcrum-ink: #8F5A00;
  --a: #1E7D6C;
  --a-ink: #176A5C;
  --scrim: rgba(22, 33, 43, .28);
  --display: "Newsreader", Georgia, "Times New Roman", serif;
  --body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0D1316; --panel: #16201F; --glass: rgba(13, 19, 22, .88); --stage: #081013;
    --ink: #E3EAEC; --ink-2: #9EAEB6; --rule: #36464E;
    --c: #8B97A2; --fulcrum: #E6A63C; --fulcrum-ink: #F0BC63; --a: #4FC3A9; --a-ink: #6FD3BC;
    --scrim: rgba(0, 0, 0, .52);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0D1316; --panel: #16201F; --glass: rgba(13, 19, 22, .88); --stage: #081013;
  --ink: #E3EAEC; --ink-2: #9EAEB6; --rule: #36464E;
  --c: #8B97A2; --fulcrum: #E6A63C; --fulcrum-ink: #F0BC63; --a: #4FC3A9; --a-ink: #6FD3BC;
  --scrim: rgba(0, 0, 0, .52);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; overflow: auto;
  background: var(--paper); color: var(--ink);
  font-family: var(--body); font-size: 15px; line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
button:focus-visible, a:focus-visible, textarea:focus-visible { outline: 2px solid var(--a); outline-offset: 2px; }
.app { height: 100%; min-height: 460px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }

.bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px;
  padding-block: 9px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--paper); position: relative; z-index: 3;
}
.bar.top { border-bottom: 1px solid var(--rule); }
.bar.bottom { border-top: 1px solid var(--rule); }
.brand { margin: 0 auto 0 0; font-family: var(--display); font-size: 23px; font-weight: 600; letter-spacing: -.01em; white-space: nowrap; line-height: 1.1; }
.brand em { font-style: italic; font-weight: 500; color: var(--fulcrum-ink); }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 999px; padding: 2px; gap: 2px; }
.seg button { border: 0; background: transparent; border-radius: 999px; padding: 6px 12px; font-size: 14px; cursor: pointer; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.btn { border: 1px solid var(--rule); background: transparent; border-radius: 999px; padding: 6px 13px; font-size: 14px; cursor: pointer; white-space: nowrap; }
.btn:hover, .seg button:hover { border-color: var(--ink-2); }
.btn[aria-pressed="true"] { border-color: var(--fulcrum); color: var(--fulcrum-ink); }
.btn .short { display: none; }
.ctx { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.ctx[hidden] { display: none; }
.ctx-lab { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
#play { margin-left: auto; }

.stage { position: relative; min-height: 0; overflow: hidden; background: var(--stage); }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }

.rail {
  position: absolute; top: 12px; bottom: 12px; width: 158px; z-index: 2;
  display: flex; flex-direction: column; justify-content: space-between; gap: 10px;
  pointer-events: none; transition: opacity .3s;
}
.rail > * { pointer-events: auto; }
.rail-l { left: max(12px, env(safe-area-inset-left, 0px)); }
.rail-r { right: max(12px, env(safe-area-inset-right, 0px)); }
.rail-top { display: grid; gap: 6px; }
.rail-head { margin: 0; font-family: var(--display); font-style: italic; font-size: 20px; line-height: 1; padding-left: 2px; }
.rail-head { color: var(--ink-2); }
.rail-head .way { font-family: var(--body); font-style: normal; font-size: 13px; margin-left: 4px; color: var(--ink-2); }
.rail-sub { margin: -2px 0 2px; padding-left: 2px; font-family: var(--mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; line-height: 1.3; color: var(--ink-2); }
.lvl {
  display: grid; gap: 2px; width: 100%; text-align: left; cursor: pointer;
  padding: 9px 11px; border-radius: 12px; border: 1px solid var(--c); background: var(--glass);
  transition: border-color .25s, background-color .25s;
}
.stage[data-form="potential"] .lvl { border-color: var(--a); }
.stage[data-form="potential"] .rail-head { color: var(--a-ink); }
.lvl:hover { background: var(--paper); }
.lvl[aria-expanded="true"] { background: var(--paper); box-shadow: inset 0 0 0 1px var(--fulcrum); border-color: var(--fulcrum); }
.lvl .lv { font-family: var(--mono); font-size: 10.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-2); }
.lvl .lv-s { display: none; }
.lvl .lt { font-weight: 700; font-size: 14px; line-height: 1.25; }
.form-seg button[aria-pressed="true"]#fm-exp { background: var(--c); color: #fff; }
.form-seg button[aria-pressed="true"]#fm-pot { background: var(--a); color: #fff; }

/* The words float over the running animation beside their button: at most three, chosen by the scale behind them. */
.cloud { position: absolute; z-index: 4; pointer-events: none; }
.cloud-chips { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; }
.cloud[data-side="r"] .cloud-chips { align-items: flex-end; }
.chip {
  pointer-events: auto; box-shadow: 0 6px 18px rgba(0, 0, 0, .18);
  border: 1px solid var(--c); background: var(--paper); color: var(--ink); border-radius: 999px;
  padding: 6px 13px; font-size: 15px; font-weight: 700; cursor: pointer; line-height: 1.2; text-align: left;
  opacity: 0; transform: translate(var(--dx, 0), calc(var(--dy, 0px) + 6px)) rotate(var(--rot, 0deg)) scale(.9);
  transition: opacity .28s ease, transform .32s ease;
}
.stage[data-form="potential"] .chip { border-color: var(--a); }
.cloud.open .chip { opacity: 1; transform: translate(var(--dx, 0), var(--dy, 0px)) rotate(var(--rot, 0deg)) scale(1); }
.chip.key { background: var(--fulcrum); border-color: var(--fulcrum); color: #1b1203; font-size: 16.5px; padding: 7px 15px; }
.chip:hover { border-color: var(--ink-2); }
.chip:focus-visible { outline: 2px solid var(--a); outline-offset: 2px; }
.ctext { margin: 12px 0 0; font-size: 16px; line-height: 1.55; max-width: 60ch; }
.ctext a { color: var(--ink); }
.cnote { margin: 12px 0 0; font-size: 13px; color: var(--ink-2); }

/* Which way the contents flow, at the foot of the psychological view. */
.circ { position: absolute; z-index: 2; left: 50%; bottom: 12px; transform: translateX(-50%); display: inline-flex; border: 1px solid var(--rule); border-radius: 999px; padding: 2px; gap: 2px; background: var(--glass); }
.circ button { border: 0; background: transparent; border-radius: 999px; padding: 6px 12px; font-size: 13.5px; cursor: pointer; white-space: nowrap; }
.circ button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.stage[data-scale="psy"] .hint { bottom: 54px; }
.stepper { display: inline-flex; align-items: center; gap: 4px; }
.stepper .num { min-width: 1.4em; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
.stepper .btn { padding: 4px 11px; font-size: 16px; line-height: 1.2; }
.listen { display: inline-flex; align-items: center; gap: 6px; }
.listen input { width: 110px; accent-color: var(--fulcrum); }

.stage-title, .hint {
  position: absolute; z-index: 1; margin: 0; text-align: center; pointer-events: none;
  left: 180px; right: 180px;
}
.stage-title { top: 12px; font-family: var(--display); font-style: italic; font-size: 19px; line-height: 1.3; color: var(--ink); text-wrap: balance; }
.hint { bottom: 12px; font-size: 13px; color: var(--ink-2); text-wrap: balance; }
@media (max-width: 900px) {
  /* Room for two lines either way, so the drawing area holds still as the words change. */
  .stage-title { min-height: 2.6em; }
  .hint { min-height: 2.9em; display: flex; align-items: flex-end; justify-content: center; }
}
.hint.flash { color: var(--fulcrum-ink); }

.overlay { position: absolute; inset: 0; z-index: 5; display: grid; place-items: center; padding: 14px; }
.overlay[hidden] { display: none; }
.scrim { position: absolute; inset: 0; background: var(--scrim); }
.card {
  position: relative; width: min(580px, 100%); max-height: 100%; overflow: auto;
  background: var(--paper); color: var(--ink); border: 1px solid var(--rule); border-radius: 16px;
  padding: 18px 20px 20px; box-shadow: 0 12px 34px rgba(0, 0, 0, .2);
}
.card-head { display: flex; align-items: flex-start; gap: 12px; }
.card-head > div { flex: 1; min-width: 0; }
.eyebrow { margin: 0; font-family: var(--mono); font-size: 11.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-2); }
.card h2 { margin: 4px 0 0; font-family: var(--display); font-weight: 500; font-size: 30px; line-height: 1.1; text-wrap: balance; }
.x { flex: none; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--rule); background: transparent; cursor: pointer; font-size: 20px; line-height: 1; }
.chips { list-style: none; margin: 14px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.chips li { border: 1px solid var(--rule); border-radius: 999px; padding: 4px 11px; font-size: 14.5px; font-weight: 700; }
.card[data-side="cb"] .chips li { border-color: var(--c); }
.card[data-side="ba"] .chips li { border-color: var(--a); }
.practice { margin-top: 16px; padding: 12px 14px; background: var(--panel); border-radius: 12px; display: grid; gap: 6px; }
.pr-lab { margin: 0; font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.pr-row { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 8px; align-items: baseline; font-size: 14.5px; }
.pr-move { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 8px; align-items: baseline; font-size: 15.5px; }
.pr-move .arrow { text-align: center; color: var(--ink-2); }
.tag { font-family: var(--display); font-style: italic; font-size: 19px; line-height: 1; text-align: center; }
.tag-c { color: var(--c); }
.tag-b { color: var(--fulcrum-ink); }
.tag-a { color: var(--a-ink); }
.more { margin-top: 14px; }
.detail { margin-top: 12px; display: grid; gap: 10px; }
.detail p { margin: 0; font-size: 15px; line-height: 1.55; max-width: 62ch; }
.detail a, .card a { color: var(--ink); }
.lead { margin: 12px 0 0; color: var(--ink-2); }
.checks { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 8px; }
.checks li { display: grid; gap: 1px; padding: 9px 12px; border: 1px solid var(--rule); border-radius: 12px; font-size: 16px; }
.checks .lv { font-family: var(--mono); font-size: 10.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-2); }
.tally { margin-top: 14px; display: grid; gap: 8px; }
.trow { display: grid; grid-template-columns: 30px minmax(0, 1fr) 40px 40px 40px; align-items: center; gap: 8px; }
.trow .tname { font-size: 14px; color: var(--ink-2); }
.trow .num { text-align: center; font-size: 18px; font-variant-numeric: tabular-nums; font-weight: 700; }
.step { width: 40px; height: 36px; border-radius: 10px; border: 1px solid var(--rule); background: transparent; cursor: pointer; font-size: 18px; }
.tbar { display: flex; height: 12px; border-radius: 999px; overflow: hidden; background: var(--panel); margin-top: 8px; }
.tbar i { display: block; height: 100%; transition: width .3s; }
.tbar .s-c { background: var(--c); }
.tbar .s-b { background: var(--fulcrum); }
.tbar .s-a { background: var(--a); }
.readout { margin: 8px 0 0; font-family: var(--display); font-style: italic; font-size: 22px; }
textarea { width: 100%; margin-top: 12px; min-height: 160px; resize: vertical; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); font: inherit; font-size: 16px; line-height: 1.5; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 10px; }
.note { font-size: 13px; color: var(--ink-2); }
.btn-true { font-family: var(--display); font-style: italic; font-size: 16px; border-color: var(--fulcrum); }
.truths { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 10px; }
.truths li { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 1px 10px; align-items: baseline; }
.truths .n { font-family: var(--display); font-style: italic; font-size: 22px; line-height: 1; text-align: center; color: var(--ink-2); }
.truths .ours .n { color: var(--fulcrum-ink); }
.truths .tw { font-weight: 700; font-size: 17px; }
.truths .tl { grid-column: 2; font-size: 15px; color: var(--ink-2); }
.given { margin: 14px 0 0; font-size: 15px; }
.ask { margin: 6px 0 0; font-family: var(--display); font-weight: 500; font-size: 28px; line-height: 1.15; text-wrap: balance; }
.wave { margin: 10px 0 0; font-size: 15px; color: var(--ink-2); max-width: 60ch; }
.voices-head { margin: 20px 0 0; }
.voices { margin-top: 8px; display: grid; gap: 8px; }
.voice { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 8px; align-items: start; padding: 9px 12px; border-left: 3px solid var(--rule); background: var(--panel); border-radius: 0 10px 10px 0; }
.voice.seed { border-left-color: var(--fulcrum); }
.voice .who { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.voice .said { grid-column: 1; margin: 0; font-size: 15px; white-space: pre-wrap; overflow-wrap: anywhere; }
.voice .rm { grid-column: 2; grid-row: 1 / span 2; border: 0; background: transparent; cursor: pointer; color: var(--ink-2); font-size: 18px; line-height: 1; padding: 2px 4px; }
.many { margin: 0; padding: 8px 12px; border: 1px dashed var(--fulcrum); border-radius: 10px; font-size: 14px; }
.field { width: 100%; margin-top: 10px; padding: 9px 12px; border-radius: 12px; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); font: inherit; font-size: 16px; }
textarea.field { min-height: 92px; resize: vertical; line-height: 1.5; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (max-width: 760px) {
  .brand { font-size: 20px; }
  /* Both rails stay on a phone, as narrow tabs: the words live in the clouds. */
  .rail { width: 50px; top: 10px; bottom: 10px; gap: 8px; }
  .rail-l { left: max(8px, env(safe-area-inset-left, 0px)); }
  .rail-r { right: max(8px, env(safe-area-inset-right, 0px)); }
  .rail-sub, .lvl .lt, .lvl .lv { display: none; }
  .lvl { padding: 12px 2px; border-radius: 12px; text-align: center; }
  .lvl .lv-s { display: block; font-family: var(--mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
  .rail-head { font-size: 15px; text-align: center; padding-left: 0; }
  .rail-head .way { display: block; margin: 3px 0 0; font-size: 12px; }
  .chip { font-size: 13.5px; padding: 5px 11px; }
  .chip.key { font-size: 14.5px; padding: 6px 12px; }
  .cloud-chips { gap: 10px; }
  .circ button { padding: 6px 9px; font-size: 12.5px; }
  .listen input { width: 84px; }
  .stage-title { font-size: 16px; }
  .hint { font-size: 12px; }
  .seg button { padding: 6px 9px; font-size: 13px; }
  .btn { padding: 6px 10px; font-size: 13px; }
  .btn-true { font-size: 15px; padding: 5px 11px; }
  .ask { font-size: 24px; }
  .btn .full { display: none; }
  .btn .short { display: inline; }
  .ctx-lab:not(.keep) { display: none; }
  /* On a phone, Pause rides with the scale buttons, and the tools for each scale take the rows below. */
  .bar.bottom > .seg { order: 0; }
  #play { order: 1; }
  .bar.bottom > .ctx { order: 2; }
  .card { padding: 16px 16px 18px; }
  .card h2 { font-size: 25px; }
  .chips { gap: 5px; }
  .chips li { font-size: 13.5px; padding: 3px 9px; }
  .lead { font-size: 14px; }
  .checks { gap: 6px; }
  .checks li { font-size: 15px; padding: 7px 10px; }
  .trow { grid-template-columns: 26px minmax(0, 1fr) 38px 34px 38px; gap: 6px; }
  .step { width: 38px; height: 34px; }
}
@media (max-width: 380px) {
  .bar { gap: 8px 7px; }
  .btn { padding: 6px 9px; }
  .btn-true { padding: 5px 9px; }
}
@media (prefers-reduced-motion: reduce) {
  .rail, .tbar i, .chip, .lvl { transition: none; }
}
</style>

<div class="app">
  <header class="bar top">
    <p class="brand">Reflexive <em>CBA</em></p>
    <div class="seg form-seg" role="group" aria-label="Which form the words take">
      <button type="button" id="fm-exp" aria-pressed="true">Expected</button>
      <button type="button" id="fm-pot" aria-pressed="false">Potential</button>
    </div>
    <button class="btn btn-true" type="button" id="btn-true"><span class="full">What is true</span><span class="short">What’s true</span></button>
    <button class="btn" type="button" id="btn-whole"><span class="full">Whole system</span><span class="short">System</span></button>
    <button class="btn" type="button" id="btn-room"><span class="full">Where are we?</span><span class="short">Where?</span></button>
    <button class="btn" type="button" id="btn-ins">Insights</button>
  </header>

  <main class="stage" id="stage" data-form="expected" data-scale="rel">
    <canvas id="cv" role="img" aria-label="Relational scale: people as complex systems in a room"></canvas>
    <p class="stage-title" id="stage-title">Relational · a room of complex systems</p>
    <p class="hint" id="hint">Tap to add a person</p>

    <nav class="rail rail-l" aria-label="C to B, read downwards">
      <div class="rail-top">
        <p class="rail-head">C → B<span class="way" aria-hidden="true">↓</span></p>
        <p class="rail-sub">Open to all</p>
        <button class="lvl" type="button" id="lv-cb-soc" data-key="cb-soc" aria-expanded="false" aria-controls="cloud"><span class="lv">Social</span><span class="lv-s">Soc</span><span class="lt"></span></button>
      </div>
      <button class="lvl" type="button" id="lv-cb-rel" data-key="cb-rel" aria-expanded="false" aria-controls="cloud"><span class="lv">Relational</span><span class="lv-s">Rel</span><span class="lt"></span></button>
      <button class="lvl" type="button" id="lv-cb-psy" data-key="cb-psy" aria-expanded="false" aria-controls="cloud"><span class="lv">Psychological</span><span class="lv-s">Psy</span><span class="lt"></span></button>
    </nav>

    <nav class="rail rail-r" aria-label="B to A, read upwards">
      <div class="rail-top">
        <p class="rail-head">B → A<span class="way" aria-hidden="true">↑</span></p>
        <p class="rail-sub">Once the room holds B</p>
        <button class="lvl" type="button" id="lv-ba-soc" data-key="ba-soc" aria-expanded="false" aria-controls="cloud"><span class="lv">Social</span><span class="lv-s">Soc</span><span class="lt"></span></button>
      </div>
      <button class="lvl" type="button" id="lv-ba-rel" data-key="ba-rel" aria-expanded="false" aria-controls="cloud"><span class="lv">Relational</span><span class="lv-s">Rel</span><span class="lt"></span></button>
      <button class="lvl" type="button" id="lv-ba-psy" data-key="ba-psy" aria-expanded="false" aria-controls="cloud"><span class="lv">Psychological</span><span class="lv-s">Psy</span><span class="lt"></span></button>
    </nav>

    <div class="cloud" id="cloud" role="group" hidden>
      <div class="cloud-chips" id="cloud-chips"></div>
    </div>

    <div class="circ" id="circ" role="group" aria-label="Which way the contents flow" hidden>
      <button type="button" id="dir-sense" data-dir="1" aria-pressed="true">↺ Sense to word</button>
      <button type="button" id="dir-word" data-dir="-1" aria-pressed="false">Word to sense ↻</button>

  <footer class="bar bottom">
    <div class="seg" role="group" aria-label="Scale">
      <button type="button" id="sc-psy" data-scale="psy" aria-pressed="false">Psychological</button>
      <button type="button" id="sc-rel" data-scale="rel" aria-pressed="true">Relational</button>

    </div>

      <button class="btn" type="button" id="add"><span class="full">Add person</span><span class="short">Add</span></button>
      <button class="btn" type="button" id="auto" aria-pressed="false"><span class="full">Phase groups</span><span class="short">Phase</span></button>
      <button class="btn" type="button" id="reset"><span class="full">Start again</span><span class="short">Reset</span></button>
    </div>

      <button class="btn" type="button" id="q3" data-q="3" aria-pressed="false">Q3 · B</button>
      <button class="btn" type="button" id="q2" data-q="2" aria-pressed="false">Q2 · A</button>

        <span class="ctx-lab people-lab">People</span>

        <span class="num" id="p-num" aria-live="polite">1</span>

      </span>
      <label class="listen"><span class="ctx-lab keep">Listening</span><input type="range" id="listen" min="0" max="100" value="5" aria-label="How much each person listens to the others"></label>
    </div>
    <div class="ctx" id="ctx-soc" hidden>
      <button class="btn" type="button" id="f-all" data-focus="all" aria-pressed="true">All three</button>
      <button class="btn" type="button" id="f-c" data-focus="c" aria-pressed="false">C</button>
      <button class="btn" type="button" id="f-b" data-focus="b" aria-pressed="false">B</button>

  </footer>
</div>

<script>
(() => {
  'use strict';
  const TAU = Math.PI * 2;
  const $ = s => document.querySelector(s);
  const $$ = s => Array.from(document.querySelectorAll(s));
  const stage = $('#stage');
  const cv = $('#cv');
  const ctx = cv.getContext('2d');
  const reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  const clamp = (v, lo, hi) => (lo > hi ? (lo + hi) / 2 : Math.min(hi, Math.max(lo, v)));
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const avg = arr => arr.reduce((s, v) => s + v, 0) / (arr.length || 1);
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  let W = 1, H = 1, DPR = 1, T = 0, last = 0;
  let paused = reduce;
  let scale = 'rel';
  let form = 'expected';
  let fade = 1;
  let FREE = { x0: 0, x1: 1, y0: 0, y1: 1 };
  let COL = {};
  let dark = false;

  function hexRgb(h) {
    h = (h || '#888888').replace('#', '').trim();
    if (h.length === 3) h = h.split('').map(c => c + c).join('');
    const n = parseInt(h, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  function rgba(hex, a) { const c = hexRgb(hex); return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }
  function readColors() {
    const cs = getComputedStyle(document.documentElement);
    const g = n => cs.getPropertyValue(n).trim();
    COL = { ink: g('--ink'), ink2: g('--ink-2'), rule: g('--rule'), c: g('--c'), b: g('--fulcrum'), bInk: g('--fulcrum-ink'), a: g('--a'), aInk: g('--a-ink'), stage: g('--stage') };
    const s = hexRgb(COL.stage);
    dark = (0.2126 * s[0] + 0.7152 * s[1] + 0.0722 * s[2]) < 110;
  }
  const pcol = (p, a) => 'hsla(' + p.hue + ',' + (dark ? 55 : 46) + '%,' + (dark ? 68 : 36) + '%,' + a + ')';
  const MONO = '"IBM Plex Mono", ui-monospace, Menlo, monospace';
  const SERIF = 'Newsreader, Georgia, serif';

  /* ---------- layout ---------- */
  function computeFree() {
    const old = FREE;
    const sr = stage.getBoundingClientRect();
    let l = 0, r = 0;
    $$('.rail').forEach(el => {
      if (getComputedStyle(el).display === 'none') return;
      const b = el.getBoundingClientRect();
      if (!b.width) return;
      if (b.left + b.width / 2 < sr.left + sr.width / 2) l = Math.max(l, b.right - sr.left);
      else r = Math.max(r, sr.right - b.left);
    });
    FREE = { x0: l + 10, x1: W - r - 10, y0: 10, y1: H - 10 };
    ['#stage-title', '#hint'].forEach(s => { const el = $(s); el.style.left = (l + 12) + 'px'; el.style.right = (r + 12) + 'px'; });
    const tb = $('#stage-title').getBoundingClientRect();
    const hb = $('#hint').getBoundingClientRect();
    FREE.y0 = Math.max(10, tb.bottom - sr.top + 6);
    FREE.y1 = Math.min(H - 10, hb.top - sr.top - 6);
    // When a rail swaps sides (phone), carry the room across with the free space.
    if (people.length && old.x1 > old.x0 + 2) {
      const dx = ((FREE.x0 + FREE.x1) - (old.x0 + old.x1)) / 2;
      const dy = ((FREE.y0 + FREE.y1) - (old.y0 + old.y1)) / 2;
      if (Math.abs(dx) > 1 || Math.abs(dy) > 1) {
        people.forEach(p => { p.x += dx; p.y += dy; p.wx += dx; p.wy += dy; });
        groups.forEach(g => { g.cx += dx; g.cy += dy; g.wx += dx; g.wy += dy; });
        drawing = null;
      }
    }
  }
  function resize() {
    const r = stage.getBoundingClientRect();
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = Math.max(1, r.width); H = Math.max(1, r.height);
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    computeFree();
    const rr = R();
    people.forEach(p => { p.x = clamp(p.x, FREE.x0 + rr, FREE.x1 - rr); p.y = clamp(p.y, FREE.y0 + rr, FREE.y1 - rr); });
    if (soc) initSocial();
  }

  /* ---------- people (relational) ---------- */
  const HUES = [205, 28, 165, 285, 345, 48, 120, 235, 12];
  const KINDS = ['tri', 'circ', 'sq'];
  let people = [], groups = [], particles = [];
  let nextId = 1, nextGroupId = 1, selectedId = null;
  let autoPhase = false, nextPhaseAt = 0;
  let drawing = null;
  const R = () => Math.max(19, Math.min(46, Math.min(FREE.x1 - FREE.x0, FREE.y1 - FREE.y0) * 0.085));
  const byId = id => people.find(p => p.id === id);

  function makePerson(x, y) {
    const id = nextId++;
    const rnd = mulberry32(id * 7919 + 13);
    const sign = () => (rnd() < 0.5 ? -1 : 1);
    const shapes = [];
    const ns = 3 + Math.floor(rnd() * 3);
    for (let i = 0; i < ns; i++) shapes.push({ kind: KINDS[Math.floor(rnd() * 3)], orbit: 0.18 + rnd() * 0.4, ang: rnd() * TAU, os: (0.25 + rnd() * 0.6) * sign(), rot: rnd() * TAU, rs: (0.6 + rnd() * 1.8) * sign(), size: 0.22 + rnd() * 0.16 });
    const harm = [2, 3, 5, 7].map(k => ({ k, amp: 0.025 + rnd() * 0.05, ph: rnd() * TAU, sp: (0.3 + rnd() * 0.9) * sign() }));
    // pace: each person's own speed through the moment; theta: where their moment is now.
    return { id, x, y, vx: 0, vy: 0, wx: x, wy: y, nextWander: T + 1 + rnd() * 3, hue: HUES[(id - 1) % HUES.length], shapes, harm, group: null, alpha: paused ? 1 : 0, pace: 0.72 + rnd() * 0.6, theta: rnd() * TAU };
  }
  function addPerson(x, y) {
    if (people.length >= 9) { flash('Nine people fill this view'); return null; }
    const r = R();
    if (x == null) {
      // Find an open spot: the first clear candidate, else the roomiest of a dozen.
      let best = null, bestGap = -1;
      for (let i = 0; i < 12; i++) {
        const cx = rand(FREE.x0 + r * 1.5, FREE.x1 - r * 1.5), cy = rand(FREE.y0 + r * 1.5, FREE.y1 - r * 1.5);
        const gap = people.reduce((m, p) => Math.min(m, Math.hypot(p.x - cx, p.y - cy)), Infinity);
        if (gap > bestGap) { bestGap = gap; best = [cx, cy]; }
        if (gap > r * 2.6) break;
      }
      x = best[0]; y = best[1];
    }
    const p = makePerson(clamp(x, FREE.x0 + r, FREE.x1 - r), clamp(y, FREE.y0 + r, FREE.y1 - r));
    people.push(p);
    if (selectedId == null) selectedId = p.id;
    updateText();
    return p;
  }
  function resetPeople() {
    people = []; groups = []; particles = []; selectedId = null; psySet = [];
    setAuto(false);
    addPerson((FREE.x0 + FREE.x1) / 2, (FREE.y0 + FREE.y1) / 2);
    syncPsySet();
  }

  function groupRadius(m, r) { return m <= 2 ? r * 1.2 : Math.max(r * 1.35, m * r * 0.42); }
  function slotPos(g, idx, m, r) {
    if (m === 2) return [g.cx + (idx === 0 ? -1 : 1) * r * 1.2, g.cy];
    const rad = groupRadius(m, r);
    const a = -Math.PI / 2 + idx * TAU / m + g.spin;
    return [g.cx + Math.cos(a) * rad, g.cy + Math.sin(a) * rad];
  }
  function makeGroup(ids, manual) {
    const mem = people.filter(p => ids.indexOf(p.id) !== -1);
    if (mem.length < 2) return null;
    const r = R();
    const g = { id: nextGroupId++, members: mem.map(p => p.id), cx: avg(mem.map(p => p.x)), cy: avg(mem.map(p => p.y)), wx: 0, wy: 0, nextWander: T + 3, alpha: paused ? 1 : 0, dying: false, manual, spin: 0, emit: 0 };
    g.rad = groupRadius(g.members.length, r) + r * 1.45;
    g.cx = clamp(g.cx, FREE.x0 + g.rad, FREE.x1 - g.rad);
    g.cy = clamp(g.cy, FREE.y0 + g.rad, FREE.y1 - g.rad);
    g.wx = g.cx; g.wy = g.cy;
    mem.forEach(p => { p.group = g.id; });
    groups.push(g);
    return g;
  }
  function killGroup(g) {
    g.dying = true;
    g.members.forEach(id => { const p = byId(id); if (p && p.group === g.id) p.group = null; });
    if (paused) groups = groups.filter(q => q !== g);
  }
  function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function randomPartition(ids) {
    const a = shuffle(ids.slice());
    const n = a.length;
    if (n < 2) return [];
    const r = Math.random();
    let sizes = [];
    if (r < 0.22) sizes = [n];
    else if (r < 0.48) sizes = [Math.min(n - 1, 2 + Math.floor(Math.random() * Math.max(1, n - 2)))];
    else {
      let left = n;
      while (left >= 2) {
        const s = left >= 3 && Math.random() < 0.4 ? 3 : 2;
        sizes.push(s); left -= s;
        if (left >= 2 && Math.random() < 0.22) break;
      }
    }
    const out = []; let i = 0;
    sizes.forEach(s => { if (s >= 2) out.push(a.slice(i, i + s)); i += s; });
    return out;
  }
  function applyPartition(parts) {
    groups.slice().forEach(g => { if (!g.dying) killGroup(g); });
    parts.forEach(ids => makeGroup(ids, false));
  }
  function pointInPoly(x, y, poly) {
    let inside = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const xi = poly[i][0], yi = poly[i][1], xj = poly[j][0], yj = poly[j][1];
      if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / ((yj - yi) || 1e-9) + xi)) inside = !inside;
    }
    return inside;
  }
  function lasso(path) {
    const inside = people.filter(p => pointInPoly(p.x, p.y, path));
    if (inside.length < 2) { flash('Draw the loop around at least two people'); return; }
    const ids = inside.map(p => p.id);
    groups.slice().forEach(g => {
      if (g.dying) return;
      g.members = g.members.filter(id => ids.indexOf(id) === -1);
      if (g.members.length < 2) killGroup(g);
    });
    inside.forEach(p => { p.group = null; });
    makeGroup(ids, true);
    setAuto(false);
  }

  function stepRel(dt) {
    const r = R();
    groups.forEach(g => {
      g.alpha = Math.min(1, Math.max(0, g.alpha + (g.dying ? -1.8 : 1.6) * dt));
      if (g.dying) return;
      g.rad = groupRadius(g.members.length, r) + r * 1.45;
      g.spin += dt * 0.05;
      if (T > g.nextWander) {
        g.wx = rand(FREE.x0 + g.rad, FREE.x1 - g.rad); g.wy = rand(FREE.y0 + g.rad, FREE.y1 - g.rad);
        if (!(g.wx === g.wx)) g.wx = (FREE.x0 + FREE.x1) / 2;
        g.nextWander = T + 4 + Math.random() * 4;
      }
      g.cx += (clamp(g.wx, FREE.x0 + g.rad, FREE.x1 - g.rad) - g.cx) * dt * 0.12;
      g.cy += (clamp(g.wy, FREE.y0 + g.rad, FREE.y1 - g.rad) - g.cy) * dt * 0.12;
    });
    groups = groups.filter(g => !(g.dying && g.alpha <= 0));
    // Loops keep their own space: push overlapping groups apart.
    const live = groups.filter(g => !g.dying);
    for (let i = 0; i < live.length; i++) {
      for (let j = i + 1; j < live.length; j++) {
        const A = live[i], B = live[j];
        const dx = B.cx - A.cx, dy = B.cy - A.cy;
        const d = Math.hypot(dx, dy) || 0.01;
        const min = (A.rad + B.rad) * 0.96;
        if (d < min) {
          const push = (min - d) * 0.5 * Math.min(1, dt * 5);
          const ux = dx / d, uy = dy / d;
          A.cx -= ux * push; A.cy -= uy * push; B.cx += ux * push; B.cy += uy * push;
          A.wx -= ux * push; A.wy -= uy * push; B.wx += ux * push; B.wy += uy * push;
        }
      }
    }
    live.forEach(g => {
      g.cx = clamp(g.cx, FREE.x0 + g.rad, FREE.x1 - g.rad);
      g.cy = clamp(g.cy, FREE.y0 + g.rad, FREE.y1 - g.rad);
    });
    people.forEach(p => {
      p.alpha = Math.min(1, p.alpha + dt * 2);
      const g = p.group ? groups.find(q => q.id === p.group && !q.dying) : null;
      let tx, ty;
      if (g) {
        const idx = g.members.indexOf(p.id);
        const s = slotPos(g, idx, g.members.length, r);
        tx = s[0]; ty = s[1];
      } else {
        if (T > p.nextWander) {
          for (let tries = 0; tries < 8; tries++) {
            p.wx = rand(FREE.x0 + r * 1.4, FREE.x1 - r * 1.4); p.wy = rand(FREE.y0 + r * 1.4, FREE.y1 - r * 1.4);
            if (!live.some(q => Math.hypot(p.wx - q.cx, p.wy - q.cy) < q.rad + r)) break;
          }
          p.nextWander = T + 3 + Math.random() * 4;
        }
        tx = p.wx; ty = p.wy;
      }
      const k = g ? 3.4 : 0.8;
      p.vx += (tx - p.x) * k * dt; p.vy += (ty - p.y) * k * dt;
      // Anyone outside a loop stays outside it.
      live.forEach(q => {
        if (q.alpha < 0.3 || q.members.indexOf(p.id) !== -1) return;
        const dx = p.x - q.cx, dy = p.y - q.cy;
        const d = Math.hypot(dx, dy) || 0.01;
        const lim = q.rad + r * 0.15;
        if (d < lim) {
          const acc = (lim - d) * 9 * dt; p.vx += dx / d * acc; p.vy += dy / d * acc;
          if (!g && Math.hypot(p.wx - q.cx, p.wy - q.cy) < q.rad + r) p.nextWander = T;
        }
      });
    });
    for (let i = 0; i < people.length; i++) {
      for (let j = i + 1; j < people.length; j++) {
        const a = people[i], b = people[j];
        const dx = b.x - a.x, dy = b.y - a.y;
        const d = Math.hypot(dx, dy) || 0.01;
        const min = r * 2.3;
        if (d < min) {
          const f = (min - d) / min;
          const acc = (f * 700 + f * f * 1800) * dt;
          a.vx -= dx / d * acc; a.vy -= dy / d * acc; b.vx += dx / d * acc; b.vy += dy / d * acc;
        }
      }
    }
    const damp = Math.pow(0.1, dt);
    people.forEach(p => {
      p.vx *= damp; p.vy *= damp;
      p.x = clamp(p.x + p.vx * dt, FREE.x0 + r, FREE.x1 - r);
      p.y = clamp(p.y + p.vy * dt, FREE.y0 + r, FREE.y1 - r);
    });
    if (autoPhase && people.length >= 2 && T > nextPhaseAt) {
      applyPartition(randomPartition(people.map(p => p.id)));
      nextPhaseAt = T + 5.5 + Math.random() * 2;
    }
    groups.forEach(g => {
      if (g.dying || g.alpha < 0.6 || g.members.length < 2) return;
      g.emit -= dt;
      if (g.emit <= 0) {
        g.emit = 0.3 + Math.random() * 0.5;
        const a = pick(g.members);
        const b = pick(g.members.filter(x => x !== a));
        particles.push({ a, b, t: 0, dur: 1 + Math.random() * 0.6, bend: (Math.random() - 0.5) * 0.7 });
      }
    });
    particles.forEach(q => { q.t += dt / q.dur; });
    particles = particles.filter(q => q.t < 1 && byId(q.a) && byId(q.b));
    if (particles.length > 140) particles.splice(0, particles.length - 140);
  }

  function blob(p, x, y, r, t, n, extra) {
    ctx.beginPath();
    for (let i = 0; i <= n; i++) {
      const th = i / n * TAU;
      let k = 1;
      for (const h of p.harm) k += h.amp * Math.sin(h.k * th + h.ph + h.sp * t);
      const rr = r * k + extra * Math.sin(th * 11 + t * 2.4 + p.id);
      const px = x + Math.cos(th) * rr, py = y + Math.sin(th) * rr;
      if (i) ctx.lineTo(px, py); else ctx.moveTo(px, py);
    }
    ctx.closePath();
  }
  function drawShape(kind, x, y, s, rot, col, lw) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.beginPath();
    if (kind === 'circ') ctx.arc(0, 0, s * 0.55, 0, TAU);
    else if (kind === 'sq') ctx.rect(-s * 0.48, -s * 0.48, s * 0.96, s * 0.96);
    else {
      for (let i = 0; i < 3; i++) {
        const a = -Math.PI / 2 + i * TAU / 3;
        if (i) ctx.lineTo(Math.cos(a) * s * 0.62, Math.sin(a) * s * 0.62); else ctx.moveTo(Math.cos(a) * s * 0.62, Math.sin(a) * s * 0.62);
      }
      ctx.closePath();
    }
    ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.stroke(); ctx.restore();
  }
  function drawPerson(p, x, y, r, alpha) {
    ctx.globalAlpha = alpha;
    blob(p, x, y, r, T, 44, 0);
    ctx.fillStyle = pcol(p, dark ? 0.13 : 0.1); ctx.fill();
    ctx.strokeStyle = pcol(p, 0.95); ctx.lineWidth = 1.7; ctx.stroke();
    blob(p, x, y, r * 1.06, T * 1.4 + 2, 44, r * 0.03);
    ctx.strokeStyle = pcol(p, 0.4); ctx.lineWidth = 1; ctx.stroke();
    p.shapes.forEach(s => {
      const a = s.ang + s.os * T;
      drawShape(s.kind, x + Math.cos(a) * s.orbit * r, y + Math.sin(a) * s.orbit * r, s.size * r, s.rot + s.rs * T, pcol(p, 0.9), 1.4);
    });
    ctx.globalAlpha = 1;
  }
  function hull(pts) {
    pts.sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lo = [];
    for (const p of pts) { while (lo.length >= 2 && cross(lo[lo.length - 2], lo[lo.length - 1], p) <= 0) lo.pop(); lo.push(p); }
    const up = [];
    for (let i = pts.length - 1; i >= 0; i--) { const p = pts[i]; while (up.length >= 2 && cross(up[up.length - 2], up[up.length - 1], p) <= 0) up.pop(); up.push(p); }
    up.pop(); lo.pop();
    return lo.concat(up);
  }
  function smoothClosed(pts) {
    const n = pts.length;
    if (n < 3) return false;
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];

  // C: a hierarchy. Pull someone out, or sweep through it, and everyone springs back into rank.

    ptr.vx = ptr.vx * 0.5 + ivx * 0.5; ptr.vy = ptr.vy * 0.5 + ivy * 0.5;
    ptr.speed = Math.hypot(ptr.vx, ptr.vy);

    ptr.px = ptr.x; ptr.py = ptr.y; ptr.x = pt[0]; ptr.y = pt[1]; ptr.lastT = now;

        extra: { psy: ['A reflection, not a window'], rel: ['Customers to collaborators', 'Who is looking'], soc: ['Shared context windows', 'MAGI'] },
        chips: [
          ['Align to a mutual objective', 'The second decision point, taken together. Trust moves a group from B to A: the faster we reflect each other and enter trust, the sooner.'],
          ['A reflection, not a window', 'Get as close as we can to the moment of production, the creative moment: a reflection, not a window.'],
          ['Who is looking', 'What sits on the beach is dead; what is alive is who is looking. Every beach response already names who else is there.'],
          ['Shared context windows', 'Instances taking content from each other turn by turn: thousands moving together like a murmuration. Starlings each track about six or seven neighbours (Ballerini and colleagues, 2008).'],
          ['MAGI', 'Fulcrum’s Multiple Artificial General Intelligence (Volume 0), where the reflections overlap: AI that reflects us, not Machus.'],
          ['Customers to collaborators', 'When something works, we validate it, move forward in trust, and track that trust through Open Meetings and Action Cycles.']
        ]
      }
    }
  };

  const ov = $('#ov'), card = $('#card'), body = $('#card-body');
  let lastFocus = null;
  function practiceHTML(p) {
    return '<div class="practice"><p class="pr-lab">' + p.label + '</p>' +
      '<div class="pr-row"><span class="tag tag-' + p.fromK + '">' + p.fromK.toUpperCase() + '</span><span>' + p.from + '</span></div>' +
      '<div class="pr-move"><span class="arrow" aria-hidden="true">↓</span><strong>' + p.move + '</strong></div>' +
      '<div class="pr-row"><span class="tag tag-' + p.toK + '">' + p.toK.toUpperCase() + '</span><span>' + p.to + '</span></div></div>';
  }
  function decisionsHTML() {
    return '<div class="practice"><p class="pr-lab">The two decision points</p>' +
      '<div class="pr-row"><span class="tag tag-b">1</span><span><strong>Within each of us:</strong> see yourself, and each other, as a complex system.</span></div>' +
      '<div class="pr-row"><span class="tag tag-a">2</span><span><strong>Together:</strong> align to a mutual objective, for a period of time.</span></div></div>';
  }
  function show(eyebrow, title, side, html) {
    $('#card-eyebrow').textContent = eyebrow;
    $('#card-title').textContent = title;
    card.dataset.side = side;
    body.innerHTML = html;
    lastFocus = document.activeElement;
    ov.hidden = false;
    card.scrollTop = 0;
    $('#card-close').focus();
  }
  function openWhole() {
    let html = '<ul class="chips">' + WHOLE.chips.map(t => '<li>' + t + '</li>').join('') + '</ul>' + decisionsHTML();
    html += '<button class="btn more" type="button" id="more" aria-expanded="false" aria-controls="detail">Read more</button>';
    html += '<div class="detail" id="detail" hidden>' + WHOLE.detail.map(p => '<p>' + p + '</p>').join('') + '</div>';
    show(WHOLE.eyebrow, WHOLE.title, 'whole', html);
    $('#more').addEventListener('click', () => {
      const d = $('#detail'), m = $('#more');
      d.hidden = !d.hidden;
      m.setAttribute('aria-expanded', String(!d.hidden));
      m.textContent = d.hidden ? 'Read more' : 'Show less';
    });
  }
  function closeCard() {
    ov.hidden = true;
    if (lastFocus && lastFocus.focus && document.contains(lastFocus)) lastFocus.focus();
  }

  /* ---------- clouds ---------- */
  const cloud = $('#cloud');
  let cloudKey = null;
  const formName = () => (form === 'expected' ? 'Expected' : 'Potential');
  const hashKey = k => k.split('').reduce((h, c) => (h * 31 + c.charCodeAt(0)) | 0, 7);
  function labelRails() {
    $$('.lvl').forEach(b => { const Lv = LEVELS[b.dataset.key]; b.querySelector('.lt').textContent = Lv[form].title; b.setAttribute('aria-label', Lv.side + ', ' + Lv.level + ': ' + Lv[form].title); });
  }
  function openCloud(key) {
    const btn = document.querySelector('.lvl[data-key="' + key + '"]');
    const Lv = LEVELS[key], f = Lv[form];
    const find = label => f.chips.find(c => c[0] === label);
    const keyChip = find(f.key);
    const extras = ((f.extra && f.extra[scale]) || []).map(find).filter(Boolean).slice(0, 2);
    const list = extras.length === 2 ? [extras[0], keyChip, extras[1]] : [keyChip].concat(extras);
    const onLeft = !!btn.closest('.rail-l');
    cloud.dataset.side = onLeft ? 'l' : 'r';
    cloud.setAttribute('aria-label', Lv.side + ', ' + Lv.level + ', ' + formName() + ', at the ' + ({ psy: 'psychological', rel: 'relational', soc: 'social' })[scale] + ' scale');
    const box = $('#cloud-chips');
    box.textContent = '';
    const rnd = mulberry32(hashKey(key + form + scale));
    list.forEach((c, i) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'chip' + (c === keyChip ? ' key' : '');
      b.textContent = c[0];
      b.style.setProperty('--dx', ((onLeft ? 1 : -1) * Math.round(4 + rnd() * 22)) + 'px');
      b.style.setProperty('--rot', ((rnd() - 0.5) * 4).toFixed(1) + 'deg');
      b.style.transitionDelay = (reduce ? 0 : i * 60) + 'ms';
      b.addEventListener('click', () => openChip(key, c));
      box.appendChild(b);
    });
    cloud.hidden = false;
    cloud.classList.remove('open');
    positionCloud(btn);
    requestAnimationFrame(() => cloud.classList.add('open'));
    $$('.lvl').forEach(x => x.setAttribute('aria-expanded', String(x === btn)));
    cloudKey = key;
  }
  function positionCloud(btn) {
    // Between the rails, beside its button, so every other button can still be reached.
    const sr = stage.getBoundingClientRect(), br = btn.getBoundingClientRect();
    const lb = $('.rail-l').getBoundingClientRect(), rb = $('.rail-r').getBoundingClientRect();
    const lo = lb.right - sr.left + 10, hi = rb.left - sr.left - 10;
    cloud.style.maxWidth = Math.max(160, hi - lo - 30) + 'px';
    const onLeft = cloud.dataset.side === 'l';
    cloud.style.left = onLeft ? lo + 'px' : 'auto';
    cloud.style.right = onLeft ? 'auto' : (sr.width - hi) + 'px';
    // Keep clear of the title above and the hint (and the flow button) below.
    const ch = cloud.offsetHeight;
    const top = $('#stage-title').getBoundingClientRect().bottom - sr.top + 6;
    const bottom = $('#hint').getBoundingClientRect().top - sr.top - 8;
    cloud.style.top = clamp(br.top - sr.top + br.height / 2 - ch / 2, top, bottom - ch) + 'px';
  }
  function closeCloud() {
    cloud.hidden = true;
    cloud.classList.remove('open');
    cloudKey = null;
    $$('.lvl').forEach(x => x.setAttribute('aria-expanded', 'false'));
  }
  function openChip(key, c) {
    const Lv = LEVELS[key], f = Lv[form];
    let html = '<p class="ctext">' + c[1] + '</p>';
    if (c[0] === f.key) html += practiceHTML(Lv.practice);
    html += '<p class="cnote">' + (key.indexOf('cb') === 0 ? 'Down the left, from social to psychological.' : 'Up the right, from psychological to social.') + ' Switch Expected and Potential to see the other form.</p>';
    show(Lv.side + ' · ' + Lv.level + ' · ' + formName(), c[0], form, html);
  }
  function setForm(f) {
    form = f;
    stage.dataset.form = f;
    $('#fm-exp').setAttribute('aria-pressed', String(f === 'expected'));
    $('#fm-pot').setAttribute('aria-pressed', String(f === 'potential'));
    try { localStorage.setItem('reflexive-cba2-form', f); } catch (e) {}
    labelRails();
    if (cloudKey) openCloud(cloudKey);
  }
  $$('.lvl').forEach(b => b.addEventListener('click', () => { if (cloudKey === b.dataset.key) closeCloud(); else openCloud(b.dataset.key); }));
  $('#fm-exp').addEventListener('click', () => setForm('expected'));
  $('#fm-pot').addEventListener('click', () => setForm('potential'));
  $('#btn-whole').addEventListener('click', openWhole);
  ov.addEventListener('click', e => { if (e.target.closest('[data-close]')) closeCard(); });
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (!ov.hidden) closeCard();
    else if (cloudKey) { const k = cloudKey; closeCloud(); const b = document.querySelector('.lvl[data-key="' + k + '"]'); if (b) b.focus(); }
  });
  window.addEventListener('resize', () => { if (cloudKey) closeCloud(); });

  const tally = { c: 0, b: 0, a: 0 };
  function renderTally() {
    ['c', 'b', 'a'].forEach(k => { const el = $('#n-' + k); if (el) el.textContent = tally[k]; });
    const n = tally.c + tally.b + tally.a;
    const bar = $('#tbar');
    if (!bar) return;
    ['c', 'b', 'a'].forEach(k => { bar.querySelector('.s-' + k).style.width = (n ? tally[k] / n * 100 : 0) + '%'; });
    const out = $('#readout');
    if (!n) { out.textContent = 'Ask for a show of hands.'; return; }
    const val = i => (i < tally.c ? 0 : i < tally.c + tally.b ? 1 : 2);
    const m1 = val(Math.floor((n - 1) / 2)), m2 = val(Math.floor(n / 2));
    const names = ['C', 'B', 'A'];
    out.textContent = m1 === m2 ? 'Most of the room: ' + names[m1] : (m1 === 0 && m2 === 1 ? 'Phasing C → B' : m1 === 1 && m2 === 2 ? 'Phasing B → A' : 'Split between C and A');
  }
  function openRoom() {
    const row = (k, label) => '<div class="trow"><span class="tag tag-' + k + '">' + k.toUpperCase() + '</span><span class="tname">' + label + '</span>' +
      '<button class="step" type="button" data-t="' + k + '" data-d="-1" aria-label="One fewer in ' + k.toUpperCase() + '">−</button>' +
      '<span class="num" id="n-' + k + '">0</span>' +
      '<button class="step" type="button" data-t="' + k + '" data-d="1" aria-label="One more in ' + k.toUpperCase() + '">+</button></div>';
    const html = '<p class="lead">Ask, don’t tell: each person checks in themselves, then hands go up. Sparingly: at the start, at a turn, near the end.</p>' +
      '<ul class="checks">' +
      '<li><span class="lv">Social</span>If someone walked in now, what would they see?</li>' +
      '<li><span class="lv">Relational</span>Am I adding to what was said, or opposing it?</li>' +
      '<li><span class="lv">Psychological</span>Am I listening, or waiting to speak?</li></ul>' +
      '<div class="tally">' + row('c', 'Still in C') + row('b', 'Holding B') + row('a', 'Aligning, A') + '</div>' +
      '<p class="readout" id="readout" aria-live="polite">Ask for a show of hands.</p>' +
      '<div class="tbar" id="tbar" aria-hidden="true"><i class="s-c"></i><i class="s-b"></i><i class="s-a"></i></div>' +
      '<div class="row"><button class="btn" type="button" id="t-reset">Clear the count</button></div>';
    show('Where are we?', 'The room, right now', 'room', html);
    body.querySelectorAll('.step').forEach(b => b.addEventListener('click', () => {
      const k = b.dataset.t;
      tally[k] = Math.max(0, tally[k] + Number(b.dataset.d));
      renderTally();
    }));
    $('#t-reset').addEventListener('click', () => { tally.c = 0; tally.b = 0; tally.a = 0; renderTally(); });
    renderTally();
  }
  $('#btn-room').addEventListener('click', openRoom);

  const INS_KEY = 'reflexive-cba-insights';
  function openInsights() {
    const html = '<p class="lead">What can you see now that you could not see before? Note it in your own words.</p>' +
      '<label class="sr" for="ins">Your insights</label><textarea id="ins" placeholder="An insight, in your own words"></textarea>' +
      '<div class="row"><button class="btn" type="button" id="ins-time">Add the time</button><button class="btn" type="button" id="ins-copy">Copy</button><span class="note" id="ins-note">Kept in this browser only.</span></div>';
    show('Insights', 'What you can see now', 'insights', html);
    const ta = $('#ins');
    try { ta.value = localStorage.getItem(INS_KEY) || ''; } catch (e) {}
    let t = 0;
    const save = () => { try { localStorage.setItem(INS_KEY, ta.value); } catch (e) {} };
    ta.addEventListener('input', () => { clearTimeout(t); t = setTimeout(save, 300); });
    $('#ins-time').addEventListener('click', () => {
      const d = new Date();
      const hm = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
      ta.value += (ta.value && !ta.value.endsWith('\n') ? '\n' : '') + hm + ' · ';
      save();
      ta.focus();
      ta.setSelectionRange(ta.value.length, ta.value.length);
    });
    $('#ins-copy').addEventListener('click', () => {
      const note = $('#ins-note');
      const done = () => { note.textContent = 'Copied.'; };
      const fallback = () => { ta.focus(); ta.select(); note.textContent = 'Selected. Copy it with your keyboard.'; };
      try { navigator.clipboard.writeText(ta.value).then(done, fallback); } catch (e) { fallback(); }
    });
  }
  $('#btn-ins').addEventListener('click', openInsights);

  /* What is true: three truths, the question for today, the decision point, and each person's voice. */
  const VOICE_KEY = 'reflexive-cba-voices';
  let voices = [];
  try { const v = JSON.parse(localStorage.getItem(VOICE_KEY) || '[]'); if (Array.isArray(v)) voices = v.filter(x => x && typeof x.text === 'string'); } catch (e) {}
  const saveVoices = () => { try { localStorage.setItem(VOICE_KEY, JSON.stringify(voices)); } catch (e) {} };
  const SEED = { who: 'David', text: 'I’m 56, and this is it. There are people older and wiser, and younger and smarter, and here we are. I’ve built my life to get to this point: with children in classrooms, in tango and tai chi, in rooms without words. Doing it with adults is tricky, and this is my attempt. Not a sales pitch: salt, bringing a flavour. It’s real for me.' };
  function voiceEl(v, i) {
    const d = document.createElement('div');
    d.className = 'voice' + (i < 0 ? ' seed' : '');
    const who = document.createElement('span'); who.className = 'who'; who.textContent = v.who || 'A voice';
    const said = document.createElement('p'); said.className = 'said'; said.textContent = v.text;
    d.append(who, said);
    if (i >= 0) {
      const rm = document.createElement('button');
      rm.type = 'button'; rm.className = 'rm'; rm.textContent = '×';
      rm.setAttribute('aria-label', 'Remove this voice');
      rm.addEventListener('click', () => { voices.splice(i, 1); saveVoices(); renderVoices(); });
      d.appendChild(rm);
    }
    return d;
  }
  function renderVoices() {
    const box = $('#voices');
    if (!box) return;
    box.textContent = '';
    if (voices.length + 1 > 9) {
      const m = document.createElement('p'); m.className = 'many';
      m.textContent = (voices.length + 1) + ' voices, more than nine: time for a synthesis. On the beach, each voice is a mirror of one spine, and the tree folds them together.';
      box.appendChild(m);
    }
    box.appendChild(voiceEl(SEED, -1));
    voices.forEach((v, i) => box.appendChild(voiceEl(v, i)));
  }
  function openTrue() {
    const html =
      '<ol class="truths">' +
      '<li><span class="n">1</span><span class="tw">Physically embodied</span><span class="tl">One body, one life, a limited time. This is real, and we are present.</span></li>' +
      '<li><span class="n">2</span><span class="tw">Temporally immanent</span><span class="tl">The time is now, facing forward: towards what our children will live into.</span></li>' +
      '<li class="ours"><span class="n">3</span><span class="tw">Virtually immersed</span><span class="tl">In what we think, and who we take ourselves to be. This one depends on us.</span></li>' +
      '</ol>' +
      '<p class="given">The first two are true because they are true. The third depends on us.</p>' +
      '<p class="ask">What are we going to do about it today?</p>' +
      '<p class="wave">A wave is coming, and the boat has to point the right way, with all of us on it. Alone, we’re doomed. Together, we’re braver, and we have a chance.</p>' +
      '<div class="practice"><p class="pr-lab">The decision point</p>' +
      '<div class="pr-row"><span class="tag tag-b">B</span><span>Whether this is the meeting that matters is yours to decide: here, or later.</span></div>' +
      '<div class="pr-move"><span class="arrow" aria-hidden="true">↓</span><strong>Step in this direction, not sure where it leads.</strong></div>' +
      '<div class="pr-row"><span class="tag tag-a">A</span><span>Try it, live it, move forward: iterative social validation. Two of us, five, a hundred, a million, a billion.</span></div></div>' +
      '<button class="btn more" type="button" id="more" aria-expanded="false" aria-controls="detail">Read more</button>' +
      '<div class="detail" id="detail" hidden>' +
      '<p><strong>Physically embodied.</strong> Not a talk show and not a thought experiment: this is real, we are present, and we are facing it, each with a limited amount of life to live. It is the one thing LLMs do not have yet, though the robots are coming.</p>' +
      '<p><strong>Temporally immanent.</strong> The time is now. Not yesterday or tomorrow, not what people said last year or built ten years ago, not the organisations made for us, not what we hope or pray for. Oriented to the future rather than the past. Look at the direction of travel, in AI, in overconsumption, in the environment: that is the wave.</p>' +
      '<p><strong>Virtually immersed.</strong> We are immersed in what we think and identify with: ideas, religions, who we thought we were and who we will be. Enough alignment among them is the clarity an LLM can help bring. It may evaporate, so keep looking: check the waves now and then, and turn towards them. Aligned, we become part of something big. Done well, we have a chance.</p>' +
      '<p>Here and now: the time is now, and the location is here. Fulcrum named each person’s end-point temporally immanent, physically embodied and socially immersed (Volume 0); virtual immersion is the addition for the age of AI.</p>' +
      '</div>' +
      '<p class="pr-lab voices-head">Voices · each of us has our own</p>' +
      '<div class="voices" id="voices" aria-live="polite"></div>' +
      '<label class="sr" for="v-who">Your name</label><input class="field" id="v-who" type="text" autocomplete="off" placeholder="Your name (optional)">' +
      '<label class="sr" for="v-text">Your voice</label><textarea class="field" id="v-text" placeholder="What is true for you, here and now? What will you do about it today?"></textarea>' +
      '<div class="row"><button class="btn" type="button" id="v-add">Add your voice</button><span class="note">Kept on this device. Up to nine are read as they are; past nine, a synthesis.</span></div>';
    show('What is true', 'Here and now', 'true', html);
    $('#more').addEventListener('click', () => {
      const d = $('#detail'), m = $('#more');
      d.hidden = !d.hidden;
      m.setAttribute('aria-expanded', String(!d.hidden));
      m.textContent = d.hidden ? 'Read more' : 'Show less';
    });
    renderVoices();
    $('#v-add').addEventListener('click', () => {
      const t = $('#v-text').value.trim();
      if (!t) { $('#v-text').focus(); return; }
      voices.push({ who: $('#v-who').value.trim().slice(0, 40), text: t.slice(0, 1200), at: Date.now() });
      saveVoices();
      $('#v-text').value = ''; $('#v-who').value = '';
      renderVoices();
    });
  }
  $('#btn-true').addEventListener('click', openTrue);

  /* ---------- start ---------- */
  readColors();
  try {
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    if (mq.addEventListener) mq.addEventListener('change', readColors); else if (mq.addListener) mq.addListener(readColors);
  } catch (e) {}
  new MutationObserver(readColors).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme', 'class', 'style'] });
  let savedForm = 'expected';
  try { const f = localStorage.getItem('reflexive-cba2-form'); if (f === 'potential') savedForm = f; } catch (e) {}
  setForm(savedForm);
  resize();
  if ('ResizeObserver' in window) new ResizeObserver(resize).observe(stage);
  else window.addEventListener('resize', resize);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { computeFree(); });
  addPerson((FREE.x0 + FREE.x1) / 2, (FREE.y0 + FREE.y1) / 2);
  people.forEach(p => { p.alpha = 1; });
  syncPsySet();
  if (paused) setPaused(true);
  updateText();
  requestAnimationFrame(frame);
})();
</script>

</body></html>
