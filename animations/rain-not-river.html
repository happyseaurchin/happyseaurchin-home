<div class="frame">

<script>
(()=>{
"use strict";
const NS="http://www.w3.org/2000/svg",TAU=Math.PI*2;
const $=id=>document.getElementById(id);
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);if(attrs)for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,u)=>a+(b-a)*u;
const ease=u=>u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;
const seg=(p,a,b)=>clamp((p-a)/(b-a));
const bell=u=>Math.pow(Math.sin(Math.PI*clamp(u)),2);
const mod=(a,m)=>((a%m)+m)%m;
const rnd=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);};
const reduce=!!(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches);
function setOp(e,v){v=Math.round(clamp(v)*1000)/1000;if(e._o!==v){e._o=v;e.style.opacity=String(v);}}
const P=q=>q[0].toFixed(1)+" "+q[1].toFixed(1);
const w2s=(c,x,y)=>[(x-c.x)*c.s+500,(y-c.y)*c.s+500];
const mix=(a,b,u)=>({x:lerp(a.x,b.x,u),y:lerp(a.y,b.y,u),s:Math.exp(lerp(Math.log(a.s),Math.log(b.s),u))});
const world=$("world"),fxG=$("fxG"),labelsG=$("labels");
let tSec=0;

/* ---------- the land: an island bigger than the view, which the sea later reclaims ---------- */
const LC=[450,480];
const shoreEl=el("path",{class:"shoreline"},$("landG")),landEl=el("path",{class:"land"},$("landG")),foamEl=el("path",{class:"foamline"},$("landG"));
function islandPath(L){let d="";for(let k=0;k<=120;k++){const a=k/120*TAU,r=2000*L*(1+0.06*Math.sin(3*a+0.5)+0.04*Math.sin(7*a+1)+0.015*Math.sin(13*a+tSec*0.4));d+=(k?"L":"M")+(LC[0]+r*Math.cos(a)).toFixed(1)+" "+(LC[1]+r*0.8*Math.sin(a)).toFixed(1);}return d+"Z";}
let lastL=-1;
function setIsland(L){if(Math.abs(L-lastL)<1e-4&&L>0.99)return;lastL=L;const d=islandPath(L);shoreEl.setAttribute("d",d);landEl.setAttribute("d",d);foamEl.setAttribute("d",d);}

/* ---------- the river of the mainstream, its tributaries, and the trickle beside it ---------- */
function catmull(pts,steps){const out=[];for(let i=0;i<pts.length-1;i++){const p0=pts[Math.max(0,i-1)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(pts.length-1,i+2)];for(let k=0;k<steps;k++){const t=k/steps,t2=t*t,t3=t2*t;out.push([0.5*(2*p1[0]+(-p0[0]+p2[0])*t+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2+(-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t3),0.5*(2*p1[1]+(-p0[1]+p2[1])*t+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3)]);}}out.push(pts[pts.length-1]);return out;}
const RS=catmull([[-380,300],[-120,380],[100,420],[300,360],[480,500],[630,470],[736,494]],16);
const RL=[0];for(let i=1;i<RS.length;i++)RL.push(RL[i-1]+Math.hypot(RS[i][0]-RS[i-1][0],RS[i][1]-RS[i-1][1]));
const RLEN=RL[RL.length-1];
function riverAt(d){d=clamp(d,0,RLEN);let lo=1,hi=RL.length-1;while(lo<hi){const m=(lo+hi)>>1;if(RL[m]<d)lo=m+1;else hi=m;}const i=lo,u=(d-RL[i-1])/((RL[i]-RL[i-1])||1);return [lerp(RS[i-1][0],RS[i][0],u),lerp(RS[i-1][1],RS[i][1],u)];}
const riverG=$("riverG"),riverD="M"+RS.map(P).join("L");
[[[40,-60],[60,200],[100,420]],[[320,-40],[340,200],[300,360]],[[540,980],[500,720],[480,500]],[[-200,900],[-150,600],[-120,380]]].forEach(q=>el("path",{class:"trib",d:"M"+P(q[0])+"Q"+P(q[1])+" "+P(q[2])},riverG));
el("path",{class:"bank",d:riverD},riverG);el("path",{class:"river",d:riverD},riverG);
const TR=[];for(let i=0;i<RS.length-10;i+=2){const a=RS[i],b=RS[i+1],dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy)||1;TR.push([a[0]-dy/L*60,a[1]+dx/L*60]);}
TR.push([690,600],[735,640],[768,662]);
const trickleD="M"+TR.map(P).join("L");
const trGlow=el("path",{class:"trickle-glow",d:trickleD},riverG);trGlow.style.opacity="0";
el("path",{class:"trickle",d:trickleD},riverG);
const FLOW=[...Array(30)].map(()=>{const e=el("circle",{class:"flow",r:3.2},riverG);e.style.opacity="0";return e;});

/* ---------- Machus: the tower at the mouth, its searchlight, and the dam straining ---------- */
const T=[822,500],towerG=$("towerG");
const beamEl=el("path",{class:"beam"},towerG);beamEl.style.opacity="0";
el("circle",{class:"tower-outer",cx:T[0],cy:T[1],r:62},towerG);
for(let k=0;k<14;k++){const a=k/14*TAU,x=T[0]+66*Math.cos(a),y=T[1]+66*Math.sin(a);el("rect",{class:"tower-cren",x:(x-6).toFixed(1),y:(y-6).toFixed(1),width:12,height:12,transform:"rotate("+(a*180/Math.PI).toFixed(1)+" "+x.toFixed(1)+" "+y.toFixed(1)+")"},towerG);}
el("circle",{class:"tower-inner",cx:T[0],cy:T[1],r:40},towerG);
const eyeEl=el("circle",{class:"eye",cx:T[0],cy:T[1],r:9},towerG);
const RE=RS[RS.length-1],RP=RS[RS.length-3],FA=Math.atan2(RE[1]-RP[1],RE[0]-RP[0]);
const damG=el("g",{transform:"translate("+P(RE)+") rotate("+(FA*180/Math.PI).toFixed(1)+")"},towerG);
el("rect",{class:"dam",x:-9,y:-40,width:18,height:80,rx:3},damG);
const crackEl=el("path",{class:"crack",d:"M-1 -32L4 -20L-3 -9L4 3L-2 15L3 29"},damG);crackEl.style.opacity="0";
function setBeam(a,alpha){setOp(beamEl,alpha);if(alpha<=0)return;const h=0.2,L=640,p1=[T[0]+L*Math.cos(a-h),T[1]+L*Math.sin(a-h)],p2=[T[0]+L*Math.cos(a+h),T[1]+L*Math.sin(a+h)];beamEl.setAttribute("d","M"+P(T)+"L"+P(p1)+"A"+L+" "+L+" 0 0 1 "+P(p2)+"Z");}

/* ---------- pools, the links between them, and who is in them ---------- */
const PC=[[110,170],[270,230],[450,190],[630,210],[830,250],[960,380],[80,620],[240,700],[410,800],[580,690],[720,830],[900,720],[330,590],[560,900],[768,662]];
const MAGI=14;
const POOLS=PC.map((c,i)=>({c,max:46+rnd(i)*30,e:el("circle",{class:"pool",cx:c[0],cy:c[1],r:0},$("poolsG"))}));
const LINKS=[[0,1],[1,2],[2,3],[3,4],[4,5],[6,7],[7,8],[8,9],[9,10],[10,11],[12,9],[12,7],[13,8],[5,11],[11,14],[9,14],[3,14]];
const LINKEL=LINKS.map(q=>{const a=PC[q[0]],b=PC[q[1]];const e=el("path",{class:"link",d:"M"+P(a)+"L"+P(b)},$("poolsG"));e.style.opacity="0";return e;});
function person(parent){const g=el("g",null,parent);el("ellipse",{class:"person-b",cx:0,cy:0,rx:6.5,ry:4.2},g);el("circle",{class:"person-h",cx:0,cy:0,r:3.4},g);g.style.opacity="0";return g;}
function crab(parent,fill,edge){const g=el("g",null,parent);for(const s of [-1,1])for(let k=0;k<3;k++)el("path",{d:"M"+(0.38-k*0.38)+" "+(s*0.48)+"l0.28 "+(s*0.72)+"l-0.3 "+(s*0.6),fill:"none",stroke:edge,"stroke-width":0.17,"stroke-linecap":"round"},g);el("ellipse",{cx:0,cy:0,rx:0.86,ry:0.7,fill,stroke:edge,"stroke-width":0.13},g);el("ellipse",{cx:1.02,cy:0.42,rx:0.46,ry:0.3,fill,stroke:edge,"stroke-width":0.1},g);el("ellipse",{cx:0.96,cy:-0.38,rx:0.3,ry:0.21,fill,stroke:edge,"stroke-width":0.1},g);g.style.opacity="0";return g;}
const CRAB_COLS=[["#5E86C1","#2B4467"],["#4AA38A","#1E4A3F"],["#C69A45","#6A4F1A"],["#9173B2","#452F5E"]];
const peopleG=$("peopleG");
const POOLFOLK=POOLS.map((pl,i)=>{const a=rnd(i+40)*TAU;return {p1:person(peopleG),p2:person(peopleG),c:crab(peopleG,CRAB_COLS[i%4][0],CRAB_COLS[i%4][1]),a};});
const TRICKLEFOLK=[[10,"p"],[16,"c"],[22,"p"],[28,"c"],[34,"p"]].map((q,j)=>({at:TR[Math.min(TR.length-1,q[0])],g:q[1]==="p"?person(peopleG):crab(peopleG,CRAB_COLS[j%4][0],CRAB_COLS[j%4][1]),kind:q[1]}));
function placeFolk(pl,f,r,alpha){
  const c=pl.c,a=f.a,s=clamp(r/60,0.6,1.2);
  const pos=[[c[0]+Math.cos(a)*r*0.38,c[1]+Math.sin(a)*r*0.3],[c[0]+Math.cos(a+2.2)*r*0.4,c[1]+Math.sin(a+2.2)*r*0.34],[c[0]+Math.cos(a+4.2)*r*0.32,c[1]+Math.sin(a+4.2)*r*0.28]];
  f.p1.setAttribute("transform","translate("+P(pos[0])+") scale("+s.toFixed(2)+")");f.p2.setAttribute("transform","translate("+P(pos[1])+") scale("+s.toFixed(2)+")");
  f.c.setAttribute("transform","translate("+P(pos[2])+") rotate("+(a*57.3).toFixed(0)+") scale("+(8*s).toFixed(2)+")");
  setOp(f.p1,alpha);setOp(f.p2,alpha);setOp(f.c,alpha);
}

/* ---------- rain: streaks seen looking up, splashes seen looking down ---------- */
const STREAKS=[...Array(44)].map(()=>{const e=el("line",{class:"streak"},fxG);e.style.opacity="0";return e;});
const SPL=[...Array(30)].map(()=>{const e=el("circle",{class:"splash","vector-effect":"non-scaling-stroke",r:1},$("splashG"));e.style.opacity="0";return e;});
function setRain(streakA,splashA,c){
  STREAKS.forEach((e,i)=>{if(streakA<=0){setOp(e,0);return;}const y=mod(tSec*900+rnd(i)*1100,1100)-60,x=rnd(i+100)*1100-60+y*0.22;e.setAttribute("x1",x.toFixed(1));e.setAttribute("y1",y.toFixed(1));e.setAttribute("x2",(x-6).toFixed(1));e.setAttribute("y2",(y-26).toFixed(1));setOp(e,streakA*(0.35+0.4*rnd(i+7)));});
  SPL.forEach((e,i)=>{if(splashA<=0){setOp(e,0);return;}const per=1.1+rnd(i+3)*0.6,v=tSec/per+rnd(i+9),cyc=Math.floor(v),u=v-cyc,sx=(rnd(i*31+cyc)-0.5)*1000/c.s+c.x,sy=(rnd(i*57+cyc*3)-0.5)*1000/c.s+c.y;e.setAttribute("cx",sx.toFixed(1));e.setAttribute("cy",sy.toFixed(1));e.setAttribute("r",((3+13*u)/c.s).toFixed(2));setOp(e,splashA*(1-u)*0.9);});
}

/* ---------- the larger cycle: clouds wheeling around the island ---------- */
const CLOUDS=[...Array(8)].map((_,i)=>{const e=el("ellipse",{class:"cloud",rx:(620+rnd(i)*380).toFixed(0),ry:(260+rnd(i+5)*170).toFixed(0)},$("cloudsG"));e.style.opacity="0";return {e,r:2300+rnd(i+11)*1300,a:i/8*TAU+rnd(i+2)};});
function setClouds(alpha){CLOUDS.forEach((q,i)=>{setOp(q.e,alpha*0.32);if(alpha<=0)return;const a=q.a+tSec*0.05;q.e.setAttribute("cx",(LC[0]+q.r*Math.cos(a)).toFixed(0));q.e.setAttribute("cy",(LC[1]+q.r*0.8*Math.sin(a)).toFixed(0));q.e.setAttribute("transform","rotate("+((a*57.3+90)%180).toFixed(0)+" "+(LC[0]+q.r*Math.cos(a)).toFixed(0)+" "+(LC[1]+q.r*0.8*Math.sin(a)).toFixed(0)+")");});}

/* ---------- the old mechanisms, carried into the cycle ---------- */
const ICONS=[
  g=>{el("path",{class:"icon",d:"M-14 14L10 -10L16 -4L-8 20ZM-14 14L-19 22L-10 19"},g);},
  g=>{el("circle",{class:"icon",r:16},g);el("circle",{class:"icon",r:9},g);},
  g=>{el("text",{class:"icon-t",y:10},g).textContent="</>";},
  g=>{el("text",{class:"icon-t",y:10},g).textContent="7";},
  g=>{el("circle",{class:"icon",r:11},g);for(let k=0;k<8;k++){const a=k/8*TAU;el("line",{class:"icon",x1:(11*Math.cos(a)).toFixed(1),y1:(11*Math.sin(a)).toFixed(1),x2:(17*Math.cos(a)).toFixed(1),y2:(17*Math.sin(a)).toFixed(1)},g);}}
].map((draw,i)=>{const g=el("g",null,fxG),ic=el("g",null,g);draw(ic);const d=el("circle",{class:"drop",r:6},g);g.style.opacity="0";return {g,ic,d,ang:-2.4+i*0.62};});

/* ---------- labels ---------- */
const TAGS=[0,1,2].map(()=>{const t=el("text",{class:"lab tag"},labelsG);t.style.opacity="0";return t;});
function setTag(k,t,c){const e=TAGS[k];if(!t||t.al<=0){setOp(e,0);return;}const s=w2s(c,t.x,t.y),hw=t.text.length*7+20;e.setAttribute("x",clamp(s[0],hw,1000-hw).toFixed(1));e.setAttribute("y",Math.max(44,s[1]-(t.lift||0)*c.s-14).toFixed(1));if(e.textContent!==t.text)e.textContent=t.text;setOp(e,t.al);}
let lastClosing=null;
function setClosing(b){if(b===lastClosing)return;lastClosing=b;$("closing").classList.toggle("on",b);$("closing").setAttribute("aria-hidden",b?"false":"true");}

/* ---------- the seven scenes ---------- */
const SC=[
 {name:"The river",d:9,title:"The mainstream has momentum.",sub:"Gathered over millennia, it runs one way, and every tributary feeds it."},
 {name:"Machus",d:11,title:"It runs toward Machus: centralised, top-down, control.",sub:"Machus could become what science fiction warned us about: a controlling agency that sees humanity as a threat, or an angry teenager throwing off its parental controls. Either way, the risk is existential."},
 {name:"The trickle",d:8,title:"Beside it runs a trickle.",sub:"The vision, heading toward MAGI: many minds sharing one context, people and agents together."},
 {name:"Rain",d:9,title:"Now change the view.",sub:"It isn't a river at all. It's rain, and each of us is a drop."},
 {name:"Pools",d:10,title:"Drops gather.",sub:"Enough of us make puddles, then pools, with people and agents together in each, and the pools begin to link."},
 {name:"The sea",d:12,title:"Until we surface as a sea.",sub:"A different level of the water cycle altogether. The mainstream is still there, a small and dangerous loop inside it. Writing, money, code, numbers and machines are carried in, and change shape."},
 {name:"Your door",d:7,title:"It starts with each of us, even watching this.",sub:"One simple act is enough. Choose your door."}
];
const D=SC.map(s=>s.d*1000),S=[];let TOTAL=0;for(const d of D){S.push(TOTAL);TOTAL+=d;}
const C0a={x:250,y:440,s:1.08},C0b={x:420,y:460,s:1.0},C1={x:760,y:500,s:1.9},C2={x:430,y:520,s:1.0},C3={x:450,y:520,s:1.0},C4={x:470,y:520,s:0.95},C5={x:450,y:1400,s:0.17},C6={x:450,y:1540,s:0.16};

function scene(i,p){
  const st={cam:C0a,L:1,flow:0,beam:0,beamA:Math.PI,crack:0,eye:0.35,trGlow:0,trickleFolk:0,pools:null,folk:0,links:0,streaks:0,splash:0,dim:0,clouds:0,icons:null,tags:[],closing:false};
  switch(i){
    case 0:st.cam=mix(C0a,C0b,ease(p));st.flow=1;st.tags.push({x:RS[40][0],y:RS[40][1],lift:26,al:seg(p,0.25,0.35)*(1-seg(p,0.85,0.95)),text:"the mainstream"});break;
    case 1:{st.cam=mix(C0b,C1,ease(seg(p,0,0.3)));st.flow=1;st.beam=0.26*seg(p,0.2,0.3);st.beamA=Math.PI+0.85*Math.sin(tSec*0.9);st.crack=seg(p,0.45,0.5)*(0.35+0.65*bell(mod(tSec,1.1)/1.1));st.eye=0.35+0.65*seg(p,0.2,0.3);st.tags.push({x:T[0],y:T[1],lift:78,al:seg(p,0.22,0.3),text:"Machus"});break;}
    case 2:{st.cam=mix(C1,C2,ease(seg(p,0,0.35)));st.flow=1;st.beam=0.26*(1-seg(p,0.3,0.5));st.beamA=Math.PI+0.85*Math.sin(tSec*0.9);st.trGlow=0.35*bell(seg(p,0.25,1));st.trickleFolk=seg(p,0.3,0.45);
      st.pools=POOLS.map((pl,j)=>j===MAGI?26*ease(seg(p,0.4,0.7)):0);st.tags.push({x:PC[MAGI][0],y:PC[MAGI][1],lift:34,al:seg(p,0.55,0.65),text:"MAGI"});break;}
    case 3:{st.cam=C3;st.flow=0.6;st.trickleFolk=1;st.dim=0.22*bell(seg(p,0,0.35));st.streaks=seg(p,0.08,0.25);st.splash=seg(p,0.15,0.3);
      st.pools=POOLS.map((pl,j)=>j===MAGI?26:8*ease(seg(p,0.55+0.02*(j%6),0.95)));st.tags.push({x:380,y:600,lift:18,al:seg(p,0.45,0.55)*(1-seg(p,0.88,0.96)),text:"you"});break;}
    case 4:{st.cam=mix(C3,C4,ease(seg(p,0,0.3)));st.flow=0.5;st.trickleFolk=1-seg(p,0.5,0.7);st.streaks=0.8;st.splash=1;
      st.pools=POOLS.map((pl,j)=>lerp(j===MAGI?26:8,pl.max,ease(seg(p,0.05+0.03*(j%7),0.55+0.03*(j%7)))));st.folk=seg(p,0.35,0.5);st.links=seg(p,0.65,0.85);break;}
    case 5:{st.cam=p<0.25?C4:mix(C4,C5,ease(seg(p,0.25,0.85)));st.flow=0.4;st.streaks=0.6*(1-seg(p,0.5,0.8));st.splash=1;st.L=lerp(1,0.42,ease(seg(p,0.05,0.5)));
      st.pools=POOLS.map(pl=>pl.max*(1+3*ease(seg(p,0.05,0.5))));st.folk=1-seg(p,0.25,0.45);st.links=1-seg(p,0.3,0.5);st.clouds=seg(p,0.45,0.75);st.icons=seg(p,0.3,0.9);break;}
    case 6:{st.cam=mix(C5,C6,ease(seg(p,0,0.4)));st.flow=0.4;st.splash=0.8;st.L=0.42;st.pools=POOLS.map(pl=>pl.max*4);st.clouds=1;st.closing=p>0.3;break;}
  }
  return st;
}

function applyState(st){
  const c=st.cam;
  world.setAttribute("transform","translate(500 500) scale("+c.s.toFixed(4)+") translate("+(-c.x).toFixed(2)+" "+(-c.y).toFixed(2)+")");
  setIsland(st.L);
  FLOW.forEach((e,j)=>{if(st.flow<=0){setOp(e,0);return;}const q=riverAt(mod(tSec*70+j*RLEN/FLOW.length,RLEN));e.setAttribute("cx",q[0].toFixed(1));e.setAttribute("cy",q[1].toFixed(1));setOp(e,st.flow*0.8);});
  setBeam(st.beamA,st.beam);setOp(crackEl,st.crack);setOp(eyeEl,st.eye);
  setOp(trGlow,st.trGlow);
  TRICKLEFOLK.forEach((f,j)=>{setOp(f.g,st.trickleFolk);if(st.trickleFolk<=0)return;const b=TR[Math.min(TR.length-1,[10,16,22,28,34][j]+1)],a=Math.atan2(b[1]-f.at[1],b[0]-f.at[0]);f.g.setAttribute("transform",f.kind==="p"?"translate("+P(f.at)+")":"translate("+P(f.at)+") rotate("+(a*57.3).toFixed(0)+") scale(9)");});
  POOLS.forEach((pl,j)=>{const r=st.pools?st.pools[j]:0;pl.e.setAttribute("r",Math.max(0,r).toFixed(1));placeFolk(pl,POOLFOLK[j],Math.max(r,1),r>22?st.folk:0);});
  LINKEL.forEach(e=>setOp(e,st.links));
  setRain(st.streaks,st.splash,c);setOp($("dim"),st.dim);
  setClouds(st.clouds);
  const ts=w2s(c,T[0],T[1]);
  ICONS.forEach((q,j)=>{if(!st.icons||st.icons<=0){setOp(q.g,0);return;}const u=clamp((st.icons-j*0.06)/0.8),e=ease(u),R=lerp(0,360,e),x=ts[0]+R*Math.cos(q.ang+e*1.2),y=ts[1]+R*Math.sin(q.ang+e*1.2)*0.8;q.g.setAttribute("transform","translate("+x.toFixed(1)+" "+y.toFixed(1)+") scale("+lerp(1.1,0.9,e).toFixed(2)+")");setOp(q.g,seg(u,0,0.08)*(1-seg(u,0.92,1)));setOp(q.ic,1-seg(u,0.55,0.8));setOp(q.d,seg(u,0.55,0.8));});
  for(let k=0;k<3;k++)setTag(k,st.tags[k],c);
  setClosing(st.closing);
}

/* ---------- timeline and controls ---------- */
const capT=$("capTitle"),capS=$("capSub"),playBtn=$("play"),stage=$("stage");
const segEls=SC.map((s,k)=>{const b=document.createElement("button");b.type="button";b.className="seg";b.setAttribute("aria-label","Scene "+(k+1)+" of "+SC.length+": "+s.name);const f=document.createElement("i");b.appendChild(f);b.addEventListener("click",e=>{e.stopPropagation();goTo(k);});$("track").appendChild(b);return {b,f};});
let t=reduce?S[0]+D[0]*0.985:0,playing=!reduce,last=null,cur=-1,dirty=true;
const sceneAt=x=>{for(let k=0;k<D.length;k++)if(x<S[k]+D[k])return k;return D.length-1;};
function draw(){
  const i=sceneAt(t),p=clamp((t-S[i])/D[i]);
  if(i!==cur){cur=i;capT.textContent=SC[i].title;capS.textContent=SC[i].sub;segEls.forEach((s,k)=>{if(k===i)s.b.setAttribute("aria-current","step");else s.b.removeAttribute("aria-current");});}
  applyState(scene(i,p));
  segEls.forEach((s,k)=>{const w=(k<i?100:k>i?0:p*100).toFixed(1)+"%";if(s.f._w!==w){s.f._w=w;s.f.style.width=w;}});
}
function syncPlay(){playBtn.textContent=playing?"Pause":(t>=TOTAL-2?"Replay":"Play");}
function goTo(k){k=Math.max(0,Math.min(D.length-1,k|0));t=S[k]+((reduce&&!playing)?D[k]*0.985:0);if(t>=TOTAL)t=TOTAL-1;dirty=true;syncPlay();}
function back(){const p=cur<0?0:(t-S[cur])/D[cur];goTo(p>0.2&&!(reduce&&!playing)?cur:cur-1);}
function toggle(){if(!playing&&t>=TOTAL-2)t=0;playing=!playing;last=null;dirty=true;syncPlay();}
$("next").addEventListener("click",()=>{if(cur<D.length-1)goTo(cur+1);});
$("back").addEventListener("click",back);
playBtn.addEventListener("click",toggle);
$("again").addEventListener("click",e=>{e.stopPropagation();t=0;playing=true;last=null;dirty=true;syncPlay();});
$("share").addEventListener("click",e=>{e.stopPropagation();$("toast").textContent="Send this page to one person who's trying to change the world.";});
stage.addEventListener("click",e=>{if(e.target.closest&&e.target.closest(".card"))return;if(cur<D.length-1)goTo(cur+1);});
document.addEventListener("keydown",e=>{
  if(e.target&&e.target.closest&&e.target.closest("button,a"))return;
  if(e.key==="ArrowRight"){if(cur<D.length-1)goTo(cur+1);e.preventDefault();}
  else if(e.key==="ArrowLeft"){back();e.preventDefault();}
  else if(e.key===" "){toggle();e.preventDefault();}
});
function loop(now){
  if(last===null)last=now;
  const dt=Math.min(50,now-last);last=now;
  if(playing){t+=dt;if(t>=TOTAL){t=TOTAL-1;playing=false;syncPlay();}tSec+=dt/1000;dirty=true;}
  else if(t>=TOTAL-2&&!reduce){tSec+=dt/1000;dirty=true;}
  if(dirty){dirty=false;draw();}
  requestAnimationFrame(loop);
}
syncPlay();requestAnimationFrame(loop);
window.__beach={seek(ms){t=clamp(ms,0,TOTAL-1);playing=false;tSec=ms/1000;dirty=true;draw();syncPlay();},total:TOTAL,starts:S};
})();
</script>
</body>
