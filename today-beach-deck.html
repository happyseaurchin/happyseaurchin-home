<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Today's deck</title>
<meta name="description" content="A personal deck of cards, flicked one at a time. The deck is whatever you are holding — add one, put one down, close one, and the day's work writes itself.">
<meta property="og:title" content="Today's deck">
<meta property="og:description" content="A personal deck of cards, flicked one at a time. The deck is whatever you are holding.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Space+Mono:wght@400;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme.css">
<script src="/theme.js"></script>
<style>
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{
    font-family:var(--body); color:var(--foam); font-size:18px; line-height:1.55;
    background:radial-gradient(1100px 560px at 70% -10%, rgba(var(--liquid-rgb),0.10), transparent 60%),
      linear-gradient(180deg,var(--ground-top) 0%, var(--deep) 30%, var(--abyss) 100%);
    background-attachment:fixed; -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:contain;
    display:flex; flex-direction:column; min-height:100dvh;
  }
  ::selection{background:rgba(var(--liquid-rgb),0.30);color:var(--foam)}
  a{color:var(--liquid);text-decoration:none;border-bottom:1px solid rgba(var(--liquid-rgb),0.35)}
  a:hover{color:var(--foam);border-color:var(--foam)}
  .hidden{display:none !important}

  .bar{display:flex;align-items:center;gap:10px;padding:14px 18px 10px;font-family:var(--mono);font-size:12px;letter-spacing:0.08em;color:var(--vapour-dim)}
  .bar .dot{width:6px;height:6px;border-radius:50%;background:var(--liquid);box-shadow:0 0 10px var(--liquid);flex:none}
  .bar .who{color:var(--foam);font-weight:700}
  .bar .spacer{flex:1}
  .bar button{background:none;border:1px solid var(--line);border-radius:4px;color:var(--vapour-dim);font-family:var(--mono);font-size:12px;padding:6px 10px;cursor:pointer}
  .bar button:hover{color:var(--foam);border-color:var(--line-strong)}

  .wrap{flex:1;display:flex;flex-direction:column;padding:10px 22px 40px;max-width:720px;margin:0 auto;width:100%}
  h1{font-family:var(--display);font-size:clamp(26px,5vw,38px);line-height:1.12;margin:18px 0 6px;font-weight:800}
  .lede{color:var(--vapour);margin:0 0 26px}

  /* ── the card ── */
  .card{
    border:1px solid var(--line);border-radius:10px;padding:26px 24px;margin:8px 0 18px;
    background:rgba(var(--liquid-rgb),0.05);min-height:180px;display:flex;flex-direction:column;justify-content:center;
  }
  .card .body{font-size:clamp(19px,2.6vw,23px);line-height:1.45}
  .card .state{font-family:var(--mono);font-size:11px;letter-spacing:0.12em;margin-bottom:12px;color:var(--vapour-dim)}
  .card .state.doing{color:var(--liquid)} .card .state.done{color:var(--solid)}
  .card .state.tomorrow,.card .state.drop{color:var(--vapour-dim)}
  .card .addr{font-family:var(--mono);font-size:11px;color:var(--vapour-dim);margin-top:16px}

  .acts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px}
  .acts button{
    font-family:var(--mono);font-size:12px;letter-spacing:0.06em;padding:9px 13px;border-radius:5px;cursor:pointer;
    background:none;border:1px solid var(--line);color:var(--vapour);
  }
  .acts button:hover{color:var(--foam);border-color:var(--line-strong)}
  .acts button.primary{border-color:rgba(var(--solid-rgb),0.5);color:var(--solid);font-weight:700}
  .acts button.flick{border-color:rgba(var(--liquid-rgb),0.5);color:var(--liquid);font-weight:700}

  .add{margin:12px 0 30px}
  .add textarea{
    width:100%;min-height:76px;padding:12px;border-radius:6px;resize:vertical;
    background:rgba(0,0,0,0.22);border:1px solid var(--line);color:var(--foam);font-family:var(--body);font-size:16px;line-height:1.5;
  }
  .add textarea:focus{outline:none;border-color:var(--line-strong)}

  .roster{margin:0;padding:0;list-style:none}
  .roster li{padding:12px 0;border-top:1px solid var(--line)}
  .roster .n{font-family:var(--mono);font-size:12px;color:var(--vapour-dim)}

  .strip{font-family:var(--mono);font-size:12px;color:var(--vapour-dim);min-height:20px;margin-bottom:14px}
  .strip.bad{color:var(--ember,#e88)}
  .strip.good{color:var(--solid)}
  .note{color:var(--vapour-dim);font-size:15px}
  .quiet{color:var(--vapour-dim)}
  input[type=text]{
    padding:11px 12px;border-radius:6px;background:rgba(0,0,0,0.22);border:1px solid var(--line);
    color:var(--foam);font-family:var(--mono);font-size:15px;width:100%;max-width:320px;
  }
</style>
</head>
<body>

<div class="bar">
  <span class="dot"></span>
  <span id="bar-field">today-beach-deck</span>
  <span class="who" id="bar-who"></span>
  <span class="spacer"></span>
  <span id="bar-count" class="quiet"></span>
</div>

<div class="wrap">

  <!-- no handle: the template and the decks that exist -->
  <section id="view-open" class="hidden">
    <h1 id="open-title">Today's deck</h1>
    <p class="lede" id="open-lede"></p>
    <div id="open-template"></div>
    <h1 style="font-size:22px;margin-top:34px">Decks being held</h1>
    <ul class="roster" id="open-roster"></ul>
    <p class="note" style="margin-top:26px">
      To keep your own: put your name in and it opens empty — the first card you add makes it.
    </p>
    <p><input id="open-handle" type="text" placeholder="your name" autocapitalize="none" autocomplete="off" spellcheck="false"></p>
    <p><button class="flick" id="open-go" style="font-family:var(--mono);font-size:13px;padding:10px 16px;border-radius:5px;background:none;border:1px solid rgba(var(--liquid-rgb),0.5);color:var(--liquid);cursor:pointer">open my deck</button></p>
  </section>

  <!-- a handle: the deck itself -->
  <section id="view-deck" class="hidden">
    <div class="strip" id="strip"></div>
    <div class="card" id="card">
      <div class="state" id="card-state"></div>
      <div class="body" id="card-body"></div>
      <div class="addr" id="card-addr"></div>
    </div>
    <div class="acts">
      <button class="flick" id="a-flick">next card →</button>
      <button id="a-doing">doing</button>
      <button class="primary" id="a-done">done</button>
      <button id="a-tomorrow">tomorrow</button>
      <button id="a-drop">put down</button>
      <button id="a-edit">edit</button>
    </div>
    <div class="add">
      <p class="quiet" style="font-family:var(--mono);font-size:12px;letter-spacing:0.08em;margin:0 0 8px">ADD A CARD</p>
      <textarea id="add-text" placeholder="one thing you can pick up and put down inside a day"></textarea>
      <p><button class="flick" id="a-add" style="font-family:var(--mono);font-size:12px;padding:9px 13px;border-radius:5px;background:none;border:1px solid rgba(var(--liquid-rgb),0.5);color:var(--liquid);cursor:pointer">add to my deck</button></p>
    </div>
    <p class="note" id="deck-foot"></p>
  </section>

  <section id="view-load"><p class="quiet">reading the beach…</p></section>
</div>

<script>
(function(){
'use strict';

const BEACH = 'https://beach.happyseaurchin.com/.well-known/pscale-beach';
const FIELD = (new URLSearchParams(location.search).get('field') || 'today-beach-deck').replace(/[^a-z0-9-]/gi,'');
const SPINE = 'spine:' + FIELD;
const VENTURE = (new URLSearchParams(location.search).get('venture') || 'beach-venture').replace(/[^a-z0-9-]/gi,'');

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ── handle from /today-beach-deck/<handle> or ?h= ── */
function handleFromUrl(){
  const q = new URLSearchParams(location.search).get('h');
  if (q) return q.trim();
  const m = location.pathname.match(/\/today-beach-deck\/([^\/]+)\/?$/);
  if (m) return decodeURIComponent(m[1]).trim();
  return null;
}
let HANDLE = null;

/* ── tiny beach client (same wire as /next) ── */
async function readBlock(name){
  const r = await fetch(BEACH + '?block=' + encodeURIComponent(name), { headers:{Accept:'application/json'}, cache:'no-store' });
  if (r.status === 404) return null;
  if (!r.ok) throw new Error('beach read failed: ' + r.status);
  return r.json();
}
async function readIndex(){
  const r = await fetch(BEACH, { headers:{Accept:'application/json'}, cache:'no-store' });
  if (!r.ok) throw new Error('beach index failed: ' + r.status);
  return r.json();
}
async function writeBlock(body){
  const r = await fetch(BEACH, { method:'POST', cache:'no-store',
    headers:{'Content-Type':'application/json', Accept:'application/json'},
    body: JSON.stringify(body) });
  let d = null; try { d = await r.json(); } catch(e){}
  return { ok: r.ok, status: r.status, data: d };
}
const lockRequired = w => !w.ok && w.data && (w.data.code === 'lock_required' || w.data.error === 'lock_required');

/* ── the edit-latch, kept on this device only ── */
const latchKey = () => 'deck-latch:' + FIELD + ':' + HANDLE;
function latch(){ try { return localStorage.getItem(latchKey()) || null; } catch(e){ return null; } }
function setLatch(v){ try { v ? localStorage.setItem(latchKey(), v) : localStorage.removeItem(latchKey()); } catch(e){} }

/* ── the temporal address, computed and never asked for.
   Ten rungs, the same arithmetic the substrate stamps every read with:
   millennium · century · decade · year · season · month · week · day ·
   gathering · beat. The DAY rung is the first eight, zero-padded — and
   zeroes are the floor-width padding the parser strips, so it round-trips. ── */
function dayRung(d){
  const y = d.getUTCFullYear(), mo = d.getUTCMonth(), dom = d.getUTCDate();
  const digits = [
    Math.floor(y/1000)%10, Math.floor(y/100)%10, Math.floor(y/10)%10, y%10,
    Math.floor(mo/3)+1, (mo%3)+1,
    Math.floor((dom-1)/7)+1, ((dom-1)%7)+1,
  ];
  return digits.join('') + '00';
}

/* ── pscale ── */
function floorOf(block){
  let n = 0, node = block;
  while (node && typeof node === 'object' && ('_' in node)) { node = node['_']; n += 1; }
  return n;
}
function voiceOf(node){
  if (typeof node === 'string') return node.trim() === '' ? null : node;
  if (node && typeof node === 'object' && typeof node['_'] === 'string' && node['_'].trim() !== '') return node['_'];
  return null;
}
/** A card's leading word is its state; everything after is the record. */
const STATES = ['DOING','DONE','TOMORROW','DROP'];
function stateOf(text){
  const w = (text || '').trim().split(/\s+/)[0] || '';
  return STATES.includes(w.toUpperCase()) ? w.toUpperCase() : null;
}
function bodyOf(text){
  const s = stateOf(text);
  if (!s) return (text || '').trim();
  return (text || '').trim().slice(s.length).replace(/^[\s—–-]+/, '');
}

/* ── state ── */
let CARDS = [];      // {addr, text, state}
let IDX = 0;
let MIRROR = null;
let MIRROR_FLOOR = 1;

function say(msg, kind){
  const el = $('strip');
  el.className = 'strip' + (kind ? ' ' + kind : '');
  el.textContent = msg || '';
}

/* ── load ── */
async function loadDeck(){
  const name = FIELD + ':' + HANDLE;
  const block = await readBlock(name);
  MIRROR = block;
  MIRROR_FLOOR = block ? floorOf(block) : 1;
  CARDS = [];
  if (block){
    Object.keys(block).filter(k => /^[1-9]$/.test(k)).sort().forEach(k => {
      const t = voiceOf(block[k]);
      if (t) CARDS.push({ addr: k.padEnd(MIRROR_FLOOR, '0'), text: t, state: stateOf(t) });
    });
  }
  // A deck shows what is being held: closed and put-down cards leave the flick,
  // and tomorrow's hide until tomorrow. They stay in the mirror — nothing is
  // deleted, because silence is the holder's act and never the page's.
  const live = CARDS.filter(c => c.state !== 'DONE' && c.state !== 'DROP' && c.state !== 'TOMORROW');
  const closed = CARDS.length - live.length;
  CARDS = live.length ? live : CARDS;
  IDX = 0;
  $('bar-count').textContent = live.length + ' held' + (closed ? ' · ' + closed + ' closed' : '');
  $('deck-foot').innerHTML = live.length
    ? 'A card closed here lands in your <a href="/tree/' + esc(VENTURE) + '">' + esc(VENTURE) + '</a> reading at today’s rung — the day writes itself.'
    : 'Nothing is being held. Add a card and it becomes the deck.';
  render();
}

function render(){
  if (!CARDS.length){
    $('card-state').textContent = '';
    $('card-body').innerHTML = '<span class="quiet">An empty deck. Add the first card below.</span>';
    $('card-addr').textContent = '';
    return;
  }
  const c = CARDS[IDX % CARDS.length];
  $('card-state').textContent = c.state || 'HELD';
  $('card-state').className = 'state ' + (c.state ? c.state.toLowerCase() : '');
  $('card-body').textContent = bodyOf(c.text);
  $('card-addr').textContent = FIELD + ':' + HANDLE + ' · ' + c.addr + '  (' + ((IDX % CARDS.length) + 1) + ' of ' + CARDS.length + ')';
}

/* ── writes ── */
async function writeCard(addr, content){
  const name = FIELD + ':' + HANDLE;
  // The mirror is born on the first card — nobody creates it by hand.
  if (!MIRROR){
    // ASK BEFORE BIRTH, never default. A deck born with no latch is open for
    // anyone to rewrite or, worse, to lock out from under its holder — and a
    // holder who was never asked has not chosen that, they have simply not
    // been told. So the choice is put once, in plain words, with leaving it
    // open a real answer rather than what happens when nobody speaks.
    if (!latch()){
      const v = prompt(
        'This opens ' + name + " — your deck, public to read like everything here.\n\n"
        + 'Set a word only you know and it stays yours to edit, on this device.\n'
        + 'Leave it empty and anyone can edit it.'
      );
      if (v === null) { say('not opened', 'bad'); return false; }
      if (v.trim()) setLatch(v.trim());
    }
    const born = 'MIRROR — ' + HANDLE + "'s own deck on the " + FIELD + ' template (' + SPINE + '). '
      + 'Sovereign: these are the cards being held right now, nobody else writes here, and silence at an address '
      + 'means the card was put down rather than lost.';
    const w0 = await writeBlock({ block: name, content: { _: born }, new_lock: latch() || undefined });
    if (!w0.ok && !lockRequired(w0)) { say('could not open your deck: ' + (w0.data && w0.data.error || w0.status), 'bad'); return false; }
    MIRROR = await readBlock(name);
    MIRROR_FLOOR = MIRROR ? floorOf(MIRROR) : 1;
  }
  let body = { block: name, spindle: addr, content };
  let w = await writeBlock(Object.assign({}, body, latch() ? { secret: latch() } : {}));
  if (lockRequired(w)){
    const v = prompt(name + ' is latched — enter the edit-latch (kept on this device):');
    if (!v) { say('not written', 'bad'); return false; }
    setLatch(v.trim());
    w = await writeBlock(Object.assign({}, body, { secret: v.trim() }));
  }
  if (!w.ok){ say('refused: ' + (w.data && (w.data.error || w.data.code) || w.status), 'bad'); return false; }
  return true;
}

/** THE BOND. A closed card lands as a reading in the holder's venture mirror at
 *  today's rung — computed from the clock, never typed. The rung accumulates,
 *  so a day of flicking becomes what this person did today without a second act.
 *  One direction only: the card knows the venture, the venture knows no decks. */
async function feedVenture(cardText){
  const name = VENTURE + ':' + HANDLE;
  const block = await readBlock(name).catch(() => null);
  if (!block) return null;  // no venture mirror — the deck still works alone
  const fl = floorOf(block);
  const addr = dayRung(new Date()).slice(0, Math.max(fl, 1)).padEnd(fl, '0');
  let node = block, ok = true;
  for (const ch of addr.replace(/0+$/, '')){ const k = ch === '0' ? '_' : ch;
    if (node && typeof node === 'object' && k in node) node = node[k]; else { ok = false; break; } }
  const prior = ok ? voiceOf(node) : null;
  const line = bodyOf(cardText);
  const next = prior ? prior + '\n· ' + line : '· ' + line;
  const w = await writeBlock(Object.assign({ block: name, spindle: addr, content: next }, latch() ? { secret: latch() } : {}));
  return w.ok ? addr : null;
}

async function mark(state){
  if (!CARDS.length) return;
  const c = CARDS[IDX % CARDS.length];
  const stamp = state === 'DONE' ? ' ' + new Date().toISOString().slice(0,16).replace('T',' ') + 'Z' : '';
  const next = state + stamp + ' — ' + bodyOf(c.text);
  say('writing…');
  if (!await writeCard(c.addr, next)) return;
  let fed = null;
  if (state === 'DONE') fed = await feedVenture(c.text);
  say(state === 'DONE'
    ? (fed ? 'closed — and landed in your ' + VENTURE + ' reading at ' + fed : 'closed')
    : 'marked ' + state.toLowerCase(), 'good');
  await loadDeck();
}

async function addCard(){
  const t = $('add-text').value.trim();
  if (!t) { say('nothing to add', 'bad'); return; }
  const used = new Set((MIRROR ? Object.keys(MIRROR) : []).filter(k => /^[1-9]$/.test(k)));
  let slot = null;
  for (let i = 1; i <= 9; i++) if (!used.has(String(i))) { slot = String(i); break; }
  if (!slot){ say('nine cards is a full hand — close one before adding another', 'bad'); return; }
  say('adding…');
  if (!await writeCard(slot.padEnd(MIRROR_FLOOR, '0'), t)) return;
  $('add-text').value = '';
  say('added', 'good');
  await loadDeck();
}

async function editCard(){
  if (!CARDS.length) return;
  const c = CARDS[IDX % CARDS.length];
  const v = prompt('Rewrite this card (empty puts it down and leaves the address silent):', bodyOf(c.text));
  if (v === null) return;
  say('writing…');
  if (!await writeCard(c.addr, v.trim())) return;
  say(v.trim() ? 'rewritten' : 'put down', 'good');
  await loadDeck();
}

/* ── the open view: the template, and the decks that exist ── */
async function loadOpen(){
  const [spine, index] = await Promise.all([readBlock(SPINE).catch(()=>null), readIndex().catch(()=>null)]);
  $('open-title').textContent = FIELD;
  $('open-lede').textContent = spine ? (voiceOf(spine) || '') : (FIELD + ' has no template at this beach yet.');
  const parts = [];
  if (spine) Object.keys(spine).filter(k => /^[1-9]$/.test(k)).sort().forEach(k => {
    const t = voiceOf(spine[k]); if (t) parts.push('<p class="note">' + esc(t) + '</p>');
  });
  $('open-template').innerHTML = parts.join('');
  const names = ((index && index.blocks) || []).filter(b => b.startsWith(FIELD + ':'));
  $('open-roster').innerHTML = names.length
    ? names.map(n => { const h = n.slice(FIELD.length + 1);
        return '<li><a href="/today-beach-deck/' + encodeURIComponent(h) + '">' + esc(h) + '</a> <span class="n">' + esc(n) + '</span></li>'; }).join('')
    : '<li class="quiet">Nobody is holding one yet.</li>';
}

/* ── boot ── */
async function boot(){
  HANDLE = handleFromUrl();
  $('bar-field').textContent = FIELD;
  try {
    if (HANDLE){
      $('bar-who').textContent = HANDLE;
      $('view-load').classList.add('hidden');
      $('view-deck').classList.remove('hidden');
      await loadDeck();
    } else {
      $('view-load').classList.add('hidden');
      $('view-open').classList.remove('hidden');
      await loadOpen();
    }
  } catch(e){
    $('view-load').classList.remove('hidden');
    $('view-load').innerHTML = '<p class="quiet">' + esc(e.message || String(e)) + '</p>';
  }
}

$('a-flick').addEventListener('click', () => { if (CARDS.length){ IDX = (IDX + 1) % CARDS.length; render(); say(''); } });
$('a-doing').addEventListener('click', () => mark('DOING'));
$('a-done').addEventListener('click', () => mark('DONE'));
$('a-tomorrow').addEventListener('click', () => mark('TOMORROW'));
$('a-drop').addEventListener('click', () => mark('DROP'));
$('a-edit').addEventListener('click', editCard);
$('a-add').addEventListener('click', addCard);
$('open-go').addEventListener('click', () => {
  const h = $('open-handle').value.trim();
  if (h) location.href = '/today-beach-deck/' + encodeURIComponent(h);
});
$('open-handle').addEventListener('keydown', e => { if (e.key === 'Enter') $('open-go').click(); });

boot();
})();
</script>
</body>
</html>
