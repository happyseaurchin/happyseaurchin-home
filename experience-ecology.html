<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Experience ecology — the transparencies</title>
<meta name="description" content="Four layers of experience laid one over another like transparencies — SALT, Open Business, Silo Buster and the beach. Show one to focus; show them all to see the whole ecology.">
<meta property="og:title" content="Experience ecology — the transparencies">
<meta property="og:description" content="Four layers of experience, laid one over another like transparencies. Show one to focus; show them all to see the whole ecology.">
<link rel="icon" href="/assets/torus.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Space+Mono:wght@400;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme.css">
<script src="/theme.js"></script>
<style>
  /* THE FOUR LAYERS KEEP THEIR OWN COLOURS, each set here in both registers (theme.css:
     no colour that works in only one); the beach's is the site's own liquid. Every other
     colour is the site's. A sheet's tint is thinner on paper than on the dark ground. */
  :root{
    --salt:#ff8a62; --open:#a3cc58; --silo:#9298ff; --beach:var(--liquid);
    --plane:.11; --lift:rgba(0,0,0,.55);
    --panel:var(--card);
  }
  :root[data-theme="light"]{
    --salt:#c94e2b; --open:#587a1b; --silo:#3a3fa6;
    --plane:.075; --lift:rgba(var(--wash-rgb),.18);
  }
  @supports (color: color-mix(in srgb, red, blue)){
    :root{ --panel:color-mix(in srgb, var(--card) 60%, var(--deep)) }
  }

  *{box-sizing:border-box} html,body{margin:0}
  body{
    font-family:var(--body); color:var(--foam); font-size:17px; line-height:1.5;
    background:radial-gradient(1100px 560px at 70% -10%, rgba(var(--liquid-rgb),0.10), transparent 60%),
      linear-gradient(180deg,var(--ground-top) 0%, var(--deep) 30%, var(--abyss) 100%);
    -webkit-font-smoothing:antialiased; min-height:100dvh;
  }
  ::selection{background:rgba(var(--liquid-rgb),0.30);color:var(--foam)}
  a{color:var(--liquid);text-decoration:none;border-bottom:1px solid rgba(var(--liquid-rgb),0.35)}
  a:hover{color:var(--foam);border-color:var(--foam)}
  button{font-family:var(--mono);cursor:pointer}
  button:focus-visible,a:focus-visible{outline:2px solid var(--liquid);outline-offset:2px}

  /* the bar every page shares — as /experiences, /now and /walk have it */
  .bar{position:sticky;top:0;z-index:10;background:rgba(var(--well-rgb),0.72);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:10px;padding:12px 18px;
    font-family:var(--mono);font-size:12px;letter-spacing:0.08em;color:var(--vapour-dim)}
  .bar .dot{width:6px;height:6px;border-radius:50%;background:var(--liquid);box-shadow:0 0 10px var(--liquid);flex:none}
  .bar b{color:var(--foam)}
  .bar a{border-bottom:none;color:var(--vapour-dim)} .bar a:hover{color:var(--liquid)}
  .bar .spacer{flex:1}
  .bar .ttl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  @media (max-width:560px){ .bar .ttl .more{display:none} }
  .bar button{background:none;border:1px solid var(--line);border-radius:4px;color:var(--vapour-dim);font-family:var(--mono);font-size:12px;padding:6px 10px}
  .bar button:hover{color:var(--foam);border-color:var(--line-strong)}

  .wrap{max-width:1280px;margin:0 auto;padding:16px 20px 32px}
  .top{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 14px}
  h1{font-family:var(--display);font-weight:800;font-size:clamp(1.8rem,5.4vw,2.6rem);line-height:1.05;margin:0;text-wrap:balance}
  h1 .cool{color:var(--liquid)}
  .draft{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.14em;color:var(--vapour-dim);border:1px solid var(--line-strong);border-radius:999px;padding:2px 9px}
  .sub{margin:8px 0 0;color:var(--vapour);font-size:1.05rem;max-width:64ch}

  .controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-top:16px}
  .layers{display:flex;flex-wrap:wrap;gap:8px}
  .chip{display:inline-flex;align-items:center;gap:9px;font-family:var(--mono);font-size:12px;letter-spacing:.04em;
    color:var(--foam);background:rgba(var(--wash-rgb),.05);border:1px solid var(--line-strong);border-radius:999px;padding:7px 14px 7px 10px}
  .chip .sw{width:14px;height:10px;border-radius:2px;background:var(--c);transform:skewX(-18deg);box-shadow:0 0 0 1.5px var(--c)}
  .chip[aria-pressed="false"]{background:transparent;color:var(--vapour-dim)}
  .chip[aria-pressed="false"] .sw{background:transparent}
  .lift{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;letter-spacing:.04em;color:var(--vapour);
    background:transparent;border:1px dashed var(--vapour-dim);border-radius:999px;padding:7px 14px 7px 11px}
  .lift svg{width:20px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linejoin:round}
  .lift:disabled{opacity:.4;cursor:default}
  .chip:hover,.lift:not(:disabled):hover{border-color:var(--foam)}

  .stage{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:24px;margin-top:16px;align-items:start}
  .map-wrap{min-width:0;display:flex;justify-content:center}
  #map{display:block;touch-action:manipulation;-webkit-tap-highlight-color:transparent;max-width:100%}
  /* sticky beneath the bar, which is sticky too */
  .panel{background:var(--panel);border:1px solid var(--line-strong);border-radius:14px;padding:18px 18px 20px;
    position:sticky;top:calc(env(safe-area-inset-top,0px) + 68px);max-height:calc(100vh - 86px);overflow:auto;min-width:0}
  @media (max-width:860px){
    .stage{grid-template-columns:minmax(0,1fr);gap:16px}
    .panel{position:static;max-height:none}
    /* an opened experience rises as a sheet from the foot, under the bar so the go menu still opens over it */
    .panel.sheet{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:9;border-radius:18px 18px 0 0;border-bottom:0;
      max-height:52vh;padding:16px 18px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 34px var(--lift)}
    body.sheet-open .wrap{padding-bottom:54vh}
  }

  /* the sheets — names wear a halo of the ground so a line under them never cuts a word */
  #map text{font-family:var(--body)}
  #map .plane{stroke-opacity:.55;stroke-linejoin:round}
  #map .tab{stroke:none}
  #map .tabtext{fill:var(--abyss);font-family:var(--mono);font-weight:700;letter-spacing:.04em}
  #map .road{fill:none;stroke-linecap:round;opacity:.62}
  #map .road.dim{opacity:.14}
  #map .thread{fill:none;stroke:var(--vapour-dim);stroke-linecap:round}
  #map .thread.on{stroke:var(--foam)}
  #map .blade{fill:var(--silo)}
  #map .sroad{fill:none;stroke:var(--foam);stroke-linecap:round}
  #map .arrow{fill:var(--foam)}
  #map .node{cursor:pointer;outline:none}
  #map .node .hit{fill:transparent}
  #map .node:focus-visible .hit{stroke:var(--foam);stroke-dasharray:3 3}
  #map .selring,#map .twinring{fill:none;stroke:var(--foam)}
  #map .lbl{fill:var(--vapour);font-weight:500;paint-order:stroke;stroke:var(--deep);stroke-linejoin:round;cursor:pointer}
  #map .lbl.sel{fill:var(--foam);font-weight:600}
  #map .empty{fill:var(--vapour-dim);font-style:italic}
  #map .dim{opacity:.24}

  /* the legend */
  .legend .hint{margin:0 0 16px;color:var(--vapour);font-size:16px}
  .ll{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:14px}
  .ll li{display:flex;gap:12px;align-items:flex-start}
  .ll li.off{opacity:.5}
  .lsw{flex:none;width:16px;height:11px;margin-top:6px;border-radius:2px;background:var(--c);transform:skewX(-18deg)}
  .lt{font-family:var(--display);font-weight:700;font-size:15px;color:var(--foam)}
  .ltag{font-family:var(--body);font-weight:400;font-style:italic;color:var(--vapour-dim);font-size:16px}
  .ll p{margin:2px 0 0;font-size:15px;color:var(--vapour)}
  .fine{margin:18px 0 0;padding-top:14px;border-top:1px solid var(--line);font-size:14px;color:var(--vapour-dim)}

  /* the card */
  .card-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .cardtab{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
    color:var(--abyss);background:var(--c);border-radius:6px 6px 2px 2px;padding:4px 10px}
  .close{flex:none;width:38px;height:38px;border-radius:50%;border:1px solid var(--line-strong);background:transparent;color:var(--vapour);display:grid;place-items:center}
  .close:hover{color:var(--foam);border-color:var(--foam)}
  .close svg{width:15px;height:15px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round}
  .card-head{display:flex;gap:14px;align-items:center;margin-top:14px}
  .glyph{flex:none;width:52px;height:52px;border-radius:13px;display:grid;place-items:center;color:var(--c);
    background:rgba(var(--wash-rgb),.06);background:color-mix(in srgb,var(--c) 14%,var(--panel))}
  .glyph svg{width:29px;height:29px}
  .glyph svg,.wglyph svg{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .card h2{font-family:var(--display);font-weight:700;font-size:1.55rem;line-height:1.08;margin:0;text-wrap:balance;min-width:0}
  .status{display:inline-block;margin-top:10px;font-family:var(--mono);font-size:11px;color:var(--vapour);border:1px dashed var(--vapour-dim);border-radius:999px;padding:1px 9px}
  .card p.line{margin:12px 0 10px;font-size:17px;max-width:60ch}
  .go{display:inline;font-family:var(--mono);font-size:12.5px;overflow-wrap:anywhere}
  .nolink{font-size:15px;color:var(--vapour-dim);font-style:italic}

  .ways{margin:2px 0 4px;display:flex;flex-direction:column;gap:10px}
  .sect-h{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--vapour-dim);margin-bottom:7px;display:flex;align-items:center;gap:8px}
  .way{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center}
  .wname{display:inline-flex;align-items:center;gap:9px;font-family:var(--body);font-size:16px;color:var(--foam);background:none;border:0;padding:0;text-align:left}
  .wname:hover{color:var(--liquid)}
  .wglyph{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--beach);
    background:rgba(var(--wash-rgb),.06);background:color-mix(in srgb,var(--beach) 14%,var(--panel))}
  .wglyph svg{width:18px;height:18px}
  .wlink{font-family:var(--mono);font-size:12px}
  .prompt{grid-column:1 / -1;display:flex;flex-direction:column;gap:7px;margin-left:37px}
  .prompt q{font-family:var(--body);font-style:italic;font-size:16.5px;line-height:1.35;color:var(--foam)}
  .copy{align-self:flex-start;font-size:11.5px;padding:4px 11px;border-radius:999px;border:1px solid var(--line-strong);background:transparent;color:var(--vapour)}
  .copy:hover{color:var(--foam);border-color:var(--foam)}

  .sections{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:14px}
  .rkey{width:28px;height:8px;flex:none}
  .rkey path{stroke:var(--foam);stroke-width:1.6;fill:none}
  .rkey .k-in{stroke-dasharray:4 3}
  .rkey .k-head{fill:var(--foam);stroke:none}
  .rkey .k-thread{stroke:var(--vapour);stroke-dasharray:1.5 3;stroke-linecap:round}
  .rchips{display:flex;flex-wrap:wrap;gap:6px}
  .rchip,.showlayer{display:inline-flex;align-items:center;gap:7px;font-family:var(--body);font-size:15px;color:var(--foam);
    background:transparent;border:1px solid var(--line-strong);border-radius:999px;padding:4px 11px 4px 9px}
  .rchip:hover,.showlayer:hover{border-color:var(--foam)}
  .rchip .cdot{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
  .rchip .cl{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--vapour-dim)}
  .showlayer{border-style:dashed;color:var(--vapour)}
  .showlayer .sw{width:13px;height:9px;border-radius:2px;transform:skewX(-18deg);box-shadow:inset 0 0 0 1.5px var(--c)}
  .chip:focus-visible,.lift:focus-visible,.rchip:focus-visible,.close:focus-visible,.wname:focus-visible,.copy:focus-visible,.showlayer:focus-visible{outline:2px solid var(--liquid);outline-offset:2px}
</style>
</head>
<body>
<script>document.documentElement.classList.remove('no-js');</script>

<div class="bar">
  <span class="dot"></span>
  <span class="ttl"><b>experience ecology</b><span class="more"> · the transparencies</span></span>
  <span class="spacer"></span>
  <button id="btn-theme" title="light or dark">◐</button>
</div>

<div class="wrap">
  <header class="top">
    <h1>Experience <span class="cool">transparencies</span></h1>
    <span class="draft">Draft</span>
  </header>
  <p class="sub">Four layers of experience, laid one over another like transparencies. Show one to focus; show them all to see the whole ecology.</p>
  <div class="controls">
    <div class="layers" id="layers" role="group" aria-label="Layers"></div>
    <button class="lift" id="lift" type="button" aria-pressed="true">
      <svg viewBox="0 0 20 16" aria-hidden="true"><path d="M4 2h14l-2 4H2z"/><path d="M4 10h14l-2 4H2z"/></svg>
      <span>Lay flat</span>
    </button>
  </div>
  <main class="stage">
    <div class="map-wrap" id="wrap"><svg id="map" role="group" aria-label="Layers of experience"></svg></div>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </main>
  <noscript><p class="sub">The layers are drawn by script, so with it off there is nothing here to see.</p></noscript>
</div>

<!--
  THE CONTENT — the dots and their descriptions, and the one place to change them: the
  drawing below reads this and needs no change when it does. (David, 2026-10-11, handing
  over the draft: "I will be modifying the actual dots and descriptions. It is just the
  principle of it that matters.")

  One entry per layer, top of the stack first, up to nine experiences each.
  An experience names its spot. Experiences in different layers that name the same spot
  are the same experience understood differently, and sit directly under one another.
  "to" lists where an experience leads, "from" where people come from (by spot).
  Silo Buster's "edge" draws its steps as one straight blade.

  An experience carries a name ("short" is the name on the map when the full one is long),
  a line, and a link — or a "status" such as "to be made" where there is no page yet.
  "ways" gives the three portals' own ways in (pages, mirror, connect), each a link or a
  prompt to copy. "bend" bows the line to a spot ({"<spot>": 0.2}) when it would cross a dot.
  "spots" places each spot on a 1000 × 1000 sheet, with its icon (a name from ICONS below;
  a name it does not know draws a plain dot).
-->

    });

  }

  const key = (l, s) => l + '|' + s;
  const visible = () => LAYERS.filter(l => state.on.has(l.id));
  const firstVisibleHaving = spot => { for (const l of visible()) if (ITEM[key(l.id, spot)]) return l.id; return null; };

  const R0 = 6.5;
  // names are measured to place them, in the site's own faces (theme.css --body, --mono)
  const rootCS = getComputedStyle(document.documentElement);
  const FACE = {

  };
  const meas = document.createElement('canvas').getContext('2d');
  const widthCache = {};

  }
  const barH = () => { const b = document.querySelector('.bar'); return b ? b.getBoundingClientRect().height : 0; };

  function params(wide) {

  }

  }

  function frame() {
    const wrapW = Math.max(280, wrap.clientWidth);

    const shown = LAYERS.filter(l => cur.alpha[l.id] > 0.01);
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    (shown.length ? shown : [LAYERS[0]]).forEach(l => {

      });

    const maxH = wide ? Math.max(380, window.innerHeight - 200 - barH()) : Infinity;
    const scale = Math.min((wrapW - padL - padR) / bw, (maxH - padT - padB) / bh);

    // threads: the same experience on different sheets
    if (s > 0.05) {
      Object.keys(HAS).forEach(spot => {
        const ks = shown.filter(l => pos[key(l.id, spot)] && state.on.has(l.id)).map(l => key(l.id, spot));
        if (ks.length < 2) return;
        const on = sel && sel.s === spot;
        for (let i = 0; i < ks.length - 1; i++) {
          const a = pos[ks[i]], b = pos[ks[i + 1]];
          out += '<path class="thread' + (on ? ' on' : '') + (sel && !on ? ' dim' : '') + '" d="M' + f1(a[0]) + ' ' + f1(a[1]) + 'L' + f1(b[0]) + ' ' + f1(b[1]) + '" style="stroke-width:' + f1((on ? 1.8 : 1.3) * k) + 'px;stroke-dasharray:' + f1(1.2 * k) + ' ' + f1(4 * k) + ';opacity:' + f1(Math.min(1, s * 1.4) * (on ? 1 : 0.8)) + '"/>';
        }
      });
    }

    // the open experience's lines in and out
    if (sel) {
      const both = new Set();
      selRoads.forEach(x => { const other = x.fk === selK ? x.tk : x.fk; if (selRoads.some(y => y !== x && (y.fk === other && y.tk === selK) && x.fk === selK)) both.add(other); });
      selRoads.forEach(x => {
        const other = x.fk === selK ? x.tk : x.fk;
        if (both.has(other) && x.tk === selK) return;
        const A = pos[x.fk], B = pos[x.tk]; if (!A || !B) return;
        const two = both.has(other), isIn = x.tk === selK && !two, rr = R0 * k;
        const g = line(A, B, x.r.bend && !x.r.cross ? x.r.bend : 0, two ? rr + 8 * k : 0, rr + 8 * k);
        out += '<path class="sroad" d="' + g.d + '" style="stroke-width:' + f1(2 * k) + 'px' + (isIn ? ';stroke-dasharray:' + f1(5 * k) + ' ' + f1(4 * k) : '') + '"/>';
        out += arrow(B[0], B[1], g.ex, g.ey, rr, k);
        if (two) out += arrow(A[0], A[1], -g.sx, -g.sy, rr, k);
      });
    }

    // experiences
    const labels = [];
    shown.forEach(l => {
      const a = op(l), live = state.on.has(l.id);
      l.items.forEach(it => {
        const kk = key(l.id, it.spot), p = pos[kk]; if (!p) return;
        const isSel = kk === selK, dim = sel && !isSel && !linked.has(kk);
        const R = R0 * k;
        let g = '';
        if (isSel) g += '<circle class="selring" cx="' + f1(p[0]) + '" cy="' + f1(p[1]) + '" r="' + f1(R + 5.5 * k) + '" style="stroke-width:' + f1(1.8 * k) + 'px"/>';
        if (twins.has(kk)) g += '<circle class="twinring" cx="' + f1(p[0]) + '" cy="' + f1(p[1]) + '" r="' + f1(R + 5 * k) + '" style="stroke-width:' + f1(1.3 * k) + 'px;stroke-dasharray:' + f1(2 * k) + ' ' + f1(2.2 * k) + '"/>';
        g += '<circle cx="' + f1(p[0]) + '" cy="' + f1(p[1]) + '" r="' + f1(R) + '" style="fill:var(--' + l.id + ');stroke:var(--deep);stroke-width:' + f1(1.6 * k) + 'px"/>';
        if (live) g += '<circle class="hit" cx="' + f1(p[0]) + '" cy="' + f1(p[1]) + '" r="' + f1(19 * k) + '"/>';
        out += '<g class="node' + (dim ? ' dim' : '') + '"' + (live ? ' data-key="' + kk + '" tabindex="0" role="button" aria-label="' + esc(it.name + ', ' + l.name) + '"' : '') + ' style="' + (a < 1 ? 'opacity:' + f1(a) + ';' : '') + (live ? '' : 'pointer-events:none') + '">' + g + '</g>';
        if (!live || a < 0.6) return;
        // laid flat, only the top experience of a stack carries a name
        const top = firstVisibleHaving(it.spot) === l.id;
        if (s < 0.5 && !top && !isSel) return;
        labels.push({ kk, p, text: it.short || it.name, pri: isSel ? 100 : linked.has(kk) ? 50 : 20 - cur.slot[l.id], dim });
      });
    });
    out += placeLabels(labels, Object.keys(pos).filter(x => state.on.has(x.split('|')[0])).map(x => pos[x]), F, fs, k);
    svg.innerHTML = out;
  }

  // names go where they fit; a name that fits nowhere waits until its experience is opened
  function placeLabels(list, dots, F, fs, k) {
    const [vx, vy, vw, vh] = F.vb, boxes = [], gap = 5 * k, R = R0 * k + 2 * k, px = fs / k;
    const clear = b => b[0] >= vx && b[2] <= vx + vw && b[1] >= vy && b[3] <= vy + vh
      && !boxes.some(o => b[0] < o[2] && b[2] > o[0] && b[1] < o[3] && b[3] > o[1]);
    const freeOfDots = (b, own) => !dots.some(d => d !== own && d[0] + R > b[0] && d[0] - R < b[2] && d[1] + R > b[1] && d[1] - R < b[3]);
    let svgOut = '';
    list.sort((a, b) => b.pri - a.pri).forEach(n => {
      const w = textW(n.text, px, n.pri >= 100 ? 600 : 500, 'body') * k, h = fs, [x, y] = n.p;
      const cands = [
        { b: [x + R + gap, y - h * 0.62, x + R + gap + w, y + h * 0.42], tx: x + R + gap, ty: y + h * 0.35, a: 'start' },
        { b: [x - R - gap - w, y - h * 0.62, x - R - gap, y + h * 0.42], tx: x - R - gap, ty: y + h * 0.35, a: 'end' },
        { b: [x - w / 2, y + R + gap * 0.6, x + w / 2, y + R + gap * 0.6 + h], tx: x, ty: y + R + gap * 0.6 + h * 0.8, a: 'middle' },
        { b: [x - w / 2, y - R - gap * 0.6 - h, x + w / 2, y - R - gap * 0.6], tx: x, ty: y - R - gap * 0.6 - h * 0.2, a: 'middle' }
      ];
      let pick = cands.find(c => clear(c.b) && freeOfDots(c.b, n.p));
      if (!pick && n.pri >= 50) pick = cands.find(c => clear(c.b)) || cands[0];
      if (!pick) return;
      boxes.push(pick.b);
      svgOut += '<text class="lbl' + (n.pri >= 100 ? ' sel' : '') + (n.dim ? ' dim' : '') + '" data-key="' + n.kk + '" text-anchor="' + pick.a + '" x="' + f1(pick.tx) + '" y="' + f1(pick.ty) + '" style="font-size:' + f1(fs) + 'px;stroke-width:' + f1(3.2 * k) + 'px">' + esc(n.text) + '</text>';
    });
    return svgOut;
  }

  // ---------- motion ----------
  let raf = 0, t0 = 0, from = null;
  function animate() {
    cancelAnimationFrame(raf);
    from = { s: cur.s, slot: Object.assign({}, cur.slot), alpha: Object.assign({}, cur.alpha) };
    t0 = performance.now();
    const dur = reduceMotion ? 0 : 620;
    const step = now => {
      const t = dur ? Math.min(1, (now - t0) / dur) : 1;
      const e = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      cur.s = from.s + (tgt.s - from.s) * e;
      LAYERS.forEach(l => {
        cur.slot[l.id] = from.slot[l.id] + (tgt.slot[l.id] - from.slot[l.id]) * e;
        cur.alpha[l.id] = from.alpha[l.id] + (tgt.alpha[l.id] - from.alpha[l.id]) * e;
      });
      render();
      if (t < 1) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
  }

  // ---------- the card ----------
  const panel = document.getElementById('panel');
  const narrowMQ = window.matchMedia('(max-width: 860px)');
  function pretty(u) {
    try { const x = new URL(u); return x.host.replace(/^www\./, '') + x.pathname.replace(/\/$/, '') + x.search + x.hash; }
    catch (e) { return u; }
  }
  function legendHTML() {
    const rows = LAYERS.map(l =>
      '<li class="' + (state.on.has(l.id) ? '' : 'off') + '" style="--c:var(--' + l.id + ')"><span class="lsw"></span><div>' +
      '<div class="lt">' + esc(l.name) + (l.tag ? ' <span class="ltag">' + esc(l.tag) + '</span>' : '') + '</div>' +
      '<p>' + esc(l.line) + '</p></div></li>').join('');
    return '<div class="legend"><p class="hint">Each layer holds up to nine experiences. Where layers share an experience it sits directly under itself, read differently by each; dotted threads join it through the stack.</p>' +
      '<ul class="ll">' + rows + '</ul>' +
      '<p class="fine">Open an experience for its card and its links. A hidden layer shows nothing. Names, places and links are provisional.</p></div>';
  }
  function chip(k2) {
    const [lid, spot] = k2.split('|');
    return '<button class="rchip" data-go="' + k2 + '" style="--c:var(--' + lid + ')"><span class="cdot"></span>' + esc(nameIn(lid, spot)) + '</button>';
  }
  function cardHTML(sel) {
    const l = LID[sel.l], it = ITEM[key(sel.l, sel.s)], spot = SPOTS[sel.s] || {};
    let h = '<article class="card"><div class="card-top"><span class="cardtab" style="--c:var(--' + l.id + ')">' + esc(l.name) + '</span>' +
      '<button class="close" data-close aria-label="Close">' + CLOSE + '</button></div>';
    h += '<div class="card-head"><div class="glyph" style="--c:var(--' + l.id + ')">' + icon(spot.icon) + '</div><h2>' + esc(it.name) + '</h2></div>';
    if (it.status) h += '<span class="status">' + esc(it.status) + '</span>';
    if (it.line) h += '<p class="line">' + esc(it.line) + '</p>';
    if (it.ways) {
      h += '<div class="ways"><div class="sect-h">Three ways in</div>';
      Object.keys(it.ways).forEach(portal => {
        const w = it.ways[portal], pl = ITEM[key(l.id, portal)] ? l.id : (HAS[portal] || [])[0];
        h += '<div class="way"><button class="wname" data-go="' + key(pl, portal) + '"><span class="wglyph">' + icon(SPOTS[portal] && SPOTS[portal].icon) + '</span>' + esc(nameIn(pl, portal)) + '</button>';
        h += w.link ? '<a class="wlink" href="' + esc(w.link) + '" target="_blank" rel="noopener">open ↗</a>' : '<span></span>';
        if (w.prompt) h += '<div class="prompt"><q>' + esc(w.prompt) + '</q><button class="copy" data-copy="' + esc(w.prompt) + '">Copy prompt</button></div>';
        h += '</div>';
      });
      h += '</div>';
    }
    // a long address breaks after a slash, never inside a word
    if (it.link) h += '<a class="go" href="' + esc(it.link) + '" target="_blank" rel="noopener">' + esc(pretty(it.link)).replace(/\//g, '/<wbr>') + ' ↗</a>';
    else if (!it.ways) h += '<span class="nolink">Page to come</span>';

    // links that can be seen now
    const selK = key(sel.l, sel.s), viaWays = new Set(Object.keys(it.ways || {}));
    const outs = [], ins = [];
    ROADS.forEach(r => {
      const e = ends(r); if (!e) return;
      const fk = key(e[0], r.from), tk = key(e[1], r.to);
      if (fk === selK && outs.indexOf(tk) < 0) outs.push(tk);
      if (tk === selK && ins.indexOf(fk) < 0 && !viaWays.has(r.from)) ins.push(fk);
    });
    const twins = visible().filter(x => x.id !== sel.l && ITEM[key(x.id, sel.s)]).map(x => key(x.id, sel.s));
    // what hidden layers would add
    const hidden = new Set();
    LAYERS.forEach(x => {
      if (state.on.has(x.id)) return;
      if (ITEM[key(x.id, sel.s)]) hidden.add(x.id);
      ROADS.forEach(r => {
        if (r.layer === x.id && r.cross && (r.from === sel.s || r.to === sel.s) && !ITEM[key(x.id, sel.s)]) hidden.add(x.id);
        if (r.layer === sel.l && (r.from === sel.s || r.to === sel.s)) {
          const other = r.from === sel.s ? r.to : r.from;
          if (!ITEM[key(sel.l, other)] && ITEM[key(x.id, other)] && !firstVisibleHaving(other)) hidden.add(x.id);
        }
      });
    });
    let sec = '';
    if (twins.length) sec += '<div><div class="sect-h"><svg class="rkey" viewBox="0 0 28 8" aria-hidden="true"><path class="k-thread" d="M2 4h24"/></svg>The same experience in</div><div class="rchips">' +
      twins.map(t => { const lid = t.split('|')[0]; return '<button class="rchip" data-go="' + t + '" style="--c:var(--' + lid + ')"><span class="cdot"></span>' + esc(nameIn(lid, sel.s)) + ' <span class="cl">' + esc(LID[lid].name) + '</span></button>'; }).join('') + '</div></div>';
    if (outs.length) sec += '<div><div class="sect-h"><svg class="rkey" viewBox="0 0 28 8" aria-hidden="true"><path d="M1 4h20"/><path class="k-head" d="M20 1l7 3-7 3z"/></svg>Leads to</div><div class="rchips">' + outs.map(chip).join('') + '</div></div>';
    if (ins.length) sec += '<div><div class="sect-h"><svg class="rkey" viewBox="0 0 28 8" aria-hidden="true"><path class="k-in" d="M1 4h26"/></svg>Comes from</div><div class="rchips">' + ins.map(chip).join('') + '</div></div>';
    if (hidden.size) sec += '<div><div class="sect-h">More in hidden layers</div><div class="rchips">' + Array.from(hidden).map(x =>
      '<button class="showlayer" data-show="' + x + '" style="--c:var(--' + x + ')"><span class="sw"></span>Show ' + esc(LID[x].name) + '</button>').join('') + '</div></div>';
    if (sec) h += '<div class="sections">' + sec + '</div>';
    return h + '</article>';
  }
  function renderPanel() {
    const sel = state.sel && state.on.has(state.sel.l) ? state.sel : null;
    if (!sel) {
      state.sel = null;
      panel.className = 'panel';
      document.body.classList.remove('sheet-open');
      panel.innerHTML = legendHTML();
      return;
    }
    panel.innerHTML = cardHTML(sel);
    panel.className = 'panel' + (narrowMQ.matches ? ' sheet' : '');
    document.body.classList.toggle('sheet-open', narrowMQ.matches);
    panel.scrollTop = 0;
  }
  // on a phone, the opened experience is kept in sight between the bar and the sheet
  function keepInView() {
    const g = svg.querySelector('.node[data-key="' + (state.sel ? key(state.sel.l, state.sel.s) : '') + '"]');
    if (!g) return;
    const r = g.getBoundingClientRect(), roof = panel.getBoundingClientRect().top, sky = barH(), mid = (r.top + r.bottom) / 2;
    if (mid > sky + 24 && mid < roof - 32) return;
    const by = mid - (sky + roof) / 2;
    try { window.scrollBy({ top: by, behavior: 'smooth' }); } catch (e) { window.scrollBy(0, by); }
  }

  // ---------- controls ----------
  const bar = document.getElementById('layers');
  bar.innerHTML = LAYERS.map(l =>
    '<button class="chip" type="button" data-layer="' + l.id + '" aria-pressed="true" style="--c:var(--' + l.id + ')"><span class="sw"></span>' + esc(l.name) + '</button>').join('');
  function setLayer(id, on) {
    if (on) state.on.add(id); else state.on.delete(id);
    const b = bar.querySelector('[data-layer="' + id + '"]');
    if (b) b.setAttribute('aria-pressed', on ? 'true' : 'false');
    if (state.sel && !state.on.has(state.sel.l)) select(null, true);
    liftBtn.disabled = state.on.size < 2;
    setTargets(); animate(); renderPanel();
  }
  bar.addEventListener('click', e => {
    const b = e.target.closest('[data-layer]');
    if (b) setLayer(b.dataset.layer, !state.on.has(b.dataset.layer));
  });
  const liftBtn = document.getElementById('lift');
  liftBtn.addEventListener('click', () => {
    state.lifted = !state.lifted;
    liftBtn.setAttribute('aria-pressed', state.lifted ? 'true' : 'false');
    liftBtn.querySelector('span').textContent = state.lifted ? 'Lay flat' : 'Lift apart';
    setTargets(); animate();
  });

  function select(k2, quiet) {
    let next = null;
    if (k2) { const [l, s] = k2.split('|'); next = { l, s }; }
    if (next && state.sel && next.l === state.sel.l && next.s === state.sel.s) next = null;
    state.sel = next;
    try {
      if (state.sel) history.replaceState(null, '', '#' + state.sel.l + '.' + state.sel.s);
      else history.replaceState(null, '', location.pathname + location.search);
    } catch (e) { /* the frame may refuse; the page works without it */ }
    if (quiet) return;
    render(); renderPanel();
    if (state.sel && narrowMQ.matches) requestAnimationFrame(keepInView);
  }
  svg.addEventListener('click', e => {
    const t = e.target.closest('[data-key]');
    select(t ? t.dataset.key : null);
  });
  svg.addEventListener('keydown', e => {
    const t = e.target.closest('[data-key]');
    if (t && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); select(t.dataset.key); }
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && state.sel && !document.querySelector('details.dd[open]')) select(null); });
  panel.addEventListener('click', e => {
    if (e.target.closest('[data-close]')) { select(null); return; }
    const sh = e.target.closest('[data-show]');
    if (sh) { setLayer(sh.dataset.show, true); return; }
    const go = e.target.closest('[data-go]');
    if (go) { state.sel = null; select(go.dataset.go); return; }
    const cp = e.target.closest('.copy');
    if (cp) {
      const text = cp.dataset.copy;
      const done = msg => { cp.textContent = msg; setTimeout(() => { cp.textContent = 'Copy prompt'; }, 1800); };
      const fallback = () => {
        try { const rg = document.createRange(); rg.selectNodeContents(cp.previousElementSibling); const s = window.getSelection(); s.removeAllRanges(); s.addRange(rg); } catch (er) { /* nothing more to do */ }
        done('Selected — copy it');
      };
      try { navigator.clipboard.writeText(text).then(() => done('Copied'), fallback); } catch (er) { fallback(); }
    }
  });

  // ---------- start ----------
  function fromHash() {
    try {
      const h = decodeURIComponent((location.hash || '').slice(1)), dot = h.indexOf('.');
      if (dot > 0 && ITEM[key(h.slice(0, dot), h.slice(dot + 1))]) return { l: h.slice(0, dot), s: h.slice(dot + 1) };
    } catch (e) { /* no deep link */ }
    return null;
  }
  state.sel = fromHash();
  window.addEventListener('hashchange', () => {
    const t = fromHash();
    if (!t || (state.sel && t.l === state.sel.l && t.s === state.sel.s)) return;
    if (!state.on.has(t.l)) setLayer(t.l, true);
    state.sel = null; select(key(t.l, t.s));
  });
  render(); renderPanel();
  if (state.sel && narrowMQ.matches) requestAnimationFrame(keepInView);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { for (const x in widthCache) delete widthCache[x]; render(); });
  if (window.ResizeObserver) new ResizeObserver(() => render()).observe(wrap);
  else window.addEventListener('resize', render);
  const onMQ = () => renderPanel();
  if (narrowMQ.addEventListener) narrowMQ.addEventListener('change', onMQ); else if (narrowMQ.addListener) narrowMQ.addListener(onMQ);
  // the light and the dark can change under the page (◐, or the system at dusk), and a sheet's tint is read from it
  new MutationObserver(() => render()).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  // the go menu — the site's own pages, this one marked as here; a walker who arrived carrying a handle keeps it
  const CARRIED = window.cleanHandle ? cleanHandle(new URLSearchParams(location.search).get('h')) || null : null;
  if (window.siteDoors) siteDoors({ handle: CARRIED, here: 'experience-ecology', site: true });
})();
</script>
</body>
</html>
