<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mindflow Live</title>
  <meta name="description" content="The films a talk's words call up, behind the speaker: one at a time, the phrase just said as a quiet caption, the recent words drifting beneath.">
  <style>
    :root { --bg: #0a0a0f; --ink: #d0d0e0; --dim: #8888a0; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body { background: var(--bg); color: var(--ink); overflow: hidden; font-family: 'SF Mono', 'Fira Code', Consolas, monospace; }
    body.idle { cursor: none; }

    /* the films: one at a time, crossfading */
    #stage { position: fixed; inset: 0; z-index: 1; }
    .film { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; opacity: 0; transition: opacity 2.4s ease; pointer-events: none; background: var(--bg); }
    .film.on { opacity: 1; }
    img.film { object-fit: contain; }
    img.film.on { animation: drift 48s ease-in-out infinite alternate; }
    @keyframes drift { from { transform: scale(1.01) translate(-0.5%, -0.4%); } to { transform: scale(1.07) translate(0.5%, 0.4%); } }

    /* the band under a film, where the caption and the drifting words stay legible */
    #veil { position: fixed; left: 0; right: 0; bottom: 0; height: 34vh; z-index: 2; pointer-events: none; opacity: 0; transition: opacity 2.4s ease;
      background: linear-gradient(to bottom, rgba(10,10,15,0), rgba(10,10,15,0.72) 45%, rgba(10,10,15,0.92)); }
    body.film-on #veil { opacity: 1; }
    #drift { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 3; pointer-events: none; }

    /* the phrase just said */
    #caption { position: fixed; left: 8vw; right: 8vw; bottom: 15vh; z-index: 4; text-align: center; pointer-events: none;
      font: 300 clamp(17px, 1.7vw, 34px)/1.45 -apple-system, 'Helvetica Neue', 'Segoe UI', Roboto, sans-serif; letter-spacing: 0.01em;
      color: rgba(228, 228, 238, 0.82); text-shadow: 0 1px 12px rgba(0,0,0,0.55); opacity: 0; transition: opacity 1.2s ease; }
    #caption.on { opacity: 1; }
    #caption.interim { color: rgba(200, 200, 215, 0.55); }
    #caption.hint { opacity: 0.6; font-size: clamp(13px, 1.1vw, 20px); color: var(--dim); }

    #dot { position: fixed; top: 12px; right: 12px; z-index: 5; width: 7px; height: 7px; border-radius: 50%; background: #444455; opacity: 0.7; transition: opacity 3s ease, background 0.4s ease; }
    #dot.live { background: #7ebc8a; } #dot.lost { background: #e87c7c; opacity: 0.9; }
    #dot.quiet { opacity: 0.12; }

    #start { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 6; display: none;
      background: #1a1a2e; color: var(--ink); border: 1px solid #2a2a3e; border-radius: 6px; padding: 0.8rem 1.4rem; font: inherit; font-size: 0.95rem; cursor: pointer; }
    #start:hover { background: #2a2a3e; }
    #debug { position: fixed; left: 10px; top: 10px; z-index: 6; display: none; max-width: 46vw; padding: 6px 8px; border-radius: 4px;
      background: rgba(10,10,15,0.78); color: #9a9ab0; font-size: 11px; line-height: 1.5; white-space: pre-wrap; pointer-events: none; }
  </style>
</head>
<body>
  <div id="stage"></div>
  <div id="veil"></div>
  <canvas id="drift"></canvas>
  <div id="caption"></div>
  <div id="dot" title="the source"></div>
  <button id="start">Listen</button>
  <div id="debug"></div>
  <script src="live.js"></script>
</body>
</html>
