<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Earth — the globe, by address</title>
<meta name="description" content="The world as the beach holds it, on the sphere: one address ladder from the solar system down to the room — every flight bends over the curve of the planet.">
<meta property="og:title" content="Earth — the globe, by address">
<meta property="og:description" content="The world as the beach holds it, on the sphere — fly any pscale address from orbit down to the room.">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Space+Mono:wght@400;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%2333C2D2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/vendor/maplibre-gl.v5.css">
<script src="/theme.js"></script>
<script src="/vendor/maplibre-gl.v5.js"></script>
<style>
  *{box-sizing:border-box} html,body{margin:0;height:100%;overflow:hidden}
  body{
    font-family:var(--body); color:var(--foam); font-size:16px; line-height:1.5;
    background:var(--abyss); -webkit-font-smoothing:antialiased;
  }
  ::selection{background:rgba(var(--liquid-rgb),0.30);color:var(--foam)}
  a{color:var(--liquid);text-decoration:none;border-bottom:1px solid rgba(var(--liquid-rgb),0.35)}
  a:hover{color:var(--foam);border-color:var(--foam)}
  .hidden{display:none !important}
  button{font-family:var(--mono)}
  button:focus-visible,input:focus-visible{outline:2px solid var(--liquid);outline-offset:2px}

  .work{display:none}
  body.workings .work{display:revert;font-family:var(--mono);font-size:10.5px;color:var(--vapour-dim);letter-spacing:0.06em}

  .bar{position:fixed;top:0;left:0;right:0;z-index:20;background:rgba(var(--well-rgb),0.72);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:12px;padding:11px 52px 11px 18px;
    font-family:var(--mono);font-size:12px;letter-spacing:0.08em;color:var(--vapour-dim)}
  .bar .dot{width:6px;height:6px;border-radius:50%;background:var(--liquid);box-shadow:0 0 10px var(--liquid);flex:none}
  .bar b{color:var(--foam)}
  .bar a{border-bottom:none;color:var(--vapour-dim)} .bar a:hover{color:var(--liquid)}
  .bar .spacer{flex:1}
  .bar button{background:none;border:1px solid var(--line);border-radius:4px;color:var(--vapour-dim);
    font-size:12px;padding:5px 9px;cursor:pointer}
  .bar button:hover{color:var(--foam);border-color:var(--line-strong)}
  .bar button.on{color:var(--liquid);border-color:var(--liquid)}

  /* ── the sphere ── */
  #map{position:fixed;inset:0;width:100vw;height:100dvh;transition:opacity 700ms ease}
  /* at the top rung the world itself steps back — the strip hangs in the abyss */
  body.insolar #map{opacity:0}
  .maplibregl-canvas{outline:none;cursor:grab}
  .maplibregl-canvas:active{cursor:grabbing}

  /* place markers — a dot and a name that breathe around their own rung */
  .place-m{display:flex;align-items:center;gap:6px;cursor:pointer;transition:opacity 200ms linear}
  .place-m .pd{width:7px;height:7px;border-radius:50%;background:var(--liquid);
    box-shadow:0 0 0 3px rgba(var(--liquid-rgb),0.22), 0 0 10px rgba(var(--liquid-rgb),0.5);flex:none}
  .place-m .pl{font-family:var(--mono);font-size:11px;color:var(--foam);white-space:nowrap;
    text-shadow:0 1px 4px rgba(var(--well-rgb),0.95), 0 0 2px rgba(var(--well-rgb),0.9)}

  /* residents — amber, at exactly the size of what they divulged */
  .folk-m{display:flex;flex-direction:column;align-items:center;transition:opacity 200ms linear}
  .folk-m .fl{font-family:var(--mono);font-size:11px;color:var(--solid);white-space:nowrap;
    text-shadow:0 1px 4px rgba(var(--well-rgb),0.95);margin-bottom:3px}
  .folk-m.pin .fd{width:9px;height:9px;border-radius:50%;background:var(--solid);
    border:1.5px solid var(--abyss);box-shadow:0 0 12px rgba(var(--solid-rgb),0.8)}
  .folk-m.disc .fd{border-radius:50%;background:rgba(var(--solid-rgb),0.13);
    border:1.4px solid rgba(var(--solid-rgb),0.6)}

  /* ── the solar strip — above the sphere, the top rung is not a map ── */
  #solar{position:fixed;inset:0;z-index:15;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;
    background:radial-gradient(1200px 700px at 50% 60%, rgba(var(--well-rgb),0.55), rgba(var(--well-rgb),0.92));
    transition:opacity 400ms ease;pointer-events:none;opacity:0}
  #solar.show{opacity:1;pointer-events:auto}
  #sol-cap{max-width:620px;max-height:34dvh;overflow:auto;text-align:center;color:var(--vapour);font-size:15.5px;min-height:3em;padding:0 24px}
  #sol-cap b{font-family:var(--display);color:var(--foam)}
  #panel{transition:opacity 300ms ease}
  body.insolar #panel{opacity:0;pointer-events:none}
  .sol-row{display:flex;align-items:center;gap:clamp(10px,3.2vw,38px);padding:0 24px;flex-wrap:wrap;justify-content:center}
  .sol{display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;background:none;border:none;color:var(--vapour)}
  .sol .ball{border-radius:50%;background:var(--vapour-dim);box-shadow:0 0 14px rgba(var(--vapour-rgb),0.25)}
  .sol[data-d="3"] .ball{background:var(--liquid);box-shadow:0 0 26px rgba(var(--liquid-rgb),0.8)}
  .sol .nm{font-family:var(--mono);font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--vapour-dim)}
  .sol:hover .nm{color:var(--foam)}
  .sol[data-d="3"] .nm{color:var(--liquid)}
  .sol-sun{width:clamp(30px,6vw,64px);height:clamp(60px,12vw,128px);border-radius:0 999px 999px 0;
    background:linear-gradient(90deg, rgba(var(--solid-rgb),0.9), rgba(var(--solid-rgb),0.0));flex:none}
  .sol-hint{position:absolute;bottom:96px;left:0;right:0;text-align:center;
    font-family:var(--mono);font-size:11.5px;letter-spacing:0.1em;color:var(--vapour-dim)}

  #addr{z-index:16} #ladder{z-index:16}

  /* ── the panel ── */
  #panel{position:fixed;top:58px;left:14px;z-index:10;width:min(390px, calc(100vw - 28px));
    max-height:calc(100dvh - 170px);overflow:auto;overscroll-behavior:contain;
    background:rgba(var(--card-rgb),0.82);backdrop-filter:blur(10px);
    border:1px solid var(--line);border-radius:10px;padding:16px 18px 14px}
  #panel h2{font-family:var(--mono);font-size:10.5px;font-weight:400;letter-spacing:0.2em;text-transform:uppercase;
    color:var(--vapour-dim);margin:18px 0 8px;display:flex;align-items:center;gap:10px}
  #panel h2::after{content:"";height:1px;background:var(--line);flex:1}
  #crumb{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
  .chip{font-family:var(--mono);font-size:11px;letter-spacing:0.04em;color:var(--vapour);
    background:rgba(var(--well-rgb),0.5);border:1px solid var(--line);border-radius:999px;
    padding:3px 10px;cursor:pointer}
  .chip:hover{color:var(--foam);border-color:var(--liquid)}
  .chip.ground{color:var(--vapour-dim);border-style:dashed}
  .chip.here{color:var(--liquid);border-color:rgba(var(--liquid-rgb),0.5);cursor:default}
  #here-name{font-family:var(--display);font-weight:700;font-size:clamp(1.15rem,4vw,1.5rem);line-height:1.15;margin:2px 0 6px}
  #here-rung{font-family:var(--mono);font-size:11px;letter-spacing:0.1em;color:var(--solid);margin:0 0 8px}
  #here-prose{color:var(--vapour);font-size:15.5px;margin:0}
  #here-prose.quiet{color:var(--vapour-dim);font-style:italic}
  .kid-row{display:flex;flex-wrap:wrap;gap:6px}
  .hold{margin:0 0 10px;padding-left:22px;position:relative;color:var(--vapour);font-size:14.5px}
  .hold .n{position:absolute;left:0;top:2px;font-family:var(--mono);font-size:10.5px;color:var(--solid)}
  .hold-note{font-family:var(--mono);font-size:10.5px;color:var(--vapour-dim);letter-spacing:0.06em;margin:0 0 8px}
  .folkrow{display:flex;align-items:baseline;gap:8px;margin:0 0 6px;flex-wrap:wrap}
  .folkrow .h{font-family:var(--mono);font-size:12.5px;color:var(--solid);cursor:pointer;border-bottom:1px dashed rgba(var(--solid-rgb),0.4)}
  .folkrow .at{color:var(--vapour-dim);font-size:13px}
  #status{font-family:var(--mono);font-size:11px;color:var(--vapour-dim);margin:10px 0 0}
  #panel-tuck{position:absolute;top:8px;right:8px;background:none;border:none;color:var(--vapour-dim);
    font-size:14px;cursor:pointer;padding:4px 8px}
  #panel.tucked{max-height:none;overflow:visible;width:auto}
  #panel.tucked > *{display:none}
  #panel.tucked > #panel-tuck{display:block;position:static}

  /* ── the ladder ── */
  #ladder{position:fixed;top:70px;right:14px;z-index:16;width:230px;
    background:rgba(var(--card-rgb),0.7);backdrop-filter:blur(10px);
    border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .rung2{display:flex;align-items:baseline;gap:8px;padding:4px 6px;margin:0 -6px;border-radius:6px;cursor:pointer}
  .rung2:hover{background:rgba(var(--well-rgb),0.5)}
  .rung2 .p{flex:none;width:34px;text-align:right;font-family:var(--mono);font-size:11px;color:var(--vapour-dim)}
  .rung2 .nm{flex:1;min-width:0;font-size:13.5px;color:var(--vapour);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rung2 .nm .gl{color:var(--vapour-dim);font-size:11.5px}
  .rung2.on .p,.rung2.on .nm{color:var(--liquid)}
  .rung2.zoomhere{box-shadow:inset 2px 0 0 var(--solid)}
  .rung2.dim .nm{color:var(--vapour-dim);font-style:italic}
  .rung2.blank .nm{color:rgba(var(--vapour-rgb),0.35)}

  /* ── the address line ── */
  #addr{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;text-align:center}
  #addr .walk{display:inline-block;font-family:var(--mono);font-size:15px;letter-spacing:0.12em;color:var(--foam);
    background:rgba(var(--well-rgb),0.72);backdrop-filter:blur(8px);
    border:1px solid var(--line);border-radius:999px;padding:9px 18px;cursor:text}
  #addr .walk .z{color:var(--vapour-dim)}
  #addr input{font-family:var(--mono);font-size:15px;letter-spacing:0.12em;color:var(--foam);
    background:rgba(var(--well-rgb),0.9);border:1px solid var(--liquid);border-radius:999px;
    padding:9px 18px;width:min(340px,80vw);text-align:center}
  #addr .padded{display:block;margin-top:6px}

  #attrib{position:fixed;right:10px;bottom:8px;z-index:9;font-family:var(--mono);font-size:9.5px;
    color:var(--vapour-dim);background:rgba(var(--well-rgb),0.55);border-radius:4px;padding:2px 7px}
  #attrib a{color:var(--vapour-dim);border-bottom:none}

  @media (max-width:900px){ #ladder{display:none} }
  @media (max-width:760px){
    #panel{top:auto;bottom:74px;left:10px;width:calc(100vw - 20px);max-height:38dvh;padding:12px 14px}
    #addr{bottom:12px}
    .bar{padding-right:48px}
  }
</style>
</head>
<body>

<div class="bar">
  <span class="dot"></span>
  <span><b>earth</b> · the globe, by address</span>
  <span class="work" id="work-src"></span>
  <span class="spacer"></span>
  <button id="btn-workings" title="show the addresses and block names under the page">workings</button>
</div>

<div id="map" aria-label="the world as a globe, navigable by pscale address"></div>

<div id="solar" aria-hidden="true">
  <div class="sol-row" id="sol-row"><div class="sol-sun" title="one star"></div></div>
  <div id="sol-cap"></div>
  <div class="sol-hint">the solar system · every world a digit — this one is 3</div>
</div>

<aside id="panel">
  <button id="panel-tuck" title="tuck the panel away">◧</button>
  <div id="crumb"></div>
  <p id="here-rung"></p>
  <h1 id="here-name"></h1>
  <p id="here-prose"></p>
  <div id="sec-kids"><h2>finer ground <span class="work">spatial:earth</span></h2><div class="kid-row" id="kids"></div></div>
  <div id="sec-holds"><h2>how this place is held <span class="work">identity:earth</span></h2><div id="holds"></div></div>
  <div id="sec-folk"><h2>who has placed themselves <span class="work">passport:* · Location star-ref</span></h2><div id="folk"></div></div>
  <p id="status"></p>
</aside>

<aside id="ladder" aria-label="the pscale ladder, solar system to room"></aside>

<div id="addr">
  <span class="walk" id="addr-walk" title="the address as a walk — click to type one"></span>
  <span class="padded work" id="addr-padded"></span>
</div>

<div id="attrib">globe © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> · © <a href="https://carto.com/attributions">CARTO</a> · ground © the beach</div>

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   /globe — the same address, on the sphere.

   The sibling of /earth: identical intelligence (spatial:earth walked live,
   identity:earth folded at the address, residents by the Location star-ref
   convention, zeros as unresolved ground), but the engine is MapLibre GL with
   the globe projection — you arrive at a slowly turning planet, and every
   flight bends over the curve. Anchors come from geo:earth on the beach
   (the geographic register at spatial's self-same addresses); the page-local
   gazetteer is only the fallback if the beach is unreachable.

   MapLibre v5 vendored (no CDN at runtime); basemap styles are CARTO's free
   GL styles — dark-matter in the dark register, voyager in the light —
   attributed below-right. The sky and atmosphere are painted from the page's
   own theme variables, so the space around the planet is the house abyss.
   ═══════════════════════════════════════════════════════════════════════ */
'use strict';
const $ = id => document.getElementById(id);
const BEACH = 'https://earth.beach.happyseaurchin.com/.well-known/pscale-beach';
const RM = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* /globe/<handle> — a lens on the world, not a person: the segment is CARRIED
 * for the chain of doors, never read. */
const HANDLE = (function(){
  const m = location.pathname.match(/\/globe\/([^\/]+)\/?$/);
  const q = new URLSearchParams(location.search).get('h');
  return ((m && decodeURIComponent(m[1])) || q || '').replace(/[^a-z0-9 _-]/gi, '').trim() || null;
})();
/* the page hands over what only it knows; the catalogue is shared in theme.js */
if (window.siteDoors) siteDoors({ handle: HANDLE, here: 'globe' });

/* ── pscale tree — the walk, exactly as the walker walks it ─────────────── */
function floorOf(block){
  let f = 0, n = block && block._;
  while (n !== undefined){ f++; if (typeof n !== 'object' || n === null) break; n = n._; }
  return f;
}
function nodeAt(block, path){
  let n = block;
  for (const d of path){
    if (n == null || typeof n !== 'object') return null;
    n = d === 0 ? n._ : n[String(d)];
    if (n === undefined) return null;
  }
  return n;
}
const semOf  = n => typeof n === 'string' ? n : (n && typeof n._ === 'string' ? n._ : null);
const kidsOf = n => (n && typeof n === 'object')
  ? [1,2,3,4,5,6,7,8,9].filter(d => n[String(d)] !== undefined).map(d => ({d, node:n[String(d)]}))
  : [];
const groundBelow = n => !!(n && typeof n === 'object' && n._ && typeof n._ === 'object');
function previewThroughZeros(node){
  let m = node, steps = 0;
  while (m && typeof m === 'object' && steps < 10){
    const s = semOf(m);
    if (s) return { name: nameOf(s), steps };
    m = m._; steps++;
  }
  return null;
}
function jumpZeros(path){
  const p = path.slice();
  let n = nodeAt(SPATIAL, p), guard = 0;
  while (n && typeof n === 'object' && !semOf(n) && n._ && typeof n._ === 'object' && guard++ < 9){
    p.push(0); n = n._;
  }
  return p;
}
const nameOf  = s => s == null ? null : s.split(' — ')[0];
const proseOf = s => { if (s == null) return ''; const i = s.indexOf('—'); return i < 0 ? '' : s.slice(i+1).trim(); };

/* ── geography — geo:earth first, page gazetteer as the fallback ────────── */
const GAZ = {
  '3':                     '23,12 · -55,72,-170,179',
  '3,1':                   '51,15 · 34,71.5,-11,40',
  '3,1,1':                 '54.0,-2.9 · 49.9,59.5,-8.7,1.9',
  '3,1,1,1,0':             '52.33,-3.74 · 51.35,53.45,-5.4,-2.65',
  '3,1,1,1,0,1,0,0':       '52.91,-3.83 · 52.537,53.281,-4.804,-3.437',
  '3,1,1,1,0,1,0,0,1':     '52.915,-4.5547 · 52.905,52.925,-4.575,-4.535',
  '3,1,1,2':               '52.505,-1.965 · 52.348,52.663,-2.207,-1.424',
  '3,1,1,2,1':             '52.4949,-1.8518 · 52.381,52.609,-2.034,-1.729',
  '3,1,1,2,1,1,0,0':       '52.5623,-1.824 · 52.509,52.609,-1.892,-1.729',
  '3,1,1,2,1,1,0,0,1':     '52.5559,-1.8106 · 52.5553,52.5564,-1.8116,-1.8096',
  '3,1,1,3':               '53.48,-1.38 · 53.302,53.661,-1.823,-0.865',
  '3,1,1,3,1,0':           '53.3807,-1.4702 · 53.305,53.503,-1.801,-1.325',
  '3,1,1,3,1,0,1,0':       '53.3597,-1.4875 · 53.348,53.372,-1.503,-1.472',
  '3,1,1,3,1,0,1,0,1':     '53.3595,-1.4837 · 53.3590,53.3604,-1.4868,-1.4805',
  '3,1,2,0,0':             '42.776,19.202 · 41.685,43.559,18.420,20.353',
  '3,1,2,0,0,1,0,0':       '41.926,19.2056 · 41.906,41.939,19.191,19.249',
  '3,1,2,0,0,1,0,0,1':     '41.9235,19.2033 @15.6'
};
function parseGeo(s){
  if (typeof s !== 'string') return null;
  let m = s.match(/^\s*(-?[\d.]+)\s*,\s*(-?[\d.]+)\s*@\s*([\d.]+)\s*$/);
  if (m) return { lat:+m[1], lon:+m[2], z:+m[3] };
  m = s.match(/^\s*(-?[\d.]+)\s*,\s*(-?[\d.]+)\s*[·•]\s*(-?[\d.]+)\s*,\s*(-?[\d.]+)\s*,\s*(-?[\d.]+)\s*,\s*(-?[\d.]+)\s*$/);
  if (m) return { lat:+m[1], lon:+m[2], bbox:[+m[3],+m[4],+m[5],+m[6]] };
  m = s.match(/^\s*(-?[\d.]+)\s*,\s*(-?[\d.]+)\s*$/);
  if (m) return { lat:+m[1], lon:+m[2] };
  return null;
}
let GEOBLOCK = null;
function geoOwn(path){
  if (GEOBLOCK){ const g = parseGeo(semOf(nodeAt(GEOBLOCK, path))); if (g) return g; }
  return parseGeo(GAZ[path.join(',')]) || null;
}
function geoNearest(path){
  for (let i = path.length; i >= 1; i--){
    const g = geoOwn(path.slice(0, i));
    if (g) return { geo:g, at:path.slice(0, i), inherited:i < path.length };
  }
  return null;
}

/* ── the sphere — MapLibre with the globe projection ────────────────────── */
const STYLES = {
  dark:  'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
  light: 'https://basemaps.cartocdn.com/gl/voyager-gl-style/style.json'
};
const themeNow = () => document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

const map = new maplibregl.Map({
  container: 'map',
  style: STYLES[themeNow()],
  center: [12, 23], zoom: 1.1,
  minZoom: 0, maxZoom: 19,
  attributionControl: false,
  hash: false, fadeDuration: 150
});
map.on('style.load', () => {
  try { map.setProjection({ type: 'globe' }); } catch(e){}
  applySky();
});
function applySky(){
  try {
    map.setSky({
      'sky-color': cssVar('--abyss') || '#06171E',
      'horizon-color': cssVar('--liquid-deep') || '#1B8B99',
      'fog-color': cssVar('--deep') || '#0A2129',
      'sky-horizon-blend': 0.7,
      'horizon-fog-blend': 0.6,
      'fog-ground-blend': 0.6,
      'atmosphere-blend': ['interpolate', ['linear'], ['zoom'], 0, 1, 6, 1, 8, 0]
    });
  } catch(e){}
}

let WORLDZ = 1.2;
function computeWorldZ(){
  try {
    const c = map.cameraForBounds([[-170, -55], [179, 72]], { padding: 30 });
    if (c && isFinite(c.zoom)) WORLDZ = Math.max(0.4, Math.min(3, c.zoom));
  } catch(e){}
  try { map.setMinZoom(Math.max(0, WORLDZ - 1.3)); } catch(e){}
}

/* the idle spin — the planet turns until a hand or an address takes it */
let SPIN = !RM, USERMOVED = false;
function spinStep(){
  if (!SPIN || RM || document.hidden) return;
  if (map.getZoom() > WORLDZ + 0.7 || ADDR.length > 1) return;
  const c = map.getCenter();
  map.easeTo({ center: [c.lng + 14, c.lat], duration: 7000, easing: n => n, essential: false });
}
map.on('moveend', spinStep);
['mousedown','wheel','touchstart','dragstart'].forEach(ev =>
  map.on(ev, () => { SPIN = false; USERMOVED = true; }));

/* ── flights — the address is the camera ────────────────────────────────── */
function zoomFor(g){
  if (g.bbox){
    try {
      const c = map.cameraForBounds([[g.bbox[2], g.bbox[0]], [g.bbox[3], g.bbox[1]]], { padding: 70 });
      if (c && isFinite(c.zoom)) return Math.min(c.zoom, 19);
    } catch(e){}
  }
  return g.z != null ? g.z : 12;
}
function targetFor(path){
  const near = geoNearest(path);
  if (!near) return null;
  let z = zoomFor(near.geo);
  if (near.inherited) z = Math.min(z + 0.9, 19);
  return { center: [near.geo.lon, near.geo.lat], zoom: z };
}
const SOLAR_TGT = () => ({ center: [12, 23], zoom: Math.max(0, WORLDZ - 1.1) });
let FLYGUARD = null;
function flyToAddr(){
  const t = ADDR.length
    ? (targetFor(ADDR) || (ADDR.length === 1 ? SOLAR_TGT() : null))
    : SOLAR_TGT();
  if (!t) return;
  SPIN = false; USERMOVED = false;
  if (RM || document.hidden){ map.jumpTo(t); armSpin(); return; }
  const dur = Math.min(3400, 800 + Math.abs(map.getZoom() - t.zoom) * 170);
  map.flyTo({ ...t, duration: dur, essential: true });
  clearTimeout(FLYGUARD);
  FLYGUARD = setTimeout(() => {
    if (!USERMOVED && Math.abs(map.getZoom() - t.zoom) > 0.25) map.jumpTo(t);
    armSpin();
  }, dur + 900);
}
function armSpin(){ if (ADDR.length <= 1 && !USERMOVED){ SPIN = !RM; spinStep(); } }

/* ── the data — read from the beach, held whole ─────────────────────────── */
let SPATIAL = null, IDENTITY = null, FLOOR = 11, FOLK = [], PLACES = [];
async function readBlock(name){
  const r = await fetch(BEACH + '?block=' + encodeURIComponent(name), { headers:{Accept:'application/json'}, cache:'no-store' });
  if (!r.ok) throw new Error(name + ' → ' + r.status);
  return r.json();
}
function collectPlaces(){
  PLACES = [];
  (function walk(node, path){
    if (path.length > 1){
      const g = geoOwn(path), s = semOf(node);
      if (g && s) PLACES.push({ path:path.slice(), key:path.join(','), name:nameOf(s),
        lonlat:[g.lon, g.lat], g });
    }
    if (node && typeof node === 'object'){
      for (const {d, node:ch} of kidsOf(node)) walk(ch, path.concat(d));
      if (groundBelow(node)) walk(node._, path.concat(0));
    }
  })(SPATIAL, []);
}
async function loadFolk(indexBlocks){
  const names = (indexBlocks || []).filter(n => n.startsWith('passport:'));
  const out = [];
  await Promise.all(names.map(async name => {
    try {
      const p = await readBlock(name);
      const m = JSON.stringify(p).match(/spatial:earth:([0-9]+)/);
      const handle = name.slice('passport:'.length);
      if (!m){ out.push({ handle, path: [] }); return; }
      const digits = m[1].replace(/0+$/, '');
      const path = digits ? digits.split('').map(Number) : [];
      const near = geoNearest(path);
      out.push({ handle, path, near, pin: !!near && (near.inherited || !near.geo.bbox) && path.length >= FLOOR - 2 });
    } catch(e){}
  }));
  FOLK = out;
}

/* ── markers — DOM riders on the sphere ─────────────────────────────────── */
let PLACEMS = [], FOLKMS = [];
function buildMarkers(){
  for (const {m} of PLACEMS) m.remove();
  for (const {m} of FOLKMS) m.remove();
  PLACEMS = []; FOLKMS = [];
  for (const p of PLACES){
    const el = document.createElement('div');
    el.className = 'place-m';
    const pd = document.createElement('span'); pd.className = 'pd';
    const pl = document.createElement('span'); pl.className = 'pl'; pl.textContent = p.name;
    el.appendChild(pd); el.appendChild(pl);
    el.addEventListener('click', ev => { ev.stopPropagation(); setAddress(p.path); });
    const m = new maplibregl.Marker({ element: el, anchor: 'left', offset: [-3, 0] })
      .setLngLat(p.lonlat).addTo(map);
    PLACEMS.push({ p, el, m, zr: zoomFor(p.g) });
  }
  for (const f of FOLK.filter(f => f.near)){
    const el = document.createElement('div');
    el.className = 'folk-m ' + (f.pin ? 'pin' : 'disc');
    const fl = document.createElement('span'); fl.className = 'fl'; fl.textContent = f.handle;
    const fd = document.createElement('span'); fd.className = 'fd';
    el.appendChild(fl); el.appendChild(fd);
    el.addEventListener('click', ev => { ev.stopPropagation(); setAddress(f.path); });
    const m = new maplibregl.Marker({ element: el, anchor: 'center' })
      .setLngLat([f.near.geo.lon, f.near.geo.lat]).addTo(map);
    FOLKMS.push({ f, el, m });
  }
  refreshRungCaches();
}
function refreshRungCaches(){
  for (const pm of PLACEMS) pm.zr = zoomFor(pm.p.g);
  buildRungZooms();
}
function updateOverlays(){
  const z = map.getZoom();
  for (const {el, zr} of PLACEMS){
    const dz = z - zr;
    const o = dz < -3.5 ? 0 : dz > 5 ? 0 : dz < 0 ? 1 + dz/3.5 : Math.max(0, 1 - dz/5);
    el.style.opacity = o;
    el.style.pointerEvents = o > 0.1 ? 'auto' : 'none';
  }
  for (const {f, el} of FOLKMS){
    const fd = el.lastChild;
    if (!f.pin && f.near.geo.bbox){
      const b = f.near.geo.bbox;
      const a = map.project([b[2], b[1]]), c = map.project([b[3], b[0]]);
      const d = Math.max(14, Math.abs(c.x - a.x), Math.abs(c.y - a.y));
      fd.style.width = fd.style.height = d + 'px';
      fd.style.opacity = Math.max(0.25, Math.min(1, 140 / d));
    }
  }
  const insolar = z < WORLDZ - 0.55;
  $('solar').classList.toggle('show', insolar);
  document.body.classList.toggle('insolar', insolar);
  markLadderZoom();
}
map.on('move', updateOverlays);
map.on('resize', () => { computeWorldZ(); refreshRungCaches(); updateOverlays(); });
/* a tab born hidden measures a wrong canvas and paints nothing — heal on reveal */
document.addEventListener('visibilitychange', () => {
  if (!document.hidden){
    map.resize(); computeWorldZ(); refreshRungCaches();
    if (!USERMOVED) flyToAddr(); else updateOverlays();
  }
});

/* ── the address — one state, everything follows it ─────────────────────── */
let ADDR = [3];
const padded = path => path.join('') + '0'.repeat(Math.max(0, FLOOR - path.length));
function rungGloss(p){
  const sup = n => String(n).split('').map(c => '⁰¹²³⁴⁵⁶⁷⁸⁹'[+c]).join('');
  const what = {11:'one star’s worlds', 10:'a world', 9:'a continent', 8:'a great nation',
    7:'a region', 6:'a city', 5:'a large town', 4:'a town', 3:'a small town',
    2:'a village, a street', 1:'a household', 0:'the room'}[p] || '';
  return p === 11 ? what : `${what} · 10${sup(p)} lives`;
}
let RUNGZOOMS = [];
function buildRungZooms(){
  RUNGZOOMS = [];
  for (let L = 0; L <= ADDR.length; L++){
    const t = L === 0 ? SOLAR_TGT() : targetFor(ADDR.slice(0, L));
    if (t) RUNGZOOMS.push({ p: FLOOR - L, z: t.zoom });
  }
}
function setAddress(path, opts){
  const o = opts || {};
  const node = nodeAt(SPATIAL, path);
  if (node == null && path.length){ flashAddr(); return; }
  ADDR = path.slice();
  buildRungZooms();
  renderPanel(); renderLadder(); renderAddr(); solarCaption();
  try{ history.replaceState(null, '', '#' + (ADDR.join(',') || '')); }catch(e){}
  if (o.fly !== false) flyToAddr();
}
function solarCaption(){
  const cap = $('sol-cap'); if (!cap) return;
  cap.innerHTML = '';
  let s = null;
  if (ADDR.length === 0){
    let n = SPATIAL && SPATIAL._;
    while (n && typeof n === 'object') n = n._;
    s = typeof n === 'string' ? n : null;
  } else if (ADDR.length === 1){
    s = semOf(nodeAt(SPATIAL, ADDR));
  }
  if (!s) return;
  const b = document.createElement('b'); b.textContent = nameOf(s);
  cap.appendChild(b);
  const rest = proseOf(s);
  if (rest) cap.appendChild(document.createTextNode(' — ' + rest));
}

function renderPanel(){
  const node = nodeAt(SPATIAL, ADDR);
  const crumb = $('crumb'); crumb.innerHTML = '';
  const mk = (txt, cls, title, onclick) => { const b = document.createElement('button');
    b.className = 'chip' + (cls?' '+cls:''); b.textContent = txt; if (title) b.title = title;
    if (onclick) b.addEventListener('click', onclick); crumb.appendChild(b); };
  mk('☉', null, 'the solar system', () => setAddress([]));
  for (let i = 1; i <= ADDR.length; i++){
    const sub = ADDR.slice(0, i), s = semOf(nodeAt(SPATIAL, sub));
    const here = i === ADDR.length;
    mk(s ? nameOf(s) : '0', (s ? '' : 'ground ') + (here ? 'here' : ''),
       s ? padded(sub) : 'unresolved ground at rung +' + (FLOOR - i),
       here ? null : () => setAddress(sub));
  }
  const p = FLOOR - ADDR.length;
  const s = semOf(node);
  const pl = n => n === 0 ? '0' : '+' + n;
  $('here-rung').textContent = ADDR.length ? `${pl(p)} · ${rungGloss(p)}` : `+${FLOOR} · ${rungGloss(FLOOR)}`;
  if (!ADDR.length){
    $('here-name').textContent = 'the solar system';
    const rootSem = (function(){ let n = SPATIAL && SPATIAL._; while (n && typeof n === 'object') n = n._; return typeof n === 'string' ? n : ''; })();
    $('here-prose').textContent = proseOf(rootSem) || rootSem; $('here-prose').className = '';
  } else if (s){
    $('here-name').textContent = nameOf(s);
    $('here-prose').textContent = proseOf(s); $('here-prose').className = '';
  } else {
    $('here-name').textContent = 'unresolved ground';
    $('here-prose').textContent = 'this rung has not been decided — the address passes through; the world fills it in as it locates itself.';
    $('here-prose').className = 'quiet';
  }
  const kids = $('kids'); kids.innerHTML = '';
  const ks = ADDR.length ? kidsOf(node) : kidsOf(SPATIAL);
  for (const {d, node:ch} of ks){
    const cs = semOf(ch), b = document.createElement('button');
    b.className = 'chip' + (cs ? '' : ' ground');
    if (cs) b.textContent = nameOf(cs);
    else {
      const pv = previewThroughZeros(ch);
      b.textContent = pv ? '·'.repeat(Math.max(1, pv.steps)) + ' ' + pv.name : 'ground';
      b.title = pv ? pv.steps + ' unresolved rung(s), then ' + pv.name : '';
    }
    const target = cs ? ADDR.concat(d) : jumpZeros(ADDR.concat(d));
    if (!b.title) b.title = padded(target);
    b.addEventListener('click', () => setAddress(target));
    kids.appendChild(b);
  }
  if (ADDR.length && groundBelow(node)){
    const pv = previewThroughZeros(node._);
    const b = document.createElement('button');
    b.className = 'chip ground';
    b.textContent = pv ? '0 → ' + pv.name : '0 · unresolved, continues ↓';
    b.title = 'through the unresolved rung(s) below';
    b.addEventListener('click', () => setAddress(jumpZeros(ADDR.concat(0))));
    kids.appendChild(b);
  }
  $('sec-kids').classList.toggle('hidden', !kids.children.length);
  const holds = $('holds'); holds.innerHTML = '';
  const idSem = ADDR.length ? semOf(nodeAt(IDENTITY, ADDR)) : null;
  if (idSem){
    const lead = document.createElement('p'); lead.className = 'hold-note';
    lead.textContent = idSem;
    holds.appendChild(lead);
  }
  let holdRows = [], holdFrom = null;
  for (let i = ADDR.length; i >= 1; i--){
    const idn = nodeAt(IDENTITY, ADDR.slice(0, i));
    if (!idn || typeof idn !== 'object') continue;
    const rows = kidsOf(idn).filter(k => typeof k.node === 'string');
    if (rows.length){ holdRows = rows; holdFrom = i; break; }
  }
  if (holdRows.length){
    if (holdFrom < ADDR.length){
      const n = document.createElement('p'); n.className = 'hold-note';
      const fs = semOf(nodeAt(SPATIAL, ADDR.slice(0, holdFrom)));
      n.textContent = 'held from ' + (fs ? nameOf(fs) : 'above');
      holds.appendChild(n);
    }
    for (const {d, node:txt} of holdRows){
      const div = document.createElement('div'); div.className = 'hold';
      const num = document.createElement('span'); num.className = 'n'; num.textContent = d;
      div.appendChild(num); div.appendChild(document.createTextNode(txt));
      holds.appendChild(div);
    }
  }
  $('sec-holds').classList.toggle('hidden', !holdRows.length && !idSem);
  const folk = $('folk'); folk.innerHTML = '';
  const under = FOLK.filter(f => f.path.length >= ADDR.length && ADDR.every((d,i) => f.path[i] === d));
  for (const f of under){
    const row = document.createElement('div'); row.className = 'folkrow';
    const h = document.createElement('span'); h.className = 'h'; h.textContent = f.handle;
    h.addEventListener('click', () => setAddress(f.path));
    const at = document.createElement('span'); at.className = 'at';
    const ts = semOf(nodeAt(SPATIAL, f.path));
    const fr = FLOOR - f.path.length;
    at.textContent = (ts ? nameOf(ts) : 'unresolved ground') + ' · rung ' + (fr === 0 ? '0' : '+' + fr);
    row.appendChild(h); row.appendChild(at); folk.appendChild(row);
  }
  if (!ADDR.length || (ADDR.length === 1 && ADDR[0] === 3)){
    for (const f of FOLK.filter(f => !f.path.length)){
      const row = document.createElement('div'); row.className = 'folkrow';
      const h = document.createElement('span'); h.className = 'h'; h.textContent = f.handle;
      const at = document.createElement('span'); at.className = 'at'; at.textContent = 'on the beach — place untold';
      row.appendChild(h); row.appendChild(at); folk.appendChild(row);
    }
  }
  $('sec-folk').classList.toggle('hidden', !folk.children.length);
}

function renderLadder(){
  const el = $('ladder'); el.innerHTML = '';
  for (let p = FLOOR; p >= 0; p--){
    const L = FLOOR - p;
    const row = document.createElement('div'); row.dataset.p = p;
    let nm, cls = '';
    if (L === 0){ nm = 'the solar system'; }
    else if (L <= ADDR.length){
      const s = semOf(nodeAt(SPATIAL, ADDR.slice(0, L)));
      nm = s ? nameOf(s) : 'unresolved'; if (!s) cls = 'dim';
    } else { nm = ''; cls = 'blank'; }
    if (L === ADDR.length) cls += ' on';
    row.className = 'rung2 ' + cls;
    row.innerHTML = `<span class="p">${p === 0 ? '0' : '+'+p}</span>
      <span class="nm">${nm ? nm : '<span class="gl">' + rungGloss(p) + '</span>'}</span>`;
    row.title = rungGloss(p);
    row.addEventListener('click', () => { if (L <= ADDR.length) setAddress(ADDR.slice(0, L)); });
    el.appendChild(row);
  }
  markLadderZoom();
}
function markLadderZoom(){
  if (!RUNGZOOMS.length) return;
  const z = map.getZoom();
  let best = RUNGZOOMS[0];
  for (const r of RUNGZOOMS) if (Math.abs(r.z - z) < Math.abs(best.z - z)) best = r;
  document.querySelectorAll('#ladder .rung2').forEach(r =>
    r.classList.toggle('zoomhere', +r.dataset.p === best.p));
}

function renderAddr(){
  const walk = $('addr-walk');
  if (!walk) return;
  walk.innerHTML = '';
  if (!ADDR.length){ walk.textContent = '☉'; }
  else {
    ADDR.forEach((d, i) => {
      const s = document.createElement('span');
      if (d === 0) s.className = 'z';
      s.textContent = (i ? ',' : '') + d;
      walk.appendChild(s);
    });
  }
  $('addr-padded').textContent = ADDR.length ? 'spatial:earth : ' + padded(ADDR) : 'spatial:earth : the root';
}
function flashAddr(){
  const w = $('addr-walk'); if (!w) return;
  w.style.borderColor = 'var(--solid)';
  setTimeout(() => w.style.borderColor = '', 600);
}
function openAddrInput(){
  const w = $('addr-walk'); if (!w) return;
  const inp = document.createElement('input');
  inp.id = 'addr-input';
  inp.value = ADDR.join(',');
  inp.setAttribute('aria-label','type a pscale address — digits, commas optional');
  inp.setAttribute('enterkeyhint','go');
  const form = document.createElement('form');
  form.style.display = 'inline';
  form.appendChild(inp);
  w.replaceWith(form); inp.focus(); inp.select();
  let closed = false;
  const done = go => {
    if (closed) return; closed = true;
    const raw = inp.value.replace(/[\s.]/g, '').replace(/,/g, '');
    const pill = document.createElement('span');
    pill.className = 'walk'; pill.id = 'addr-walk';
    pill.title = 'the address as a walk — click to type one';
    form.replaceWith(pill);
    renderAddr();
    if (go && /^[0-9]+$/.test(raw)){
      const path = raw.replace(/0+$/, '').split('').map(Number);
      setAddress(path);
    }
  };
  form.addEventListener('submit', ev => { ev.preventDefault(); done(true); });
  inp.addEventListener('keydown', ev => {
    if (ev.key === 'Enter'){ ev.preventDefault(); done(true); }
    else if (ev.key === 'Escape') done(false);
  });
  inp.addEventListener('blur', () => done(false));
}
$('addr').addEventListener('click', ev => {
  if (ev.target && ev.target.closest && ev.target.closest('#addr-walk')) openAddrInput();
});

/* ── the solar strip ─────────────────────────────────────────────────────── */
function buildSolar(){
  const row = $('sol-row');
  const sizes = {1:7, 2:12, 3:13, 4:9, 5:30, 6:26, 7:18, 8:17};
  for (const {d, node} of kidsOf(SPATIAL)){
    const s = semOf(node) || '';
    const b = document.createElement('button');
    b.className = 'sol'; b.dataset.d = d; b.title = s;
    const ball = document.createElement('span'); ball.className = 'ball';
    const px = (sizes[d] || 10);
    ball.style.width = px + 'px'; ball.style.height = px + 'px';
    const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = nameOf(s) || d;
    b.appendChild(ball); b.appendChild(nm);
    b.addEventListener('click', () => setAddress([d]));
    row.appendChild(b);
  }
}

/* ── boot ────────────────────────────────────────────────────────────────── */
(async function boot(){
  $('btn-workings').addEventListener('click', () => {
    document.body.classList.toggle('workings');
    $('btn-workings').classList.toggle('on');
  });
  $('panel-tuck').addEventListener('click', () => $('panel').classList.toggle('tucked'));
  $('work-src').textContent = 'earth.beach.happyseaurchin.com';
  new MutationObserver(() => {
    map.setStyle(STYLES[themeNow()]); /* style.load re-applies globe + sky */
  }).observe(document.documentElement, { attributes:true, attributeFilter:['data-theme'] });
  addEventListener('hashchange', () => {
    const h = (location.hash || '').replace(/^#/, '').replace(/[\s.]/g, '').replace(/,/g, '');
    if (!/^[0-9]+$/.test(h)) return;
    const p = h.replace(/0+$/, '').split('').map(Number);
    if (SPATIAL && p.join(',') !== ADDR.join(',')) setAddress(p);
  });

  let index = null;
  try {
    const [sp, idy, idx] = await Promise.all([
      readBlock('spatial:earth'), readBlock('identity:earth'),
      fetch(BEACH, {headers:{Accept:'application/json'}, cache:'no-store'}).then(r => r.json())
    ]);
    SPATIAL = sp; IDENTITY = idy; index = idx;
  } catch(e){
    $('status').textContent = 'the beach is unreachable — ' + e.message;
    return;
  }
  try { GEOBLOCK = await readBlock('geo:earth'); } catch(e){ GEOBLOCK = null; }
  $('status').textContent = GEOBLOCK
    ? 'ground: spatial:earth · anchors: geo:earth'
    : 'ground: spatial:earth · anchors: page gazetteer (geo:earth unreachable)';
  $('status').className = 'work';

  FLOOR = floorOf(SPATIAL);
  buildSolar();
  collectPlaces();
  await loadFolk(index && index.blocks);

  const start = (function(){
    const h = (location.hash || '').replace(/^#/, '').replace(/[\s.]/g, '').replace(/,/g, '');
    return /^[0-9]+$/.test(h) ? h.replace(/0+$/, '').split('').map(Number) : [3];
  })();

  /* the reading side never waits for the sphere — panel, ladder and address
     stand the moment the blocks are read; the map catches up when it can */
  computeWorldZ();
  buildMarkers();
  setAddress([3], { fly: false });
  updateOverlays();
  if (start.length > 1 || start[0] !== 3) setTimeout(() => setAddress(start), RM ? 0 : 900);
  map.once('load', () => {
    computeWorldZ();
    refreshRungCaches();
    if (!USERMOVED && ADDR.length === 1 && ADDR[0] === 3 && start.length === 1 && start[0] === 3){
      map.jumpTo({ center: [12, 23], zoom: WORLDZ });
    }
    updateOverlays();
    spinStep();
  });
})();
</script>
