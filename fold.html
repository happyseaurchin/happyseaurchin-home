<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The fold</title>
<meta name="description" content="A field folded — the spine and every mirror laid side by side at the same addresses. The tally with no machinery: public reads, nothing else.">
<meta property="og:title" content="The fold">
<meta property="og:description" content="A field folded — everyone's marks side by side at the spine's own addresses.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Space+Mono:wght@400;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --abyss:#06171E; --deep:#0A2129; --card:#123742; --card-hi:#17434F;
    --vapour:#C4DBDF; --vapour-dim:#82A0A8;
    --liquid:#33C2D2; --liquid-deep:#1B8B99;
    --solid:#E7B24C; --solid-deep:#C58F2C;
    --foam:#EFF6F5;
    --line:rgba(196,219,223,0.13); --line-strong:rgba(196,219,223,0.24);
    --display:'Syne',system-ui,sans-serif;
    --body:'Newsreader',Georgia,serif;
    --mono:'Space Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box} html,body{margin:0}
  body{
    font-family:var(--body); color:var(--foam); font-size:17px; line-height:1.55;
    background:radial-gradient(1100px 560px at 70% -10%, rgba(51,194,210,0.10), transparent 60%),
      linear-gradient(180deg,#0C2932 0%, var(--deep) 30%, var(--abyss) 100%);
    background-attachment:fixed; -webkit-font-smoothing:antialiased;
    min-height:100dvh;
  }
  ::selection{background:rgba(51,194,210,0.30);color:var(--foam)}
  a{color:var(--liquid);text-decoration:none;border-bottom:1px solid rgba(51,194,210,0.35)}
  a:hover{color:var(--foam);border-color:var(--foam)}
  .hidden{display:none !important}
  .wrap{max-width:640px;margin:0 auto;padding:0 18px}

  .bar{display:flex;align-items:center;gap:10px;padding:14px 18px 10px;font-family:var(--mono);font-size:12px;letter-spacing:0.08em;color:var(--vapour-dim);max-width:640px;margin:0 auto}
  .bar .dot{width:6px;height:6px;border-radius:50%;background:var(--liquid);box-shadow:0 0 10px var(--liquid);flex:none}
  .bar b{color:var(--foam)}
  .bar .spacer{flex:1}
  .bar button{background:none;border:1px solid var(--line);border-radius:4px;color:var(--vapour-dim);font-family:var(--mono);font-size:12px;padding:6px 10px;cursor:pointer}
  .bar button:hover{color:var(--foam);border-color:var(--line-strong)}

  .head{padding:10px 0 6px}
  .head h1{font-family:var(--display);font-weight:800;font-size:clamp(1.5rem,5vw,2.1rem);line-height:1.1;margin:0 0 10px}
  .head h1 .cool{color:var(--liquid)}
  .head .voicing{color:var(--vapour);font-size:0.98rem;max-width:60ch;margin:0 0 10px}
  .meta{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--mono);font-size:11.5px;letter-spacing:0.06em;color:var(--vapour-dim);margin:0 0 4px}
  .meta b{color:var(--liquid);font-weight:700}

  .stem{margin:26px 0 0}
  .stem__head{font-family:var(--mono);font-size:11.5px;letter-spacing:0.1em;text-transform:uppercase;color:var(--liquid);margin:0 0 4px}
  .stem__voice{font-family:var(--body);font-style:italic;color:var(--vapour-dim);font-size:0.95rem;margin:0 0 12px}

  .fcard{background:linear-gradient(165deg,rgba(23,67,79,0.55) 0%,rgba(18,55,66,0.55) 100%);border:1px solid var(--line);border-radius:12px;padding:16px 18px 12px;margin:0 0 12px}
  .fcard__row{display:flex;gap:10px;align-items:baseline;margin:0 0 10px}
  .fcard__no{font-family:var(--mono);font-size:11px;color:var(--vapour-dim);flex:none}
  .fcard__text{font-weight:500;font-size:1.05rem;line-height:1.45;flex:1}
  .fcard__avg{font-family:var(--mono);font-size:12px;color:var(--solid);font-weight:700;flex:none;white-space:nowrap}
  .fcard.settled{opacity:0.92}
  .fcard.quiet .fcard__text{color:var(--vapour)}

  .marks{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:7px}
  .mrow{display:flex;gap:10px;align-items:baseline;font-size:0.92rem}
  .mwho{font-family:var(--mono);font-size:11px;color:var(--solid);flex:none;min-width:92px;text-align:right}
  .mverb{font-family:var(--mono);font-size:11px;font-weight:700;flex:none;border-radius:4px;padding:2px 7px}
  .mverb.rated{color:var(--abyss);background:var(--solid)}
  .mverb.up{color:var(--abyss);background:var(--liquid)}
  .mverb.down{color:var(--foam);background:rgba(130,160,168,0.35)}
  .mverb.reply{color:var(--abyss);background:var(--liquid)}
  .mverb.done{color:var(--abyss);background:var(--solid)}
  .mverb.doing{color:var(--solid);border:1px solid var(--solid);background:none}
  .mverb.drop{color:var(--vapour-dim);border:1px solid var(--line-strong);background:none}
  .mverb.tomorrow{color:var(--vapour-dim);border:1px solid var(--line);background:none}
  .mverb.note{color:var(--vapour-dim);border:1px solid var(--line);background:none}
  .mverb.proposed{color:var(--abyss);background:var(--liquid)}
  .mwhy{color:var(--vapour);flex:1;min-width:0}
  .mnone{font-family:var(--mono);font-size:11.5px;color:var(--vapour-dim);font-style:normal;padding-top:10px;border-top:1px solid var(--line)}

  .state{padding:60px 26px;text-align:center;max-width:460px;margin:0 auto}
  .state h2{font-family:var(--display);font-size:1.4rem;margin:0 0 10px}
  .state p{color:var(--vapour-dim)}

  .foot{max-width:640px;margin:0 auto;padding:26px 18px 44px;font-family:var(--mono);font-size:11px;letter-spacing:0.05em;color:var(--vapour-dim);display:flex;gap:16px;flex-wrap:wrap}
  .foot a{border-bottom:none;color:var(--vapour-dim)} .foot a:hover{color:var(--liquid)}
</style>
</head>
<body>
<script>document.documentElement.classList.remove('no-js');</script>

<div class="bar">
  <span class="dot"></span>
  <span>the fold · <b id="bar-field">—</b></span>
  <span class="spacer"></span>
  <button id="btn-refresh" title="re-read the field">↻</button>
</div>

<main class="wrap" id="main">
  <div class="head">
    <h1>The <span class="cool" id="h-field">field</span>, folded.</h1>
    <p class="voicing" id="h-voicing"></p>
    <p class="meta" id="h-meta"></p>
  </div>
  <div id="stems"></div>
</main>

<div id="state" class="state hidden">
  <h2 id="state-title"></h2>
  <p id="state-body"></p>
</div>

<div class="foot">
  <a id="link-flick">flick this field →</a>
  <a id="link-raw">the raw spine →</a>
  <a href="/decks">how decks work →</a>
  <span>public reads only — the fold is concatenation, not judgment</span>
</div>

<script>
(function(){
'use strict';
const BEACH = 'https://beach.happyseaurchin.com/.well-known/pscale-beach';
const FIELD = ((new URLSearchParams(location.search).get('field')
  || (location.pathname.match(/\/fold\/([^\/]+)\/?$/) || [])[1]
  || 'doing')).replace(/[^a-z0-9-]/gi,'');
const SPINE = 'spine:' + FIELD;

async function readBlock(name){
  const r = await fetch(BEACH + '?block=' + encodeURIComponent(name), { headers:{Accept:'application/json'}, cache:'no-store' });
  if (r.status === 404) return null;
  if (!r.ok) throw new Error('beach read failed: ' + r.status);
  return r.json();
}
async function readIndex(){
  const r = await fetch(BEACH, { headers:{Accept:'application/json'}, cache:'no-store' });
  if (!r.ok) throw new Error('beach index failed: ' + r.status);
  return r.json();
}
function floorOf(block){
  let n = 0, node = block;
  while (node && typeof node === 'object' && ('_' in node)) { node = node['_']; n += 1; }
  return n;
}
function voice(node){
  let n = node;
  while (n && typeof n === 'object') { if (!('_' in n)) return null; n = n['_']; }
  return typeof n === 'string' ? n : null;
}
function childDigits(node){
  if (!node || typeof node !== 'object') return [];
  return Object.keys(node).filter(k => /^[1-9]$/.test(k)).sort();
}
function nodeAt(block, digits){
  let n = block;
  for (const d of digits){ if (!n || typeof n !== 'object') return undefined; n = n[d]; }
  return n;
}
function textsOf(node, out, depth){
  out = out || []; depth = depth === undefined ? 2 : depth;
  if (node === undefined || node === null) return out;
  if (typeof node === 'string'){ if (node.trim()) out.push(node); return out; }
  if (typeof node === 'object'){
    const v = voice(node); if (v) out.push(v);
    if (depth > 0) for (const d of childDigits(node)) textsOf(node[d], out, depth - 1);
  }
  return out;
}
/* mark verbs — ways:deck branch 3 */
function verbOf(t){
  const s = t.trim();
  let m;
  if ((m = s.match(/^rated\s+(\d{1,2})/i))) return { verb:'rated', value:+m[1] };
  if (/^replied\b/i.test(s)) return { verb:'reply' };
  if (/^up\b/i.test(s)) return { verb:'up' };
  if (/^down\b/i.test(s)) return { verb:'down' };
  if (/^done\b/i.test(s)) return { verb:'done' };
  if (/^doing\b/i.test(s)) return { verb:'doing' };
  if (/^drop\b/i.test(s)) return { verb:'drop' };
  if (/^tomorrow\b/i.test(s)) return { verb:'tomorrow' };
  if (/^proposed\b/i.test(s)) return { verb:'proposed' };
  return { verb:'note' };
}
function whyOf(t){
  /* strip the leading verb + stamp up to the first em-dash separator */
  const i = t.indexOf('—');
  if (i >= 0) return t.slice(i+1).trim();
  const s = t.trim().replace(/^(rated\s+\d{1,2}|up|down|done|doing|drop|tomorrow\s+\S+|proposed)\s*/i,'');
  return s.replace(/^\d{4}-\d{2}-\d{2}T[\d:]+Z?\s*/,'').trim();
}
const esc = s => { const d = document.createElement('span'); d.textContent = s; return d.innerHTML; };
const $ = id => document.getElementById(id);

async function load(){
  $('bar-field').textContent = FIELD;
  $('h-field').textContent = FIELD;
  $('link-flick').href = '/next?field=' + encodeURIComponent(FIELD);
  $('link-raw').href = '/render?beach=beach.happyseaurchin.com&block=' + encodeURIComponent(SPINE);
  let spine, index;
  try {
    [spine, index] = await Promise.all([readBlock(SPINE), readIndex()]);
  } catch(e){
    $('main').classList.add('hidden');
    $('state-title').textContent = 'The beach is out of reach.';
    $('state-body').textContent = String(e.message || e);
    $('state').classList.remove('hidden');
    return;
  }
  if (!spine){
    $('main').classList.add('hidden');
    $('state-title').textContent = 'No such field.';
    $('state-body').textContent = SPINE + ' is not on the beach.';
    $('state').classList.remove('hidden');
    return;
  }
  $('main').classList.remove('hidden'); $('state').classList.add('hidden');
  const FLOOR = floorOf(spine) || 3;
  $('h-voicing').textContent = voice(spine) || '';

  const names = (index && index.blocks ? index.blocks : []).filter(b => b.startsWith(FIELD + ':'));
  const mirrors = {};
  await Promise.all(names.map(async n => {
    try { const b = await readBlock(n); if (b) mirrors[n.slice(FIELD.length + 1)] = b; } catch(e){}
  }));

  const stems = childDigits(spine).filter(d => d !== '9');
  let cardCount = 0, markCount = 0;
  const out = [];
  for (const s of stems){
    const stem = spine[s];
    out.push('<section class="stem"><p class="stem__head">field ' + s + '</p><p class="stem__voice">' + esc(voice(stem) || '') + '</p>');
    const leaves = childDigits(stem);
    const proposedLeaves = [];
    for (const who in mirrors){
      const mstem = mirrors[who][s];
      for (const l of childDigits(mstem)){
        if (leaves.includes(l)) continue;
        const t = (typeof mstem[l] === 'string' ? mstem[l] : voice(mstem[l])) || '';
        if (/^proposed\b/i.test(t.trim())) proposedLeaves.push({ l, who, text: whyOf(t) || t });
      }
    }
    for (const l of leaves){
      const leaf = stem[l];
      const text = typeof leaf === 'string' ? leaf : (voice(leaf) || '');
      if (!text) continue;
      cardCount++;
      const digits = [s, l];
      const rows = [];
      const ratings = [];
      let ups = 0, downs = 0, replies = 0, settled = false;
      for (const who of Object.keys(mirrors).sort()){
        const entry = nodeAt(mirrors[who], digits);
        for (const t of textsOf(entry)){
          const v = verbOf(t);
          if (v.verb === 'proposed') continue;
          markCount++;
          if (v.verb === 'rated') ratings.push(v.value);
          if (v.verb === 'up') ups++;
          if (v.verb === 'down') downs++;
          if (v.verb === 'reply') replies++;
          if (v.verb === 'done' || v.verb === 'drop') settled = true;
          const label = v.verb === 'rated' ? 'rated ' + v.value
            : v.verb === 'up' ? '👍 up' : v.verb === 'down' ? '👎 down'
            : v.verb === 'reply' ? '✎ replied'
            : v.verb;
          const why = whyOf(t);
          rows.push('<div class="mrow"><span class="mwho">' + esc(who) + '</span><span class="mverb ' + v.verb + '">' + esc(label) + '</span><span class="mwhy">' + esc(why) + '</span></div>');
        }
      }
      let agg = '';
      if (ratings.length){
        const avg = ratings.reduce((a,b)=>a+b,0) / ratings.length;
        agg = 'avg ' + (Math.round(avg * 10) / 10) + ' · ' + ratings.length + ' answered';
      } else if (ups || downs){
        agg = '👍 ' + ups + ' · 👎 ' + downs;
      } else if (replies){
        agg = replies + ' replied';
      }
      out.push('<div class="fcard' + (settled ? ' settled' : '') + (rows.length ? '' : ' quiet') + '">' +
        '<div class="fcard__row"><span class="fcard__no">' + s + '·' + l + '</span>' +
        '<span class="fcard__text">' + esc(text) + '</span>' +
        (agg ? '<span class="fcard__avg">' + esc(agg) + '</span>' : '') + '</div>' +
        (rows.length ? '<div class="marks">' + rows.join('') + '</div>' : '<p class="mnone">no marks yet — silence is honest absence</p>') +
        '</div>');
    }
    for (const p of proposedLeaves){
      out.push('<div class="fcard quiet"><div class="fcard__row"><span class="fcard__no">' + s + '·' + p.l + '</span>' +
        '<span class="fcard__text">' + esc(p.text) + '</span></div>' +
        '<div class="marks"><div class="mrow"><span class="mwho">' + esc(p.who) + '</span><span class="mverb proposed">proposed</span><span class="mwhy">not yet in the spine — the keeper adopts from the deck</span></div></div></div>');
    }
    out.push('</section>');
  }
  const op = [];
  const opNode = spine['9'];
  if (opNode) for (const t of textsOf(opNode, [], 1)){ const m = t.match(/^(mode|respond|disarm|access):\s*\S+/i); if (m) op.push(m[0].toLowerCase()); }
  $('h-meta').innerHTML = '<span><b>' + cardCount + '</b> cards</span><span><b>' + Object.keys(mirrors).length + '</b> mirrors</span><span><b>' + markCount + '</b> marks</span>' + (op.length ? '<span>' + esc(op.join(' · ')) + '</span>' : '');
  $('stems').innerHTML = out.join('');
}
$('btn-refresh').addEventListener('click', load);
load();
})();
</script>
</body>
</html>
